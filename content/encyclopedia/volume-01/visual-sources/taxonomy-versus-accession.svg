<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="t d"><title id="t">Taxonomic name versus material accession</title><desc id="d">The taxonomic name connects to an accepted authority while the material accession connects to physical samples and history.</desc><rect width="1000" height="710" fill="#fafcfe"/><text x="55" y="84" font-family="Arial" font-size="34" font-weight="bold" fill="#113650">Taxonomic name versus material accession</text><g font-family="Arial"><rect x="90" y="150" width="820" height="70" rx="12" fill="#e4eff8" stroke="#487387" stroke-width="2"/><text x="120" y="194" font-size="29" fill="#16374b">Taxon: Cannabis sativa L.</text><path d="M500 220v25" stroke="#49718a" stroke-width="5"/><path d="M489 235l11 10 11-10" stroke="#49718a" fill="none" stroke-width="4"/><rect x="90" y="245" width="820" height="70" rx="12" fill="#e8f3ee" stroke="#487387" stroke-width="2"/><text x="120" y="289" font-size="29" fill="#16374b">Authority + access date</text><path d="M500 315v25" stroke="#49718a" stroke-width="5"/><path d="M489 330l11 10 11-10" stroke="#49718a" fill="none" stroke-width="4"/><rect x="90" y="340" width="820" height="70" rx="12" fill="#e4eff8" stroke="#487387" stroke-width="2"/><text x="120" y="384" font-size="29" fill="#16374b">Accession ID: LOT-001</text><path d="M500 410v25" stroke="#49718a" stroke-width="5"/><path d="M489 425l11 10 11-10" stroke="#49718a" fill="none" stroke-width="4"/><rect x="90" y="435" width="820" height="70" rx="12" fill="#e8f3ee" stroke="#487387" stroke-width="2"/><text x="120" y="479" font-size="29" fill="#16374b">Source + claimed name</text><path d="M500 505v25" stroke="#49718a" stroke-width="5"/><path d="M489 520l11 10 11-10" stroke="#49718a" fill="none" stroke-width="4"/><rect x="90" y="530" width="820" height="70" rx="12" fill="#e4eff8" stroke="#487387" stroke-width="2"/><text x="120" y="574" font-size="29" fill="#16374b">Samples + custody records</text></g><text x="70" y="670" font-family="Arial" font-size="20" fill="#4d6778">Conceptual educational diagram • not experimental measurements</text></svg>