<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Cannabis life-cycle milestones are observations, not fixed weeks</title>
<desc id="desc">A conceptual timeline distinguishes seed germination, establishment, vegetative development, reproductive transition, flowering or seed development, and senescence. It is not to scale and uses no universal week numbers.</desc>
<rect width="1200" height="720" fill="#f8fafb"/>
<text x="65" y="72" font-family="Arial" font-size="35" fill="#153850" font-weight="bold">A biological life cycle, not a fixed calendar</text>
<text x="65" y="112" font-family="Arial" font-size="21" fill="#4a6679">Observe the actual stage. Timing varies with genetic material, environment and propagation method.</text>
<path d="M115 340H1100" stroke="#7d94a1" stroke-width="7" stroke-linecap="round"/>
<g font-family="Arial" font-size="19" fill="#17394e" text-anchor="middle">
<circle cx="130" cy="340" r="32" fill="#ddeeda" stroke="#47875e" stroke-width="4"/><text x="130" y="347" font-weight="bold">1</text>
<circle cx="315" cy="340" r="32" fill="#ddeeda" stroke="#47875e" stroke-width="4"/><text x="315" y="347" font-weight="bold">2</text>
<circle cx="500" cy="340" r="32" fill="#d8eaf8" stroke="#45769b" stroke-width="4"/><text x="500" y="347" font-weight="bold">3</text>
<circle cx="685" cy="340" r="32" fill="#e8e0f7" stroke="#8663b0" stroke-width="4"/><text x="685" y="347" font-weight="bold">4</text>
<circle cx="870" cy="340" r="32" fill="#f7e5cf" stroke="#b48044" stroke-width="4"/><text x="870" y="347" font-weight="bold">5</text>
<circle cx="1055" cy="340" r="32" fill="#e9e7df" stroke="#89806e" stroke-width="4"/><text x="1055" y="347" font-weight="bold">6</text>
<text x="130" y="245" font-weight="bold">Germination</text><text x="130" y="273">radicle appears</text>
<text x="315" y="425" font-weight="bold">Establishment</text><text x="315" y="452">true leaves, roots</text>
<text x="500" y="245" font-weight="bold">Vegetative</text><text x="500" y="273">nodes and branches</text>
<text x="685" y="425" font-weight="bold">Transition</text><text x="685" y="452">floral signs begin</text>
<text x="870" y="245" font-weight="bold">Reproduction</text><text x="870" y="273">flowers / seed set</text>
<text x="1055" y="425" font-weight="bold">Senescence</text><text x="1055" y="452">regulated decline</text>
</g>
<rect x="75" y="540" width="1050" height="110" rx="15" fill="#e8f1f3" stroke="#4c8292" stroke-width="2"/>
<text x="100" y="580" font-family="Arial" font-size="24" font-weight="bold" fill="#18394d">Record each milestone with a date and observed evidence.</text>
<text x="100" y="617" font-family="Arial" font-size="20" fill="#345669">Clones begin from donor tissues, not seed embryos. Pollination affects the reproductive path.</text>
</svg>