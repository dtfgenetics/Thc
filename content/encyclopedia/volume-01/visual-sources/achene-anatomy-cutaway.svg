<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="t d"><title id="t">Cannabis achene anatomy: conceptual cutaway</title><desc id="d">Nested boundaries identify fruit wall or pericarp, true seed coat, embryo cotyledons, and radicle. Illustration is schematic, not a histological specimen.</desc><rect width="1100" height="680" fill="#f7fafc"/><text x="55" y="70" font-size="36" font-family="Arial" font-weight="bold" fill="#17394a">What's inside a cannabis “seed”?</text><text x="55" y="111" font-size="22" font-family="Arial" fill="#476674">Botanically an achene (one-seeded, indehiscent fruit)</text>
