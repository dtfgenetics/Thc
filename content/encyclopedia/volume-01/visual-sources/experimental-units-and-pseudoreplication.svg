<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Experimental unit versus measurement sample</title><desc id="desc">Two experimental chambers each contain three plants. A single chamber per treatment yields only one independent chamber replicate per treatment; measuring many leaves does not increase chamber replication.</desc>
<rect width="1200" height="720" fill="#f7fafc"/><text x="60" y="78" font-family="Arial" font-size="38" font-weight="bold" fill="#16334b">What is the experimental unit?</text>
<text x="60" y="121" font-family="Arial" font-size="22" fill="#405e72">Example: lighting treatment assigned to whole chambers, not to individual leaves.</text>
<rect x="70" y="178" width="490" height="350" rx="22" fill="#e4f2ed" stroke="#26745d" stroke-width="5"/>
<rect x="640" y="178" width="490" height="350" rx="22" fill="#e6edf8" stroke="#426ea0" stroke-width="5"/>
<text x="115" y="240" font-family="Arial" font-size="27" font-weight="bold" fill="#165541">Chamber A — treatment 1</text>
<text x="685" y="240" font-family="Arial" font-size="27" font-weight="bold" fill="#245681">Chamber B — treatment 2</text>
<g stroke-width="8" stroke-linecap="round" fill="none">
<path d="M177 430v-112m0 44-32-23m32 13 35-28 M320 430v-112m0 44-32-23m32 13 35-28 M463 430v-112m0 44-32-23m32 13 35-28" stroke="#26745d"/>
<path d="M747 430v-112m0 44-32-23m32 13 35-28 M890 430v-112m0 44-32-23m32 13 35-28 M1033 430v-112m0 44-32-23m32 13 35-28" stroke="#426ea0"/>
</g>
<g fill="#4ba57f"><ellipse cx="153" cy="334" rx="25" ry="12" transform="rotate(-32 153 334)"/><ellipse cx="203" cy="329" rx="25" ry="12" transform="rotate(26 203 329)"/><ellipse cx="296" cy="334" rx="25" ry="12" transform="rotate(-32 296 334)"/><ellipse cx="346" cy="329" rx="25" ry="12" transform="rotate(26 346 329)"/><ellipse cx="439" cy="334" rx="25" ry="12" transform="rotate(-32 439 334)"/><ellipse cx="489" cy="329" rx="25" ry="12" transform="rotate(26 489 329)"/></g>
<g fill="#6595cd"><ellipse cx="723" cy="334" rx="25" ry="12" transform="rotate(-32 723 334)"/><ellipse cx="773" cy="329" rx="25" ry="12" transform="rotate(26 773 329)"/><ellipse cx="866" cy="334" rx="25" ry="12" transform="rotate(-32 866 334)"/><ellipse cx="916" cy="329" rx="25" ry="12" transform="rotate(26 916 329)"/><ellipse cx="1009" cy="334" rx="25" ry="12" transform="rotate(-32 1009 334)"/><ellipse cx="1059" cy="329" rx="25" ry="12" transform="rotate(26 1059 329)"/></g>
<text x="105" y="481" font-family="Arial" font-size="20" fill="#165541">3 plants; many measurable leaves</text>
<text x="675" y="481" font-family="Arial" font-size="20" fill="#245681">3 plants; many measurable leaves</text>
<rect x="70" y="558" width="1060" height="100" rx="15" fill="#fff4dc" stroke="#bc8b27" stroke-width="3"/>
<text x="100" y="598" font-family="Arial" font-size="24" font-weight="bold" fill="#654a16">Independent chamber replicates: 1 per treatment.</text>
<text x="100" y="636" font-family="Arial" font-size="21" fill="#654a16">Additional leaves and plants within a chamber do not independently replicate its treatment.</text>
</svg>