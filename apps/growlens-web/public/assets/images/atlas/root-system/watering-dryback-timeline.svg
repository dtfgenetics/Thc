<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Watering and Dryback Timeline</title><desc id="desc">Educational timeline showing a cannabis container moving from saturated to optimal moisture to dry stress, with oxygen, EC concentration, container weight, and leaf posture cues.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#16331f" flood-opacity="0.14"/></filter></defs><rect width="1400" height="900" fill="url(#bg)"/><text x="70" y="90" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#103626">Watering &amp; Dryback Timeline</text><text x="72" y="132" font-family="Arial, sans-serif" font-size="22" fill="#59695c">Use container weight, moisture, oxygen, EC trend, and leaf posture together — not a calendar alone.</text><line x1="150" y1="500" x2="1250" y2="500" stroke="#6b4528" stroke-width="10" stroke-linecap="round"/><circle cx="190" cy="500" r="26" fill="#2f7d43"/><circle cx="500" cy="500" r="26" fill="#c79b2c"/><circle cx="840" cy="500" r="26" fill="#2f7d43"/><circle cx="1190" cy="500" r="26" fill="#8a3a2a"/><g filter="url(#shadow)"><rect x="90" y="190" width="270" height="230" rx="24" fill="#fffdf8" stroke="#d8cdb8"/><rect x="400" y="190" width="270" height="230" rx="24" fill="#fffdf8" stroke="#d8cdb8"/><rect x="730" y="190" width="270" height="230" rx="24" fill="#fffdf8" stroke="#d8cdb8"/><rect x="1060" y="190" width="270" height="230" rx="24" fill="#fffdf8" stroke="#d8cdb8"/></g><text x="125" y="238" font-family="Arial" font-size="25" font-weight="800" fill="#103626">Saturated</text><text x="435" y="238" font-family="Arial" font-size="25" font-weight="800" fill="#103626">Draining</text><text x="765" y="238" font-family="Arial" font-size="25" font-weight="800" fill="#103626">Optimal Dryback</text><text x="1095" y="238" font-family="Arial" font-size="25" font-weight="800" fill="#103626">Too Dry</text><text x="125" y="285" font-family="Arial" font-size="18" fill="#59695c">Heavy pot</text><text x="125" y="317" font-family="Arial" font-size="18" fill="#59695c">Low air space risk</text><text x="125" y="349" font-family="Arial" font-size="18" fill="#59695c">Wilt can mimic hunger</text><text x="435" y="285" font-family="Arial" font-size="18" fill="#59695c">Water exits pores</text><text x="435" y="317" font-family="Arial" font-size="18" fill="#59695c">Oxygen returns</text><text x="435" y="349" font-family="Arial" font-size="18" fill="#59695c">EC begins shifting</text><text x="765" y="285" font-family="Arial" font-size="18" fill="#59695c">Good air-water balance</text><text x="765" y="317" font-family="Arial" font-size="18" fill="#59695c">Roots breathe well</text><text x="765" y="349" font-family="Arial" font-size="18" fill="#59695c">Steady uptake window</text><text x="1095" y="285" font-family="Arial" font-size="18" fill="#59695c">Light pot</text><text x="1095" y="317" font-family="Arial" font-size="18" fill="#59695c">Uptake interruption</text><text x="1095" y="349" font-family="Arial" font-size="18" fill="#59695c">EC concentration risk</text><g><path d="M160 690 C240 630, 330 640, 430 675 S620 730, 720 660 S930 610, 1040 670 S1180 730, 1260 660" fill="none" stroke="#2f7d43" stroke-width="8" stroke-linecap="round"/><text x="155" y="735" font-family="Arial" font-size="20" fill="#103626">Leaf posture and uptake change as the root zone moves through the dryback cycle.</text></g><g><rect x="85" y="790" width="1230" height="56" rx="16" fill="#fff7df" stroke="#c79b2c"/><text x="115" y="826" font-family="Arial" font-size="21" font-weight="700" fill="#4d3a11">Rule: good watering decisions pair container weight + moisture + VPD demand + plant response + pH/EC trend.</text></g></svg>