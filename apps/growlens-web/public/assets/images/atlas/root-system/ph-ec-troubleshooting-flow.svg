<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">pH and EC Troubleshooting Flow</title>
  <desc id="desc">Root-zone troubleshooting visual showing how to compare pH, EC, feed strength, runoff trend, moisture, root health, and nutrient uptake symptoms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#16331f" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="70" y="86" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#103626">pH &amp; EC Troubleshooting Flow</text>
  <text x="70" y="126" font-family="Arial, sans-serif" font-size="20" fill="#59695c">Use measurements together. A nutrient-looking symptom may be shortage, lockout, salt buildup, root stress, watering stress, or environment.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="330" height="170" rx="24" fill="#fffdf8" stroke="#d8cdb8"/>
    <text x="105" y="215" font-family="Arial" font-size="25" font-weight="800" fill="#3b2415">1. Start with symptom pattern</text>
    <text x="105" y="255" font-family="Arial" font-size="18" fill="#59695c">Old or new growth?</text>
    <text x="105" y="285" font-family="Arial" font-size="18" fill="#59695c">Uniform, interveinal, tip burn, spots?</text>
    <text x="105" y="315" font-family="Arial" font-size="18" fill="#59695c">Fast spread or slow trend?</text>

    <rect x="535" y="170" width="330" height="170" rx="24" fill="#fffdf8" stroke="#d8cdb8"/>
    <text x="570" y="215" font-family="Arial" font-size="25" font-weight="800" fill="#3b2415">2. Compare pH</text>
    <text x="570" y="255" font-family="Arial" font-size="18" fill="#59695c">Feed pH</text>
    <text x="570" y="285" font-family="Arial" font-size="18" fill="#59695c">Runoff or slurry trend</text>
    <text x="570" y="315" font-family="Arial" font-size="18" fill="#59695c">Media-specific useful range</text>

    <rect x="1000" y="170" width="330" height="170" rx="24" fill="#fffdf8" stroke="#d8cdb8"/>
    <text x="1035" y="215" font-family="Arial" font-size="25" font-weight="800" fill="#3b2415">3. Compare EC</text>
    <text x="1035" y="255" font-family="Arial" font-size="18" fill="#59695c">Feed strength</text>
    <text x="1035" y="285" font-family="Arial" font-size="18" fill="#59695c">Runoff / root-zone trend</text>
    <text x="1035" y="315" font-family="Arial" font-size="18" fill="#59695c">Buildup or depletion?</text>
  </g>

  <g stroke="#2f7d43" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M405 255 C455 255 485 255 525 255"/>
    <path d="M870 255 C920 255 950 255 990 255"/>
  </g>
  <g fill="#2f7d43"><path d="M525 255 l-18 -12 v24z"/><path d="M990 255 l-18 -12 v24z"/></g>

  <g filter="url(#shadow)">
    <rect x="185" y="420" width="460" height="190" rx="26" fill="#f4eadc" stroke="#cdb28e"/>
    <text x="225" y="468" font-family="Arial" font-size="26" font-weight="800" fill="#3b2415">If pH / EC are off</text>
    <text x="225" y="510" font-family="Arial" font-size="19" fill="#4d3a2b">• suspect lockout, buildup, or root-zone imbalance</text>
    <text x="225" y="542" font-family="Arial" font-size="19" fill="#4d3a2b">• correct the root-zone cause before adding more feed</text>
    <text x="225" y="574" font-family="Arial" font-size="19" fill="#4d3a2b">• re-check trend after the next irrigation cycle</text>

    <rect x="755" y="420" width="460" height="190" rx="26" fill="#eef7e8" stroke="#b7d0b8"/>
    <text x="795" y="468" font-family="Arial" font-size="26" font-weight="800" fill="#103626">If pH / EC are stable</text>
    <text x="795" y="510" font-family="Arial" font-size="19" fill="#334337">• inspect watering rhythm, oxygen, roots, and environment</text>
    <text x="795" y="542" font-family="Arial" font-size="19" fill="#334337">• compare symptoms to feed history and plant stage</text>
    <text x="795" y="574" font-family="Arial" font-size="19" fill="#334337">• avoid chasing one symptom without context</text>
  </g>

  <g stroke="#6b4528" stroke-width="8" fill="none" stroke-linecap="round"><path d="M700 345 C700 375 540 390 430 415"/><path d="M700 345 C700 375 860 390 970 415"/></g>

  <rect x="70" y="700" width="1260" height="110" rx="24" fill="#fff7df" stroke="#c79b2c"/>
  <text x="105" y="744" font-family="Arial" font-size="25" font-weight="800" fill="#4d3a11">Rule: pH and EC do not diagnose alone.</text>
  <text x="105" y="782" font-family="Arial" font-size="20" fill="#4d3a11">Pair symptom pattern + feed history + pH + EC + moisture + root oxygen + environment before deciding shortage vs lockout.</text>
</svg>
