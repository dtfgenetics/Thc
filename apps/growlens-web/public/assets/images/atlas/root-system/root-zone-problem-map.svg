<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Root-Zone Problem Diagnostic Map</title><desc id="desc">Diagnostic map showing common root-zone problem zones including saturation, compaction, low oxygen, salt buildup, root damage, cold roots, and media behavior.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#16331f" flood-opacity="0.14"/></filter><style>.title{font:800 48px system-ui,Segoe UI,sans-serif;fill:#103626}.sub{font:500 22px system-ui,Segoe UI,sans-serif;fill:#59695c}.label{font:800 25px system-ui,Segoe UI,sans-serif;fill:#103626}.small{font:600 17px system-ui,Segoe UI,sans-serif;fill:#59695c}.tiny{font:700 14px system-ui,Segoe UI,sans-serif;fill:#3b2415}.box{fill:#fffdf8;stroke:#d8cdb8;stroke-width:3;filter:url(#shadow)}.soil{fill:#f4eadc;stroke:#cdb28e}.green{fill:#eef7e8;stroke:#a8c7ad}.warn{fill:#fff7df;stroke:#c79b2c}.bad{fill:#f7e2d6;stroke:#b76a47}.root{fill:none;stroke:#f0dfc3;stroke-width:13;stroke-linecap:round}.root2{fill:none;stroke:#e3cda8;stroke-width:7;stroke-linecap:round}.line{fill:none;stroke:#2f7d43;stroke-width:4;stroke-dasharray:10 10}</style></defs><rect width="1400" height="900" fill="url(#bg)"/><text x="90" y="82" class="title">Root-Zone Problem Diagnostic Map</text><text x="92" y="120" class="sub">Use visible leaf symptoms as a clue, then check the hidden root-zone conditions that commonly cause them.</text><rect x="105" y="175" width="520" height="430" rx="34" class="box soil"/><text x="145" y="225" class="label">Root Zone Cross-Section</text><rect x="160" y="285" width="410" height="250" rx="22" fill="#6b4528" opacity=".22"/><path d="M365 270 C355 330 360 385 330 450 C310 495 285 520 250 555" class="root"/><path d="M365 335 C420 380 465 420 515 500" class="root"/><path d="M350 380 C310 400 285 428 260 465" class="root2"/><path d="M382 420 C425 440 455 468 482 505" class="root2"/><circle cx="220" cy="350" r="38" fill="#8ab7d6" opacity=".55"/><text x="178" y="355" class="tiny">saturation</text><rect x="425" y="318" width="110" height="44" rx="12" fill="#7d5c3c" opacity=".5"/><text x="438" y="346" class="tiny">compaction</text><path d="M210 505 H555" class="line"/><text x="230" y="490" class="tiny">salt / EC buildup zone</text><circle cx="455" cy="260" r="18" fill="#b76a47" opacity=".9"/><text x="480" y="266" class="tiny">damaged root tip</text><rect x="735" y="178" width="250" height="130" rx="24" class="box bad"/><text x="765" y="224" class="label">Too Wet</text><text x="765" y="260" class="small">low oxygen · droop</text><text x="765" y="286" class="tiny">often mistaken for thirst</text><rect x="1045" y="178" width="250" height="130" rx="24" class="box warn"/><text x="1075" y="224" class="label">Too Salty</text><text x="1075" y="260" class="small">high EC · tip burn</text><text x="1075" y="286" class="tiny">uptake gets harder</text><rect x="735" y="370" width="250" height="130" rx="24" class="box soil"/><text x="765" y="416" class="label">Too Dense</text><text x="765" y="452" class="small">compaction · slow roots</text><text x="765" y="478" class="tiny">poor dryback pattern</text><rect x="1045" y="370" width="250" height="130" rx="24" class="box green"/><text x="1075" y="416" class="label">Too Cold / Hot</text><text x="1075" y="452" class="small">uptake slows</text><text x="1075" y="478" class="tiny">symptoms mimic deficiency</text><rect x="735" y="562" width="560" height="130" rx="24" class="box"/><text x="765" y="608" class="label">Healthy Root-Zone Target</text><text x="765" y="644" class="small">balanced moisture, oxygen, pH, EC, temperature, drainage, and root vigor</text><text x="765" y="672" class="tiny">confirm with measurements before changing feed</text><rect x="100" y="735" width="1200" height="90" rx="24" fill="#103626"/><text x="140" y="790" style="font:700 24px system-ui,Segoe UI,sans-serif;fill:#fffdf8">Field rule: root-zone problems can look like nutrient deficiencies above ground. Verify moisture, oxygen, EC, pH, roots, and recent changes first.</text></svg>