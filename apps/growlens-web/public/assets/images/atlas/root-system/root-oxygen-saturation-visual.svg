<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Root Oxygen and Saturation Visual</title>
  <desc id="desc">Root-zone visual comparing oxygenated media, saturated media, compacted media, and drought stress with effects on root function and leaf symptoms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#16331f" flood-opacity="0.13"/></filter>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="70" y="86" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#103626">Root Oxygen &amp; Saturation</text>
  <text x="70" y="126" font-family="Arial, sans-serif" font-size="22" fill="#59695c">Oxygen, moisture, and pore space decide whether roots can breathe, absorb, and recover.</text>
  <g transform="translate(65,170)">
    <rect x="0" y="0" width="300" height="570" rx="28" fill="#fffdf8" stroke="#d8cdb8" filter="url(#shadow)"/>
    <text x="28" y="52" font-family="Arial" font-size="28" font-weight="800" fill="#2f7d43">Balanced</text>
    <text x="28" y="84" font-family="Arial" font-size="17" fill="#59695c">moist + oxygenated</text>
    <rect x="55" y="125" width="190" height="285" rx="26" fill="#f4eadc" stroke="#6b4528" stroke-width="5"/>
    <circle cx="105" cy="180" r="14" fill="#fffdf8" stroke="#2f7d43" stroke-width="4"/>
    <circle cx="165" cy="220" r="12" fill="#fffdf8" stroke="#2f7d43" stroke-width="4"/>
    <circle cx="207" cy="169" r="13" fill="#fffdf8" stroke="#2f7d43" stroke-width="4"/>
    <path d="M150 130 C140 200 158 255 144 330 C139 360 129 385 118 410" fill="none" stroke="#fffaf0" stroke-width="10" stroke-linecap="round"/>
    <path d="M150 176 C108 204 103 245 85 275 M149 232 C192 250 216 293 230 330 M142 310 C100 322 78 363 65 394" fill="none" stroke="#fffaf0" stroke-width="6" stroke-linecap="round"/>
    <text x="34" y="462" font-family="Arial" font-size="18" font-weight="700" fill="#103626">Root response</text>
    <text x="34" y="490" font-family="Arial" font-size="16" fill="#59695c">active white tips, steady uptake, normal posture</text>
  </g>
  <g transform="translate(385,170)">
    <rect x="0" y="0" width="300" height="570" rx="28" fill="#fffdf8" stroke="#d8cdb8" filter="url(#shadow)"/>
    <text x="28" y="52" font-family="Arial" font-size="28" font-weight="800" fill="#3b5f8a">Saturated</text>
    <text x="28" y="84" font-family="Arial" font-size="17" fill="#59695c">too wet / low oxygen</text>
    <rect x="55" y="125" width="190" height="285" rx="26" fill="#bcd6e8" stroke="#6b4528" stroke-width="5"/>
    <rect x="64" y="252" width="172" height="148" rx="18" fill="#75a8c8" opacity=".55"/>
    <path d="M150 130 C145 210 150 270 130 350 C123 379 113 397 98 414" fill="none" stroke="#f8f2e8" stroke-width="10" stroke-linecap="round"/>
    <path d="M145 220 C112 241 99 276 86 306 M137 298 C170 318 199 350 220 384" fill="none" stroke="#f8f2e8" stroke-width="6" stroke-linecap="round"/>
    <text x="34" y="462" font-family="Arial" font-size="18" font-weight="700" fill="#103626">Likely signs</text>
    <text x="34" y="490" font-family="Arial" font-size="16" fill="#59695c">droop, slow uptake, sour smell risk, yellowing</text>
  </g>
  <g transform="translate(705,170)">
    <rect x="0" y="0" width="300" height="570" rx="28" fill="#fffdf8" stroke="#d8cdb8" filter="url(#shadow)"/>
    <text x="28" y="52" font-family="Arial" font-size="28" font-weight="800" fill="#6b4528">Compacted</text>
    <text x="28" y="84" font-family="Arial" font-size="17" fill="#59695c">dense media / poor air</text>
    <rect x="55" y="125" width="190" height="285" rx="26" fill="#8b6239" stroke="#6b4528" stroke-width="5"/>
    <g fill="#5a3922" opacity=".65"><circle cx="103" cy="175" r="16"/><circle cx="151" cy="217" r="18"/><circle cx="205" cy="178" r="15"/><circle cx="112" cy="290" r="18"/><circle cx="198" cy="315" r="16"/><circle cx="151" cy="370" r="19"/></g>
    <path d="M150 130 C154 205 130 276 137 356 C140 383 122 402 105 416" fill="none" stroke="#f4eadc" stroke-width="8" stroke-linecap="round"/>
    <path d="M143 225 C121 235 110 257 103 283 M137 315 C160 330 171 360 187 386" fill="none" stroke="#f4eadc" stroke-width="5" stroke-linecap="round"/>
    <text x="34" y="462" font-family="Arial" font-size="18" font-weight="700" fill="#103626">Likely signs</text>
    <text x="34" y="490" font-family="Arial" font-size="16" fill="#59695c">uneven dryback, weak roots, channeling, stress</text>
  </g>
  <g transform="translate(1025,170)">
    <rect x="0" y="0" width="300" height="570" rx="28" fill="#fffdf8" stroke="#d8cdb8" filter="url(#shadow)"/>
    <text x="28" y="52" font-family="Arial" font-size="28" font-weight="800" fill="#a05b2d">Too Dry</text>
    <text x="28" y="84" font-family="Arial" font-size="17" fill="#59695c">drought / high EC risk</text>
    <rect x="55" y="125" width="190" height="285" rx="26" fill="#e9d6bc" stroke="#6b4528" stroke-width="5"/>
    <path d="M85 180 L118 205 M190 158 L215 191 M108 335 L146 358 M178 296 L225 326" stroke="#b07a46" stroke-width="5" stroke-linecap="round"/>
    <path d="M150 130 C130 205 151 274 125 352 C115 382 104 402 83 418" fill="none" stroke="#fffaf0" stroke-width="7" stroke-linecap="round"/>
    <path d="M142 230 C108 242 97 276 81 304 M130 320 C160 339 173 371 195 398" fill="none" stroke="#fffaf0" stroke-width="4" stroke-linecap="round"/>
    <text x="34" y="462" font-family="Arial" font-size="18" font-weight="700" fill="#103626">Likely signs</text>
    <text x="34" y="490" font-family="Arial" font-size="16" fill="#59695c">wilt, crisp edges, concentrated EC, stalled uptake</text>
  </g>
  <g transform="translate(170,790)">
    <rect width="1060" height="58" rx="29" fill="#eef7e8" stroke="#cdddcf"/>
    <text x="34" y="37" font-family="Arial" font-size="19" font-weight="700" fill="#103626">Diagnostic rule: match leaf posture + container weight + moisture + EC/pH before changing feed.</text>
  </g>
</svg>
