name: Seed Man World 5 Live Verification

# ARCHIVED: retired 15-level / Genetic Frontier production verifier.
# Historical snapshot only. Do not restore to .github/workflows.

on:
  workflow_run:
    workflows: ['Publish Seed Man Production']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-man-world-five-live
  cancel-in-progress: true

jobs:
  live-genetic-frontier:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify retired World 5 assets and production fingerprints
        shell: bash
        run: |
          set -euo pipefail
          base='https://dtfseeds.com/games/seed-man-platformer/'
          for asset in index.html world-five-v1.js data/campaign.json data/levels-12-15.json combat-browser-v1.js; do
            body="$RUNNER_TEMP/$(echo "$asset" | tr '/' '_')"
            curl -4 --fail --silent --show-error --location --connect-timeout 10 --max-time 45 "${base}${asset}" -o "$body"
            test -s "$body"
          done
          grep -Fq 'Genome Hydra' "$RUNNER_TEMP/world-five-v1.js"
          grep -Fq '"levelCount": 15' "$RUNNER_TEMP/data_campaign.json"
          grep -Fq 'Genome Spire' "$RUNNER_TEMP/data_levels-12-15.json"
