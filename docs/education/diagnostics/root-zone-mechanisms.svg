<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Root-zone stress: identical leaf symptoms can have different underlying causes</title>
<desc id="desc">Educational comparison showing high soluble salts, high-pH nutrient availability, and excess moisture as distinct possible root-zone problems. All can contribute to yellowing or leaf injury, so individual leaf photographs are not diagnostic.</desc>
<rect width="1200" height="740" fill="#f7f9f5"/>
<g font-family="Arial,sans-serif" fill="#123927">
<text x="52" y="65" font-size="33" font-weight="bold">Similar leaves. Different root-zone mechanisms.</text>
<text x="52" y="101" font-size="19">Illustrative science diagram · not a photograph or proof of this plant's diagnosis</text>
</g>
<g stroke="#aabdb2" stroke-width="2">
<rect x="40" y="149" width="355" height="416" rx="18" fill="#fff"/>
<rect x="422" y="149" width="355" height="416" rx="18" fill="#fff"/>
<rect x="804" y="149" width="355" height="416" rx="18" fill="#fff"/>
</g>
<g font-family="Arial,sans-serif" fill="#123927">
<text x="62" y="196" font-size="25" font-weight="bold">1. Elevated salts / EC</text>
<text x="444" y="196" font-size="25" font-weight="bold">2. Elevated soil pH</text>
<text x="826" y="196" font-size="25" font-weight="bold">3. Low root aeration</text>
</g>
<g stroke="#225a36" stroke-width="6" fill="none" stroke-linecap="round">
<path d="M217 296 v80 m0 -70 c-37 -18 -60 -48 -69 -65 m69 79 c37 -24 59 -48 69 -79"/>
<path d="M600 296 v80 m0 -70 c-37 -18 -60 -48 -69 -65 m69 79 c37 -24 59 -48 69 -79"/>
<path d="M982 296 v80 m0 -70 c-37 -18 -60 -48 -69 -65 m69 79 c37 -24 59 -48 69 -79"/>
</g>
<g fill="#85a65a" stroke="#476d31" stroke-width="2">
<ellipse cx="142" cy="247" rx="48" ry="19" transform="rotate(30 142 247)"/>
<ellipse cx="289" cy="247" rx="48" ry="19" transform="rotate(-30 289 247)"/>
<ellipse cx="525" cy="247" rx="48" ry="19" transform="rotate(30 525 247)"/>
<ellipse cx="671" cy="247" rx="48" ry="19" transform="rotate(-30 671 247)"/>
<ellipse cx="906" cy="247" rx="48" ry="19" transform="rotate(30 906 247)"/>
<ellipse cx="1053" cy="247" rx="48" ry="19" transform="rotate(-30 1053 247)"/>
</g>
<g stroke="#aa8b5c" stroke-width="3" fill="none" stroke-linecap="round">
<path d="M217 376 l-36 43 m36 -43 l35 43 m-35 -27 l-10 53 m10 -53 l31 49"/>
<path d="M600 376 l-36 43 m36 -43 l35 43 m-35 -27 l-10 53 m10 -53 l31 49"/>
<path d="M982 376 l-36 43 m36 -43 l35 43 m-35 -27 l-10 53 m10 -53 l31 49"/>
</g>
<g font-family="Arial,sans-serif" font-size="17" fill="#243d30">
<text x="62" y="481">Osmotic stress can constrain</text><text x="62" y="506">water uptake and injure tissue.</text>
<text x="444" y="481">Changes availability of some</text><text x="444" y="506">elements; not universal lockout.</text>
<text x="826" y="481">Persistent saturation can</text><text x="826" y="506">restrict root oxygen supply.</text>
</g>
<rect x="40" y="596" width="1119" height="108" rx="17" fill="#e6efe7" stroke="#b2c9b7"/>
<g font-family="Arial,sans-serif" fill="#123927">
<text x="62" y="633" font-size="23" font-weight="bold">Differentiate with comparable measurements</text>
<text x="62" y="664" font-size="19">Soil-extract EC + calibrated soil pH + moisture / drainage + nutrient records + repeat photographs</text>
<text x="62" y="689" font-size="15">EC is total conductivity, not an elemental assay. A single runoff sample cannot identify a mechanism.</text>
</g></svg>