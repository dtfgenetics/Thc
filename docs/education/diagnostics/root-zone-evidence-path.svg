<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Evidence before diagnosis: flowering soil-container symptoms</title><desc id="desc">Flow chart showing observed yellowing and brown margins, competing root-zone hypotheses, measurements, and evidence-based reassessment.</desc><rect width="960" height="520" fill="#f7f8f4"/><g font-family="Arial,sans-serif" fill="#163927"><text x="42" y="55" font-size="30" font-weight="bold">Root-zone diagnostic evidence path</text><text x="42" y="85" font-size="17">Symptoms do not identify a single cause.</text></g><g stroke="#94a99b" stroke-width="2"><rect x="40" y="125" width="260" height="125" rx="15" fill="#fff"/><rect x="352" y="125" width="260" height="125" rx="15" fill="#fff"/><rect x="664" y="125" width="256" height="125" rx="15" fill="#fff"/><rect x="190" y="335" width="580" height="125" rx="15" fill="#e7f0e8"/></g><g font-family="Arial,sans-serif" fill="#163927"><text x="62" y="160" font-size="21" font-weight="bold">Observe</text><text x="62" y="191" font-size="17">Yellowing and</text><text x="62" y="214" font-size="17">brown margins</text><text x="374" y="160" font-size="21" font-weight="bold">Compare</text><text x="374" y="191" font-size="17">Salts / pH / wet roots</text><text x="374" y="214" font-size="17">/ true deficiency</text><text x="686" y="160" font-size="21" font-weight="bold">Measure</text><text x="686" y="191" font-size="17">Soil pH, EC, moisture,</text><text x="686" y="214" font-size="17">feed records, roots</text><text x="214" y="373" font-size="23" font-weight="bold">Reassess with repeated, comparable evidence</text><text x="214" y="412" font-size="17">Do not treat one reading or symptom change as proof.</text></g><g stroke="#287747" stroke-width="4" fill="none" stroke-linecap="round"><path d="M306 188h38m-11 -10 11 10 -11 10"/><path d="M618 188h38m-11 -10 11 10 -11 10"/><path d="M792 255v34H480v38m-10 -11 10 11 10 -11"/></g></svg>