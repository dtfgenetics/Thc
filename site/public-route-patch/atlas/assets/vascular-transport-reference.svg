<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Stem vascular transport: xylem and phloem</title><desc id="desc">Conceptual cross-system diagram showing upward water and mineral movement through xylem from roots to leaves, and sugar transport through phloem between source leaves and sinks. Phloem transport direction depends on source-sink relationships.</desc><rect width="960" height="560" rx="24" fill="#101b25"/><text x="48" y="63" font-family="sans-serif" fill="#fff" font-weight="bold" font-size="28">Stem vascular transport</text><text x="48" y="94" font-family="sans-serif" fill="#bed4de" font-size="17">Simplified physiological pathways — not to scale</text><rect x="52" y="139" width="404" height="338" rx="20" fill="#183544" stroke="#77c2d9" stroke-width="2"/><rect x="504" y="139" width="404" height="338" rx="20" fill="#303043" stroke="#e3b86f" stroke-width="2"/><text x="80" y="186" fill="#9ee6f5" font-family="sans-serif" font-weight="bold" font-size="26">XYLEM</text><text x="532" y="186" fill="#f9d991" font-family="sans-serif" font-weight="bold" font-size="26">PHLOEM</text><path d="M136 380 V228 M125 244 L136 222 L147 244" stroke="#7dd6f3" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="193" y="248" fill="#fff" font-family="sans-serif" font-size="19">Water + dissolved minerals</text><text x="193" y="286" fill="#d9e8ec" font-family="sans-serif" font-size="17">Predominantly upward</text><text x="193" y="325" fill="#d9e8ec" font-family="sans-serif" font-size="17">Driven by water potential</text><text x="193" y="355" fill="#d9e8ec" font-family="sans-serif" font-size="17">and transpiration</text><text x="80" y="432" fill="#9ee6f5" font-family="sans-serif" font-size="17">Roots → stem → leaves</text><path d="M590 242 V368 M579 351 L590 375 L601 351 M634 368 V242 M623 259 L634 235 L645 259" stroke="#f1c16b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="688" y="250" fill="#fff" font-family="sans-serif" font-size="19">Sugars + solutes</text><text x="688" y="291" fill="#e7e1d8" font-family="sans-serif" font-size="17">Source → sink</text><text x="688" y="331" fill="#e7e1d8" font-family="sans-serif" font-size="17">Direction varies</text><text x="688" y="363" fill="#e7e1d8" font-family="sans-serif" font-size="17">by sieve-tube pathway</text><text x="532" y="430" fill="#f9d991" font-family="sans-serif" font-size="17">Leaves ↔ growing / storage organs</text><text x="54" y="519" fill="#cbd5dd" font-family="sans-serif" font-size="16">Teaching Healthy Cultivation · conceptual educational illustration</text></svg>