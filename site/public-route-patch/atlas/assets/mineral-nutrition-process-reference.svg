<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">Mineral nutrition and ion transport</title><desc id="desc">Conceptual sequence; availability is not the same as uptake. Four stages: Root-zone solution: Dissolved ionic species; pH and chemistry affect availability; Root uptake: Membrane transporters and electrochemical gradients; Xylem transport: Movement with water toward transpiring tissues; Cellular use: Enzymes, osmotic regulation, structure and metabolism.</desc><rect width="960" height="530" rx="24" fill="#101d28"/><text x="48" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#fff">Mineral nutrition and ion transport</text><text x="48" y="94" font-family="sans-serif" font-size="17" fill="#c7e2e4">Conceptual sequence; availability is not the same as uptake</text><rect x="48" y="168" width="204" height="234" rx="17" fill="#183a40" stroke="#7fbeac"/><circle cx="78" cy="200" r="16" fill="#d6b56c"/><text x="78" y="206" font-size="16" font-weight="bold" fill="#172027" text-anchor="middle">1</text><text x="62" y="252" font-size="18" fill="#fff" font-weight="bold">Root-zone solution</text><foreignObject x="62" y="274" width="177" height="108"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#d7e7e8;font:16px/1.5 sans-serif">Dissolved ionic species; pH and chemistry affect availability</div></foreignObject><path d="M254 285 h16 m-6 -7 l7 7 -7 7" stroke="#d6b56c" stroke-width="3" fill="none"/><rect x="273" y="168" width="204" height="234" rx="17" fill="#273345" stroke="#7fbeac"/><circle cx="303" cy="200" r="16" fill="#d6b56c"/><text x="303" y="206" font-size="16" font-weight="bold" fill="#172027" text-anchor="middle">2</text><text x="287" y="252" font-size="18" fill="#fff" font-weight="bold">Root uptake</text><foreignObject x="287" y="274" width="177" height="108"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#d7e7e8;font:16px/1.5 sans-serif">Membrane transporters and electrochemical gradients</div></foreignObject><path d="M479 285 h16 m-6 -7 l7 7 -7 7" stroke="#d6b56c" stroke-width="3" fill="none"/><rect x="498" y="168" width="204" height="234" rx="17" fill="#183a40" stroke="#7fbeac"/><circle cx="528" cy="200" r="16" fill="#d6b56c"/><text x="528" y="206" font-size="16" font-weight="bold" fill="#172027" text-anchor="middle">3</text><text x="512" y="252" font-size="18" fill="#fff" font-weight="bold">Xylem transport</text><foreignObject x="512" y="274" width="177" height="108"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#d7e7e8;font:16px/1.5 sans-serif">Movement with water toward transpiring tissues</div></foreignObject><path d="M704 285 h16 m-6 -7 l7 7 -7 7" stroke="#d6b56c" stroke-width="3" fill="none"/><rect x="723" y="168" width="204" height="234" rx="17" fill="#273345" stroke="#7fbeac"/><circle cx="753" cy="200" r="16" fill="#d6b56c"/><text x="753" y="206" font-size="16" font-weight="bold" fill="#172027" text-anchor="middle">4</text><text x="737" y="252" font-size="18" fill="#fff" font-weight="bold">Cellular use</text><foreignObject x="737" y="274" width="177" height="108"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#d7e7e8;font:16px/1.5 sans-serif">Enzymes, osmotic regulation, structure and metabolism</div></foreignObject><text x="48" y="446" font-family="sans-serif" font-size="17" fill="#f7d79e">Some elements move in phloem more readily than others; leaf symptoms alone do not prove deficiency.</text><text x="48" y="497" font-family="sans-serif" font-size="15" fill="#bed1d7">Teaching Healthy Cultivation · educational conceptual diagram · not to scale</text></svg>