<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Deficiency vs Lockout Comparison</title>
  <desc id="desc">Comparison visual for separating true nutrient deficiency from nutrient lockout, EC buildup, pH drift, root stress, and environmental uptake limits.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#16331f" flood-opacity="0.13"/></filter></defs>
  <rect width="1400" height="900" fill="url(#bg)"/><text x="70" y="82" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#103626">Deficiency vs Lockout</text><text x="70" y="122" font-family="Arial, sans-serif" font-size="20" fill="#59695c">A visual triage card for separating shortage from uptake restriction.</text>
  <g filter="url(#shadow)"><rect x="70" y="170" width="595" height="575" rx="28" fill="#ffffff" stroke="#d8cdb8"/><rect x="735" y="170" width="595" height="575" rx="28" fill="#ffffff" stroke="#d8cdb8"/></g>
  <text x="115" y="230" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#2f7d43">True Deficiency Clues</text><text x="780" y="230" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#6b4528">Lockout / Uptake-Limit Clues</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#16331f"><text x="120" y="295">• Feed supply is actually low for stage</text><text x="120" y="350">• Pattern fits mobile or immobile behavior</text><text x="120" y="405">• pH and EC are not showing major blockers</text><text x="120" y="460">• Root zone is healthy, oxygenated, active</text><text x="120" y="515">• Symptoms improve after measured correction</text><text x="785" y="295">• Nutrients are present but unavailable</text><text x="785" y="350">• pH range, EC buildup, or salts interfere</text><text x="785" y="405">• Saturated, cold, compacted, or damaged roots</text><text x="785" y="460">• Multiple nutrient-looking issues at once</text><text x="785" y="515">• More feeding worsens the symptom pattern</text></g>
  <rect x="150" y="585" width="410" height="90" rx="22" fill="#eef7e8" stroke="#b7d0b8"/><text x="190" y="625" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#103626">Check supply first</text><text x="190" y="655" font-family="Arial, sans-serif" font-size="18" fill="#59695c">Feed history + stage demand</text><rect x="840" y="585" width="410" height="90" rx="22" fill="#f4eadc" stroke="#cdb28e"/><text x="880" y="625" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#3b2415">Check access first</text><text x="880" y="655" font-family="Arial, sans-serif" font-size="18" fill="#59695c">pH + EC + roots + moisture</text>
  <line x1="665" y1="457" x2="735" y2="457" stroke="#c79b2c" stroke-width="5" stroke-linecap="round"/><circle cx="700" cy="457" r="42" fill="#fff7df" stroke="#c79b2c" stroke-width="4"/><text x="676" y="450" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#4a3510">VERIFY</text><text x="677" y="473" font-family="Arial, sans-serif" font-size="16" fill="#4a3510">BEFORE</text>
  <rect x="70" y="775" width="1260" height="70" rx="24" fill="#fff7df" stroke="#c79b2c"/><text x="105" y="818" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#4a3510">Rule: visual symptoms alone cannot prove deficiency. Confirm pH, EC, moisture, roots, environment, and feed history.</text>
</svg>
