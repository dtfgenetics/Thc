<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Chlorosis pattern observation guide</title><desc id="desc">Compare older and newer leaf yellowing, then record pattern and environmental measurements. Patterns guide investigation, not a diagnosis.</desc><rect width="960" height="420" rx="24" fill="#f5f9f4"/><text x="42" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#173d2b">Chlorosis: observe before treating</text><text x="42" y="91" font-family="Arial,sans-serif" font-size="17" fill="#315442">Yellowing is a symptom, not proof of a specific deficiency.</text><g font-family="Arial,sans-serif"><rect x="42" y="120" width="420" height="205" rx="16" fill="#fff" stroke="#bed2bf"/><text x="65" y="160" font-size="23" font-weight="700" fill="#17432c">Older leaves first</text><text x="65" y="196" font-size="18" fill="#315442">Check mobile nutrient patterns,</text><text x="65" y="224" font-size="18" fill="#315442">root function and normal aging.</text><text x="65" y="277" font-size="16" fill="#315442">Record: uniform / interveinal / edge</text><rect x="498" y="120" width="420" height="205" rx="16" fill="#fff" stroke="#bed2bf"/><text x="521" y="160" font-size="23" font-weight="700" fill="#17432c">New growth first</text><text x="521" y="196" font-size="18" fill="#315442">Check micronutrient availability,</text><text x="521" y="224" font-size="18" fill="#315442">root conditions and pH.</text><text x="521" y="277" font-size="16" fill="#315442">Record: pattern / spread / timing</text><text x="42" y="370" font-size="18" font-weight="700" fill="#17432c">Verify pH, EC, moisture, roots, pests and recent changes before adjusting feed.</text><text x="42" y="398" font-size="14" fill="#476652">THC · Teaching Healthy Cultivation · Educational observation aid</text></g></svg>