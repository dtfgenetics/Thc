<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">PAR and ePAR wavelength counting intervals</title><desc id="desc">A horizontal wavelength axis from 350 to 800 nanometres with conventional PAR highlighted from 400 to 700 and ePAR from 400 to 750. The added 700 to 750 nanometre segment is labeled far-red.</desc><rect width="1200" height="720" fill="#f8fafc"/><text x="60" y="78" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#20394e">What does the photon meter count?</text><text x="60" y="115" font-family="Arial,sans-serif" font-size="21" fill="#4a6274">Wavelength boundaries, not an actual lamp spectrum</text><line x1="100" y1="540" x2="1100" y2="540" stroke="#415b6b" stroke-width="4"/><g font-family="Arial,sans-serif" font-size="21" fill="#334f62" text-anchor="middle"><text x="100" y="581">350</text><text x="211" y="581">400</text><text x="878" y="581">700</text><text x="989" y="581">750</text><text x="1100" y="581">800</text></g><g stroke="#6e8797" stroke-width="3"><path d="M100 527V552 M211 527V552 M878 527V552 M989 527V552 M1100 527V552"/></g><text x="600" y="636" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#28495f">Wavelength (nm)</text><rect x="211" y="205" width="667" height="110" rx="8" fill="#3d88b8"/><text x="544" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="white">PAR / PPFD</text><text x="544" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="white">400–700 nm</text><rect x="211" y="350" width="778" height="110" rx="8" fill="#2d936d"/><rect x="878" y="350" width="111" height="110" fill="#8562aa"/><text x="544" y="394" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="white">ePAR / ePPFD</text><text x="544" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="white">400–750 nm</text><path d="M934 350 V310" stroke="#795399" stroke-width="3"/><text x="933" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#65418a">Far-red</text><text x="933" y="317" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#65418a">700–750</text><text x="60" y="680" font-family="Arial,sans-serif" font-size="16" fill="#53697a">Original THC diagram · CC BY 4.0 · Conceptual basis: Zhen &amp; Bugbee (2020), Plant, Cell &amp; Environment</text></svg>