<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Root-zone oxygen pathways: drained versus saturated substrate</title><desc id="desc">Two conceptual container cross-sections. Left, connected air pores allow oxygen diffusion toward roots. Right, water-filled pores slow oxygen delivery despite abundant water. Arrows indicate direction only; not measured rates.</desc><rect width="1200" height="720" fill="#f6f8f6"/><text x="600" y="65" font-family="Arial,sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#193c34">Root-zone oxygen transport</text><text x="600" y="105" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#38574c">Conceptual comparison · not to scale</text><g font-family="Arial,sans-serif"><rect x="70" y="150" width="495" height="445" rx="20" fill="#e2f1e3" stroke="#416a53" stroke-width="4"/><rect x="635" y="150" width="495" height="445" rx="20" fill="#e0edf8" stroke="#416d93" stroke-width="4"/><text x="318" y="195" font-size="28" font-weight="bold" text-anchor="middle" fill="#234a37">Drained substrate</text><text x="882" y="195" font-size="28" font-weight="bold" text-anchor="middle" fill="#254b69">Saturated substrate</text><g fill="#967d60"><circle cx="160" cy="330" r="35"/><circle cx="280" cy="300" r="45"/><circle cx="430" cy="350" r="39"/><circle cx="220" cy="480" r="43"/><circle cx="380" cy="505" r="48"/><circle cx="720" cy="330" r="35"/><circle cx="845" cy="300" r="45"/><circle cx="1000" cy="350" r="39"/><circle cx="785" cy="480" r="43"/><circle cx="950" cy="505" r="48"/></g><path d="M318 235 V395 L280 440 M318 395 L380 450 M318 340 L240 365" fill="none" stroke="#c9a16d" stroke-width="13" stroke-linecap="round"/><path d="M882 235 V395 L845 440 M882 395 L945 450 M882 340 L805 365" fill="none" stroke="#c9a16d" stroke-width="13" stroke-linecap="round"/><g stroke="#27865d" stroke-width="8" fill="none" stroke-linecap="round"><path d="M130 245 V305 M125 292 L130 307 L135 292"/><path d="M465 245 V295 M460 283 L465 298 L470 283"/><path d="M365 255 V305 M360 293 L365 308 L370 293"/></g><g stroke="#2777b2" stroke-width="5" fill="none" stroke-dasharray="10 10" stroke-linecap="round"><path d="M700 250 V280 M1010 250 V280"/></g><text x="318" y="565" text-anchor="middle" font-size="22" fill="#20583c">Connected air-filled pores</text><text x="882" y="565" text-anchor="middle" font-size="22" fill="#205078">Water-filled pores</text><text x="318" y="625" text-anchor="middle" font-size="19" fill="#20583c">O₂ moves through pore air</text><text x="882" y="625" text-anchor="middle" font-size="19" fill="#205078">O₂ delivery is diffusion-limited</text><text x="75" y="680" font-size="16" fill="#4c5a56">THC — Teaching Healthy Cultivation · Original schematic · CC BY 4.0</text><text x="1125" y="680" font-size="16" text-anchor="end" fill="#4c5a56">Based on Drew (1997)</text></g></svg>