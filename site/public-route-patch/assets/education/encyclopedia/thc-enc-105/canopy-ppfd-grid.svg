<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Repeatable canopy PPFD measurement grid</title><desc id="desc">Top-down four by three grid with twelve numbered sampling points; separate side view shows a horizontal sensor at canopy-top plane. No measured values are shown.</desc><rect width="1200" height="720" fill="#f6faf8"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#164b3e">Mapping canopy light: repeatable sampling geometry</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="20" fill="#426d60">Example 4 × 3 grid · no measured PPFD values</text><rect x="70" y="195" width="535" height="315" rx="16" fill="#e2f2e9" stroke="#3d9576" stroke-width="4"/><circle cx="135" cy="250" r="22" fill="#fff" stroke="#176b57" stroke-width="4"/><text x="135" y="257" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#176b57">1</text><circle cx="270" cy="250" r="22" fill="#fff" stroke="#176b57" stroke-width="4"/><text x="270" y="257" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#176b57">2</text><circle cx="405" cy="250" r="22" fill="#fff" stroke="#176b57" stroke-width="4"/><text x="405" y="257" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#176b57">3</text><circle cx="540" cy="250" r="22" fill="#fff" stroke="#176b57" stroke-width="4"/><text x="540" y="257" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#176b57">4</text><circle cx="135" cy="355" r="22" fill="#fff" stroke="#176b57" stroke-width="4"/><text x="135" y="362" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#176b57">5</text><circle cx="270" cy="355" r="22" fill="#fff" stroke="#176b57" stroke-width="4"/><text x="270" y="362" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#176b57">6</text><circle cx="405" cy="355" r="22" fill="#fff" stroke="#176b57" stroke-width="4"/><text x="405" y="362" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#176b57">7</text><circle cx="540" cy="355" r="22" fill="#fff" stroke="#176b57" stroke-width="4"/><text x="540" y="362" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#176b57">8</text><circle cx="135" cy="460" r="22" fill="#fff" stroke="#176b57" stroke-width="4"/><text x="135" y="467" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#176b57">9</text><circle cx="270" cy="460" r="22" fill="#fff" stroke="#176b57" stroke-width="4"/><text x="270" y="467" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#176b57">10</text><circle cx="405" cy="460" r="22" fill="#fff" stroke="#176b57" stroke-width="4"/><text x="405" y="467" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#176b57">11</text><circle cx="540" cy="460" r="22" fill="#fff" stroke="#176b57" stroke-width="4"/><text x="540" y="467" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#176b57">12</text><text x="340" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#245c4a">Top view · fixed sampling positions</text><rect x="675" y="195" width="470" height="315" rx="16" fill="#e8f1f8" stroke="#7aa6bf" stroke-width="3"/><rect x="735" y="310" width="350" height="50" rx="9" fill="#82b48a"/><path d="M735 360 Q790 335 850 365 T965 365 T1085 360" fill="none" stroke="#317f4e" stroke-width="6"/><rect x="875" y="277" width="65" height="15" rx="4" fill="#1e668a"/><path d="M907 292 V311" stroke="#1e668a" stroke-width="5"/><text x="910" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#285d79">Level sensor</text><text x="910" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#285d79">Document canopy-top plane</text><text x="910" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#285d79">Same height and orientation</text><text x="70" y="606" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#164b3e">Log: PPFD (µmol m⁻² s⁻¹), spectral band, time, fixture state, sensor calibration</text><text x="70" y="650" font-family="Arial,sans-serif" font-size="18" fill="#426d60">Do not infer uniformity from a single center point or mix PAR and ePAR readings.</text><text x="70" y="697" font-family="Arial,sans-serif" font-size="15" fill="#426d60">Original THC educational schematic · CC BY 4.0 · Method context: RII (2021), Apogee Instruments (2021)</text></svg>