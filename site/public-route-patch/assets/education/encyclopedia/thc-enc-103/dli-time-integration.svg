<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Daily light integral: integrating PPFD over time</title><desc id="d">Two conceptual charts show a constant PPFD rectangle and a varying PPFD curve. Shaded area represents daily photon dose. A constant 500 micromoles per square metre per second for 18 hours gives 32.4 moles per square metre per day.</desc><rect width="1200" height="720" fill="#f7faf9"/><text x="50" y="64" font-size="34" font-family="Arial,sans-serif" font-weight="bold" fill="#173d34">DLI = area under the photon-flux curve</text><text x="50" y="101" font-size="19" font-family="Arial,sans-serif" fill="#42695e">PPFD: µmol m⁻² s⁻¹  ·  DLI: mol m⁻² d⁻¹  ·  qualitative profiles except labeled arithmetic example</text><g font-family="Arial,sans-serif"><rect x="50" y="140" width="525" height="400" rx="15" fill="#edf5ef" stroke="#7fae91"/><rect x="625" y="140" width="525" height="400" rx="15" fill="#edf3fa" stroke="#87a6c8"/><text x="78" y="179" font-size="26" font-weight="bold" fill="#235c42">Constant PPFD</text><text x="653" y="179" font-size="26" font-weight="bold" fill="#315e87">Variable PPFD</text><path d="M115 215 V465 H525 M690 215 V465 H1100" fill="none" stroke="#425c57" stroke-width="3"/><rect x="115" y="286" width="365" height="179" fill="#72bb87" fill-opacity=".55"/><path d="M115 286 H480 V465" fill="none" stroke="#267349" stroke-width="5"/><path d="M690 465 L740 425 L795 325 L845 295 L900 360 L950 260 L1010 315 L1050 425 L1100 465 Z" fill="#81b4e4" fill-opacity=".55"/><path d="M690 465 L740 425 L795 325 L845 295 L900 360 L950 260 L1010 315 L1050 425 L1100 465" fill="none" stroke="#2d72aa" stroke-width="5"/><text x="126" y="270" font-size="19" fill="#235c42">500 µmol m⁻² s⁻¹</text><text x="140" y="367" font-size="21" font-weight="bold" fill="#174d34">Shaded area = DLI</text><text x="725" y="405" font-size="20" font-weight="bold" fill="#285b85">Sum interval areas</text><text x="270" y="505" text-anchor="middle" font-size="18" fill="#38584c">18 h illuminated</text><text x="900" y="505" text-anchor="middle" font-size="18" fill="#385a7b">Time (not to scale)</text><text x="270" y="527" text-anchor="middle" font-size="16" fill="#38584c">Time →</text><text x="900" y="527" text-anchor="middle" font-size="16" fill="#385a7b">Time →</text><text x="50" y="596" font-size="26" font-weight="bold" fill="#173d34">Constant: 500 × 18 × 0.0036 = 32.4 mol m⁻² d⁻¹</text><text x="50" y="632" font-size="22" fill="#244c40">Variable: DLI ≈ Σ(PPFDᵢ × Δtᵢ in seconds) / 1,000,000</text><text x="50" y="683" font-size="16" fill="#42695e">Original THC schematic · CC BY 4.0 · Reference: Rodriguez-Morrison et al. (2021), Frontiers in Plant Science</text></g></svg>