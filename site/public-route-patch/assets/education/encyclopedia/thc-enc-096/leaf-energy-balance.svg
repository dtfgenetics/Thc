<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Leaf energy balance and heat stress</title><desc id="desc">Conceptual diagram of a leaf receiving net radiation and exchanging sensible heat with air and latent heat through transpiration. Root water supply and stomata influence cooling. Arrow widths are not measured fluxes.</desc><rect width="1200" height="720" fill="#f7faf9"/><text x="50" y="65" font-size="34" font-weight="bold" fill="#173f38" font-family="Arial,sans-serif">Why leaf temperature differs from air temperature</text><text x="50" y="105" font-size="20" fill="#3d6258" font-family="Arial,sans-serif">Qualitative leaf energy balance · no universal heat-stress threshold</text><path d="M580 245 C380 310 390 535 590 565 C790 530 800 320 580 245Z" fill="#7cbf8d" stroke="#236d50" stroke-width="5"/><path d="M590 545 L590 280" stroke="#d9f2d4" stroke-width="8"/><path d="M175 190 L460 310" stroke="#d78a29" stroke-width="16"/><path d="M440 287 L470 315 L430 321" fill="#d78a29"/><text x="80" y="170" font-size="25" font-weight="bold" fill="#9a5b15" font-family="Arial,sans-serif">Net radiation (Rn)</text><text x="80" y="202" font-size="19" fill="#865d2c" font-family="Arial,sans-serif">Absorbed light and thermal radiation</text><path d="M745 320 L1030 195" stroke="#477aab" stroke-width="12"/><path d="M1000 190 L1044 187 L1022 226" fill="#477aab"/><text x="805" y="150" font-size="24" font-weight="bold" fill="#285a87" font-family="Arial,sans-serif">Sensible heat (H)</text><text x="805" y="180" font-size="18" fill="#285a87" font-family="Arial,sans-serif">Convection with surrounding air</text><path d="M730 460 L1010 520" stroke="#1a9d9a" stroke-width="12"/><path d="M980 495 L1024 523 L975 538" fill="#1a9d9a"/><text x="820" y="573" font-size="24" font-weight="bold" fill="#117774" font-family="Arial,sans-serif">Latent heat (λE)</text><text x="820" y="604" font-size="18" fill="#117774" font-family="Arial,sans-serif">Water evaporates via stomata</text><path d="M580 655 L580 562" stroke="#286d9a" stroke-width="10"/><path d="M563 582 L580 550 L597 582" fill="#286d9a"/><text x="340" y="675" font-size="20" fill="#285a87" font-family="Arial,sans-serif">Root water supply supports transpiration</text><rect x="45" y="420" width="340" height="140" rx="14" fill="#e8f1ec" stroke="#8cb2a2"/><text x="65" y="453" font-size="22" font-weight="bold" fill="#214f40" font-family="Arial,sans-serif">Simplified steady state</text><text x="65" y="494" font-size="28" fill="#214f40" font-family="Arial,sans-serif">Rn ≈ H + λE</text><text x="65" y="528" font-size="17" fill="#315a4c" font-family="Arial,sans-serif">Storage and minor terms omitted</text><text x="45" y="704" font-size="14" fill="#456a60" font-family="Arial,sans-serif">Original THC schematic · CC BY 4.0 · Conceptual basis: Nobel (2009), Physicochemical and Environmental Plant Physiology</text></svg>