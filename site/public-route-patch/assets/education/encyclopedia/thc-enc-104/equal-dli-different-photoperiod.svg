<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Equal daily light integral, different photoperiods</title><desc id="desc">Hypothetical schedule A provides 500 micromoles per square metre per second for 18 hours and six hours dark. Schedule B provides 750 for 12 hours and twelve hours dark. Both yield 32.4 moles per square metre per day. Values are arithmetic examples, not measured plant data.</desc><rect width="1200" height="720" fill="#f7fafb"/><text x="45" y="65" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#183d50">Equal DLI ≠ equal photoperiod</text><text x="45" y="104" font-family="Arial,sans-serif" font-size="21" fill="#416274">Hypothetical constant PPFD · two distinct light/dark schedules</text><text x="45" y="171" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#194f6b">A · 500 µmol m⁻² s⁻¹ × 18 h</text><rect x="90" y="195" width="810" height="90" fill="#f5d66e"/><rect x="900" y="195" width="270" height="90" fill="#263a58"/><text x="480" y="250" font-family="Arial,sans-serif" text-anchor="middle" font-size="24" fill="#604c12">18 h light</text><text x="1035" y="250" font-family="Arial,sans-serif" text-anchor="middle" font-size="23" fill="#fff">6 h dark</text><text x="45" y="355" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#194f6b">B · 750 µmol m⁻² s⁻¹ × 12 h</text><rect x="90" y="380" width="540" height="90" fill="#f5d66e"/><rect x="630" y="380" width="540" height="90" fill="#263a58"/><text x="360" y="435" font-family="Arial,sans-serif" text-anchor="middle" font-size="24" fill="#604c12">12 h light</text><text x="900" y="435" font-family="Arial,sans-serif" text-anchor="middle" font-size="23" fill="#fff">12 h dark</text><path d="M90 510 H1170" stroke="#516c7b" stroke-width="3"/><text x="90" y="541" font-family="Arial,sans-serif" font-size="18" fill="#416274">0 h</text><text x="630" y="541" font-family="Arial,sans-serif" text-anchor="middle" font-size="18" fill="#416274">12 h</text><text x="1170" y="541" font-family="Arial,sans-serif" text-anchor="end" font-size="18" fill="#416274">24 h</text><rect x="45" y="568" width="1110" height="83" rx="13" fill="#e3f0ea"/><text x="600" y="604" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#215e4b">Both: 32.4 mol m⁻² d⁻¹</text><text x="600" y="633" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#215e4b">DLI = PPFD × light hours × 0.0036 · dark intervals and signaling differ</text><text x="45" y="697" font-family="Arial,sans-serif" font-size="15" fill="#416274">Original THC schematic · CC BY 4.0 · Conceptual context: Zhang et al. (2021), Frontiers in Plant Science</text></svg>