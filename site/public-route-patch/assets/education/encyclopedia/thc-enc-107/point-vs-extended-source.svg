<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Point-source inverse square versus extended horticultural fixture</title><desc id="desc">Left: ideal point source with two perpendicular measurement planes at distances r and 2r, with relative irradiance 1 and one quarter. Right: three-bar LED fixture sends overlapping beams toward a canopy grid. Actual PPFD must be mapped because source dimensions, angle and reflections matter.</desc><rect width="1200" height="720" fill="#f7fafc"/><text x="42" y="57" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#18394c">Inverse square: useful model, not a canopy shortcut</text><text x="42" y="94" font-family="Arial,sans-serif" font-size="19" fill="#526c7d">Compare assumptions before changing fixture height</text><rect x="30" y="120" width="550" height="515" rx="20" fill="#eaf3fc" stroke="#89aecd" stroke-width="3"/><rect x="620" y="120" width="550" height="515" rx="20" fill="#edf7f0" stroke="#86b49b" stroke-width="3"/><text x="305" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#204d75">Ideal point source</text><text x="895" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#236346">Extended LED bars</text><circle cx="130" cy="365" r="17" fill="#f0ad31" stroke="#a26a16" stroke-width="3"/><text x="130" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#6a501d">source</text><path d="M146 355 L505 230 M146 375 L505 500 M146 365 H505" stroke="#d6a245" stroke-width="3" fill="none"/><path d="M285 270 V460 M505 210 V520" stroke="#3176ac" stroke-width="5"/><text x="285" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#245783">E(r) = 1</text><text x="505" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#245783">E(2r) = ¼</text><path d="M130 525 H285 M130 555 H505" stroke="#4b687e" stroke-width="2"/><text x="207" y="518" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#304e65">r</text><text x="320" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#304e65">2r</text><text x="305" y="602" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#355c78">Same source · perpendicular planes · open space</text><rect x="718" y="227" width="355" height="92" rx="12" fill="#d4e5dd" stroke="#3e8662" stroke-width="3"/><path d="M750 250 H1040 M750 273 H1040 M750 296 H1040" stroke="#2e7453" stroke-width="8" stroke-linecap="round"/><text x="895" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#225b41">Multiple spatially separated emitters</text><path d="M750 306 L680 493 M750 306 L905 493 M895 306 L760 493 M895 306 L1030 493 M1040 306 L865 493 M1040 306 L1110 493" stroke="#c89b43" stroke-width="3" opacity=".85"/><rect x="670" y="493" width="450" height="80" fill="#c6e8cf" stroke="#4d9269" stroke-width="3"/><path d="M760 493 V573 M850 493 V573 M940 493 V573 M1030 493 V573 M670 533 H1120" stroke="#75b28b" stroke-width="2"/><text x="895" y="601" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#205c3b">Measure PPFD across the canopy grid</text><text x="600" y="669" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#263f4f">Real rooms add fixture overlap, optics, obstructions and reflections</text><text x="600" y="696" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#536a76">Original THC educational schematic · CC BY 4.0 · Sources: IES Lighting Handbook (2011); RII (2021)</text></svg>