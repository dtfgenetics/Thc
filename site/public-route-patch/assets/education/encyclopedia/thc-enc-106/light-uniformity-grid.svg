<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Canopy light map and uniformity calculation</title><desc id="desc">Illustrative 3 by 3 PPFD sampling grid in micromoles per square meter per second: row one 400, 500, 400; row two 500, 600, 500; row three 400, 500, 400. Sum 4200, mean 466.7, minimum 400, minimum divided by mean 0.857. Not measured values.</desc><rect width="1200" height="720" fill="#f7faf8"/><text x="55" y="66" font-size="34" font-weight="bold" fill="#17493d" font-family="Arial,sans-serif">Light mapping: average ≠ uniformity</text><text x="55" y="108" font-size="21" fill="#47695d" font-family="Arial,sans-serif">Illustrative 3 × 3 sampling grid · PPFD (µmol m⁻² s⁻¹) · NOT measured data</text><text x="90" y="181" font-size="23" font-weight="bold" fill="#17493d" font-family="Arial,sans-serif">Coordinates (same measurement plane)</text><rect x="95" y="215" width="145" height="105" rx="10" fill="#d7eaf5" stroke="#42675d" stroke-width="2"/><text x="167" y="277" font-size="29" text-anchor="middle" fill="#183d36" font-family="Arial,sans-serif">400</text><rect x="255" y="215" width="145" height="105" rx="10" fill="#a9d8c1" stroke="#42675d" stroke-width="2"/><text x="327" y="277" font-size="29" text-anchor="middle" fill="#183d36" font-family="Arial,sans-serif">500</text><rect x="415" y="215" width="145" height="105" rx="10" fill="#d7eaf5" stroke="#42675d" stroke-width="2"/><text x="487" y="277" font-size="29" text-anchor="middle" fill="#183d36" font-family="Arial,sans-serif">400</text><rect x="95" y="333" width="145" height="105" rx="10" fill="#a9d8c1" stroke="#42675d" stroke-width="2"/><text x="167" y="395" font-size="29" text-anchor="middle" fill="#183d36" font-family="Arial,sans-serif">500</text><rect x="255" y="333" width="145" height="105" rx="10" fill="#d2e4a0" stroke="#42675d" stroke-width="2"/><text x="327" y="395" font-size="29" text-anchor="middle" fill="#183d36" font-family="Arial,sans-serif">600</text><rect x="415" y="333" width="145" height="105" rx="10" fill="#a9d8c1" stroke="#42675d" stroke-width="2"/><text x="487" y="395" font-size="29" text-anchor="middle" fill="#183d36" font-family="Arial,sans-serif">500</text><rect x="95" y="451" width="145" height="105" rx="10" fill="#d7eaf5" stroke="#42675d" stroke-width="2"/><text x="167" y="513" font-size="29" text-anchor="middle" fill="#183d36" font-family="Arial,sans-serif">400</text><rect x="255" y="451" width="145" height="105" rx="10" fill="#a9d8c1" stroke="#42675d" stroke-width="2"/><text x="327" y="513" font-size="29" text-anchor="middle" fill="#183d36" font-family="Arial,sans-serif">500</text><rect x="415" y="451" width="145" height="105" rx="10" fill="#d7eaf5" stroke="#42675d" stroke-width="2"/><text x="487" y="513" font-size="29" text-anchor="middle" fill="#183d36" font-family="Arial,sans-serif">400</text><rect x="640" y="203" width="505" height="372" rx="18" fill="#e7f1ec" stroke="#75a28c" stroke-width="3"/><text x="670" y="251" font-size="27" font-weight="bold" fill="#17493d" font-family="Arial,sans-serif">Worked example</text><text x="670" y="302" font-size="23" fill="#17493d" font-family="Arial,sans-serif">9 points · sum = 4,200</text><text x="670" y="352" font-size="23" fill="#17493d" font-family="Arial,sans-serif">Mean = 4,200 / 9 = 466.7</text><text x="670" y="402" font-size="23" fill="#17493d" font-family="Arial,sans-serif">Minimum = 400 · maximum = 600</text><text x="670" y="461" font-size="23" font-weight="bold" fill="#17493d" font-family="Arial,sans-serif">Uniformity = min / mean</text><text x="670" y="504" font-size="28" font-weight="bold" fill="#17493d" font-family="Arial,sans-serif">400 / 466.7 ≈ 0.857</text><text x="670" y="546" font-size="17" fill="#45695d" font-family="Arial,sans-serif">Metric depends on sampling protocol</text><text x="60" y="635" font-size="19" fill="#17493d" font-family="Arial,sans-serif">Record: sensor band · height · grid spacing · dimming · canopy state · date</text><text x="60" y="683" font-size="16" fill="#47695d" font-family="Arial,sans-serif">Original THC educational diagram · CC BY 4.0 · Technical context: RII (2021), Rodriguez-Morrison et al. (2021)</text></svg>