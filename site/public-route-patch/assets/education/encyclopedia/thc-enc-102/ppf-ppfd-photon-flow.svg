<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">PPF versus PPFD: from fixture output to canopy measurements</title><desc id="desc">A light fixture emits PPF in micromoles per second. Some photons miss the canopy, while a grid at the canopy records local PPFD in micromoles per square meter per second. No measured values are shown.</desc><rect width="1200" height="720" fill="#f7fafc"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#193b51">PPF is output. PPFD is delivery per area.</text><text x="50" y="104" font-family="Arial,sans-serif" font-size="20" fill="#466478">Conceptual photon-flow schematic · conventional PAR: 400–700 nm</text><rect x="410" y="145" width="380" height="72" rx="12" fill="#2c617f"/><text x="600" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="white">LED fixture</text><text x="600" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#1d577a">PPF: µmol/s</text><text x="600" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#1d577a">Total emitted photon rate</text><g stroke="#e1ad3b" stroke-width="8" stroke-linecap="round"><path d="M460 223 L255 435"/><path d="M515 223 L410 435"/><path d="M585 223 L570 435"/><path d="M665 223 L720 435"/><path d="M745 223 L905 435"/></g><path d="M215 435 L985 435 L910 590 L290 590 Z" fill="#d8eddb" stroke="#4c9b6e" stroke-width="4"/><g stroke="#8bb79a" stroke-width="2"><path d="M370 435 L420 590 M525 435 L540 590 M680 435 L660 590 M835 435 L780 590 M240 487 L960 487 M265 540 L935 540"/></g><g fill="#286d50"><circle cx="410" cy="487" r="12"/><circle cx="590" cy="487" r="12"/><circle cx="770" cy="487" r="12"/><circle cx="470" cy="550" r="12"/><circle cx="650" cy="550" r="12"/></g><text x="600" y="636" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#22674a">PPFD at grid points: µmol/m²/s</text><text x="600" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#3f6c56">Map local variation at the actual canopy plane</text><rect x="35" y="330" width="225" height="85" rx="12" fill="#fff1d8" stroke="#b58938"/><text x="52" y="365" font-family="Arial,sans-serif" font-size="19" fill="#7d5618">Some photons miss</text><text x="52" y="394" font-family="Arial,sans-serif" font-size="19" fill="#7d5618">the receiving area</text><path d="M255 415 L250 443" stroke="#b58938" stroke-width="3"/><rect x="938" y="320" width="225" height="100" rx="12" fill="#e5eff8" stroke="#7197ba"/><text x="954" y="353" font-family="Arial,sans-serif" font-size="19" fill="#305d80">Distribution depends</text><text x="954" y="381" font-family="Arial,sans-serif" font-size="19" fill="#305d80">on mounting and</text><text x="954" y="406" font-family="Arial,sans-serif" font-size="19" fill="#305d80">room geometry</text><text x="45" y="701" font-family="Arial,sans-serif" font-size="14" fill="#536e7c">Original THC educational diagram · CC BY 4.0 · Conceptual basis: ASABE S640; Nobel (2009)</text></svg>