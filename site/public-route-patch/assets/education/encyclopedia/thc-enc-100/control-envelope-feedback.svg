<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Stage-aware environmental control feedback loop</title><desc id="d">A process diagram shows crop stage and facility capability informing a proposed control envelope, measured microclimate, crop response and risk review. A feedback arrow returns to the envelope. No numerical setpoints are prescribed.</desc><rect width="1200" height="720" fill="#f7faf9"/><text x="44" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#19453b">Stage-aware environmental control</text><text x="44" y="98" font-family="Arial,sans-serif" font-size="20" fill="#466d61">Measure → interpret → adjust → verify · qualitative process, not universal targets</text><g font-family="Arial,sans-serif"><rect x="48" y="170" width="245" height="142" rx="16" fill="#e5f1ec" stroke="#4b927a" stroke-width="3"/><text x="170" y="212" text-anchor="middle" font-size="23" font-weight="bold" fill="#1b5c49">Crop context</text><text x="170" y="248" text-anchor="middle" font-size="18" fill="#285e4e">Stage, genotype, roots</text><text x="170" y="277" text-anchor="middle" font-size="18" fill="#285e4e">Light, equipment capacity</text><rect x="340" y="170" width="245" height="142" rx="16" fill="#e6effa" stroke="#5b8ab8" stroke-width="3"/><text x="462" y="212" text-anchor="middle" font-size="23" font-weight="bold" fill="#24547e">Control envelope</text><text x="462" y="248" text-anchor="middle" font-size="18" fill="#24547e">Band + persistence</text><text x="462" y="277" text-anchor="middle" font-size="18" fill="#24547e">Warning + safe response</text><rect x="632" y="170" width="245" height="142" rx="16" fill="#e8f3f8" stroke="#5b99b2" stroke-width="3"/><text x="754" y="212" text-anchor="middle" font-size="23" font-weight="bold" fill="#285e75">Measure</text><text x="754" y="248" text-anchor="middle" font-size="18" fill="#285e75">Leaf, air, root, RH</text><text x="754" y="277" text-anchor="middle" font-size="18" fill="#285e75">Location + duration</text><rect x="924" y="170" width="245" height="142" rx="16" fill="#fff1e2" stroke="#c58d4e" stroke-width="3"/><text x="1046" y="212" text-anchor="middle" font-size="23" font-weight="bold" fill="#8b571c">Observe</text><text x="1046" y="248" text-anchor="middle" font-size="18" fill="#8b571c">Growth + water use</text><text x="1046" y="277" text-anchor="middle" font-size="18" fill="#8b571c">Injury + disease signs</text><path d="M293 241 H340 M585 241 H632 M877 241 H924" stroke="#456c66" stroke-width="5" fill="none"/><path d="M329 230 L342 241 L329 252 M621 230 L634 241 L621 252 M913 230 L926 241 L913 252" fill="none" stroke="#456c66" stroke-width="4"/><rect x="400" y="410" width="400" height="125" rx="18" fill="#f1eaf8" stroke="#9473b5" stroke-width="3"/><text x="600" y="451" text-anchor="middle" font-size="24" font-weight="bold" fill="#64418a">Risk review + documented revision</text><text x="600" y="486" text-anchor="middle" font-size="18" fill="#64418a">Check safety, capacity, crop response</text><text x="600" y="514" text-anchor="middle" font-size="18" fill="#64418a">Version changes and rollback criteria</text><path d="M1046 312 V472 H800" stroke="#8061a4" stroke-width="5" fill="none"/><path d="M812 461 L799 472 L812 483" fill="none" stroke="#8061a4" stroke-width="4"/><path d="M400 472 H462 V312" stroke="#8061a4" stroke-width="5" fill="none"/><path d="M451 324 L462 311 L473 324" fill="none" stroke="#8061a4" stroke-width="4"/><text x="45" y="628" font-size="20" fill="#315c4f">Key distinction: a controller setpoint is not the same as the plant microclimate.</text><text x="45" y="679" font-size="15" fill="#47695f">Original THC diagram · CC BY 4.0 · Scientific basis: Shamshiri et al. (2018); Nobel (2009); JCGM 100:2008</text></g></svg>