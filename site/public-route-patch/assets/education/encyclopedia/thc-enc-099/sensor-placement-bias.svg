485" fill="none" stroke="#419b69" stroke-width="15"/><path d="M645 485 Q700 385 755 485 Q805 395 860 485 Q925 385 985 485 Q1040 405 1125 485" fill="none" stroke="#419b69" stroke-width="15"/><rect x="850" y="343" width="65" height="72" rx="8" fill="#d9e5e8" stroke="#527784" stroke-width="3"/><path d="M861 355 H904 M861 367 H904 M861 379 H904 M861 391 H904" stroke="#527784" stroke-width="3"/><circle cx="882" cy="375" r="7" fill="#246c83"/><text x="882" y="327" text-anchor="middle" font-size="18" font-weight="bold" fill="#245f64" font-family="Arial">Shielded control probe</text><g fill="#387cb2" stroke="#fff" stroke-width="3"><circle cx="685" cy="432" r="11"/><circle cx="767" cy="465" r="11"/><circle cx="975" cy="447" r="11"/><circle cx="1073" cy="417" r="11"/></g><text x="882" y="532" text-anchor="middle" font-size="18" fill="#245f64" font-family="Arial">Blue dots = separate spatial mapping points</text><text x="65" y="563" font-size="19" fill="#8c4a33" font-family="Arial">Local bias may mislead control decisions</text><text x="642" y="563" font-size="19" fill="#246c55" font-family="Arial">Log location, height, shielding and conditions</text><text x="44" y="648" font-size="20" font-weight="bold" fill="#193e4b" font-family="Arial">Verify with reference instruments; preserve as-found and as-left records</text><text x="44" y="686" font-size="16" fill="#486b76" font-family="Arial">Original THC schematic · CC BY 4.0 · Measurement concepts: JCGM 100:2008 and JCGM 200:2012</text></svg>