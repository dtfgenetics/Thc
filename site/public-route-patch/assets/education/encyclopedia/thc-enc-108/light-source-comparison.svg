<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Four light sources: mechanisms, heat pathways and canopy measurement</title>
<desc id="desc">Four columns compare LED diode and driver, HID discharge and ballast, fluorescent phosphor lamp, and sunlight filtered through glazing. Each has a photon arrow toward a shared canopy measurement plane. Separate dashed arrows indicate that heat distribution varies. This is a conceptual diagram with no performance data.</desc>
<rect width="1200" height="720" fill="#f7fafc"/>
<text x="48" y="64" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#17324d">Light sources: compare delivery, not labels</text>
<text x="48" y="98" font-family="Arial,sans-serif" font-size="19" fill="#42596b">Source mechanisms differ; installed canopy PPFD must be measured in a stated waveband</text>
<g><rect x="48" y="140" width="264" height="360" rx="16" fill="white" stroke="#cbd7df" stroke-width="2"/><rect x="64" y="160" width="232" height="52" rx="10" fill="#187a9b"/><text x="180" y="194" text-anchor="middle" fill="white" font-size="25" font-family="Arial,sans-serif" font-weight="bold">LED</text><text x="180" y="248" text-anchor="middle" fill="#203b52" font-size="19" font-family="Arial,sans-serif">Diode + driver</text><text x="180" y="278" text-anchor="middle" fill="#526a7a" font-size="17" font-family="Arial,sans-serif">Electrical → photons</text><path d="M 180 302 V 400" stroke="#187a9b" stroke-width="9" stroke-linecap="round"/><path d="M 163 385 L 180 410 L 197 385" fill="none" stroke="#187a9b" stroke-width="8" stroke-linecap="round"/><text x="180" y="440" text-anchor="middle" fill="#24475e" font-size="18" font-family="Arial,sans-serif">Photon delivery ↓</text><path d="M 98 313 Q 63 348 96 390" stroke="#bd6c4b" stroke-width="4" fill="none" stroke-dasharray="8 7"/><text x="113" y="470" fill="#955139" font-size="15" font-family="Arial,sans-serif">Heat pathway varies</text></g><g><rect x="344" y="140" width="264" height="360" rx="16" fill="white" stroke="#cbd7df" stroke-width="2"/><rect x="360" y="160" width="232" height="52" rx="10" fill="#9a641b"/><text x="476" y="194" text-anchor="middle" fill="white" font-size="25" font-family="Arial,sans-serif" font-weight="bold">HID</text><text x="476" y="248" text-anchor="middle" fill="#203b52" font-size="19" font-family="Arial,sans-serif">Arc lamp + ballast</text><text x="476" y="278" text-anchor="middle" fill="#526a7a" font-size="17" font-family="Arial,sans-serif">Discharge → photons</text><path d="M 476 302 V 400" stroke="#9a641b" stroke-width="9" stroke-linecap="round"/><path d="M 459 385 L 476 410 L 493 385" fill="none" stroke="#9a641b" stroke-width="8" stroke-linecap="round"/><text x="476" y="440" text-anchor="middle" fill="#24475e" font-size="18" font-family="Arial,sans-serif">Photon delivery ↓</text><path d="M 394 313 Q 359 348 392 390" stroke="#bd6c4b" stroke-width="4" fill="none" stroke-dasharray="8 7"/><text x="409" y="470" fill="#955139" font-size="15" font-family="Arial,sans-serif">Heat pathway varies</text></g><g><rect x="640" y="140" width="264" height="360" rx="16" fill="white" stroke="#cbd7df" stroke-width="2"/><rect x="656" y="160" width="232" height="52" rx="10" fill="#7754a2"/><text x="772" y="194" text-anchor="middle" fill="white" font-size="25" font-family="Arial,sans-serif" font-weight="bold">Fluorescent</text><text x="772" y="248" text-anchor="middle" fill="#203b52" font-size="19" font-family="Arial,sans-serif">Discharge + phosphor</text><text x="772" y="278" text-anchor="middle" fill="#526a7a" font-size="17" font-family="Arial,sans-serif">UV → visible photons</text><path d="M 772 302 V 400" stroke="#7754a2" stroke-width="9" stroke-linecap="round"/><path d="M 755 385 L 772 410 L 789 385" fill="none" stroke="#7754a2" stroke-width="8" stroke-linecap="round"/><text x="772" y="440" text-anchor="middle" fill="#24475e" font-size="18" font-family="Arial,sans-serif">Photon delivery ↓</text><path d="M 690 313 Q 655 348 688 390" stroke="#bd6c4b" stroke-width="4" fill="none" stroke-dasharray="8 7"/><text x="705" y="470" fill="#955139" font-size="15" font-family="Arial,sans-serif">Heat pathway varies</text></g><g><rect x="936" y="140" width="264" height="360" rx="16" fill="white" stroke="#cbd7df" stroke-width="2"/><rect x="952" y="160" width="232" height="52" rx="10" fill="#28794f"/><text x="1068" y="194" text-anchor="middle" fill="white" font-size="25" font-family="Arial,sans-serif" font-weight="bold">Sunlight</text><text x="1068" y="248" text-anchor="middle" fill="#203b52" font-size="19" font-family="Arial,sans-serif">Atmosphere + glazing</text><text x="1068" y="278" text-anchor="middle" fill="#526a7a" font-size="17" font-family="Arial,sans-serif">Direct + diffuse</text><path d="M 1068 302 V 400" stroke="#28794f" stroke-width="9" stroke-linecap="round"/><path d="M 1