<rect x="48" y="530" width="1152" height="84" rx="12" fill="#dcefe6" stroke="#4d9978" stroke-width="2"/>
<text x="624" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#1d6247">Canopy measurement plane</text>
<text x="624" y="594" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#225f49">Map PPFD (µmol m⁻² s⁻¹) • integrate DLI (mol m⁻² d⁻¹) • record PAR/ePAR band</text>
<text x="48" y="658" font-family="Arial,sans-serif" font-size="17" fill="#41596a">Conceptual, not to scale. No measured performance values or technology ranking.</text>
