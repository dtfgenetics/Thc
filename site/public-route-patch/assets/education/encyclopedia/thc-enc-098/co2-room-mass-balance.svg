<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Greenhouse room carbon dioxide balance</title><desc id="desc">Conceptual room diagram with incoming outdoor air and supplemental carbon dioxide, outgoing exhaust, and carbon dioxide uptake by plants. Sensor locations illustrate possible spatial differences.</desc><rect width="1200" height="720" fill="#f7faf9"/><text x="48" y="66" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#173d37">Where room CO₂ concentration comes from</text><text x="48" y="104" font-family="Arial,sans-serif" font-size="19" fill="#46655e">Conceptual mass balance · not a design or worker-safety specification</text><rect x="300" y="174" width="600" height="390" rx="20" fill="#e8f2ee" stroke="#59877b" stroke-width="5"/><text x="600" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#214e41">Cultivation room (control volume)</text><path d="M80 280 H340" stroke="#327eae" stroke-width="16"/><path d="M310 258 L355 280 L310 302" fill="#327eae"/><text x="65" y="248" font-family="Arial,sans-serif" font-size="24" fill="#275c86" font-weight="bold">Incoming air</text><path d="M865 290 H1125" stroke="#bf7940" stroke-width="16"/><path d="M1095 268 L1140 290 L1095 312" fill="#bf7940"/><text x="931" y="254" font-family="Arial,sans-serif" font-size="24" fill="#955a2b" font-weight="bold">Exhaust</text><path d="M605 640 V520" stroke="#6b69b4" stroke-width="15"/><path d="M582 545 L605 500 L628 545" fill="#6b69b4"/><text x="390" y="680" font-family="Arial,sans-serif" font-size="23" fill="#514d9b" font-weight="bold">Supplemental CO₂ supply</text><path d="M465 350 L465 440 M600 350 L600 440 M735 350 L735 440" stroke="#1d9472" stroke-width="9"/><path d="M450 420 L465 455 L480 420 M585 420 L600 455 L615 420 M720 420 L735 455 L750 420" fill="#1d9472"/><text x="600" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#176e58" font-weight="bold">Net plant CO₂ uptake</text><path d="M410 510 q30 -70 60 0 M545 510 q30 -70 60 0 M680 510 q30 -70 60 0" fill="none" stroke="#488e66" stroke-width="8"/><rect x="60" y="374" width="215" height="150" rx="12" fill="#fff" stroke="#9fb6ac"/><text x="76" y="409" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#315b50">Measure by zone</text><text x="76" y="443" font-family="Arial,sans-serif" font-size="18" fill="#315b50">• Canopy CO₂</text><text x="76" y="472" font-family="Arial,sans-serif" font-size="18" fill="#315b50">• Air exchange</text><text x="76" y="501" font-family="Arial,sans-serif" font-size="18" fill="#315b50">• Light / uptake</text><text x="48" y="701" font-family="Arial,sans-serif" font-size="15" fill="#46655e">Original THC educational schematic · CC BY 4.0 · Conceptual basis: Nobel (2009); Chandra et al. (2011). Safety: NIOSH Pocket Guide CO₂</text></svg>