<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Chilling stress: three interacting pathways</title><desc id="desc">Cold leaf temperature slows metabolism and photosystem repair; cool roots restrict water transport; a separate surface dew-point condition increases condensation risk. Qualitative mechanisms, not numeric thresholds.</desc><rect width="1200" height="720" fill="#f7fafc"/><text x="48" y="64" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#193d5c">Cold stress: separate mechanisms, not one symptom</text><text x="48" y="103" font-family="Arial,sans-serif" font-size="20" fill="#44647b">Conceptual pathways · no universal cannabis temperature threshold</text><rect x="350" y="145" width="500" height="95" rx="18" fill="#d6e9f8" stroke="#4079a5" stroke-width="3"/><text x="600" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#174d73">Low tissue or root-zone temperature</text><text x="600" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#174d73">Interpret duration, location and acclimation</text><path d="M600 240 V280 H210 V318 M600 280 V318 M600 280 H990 V318" fill="none" stroke="#5786a8" stroke-width="5"/><path d="M198 305 L210 325 L222 305 M588 305 L600 325 L612 305 M978 305 L990 325 L1002 305" fill="none" stroke="#5786a8" stroke-width="4"/><rect x="35" y="330" width="350" height="230" rx="17" fill="#e9f2ff" stroke="#7ca3d0" stroke-width="3"/><text x="210" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#234f82">Leaves + light</text><text x="58" y="414" font-family="Arial,sans-serif" font-size="20" fill="#234f82">• Slower carbon metabolism</text><text x="58" y="453" font-family="Arial,sans-serif" font-size="20" fill="#234f82">• Slower photosystem repair</text><text x="58" y="492" font-family="Arial,sans-serif" font-size="20" fill="#234f82">• Photoinhibition risk</text><text x="58" y="532" font-family="Arial,sans-serif" font-size="17" fill="#426887">Depends on light and exposure</text><rect x="425" y="330" width="350" height="230" rx="17" fill="#e7f4f0" stroke="#68a99b" stroke-width="3"/><text x="600" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#176455">Roots + water</text><text x="449" y="414" font-family="Arial,sans-serif" font-size="20" fill="#176455">• Slower root metabolism</text><text x="449" y="453" font-family="Arial,sans-serif" font-size="20" fill="#176455">• Lower water conductance</text><text x="449" y="492" font-family="Arial,sans-serif" font-size="20" fill="#176455">• Uptake may decline</text><text x="449" y="532" font-family="Arial,sans-serif" font-size="17" fill="#347a6d">Wet substrate can still limit supply</text><rect x="815" y="330" width="350" height="230" rx="17" fill="#fff3e7" stroke="#d6a46c" stroke-width="3"/><text x="990" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#92551c">Surface moisture</text><text x="838" y="414" font-family="Arial,sans-serif" font-size="20" fill="#92551c">• Compare dew point</text><text x="838" y="453" font-family="Arial,sans-serif" font-size="20" fill="#92551c">• Condensation possible</text><text x="838" y="492" font-family="Arial,sans-serif" font-size="20" fill="#92551c">• Separate disease risk</text><text x="838" y="532" font-family="Arial,sans-serif" font-size="17" fill="#9c6b39">Not proof of chilling injury</text><text x="48" y="620" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#193d5c">Record: leaf / air / root temperature, duration, light, RH and recovery trend</text><text x="48" y="665" font-family="Arial,sans-serif" font-size="17" fill="#44647b">Original THC educational schematic · CC BY 4.0 · Sources: Nobel (2009); Long et al. (1994)</text></svg>