<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grow Room Bingo / Bongwater Bingo | DTF Genetics</title>
  <meta name="description" content="Generate and play shareable Grow Room Bingo and Bongwater Bingo cards for DTF Genetics community events.">
  <link rel="canonical" href="https://dtfseeds.com/games/grow-room-bingo/">
  <link rel="stylesheet" href="/games/dtf-route.css">
  <link rel="stylesheet" href="./bingo.css">
</head>
<body>
  <main class="bingo-shell">
    <a href="/games/" class="back">← Game Hub</a>
    <p class="eyebrow">DTF Genetics · Community game</p>
    <h1 id="title">Grow Room Bingo / Bongwater Bingo</h1>
    <p id="description" class="lede">Loading…</p>
    <section class="controls">
      <div id="modes" class="modes"></div>
      <label>Card code <input id="code" maxlength="6" pattern="[A-HJ-NP-Z2-9]{6}" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="code-help"></label>
      <span id="code-help" class="visually-hidden">Enter a six-character card code using letters except I and O, or digits 2 through 9.</span>
      <button id="load" type="button">Load code</button>
      <button id="new" type="button">New card</button>
      <button id="copy" type="button">Copy code + link</button>
    </section>
    <section class="status">
      <div><span>Card</span><strong id="code-readout">—</strong></div>
      <div><span>Marked</span><strong id="marked">1 / 25</strong></div>
      <div><span>Bingo lines</span><strong id="lines">0</strong></div>
      <div><span>Best</span><strong id="best">0</strong></div>
    </section>
    <p id="announce" class="announce" aria-live="polite">Mark a square when it happens.</p>
    <section id="board" class="board" aria-label="Bingo card"></section>
  </main>
  <script id="bingo-data" type="application/json">
{
  "schemaVersion": 1,
  "modes": [
    {"id":"grow-room","title":"Grow Room Bingo","description":"Cultivation moments every grower recognizes."},
    {"id":"bongwater","title":"Bongwater Bingo","description":"Community-night and sesh-table moments."},
    {"id":"mixed","title":"Mixed Garden","description":"A shuffled mix of grow-room and community moments."}
  ],
  "prompts": [
    {"id":"ph-check","mode":"grow-room","text":"Someone checks pH twice"},
    {"id":"fan-adjust","mode":"grow-room","text":"Oscillating fan gets repositioned"},
    {"id":"leaf-tuck","mode":"grow-room","text":"A leaf gets tucked under the canopy"},

    {"id":"loupe","mode":"grow-room","text":"Jeweler’s loupe comes out"},

    {"id":"temp","mode":"grow-room","text":"Canopy temperature gets checked"},
    {"id":"new-growth","mode":"grow-room","text":"Someone inspects new growth first"},
    {"id":"lower-leaf","mode":"grow-room","text":"Lower leaf gets inspected"},
    {"id":"runoff","mode":"grow-room","text":"Runoff gets discussed"},
    {"id":"ec","mode":"grow-room","text":"EC meter appears"},

  <script src="./app.js" defer></script>
</body>
</html>
