    <path d="M-25 42 Q-31 64 -28 79" fill="none" stroke="#262512" stroke-width="10" stroke-linecap="round"/><path d="M25 42 Q31 64 28 79" fill="none" stroke="#262512" stroke-width="10" stroke-linecap="round"/>
    <use href="#boot" transform="translate(-30 88) scale(.82)"/><use href="#boot" transform="translate(31 88) scale(.82)"/>
    <path d="M-31 -4 Q-53 10 -57 34" fill="none" stroke="#262512" stroke-width="10" stroke-linecap="round"/><path d="M31 -4 Q63 1 78 -12" fill="none" stroke="#262512" stroke-width="10" stroke-linecap="round"/>
    <use href="#glove" transform="translate(-59 40) scale(.72) rotate(-16)"/><use href="#glove" transform="translate(84 -16) scale(.76) rotate(-8)"/>
