    <linearGradient id="suitHi" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#85ee62"/><stop offset="1" stop-color="#208d43"/></linearGradient>
    <linearGradient id="fireHi" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd65d"/><stop offset=".42" stop-color="#ff6a2d"/><stop offset="1" stop-color="#9e2c23"/></linearGradient>
    <linearGradient id="electricHi" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffca6"/><stop offset=".5" stop-color="#ffd82e"/><stop offset="1" stop-color="#8fa523"/></linearGradient>
    <linearGradient id="iceHi" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ebffff"/><stop offset=".44" stop-color="#72dfff"/><stop offset="1" stop-color="#317ecf"/></linearGradient>

