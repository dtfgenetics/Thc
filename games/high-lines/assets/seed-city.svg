<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Seed City coloring scene</title>
  <desc id="desc">A playful night-city skyline of rounded seed-inspired towers, greenhouse, billboard, tram, rooftop garden, and three hidden objects.</desc>
  <style>
    .region{fill:#fbfaf4;stroke:#151b18;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .detail{fill:none;stroke:#151b18;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
    .thin{stroke-width:3}.hidden{fill:#fbfaf4;stroke:#151b18;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
  </style>

  <rect class="region" data-region="sky" x="18" y="18" width="964" height="664" rx="34"/>
