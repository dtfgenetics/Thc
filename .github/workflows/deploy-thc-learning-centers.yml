name: Deploy THC Learning Centers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-public-learning-center.mjs'
      - 'scripts/update-wordpress-learn-learning-center.mjs'
      - '.github/workflows/deploy-thc-learning-centers.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-thc-learning-centers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      SSH_HOST: ${{ secrets.HOSTINGER_HOST || secrets.SSH_HOST || secrets.SFTP_HOST }}
      SSH_USER: ${{ secrets.HOSTINGER_USER || secrets.HOSTINGER_SSH_USER || secrets.SSH_USER || secrets.SFTP_USER }}
      SSH_PORT: ${{ secrets.HOSTINGER_PORT || secrets.SSH_PORT || secrets.SFTP_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS || secrets.SSH_KNOWN_HOSTS }}
      SITE_ROOT: ${{ vars.HOSTINGER_WORDPRESS_PATH || vars.WORDPRESS_PATH || vars.WP_PATH }}
      BACKUP_ROOT: /tmp/dtf-learning-center

    steps:
      - name: Checkout canonical site repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate learning-center source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-public-learning-center.mjs
          node --check scripts/update-wordpress-learn-learning-center.mjs
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"

      - name: Build public THC learning routes
        id: build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-public-learning-center.mjs
          routes=(library encyclopedia academy setup root-zone environment plant-health propagation)
          for route in "${routes[@]}"; do
            file="site/public-route-patch/learn/$route/index.html"
            test -s "$file"
            grep -Eqi '<h1([ >])' "$file"
            grep -Eqi '<title>[^<]+' "$file"
            grep -Fqi 'rel="canonical"' "$file"
            grep -Fqi 'name="description"' "$file"
            grep -Fqi 'Teaching Healthy Cultivation' "$file"
          done
          test -s site/public-route-patch/learn/public-learning-center-manifest.json
          echo "route_count=${#routes[@]}" >> "$GITHUB_OUTPUT"

      - name: Validate Hostinger deployment access
        shell: bash
        run: |
          set -euo pipefail
          SSH_HOST="${SSH_HOST:-147.93.42.1}"
          SSH_PORT="${SSH_PORT:-22}"
          : "${SSH_USER:?Missing Hostinger SSH user}"
          : "${SSH_PRIVATE_KEY:?Missing Hostinger SSH private key}"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          echo "SSH_HOST=$SSH_HOST" >> "$GITHUB_ENV"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"

      - name: Configure verified SSH connection
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ -n "${SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Locate dtfseeds.com WordPress document root
        id: root
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SITE_ROOT:-}" ]]; then
            root="$SITE_ROOT"
          else
            root="$(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          while IFS= read -r config; do
            directory="$(dirname "$config")"
            if command -v wp >/dev/null 2>&1; then
              home_url="$(wp --path="$directory" option get home --skip-plugins --skip-themes 2>/dev/null || true)"
              case "${home_url%/}" in
                https://dtfseeds.com|http://dtfseeds.com|https://www.dtfseeds.com|http://www.dtfseeds.com)
                  printf '%s\n' "$directory"
                  exit 0
                  ;;
              esac
            fi
          done < <(find "$HOME" -maxdepth 8 -type f -name wp-config.php -print 2>/dev/null)
          exit 1
          REMOTE
          )"
          fi
          [[ -n "$root" ]]
          [[ "$root" =~ ^[A-Za-z0-9_./-]+$ ]]
          [[ "$root" != "/" ]]
          [[ "$root" != *".."* ]]
          echo "path=$root" >> "$GITHUB_OUTPUT"

      - name: Back up existing public learning routes
        id: backup
        shell: bash
        env:
          ROOT: ${{ steps.root.outputs.path }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$HOME/dtfseeds-learning-backups/$stamp"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "ROOT='$ROOT' BACKUP='$backup' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$BACKUP/learn"
          for route in library encyclopedia academy setup root-zone environment plant-health propagation; do
            src="$ROOT/learn/$route"
            [[ -e "$src" ]] || continue
            cp -a "$src" "$BACKUP/learn/$route"
          done
          if [[ -f "$ROOT/learn/public-learning-center-manifest.json" ]]; then
            cp -a "$ROOT/learn/public-learning-center-manifest.json" "$BACKUP/learn/"
          fi
          printf '%s\n' "$BACKUP" > "$BACKUP/backup-location.txt"
          REMOTE
          echo "path=$backup" >> "$GITHUB_OUTPUT"

      - name: Publish static learning routes
        shell: bash
        env:
          ROOT: ${{ steps.root.outputs.path }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$ROOT/learn'"
          for route in library encyclopedia academy setup root-zone environment plant-health propagation; do
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$ROOT/learn/$route'"
            rsync -az --delete --checksum -e "ssh -p $SSH_PORT" \
              "site/public-route-patch/learn/$route/" \
              "$SSH_USER@$SSH_HOST:$ROOT/learn/$route/"
          done
          rsync -az --checksum -e "ssh -p $SSH_PORT" \
            site/public-route-patch/learn/public-learning-center-manifest.json \
            "$SSH_USER@$SSH_HOST:$ROOT/learn/public-learning-center-manifest.json"

      - name: Patch WordPress Learn page with learning-center navigation
        id: wordpress
        shell: bash
        run: |
          set -euo pipefail
          node scripts/update-wordpress-learn-learning-center.mjs | tee "$RUNNER_TEMP/learn-wordpress.json"
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      - name: Verify live learning centers and Learn navigation
        id: live
        shell: bash
        run: |
          set -euo pipefail
          routes=(library encyclopedia academy setup root-zone environment plant-health propagation)
          for route in "${routes[@]}"; do
            body="$RUNNER_TEMP/learn-${route}.html"
            curl -4 --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
              "https://dtfseeds.com/learn/$route/?dtf_learning=${GITHUB_RUN_ID}" -o "$body"
            grep -Eqi '<h1([ >])' "$body"
            grep -Fqi 'Teaching Healthy Cultivation' "$body"
            grep -Fqi "rel=\"canonical\"" "$body"
            grep -Fqi '/learn/infographics/' "$body"
            ! grep -Fqi 'email@email.com' "$body"
            ! grep -Fqi '+123456789' "$body"
          done

          learn="$RUNNER_TEMP/learn-root.html"
          curl -4 --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
            "https://dtfseeds.com/learn/?dtf_learning=${GITHUB_RUN_ID}" -o "$learn"
          grep -Fqi 'Explore the content we have been building.' "$learn"
          for href in /learn/library/ /learn/setup/ /learn/root-zone/ /learn/environment/ /learn/plant-health/ /learn/propagation/ /learn/encyclopedia/ /learn/academy/; do
            grep -Fq "$href" "$learn"
          done
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      - name: Upload WordPress rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-learning-center-wordpress-backup-${{ github.run_id }}
          path: /tmp/dtf-learning-center
          if-no-files-found: warn
          retention-days: 30

      - name: Report learning-center production result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          ROUTE_COUNT: ${{ steps.build.outputs.route_count }}
          WP_OUTCOME: ${{ steps.wordpress.outputs.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outputs.outcome }}
          STATIC_BACKUP: ${{ steps.backup.outputs.path }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## THC Learning Center production',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.JOB_STATUS}**`,
                `Static learning routes built: **${process.env.ROUTE_COUNT || 'not-run'}**`,
                `WordPress Learn navigation update: **${process.env.WP_OUTCOME || 'not-run'}**`,
                `Visitor-facing verification: **${process.env.LIVE_OUTCOME || 'not-run'}**`,
                `Remote static backup: \`${process.env.STATIC_BACKUP || 'not-created'}\``,
                '',
                'Published scope: Education Library, Academy gateway, Encyclopedia gateway, Setup, Root Zone, Environment, Plant Health/IPM, and Genetics/Propagation.',
                'Detailed controlled manuscripts continue to retain their existing review/release status; this deployment does not relabel unapproved material as independently approved.'
              ].join('\n')
            });
