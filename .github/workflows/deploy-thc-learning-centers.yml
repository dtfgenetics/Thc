name: Deploy THC Learning Centers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-public-learning-center.mjs'
      - 'scripts/build-public-learning-center-wave3.mjs'
      - 'scripts/publish-wordpress-learning-center-pages.mjs'
      - 'scripts/update-wordpress-learn-learning-center.mjs'
      - '.github/workflows/deploy-thc-learning-centers.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-thc-learning-centers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-learning-center

    steps:
      - name: Checkout canonical site repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate learning-center source and WordPress access
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-public-learning-center.mjs
          node --check scripts/build-public-learning-center-wave3.mjs
          node --check scripts/publish-wordpress-learning-center-pages.mjs
          node --check scripts/update-wordpress-learn-learning-center.mjs
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"

      - name: Build public THC learning routes
        id: build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-public-learning-center.mjs
          node scripts/build-public-learning-center-wave3.mjs
          routes=(library start-here beginner-guides academy encyclopedia sops glossary records search setup root-zone environment plant-health propagation)
          for route in "${routes[@]}"; do
            file="site/public-route-patch/learn/$route/index.html"
            test -s "$file"
            grep -Eqi '<h1([ >])' "$file"
            grep -Eqi '<title>[^<]+' "$file"
            grep -Fqi 'rel="canonical"' "$file"
            grep -Fqi 'name="description"' "$file"
            grep -Fqi 'Teaching Healthy Cultivation' "$file"
          done
          test -s site/public-route-patch/learn/public-learning-center-manifest.json
          test -s site/public-route-patch/learn/wave3-learning-routes.json
          echo "route_count=${#routes[@]}" >> "$GITHUB_OUTPUT"

      - name: Create or update WordPress learning-center pages
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-wordpress-learning-center-pages.mjs | tee "$RUNNER_TEMP/learning-pages.json"
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      - name: Link the WordPress Learn page to all learning centers
        id: navigation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/update-wordpress-learn-learning-center.mjs | tee "$RUNNER_TEMP/learn-navigation.json"
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      - name: Verify live learning centers and Learn navigation
        id: live
        shell: bash
        run: |
          set -euo pipefail
          routes=(library start-here beginner-guides academy encyclopedia sops glossary records search setup root-zone environment plant-health propagation)
          for route in "${routes[@]}"; do
            body="$RUNNER_TEMP/learn-${route}.html"
            curl -4 --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
              "https://dtfseeds.com/learn/$route/?dtf_learning=${GITHUB_RUN_ID}" -o "$body"
            grep -Eqi '<h1([ >])' "$body"
            grep -Fqi 'Teaching Healthy Cultivation' "$body"
            grep -Fqi '/learn/' "$body"
            ! grep -Fqi 'email@email.com' "$body"
            ! grep -Fqi '+123456789' "$body"
            ! grep -Fqi 'being rebuilt' "$body"
          done

          info="$RUNNER_TEMP/learn-infographics.html"
          curl -4 --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
            "https://dtfseeds.com/learn/infographics/?dtf_learning=${GITHUB_RUN_ID}" -o "$info"
          grep -Eqi '<h1([ >])' "$info"

          learn="$RUNNER_TEMP/learn-root.html"
          curl -4 --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
            "https://dtfseeds.com/learn/?dtf_learning=${GITHUB_RUN_ID}" -o "$learn"
          grep -Fqi 'Choose a path, search a topic, or diagnose a plant.' "$learn"
          for href in /learn/start-here/ /learn/library/ /learn/beginner-guides/ /learn/academy/ /learn/encyclopedia/ /learn/infographics/ /learn/sops/ /learn/glossary/ /learn/records/ /learn/search/ /learn/setup/ /learn/root-zone/ /learn/environment/ /learn/plant-health/ /learn/propagation/ /thc-grow-doc/; do
            grep -Fq "$href" "$learn"
          done
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      - name: Upload WordPress rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-learning-center-wordpress-backup-${{ github.run_id }}
          path: /tmp/dtf-learning-center
          if-no-files-found: warn
          retention-days: 30

      - name: Report learning-center production result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          ROUTE_COUNT: ${{ steps.build.outputs.route_count }}
          PAGE_OUTCOME: ${{ steps.pages.outputs.outcome }}
          NAV_OUTCOME: ${{ steps.navigation.outputs.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outputs.outcome }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## THC customer-facing Learning Center production',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.JOB_STATUS}**`,
                `Learning routes built: **${process.env.ROUTE_COUNT || 'not-run'}**`,
                `WordPress child-page publication: **${process.env.PAGE_OUTCOME || 'not-run'}**`,
                `WordPress Learn navigation update: **${process.env.NAV_OUTCOME || 'not-run'}**`,
                `Visitor-facing verification: **${process.env.LIVE_OUTCOME || 'not-run'}**`,
                '',
                'Published scope: Start Here, Education Library, Beginner Guides, Academy, Encyclopedia, Infographics link, SOPs & Measurement, Glossary, Records/Printables, Search, Setup, Root Zone, Environment, Plant Health/IPM, and Genetics/Propagation.',
                'All changed WordPress page records are backed up. Controlled manuscripts retain their existing review/release state; the customer-facing navigation does not relabel held material as independently approved.'
              ].join('\n')
            });
