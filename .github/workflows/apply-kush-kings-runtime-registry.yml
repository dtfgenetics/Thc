name: Apply Kush Kings runtime registry update

on:
  push:
    branches:
      - ops/kush-kings-managed-runtime

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip kush registry]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ops/kush-kings-managed-runtime

      - name: Apply registry update
        run: node scripts/update-kush-kings-managed-runtime.mjs

      - name: Validate JSON and runtime contract
        run: |
          node -e "JSON.parse(require('fs').readFileSync('site/deployment/public-apps.json','utf8'))"
          grep -q 'two Hostinger Web Apps' site/deployment/public-apps.json
          grep -q 'legacy PHP shell' site/deployment/public-apps.json
          grep -q 'https://chess.dtfseeds.com' site/deployment/public-apps.json
          grep -q 'https://chess-api.dtfseeds.com' site/deployment/public-apps.json

      - name: Commit registry update
        run: |
          if git diff --quiet site/deployment/public-apps.json; then
            echo 'Registry already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/deployment/public-apps.json
          git commit -m 'Update Kush Kings managed runtime registry [skip kush registry]'
          git push
