name: Dispatch Public Suite on Source Change

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/high-land-web/**
      - apps/growlens-web/**
      - games/high-iq/**
      - games/high-life/**
      - games/grower-conversations/**
      - games/seed-man-platformer/**
      - site/public-route-patch/**
      - site/deployment/public-apps.json
      - .github/workflows/dispatch-public-suite-on-source-change.yml

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dtfseeds-public-suite-source-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Dispatch protected no-SSH Public Suite deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run deploy-public-suite-wordpress-v2.yml --ref main)"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Could not parse deployment run from: $run_url" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Protected Public Suite deployment run: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Report automatic Public Suite deployment
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          DEPLOY_RUN: ${{ steps.deploy.outputs.run_id }}
        with:
          script: |
            const run = process.env.DEPLOY_RUN
              ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.DEPLOY_RUN}`
              : 'not reached';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Automatic Public Suite source deployment',
                '',
                `Dispatcher: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Source commit: \`${context.sha}\``,
                `Result: **${process.env.STATUS}**`,
                `Protected deployment: ${run}`,
                '',
                'Public app and gateway source changes now automatically enter the validated no-SSH production path. The child workflow builds a fresh suite, publishes only allowlisted app/static routes through the transactional WordPress bridge, preserves WordPress ownership of canonical content routes, and runs independent live verification.'
              ].join('\n')
            });
