name: Dispatch Public Suite on Source Change

# Manual fallback only. Normal production pushes are coordinated by the
# DTFSeeds Production Gateway and the protected Public Suite deploy workflow's
# own path-filtered push trigger. A second automatic dispatcher caused the same
# source SHA to be published twice.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dtfseeds-public-suite-source-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Dispatch protected no-SSH Public Suite deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run deploy-public-suite-wordpress-v2.yml --ref main)"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Could not parse deployment run from: $run_url" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Protected Public Suite deployment run: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Report manual Public Suite deployment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          DEPLOY_RUN: ${{ steps.deploy.outputs.run_id }}
        with:
          script: |
            const run = process.env.DEPLOY_RUN
              ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.DEPLOY_RUN}`
              : 'not reached';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Manual Public Suite deployment',
                '',
                `Dispatcher: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Source commit: \`${context.sha}\``,
                `Result: **${process.env.STATUS}**`,
                `Protected deployment: ${run}`,
                '',
                'This workflow is a manual fallback. Normal source pushes use the Production Gateway plus the protected Public Suite workflow push trigger, preventing duplicate same-SHA production publishes.'
              ].join('\n')
            });
