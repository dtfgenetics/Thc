name: Dryback Browser Regression
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - site/public-route-patch/dryback-lab/**
      - site/public-route-patch/assets/thc-solution-irrigation-core-v1.mjs
      - scripts/audit-dryback-browser.mjs
      - .github/workflows/dryback-browser-regression.yml
  schedule:
    - cron: '37 9 * * *'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser check at three viewports
        run: node scripts/audit-dryback-browser.mjs
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dryback-browser-regression
          path: dryback-browser-results.json
          if-no-files-found: warn
          retention-days: 30
