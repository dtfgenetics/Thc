name: Publish Genetics Breeding V6 Visual Atlas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/wordpress/assets/infographics/genetics/**'
      - 'site/wordpress/education/genetics-breeding-v6-visual-map.json'
      - 'scripts/publish-wordpress-genetics-breeding-visuals-v6.mjs'
  workflow_run:
    workflows:
      - Core Learn V6 Canonical Route Production
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-genetics-breeding-visual-atlas-v6
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  publish:
    name: Publish Genetics Breeding V6 visual atlas
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_GENETICS_BREEDING_VISUALS_V6: 'true'
      GENETICS_BREEDING_VISUAL_MAP: site/wordpress/education/genetics-breeding-v6-visual-map.json
      BACKUP_ROOT: /tmp/dtf-genetics-breeding-visuals-v6

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Genetics Breeding visual mapping
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/publish-wordpress-genetics-breeding-visuals-v6.mjs
          node - <<'NODE'
          const fs=require('fs');
          const map=JSON.parse(fs.readFileSync('site/wordpress/education/genetics-breeding-v6-visual-map.json','utf8'));
          if(map.curriculumId!=='genetics-breeding-v6'||map.route!=='/learn/genetics-breeding/') throw new Error('Unexpected Genetics visual map owner/route.');
          const groups=Object.entries(map.chapters||{});
          const assets=groups.flatMap(([,items])=>items||[]);
          if(groups.length!==8||assets.length!==18) throw new Error(`Expected 8 groups and 18 visuals; found ${groups.length} and ${assets.length}.`);
          if((map.gaps||[]).length!==10) throw new Error(`Expected 10 explicit gaps; found ${(map.gaps||[]).length}.`);
          const bad=assets.filter(x=>!/\.(?:png|jpe?g|webp)$/i.test(x.file||'')||/draft|quarantine|superseded|legacy|qa[-_ ]?required/i.test(x.file||''));
          if(bad.length) throw new Error(`Unsafe mapped assets: ${bad.map(x=>x.file).join(', ')}`);
          for(const item of assets){if(!fs.existsSync(`site/wordpress/assets/infographics/${item.file}`)) throw new Error(`Mapped asset missing: ${item.file}`);}
          const imported=assets.filter(x=>String(x.file).startsWith('genetics/'));
          if(imported.length!==14) throw new Error(`Expected 14 dedicated genetics assets; found ${imported.length}.`);
          console.log(`Validated ${assets.length} canonical Genetics mappings, including ${imported.length} dedicated breeding assets, and ${map.gaps.length} explicit gaps.`);
          NODE

      - name: Publish and verify Genetics Breeding visual atlas
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/publish-wordpress-genetics-breeding-visuals-v6.mjs | tee "$RUNNER_TEMP/genetics-breeding-visuals-v6.log"
          report="$BACKUP_ROOT/report.json"
          test -s "$report"
          echo "visuals=$(node -p "require(process.argv[1]).visuals" "$report")" >> "$GITHUB_OUTPUT"
          echo "groups=$(node -p "require(process.argv[1]).groups" "$report")" >> "$GITHUB_OUTPUT"
          echo "wordpress=$(node -p "require(process.argv[1]).wordpressMedia" "$report")" >> "$GITHUB_OUTPUT"
          echo "fallbacks=$(node -p "require(process.argv[1]).canonicalFallbacks" "$report")" >> "$GITHUB_OUTPUT"
          echo "gaps=$(node -p "require(process.argv[1]).unresolvedGaps.length" "$report")" >> "$GITHUB_OUTPUT"

      - name: Independently verify public Genetics Breeding atlas
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/genetics-breeding-visual-atlas.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "$WP_SITE_URL/learn/genetics-breeding/?dtf_gb6v_final_verify=${GITHUB_RUN_ID}-${attempt}" --output "$body"
            if grep -Fqi 'data-dtf-genetics-breeding-visuals-v6="true"' "$body"; then ok=1; break; fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]]
          [[ "$(grep -Fo 'class="gb6v-card"' "$body" | wc -l | tr -d ' ')" = '18' ]]
          [[ "$(grep -Fo 'data-gb6v-group=' "$body" | wc -l | tr -d ' ')" = '8' ]]
          [[ "$(grep -Fo 'class="gb6v-gap"' "$body" | wc -l | tr -d ' ')" = '10' ]]
          grep -Fqi 'data-dtf-genetics-breeding-v6="true"' "$body"
          grep -Fqi 'data-dtf-topic="genetics-breeding"' "$body"
          grep -Fqi 'data-dtf-learning-v4="topic-genetics-breeding"' "$body"
          if grep -Eqi 'draft|quarantine|superseded|qa[-_ ]?required' "$body"; then
            echo 'Unsafe asset state label found in public Genetics atlas.' >&2
            exit 1
          fi

      - name: Upload Genetics Breeding visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genetics-breeding-visual-atlas-v6-${{ github.run_id }}
          path: |
            /tmp/dtf-genetics-breeding-visuals-v6
            ${{ runner.temp }}/genetics-breeding-visuals-v6.log
            ${{ runner.temp }}/genetics-breeding-visual-atlas.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report Genetics Breeding visual atlas result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          VALIDATE: ${{ steps.validate.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          VISUALS: ${{ steps.publish.outputs.visuals }}
          GROUPS: ${{ steps.publish.outputs.groups }}
          WORDPRESS: ${{ steps.publish.outputs.wordpress }}
          FALLBACKS: ${{ steps.publish.outputs.fallbacks }}
          GAPS: ${{ steps.publish.outputs.gaps }}
        with:
          script: |
            const body=[
              '## Genetics & Breeding V6 visual atlas','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `Mapping validation: **${process.env.VALIDATE || 'not-run'}**`,
              `WordPress publication: **${process.env.PUBLISH || 'not-run'}**`,
              `Visitor verification: **${process.env.VERIFY || 'not-run'}**`,
              `Verified visual cards: **${process.env.VISUALS || '0'}**`,
              `Chapter groups: **${process.env.GROUPS || '0'}**`,
              `WordPress-media resolutions: **${process.env.WORDPRESS || '0'}**`,
              `Canonical GitHub fallbacks: **${process.env.FALLBACKS || '0'}**`,
              `Explicit unresolved visual gaps: **${process.env.GAPS || '0'}**`,'',
              'The atlas is fail-closed and attaches only to the live Genetics & Breeding V6 curriculum. All 14 dedicated breeding visuals must exist in the canonical genetics asset directory before publication; exact-concept gaps remain visible rather than receiving generic cannabis imagery.'
            ].join('\n');
            for(const issue_number of [46,136]) await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number,body});
