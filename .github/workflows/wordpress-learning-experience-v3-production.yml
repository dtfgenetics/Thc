name: Publish DTFSeeds Learning Experience V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/rebuild-wordpress-learning-experience-v3.mjs
      - scripts/run-learning-v3-production.mjs
      - scripts/rebuild-wordpress-shared-shell-v3.mjs
      - scripts/reconcile-wordpress-learning-v3-ownership.mjs
      - scripts/improve-wordpress-learning-v4.mjs
      - scripts/wordpress-ipv4-fetch-bootstrap.mjs
      - scripts/fix-wordpress-home-release-visuals.mjs
      - scripts/wordpress-transient-fetch-bootstrap.mjs
      - scripts/flush-hostinger-litespeed-mcp.mjs
      - site/wordpress/education/topic-literature.json
      - site/wordpress/products/strain-card-images.json
      - .github/workflows/wordpress-learning-experience-v3-production.yml
      - .github/workflows/wordpress-home-release-visuals.yml
  workflow_run:
    workflows:
      - Publish THC Infographics to WordPress Production
    types: [completed]

permissions:
  contents: read
  issues: write

env:
  NODE_OPTIONS: --dns-result-order=ipv4first

concurrency:
  group: dtfseeds-learning-experience-v3
  cancel-in-progress: false

jobs:
  publish:
    name: Publish responsive shell Home Learn and THC subject hierarchy
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_SHARED_SHELL_V3: 'true'
      APPLY_LEARNING_V3: 'true'
      APPLY_LEARNING_V3_OWNERSHIP: 'true'
      BACKUP_ROOT: /tmp/dtf-learning-v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate publishers and protected credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          test -s scripts/rebuild-wordpress-learning-experience-v3.mjs
          test -s scripts/run-learning-v3-production.mjs
          test -s scripts/rebuild-wordpress-shared-shell-v3.mjs
          test -s scripts/reconcile-wordpress-learning-v3-ownership.mjs
          test -s scripts/improve-wordpress-learning-v4.mjs
          test -s scripts/wordpress-ipv4-fetch-bootstrap.mjs
          test -s site/wordpress/education/topic-literature.json
          node --check scripts/rebuild-wordpress-learning-experience-v3.mjs
          node --check scripts/run-learning-v3-production.mjs
          node --check scripts/rebuild-wordpress-shared-shell-v3.mjs
          node --check scripts/reconcile-wordpress-learning-v3-ownership.mjs
          node --check scripts/improve-wordpress-learning-v4.mjs
          node --check scripts/wordpress-ipv4-fetch-bootstrap.mjs
          grep -Fq 'family: 4' scripts/wordpress-ipv4-fetch-bootstrap.mjs
          grep -Fq '[wordpress-ipv4]' scripts/wordpress-ipv4-fetch-bootstrap.mjs
          grep -Fq 'exactly one published WordPress owner' scripts/reconcile-wordpress-learning-v3-ownership.mjs
          grep -Fq 'data-dtf-topic=' scripts/reconcile-wordpress-learning-v3-ownership.mjs
          grep -Fq 'data-dtf-learning-map="v4"' scripts/improve-wordpress-learning-v4.mjs
          grep -Fq 'See how the subjects connect before you go deep.' scripts/improve-wordpress-learning-v4.mjs
          grep -Fq 'dtf-strain-card-blue-mango-f2-regular' scripts/run-learning-v3-production.mjs
          grep -Fq 'dtf-strain-card-blue-mango-f2-feminized' scripts/run-learning-v3-production.mjs
          grep -Fq 'dtf-strain-card-blue-bubblegum-f1-regular' scripts/run-learning-v3-production.mjs
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('site/wordpress/education/topic-literature.json','utf8')); if(!Array.isArray(x.topics)||x.topics.length<10) process.exit(1); console.log('Canonical topics:',x.topics.length)"

      - name: Check whether V3 shared shell is already live
        id: shell_state
        shell: bash
        run: |
          set -euo pipefail
          needs_publish=false
          for route in / /learn/ /shop/; do
            body="$RUNNER_TEMP/shell-state-$(echo "$route" | tr '/' '_' | tr -cd '[:alnum:]_').html"
            if ! curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "https://dtfseeds.com${route}?dtf_shell_state=${GITHUB_RUN_ID}-$(date +%s%N)" --output "$body"; then
              needs_publish=true
              continue
            fi
            if ! grep -Fq 'data-dtf-shell="header-v3"' "$body" || ! grep -Fq 'data-dtf-shell="footer-v3"' "$body"; then
              needs_publish=true
            fi
          done
          echo "needs_publish=$needs_publish" >> "$GITHUB_OUTPUT"
          if [[ "$needs_publish" == 'true' ]]; then
            echo 'Shared V3 shell is not fully converged; authenticated template-part reconciliation is required.'
          else
            echo 'Shared V3 shell is already visitor-facing on Home, Learn, and Shop; skipping redundant WordPress REST mutation.'
          fi

      - name: Publish responsive shared header and footer
        id: shell
        if: ${{ steps.shell_state.outputs.needs_publish == 'true' }}
        shell: bash
        env:
          BACKUP_ROOT: /tmp/dtf-shared-shell-v3
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/rebuild-wordpress-shared-shell-v3.mjs | tee /tmp/dtf-shared-shell-v3-output.json

      - name: Reconcile WordPress Learning subject ownership
        id: ownership
        shell: bash
        env:
          LEARNING_V3_OWNERSHIP_MODE: reconcile
          TOPIC_LITERATURE_PATH: site/wordpress/education/topic-literature.json
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/reconcile-wordpress-learning-v3-ownership.mjs | tee /tmp/dtf-learning-v3-ownership-reconcile.json

      - name: Publish hierarchical learning experience
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/run-learning-v3-production.mjs | tee /tmp/dtf-learning-v3-output.json

      - name: Verify stored Learning ownership and markers
        id: storage
        shell: bash
        env:
          LEARNING_V3_OWNERSHIP_MODE: verify
          TOPIC_LITERATURE_PATH: /tmp/dtf-topic-literature-v3-normalized.json
        run: |
          set -euo pipefail
          test -s "$TOPIC_LITERATURE_PATH"
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/reconcile-wordpress-learning-v3-ownership.mjs | tee /tmp/dtf-learning-v3-ownership-verify.json

      - name: Apply connected Learning V4 map after canonical V3 publication
        id: hierarchy
        shell: bash
        env:
          APPLY_LEARNING_V4: 'true'
          BACKUP_ROOT: /tmp/dtf-learning-v4-final
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/improve-wordpress-learning-v4.mjs | tee /tmp/dtf-learning-v4-final-output.json

      - name: Verify live shared shell and learning routes
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-dtf-layout="home-v3"' scripts/rebuild-wordpress-learning-experience-v3.mjs
          grep -Fq 'data-dtf-layout="learn-v3"' scripts/rebuild-wordpress-learning-experience-v3.mjs
          grep -Fq 'data-dtf-topic=' scripts/rebuild-wordpress-learning-experience-v3.mjs
          grep -Fq 'data-dtf-shell="header-v3"' scripts/rebuild-wordpress-shared-shell-v3.mjs
          grep -Fq 'data-dtf-shell="footer-v3"' scripts/rebuild-wordpress-shared-shell-v3.mjs
          grep -Fq 'overflow-x:auto' scripts/rebuild-wordpress-shared-shell-v3.mjs
          grep -Fq 'water-root-zone' scripts/run-learning-v3-production.mjs
          grep -Fq 'plant-health-ipm' scripts/run-learning-v3-production.mjs
          grep -Fq '/seeds/' scripts/rebuild-wordpress-learning-experience-v3.mjs
          grep -Fq '/learn/start-here/' scripts/rebuild-wordpress-learning-experience-v3.mjs
          grep -Fq '/growlens/' scripts/rebuild-wordpress-learning-experience-v3.mjs
          grep -Fq '/thc-grow-doc/' scripts/rebuild-wordpress-learning-experience-v3.mjs
          grep -Fq '/gallery/' scripts/rebuild-wordpress-learning-experience-v3.mjs
          for route in / /learn/ /shop/; do
            body="$RUNNER_TEMP/shell-$(echo "$route" | tr '/' '_' | tr -cd '[:alnum:]_').html"
            ok=0
            for attempt in 1 2 3 4 5; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                "https://dtfseeds.com${route}?dtf_shell_v3=${GITHUB_RUN_ID}-${attempt}" --output "$body"
              if grep -Fq 'data-dtf-shell="header-v3"' "$body" && grep -Fq 'data-dtf-shell="footer-v3"' "$body"; then ok=1; break; fi
              sleep 5
            done
            test "$ok" -eq 1
          done

          learn_body="$RUNNER_TEMP/learn-connected-v4.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 45 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "https://dtfseeds.com/learn/?dtf_learning_owner=${GITHUB_RUN_ID}-${attempt}" --output "$learn_body"
            if \
              grep -Fq 'data-dtf-layout="learn-v3"' "$learn_body" && \
              grep -Fq 'dtf-learning-v4' "$learn_body" && \
              grep -Fq 'data-dtf-learning-map="v4"' "$learn_body" && \
              grep -Fq 'Different goals need different starting points.' "$learn_body" && \
              grep -Fq 'See how the subjects connect before you go deep.' "$learn_body" && \
              grep -Fq 'Explore the system behind your question.' "$learn_body"; then
              ok=1
              break
            fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]] || {
            echo 'Canonical Learn page did not expose the connected Learning V4 hierarchy.' >&2
            head -c 5000 "$learn_body" >&2 || true
            exit 1
          }

          home_body="$RUNNER_TEMP/home-reviewed-genetics.html"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "https://dtfseeds.com/?dtf_v3_genetics=${GITHUB_RUN_ID}-${attempt}" --output "$home_body"
            if \
              grep -Fq 'data-dtf-layout="home-v3"' "$home_body" && \
              grep -Fq 'Blue Mango F2 Regular DTF Genetics strain card' "$home_body" && \
              grep -Fq 'Blue Mango F2 Feminized DTF Genetics strain card' "$home_body" && \
              grep -Fq 'Blue Bubblegum F1 Regular DTF Genetics strain card' "$home_body"; then
              ok=1
              break
            fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]] || {
            echo 'Learning V3 Home did not publish the reviewed genetics hero/current-release artwork.' >&2
            grep -oiE 'Blue Mango[^<]{0,120}|Blue Bubblegum[^<]{0,120}' "$home_body" | head -50 >&2 || true
            exit 1
          }

      - name: Upload rollback snapshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-learning-v3-${{ github.run_id }}
          path: |
            /tmp/dtf-learning-v3
            /tmp/dtf-learning-v3-output.json
            /tmp/dtf-learning-v3-ownership-reconcile.json
            /tmp/dtf-learning-v3-ownership-verify.json
            /tmp/dtf-topic-literature-v3-normalized.json
            /tmp/dtf-learning-v4-final
            /tmp/dtf-learning-v4-final-output.json
            /tmp/dtf-shared-shell-v3
            /tmp/dtf-shared-shell-v3-output.json
            ${{ runner.temp }}/shell-state-*.html
            ${{ runner.temp }}/shell-*.html
            ${{ runner.temp }}/learn-connected-v4.html
            ${{ runner.temp }}/home-reviewed-genetics.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report learning hierarchy deployment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          SHELL_REQUIRED: ${{ steps.shell_state.outputs.needs_publish }}
          SHELL_OUTCOME: ${{ steps.shell.outcome }}
          OWNERSHIP_OUTCOME: ${{ steps.ownership.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          STORAGE_OUTCOME: ${{ steps.storage.outcome }}
          HIERARCHY_OUTCOME: ${{ steps.hierarchy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const source = context.eventName === 'workflow_run'
              ? context.payload.workflow_run?.html_url
              : context.eventName === 'push'
                ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`
                : 'manual dispatch';
            const body = [
              '## DTFSeeds learning experience v3',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Trigger: **${context.eventName}**`,
              `Overall: **${process.env.STATUS}**`,
              `Shared shell needed mutation: **${process.env.SHELL_REQUIRED || 'unknown'}**`,
              `Responsive shared shell mutation: **${process.env.SHELL_OUTCOME || 'not reached'}**`,
              `WordPress subject ownership reconciliation: **${process.env.OWNERSHIP_OUTCOME || 'not reached'}**`,
              `Learning publication: **${process.env.PUBLISH_OUTCOME || 'not reached'}**`,
              `Stored ownership/marker verification: **${process.env.STORAGE_OUTCOME || 'not reached'}**`,
              `Connected Learning V4 map: **${process.env.HIERARCHY_OUTCOME || 'not reached'}**`,
              `Live verification: **${process.env.VERIFY_OUTCOME || 'not reached'}**`,
              `Source: ${source}`,
              '',
              'Scope: responsive shared header/footer, Home, Learn, every canonical THC subject page, and the connected Learning V4 map.',
              'Visual hierarchy: the Home hero and current-release positions require reviewed DTF strain-card media; foundation subjects remain featured; specialized subjects remain compact; individual subject pages use literature-first section cards plus supporting visuals.',
              'The canonical Learning V3 owner reapplies the connected V4 map after stored V3 ownership is verified, so normal production publication cannot erase the visitor-facing learning map.',
              'Mobile navigation is a single horizontal rail instead of a multi-row wrapped header. Footer routes secondary destinations to Community, Gallery, About, Contact, and Discord.',
              'Canonical topic titles are normalized into stable layout aliases before publication so source IDs can evolve without breaking customer-facing routes.',
              'The shared shell is checked visitor-side first and its authenticated REST mutation is skipped when the V3 header/footer are already live on Home, Learn, and Shop.',
              'Before publication, every Learning subject slug must have a single published WordPress owner under the canonical Learn page and the exact /learn/<subject>/ permalink. Duplicate published owners fail closed instead of being guessed.',
              'After publication, the same ownership contract is re-read through authenticated WordPress REST and the stored V3 markers must be present before the connected V4 hierarchy and visitor-facing cache verification run.',
              'The publisher runs after the THC infographic publisher, which is the single upstream production handoff for the final Learning layer.',
              'Shared-shell, ownership, and Learning hierarchy WordPress REST calls are forced over IPv4 on GitHub runners to avoid the recurring Hostinger IPv6-unreachable/IPv4 timeout aggregate failure.',
              'After Learning verifies, the final Home release-card reconciler is invoked as a reusable workflow so the production chain does not exceed GitHub workflow_run depth limits.',
              'The publisher creates rollback snapshots, preserves the WooCommerce archive style injection, attempts a LiteSpeed cache flush, and performs cache-busted visitor verification on Home, Learn, Shop, and all subject routes.'
            ].join('\n');
            try {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 220, body });
            } catch (error) {
              core.warning(`Learning V3 advisory report could not be posted: ${error.message}`);
            }

  finalize_home:
    name: Run final Home visual owner
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    uses: ./.github/workflows/wordpress-home-release-visuals.yml
    secrets: inherit
