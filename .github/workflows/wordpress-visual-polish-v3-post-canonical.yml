name: Apply DTFSeeds Visual V3 After Canonical Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordpress-visual-polish-v3-post-canonical.yml'
      - 'scripts/improve-wordpress-learning-v4.mjs'
  workflow_run:
    workflows: ['Publish DTFSeeds WordPress Production']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dtfseeds-wordpress-v3-post-canonical
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com

jobs:
  v3:
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-v3-post-canonical
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V3 production layer
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/polish-wordpress-visual-site-v3.mjs
          node --check scripts/fix-wordpress-visual-polish-v3-cascade.mjs
          node --check scripts/improve-wordpress-learning-v4.mjs
      - name: Apply V3 after canonical WordPress publication
        id: apply
        env:
          APPLY_VISUAL_POLISH: 'true'
        run: |
          set -euo pipefail
          node scripts/polish-wordpress-visual-site-v3.mjs
      - name: Make V3 the final cascade layer
        id: cascade
        env:
          APPLY_V3_CASCADE_FIX: 'true'
        run: |
          set -euo pipefail
          node scripts/fix-wordpress-visual-polish-v3-cascade.mjs
      - name: Improve Learn information hierarchy
        id: learning
        env:
          APPLY_LEARNING_V4: 'true'
          BACKUP_ROOT: ${{ runner.temp }}/dtf-v3-post-canonical/learning-v4
        run: |
          set -euo pipefail
          node scripts/improve-wordpress-learning-v4.mjs
      - name: Verify live V3 presentation and Learning V4 hierarchy
        id: verify
        run: |
          set -euo pipefail
          verify() {
            local path="$1"
            local marker="$2"
            local body="$RUNNER_TEMP/$(echo "$path" | tr '/?' '__').html"
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 -fsSL --retry 2 --retry-delay 2 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "$WP_SITE_URL${path}?dtf_v3_post=${GITHUB_RUN_ID}-${attempt}" -o "$body"
              if grep -Fqi 'dtf-visual-polish-v3' "$body" && grep -Fqi "$marker" "$body"; then ok=1; break; fi
              sleep 7
            done
            [[ "$ok" -eq 1 ]] || { echo "Required visual layer not visible on $path: $marker" >&2; exit 1; }
          }
          verify '/' 'dtf-v3-spotlight'
          verify '/learn/' 'dtf-learning-v4'
          learn="$RUNNER_TEMP/_learn_.html"
          grep -Fqi 'Start with the question you are trying to answer.' "$learn"
          grep -Fqi 'See how the subjects connect before you go deep.' "$learn"
          grep -Fqi 'data-dtf-learning-map="v4"' "$learn"
          grep -Fqi '/learn/plant-biology/' "$learn"
          grep -Fqi '/learn/environment-vpd/' "$learn"
          grep -Fqi '/learn/water-ph-ec/' "$learn"
          grep -Fqi '/learn/training-canopy/' "$learn"
          grep -Fqi '/learn/ipm/' "$learn"
          grep -Fqi '/learn/harvest-postharvest/' "$learn"
          home="$RUNNER_TEMP/_.html"
          grep -Fqi 'dtf-shell-header' "$home"
          grep -Fqi 'dtf-shell-footer' "$home"
          grep -Fqi 'DTF Genetics cannabis leaf' "$home"
          grep -Fqi '/games/' "$home"
          grep -Fqi '/tools/' "$home"
      - name: Upload V3 and Learning V4 rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-v3-post-canonical-backup-${{ github.run_id }}
          path: |
            /tmp/dtf-v3-post-canonical
            ${{ runner.temp }}/dtf-v3-post-canonical
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize V3 post-canonical result
        if: always()
        env:
          STATUS: ${{ job.status }}
          APPLY: ${{ steps.apply.outcome }}
          CASCADE: ${{ steps.cascade.outcome }}
          LEARNING: ${{ steps.learning.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          {
            echo '## DTFSeeds V3 post-canonical visual deployment'
            echo
            echo "- Result: **${STATUS}**"
            echo "- V3 presentation write: **${APPLY:-not-run}**"
            echo "- Final cascade ordering: **${CASCADE:-not-run}**"
            echo "- Learning V4 hierarchy: **${LEARNING:-not-run}**"
            echo "- Live visual verification: **${VERIFY:-not-run}**"
            echo
            echo 'Learning V4 is applied after the V3 cascade so its connected learning map remains the final Learn-page structure.'
          } >> "$GITHUB_STEP_SUMMARY"

