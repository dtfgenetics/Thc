name: Apply DTFSeeds Visual V3 After Canonical Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dtfseeds-wordpress-v3-post-canonical
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com

jobs:
  v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-v3-post-canonical
      APPLY_SHARED_SHELL_V3: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V3 production layer
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/polish-wordpress-visual-site-v3.mjs
          node --check scripts/fix-wordpress-visual-polish-v3-cascade.mjs
          node --check scripts/lib/sitewide-header-template-v6.mjs
          node --check scripts/rebuild-wordpress-shared-shell-v3.mjs
          grep -Fq 'data-dtf-shell="header-v6"' scripts/lib/sitewide-header-template-v6.mjs
      - name: Apply V3 after canonical WordPress publication
        id: apply
        env:
          APPLY_VISUAL_POLISH: 'true'
        run: |
          set -euo pipefail
          node scripts/polish-wordpress-visual-site-v3.mjs
      - name: Make V3 the final cascade layer
        id: cascade
        env:
          APPLY_V3_CASCADE_FIX: 'true'
        run: |
          set -euo pipefail
          node scripts/fix-wordpress-visual-polish-v3-cascade.mjs
      - name: Restore canonical V6 shared navigation
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/rebuild-wordpress-shared-shell-v3.mjs
      - name: Verify live V3 presentation and V6 navigation
        id: verify
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/home.html"
          header="$RUNNER_TEMP/home-header.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 -fsSL --retry 2 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$WP_SITE_URL/?dtf_v3_post=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$body"
            if grep -Fqi 'dtf-visual-polish-v3' "$body" && grep -Fqi 'dtf-v3-spotlight' "$body" && grep -Fqi 'data-dtf-shell="header-v6"' "$body" && grep -Fqi 'data-dtf-sitewide-header="canonical-eight-v1"' "$body"; then ok=1; break; fi
            sleep 7
          done
          [[ "$ok" -eq 1 ]] || { echo 'Required V3 Home visual layer or canonical V6 header is not visible.' >&2; exit 1; }
          grep -Fqi 'dtf-footer-v3' "$body"
          grep -Fqi '/games/' "$body"
          grep -Fqi '/tools/' "$body"
          node - "$body" "$header" <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync(process.argv[2],'utf8');
          const match=source.match(/<header\b[^>]*data-dtf-shell=["']header-v6["'][^>]*>[\s\S]*?<\/header>/i);
          if(!match) throw new Error('V6 header fragment missing');
          fs.writeFileSync(process.argv[3],match[0]);
          NODE
          expected='Home|Seeds|Learn|Courses|Diagnostic|Games|Community|Shop'
          actual="$(node - "$header" <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync(process.argv[2],'utf8');
          const nav=source.match(/<nav\b[^>]*id=["']dtf-global-primary-nav["'][^>]*>([\s\S]*?)<\/nav>/i)?.[1]||'';
          process.stdout.write([...nav.matchAll(/<a\b[^>]*>([\s\S]*?)<\/a>/gi)].map(m=>m[1].replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim()).join('|'));
          NODE
          )"
          [[ "$actual" == "$expected" ]] || { echo "Unexpected Home V6 nav: $actual" >&2; exit 1; }
          for obsolete in '>Genetics</a>' '>Tools</a>'; do
            ! grep -Fqi -- "$obsolete" "$header" || { echo "Obsolete primary label remains: $obsolete" >&2; exit 1; }
          done
      - name: Upload V3 rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-v3-post-canonical-backup-${{ github.run_id }}
          path: /tmp/dtf-v3-post-canonical
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize V3 post-canonical result
        if: always()
        env:
          STATUS: ${{ job.status }}
          APPLY: ${{ steps.apply.outcome }}
          CASCADE: ${{ steps.cascade.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          {
            echo '## DTFSeeds V3 post-canonical visual deployment'
            echo
            echo "- Result: **${STATUS}**"
            echo "- V3 presentation write: **${APPLY:-not-run}**"
            echo "- Final cascade ordering: **${CASCADE:-not-run}**"
            echo "- Live Home V6 verification: **${VERIFY:-not-run}**"
            echo
            echo 'Legacy V3 is manual-only. After it runs, the canonical V6 Home / Seeds / Learn / Courses / Diagnostic / Games / Community / Shop shell is restored and verified so visual polish cannot regress the global header.'
          } >> "$GITHUB_STEP_SUMMARY"
