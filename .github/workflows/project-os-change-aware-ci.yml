name: Project OS Change-Aware CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-os-change-aware-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.changes.outputs.files }}
      broad: ${{ steps.plan.outputs.broad }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Determine changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          files="$(git diff --name-only "$base...$head" | paste -sd, -)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Build deterministic CI plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-project-os-ci-plan.mjs --files "${{ steps.changes.outputs.files }}" | tee "$RUNNER_TEMP/project-os-plan.json"
          broad="$(node -e "const p=require(process.argv[1]);process.stdout.write(String((p.broadChecks||[]).length>0))" "$RUNNER_TEMP/project-os-plan.json")"
          echo "broad=$broad" >> "$GITHUB_OUTPUT"

  narrow:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run narrow changed-area checks
        run: node scripts/run-project-os-ci-plan.mjs --files "${{ needs.plan.outputs.files }}" --stage narrow --execute

  broad:
    needs: [plan, narrow]
    if: needs.plan.outputs.broad == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run broad checks in a clean workspace
        run: node scripts/run-project-os-ci-plan.mjs --files "${{ needs.plan.outputs.files }}" --stage broad --execute
