name: Verify Visitor-Visible THC Infographics Without Learn Root Mutation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/ensure-learn-infographic-entry.mjs
      - .github/workflows/wordpress-learn-visible-production.yml

permissions:
  contents: read

concurrency:
  group: dtfseeds-learn-visible-retirement-guard
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Learn owner and infographic child route
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/ensure-learn-infographic-entry.mjs
          ! grep -Fq "method:'POST'" scripts/ensure-learn-infographic-entry.mjs
          ! grep -Fq "method: 'POST'" scripts/ensure-learn-infographic-entry.mjs
          node scripts/ensure-learn-infographic-entry.mjs
          body="$RUNNER_TEMP/infographics.html"
          curl -4 --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
            "$WP_SITE_URL/learn/infographics/?dtf_visual_guard=${GITHUB_RUN_ID}" -o "$body"
          grep -Eqi '<h1([ >])' "$body"
          grep -Fqi 'Teaching Healthy Cultivation' "$body"
          grep -Eqi '<img[^>]+wp-content/uploads/' "$body"
