name: Publish Visitor-Visible THC Infographics on Learn

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/ensure-learn-infographic-entry.mjs
      - .github/workflows/wordpress-learn-visible-production.yml

permissions:
  contents: read

# RETIRED PRODUCTION WRITER
# This workflow previously forced dtf-edu images and featured media back onto the
# visitor-facing Learn page, including image-count acceptance thresholds. That is
# incompatible with the approved-only visual policy. Keep the workflow name for
# historical/dependency compatibility, but make it read-only.
concurrency:
  group: dtfseeds-learn-visible-retired
  cancel-in-progress: true

jobs:
  retired-writer-guard:
    name: Legacy visitor-visible infographic writer disabled
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Enforce visual-quality policy
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const policy=require('./site/wordpress/visual-quality-policy.json');
          if(Number(policy.schemaVersion)<3 || policy.mode!=='quarantine') throw new Error('Visual quality quarantine policy v3+ is required.');
          if(policy.replacementPolicy?.legacyAutomaticInfographicPublishingAllowed!==false) throw new Error('Legacy infographic publishing must remain disabled.');
          if(policy.replacementPolicy?.legacyInfographicReuseAllowed!==false) throw new Error('Legacy infographic reuse must remain disabled.');
          if(policy.replacementPolicy?.automaticKeywordMediaSelectionAllowed!==false) throw new Error('Automatic keyword media selection must remain disabled.');
          console.log('Legacy Learn infographic writer is disabled.');
          NODE
          ! grep -Fq 'node scripts/ensure-learn-infographic-entry.mjs' .github/workflows/wordpress-learn-visible-production.yml

      - name: Confirm canonical Learn owner remains visitor-facing
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/learn.html"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --connect-timeout 20 --max-time 45 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
              "https://dtfseeds.com/learn/?dtf_retired_visible_guard=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$body"; then
              if grep -Fq 'data-dtf-layout="learn-v3"' "$body"; then ok=1; break; fi
            fi
            [[ "$attempt" -lt 6 ]] && sleep $((attempt * 3))
          done
          [[ "$ok" -eq 1 ]] || { echo 'Canonical Learning V3 owner was not observed; refusing legacy fallback publication.' >&2; exit 1; }
          echo 'Canonical Learning V3 remains visitor-facing; no legacy image mutation performed.'
