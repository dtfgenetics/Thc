name: High Land CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run High Land unit tests
        run: npm run test

      - name: Build High Land
        run: npm run build

      - name: Install Playwright Chromium
        run: npm --workspace apps/high-land-web exec -- playwright install --with-deps chromium

      - name: Run High Land browser smoke tests
        run: npm run test:e2e

      - name: Lint PHP room API files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(find apps/high-land-web -type f -name '*.php' -print0)
          if ((${#php_files[@]} == 0)); then
            echo "No PHP files found; lint not applicable."
            exit 0
          fi
          for file in "${php_files[@]}"; do
            php -l "$file"
          done

      - name: Verify room authorization and private storage contract
        shell: bash
        run: |
          set -euo pipefail
          api='apps/high-land-web/public/api'
          grep -Fq "'authHash' => api_auth_hash(\$authKey)" "$api/_shared.php"
          grep -Fq "unset(\$player['authHash'])" "$api/_shared.php"
          grep -Fq 'function api_require_player_auth' "$api/_shared.php"
          grep -Fq 'api_public_room($room)' "$api/create-room.php"
          grep -Fq 'api_public_room($room)' "$api/get-room.php"
          grep -Fq 'api_require_player_auth($room, $incomingPlayerId, $authKey)' "$api/join-room.php"
          grep -Fq 'api_require_player_auth($room, $playerId, $authKey)' "$api/update-room.php"
          grep -Fq 'api_require_player_auth($room, $playerId, $authKey)' "$api/append-event.php"
          grep -Fq 'Require all denied' "$api/_rooms/.htaccess"
          ! grep -Fq "'authHash'" "$api/get-room.php"
          grep -Fq 'high-land-room-auth-v1' apps/high-land-web/src/game/multiplayer/websiteRoomTransport.ts
          grep -Fq 'Secure room session is missing' apps/high-land-web/src/game/multiplayer/websiteRoomTransport.ts

      - name: Upload High Land build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: high-land-dist
          path: apps/high-land-web/dist
          if-no-files-found: error

      - name: Upload High Land Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: high-land-playwright-artifacts
          path: |
            apps/high-land-web/test-results
            apps/high-land-web/playwright-report
          if-no-files-found: ignore
