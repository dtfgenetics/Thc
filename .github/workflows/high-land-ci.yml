name: High Land CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/high-land-web/**'
      - 'games/high-land/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/high-land-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/high-land-web/**'
      - 'games/high-land/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/high-land-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run current High Land tests
        shell: bash
        run: |
          set -euo pipefail
          if npm run | grep -q 'test:high-land'; then
            npm run test:high-land
          else
            echo "No test:high-land script is defined for the current architecture."
          fi

      - name: Build current High Land implementation
        shell: bash
        run: |
          set -euo pipefail
          if npm run | grep -q 'build:high-land'; then
            npm run build:high-land
          else
            echo "No build:high-land script is defined for the current architecture."
          fi

      - name: Run optional current backend checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f apps/high-land-web/scripts/verify-room-api-security.mjs ]]; then
            node apps/high-land-web/scripts/verify-room-api-security.mjs
          fi
          if command -v php >/dev/null 2>&1 && [[ -d apps/high-land-web ]]; then
            while IFS= read -r -d '' file; do php -l "$file"; done < <(find apps/high-land-web -type f -name '*.php' -print0)
          fi

      - name: Inspect build artifact when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d apps/high-land-web/dist ]]; then
            test -f apps/high-land-web/dist/index.html
            echo "Current apps/high-land-web artifact found."
          else
            echo "No legacy apps/high-land-web/dist artifact; implementation may use a different output path."
          fi

      - name: Upload current High Land artifact when present
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: high-land-build
          path: |
            apps/high-land-web/dist
            games/high-land/dist
          if-no-files-found: ignore
