name: High Land CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/high-land-web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/high-land-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/high-land-web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/high-land-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run High Land deterministic tests
        run: npm run test

      - name: Build High Land
        run: npm run build

      - name: Verify room API security
        run: node apps/high-land-web/scripts/verify-room-api-security.mjs

      - name: Lint PHP room API files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(find apps/high-land-web -type f -name '*.php' -print0)
          if ((${#php_files[@]} == 0)); then
            echo "No PHP files found; lint not applicable."
            exit 0
          fi
          for file in "${php_files[@]}"; do
            php -l "$file"
          done

      - name: Verify built entrypoint and static assets
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/high-land-web/dist/index.html
          test -d apps/high-land-web/dist/assets
          test -n "$(find apps/high-land-web/dist/assets -type f -maxdepth 1 -print -quit)"

      - name: Upload High Land build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: high-land-dist
          path: apps/high-land-web/dist
          if-no-files-found: error
