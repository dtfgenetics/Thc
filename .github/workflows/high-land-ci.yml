name: High Land CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/high-land-web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/high-land-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/high-land-web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/high-land-ci.yml'

permissions:
  contents: read

concurrency:
  group: high-land-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce browser tool policy
        run: node scripts/verify-browser-tool-policy.mjs

      - name: Run canonical High Land deterministic tests
        run: npm run test:high-land

      - name: Build canonical High Land app
        run: npm run build:high-land

      - name: Lint PHP room API files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(find apps/high-land-web -type f -name '*.php' -print0)
          if ((${#php_files[@]} == 0)); then
            echo "No PHP files found; lint not applicable."
            exit 0
          fi
          for file in "${php_files[@]}"; do
            php -l "$file"
          done

      - name: Verify built entrypoint and static assets
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/high-land-web/dist/index.html
          test -d apps/high-land-web/dist/assets
          test -n "$(find apps/high-land-web/dist/assets -maxdepth 1 -type f -print -quit)"
          grep -Fq 'High Land: The Sweet Escape' apps/high-land-web/dist/index.html

      - name: Upload High Land build artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: high-land-dist-${{ github.sha }}
          path: apps/high-land-web/dist
          if-no-files-found: error
          retention-days: 14
