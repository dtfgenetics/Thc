name: Dispatch DTFSeeds Bulk Image Publisher

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 182 &&
       github.event.comment.body == '/publish-infographics' &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - name: Launch protected WordPress infographic publisher
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'wordpress-infographic-production.yml',
              ref: 'main'
            });

      - name: Record dispatch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 182,
              body: `Bulk image production dispatch accepted from run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`
            });
