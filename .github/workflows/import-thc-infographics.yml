name: Import THC Infographics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - site/wordpress/assets/infographics/import-*.json
      - .github/workflows/import-thc-infographics.yml
  schedule:
    - cron: '*/5 * * * *'
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: thc-infographic-import
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 46 && contains(github.event.comment.body, '/import-infographics'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import queued infographic assets
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import time
          import urllib.request

          root = pathlib.Path('site/wordpress/assets/infographics')
          manifests = sorted(root.glob('import-*.json'))
          summary_lines = ['## THC infographic import', '']
          failed_manifests = []
          completed_manifests = []
          imported_count = 0
          replaced_count = 0
          existing_count = 0

          def body_looks_like_image(body):
              return (
                  body.startswith(b'\x89PNG\r\n\x1a\n')
                  or body.startswith(b'\xff\xd8\xff')
                  or body.startswith((b'GIF87a', b'GIF89a'))
                  or (len(body) >= 12 and body[:4] == b'RIFF' and body[8:12] == b'WEBP')
              )

          def sha256_bytes(body):
              return hashlib.sha256(body).hexdigest()

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          if not manifests:
              print('No infographic import manifests; nothing to do.')
              summary_lines.append('No queued manifests were found.')
          else:
              for manifest in manifests:
                  print(f'Processing {manifest}')
                  failures = []
                  try:
                      data = json.loads(manifest.read_text(encoding='utf-8'))
                  except Exception as exc:
                      failures.append(f'manifest parse failed: {exc}')
                      data = {'assets': []}

                  assets = data.get('assets', [])
                  if not isinstance(assets, list):
                      failures.append('assets must be a list')
                      assets = []

                  for item in assets:
                      target = pathlib.Path(item.get('path', ''))
                      source_url = item.get('url')
                      expected_sha256 = (item.get('sha256') or '').strip().lower()
                      if not target.as_posix() or not source_url:
                          failures.append(f'invalid asset entry: {item!r}')
                          continue
                      if expected_sha256 and (len(expected_sha256) != 64 or any(c not in '0123456789abcdef' for c in expected_sha256)):
                          failures.append(f'{target}: invalid sha256 value {expected_sha256!r}')
                          continue

                      replacing_existing = False
                      if target.exists():
                          if expected_sha256:
                              current_sha256 = sha256_file(target)
                              if current_sha256 == expected_sha256:
                                  print(f'Already present with verified SHA-256; skipping: {target}')
                                  existing_count += 1
                                  continue
                              print(
                                  f'Existing file does not match approved SHA-256; replacing {target} '
                                  f'(current={current_sha256}, expected={expected_sha256})'
                              )
                              replacing_existing = True
                          elif target.stat().st_size >= 10000:
                              print(f'Already present; skipping download: {target}')
                              existing_count += 1
                              continue
                          else:
                              print(f'Existing file is undersized; replacing: {target}')
                              replacing_existing = True

                      last_error = None
                      for attempt in range(1, 4):
                          try:
                              request = urllib.request.Request(
                                  source_url,
                                  headers={'User-Agent': 'Mozilla/5.0 THC-Infographic-Importer/3.0'},
                              )
                              with urllib.request.urlopen(request, timeout=45) as response:
                                  body = response.read()
                                  content_type = response.headers.get('Content-Type', '')

                              if len(body) < 10000:
                                  raise RuntimeError(
                                      f'downloaded image is unexpectedly small ({len(body)} bytes)'
                                  )
                              if not content_type.startswith('image/') and not body_looks_like_image(body):
                                  raise RuntimeError(
                                      f'expected image content, got {content_type!r}'
                                  )

                              actual_sha256 = sha256_bytes(body)
                              if expected_sha256 and actual_sha256 != expected_sha256:
                                  raise RuntimeError(
                                      f'SHA-256 mismatch: expected {expected_sha256}, got {actual_sha256}'
                                  )

                              target.parent.mkdir(parents=True, exist_ok=True)
                              target.write_bytes(body)
                              print(
                                  f'Imported {target}: {len(body)} bytes, '
                                  f'{content_type or "signature-verified image"}, sha256={actual_sha256}'
                              )
                              if replacing_existing:
                                  replaced_count += 1
                              else:
                                  imported_count += 1
                              last_error = None
                              break
                          except Exception as exc:
                              last_error = exc
                              print(
                                  f'Attempt {attempt}/3 failed for {target}: {exc}',
                                  flush=True,
                              )
                              if attempt < 3:
                                  time.sleep(attempt * 3)

                      if last_error is not None:
                          failures.append(f'{target}: {last_error}')

                  if failures:
                      failed_manifests.append(manifest.name)
                      print(f'::warning title=Infographic manifest retained::{manifest.name}: ' + ' | '.join(failures))
                      summary_lines.append(f'- ⚠️ `{manifest.name}` retained: {len(failures)} failed asset(s)')
                      for failure in failures[:10]:
                          summary_lines.append(f'  - {failure}')
                  else:
                      manifest.unlink()
                      completed_manifests.append(manifest.name)
                      summary_lines.append(f'- ✅ `{manifest.name}` completed')

          summary_lines.extend([
              '',
              f'Imported assets: **{imported_count}**',
              f'Replaced stale/mismatched assets: **{replaced_count}**',
              f'Already-present verified assets skipped: **{existing_count}**',
              f'Completed manifests: **{len(completed_manifests)}**',
              f'Retained manifests needing refreshed source data: **{len(failed_manifests)}**',
          ])
          if failed_manifests:
              summary_lines.append('')
              summary_lines.append('Retained manifests: ' + ', '.join(f'`{name}`' for name in failed_manifests))

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as handle:
                  handle.write('\n'.join(summary_lines) + '\n')

      - name: Commit completed imports and queue cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site/wordpress/assets/infographics

          if git diff --cached --quiet; then
            echo 'No infographic changes to commit.'
            exit 0
          fi

          git commit -m 'Import available THC infographic assets'
          git pull --rebase origin main
          git push origin HEAD:main
