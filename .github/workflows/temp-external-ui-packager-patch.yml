name: Temporary External UI Packager Patch

on:
  push:
    branches:
      - release/ganjumanji-0-4-0-integration-20260912
    paths:
      - scripts/apply-external-ui-gate-packager-patch.py
      - .github/workflows/temp-external-ui-packager-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic packager patch
        run: python scripts/apply-external-ui-gate-packager-patch.py
      - name: Commit patched packager
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/package-public-suite-wordpress.py
          git commit -m 'Run deterministic UI validation for packaged external games'
          git push origin HEAD:${GITHUB_REF_NAME}
