name: Bootstrap Genetics Breeding Infographics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-genetics-breeding-infographics.yml'
      - 'site/wordpress/assets/infographics/import-genetics-breeding-001-014.json'
      - 'site/wordpress/assets/infographics/genetics-import-trigger.txt'

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dtf-genetics-breeding-infographic-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick jq

      - name: Download, validate, and normalize approved genetics visuals
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          manifest='site/wordpress/assets/infographics/import-genetics-breeding-001-014.json'
          target_dir='site/wordpress/assets/infographics/genetics'
          report="$RUNNER_TEMP/genetics-asset-bootstrap.tsv"
          : > "$report"

          if [[ ! -s "$manifest" ]]; then
            echo 'Genetics/Breeding import is intentionally inactive: no approved manifest is present.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            echo "report=$report" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          publication_allowed="$(jq -r '.publicationAllowed // false' "$manifest")"
          if [[ "$publication_allowed" != 'true' ]]; then
            echo 'Genetics/Breeding manifest is present but publicationAllowed is not true; preserving QA/quarantine state.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            echo "report=$report" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          total="$(jq '.assets | length' "$manifest")"
          if [[ "$total" != '14' ]]; then
            echo "Approved Genetics/Breeding manifest must contain exactly 14 assets; found $total." >&2
            exit 1
          fi

          mkdir -p "$target_dir"
          for i in $(seq 0 $((total-1))); do
            path="$(jq -r ".assets[$i].path" "$manifest")"
            url="$(jq -r ".assets[$i].url" "$manifest")"
            base="$(basename "$path")"
            tmp="$RUNNER_TEMP/${base}.download"
            out="$target_dir/$base"

            curl -4 --fail --silent --show-error --location --retry 4 --retry-delay 2 \
              --connect-timeout 25 --max-time 120 \
              -H 'User-Agent: Mozilla/5.0 DTFSeeds Genetics Asset Importer' \
              "$url" -o "$tmp"

            bytes="$(stat -c %s "$tmp")"
            mime="$(file -b --mime-type "$tmp")"
            if [[ "$mime" != image/* ]]; then
              echo "Rejected $base: MIME=$mime bytes=$bytes" >&2
              head -c 120 "$tmp" >&2 || true
              exit 1
            fi
            if (( bytes < 50000 )); then
              echo "Rejected $base: implausibly small image ($bytes bytes)" >&2
              exit 1
            fi

            dims="$(identify -format '%w %h' "$tmp" 2>/dev/null || true)"
            width="${dims%% *}"
            height="${dims##* }"
            if [[ -z "$width" || -z "$height" || "$width" -lt 900 || "$height" -lt 900 ]]; then
              echo "Rejected $base: dimensions ${width:-?}x${height:-?}" >&2
              exit 1
            fi

            convert "$tmp" -strip "$out"
            normalized_mime="$(file -b --mime-type "$out")"
            test "$normalized_mime" = 'image/png'
            normalized_dims="$(identify -format '%w %h' "$out")"
            normalized_bytes="$(stat -c %s "$out")"
            normalized_sha="$(sha256sum "$out" | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\t%s\n' "$base" "$normalized_dims" "$normalized_bytes" "$normalized_sha" "$url" >> "$report"
          done

          test "$(find "$target_dir" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = '14'
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          echo 'count=14' >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          cat "$report"

      - name: Safely integrate durable reviewed genetics assets
        id: integrate
        if: steps.assets.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_dir='site/wordpress/assets/infographics/genetics'
          changed=()
          while IFS= read -r -d '' path; do
            changed+=("$path")
          done < <(
            git diff --name-only -z -- "$target_dir"
            git ls-files --others --exclude-standard -z -- "$target_dir"
          )

          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo 'No genetics infographic asset changes to integrate.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Genetics bootstrap generated paths:\n'
          printf ' - %s\n' "${changed[@]}"
          node scripts/studio/integrate-generated-change.mjs \
            --message='Materialize reviewed genetics breeding infographics' \
            "${changed[@]}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genetics-breeding-infographic-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/genetics-asset-bootstrap.tsv
          if-no-files-found: warn
          retention-days: 30

      - name: Write authoritative bootstrap summary
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
          ENABLED: ${{ steps.assets.outputs.enabled }}
          COUNT: ${{ steps.assets.outputs.count }}
          CHANGED: ${{ steps.integrate.outputs.changed }}
        run: |
          {
            echo '## Genetics & Breeding infographic asset bootstrap'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Result before advisory reporting: **${STATUS:-unknown}**"
            echo "Approved import enabled: **${ENABLED:-false}**"
            echo "Validated reviewed assets: **${COUNT:-0} / 14**"
            echo "Safe repository integration requested: **${CHANGED:-false}**"
            echo
            echo 'No approved manifest means a successful no-op. QA-required/quarantined source material is never resurrected from history.'
            echo 'The Actions summary plus bootstrap artifact is authoritative. Issue comments are advisory only.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Best-effort legacy issue report
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          ENABLED: ${{ steps.assets.outputs.enabled }}
          COUNT: ${{ steps.assets.outputs.count }}
          CHANGED: ${{ steps.integrate.outputs.changed }}
        with:
          script: |
            const body = [
              '## Genetics & Breeding infographic asset bootstrap', '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `Approved import enabled: **${process.env.ENABLED || 'false'}**`,
              `Validated reviewed assets: **${process.env.COUNT || '0'} / 14**`,
              `Safe repository integration requested: **${process.env.CHANGED || 'false'}**`, '',
              'No approved manifest is a successful no-op. QA-required/quarantined source material is not reconstructed from Git history.'
            ].join('\n');
            for (const issue_number of [46,136]) {
              try {
                await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number,body});
              } catch (error) {
                core.warning(`Legacy genetics bootstrap report skipped for issue #${issue_number}: ${error.message}`);
              }
            }
