name: Publish THC Topic Literature to WordPress Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/publish-wordpress-topic-literature.mjs
      - site/wordpress/education/topic-literature.json
      - site/wordpress/assets/infographics/placement-rules.json
      - site/wordpress/assets/infographics/infographic-exclusions.json
      - .github/workflows/wordpress-topic-literature-production.yml
  workflow_run:
    workflows:
      - Publish DTFSeeds Learning Experience V3
      - Publish THC Infographics to WordPress Production
      - Publish Harvest Images Now
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-topic-literature-production
  cancel-in-progress: true

jobs:
  publish:
    name: Publish companion literature and searchable infographic index
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      BACKUP_ROOT: /tmp/wordpress-infographic-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate literature publisher and content model
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/publish-wordpress-topic-literature.mjs
          node -e "const d=require('./site/wordpress/education/topic-literature.json'); if(d.schemaVersion<1||!Array.isArray(d.topics)||d.topics.length<10) process.exit(1); for(const t of d.topics){if(!t.id||!t.route||!t.title||!Array.isArray(t.sections)||t.sections.length<4) process.exit(1)}"
          node -e "const e=require('./site/wordpress/assets/infographics/infographic-exclusions.json'); if(!e.neverUseOnInfographicSurfaces||!e.excludePathFragments?.includes('pdf-pages/')) process.exit(1)"
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Publish literature-first topic pages
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-wordpress-topic-literature.mjs
          backup_dir="$(cat "$BACKUP_ROOT/topic-literature-backup-path.txt")"
          report="$backup_dir/topic-literature-report.json"
          echo "topic_count=$(node -p "require(process.argv[1]).topicPages.length" "$report")" >> "$GITHUB_OUTPUT"
          echo "eligible_count=$(node -p "require(process.argv[1]).eligibleInfographics" "$report")" >> "$GITHUB_OUTPUT"
          echo "excluded_count=$(node -p "require(process.argv[1]).excludedSimpleReferenceMedia" "$report")" >> "$GITHUB_OUTPUT"
          echo "library_page_id=$(node -p "require(process.argv[1]).libraryPageId" "$report")" >> "$GITHUB_OUTPUT"

      - name: Verify visitor-facing literature and infographic search
        id: verify
        env:
          EXPECTED_CARD_COUNT: ${{ steps.publish.outputs.eligible_count }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_until() {
            local url="$1"
            local body="$2"
            local marker="$3"
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                "${url}?dtf_literature=${GITHUB_RUN_ID}-${attempt}" --output "$body"
              if grep -Fqi "$marker" "$body"; then ok=1; break; fi
              sleep 8
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Live verification did not observe '$marker' at $url" >&2
              exit 1
            fi
          }

          library="$RUNNER_TEMP/infographic-library.html"
          fetch_until 'https://dtfseeds.com/learn/infographics/' "$library" 'Searchable Infographic Library'
          grep -Fqi 'thc-infographic-search' "$library"
          grep -Fqi 'Read topic literature' "$library"
          grep -Fqi 'Quality rule:' "$library"

          python3 - "$library" "$EXPECTED_CARD_COUNT" <<'PY'
          import re, sys
          from html.parser import HTMLParser
          from urllib.parse import unquote

          class CardParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.article_depth = 0
                  self.cards = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  classes = set(attrs.get('class', '').split())
                  if tag == 'article' and 'thc-library-card' in classes and self.current is None:
                      self.current = {'text': [], 'urls': []}
                      self.article_depth = 1
                  elif tag == 'article' and self.current is not None:
                      self.article_depth += 1
                  if self.current is not None:
                      for key in ('src', 'href'):
                          if attrs.get(key): self.current['urls'].append(unquote(attrs[key]))
              def handle_endtag(self, tag):
                  if tag == 'article' and self.current is not None:
                      self.article_depth -= 1
                      if self.article_depth == 0:
                          self.cards.append(self.current)
                          self.current = None
              def handle_data(self, data):
                  if self.current is not None: self.current['text'].append(data)

          body = open(sys.argv[1], encoding='utf-8').read()
          expected = int(sys.argv[2])
          p = CardParser(); p.feed(body)
          if len(p.cards) != expected:
              raise SystemExit(f'Expected {expected} infographic cards, found {len(p.cards)}')
          forbidden = re.compile(r'(thc[\s_/-]*enc[\s_/-]*001[\s_/-]*vis|v04[\s_/-]*sup|pdf[\s_/-]*pages)', re.I)
          bad = []
          for card in p.cards:
              text = ' '.join(' '.join(card['text']).split())
              blob = text + ' ' + ' '.join(card['urls'])
              if forbidden.search(blob) or text.strip().lower() == 'page 01' or any(re.search(r'/page-0?1(?:[-.])', u, re.I) for u in card['urls']):
                  bad.append(blob[:500])
          if bad:
              print('Excluded simple/reference cards found:', *bad, sep='\n- ')
              raise SystemExit(1)
          print(f'Verified {len(p.cards)} public finished-infographic cards with no excluded support-image cards.')
          PY

          image_count="$(grep -Eoi '<img[^>]+wp-content/uploads/' "$library" | wc -l | tr -d ' ')"
          test "$image_count" -ge 20

          for route in plant-biology genetics-breeding lifecycle-propagation environment-vpd lighting water-ph-ec nutrition-media ipm training-canopy harvest-postharvest outdoor research-methods plant-science-reference; do
            page="$RUNNER_TEMP/topic-${route}.html"
            fetch_until "https://dtfseeds.com/learn/${route}/" "$page" 'Literature first:'
            grep -Fqi 'Use this in practice' "$page"
            grep -Fqi 'Infographics for' "$page"
            section_count="$(grep -Eo 'class="thc-section"' "$page" | wc -l | tr -d ' ')"
            test "$section_count" -ge 4
          done

          harvest="$RUNNER_TEMP/topic-harvest-postharvest.html"
          for marker in \
            'HARV 07 water activity vs moisture content' \
            'HARV 08 curing workflow moisture equalization' \
            'HARV 09 storage environment light heat oxygen moisture' \
            'HARV 10 post harvest degradation pathways' \
            'HARV 11 harvest wet trim vs dry trim process choices' \
            'HARV 12 post harvest quality control checklist' \
            'HARV 13 drying failure modes detailed' \
            'HARV 14 harvest resin contamination comparison' \
            'HARV 15 drying room sensor placement' \
            'HARV 16 drying room airflow mapping'; do
            grep -Fqi "$marker" "$harvest" || {
              echo "Harvest visual missing from final literature-first page: $marker" >&2
              exit 1
            }
          done

          echo "live_image_count=$image_count" >> "$GITHUB_OUTPUT"

      - name: Upload rollback and publication audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-topic-literature-${{ github.run_id }}
          path: /tmp/wordpress-infographic-backups
          if-no-files-found: warn
          retention-days: 30

      - name: Report topic-literature publication to issue 46
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          TOPIC_COUNT: ${{ steps.publish.outputs.topic_count }}
          ELIGIBLE_COUNT: ${{ steps.publish.outputs.eligible_count }}
          EXCLUDED_COUNT: ${{ steps.publish.outputs.excluded_count }}
          LIBRARY_PAGE_ID: ${{ steps.publish.outputs.library_page_id }}
          LIVE_IMAGE_COUNT: ${{ steps.verify.outputs.live_image_count }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## THC literature-first topic publication',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Trigger: **${context.eventName}**`,
                `Overall: **${process.env.JOB_STATUS}**`,
                `Validation: **${process.env.VALIDATE_OUTCOME || 'not-run'}**`,
                `WordPress publication: **${process.env.PUBLISH_OUTCOME || 'not-run'}**`,
                `Visitor-facing verification: **${process.env.VERIFY_OUTCOME || 'not-run'}**`,
                `Companion-literature topic pages: **${process.env.TOPIC_COUNT || 'not-run'}**`,
                `Finished infographic media retained: **${process.env.ELIGIBLE_COUNT || 'not-run'}**`,
                `Simple/reference media excluded from infographic reuse: **${process.env.EXCLUDED_COUNT || 'not-run'}**`,
                `Infographic library page ID: **${process.env.LIBRARY_PAGE_ID || 'not-run'}**`,
                `Infographic images observed on live searchable library: **${process.env.LIVE_IMAGE_COUNT || 'not-run'}**`,
                '',
                'Architecture: companion literature is canonical and now automatically reclaims final ownership after visual and Learning V3 publishers. Finished infographics live inside their designated topic pages and in the searchable infographic index. Simple supporting images and PDF page extractions are excluded from infographic surfaces.'
              ].join('\n')
            });
