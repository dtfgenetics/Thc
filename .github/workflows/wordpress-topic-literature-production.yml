name: Finalize THC Topic Literature and Infographic Library

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/publish-wordpress-topic-literature.mjs
      - scripts/publish-wordpress-infographics-canonical.sh
      - scripts/publish-wordpress-infographics-canonical-v2.sh
      - scripts/publish-wordpress-infographics-resilient.sh
      - scripts/assemble-outdoor-quantification-v1.mjs
      - site/wordpress/education/topic-literature.json
      - site/wordpress/education/outdoor-quantification-v1.json
      - site/wordpress/education/outdoor-quantification/**
      - site/wordpress/assets/infographics/placement-rules.json
      - site/wordpress/assets/infographics/infographic-exclusions.json
      - .github/workflows/wordpress-topic-literature-production.yml
  workflow_run:
    workflows:
      - Publish DTFSeeds Learning Experience V3
      - Publish Harvest Images Now
    types: [completed]

permissions:
  contents: write
  issues: write

# This is a downstream finalizer, not an independent writer. It deliberately
# shares the authoritative infographic lock and transaction so Learning V3 or a
# Harvest lane cannot leave a partial/stale library behind.
concurrency:
  group: dtfseeds-wordpress-infographics-production
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Restore and verify canonical learning asset ownership
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      INFOGRAPHIC_SOURCE_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
      INFOGRAPHIC_DIR: ${{ github.workspace }}/.tmp/eligible-infographics
      INFOGRAPHIC_PLACEMENT_CONFIG: ${{ github.workspace }}/site/wordpress/assets/infographics/placement-rules.json
      INFOGRAPHIC_EXCLUSIONS: ${{ github.workspace }}/site/wordpress/assets/infographics/infographic-exclusions.json
      BULK_INFOGRAPHIC_MANIFEST: ${{ github.workspace }}/site/wordpress/imports/infographic-bulk-import.json
      BULK_IMPORT_REPORT: /tmp/infographic-bulk-import-report.json
      TOPIC_LITERATURE_CONFIG: ${{ github.workspace }}/site/wordpress/education/topic-literature.json
      BACKUP_ROOT: /tmp/wordpress-infographic-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassert the complete canonical infographic and literature state
        run: bash scripts/publish-wordpress-infographics-resilient.sh

      - name: Upload final-owner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-literature-final-owner-${{ github.run_id }}
          path: |
            /tmp/wordpress-infographic-backups
            /tmp/infographic-bulk-import-report.json
            ${{ runner.temp }}/infographic-library.html
            ${{ runner.temp }}/outdoor.html
            ${{ runner.temp }}/infographic-transaction-attempt-*.log
          if-no-files-found: warn
          retention-days: 30
