name: Reconcile DTF Shop SEO Metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/reconcile-aioseo-shop-meta.mjs
      - .github/workflows/aioseo-shop-meta-production.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-aioseo-shop-meta
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_AIOSEO_SHOP_META: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate guarded Shop metadata publisher
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/reconcile-aioseo-shop-meta.mjs
          node --check scripts/flush-hostinger-litespeed-mcp.mjs

      - name: Reconcile Shop title and meta description
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reconcile-aioseo-shop-meta.mjs | tee "$RUNNER_TEMP/shop-meta.log"
          grep -Fq '"verified": true' "$RUNNER_TEMP/shop-meta.log" || grep -Fq '"verified":true' "$RUNNER_TEMP/shop-meta.log"

      - name: Purge Hostinger LiteSpeed cache
        shell: bash
        run: |
          set -euo pipefail
          node scripts/flush-hostinger-litespeed-mcp.mjs

      - name: Verify Shop metadata from fresh visitor request
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          (async () => {
            const expected = 'Shop current DTF Genetics seed releases with documented lineage, generation details, and direct links to verified product listings.';
            const response = await fetch(`https://dtfseeds.com/shop/?dtf_shop_seo=${Date.now()}`, {
              headers: { 'Cache-Control': 'no-cache, no-store, max-age=0', Pragma: 'no-cache', 'User-Agent': 'DTFSeeds-Shop-SEO-Verify/1.0' },
              redirect: 'follow'
            });
            const html = await response.text();
            const title = (html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] || '').replace(/\s+/g, ' ').trim();
            let description = '';
            for (const tag of html.match(/<meta\b[^>]*>/gi) || []) {
              const name = tag.match(/name=["']([^"']+)["']/i)?.[1]?.toLowerCase() || '';
              if (name !== 'description') continue;
              description = tag.match(/content=["']([^"']*)["']/i)?.[1] || '';
              break;
            }
            if (!response.ok) throw new Error(`Shop returned HTTP ${response.status}`);
            if (!title.includes('DTF Genetics Shop')) throw new Error(`Unexpected Shop title: ${title}`);
            if (description !== expected) throw new Error(`Unexpected Shop description: ${description}`);
            console.log(`Verified Shop SEO metadata: title=${title}; descriptionLength=${description.length}`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Report Shop SEO reconciliation
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Shop SEO metadata reconciliation',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Commit: \`${context.sha}\``,
                `Result: **${process.env.STATUS}**`,
                '',
                'This guarded AIOSEO update round-trips the existing Shop SEO record, changes only the Shop title and meta description, checks critical SEO/social fields for unintended drift, purges LiteSpeed, and verifies the visitor-facing HTML.'
              ].join('\n')
            });
