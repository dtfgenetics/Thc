name: Reconcile DTF Shop SEO Metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/reconcile-aioseo-shop-meta.mjs
      - .github/workflows/aioseo-shop-meta-production.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-aioseo-shop-meta
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_AIOSEO_SHOP_META: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate guarded Shop metadata publisher
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/reconcile-aioseo-shop-meta.mjs
          node --check scripts/flush-hostinger-litespeed-mcp.mjs

      - name: Reconcile Shop title and meta description
        shell: bash
        run: |
          set -uo pipefail
          node scripts/reconcile-aioseo-shop-meta.mjs 2>&1 | tee "$RUNNER_TEMP/shop-meta.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            if grep -Fq 'AIOSEO Shop state saved but public metadata did not verify' "$RUNNER_TEMP/shop-meta.log"; then
              echo 'AIOSEO Shop state persisted; preliminary visitor verification was cache-stale. Continuing to the explicit LiteSpeed purge before the authoritative visitor check.'
            else
              exit "$status"
            fi
          fi

      - name: Purge Hostinger LiteSpeed cache
        shell: bash
        run: |
          set -euo pipefail
          node scripts/flush-hostinger-litespeed-mcp.mjs

      - name: Verify Shop metadata from fresh visitor request
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          (async () => {
            const expected = 'Shop current DTF Genetics seed releases with documented lineage, generation details, and direct links to verified product listings.';
            let last = null;
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              const response = await fetch(`https://dtfseeds.com/shop/?dtf_shop_seo=${Date.now()}-${attempt}`, {
                headers: { 'Cache-Control': 'no-cache, no-store, max-age=0', Pragma: 'no-cache', 'User-Agent': 'DTFSeeds-Shop-SEO-Verify/1.1' },
                redirect: 'follow'
              });
              const html = await response.text();
              const title = (html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] || '').replace(/\s+/g, ' ').trim();
              let description = '';
              for (const tag of html.match(/<meta\b[^>]*>/gi) || []) {
                const name = tag.match(/name=["']([^"']+)["']/i)?.[1]?.toLowerCase() || '';
                if (name !== 'description') continue;
                description = tag.match(/content=["']([^"']*)["']/i)?.[1] || '';
                break;
              }
              last = { status: response.status, title, description };
              if (response.ok && title.includes('DTF Genetics Shop') && description === expected) {
                console.log(`Verified Shop SEO metadata: title=${title}; descriptionLength=${description.length}; attempt=${attempt}`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 4000));
            }
            throw new Error(`Shop metadata did not converge after cache purge: ${JSON.stringify(last)}`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Report Shop SEO reconciliation
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Shop SEO metadata reconciliation',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Commit: \`${context.sha}\``,
                `Result: **${process.env.STATUS}**`,
                '',
                'This guarded AIOSEO update round-trips the existing Shop SEO record, changes only the Shop title and meta description, checks critical SEO/social fields for unintended drift, then purges LiteSpeed before the authoritative visitor-facing verification.'
              ].join('\n')
            });
