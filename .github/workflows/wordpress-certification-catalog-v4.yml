name: Validate Legacy Certification Catalog V4

on:
  pull_request:
    paths:
      - site/wordpress/education/course-catalog-v4.json
      - scripts/publish-wordpress-certification-catalog-v4.mjs
      - .github/workflows/wordpress-certification-catalog-v4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate legacy V4 source only
        run: |
          node --check scripts/publish-wordpress-certification-catalog-v4.mjs
          node scripts/publish-wordpress-certification-catalog-v4.mjs --validate-only
      - name: Explain production ownership
        run: echo 'Catalog V4 is retained as legacy source validation only. Catalog V5 owns production publication so public Technician I course links cannot be overwritten.'
