name: Publish THC Infographics to WordPress Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/wordpress/assets/infographics/**
      - site/public-route-patch/learn/infographics/**
      - scripts/deploy-wordpress-infographic-library-rest.mjs
      - scripts/polish-wordpress-infographic-section.mjs
      - .github/workflows/wordpress-infographic-production.yml
  workflow_run:
    workflows:
      - Stage DTFSeeds WordPress Canonical Deployment
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-infographics-production
  cancel-in-progress: true

jobs:
  preflight:
    name: Expose production run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report protected publisher launch
        uses: actions/github-script@v7
        with:
          script: |
            const source = context.eventName === 'workflow_run'
              ? context.payload.workflow_run?.html_url
              : context.eventName === 'push'
                ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`
                : 'manual dispatch';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Protected THC infographic production started',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Trigger: **${context.eventName}**`,
                `Source: ${source}`,
                'The protected production job synchronizes canonical education media, maps visuals into the correct topic pages, rebuilds the visual library, and sets topic-appropriate featured images for URL/share presentation.'
              ].join('\n')
            });

  publish:
    name: Upload education images and publish infographic library
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      INFOGRAPHIC_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
      BACKUP_ROOT: /tmp/wordpress-infographic-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require successful trusted handoff
        if: github.event_name == 'workflow_run'
        run: '[[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]'

      - name: Validate publisher and production access
        id: access
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          node --check scripts/polish-wordpress-infographic-section.mjs
          node -e "const c=require('./site/wordpress/assets/infographics/placement-rules.json'); if(c.schemaVersion<2||!c.primaryOverrides?.length) process.exit(1)"
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          count="$(find site/wordpress/assets/infographics -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) | wc -l | tr -d ' ')"
          test "$count" -ge 20
          echo "user_present=true" >> "$GITHUB_OUTPUT"
          echo "password_present=true" >> "$GITHUB_OUTPUT"

      - name: Upload WordPress media and publish mapped topic pages
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy-wordpress-infographic-library-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-infographic-backup-path.txt")"
          result="$backup_dir/deployment-result.json"
          echo "source_count=$(node -p "require(process.argv[1]).sourceImageCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "uploaded_count=$(node -p "require(process.argv[1]).uploadedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "reused_count=$(node -p "require(process.argv[1]).reusedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "page_id=$(node -p "require(process.argv[1]).pageId" "$result")" >> "$GITHUB_OUTPUT"
          echo "topic_count=$(node -p "require(process.argv[1]).topicPages.length" "$result")" >> "$GITHUB_OUTPUT"

      - name: Rebuild polished visual library and URL images
        id: polish
        env:
          APPLY_INFOGRAPHIC_POLISH: 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/polish-wordpress-infographic-section.mjs
          polish_dir="$(cat "$BACKUP_ROOT/infographic-polish-backup-path.txt")"
          report="$polish_dir/infographic-polish-report.json"
          echo "gallery_count=$(node -p "require(process.argv[1]).mediaCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "topic_count=$(node -p "require(process.argv[1]).topicPageCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "featured_media_id=$(node -p "require(process.argv[1]).masterFeaturedMediaId" "$report")" >> "$GITHUB_OUTPUT"

      - name: Verify live WordPress infographic library and topic placement
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          fetch_until() {
            local url="$1"
            local body="$2"
            local marker="$3"
            local require_image="${4:-true}"
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                "${url}?dtf_infographics=${GITHUB_RUN_ID}-${attempt}" --output "$body"
              if grep -Fqi "$marker" "$body"; then
                if [[ "$require_image" != true ]] || grep -Eqi '<img[^>]+wp-content/uploads/' "$body"; then
                  ok=1
                  break
                fi
              fi
              sleep 8
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Live verification did not observe '$marker' at $url" >&2
              exit 1
            fi
          }

          page="$RUNNER_TEMP/infographic-library.html"
          fetch_until 'https://dtfseeds.com/learn/infographics/' "$page" 'THC Visual Learning Library' true
          image_count="$(grep -Eoi '<img[^>]+wp-content/uploads/' "$page" | wc -l | tr -d ' ')"
          test "$image_count" -ge 30
          grep -Fqi 'Plant Biology & Anatomy' "$page"
          grep -Fqi 'Nutrition & Media' "$page"
          grep -Fqi 'Plant Health & IPM' "$page"
          grep -Fqi 'Find the right visual faster.' "$page"

          for route in plant-biology nutrition-media ipm lifecycle-propagation; do
            topic="$RUNNER_TEMP/topic-${route}.html"
            fetch_until "https://dtfseeds.com/learn/${route}/" "$topic" 'Learn the topic visually.' true
          done

          featured_json="$RUNNER_TEMP/featured.json"
          curl -4 --fail --silent --show-error --location \
            --user "${WP_API_USERNAME}:${WP_API_PASSWORD}" \
            "https://dtfseeds.com/wp-json/wp/v2/pages/${{ steps.publish.outputs.page_id }}?context=edit&_fields=id,featured_media" \
            --output "$featured_json"
          node -e "const r=require(process.argv[1]); if(!(r.featured_media>0)) throw new Error('Featured media missing'); console.log('Verified library featured media:',r.featured_media)" "$featured_json"
          echo "live_image_count=$image_count" >> "$GITHUB_OUTPUT"

      - name: Upload infographic deployment audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-infographic-production-${{ github.run_id }}
          path: /tmp/wordpress-infographic-backups
          if-no-files-found: warn
          retention-days: 30

      - name: Report infographic publication to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          USER_PRESENT: ${{ steps.access.outputs.user_present }}
          PASSWORD_PRESENT: ${{ steps.access.outputs.password_present }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          POLISH_OUTCOME: ${{ steps.polish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_COUNT: ${{ steps.publish.outputs.source_count }}
          UPLOADED_COUNT: ${{ steps.publish.outputs.uploaded_count }}
          REUSED_COUNT: ${{ steps.publish.outputs.reused_count }}
          PAGE_ID: ${{ steps.publish.outputs.page_id }}
          TOPIC_COUNT: ${{ steps.polish.outputs.topic_count }}
          GALLERY_COUNT: ${{ steps.polish.outputs.gallery_count }}
          FEATURED_MEDIA_ID: ${{ steps.polish.outputs.featured_media_id }}
          LIVE_IMAGE_COUNT: ${{ steps.verify.outputs.live_image_count }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## THC infographic WordPress publication',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Protected job result: **${process.env.JOB_STATUS}**`,
                `Media synchronization and topic placement: **${process.env.PUBLISH_OUTCOME || 'not-run'}**`,
                `Visual redesign and URL featured-image update: **${process.env.POLISH_OUTCOME || 'not-run'}**`,
                `Live verification: **${process.env.VERIFY_OUTCOME || 'not-run'}**`,
                `Source-controlled images processed: **${process.env.SOURCE_COUNT || 'not-run'}**`,
                `New WordPress media uploads: **${process.env.UPLOADED_COUNT || 'not-run'}**`,
                `Existing WordPress media reused: **${process.env.REUSED_COUNT || 'not-run'}**`,
                `Infographic page ID: **${process.env.PAGE_ID || 'not-run'}**`,
                `Topic pages populated: **${process.env.TOPIC_COUNT || 'not-run'}**`,
                `Education media in polished gallery: **${process.env.GALLERY_COUNT || 'not-run'}**`,
                `Library featured media / URL image ID: **${process.env.FEATURED_MEDIA_ID || 'not-run'}**`,
                `Images observed on live library page: **${process.env.LIVE_IMAGE_COUNT || 'not-run'}**`,
                '',
                'Target: https://dtfseeds.com/learn/infographics/',
                'Canonical media is mapped with refined topic rules. The library and topic pages use poster-style non-cropping cards, topic navigation, responsive grids, and WordPress featured media for URL/share presentation.'
              ].join('\n')
            });
