name: Publish THC Infographics to WordPress Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/wordpress/assets/infographics/**
      - site/public-route-patch/learn/infographics/**
      - .github/workflows/wordpress-infographic-production.yml
  workflow_run:
    workflows:
      - Stage DTFSeeds WordPress Canonical Deployment
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-infographics-production
  cancel-in-progress: true

jobs:
  preflight:
    name: Expose production run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report protected publisher launch
        uses: actions/github-script@v7
        with:
          script: |
            const source = context.eventName === 'workflow_run'
              ? context.payload.workflow_run?.html_url
              : context.eventName === 'push'
                ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`
                : 'manual dispatch';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Protected THC infographic production started',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Trigger: **${context.eventName}**`,
                `Source: ${source}`,
                'The next job enters the protected `production` environment and publishes the source-controlled image library.'
              ].join('\n')
            });

  publish:
    name: Upload education images and publish infographic library
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      INFOGRAPHIC_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
      BACKUP_ROOT: ${{ runner.temp }}/wordpress-infographic-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require successful trusted handoff
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]

      - name: Validate protected infographic publisher
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          test -d site/wordpress/assets/infographics
          test -s site/wordpress/assets/infographics/Cannabis_Plant_Anatomy_Infographic.png
          test -s site/wordpress/assets/infographics/Nutrient_Uptake_and_Root_Zone_Chemistry.png
          count="$(find site/wordpress/assets/infographics -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) | wc -l | tr -d ' ')"
          test "$count" -ge 20
          echo "Source-controlled images queued: $count" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect protected WordPress credentials
        id: access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${WP_API_USERNAME:-}" ]] && user_present=true || user_present=false
          [[ -n "${WP_API_PASSWORD:-}" ]] && password_present=true || password_present=false
          echo "user_present=$user_present" >> "$GITHUB_OUTPUT"
          echo "password_present=$password_present" >> "$GITHUB_OUTPUT"
          if [[ "$user_present" == true && "$password_present" == true ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload WordPress media and publish library
        id: publish
        if: steps.access.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy-wordpress-infographic-library-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-infographic-backup-path.txt")"
          result="$backup_dir/deployment-result.json"
          echo "source_count=$(node -p "require(process.argv[1]).sourceImageCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "uploaded_count=$(node -p "require(process.argv[1]).uploadedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "reused_count=$(node -p "require(process.argv[1]).reusedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "page_id=$(node -p "require(process.argv[1]).pageId" "$result")" >> "$GITHUB_OUTPUT"

      - name: Verify live WordPress infographic library
        id: verify
        if: steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/infographic-library.html"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache' \
              "https://dtfseeds.com/learn/infographics/?dtf_infographics=${GITHUB_RUN_ID}-${attempt}" \
              --output "$page"
            if grep -Fqi 'THC Infographic Library' "$page" && grep -Eqi '<img[^>]+wp-content/uploads/' "$page"; then
              ok=1
              break
            fi
            sleep 10
          done
          [[ "$ok" -eq 1 ]]
          image_count="$(grep -Eoi '<img[^>]+wp-content/uploads/' "$page" | wc -l | tr -d ' ')"
          test "$image_count" -ge 10
          echo "live_image_count=$image_count" >> "$GITHUB_OUTPUT"

      - name: Fail when WordPress credentials are absent
        if: steps.access.outputs.available != 'true'
        run: exit 1

      - name: Upload infographic deployment audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-infographic-production-${{ github.run_id }}
          path: ${{ runner.temp }}/wordpress-infographic-backups
          if-no-files-found: warn
          retention-days: 30

      - name: Report infographic publication to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          USER_PRESENT: ${{ steps.access.outputs.user_present }}
          PASSWORD_PRESENT: ${{ steps.access.outputs.password_present }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_COUNT: ${{ steps.publish.outputs.source_count }}
          UPLOADED_COUNT: ${{ steps.publish.outputs.uploaded_count }}
          REUSED_COUNT: ${{ steps.publish.outputs.reused_count }}
          PAGE_ID: ${{ steps.publish.outputs.page_id }}
          LIVE_IMAGE_COUNT: ${{ steps.verify.outputs.live_image_count }}
        with:
          script: |
            const body = [
              '## THC infographic WordPress publication',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Protected job result: **${process.env.JOB_STATUS}**`,
              `WordPress username configured: **${process.env.USER_PRESENT || 'false'}**`,
              `WordPress application password configured: **${process.env.PASSWORD_PRESENT || 'false'}**`,
              `Media/page publish outcome: **${process.env.PUBLISH_OUTCOME || 'not-run'}**`,
              `Live verification outcome: **${process.env.VERIFY_OUTCOME || 'not-run'}**`,
              `Source-controlled images processed: **${process.env.SOURCE_COUNT || 'not-run'}**`,
              `New WordPress media uploads: **${process.env.UPLOADED_COUNT || 'not-run'}**`,
              `Existing WordPress media reused: **${process.env.REUSED_COUNT || 'not-run'}**`,
              `Infographic page ID: **${process.env.PAGE_ID || 'not-run'}**`,
              `Images observed on live library page: **${process.env.LIVE_IMAGE_COUNT || 'not-run'}**`,
              '',
              'Target: https://dtfseeds.com/learn/infographics/',
              'The publisher is idempotent by source path + SHA-256 and never deletes WordPress media. It only creates/updates the Teaching Healthy Cultivation infographic child page and uploads missing source-controlled images.',
              'No credential values are included in this report.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body
            });
