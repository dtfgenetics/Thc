name: Publish THC Infographics to WordPress Production

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - site/wordpress/assets/infographics/**
      - site/wordpress/imports/infographic-bulk-import.json
      - site/wordpress/education/topic-literature.json
      - site/wordpress/education/outdoor-quantification-v1.json
      - site/wordpress/education/outdoor-quantification/**
      - scripts/import-wordpress-infographic-remote-batch.mjs
      - scripts/stage-eligible-infographics.mjs
      - scripts/deploy-wordpress-infographic-library-rest.mjs
      - scripts/publish-wordpress-topic-literature.mjs
      - scripts/assemble-outdoor-quantification-v1.mjs
      - scripts/enhance-wordpress-outdoor-quantification-v1.mjs
      - .github/workflows/wordpress-infographic-production.yml
  workflow_run:
    workflows:
      - Stage DTFSeeds WordPress Canonical Deployment
    types: [completed]

permissions:
  contents: write
  issues: write

concurrency:
  group: dtfseeds-wordpress-infographics-production
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 182 &&
       github.event.comment.body == '/publish-infographics' &&
       github.event.comment.user.login == github.repository_owner)
    name: Expose production run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report protected publisher launch
        uses: actions/github-script@v7
        with:
          script: |
            const source = context.eventName === 'workflow_run'
              ? context.payload.workflow_run?.html_url
              : context.eventName === 'push'
                ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`
                : context.eventName === 'issue_comment'
                  ? context.payload.comment?.html_url
                  : 'manual dispatch';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 182,
              body: [
                '## Protected THC infographic production started',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Trigger: **${context.eventName}**`,
                `Source: ${source}`,
                'This run imports the queued bulk image manifest, filters simple/reference images, synchronizes only eligible infographic assets, publishes literature-first topic pages, assembles the complete eight-section Outdoor field-measurement curriculum, and verifies the public result.'
              ].join('\n')
            });

  publish:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 182 &&
       github.event.comment.body == '/publish-infographics' &&
       github.event.comment.user.login == github.repository_owner)
    name: Publish filtered infographics inside literature-first topics
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      INFOGRAPHIC_SOURCE_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
      INFOGRAPHIC_DIR: ${{ github.workspace }}/.tmp/eligible-infographics
      INFOGRAPHIC_PLACEMENT_CONFIG: ${{ github.workspace }}/site/wordpress/assets/infographics/placement-rules.json
      INFOGRAPHIC_EXCLUSIONS: ${{ github.workspace }}/site/wordpress/assets/infographics/infographic-exclusions.json
      BULK_INFOGRAPHIC_MANIFEST: ${{ github.workspace }}/site/wordpress/imports/infographic-bulk-import.json
      BULK_IMPORT_REPORT: ${{ runner.temp }}/infographic-bulk-import-report.json
      TOPIC_LITERATURE_CONFIG: ${{ github.workspace }}/site/wordpress/education/topic-literature.json
      BACKUP_ROOT: /tmp/wordpress-infographic-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require successful trusted handoff
        if: github.event_name == 'workflow_run'
        run: '[[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]'

      - name: Validate publishers, literature, Outdoor curriculum, bulk intake, and production access
        id: access
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/import-wordpress-infographic-remote-batch.mjs
          node --check scripts/stage-eligible-infographics.mjs
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          node --check scripts/publish-wordpress-topic-literature.mjs
          node --check scripts/assemble-outdoor-quantification-v1.mjs
          node --check scripts/enhance-wordpress-outdoor-quantification-v1.mjs
          node -e "const m=require('./site/wordpress/imports/infographic-bulk-import.json'); if(m.schemaVersion!==1||!Array.isArray(m.assets)) process.exit(1)"
          node -e "const c=require('./site/wordpress/assets/infographics/placement-rules.json'); if(c.schemaVersion<2||!c.primaryOverrides?.length) process.exit(1)"
          node -e "const e=require('./site/wordpress/assets/infographics/infographic-exclusions.json'); if(!e.neverUseOnInfographicSurfaces||!e.excludePathFragments?.includes('pdf-pages/')) process.exit(1)"
          node -e "const d=require('./site/wordpress/education/topic-literature.json'); if(!Array.isArray(d.topics)||d.topics.length<10||d.topics.some(t=>!Array.isArray(t.sections)||t.sections.length<4)) process.exit(1)"

          node scripts/assemble-outdoor-quantification-v1.mjs --write | tee "$RUNNER_TEMP/outdoor-assembly-validation.json"
          grep -Fq '"sections": 8' "$RUNNER_TEMP/outdoor-assembly-validation.json"
          grep -Fq '"subtopics": 32' "$RUNNER_TEMP/outdoor-assembly-validation.json"
          node -e "const r=require(process.argv[1]); if(!(r.metrics>=100)) throw new Error('Outdoor metric set too thin: '+r.metrics);" "$RUNNER_TEMP/outdoor-assembly-validation.json"

          node scripts/enhance-wordpress-outdoor-quantification-v1.mjs --validate-only | tee "$RUNNER_TEMP/outdoor-quantification-validation.json"
          grep -Fq '"sections": 8' "$RUNNER_TEMP/outdoor-quantification-validation.json"
          grep -Fq '"subtopics": 32' "$RUNNER_TEMP/outdoor-quantification-validation.json"
          node -e "const r=require(process.argv[1]); if(!(r.metrics>=100)) throw new Error('Published Outdoor metric set too thin: '+r.metrics);" "$RUNNER_TEMP/outdoor-quantification-validation.json"

          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          echo "user_present=true" >> "$GITHUB_OUTPUT"
          echo "password_present=true" >> "$GITHUB_OUTPUT"

      - name: Download and validate queued bulk infographic images
        id: intake
        shell: bash
        run: |
          set -euo pipefail
          node scripts/import-wordpress-infographic-remote-batch.mjs
          echo "requested=$(node -p "require(process.argv[1]).requestedAssets" "$BULK_IMPORT_REPORT")" >> "$GITHUB_OUTPUT"
          echo "created=$(node -p "require(process.argv[1]).created" "$BULK_IMPORT_REPORT")" >> "$GITHUB_OUTPUT"
          echo "updated=$(node -p "require(process.argv[1]).updated" "$BULK_IMPORT_REPORT")" >> "$GITHUB_OUTPUT"
          echo "reused=$(node -p "require(process.argv[1]).reused" "$BULK_IMPORT_REPORT")" >> "$GITHUB_OUTPUT"

      - name: Persist imported image binaries in canonical source
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DTF Bulk Image Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add site/wordpress/assets/infographics
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Import queued THC infographic assets'
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage only finished infographic assets
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-eligible-infographics.mjs
          report="$BACKUP_ROOT/infographic-quality-gate.json"
          echo "source_count=$(node -p "require(process.argv[1]).sourceImageCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "eligible_count=$(node -p "require(process.argv[1]).eligibleImageCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "excluded_count=$(node -p "require(process.argv[1]).excludedImageCount" "$report")" >> "$GITHUB_OUTPUT"

      - name: Normalize WebP assets for WordPress compatibility
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          converted=0
          while IFS= read -r -d '' file; do
            output="${file%.*}.png"
            ffmpeg -hide_banner -loglevel error -y -i "$file" -frames:v 1 "$output"
            test -s "$output"
            rm "$file"
            converted=$((converted + 1))
          done < <(find "$INFOGRAPHIC_DIR" -type f -iname '*.webp' -print0)
          echo "Normalized ${converted} WebP infographic asset(s) to PNG for WordPress upload."

      - name: Upload eligible WordPress media and map infographic topics
        id: publish_media
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy-wordpress-infographic-library-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-infographic-backup-path.txt")"
          result="$backup_dir/deployment-result.json"
          echo "uploaded_count=$(node -p "require(process.argv[1]).uploadedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "reused_count=$(node -p "require(process.argv[1]).reusedMediaCount" "$result")" >> "$GITHUB_OUTPUT"

      - name: Publish companion literature and searchable infographic index
        id: literature
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-wordpress-topic-literature.mjs
          backup_dir="$(cat "$BACKUP_ROOT/topic-literature-backup-path.txt")"
          report="$backup_dir/topic-literature-report.json"
          echo "topic_count=$(node -p "require(process.argv[1]).topicPages.length" "$report")" >> "$GITHUB_OUTPUT"
          echo "gallery_count=$(node -p "require(process.argv[1]).eligibleInfographics" "$report")" >> "$GITHUB_OUTPUT"
          echo "wp_excluded_count=$(node -p "require(process.argv[1]).excludedSimpleReferenceMedia" "$report")" >> "$GITHUB_OUTPUT"
          echo "page_id=$(node -p "require(process.argv[1]).libraryPageId" "$report")" >> "$GITHUB_OUTPUT"

      - name: Publish complete Outdoor field-measurement curriculum
        id: outdoor_quant
        env:
          APPLY_OUTDOOR_QUANT_V1: 'true'
          BACKUP_ROOT: /tmp/wordpress-infographic-backups/outdoor-quantification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/enhance-wordpress-outdoor-quantification-v1.mjs | tee "$RUNNER_TEMP/outdoor-quantification-publish.log"
          report="$(find "$BACKUP_ROOT" -name report.json -type f -print -quit)"
          test -n "$report"
          test -s "$report"
          echo "sections=$(node -p "require(process.argv[1]).validation.sections" "$report")" >> "$GITHUB_OUTPUT"
          echo "subtopics=$(node -p "require(process.argv[1]).validation.subtopics" "$report")" >> "$GITHUB_OUTPUT"
          echo "metrics=$(node -p "require(process.argv[1]).validation.metrics" "$report")" >> "$GITHUB_OUTPUT"
          [[ "$(node -p "require(process.argv[1]).validation.sections" "$report")" = '8' ]]
          [[ "$(node -p "require(process.argv[1]).validation.subtopics" "$report")" = '32' ]]

      - name: Verify live literature-first topics and searchable infographic library
        id: verify
        env:
          EXPECTED_CARD_COUNT: ${{ steps.literature.outputs.gallery_count }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_until() {
            local url="$1"
            local body="$2"
            local marker="$3"
            local require_image="${4:-false}"
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                "${url}?dtf_infographics=${GITHUB_RUN_ID}-${attempt}" --output "$body"
              if grep -Fqi "$marker" "$body"; then
                if [[ "$require_image" != true ]] || grep -Eqi '<img[^>]+wp-content/uploads/' "$body"; then
                  ok=1
                  break
                fi
              fi
              sleep 8
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Live verification did not observe '$marker' at $url" >&2
              exit 1
            fi
          }

          library="$RUNNER_TEMP/infographic-library.html"
          fetch_until 'https://dtfseeds.com/learn/infographics/' "$library" 'Searchable Infographic Library' true
          grep -Fqi 'thc-infographic-search' "$library"
          grep -Fqi 'Read topic literature' "$library"
          grep -Fqi 'Quality rule:' "$library"

          python3 - "$library" "$EXPECTED_CARD_COUNT" <<'PY'
          import re, sys
          from html.parser import HTMLParser
          from urllib.parse import unquote

          class CardParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.article_depth = 0
                  self.cards = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  classes = set(attrs.get('class', '').split())
                  if tag == 'article' and 'thc-library-card' in classes and self.current is None:
                      self.current = {'text': [], 'urls': []}
                      self.article_depth = 1
                  elif tag == 'article' and self.current is not None:
                      self.article_depth += 1
                  if self.current is not None:
                      for key in ('src', 'href'):
                          if attrs.get(key): self.current['urls'].append(unquote(attrs[key]))
              def handle_endtag(self, tag):
                  if tag == 'article' and self.current is not None:
                      self.article_depth -= 1
                      if self.article_depth == 0:
                          self.cards.append(self.current)
                          self.current = None
              def handle_data(self, data):
                  if self.current is not None: self.current['text'].append(data)

          body = open(sys.argv[1], encoding='utf-8').read()
          expected = int(sys.argv[2])
          p = CardParser(); p.feed(body)
          if len(p.cards) != expected:
              raise SystemExit(f'Expected {expected} infographic cards, found {len(p.cards)}')
          forbidden = re.compile(r'(thc[\s_/-]*enc[\s_/-]*001[\s_/-]*vis|v04[\s_/-]*sup|pdf[\s_/-]*pages)', re.I)
          bad = []
          for card in p.cards:
              text = ' '.join(' '.join(card['text']).split())
              blob = text + ' ' + ' '.join(card['urls'])
              if forbidden.search(blob) or text.strip().lower() == 'page 01' or any(re.search(r'/page-0?1(?:[-.])', u, re.I) for u in card['urls']):
                  bad.append(blob[:500])
          if bad:
              print('Excluded simple/reference cards found:', *bad, sep='\n- ')
              raise SystemExit(1)
          print(f'Verified {len(p.cards)} public finished-infographic cards with no excluded support-image cards.')
          PY

          image_count="$(grep -Eoi '<img[^>]+wp-content/uploads/' "$library" | wc -l | tr -d ' ')"
          test "$image_count" -ge 20

          for route in plant-biology genetics-breeding lifecycle-propagation environment-vpd lighting water-ph-ec nutrition-media ipm training-canopy harvest-postharvest outdoor research-methods plant-science-reference; do
            topic="$RUNNER_TEMP/topic-${route}.html"
            fetch_until "https://dtfseeds.com/learn/${route}/" "$topic" 'Literature first:' false
            grep -Fqi 'Use this in practice' "$topic"
            grep -Fqi 'Infographics for' "$topic"
            section_count="$(grep -Eo 'class="thc-section"' "$topic" | wc -l | tr -d ' ')"
            test "$section_count" -ge 4
            if [[ "$route" == outdoor ]]; then
              grep -Fq 'data-dtf-outdoor-quantification-v1="true"' "$topic"
              [[ "$(grep -Fo 'data-oqv1-chapter=' "$topic" | wc -l | tr -d ' ')" = '8' ]]
              [[ "$(grep -Fo 'data-oqv1-subtopic=' "$topic" | wc -l | tr -d ' ')" = '32' ]]
              grep -Fq 'data-oqv1-chapter="site-sun"' "$topic"
              grep -Fq 'data-oqv1-chapter="rain-flower-risk"' "$topic"
              grep -Fq 'data-oqv1-chapter="pests-wildlife"' "$topic"
              grep -Fq 'data-oqv1-chapter="pollen-sex"' "$topic"
              grep -Fq 'data-oqv1-chapter="season-microclimate"' "$topic"
              grep -Fq 'Turn outdoor observations into evidence.' "$topic"
            fi
          done

          featured_json="$RUNNER_TEMP/featured.json"
          curl -4 --fail --silent --show-error --location \
            --user "${WP_API_USERNAME}:${WP_API_PASSWORD}" \
            "https://dtfseeds.com/wp-json/wp/v2/pages/${{ steps.literature.outputs.page_id }}?context=edit&_fields=id,featured_media" \
            --output "$featured_json"
          node -e "const r=require(process.argv[1]); if(!(r.featured_media>0)) throw new Error('Featured media missing');" "$featured_json"
          echo "live_image_count=$image_count" >> "$GITHUB_OUTPUT"

      - name: Upload infographic deployment audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-infographic-production-${{ github.run_id }}
          path: |
            /tmp/wordpress-infographic-backups
            ${{ runner.temp }}/infographic-bulk-import-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report infographic publication to control issue
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          INTAKE_OUTCOME: ${{ steps.intake.outcome }}
          QUEUED_COUNT: ${{ steps.intake.outputs.requested }}
          CREATED_COUNT: ${{ steps.intake.outputs.created }}
          UPDATED_COUNT: ${{ steps.intake.outputs.updated }}
          INTAKE_REUSED_COUNT: ${{ steps.intake.outputs.reused }}
          CANONICAL_COMMIT: ${{ steps.canonical.outputs.commit }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          MEDIA_OUTCOME: ${{ steps.publish_media.outcome }}
          LITERATURE_OUTCOME: ${{ steps.literature.outcome }}
          OUTDOOR_QUANT_OUTCOME: ${{ steps.outdoor_quant.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_COUNT: ${{ steps.quality.outputs.source_count }}
          ELIGIBLE_COUNT: ${{ steps.quality.outputs.eligible_count }}
          EXCLUDED_COUNT: ${{ steps.quality.outputs.excluded_count }}
          UPLOADED_COUNT: ${{ steps.publish_media.outputs.uploaded_count }}
          REUSED_COUNT: ${{ steps.publish_media.outputs.reused_count }}
          TOPIC_COUNT: ${{ steps.literature.outputs.topic_count }}
          GALLERY_COUNT: ${{ steps.literature.outputs.gallery_count }}
          WP_EXCLUDED_COUNT: ${{ steps.literature.outputs.wp_excluded_count }}
          LIVE_IMAGE_COUNT: ${{ steps.verify.outputs.live_image_count }}
          OUTDOOR_SECTIONS: ${{ steps.outdoor_quant.outputs.sections }}
          OUTDOOR_SUBTOPICS: ${{ steps.outdoor_quant.outputs.subtopics }}
          OUTDOOR_METRICS: ${{ steps.outdoor_quant.outputs.metrics }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 182,
              body: [
                '## THC infographic + companion literature publication',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Protected job result: **${process.env.JOB_STATUS}**`,
                `Bulk intake: **${process.env.INTAKE_OUTCOME || 'not-run'}**`,
                `Batch URLs queued: **${process.env.QUEUED_COUNT || '0'}**`,
                `New canonical image files: **${process.env.CREATED_COUNT || '0'}**`,
                `Intentional replacements: **${process.env.UPDATED_COUNT || '0'}**`,
                `Canonical image files reused: **${process.env.INTAKE_REUSED_COUNT || '0'}**`,
                `Canonical image commit: ${process.env.CANONICAL_COMMIT ? `\`${process.env.CANONICAL_COMMIT}\`` : 'none required'}`,
                `Infographic quality gate: **${process.env.QUALITY_OUTCOME || 'not-run'}**`,
                `Eligible media synchronization: **${process.env.MEDIA_OUTCOME || 'not-run'}**`,
                `Companion literature publication: **${process.env.LITERATURE_OUTCOME || 'not-run'}**`,
                `Outdoor field curriculum publication: **${process.env.OUTDOOR_QUANT_OUTCOME || 'not-run'}**`,
                `Visitor-facing verification: **${process.env.VERIFY_OUTCOME || 'not-run'}**`,
                `Source images inspected: **${process.env.SOURCE_COUNT || 'not-run'}**`,
                `Finished infographic images staged: **${process.env.ELIGIBLE_COUNT || 'not-run'}**`,
                `Simple/reference source images excluded: **${process.env.EXCLUDED_COUNT || 'not-run'}**`,
                `New WordPress media uploads: **${process.env.UPLOADED_COUNT || 'not-run'}**`,
                `Existing eligible WordPress media reused: **${process.env.REUSED_COUNT || 'not-run'}**`,
                `Literature-first topic pages: **${process.env.TOPIC_COUNT || 'not-run'}**`,
                `Finished infographic media in searchable index: **${process.env.GALLERY_COUNT || 'not-run'}**`,
                `Previously uploaded simple/reference media filtered from reuse: **${process.env.WP_EXCLUDED_COUNT || 'not-run'}**`,
                `Images observed on live searchable library: **${process.env.LIVE_IMAGE_COUNT || 'not-run'}**`,
                `Outdoor quantified sections: **${process.env.OUTDOOR_SECTIONS || 'not-run'}**`,
                `Outdoor quantified subtopics: **${process.env.OUTDOOR_SUBTOPICS || 'not-run'}**`,
                `Outdoor field metrics: **${process.env.OUTDOOR_METRICS || 'not-run'}**`,
                '',
                'Target: https://dtfseeds.com/learn/infographics/',
                'Canonical architecture: queued remote images are imported first; topic literature is published first; the complete THC Outdoor field-measurement curriculum is assembled and appended immediately after that canonical write; finished infographics remain subject-mapped and searchable.'
              ].join('\n')
            });
