name: Publish THC Infographics to WordPress Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/wordpress/assets/infographics/**
      - site/wordpress/education/topic-literature.json
      - scripts/stage-eligible-infographics.mjs
      - scripts/deploy-wordpress-infographic-library-rest.mjs
      - scripts/publish-wordpress-topic-literature.mjs
      - .github/workflows/wordpress-infographic-production.yml
  workflow_run:
    workflows:
      - Stage DTFSeeds WordPress Canonical Deployment
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-infographics-production
  cancel-in-progress: true

jobs:
  preflight:
    name: Expose production run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report protected publisher launch
        uses: actions/github-script@v7
        with:
          script: |
            const source = context.eventName === 'workflow_run'
              ? context.payload.workflow_run?.html_url
              : context.eventName === 'push'
                ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`
                : 'manual dispatch';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Protected THC infographic production started',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Trigger: **${context.eventName}**`,
                `Source: ${source}`,
                'This run filters simple/reference images, synchronizes only eligible infographic assets, publishes literature-first topic pages, and verifies the searchable infographic index semantically.'
              ].join('\n')
            });

  publish:
    name: Publish filtered infographics inside literature-first topics
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      INFOGRAPHIC_SOURCE_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
      INFOGRAPHIC_DIR: ${{ github.workspace }}/.tmp/eligible-infographics
      INFOGRAPHIC_PLACEMENT_CONFIG: ${{ github.workspace }}/site/wordpress/assets/infographics/placement-rules.json
      INFOGRAPHIC_EXCLUSIONS: ${{ github.workspace }}/site/wordpress/assets/infographics/infographic-exclusions.json
      TOPIC_LITERATURE_CONFIG: ${{ github.workspace }}/site/wordpress/education/topic-literature.json
      BACKUP_ROOT: /tmp/wordpress-infographic-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require successful trusted handoff
        if: github.event_name == 'workflow_run'
        run: '[[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]'

      - name: Validate publishers, literature, and production access
        id: access
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stage-eligible-infographics.mjs
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          node --check scripts/publish-wordpress-topic-literature.mjs
          node -e "const c=require('./site/wordpress/assets/infographics/placement-rules.json'); if(c.schemaVersion<2||!c.primaryOverrides?.length) process.exit(1)"
          node -e "const e=require('./site/wordpress/assets/infographics/infographic-exclusions.json'); if(!e.neverUseOnInfographicSurfaces||!e.excludePathFragments?.includes('pdf-pages/')) process.exit(1)"
          node -e "const d=require('./site/wordpress/education/topic-literature.json'); if(!Array.isArray(d.topics)||d.topics.length<10||d.topics.some(t=>!Array.isArray(t.sections)||t.sections.length<4)) process.exit(1)"
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          echo "user_present=true" >> "$GITHUB_OUTPUT"
          echo "password_present=true" >> "$GITHUB_OUTPUT"

      - name: Stage only finished infographic assets
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-eligible-infographics.mjs
          report="$BACKUP_ROOT/infographic-quality-gate.json"
          echo "source_count=$(node -p "require(process.argv[1]).sourceImageCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "eligible_count=$(node -p "require(process.argv[1]).eligibleImageCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "excluded_count=$(node -p "require(process.argv[1]).excludedImageCount" "$report")" >> "$GITHUB_OUTPUT"

      - name: Upload eligible WordPress media and map infographic topics
        id: publish_media
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy-wordpress-infographic-library-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-infographic-backup-path.txt")"
          result="$backup_dir/deployment-result.json"
          echo "uploaded_count=$(node -p "require(process.argv[1]).uploadedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "reused_count=$(node -p "require(process.argv[1]).reusedMediaCount" "$result")" >> "$GITHUB_OUTPUT"

      - name: Publish companion literature and searchable infographic index
        id: literature
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-wordpress-topic-literature.mjs
          backup_dir="$(cat "$BACKUP_ROOT/topic-literature-backup-path.txt")"
          report="$backup_dir/topic-literature-report.json"
          echo "topic_count=$(node -p "require(process.argv[1]).topicPages.length" "$report")" >> "$GITHUB_OUTPUT"
          echo "gallery_count=$(node -p "require(process.argv[1]).eligibleInfographics" "$report")" >> "$GITHUB_OUTPUT"
          echo "wp_excluded_count=$(node -p "require(process.argv[1]).excludedSimpleReferenceMedia" "$report")" >> "$GITHUB_OUTPUT"
          echo "page_id=$(node -p "require(process.argv[1]).libraryPageId" "$report")" >> "$GITHUB_OUTPUT"

      - name: Verify live literature-first topics and searchable infographic library
        id: verify
        env:
          EXPECTED_CARD_COUNT: ${{ steps.literature.outputs.gallery_count }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_until() {
            local url="$1"
            local body="$2"
            local marker="$3"
            local require_image="${4:-false}"
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                "${url}?dtf_infographics=${GITHUB_RUN_ID}-${attempt}" --output "$body"
              if grep -Fqi "$marker" "$body"; then
                if [[ "$require_image" != true ]] || grep -Eqi '<img[^>]+wp-content/uploads/' "$body"; then
                  ok=1
                  break
                fi
              fi
              sleep 8
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Live verification did not observe '$marker' at $url" >&2
              exit 1
            fi
          }

          library="$RUNNER_TEMP/infographic-library.html"
          fetch_until 'https://dtfseeds.com/learn/infographics/' "$library" 'Searchable Infographic Library' true
          grep -Fqi 'thc-infographic-search' "$library"
          grep -Fqi 'Read topic literature' "$library"
          grep -Fqi 'Quality rule:' "$library"

          python3 - "$library" "$EXPECTED_CARD_COUNT" <<'PY'
          import re, sys
          from html.parser import HTMLParser
          from urllib.parse import unquote

          class CardParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.article_depth = 0
                  self.cards = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  classes = set(attrs.get('class', '').split())
                  if tag == 'article' and 'thc-library-card' in classes and self.current is None:
                      self.current = {'text': [], 'urls': []}
                      self.article_depth = 1
                  elif tag == 'article' and self.current is not None:
                      self.article_depth += 1
                  if self.current is not None:
                      for key in ('src', 'href'):
                          if attrs.get(key): self.current['urls'].append(unquote(attrs[key]))
              def handle_endtag(self, tag):
                  if tag == 'article' and self.current is not None:
                      self.article_depth -= 1
                      if self.article_depth == 0:
                          self.cards.append(self.current)
                          self.current = None
              def handle_data(self, data):
                  if self.current is not None: self.current['text'].append(data)

          body = open(sys.argv[1], encoding='utf-8').read()
          expected = int(sys.argv[2])
          p = CardParser(); p.feed(body)
          if len(p.cards) != expected:
              raise SystemExit(f'Expected {expected} infographic cards, found {len(p.cards)}')
          forbidden = re.compile(r'(thc[\s_/-]*enc[\s_/-]*001[\s_/-]*vis|v04[\s_/-]*sup|pdf[\s_/-]*pages)', re.I)
          bad = []
          for card in p.cards:
              text = ' '.join(' '.join(card['text']).split())
              blob = text + ' ' + ' '.join(card['urls'])
              if forbidden.search(blob) or text.strip().lower() == 'page 01' or any(re.search(r'/page-0?1(?:[-.])', u, re.I) for u in card['urls']):
                  bad.append(blob[:500])
          if bad:
              print('Excluded simple/reference cards found:', *bad, sep='\n- ')
              raise SystemExit(1)
          print(f'Verified {len(p.cards)} public finished-infographic cards with no excluded support-image cards.')
          PY

          image_count="$(grep -Eoi '<img[^>]+wp-content/uploads/' "$library" | wc -l | tr -d ' ')"
          test "$image_count" -ge 20

          for route in plant-biology genetics-breeding lifecycle-propagation environment-vpd lighting water-ph-ec nutrition-media ipm training-canopy harvest-postharvest outdoor research-methods plant-science-reference; do
            topic="$RUNNER_TEMP/topic-${route}.html"
            fetch_until "https://dtfseeds.com/learn/${route}/" "$topic" 'Literature first:' false
            grep -Fqi 'Use this in practice' "$topic"
            grep -Fqi 'Infographics for' "$topic"
            section_count="$(grep -Eo 'class="thc-section"' "$topic" | wc -l | tr -d ' ')"
            test "$section_count" -ge 4
          done

          featured_json="$RUNNER_TEMP/featured.json"
          curl -4 --fail --silent --show-error --location \
            --user "${WP_API_USERNAME}:${WP_API_PASSWORD}" \
            "https://dtfseeds.com/wp-json/wp/v2/pages/${{ steps.literature.outputs.page_id }}?context=edit&_fields=id,featured_media" \
            --output "$featured_json"
          node -e "const r=require(process.argv[1]); if(!(r.featured_media>0)) throw new Error('Featured media missing');" "$featured_json"
          echo "live_image_count=$image_count" >> "$GITHUB_OUTPUT"

      - name: Upload infographic deployment audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-infographic-production-${{ github.run_id }}
          path: /tmp/wordpress-infographic-backups
          if-no-files-found: warn
          retention-days: 30

      - name: Report infographic publication to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          MEDIA_OUTCOME: ${{ steps.publish_media.outcome }}
          LITERATURE_OUTCOME: ${{ steps.literature.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_COUNT: ${{ steps.quality.outputs.source_count }}
          ELIGIBLE_COUNT: ${{ steps.quality.outputs.eligible_count }}
          EXCLUDED_COUNT: ${{ steps.quality.outputs.excluded_count }}
          UPLOADED_COUNT: ${{ steps.publish_media.outputs.uploaded_count }}
          REUSED_COUNT: ${{ steps.publish_media.outputs.reused_count }}
          TOPIC_COUNT: ${{ steps.literature.outputs.topic_count }}
          GALLERY_COUNT: ${{ steps.literature.outputs.gallery_count }}
          WP_EXCLUDED_COUNT: ${{ steps.literature.outputs.wp_excluded_count }}
          LIVE_IMAGE_COUNT: ${{ steps.verify.outputs.live_image_count }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## THC infographic + companion literature publication',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Protected job result: **${process.env.JOB_STATUS}**`,
                `Infographic quality gate: **${process.env.QUALITY_OUTCOME || 'not-run'}**`,
                `Eligible media synchronization: **${process.env.MEDIA_OUTCOME || 'not-run'}**`,
                `Companion literature publication: **${process.env.LITERATURE_OUTCOME || 'not-run'}**`,
                `Visitor-facing verification: **${process.env.VERIFY_OUTCOME || 'not-run'}**`,
                `Source images inspected: **${process.env.SOURCE_COUNT || 'not-run'}**`,
                `Finished infographic images staged: **${process.env.ELIGIBLE_COUNT || 'not-run'}**`,
                `Simple/reference source images excluded: **${process.env.EXCLUDED_COUNT || 'not-run'}**`,
                `New WordPress media uploads: **${process.env.UPLOADED_COUNT || 'not-run'}**`,
                `Existing eligible WordPress media reused: **${process.env.REUSED_COUNT || 'not-run'}**`,
                `Literature-first topic pages: **${process.env.TOPIC_COUNT || 'not-run'}**`,
                `Finished infographic media in searchable index: **${process.env.GALLERY_COUNT || 'not-run'}**`,
                `Previously uploaded simple/reference media filtered from reuse: **${process.env.WP_EXCLUDED_COUNT || 'not-run'}**`,
                `Images observed on live searchable library: **${process.env.LIVE_IMAGE_COUNT || 'not-run'}**`,
                '',
                'Target: https://dtfseeds.com/learn/infographics/',
                'Canonical architecture: topic literature first; finished infographics embedded by subject and searchable; simple support art and PDF page extractions excluded from infographic surfaces.'
              ].join('\n')
            });
