name: Publish THC Infographics to WordPress Production

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - site/wordpress/assets/infographics/**
      - site/wordpress/imports/infographic-bulk-import.json
      - site/wordpress/education/topic-literature.json
      - site/wordpress/education/outdoor-quantification-v1.json
      - site/wordpress/education/outdoor-quantification/**
      - scripts/import-wordpress-infographic-remote-batch.mjs
      - scripts/stage-eligible-infographics.mjs
      - scripts/deploy-wordpress-infographic-library-rest.mjs
      - scripts/publish-wordpress-topic-literature.mjs
      - scripts/assemble-outdoor-quantification-v1.mjs
      - scripts/enhance-wordpress-outdoor-quantification-v1.mjs
      - scripts/flush-hostinger-litespeed-mcp.mjs
      - scripts/publish-wordpress-infographics-canonical.sh
      - .github/workflows/wordpress-infographic-production.yml
  workflow_run:
    workflows:
      - Publish DTFSeeds WordPress Production
    types: [completed]

permissions:
  contents: write
  issues: write

concurrency:
  group: dtfseeds-wordpress-infographics-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 182 &&
       github.event.comment.body == '/publish-infographics' &&
       github.event.comment.user.login == github.repository_owner)
    name: Canonical infographic publication transaction
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      INFOGRAPHIC_SOURCE_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
      INFOGRAPHIC_DIR: ${{ github.workspace }}/.tmp/eligible-infographics
      INFOGRAPHIC_PLACEMENT_CONFIG: ${{ github.workspace }}/site/wordpress/assets/infographics/placement-rules.json
      INFOGRAPHIC_EXCLUSIONS: ${{ github.workspace }}/site/wordpress/assets/infographics/infographic-exclusions.json
      BULK_INFOGRAPHIC_MANIFEST: ${{ github.workspace }}/site/wordpress/imports/infographic-bulk-import.json
      BULK_IMPORT_REPORT: /tmp/infographic-bulk-import-report.json
      TOPIC_LITERATURE_CONFIG: ${{ github.workspace }}/site/wordpress/education/topic-literature.json
      BACKUP_ROOT: /tmp/wordpress-infographic-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish the complete approved infographic set
        shell: bash
        run: bash scripts/publish-wordpress-infographics-canonical.sh

      - name: Upload canonical infographic publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-infographic-production-${{ github.run_id }}
          path: |
            /tmp/wordpress-infographic-backups
            /tmp/infographic-bulk-import-report.json
            ${{ runner.temp }}/infographic-library.html
            ${{ runner.temp }}/outdoor.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report canonical publication result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 182,
                body: [
                  '## Canonical THC infographic publication',
                  '',
                  `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  `Result: **${process.env.JOB_STATUS || 'see run'}**`,
                  '',
                  'This is the authoritative WordPress infographic writer. It publishes the complete quality-gated set, rebuilds the searchable library, publishes Outdoor at /learn/outdoor/, purges Hostinger/LiteSpeed, and requires the public card count to equal the eligible WordPress record count.'
                ].join('\n')
              });
            } catch (error) {
              core.warning(`Could not post infographic result: ${error.message}`);
            }
