name: Publish THC Infographics to WordPress Production

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - site/wordpress/assets/infographics/**
      - site/wordpress/imports/infographic-bulk-import.json
      - site/wordpress/education/topic-literature.json
      - site/wordpress/education/outdoor-quantification-v1.json
      - site/wordpress/education/outdoor-quantification/**
      - scripts/import-wordpress-infographic-remote-batch.mjs
      - scripts/stage-eligible-infographics.mjs
      - scripts/deploy-wordpress-infographic-library-rest.mjs
      - scripts/publish-wordpress-topic-literature.mjs
      - scripts/assemble-outdoor-quantification-v1.mjs
      - scripts/enhance-wordpress-outdoor-quantification-v1.mjs
      - .github/workflows/wordpress-infographic-production.yml
  workflow_run:
    workflows:
      - Publish DTFSeeds WordPress Production
    types: [completed]

permissions:
  contents: write
  issues: write

concurrency:
  group: dtfseeds-wordpress-infographics-production
  cancel-in-progress: false

jobs:
  publish:
    # A failed/cancelled upstream deployment is not a new infographic failure.
    # workflow_run only publishes after a successful trusted handoff. Manual,
    # source-push, and the owner-only issue command remain valid entry points.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 182 &&
       github.event.comment.body == '/publish-infographics' &&
       github.event.comment.user.login == github.repository_owner)
    name: Publish filtered infographics inside literature-first topics
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      INFOGRAPHIC_SOURCE_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
      INFOGRAPHIC_DIR: ${{ github.workspace }}/.tmp/eligible-infographics
      INFOGRAPHIC_PLACEMENT_CONFIG: ${{ github.workspace }}/site/wordpress/assets/infographics/placement-rules.json
      INFOGRAPHIC_EXCLUSIONS: ${{ github.workspace }}/site/wordpress/assets/infographics/infographic-exclusions.json
      BULK_INFOGRAPHIC_MANIFEST: ${{ github.workspace }}/site/wordpress/imports/infographic-bulk-import.json
      BULK_IMPORT_REPORT: /tmp/infographic-bulk-import-report.json
      TOPIC_LITERATURE_CONFIG: ${{ github.workspace }}/site/wordpress/education/topic-literature.json
      BACKUP_ROOT: /tmp/wordpress-infographic-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate publishers, source contracts, curriculum, and production access
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/import-wordpress-infographic-remote-batch.mjs
          node --check scripts/stage-eligible-infographics.mjs
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          node --check scripts/publish-wordpress-topic-literature.mjs
          node --check scripts/assemble-outdoor-quantification-v1.mjs
          node --check scripts/enhance-wordpress-outdoor-quantification-v1.mjs
          node -e "const m=require('./site/wordpress/imports/infographic-bulk-import.json'); if(m.schemaVersion!==1||!Array.isArray(m.assets)) process.exit(1)"
          node -e "const c=require('./site/wordpress/assets/infographics/placement-rules.json'); if(c.schemaVersion<2||!c.primaryOverrides?.length) process.exit(1)"
          node -e "const e=require('./site/wordpress/assets/infographics/infographic-exclusions.json'); if(!e.neverUseOnInfographicSurfaces||!e.excludePathFragments?.includes('pdf-pages/')) process.exit(1)"
          node -e "const d=require('./site/wordpress/education/topic-literature.json'); if(!Array.isArray(d.topics)||d.topics.length<10||d.topics.some(t=>!Array.isArray(t.sections)||t.sections.length<4)) process.exit(1)"
          node scripts/assemble-outdoor-quantification-v1.mjs --write > "$RUNNER_TEMP/outdoor-assembly.json"
          node -e "const r=require(process.argv[1]); if(r.sections!==8||r.subtopics!==32||r.metrics<100) throw new Error('Outdoor curriculum contract failed')" "$RUNNER_TEMP/outdoor-assembly.json"
          node scripts/enhance-wordpress-outdoor-quantification-v1.mjs --validate-only > "$RUNNER_TEMP/outdoor-validation.json"
          node -e "const r=require(process.argv[1]); if(r.sections!==8||r.subtopics!==32||r.metrics<100) throw new Error('Outdoor publication contract failed')" "$RUNNER_TEMP/outdoor-validation.json"
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"

      - name: Import queued infographic images
        shell: bash
        run: |
          set -euo pipefail
          node scripts/import-wordpress-infographic-remote-batch.mjs
          test -s "$BULK_IMPORT_REPORT"

      - name: Persist newly imported canonical image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DTF Bulk Image Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add site/wordpress/assets/infographics
          if ! git diff --cached --quiet; then
            git commit -m 'Import queued THC infographic assets'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Stage only eligible full-sheet infographics
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-eligible-infographics.mjs
          test -s "$BACKUP_ROOT/infographic-quality-gate.json"

      - name: Normalize WebP media for WordPress
        shell: bash
        run: |
          set -euo pipefail
          if find "$INFOGRAPHIC_DIR" -type f -iname '*.webp' -print -quit | grep -q .; then
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends ffmpeg
            fi
            while IFS= read -r -d '' file; do
              output="${file%.*}.png"
              ffmpeg -hide_banner -loglevel error -y -i "$file" -frames:v 1 "$output"
              test -s "$output"
              rm "$file"
            done < <(find "$INFOGRAPHIC_DIR" -type f -iname '*.webp' -print0)
          fi

      - name: Publish eligible media and topic mappings
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy-wordpress-infographic-library-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-infographic-backup-path.txt")"
          test -s "$backup_dir/deployment-result.json"

      - name: Publish companion literature and searchable index
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-wordpress-topic-literature.mjs
          backup_dir="$(cat "$BACKUP_ROOT/topic-literature-backup-path.txt")"
          test -s "$backup_dir/topic-literature-report.json"

      - name: Publish complete Outdoor field-measurement curriculum
        env:
          APPLY_OUTDOOR_QUANT_V1: 'true'
          BACKUP_ROOT: /tmp/wordpress-infographic-backups/outdoor-quantification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/enhance-wordpress-outdoor-quantification-v1.mjs
          report="$(find "$BACKUP_ROOT" -name report.json -type f -print -quit)"
          test -n "$report"
          node -e "const r=require(process.argv[1]); if(r.validation.sections!==8||r.validation.subtopics!==32||r.validation.metrics<100) throw new Error('Published Outdoor contract failed')" "$report"

      - name: Verify visitor-facing infographic surfaces with transient-network retries
        shell: bash
        run: |
          set -euo pipefail
          fetch_marker() {
            local url="$1" marker="$2" output="$3"
            curl -4 --fail --silent --show-error --location \
              --retry 6 --retry-delay 3 --retry-all-errors \
              --connect-timeout 10 --max-time 45 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "${url}?dtf_infographics=${GITHUB_RUN_ID}" -o "$output"
            grep -Fqi "$marker" "$output"
          }
          fetch_marker 'https://dtfseeds.com/learn/infographics/' 'Searchable Infographic Library' "$RUNNER_TEMP/infographic-library.html"
          grep -Eqi '<img[^>]+wp-content/uploads/' "$RUNNER_TEMP/infographic-library.html"
          fetch_marker 'https://dtfseeds.com/learn/encyclopedia/outdoor/' 'Outdoor' "$RUNNER_TEMP/outdoor.html"

      - name: Upload infographic deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-infographic-production-${{ github.run_id }}
          path: |
            /tmp/wordpress-infographic-backups
            /tmp/infographic-bulk-import-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report publication without affecting production result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 182,
                body: [
                  '## THC infographic production',
                  '',
                  `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  `Result: **${process.env.JOB_STATUS || 'see run'}**`,
                  'A failed or cancelled upstream WordPress handoff is now a neutral skip instead of a duplicate production failure.'
                ].join('\n')
              });
            } catch (error) {
              core.warning(`Could not post infographic report: ${error.message}`);
            }
