name: Publish THC Infographics to WordPress Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dtfseeds-wordpress-infographics-production-disabled
  cancel-in-progress: true

jobs:
  legacy-publisher-disabled:
    name: Legacy infographic publisher disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Enforce visual quarantine policy
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const policy=require('./site/wordpress/visual-quality-policy.json');
          if(Number(policy.schemaVersion)<3) throw new Error('Visual quality policy v3+ is required.');
          if(policy.replacementPolicy?.legacyAutomaticInfographicPublishingAllowed!==false) {
            throw new Error('Legacy infographic publication must remain disabled.');
          }
          if(policy.replacementPolicy?.legacyInfographicReuseAllowed!==false) {
            throw new Error('Legacy infographic reuse must remain disabled.');
          }
          console.log('Legacy WordPress infographic publication is intentionally disabled.');
          console.log('Only role-specific assets published through the dtf-approved-visual-* path may return to public site surfaces.');
          NODE

      - name: Explain replacement path
        run: |
          echo 'No WordPress media is uploaded by this workflow.'
          echo 'No gallery, Learn page, subject page, product card, or Home card is rewritten by this workflow.'
          echo 'Create and approve production-quality replacement visuals first; publish them with the dtf-approved-visual-* identity and responsive QA.'
