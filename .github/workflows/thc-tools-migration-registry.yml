name: THC Tools Migration Registry

on:
  pull_request:
    paths:
      - 'data/tool-registry.json'
      - 'scripts/test-tool-registry.mjs'
      - 'scripts/build-tool-migration-inventory.mjs'
      - 'docs/THC_TOOLS_MIGRATION_INVENTORY.md'
      - '.github/workflows/thc-tools-migration-registry.yml'
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-tool-registry.mjs
