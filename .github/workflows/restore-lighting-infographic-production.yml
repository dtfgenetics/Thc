name: Restore Canonical Lighting Infographic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-lighting-infographic-production.yml
      - site/wordpress/assets/infographics/import-remaining-core-031-047.json

permissions:
  contents: write
  issues: write

env:
  NODE_OPTIONS: --dns-result-order=ipv4first
  WP_SITE_URL: https://dtfseeds.com
  TARGET_PATH: site/wordpress/assets/infographics/DLI_PPFD_Light_Education_Infographic.png
  CANONICAL_DRIVE_FILE_ID: 1UKOVWoGxJnb8VJW5Vxncvpp9BhrBHh4u
  EXPECTED_SHA256: 2287cb16dc3b848635c33b2a4aea523c3abb33085ef3e26f1b818976625548f7
  EXPECTED_BYTES: '303651'
  INFOGRAPHIC_SOURCE_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
  INFOGRAPHIC_DIR: ${{ github.workspace }}/.tmp/eligible-infographics
  INFOGRAPHIC_PLACEMENT_CONFIG: ${{ github.workspace }}/site/wordpress/assets/infographics/placement-rules.json
  INFOGRAPHIC_EXCLUSIONS: ${{ github.workspace }}/site/wordpress/assets/infographics/infographic-exclusions.json
  TOPIC_LITERATURE_CONFIG: ${{ github.workspace }}/site/wordpress/education/topic-literature.json
  BACKUP_ROOT: /tmp/dtf-lighting-recovery
  APPLY_LEARNING_V3: 'true'

concurrency:
  group: dtfseeds-lighting-infographic-recovery
  cancel-in-progress: false

jobs:
  restore:
    name: Restore source asset publish and verify Lighting visual
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate protected inputs and publishers
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          [[ "$CANONICAL_DRIVE_FILE_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          node --check scripts/stage-eligible-infographics.mjs
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          node --check scripts/publish-wordpress-topic-literature.mjs
          node --check scripts/run-learning-v3-production.mjs

      - name: Recover exact DLI PPFD image from canonical Drive file
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/dli-ppfd-lighting.png"
          rm -f "$tmp"
          urls=(
            "https://drive.usercontent.google.com/download?id=${CANONICAL_DRIVE_FILE_ID}&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&id=${CANONICAL_DRIVE_FILE_ID}&confirm=t"
          )
          recovered=0
          for url in "${urls[@]}"; do
            candidate="$RUNNER_TEMP/dli-candidate.png"
            rm -f "$candidate"
            if curl -4 --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 "$url" --output "$candidate"; then
              if python3 - "$candidate" "$EXPECTED_SHA256" "$EXPECTED_BYTES" <<'PY'
          import hashlib,pathlib,sys
          path=pathlib.Path(sys.argv[1])
          expected_sha=sys.argv[2]
          expected_bytes=int(sys.argv[3])
          data=path.read_bytes()
          assert len(data)==expected_bytes, f'byte size mismatch: {len(data)} != {expected_bytes}'
          assert data[:8]==b'\x89PNG\r\n\x1a\n', 'not a PNG'
          assert b'IEND' in data, 'PNG has no IEND marker'
          actual=hashlib.sha256(data).hexdigest()
          assert actual==expected_sha, f'SHA-256 mismatch: {actual}'
          PY
              then
                mv "$candidate" "$tmp"
                recovered=1
                break
              fi
            fi
          done
          test "$recovered" -eq 1
          mkdir -p "$(dirname "$TARGET_PATH")"
          cp "$tmp" "$TARGET_PATH"
          echo "bytes=$(stat -c %s "$TARGET_PATH")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$TARGET_PATH" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Commit restored canonical asset to main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$TARGET_PATH" && git ls-files --error-unmatch "$TARGET_PATH" >/dev/null 2>&1; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET_PATH"
          git commit -m 'Restore canonical DLI PPFD lighting infographic'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage finished infographic assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/stage-eligible-infographics.mjs
          test -s "$INFOGRAPHIC_DIR/DLI_PPFD_Light_Education_Infographic.png"

      - name: Publish canonical infographic media to WordPress
        id: media
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy-wordpress-infographic-library-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-infographic-backup-path.txt")"
          result="$backup_dir/deployment-result.json"
          test -s "$result"
          node - "$result" <<'NODE'
          const r=require(process.argv[2]);
          console.log(JSON.stringify({uploaded:r.uploadedMediaCount,reused:r.reusedMediaCount},null,2));
          NODE

      - name: Refresh topic literature and infographic index
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-wordpress-topic-literature.mjs

      - name: Rebuild Home Learn and subject hierarchy with restored media
        id: v3
        shell: bash
        run: |
          set -euo pipefail
          export BACKUP_ROOT=/tmp/dtf-learning-v3-lighting-recovery
          node scripts/run-learning-v3-production.mjs | tee "$RUNNER_TEMP/learning-v3-lighting-report.json"
          grep -Fqi 'DLI PPFD' "$RUNNER_TEMP/learning-v3-lighting-report.json"
          ! grep -Fq '"lighting": null' "$RUNNER_TEMP/learning-v3-lighting-report.json"

      - name: Verify live Lighting page uses correct visual
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/lighting-live.html"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              "https://dtfseeds.com/learn/lighting/?dtf_lighting_recovery=${GITHUB_RUN_ID}-${attempt}" --output "$body"
            if grep -Fq 'data-dtf-topic="lighting"' "$body" && grep -Eqi 'DLI[_ -]PPFD|Light_Education_Pack_Page_1' "$body"; then
              ok=1
              break
            fi
            sleep 6
          done
          test "$ok" -eq 1
          ! grep -Fq 'Stage_3_Seedling_Establishment_Infographic' "$body"

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-lighting-infographic-recovery-${{ github.run_id }}
          path: |
            /tmp/dtf-lighting-recovery
            /tmp/dtf-learning-v3-lighting-recovery
            ${{ runner.temp }}/learning-v3-lighting-report.json
            ${{ runner.temp }}/lighting-live.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report recovery to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          COMMIT_CHANGED: ${{ steps.commit.outputs.changed }}
          RESTORED_BYTES: ${{ steps.recover.outputs.bytes }}
          RESTORED_SHA: ${{ steps.recover.outputs.sha256 }}
          V3_OUTCOME: ${{ steps.v3.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Canonical Lighting visual recovery',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Overall: **${process.env.STATUS}**`,
                `Canonical source restored/changed: **${process.env.COMMIT_CHANGED || 'unknown'}**`,
                `Recovered PNG bytes: **${process.env.RESTORED_BYTES || 'unknown'}**`,
                `Recovered SHA-256: \`${process.env.RESTORED_SHA || 'unknown'}\``,
                `Learning v3 rebuild: **${process.env.V3_OUTCOME || 'not reached'}**`,
                `Live Lighting verification: **${process.env.VERIFY_OUTCOME || 'not reached'}**`,
                '',
                'Recovery uses the canonical Drive asset THC_Light_Education_Pack_Page_1_DLI_PPFD_Portrait.png and requires the exact reviewed byte length and SHA-256 before any repository or WordPress write. The live gate rejects the prior seedling visual.'
              ].join('\n')
            });
