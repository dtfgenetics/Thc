name: Publish Plant Health IPM V6 Visual Atlas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/wordpress/education/plant-health-ipm-v6-visual-map.json'
      - 'site/wordpress/education/plant-health-ipm-v6.json'
      - 'scripts/publish-wordpress-subject-visual-atlas-v6.mjs'
      - '.github/workflows/wordpress-plant-health-ipm-visual-atlas-v6.yml'
  workflow_run:
    workflows:
      - Publish Plant Health IPM V6
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-plant-health-ipm-visual-atlas-v6
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  publish:
    name: Publish Plant Health IPM V6 visual atlas
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_SUBJECT_VISUAL_ATLAS_V6: 'true'
      SUBJECT_VISUAL_MAP: site/wordpress/education/plant-health-ipm-v6-visual-map.json
      SUBJECT_CURRICULUM_PATH: site/wordpress/education/plant-health-ipm-v6.json
      BACKUP_ROOT: /tmp/dtf-plant-health-ipm-visuals-v6

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Plant Health IPM visual mapping
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/publish-wordpress-subject-visual-atlas-v6.mjs
          node - <<'NODE'
          const fs=require('fs');
          const map=JSON.parse(fs.readFileSync('site/wordpress/education/plant-health-ipm-v6-visual-map.json','utf8'));
          const curriculum=JSON.parse(fs.readFileSync('site/wordpress/education/plant-health-ipm-v6.json','utf8'));
          if(map.curriculumId!=='plant-health-ipm-v6'||map.route!=='/learn/ipm/') throw new Error('Unexpected Plant Health visual map owner/route.');
          if(curriculum.id!=='plant-health-ipm-v6'||curriculum.slug!=='ipm'||curriculum.route!=='/learn/ipm/') throw new Error('Unexpected Plant Health curriculum owner/route.');
          const groups=Object.entries(map.chapters||{});
          const assets=groups.flatMap(([,items])=>items||[]);
          if(groups.length!==8||assets.length!==14) throw new Error(`Expected 8 groups and 14 visuals; found ${groups.length} and ${assets.length}.`);
          if((map.gaps||[]).length!==5) throw new Error(`Expected 5 explicit gaps; found ${(map.gaps||[]).length}.`);
          const curriculumIds=(curriculum.chapters||[]).map(c=>c.id).sort();
          const mapIds=groups.map(([id])=>id).sort();
          if(JSON.stringify(curriculumIds)!==JSON.stringify(mapIds)) throw new Error('Plant Health visual groups do not exactly match curriculum chapters.');
          const bad=assets.filter(x=>!/\.(?:png|jpe?g|webp)$/i.test(x.file||'')||/draft|quarantine|superseded|legacy|qa[-_ ]?required/i.test(x.file||''));
          if(bad.length) throw new Error(`Unsafe mapped assets: ${bad.map(x=>x.file).join(', ')}`);
          for(const item of assets){
            if(!item.title||!item.alt) throw new Error(`Incomplete visual mapping: ${item.file}`);
            if(!fs.existsSync(`site/wordpress/assets/infographics/${item.file}`)) throw new Error(`Mapped asset missing: ${item.file}`);
          }
          for(const gap of map.gaps||[]){if(gap.status!=='needed'||!gap.id||!gap.title||!gap.neededVisual) throw new Error(`Invalid explicit gap: ${JSON.stringify(gap)}`);}
          console.log(`Validated ${assets.length} approved Plant Health visuals and ${map.gaps.length} explicit gaps.`);
          NODE

      - name: Publish and verify Plant Health IPM visual atlas
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/publish-wordpress-subject-visual-atlas-v6.mjs | tee "$RUNNER_TEMP/plant-health-ipm-visuals-v6.log"
          report="$BACKUP_ROOT/report.json"
          test -s "$report"
          echo "visuals=$(node -p "require(process.argv[1]).visuals" "$report")" >> "$GITHUB_OUTPUT"
          echo "groups=$(node -p "require(process.argv[1]).groups" "$report")" >> "$GITHUB_OUTPUT"
          echo "wordpress=$(node -p "require(process.argv[1]).wordpressMedia" "$report")" >> "$GITHUB_OUTPUT"
          echo "fallbacks=$(node -p "require(process.argv[1]).canonicalFallbacks" "$report")" >> "$GITHUB_OUTPUT"
          echo "gaps=$(node -p "require(process.argv[1]).unresolvedGaps.length" "$report")" >> "$GITHUB_OUTPUT"

      - name: Independently verify public Plant Health IPM atlas
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/plant-health-ipm-visual-atlas.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "$WP_SITE_URL/learn/ipm/?dtf_phi6v_verify=${GITHUB_RUN_ID}-${attempt}" --output "$body"
            if grep -Fqi 'data-dtf-subject-visuals-v6="plant-health-ipm-v6"' "$body"; then ok=1; break; fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]]
          [[ "$(grep -Fo 'class="sv6v-card"' "$body" | wc -l | tr -d ' ')" = '14' ]]
          [[ "$(grep -Fo 'data-sv6v-group=' "$body" | wc -l | tr -d ' ')" = '8' ]]
          [[ "$(grep -Fo 'class="sv6v-gap"' "$body" | wc -l | tr -d ' ')" = '5' ]]
          grep -Fqi 'data-dtf-plant-health-ipm-v6="true"' "$body"
          grep -Fqi 'data-dtf-topic="plant-health-ipm"' "$body"
          grep -Fqi 'data-dtf-learning-v4="topic-plant-health-ipm"' "$body"
          python3 - "$body" <<'PY'
          import re,sys
          html=open(sys.argv[1],encoding='utf-8').read()
          start=html.find('data-dtf-subject-visuals-v6="plant-health-ipm-v6"')
          if start < 0: raise SystemExit('Plant Health atlas wrapper missing')
          end=html.find('<!-- dtf-subject-visuals-v6:plant-health-ipm-v6:end -->', start)
          block=html[start:end if end >= 0 else None]
          srcs=re.findall(r'<img[^>]+src=["\']([^"\']+)', block, flags=re.I)
          if len(srcs) != 14: raise SystemExit(f'Expected 14 atlas image sources, found {len(srcs)}')
          bad=[s for s in srcs if re.search(r'draft|quarantine|superseded|legacy|qa[-_ ]?required', s, re.I)]
          if bad: raise SystemExit('Unsafe asset-state filename found in Plant Health atlas: '+', '.join(bad))
          print('Scoped atlas image-source safety verification passed.')
          PY

      - name: Upload Plant Health visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plant-health-ipm-visual-atlas-v6-${{ github.run_id }}
          path: |
            /tmp/dtf-plant-health-ipm-visuals-v6
            ${{ runner.temp }}/plant-health-ipm-visuals-v6.log
            ${{ runner.temp }}/plant-health-ipm-visual-atlas.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report Plant Health IPM visual atlas result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          VALIDATE: ${{ steps.validate.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          VISUALS: ${{ steps.publish.outputs.visuals }}
          GROUPS: ${{ steps.publish.outputs.groups }}
          WORDPRESS: ${{ steps.publish.outputs.wordpress }}
          FALLBACKS: ${{ steps.publish.outputs.fallbacks }}
          GAPS: ${{ steps.publish.outputs.gaps }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body:[
              '## Plant Health & IPM V6 visual atlas','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `Mapping validation: **${process.env.VALIDATE || 'not-run'}**`,
              `WordPress publication: **${process.env.PUBLISH || 'not-run'}**`,
              `Visitor verification: **${process.env.VERIFY || 'not-run'}**`,
              `Verified visual cards: **${process.env.VISUALS || '0'}**`,
              `Chapter groups: **${process.env.GROUPS || '0'}**`,
              `WordPress-media resolutions: **${process.env.WORDPRESS || '0'}**`,
              `Canonical GitHub fallbacks: **${process.env.FALLBACKS || '0'}**`,
              `Explicit unresolved visual gaps: **${process.env.GAPS || '0'}**`,'',
              'The atlas is fail-closed and attaches only to canonical /learn/ipm/ after V3, V4 and Plant Health V6 ownership are all present. Only reviewed canonical infographic files are mapped; missing pest, foliar-disease, HLVd and resistance-management diagrams remain explicit production targets rather than receiving misleading near-matches.'
            ].join('\n')});
