name: Sync canonical cultivation tools

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-canonical-tools]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

# Scheduled runs are the safety net. Tools should also dispatch `sync-canonical-tools`
# after canonical main changes so THC does not remain stale for up to a schedule interval.

concurrency:
  group: sync-canonical-cultivation-tools
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout THC integration repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone canonical Tools repository
        env:
          REQUESTED_TOOLS_SHA: ${{ github.event.client_payload.tools_sha || '' }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/dtfgenetics/Tools.git /tmp/tools
          actual_sha="$(git -C /tmp/tools rev-parse HEAD)"
          if [ -n "${REQUESTED_TOOLS_SHA}" ]; then
            if ! [[ "${REQUESTED_TOOLS_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid tools_sha dispatch payload: ${REQUESTED_TOOLS_SHA}"
              exit 1
            fi
            if [ "${actual_sha}" != "${REQUESTED_TOOLS_SHA}" ]; then
              echo "::notice::Tools main advanced from dispatched ${REQUESTED_TOOLS_SHA} to ${actual_sha}; syncing the newer canonical main."
            else
              echo "Validated dispatched canonical Tools SHA ${REQUESTED_TOOLS_SHA}."
            fi
          fi

      - name: Synchronize canonical tool routes and shared assets
        shell: bash
        run: |
          set -euo pipefail
          tools_sha="$(git -C /tmp/tools rev-parse HEAD)"
          test "${#tools_sha}" -eq 40
          mapfile -t slugs < <(node -e "const m=require('/tmp/tools/migration/manifest.json'); for (const s of m.canonicalToolSlugs) console.log(s)")
          test "${#slugs[@]}" -ge 23
          for d in "${slugs[@]}"; do
            test -d "/tmp/tools/site/public-route-patch/$d"
            rm -rf "site/public-route-patch/$d"
            cp -a "/tmp/tools/site/public-route-patch/$d" "site/public-route-patch/$d"
            find "site/public-route-patch/$d" -type f -name 'README.md' -delete
          done
          mkdir -p site/public-route-patch/assets
          cp -a /tmp/tools/site/public-route-patch/assets/. site/public-route-patch/assets/
          mkdir -p site/public-route-patch/assets/release-source-revisions
          printf '%s\n' \
            'repository=dtfgenetics/Tools' \
            "commit=${tools_sha}" \
            'lane=canonicalToolsMirror' \
            'purpose=byte-for-byte-canonical-tools-deployment-mirror' \
            > site/public-route-patch/assets/release-source-revisions/tools.txt

      - name: Run deterministic tool validation
        run: TOOLS_REPO_DIR=/tmp/tools npm run verify:cultivation-reference-tools

      - name: Commit mirror update when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dtf-tools-sync"
          git config user.email "actions@users.noreply.github.com"
          mapfile -t slugs < <(node -e "const m=require('/tmp/tools/migration/manifest.json'); for (const s of m.canonicalToolSlugs) console.log(s)")
          for d in "${slugs[@]}"; do git add "site/public-route-patch/$d"; done
          git add site/public-route-patch/assets
          if git diff --cached --quiet; then
            echo "THC tool deployment mirror already matches canonical Tools."
            exit 0
          fi
          git commit -m "Sync canonical cultivation tools from dtfgenetics/Tools"
          git fetch origin main
          git rebase origin/main
          TOOLS_REPO_DIR=/tmp/tools npm run verify:cultivation-reference-tools
          git push origin HEAD:main
