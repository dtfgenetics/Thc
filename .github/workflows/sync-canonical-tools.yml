name: Sync canonical cultivation tools

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-canonical-tools]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-canonical-cultivation-tools
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout THC integration repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone canonical Tools repository
        run: git clone --depth 1 https://github.com/dtfgenetics/Tools.git /tmp/tools

      - name: Synchronize canonical tool routes and shared assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t slugs < <(node -e "const m=require('/tmp/tools/migration/manifest.json'); for (const s of m.canonicalToolSlugs) console.log(s)")
          test "${#slugs[@]}" -ge 23
          for d in "${slugs[@]}"; do
            test -d "/tmp/tools/site/public-route-patch/$d"
            rm -rf "site/public-route-patch/$d"
            cp -a "/tmp/tools/site/public-route-patch/$d" "site/public-route-patch/$d"
          done
          rm -rf site/public-route-patch/assets
          cp -a /tmp/tools/site/public-route-patch/assets site/public-route-patch/assets

      - name: Run deterministic tool validation
        run: npm run verify:cultivation-reference-tools

      - name: Commit mirror update when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dtf-tools-sync"
          git config user.email "actions@users.noreply.github.com"
          mapfile -t slugs < <(node -e "const m=require('/tmp/tools/migration/manifest.json'); for (const s of m.canonicalToolSlugs) console.log(s)")
          for d in "${slugs[@]}"; do git add "site/public-route-patch/$d"; done
          git add site/public-route-patch/assets
          if git diff --cached --quiet; then
            echo "THC tool deployment mirror already matches canonical Tools."
            exit 0
          fi
          git commit -m "Sync canonical cultivation tools from dtfgenetics/Tools"
          git push origin HEAD:main
