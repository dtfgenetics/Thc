name: Verify Burn Buds Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy DTFSeeds Public Suite via WordPress V2"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-burn-buds-production
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: https://dtfseeds.com/games/protect-the-plants
    steps:
      - uses: actions/checkout@v4

      - name: Verify live Burn Buds shell and required production assets
        shell: bash
        run: |
          set -euo pipefail
          token="${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -4 -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "$BASE/?burn_buds_smoke=$token" -o "$RUNNER_TEMP/index.html"

          grep -Fqi 'Burn Buds' "$RUNNER_TEMP/index.html"
          grep -Fq 'id="burn-buds-title"' "$RUNNER_TEMP/index.html"
          required=(app.js styles.css burn-buds-branding.js burn-buds.css runtime-sync-v1.js gameplay-v3.js gameplay-v3.css combat-a11y-v1.js battle-feedback-v1.js battle-feedback-v1.css placement-v1.js placement-v1.css targeting-v1.js targeting-v1.css gamefeel-v1.css manifest.webmanifest sw.js)
          for asset in "${required[@]}"; do
            curl -4 -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$BASE/$asset?burn_buds_smoke=$token" -o "$RUNNER_TEMP/$(basename "$asset")"
            test -s "$RUNNER_TEMP/$(basename "$asset")"
          done
          grep -Fq 'coordinate-grid' "$RUNNER_TEMP/app.js"
          grep -Fq 'Burn Buds' "$RUNNER_TEMP/burn-buds-branding.js"
          grep -Fq 'Tap once to aim. Tap the same cell again to fire.' "$RUNNER_TEMP/targeting-v1.js"
          grep -Fq 'burn-primary-board' "$RUNNER_TEMP/gamefeel-v1.css"
          grep -Fq 'burn-secondary-board' "$RUNNER_TEMP/gamefeel-v1.css"
          jq -e '.name == "Burn Buds" and .short_name == "Burn Buds" and .display == "standalone" and .start_url == "./" and .scope == "./"' "$RUNNER_TEMP/manifest.webmanifest" >/dev/null

      - name: Exercise live two-player API contract
        id: api
        shell: bash
        run: |
          set -euo pipefail
          api="$BASE/api.php"
          json=(-H 'Content-Type: application/json' -H 'Cache-Control: no-cache, no-store, max-age=0')
          create="$(curl -4 -fsSL --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 45 "${json[@]}" -X POST "$api?action=create" --data '{"name":"Burn Buds Contract A"}')"
          code="$(jq -er '.code' <<<"$create")"
          p1="$(jq -er '.playerId' <<<"$create")"
          t1="$(jq -er '.token' <<<"$create")"
          [[ "$code" =~ ^[A-Z0-9]{6}$ ]]

          state="$(curl -4 -fsSL "$api?action=state&code=$code" -H "X-Player-Id: $p1" -H "X-Player-Token: $t1" -H 'Cache-Control: no-cache')"
          jq -e '.status == "waiting" and .round == 1' <<<"$state" >/dev/null

          join="$(curl -4 -fsSL "${json[@]}" -X POST "$api?action=join" --data "$(jq -nc --arg code "$code" '{name:"Burn Buds Contract B",code:$code}')")"
          p2="$(jq -er '.playerId' <<<"$join")"
          t2="$(jq -er '.token' <<<"$join")"
          [[ -n "$p2" && -n "$t2" ]]

          chat="$(curl -4 -fsSL "${json[@]}" -H "X-Player-Id: $p1" -H "X-Player-Token: $t1" -X POST "$api?action=chat&code=$code" --data '{"text":"production contract check"}')"
          jq -e '.chat | any(.text == "production contract check")' <<<"$chat" >/dev/null
          echo "room=$code" >> "$GITHUB_OUTPUT"

      - name: Verify production route headers
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -4 -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE/")"
          test "$status" = 200
          api_status="$(curl -4 -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE/api.php?action=active")"
          case "$api_status" in 200|400|401|403) ;; *) echo "Unexpected API status: $api_status" >&2; exit 1 ;; esac

      - name: Production verification summary
        if: always()
        shell: bash
        env:
          ROOM: ${{ steps.api.outputs.room }}
        run: |
          {
            echo '## Burn Buds production verification'
            echo
            echo '- Live shell and required assets: contract checked'
            echo '- Multiplayer create/join/state/chat API: contract checked'
            echo '- Production route and API reachability: checked'
            if [ -n "${ROOM:-}" ]; then echo "- Temporary smoke-test room: \`$ROOM\`"; fi
            echo '- Public compatibility route: `/games/protect-the-plants/`'
            echo '- Public product identity: **Burn Buds**'
          } >> "$GITHUB_STEP_SUMMARY"
