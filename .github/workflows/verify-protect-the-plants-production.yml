name: Verify Protect the Plants Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-protect-the-plants-production.yml
      - site/public-route-patch/games/protect-the-plants/**

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-protect-the-plants-production
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://dtfseeds.com/games/protect-the-plants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify public page and assets
        shell: bash
        run: |
          set -euo pipefail
          token="${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -4 -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            -H 'Pragma: no-cache' \
            "$BASE/?ptp_smoke=$token" -o "$RUNNER_TEMP/index.html"
          grep -Fqi 'Protect the Plants' "$RUNNER_TEMP/index.html"
          grep -Fq './visual-fixes.css' "$RUNNER_TEMP/index.html"
          for asset in app.js styles.css visual-fixes.css plant.svg; do
            curl -4 -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$BASE/$asset?ptp_smoke=$token" -o "$RUNNER_TEMP/$asset"
            test -s "$RUNNER_TEMP/$asset"
          done
          grep -Fq 'coordinate-grid' "$RUNNER_TEMP/app.js"
          grep -Fq '.plant-token.formation-trellis-row' "$RUNNER_TEMP/styles.css"

      - name: Exercise two-player production API
        id: api
        shell: bash
        run: |
          set -euo pipefail
          api="$BASE/api.php"
          json_header=(-H 'Content-Type: application/json' -H 'Cache-Control: no-cache, no-store, max-age=0')

          create="$(curl -4 -fsSL --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 45 \
            "${json_header[@]}" -X POST "$api?action=create" --data '{"name":"PTP Smoke A"}')"
          code="$(jq -er '.code' <<<"$create")"
          p1="$(jq -er '.playerId' <<<"$create")"
          t1="$(jq -er '.token' <<<"$create")"
          [[ "$code" =~ ^[A-Z0-9]{6}$ ]]

          state1="$(curl -4 -fsSL "$api?action=state&code=$code" \
            -H "X-Player-Id: $p1" -H "X-Player-Token: $t1" -H 'Cache-Control: no-cache')"
          jq -e '.status == "waiting" and .me.name == "PTP Smoke A"' <<<"$state1" >/dev/null

          active="$(curl -4 -fsSL "$api?action=active" \
            -H "X-Player-Id: $p1" -H "X-Player-Token: $t1" -H 'Cache-Control: no-cache')"
          jq -e --arg code "$code" '.game.code == $code' <<<"$active" >/dev/null

          join="$(curl -4 -fsSL "${json_header[@]}" -X POST "$api?action=join" \
            --data "$(jq -nc --arg code "$code" '{name:"PTP Smoke B",code:$code}')")"
          p2="$(jq -er '.playerId' <<<"$join")"
          t2="$(jq -er '.token' <<<"$join")"

          chat="$(curl -4 -fsSL "${json_header[@]}" -H "X-Player-Id: $p1" -H "X-Player-Token: $t1" \
            -X POST "$api?action=chat&code=$code" --data '{"text":"production smoke chat"}')"
          jq -e '.chat | any(.text == "production smoke chat")' <<<"$chat" >/dev/null

          fleet='[{"id":"mother-row","cells":[{"row":0,"col":0},{"row":0,"col":1},{"row":0,"col":2},{"row":0,"col":3},{"row":0,"col":4}]},{"id":"trellis-row","cells":[{"row":2,"col":0},{"row":2,"col":1},{"row":2,"col":2},{"row":2,"col":3}]},{"id":"tall-pheno","cells":[{"row":4,"col":0},{"row":4,"col":1},{"row":4,"col":2}]},{"id":"bushy-pheno","cells":[{"row":6,"col":0},{"row":6,"col":1},{"row":6,"col":2}]},{"id":"solo-pots","cells":[{"row":8,"col":0},{"row":8,"col":1}]}]'
          place_body="$(jq -nc --argjson fleet "$fleet" '{fleet:$fleet}')"

          placed1="$(curl -4 -fsSL "${json_header[@]}" -H "X-Player-Id: $p1" -H "X-Player-Token: $t1" \
            -X POST "$api?action=place&code=$code" --data "$place_body")"
          jq -e '.me.ready == true' <<<"$placed1" >/dev/null

          placed2="$(curl -4 -fsSL "${json_header[@]}" -H "X-Player-Id: $p2" -H "X-Player-Token: $t2" \
            -X POST "$api?action=place&code=$code" --data "$place_body")"
          jq -e --arg p1 "$p1" '.status == "playing" and .turnPlayerId == $p1' <<<"$placed2" >/dev/null

          hit="$(curl -4 -fsSL "${json_header[@]}" -H "X-Player-Id: $p1" -H "X-Player-Token: $t1" \
            -X POST "$api?action=fire&code=$code" --data '{"row":0,"col":0}')"
          jq -e --arg p2 "$p2" '.lastEvent.hit == true and .turnPlayerId == $p2' <<<"$hit" >/dev/null

          miss="$(curl -4 -fsSL "${json_header[@]}" -H "X-Player-Id: $p2" -H "X-Player-Token: $t2" \
            -X POST "$api?action=fire&code=$code" --data '{"row":14,"col":14}')"
          jq -e --arg p1 "$p1" '.lastEvent.hit == false and .turnPlayerId == $p1' <<<"$miss" >/dev/null

          echo "room=$code" >> "$GITHUB_OUTPUT"
          echo 'Protect the Plants production multiplayer API smoke test passed.'

      - name: Install browser test runtime
        run: |
          npm ci
          npx playwright install chromium

      - name: Exercise live browser UI
        id: ui
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const base = process.env.BASE;
            const browser = await chromium.launch({ headless: true });
            const errors = [];
            const hook = page => {
              page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
              page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });
            };

            const c1 = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            const p1 = await c1.newPage(); hook(p1);
            await p1.goto(`${base}/?browser_smoke=${Date.now()}`, { waitUntil: 'networkidle', timeout: 60000 });
            await p1.locator('.hero-title').waitFor({ state: 'visible', timeout: 15000 });
            await p1.locator('.formation-grid').waitFor({ state: 'visible', timeout: 15000 });
            await p1.locator('#createName').fill('Browser Smoke A');
            await p1.locator('[data-action="create"]').click();
            await p1.waitForURL(/room=[A-Z0-9]{6}/, { timeout: 30000 });
            const code = new URL(p1.url()).searchParams.get('room');
            if (!/^[A-Z0-9]{6}$/.test(code || '')) throw new Error(`UI did not produce a room code: ${code}`);
            await p1.locator('.coordinate-grid').first().waitFor({ state: 'visible', timeout: 15000 });
            await p1.locator('.battle-log').waitFor({ state: 'visible', timeout: 15000 });
            await p1.locator('.side-rail').waitFor({ state: 'visible', timeout: 15000 });
            await p1.locator('[data-action="random"]').click();
            await p1.locator('[data-action="lock"]').click();
            await p1.getByText(/Garden locked|Waiting for opponent/i).first().waitFor({ timeout: 15000 }).catch(() => {});

            const c2 = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const p2 = await c2.newPage(); hook(p2);
            await p2.goto(`${base}/?browser_smoke_b=${Date.now()}`, { waitUntil: 'networkidle', timeout: 60000 });
            await p2.locator('.hero-title').waitFor({ state: 'visible', timeout: 15000 });
            await p2.locator('#joinName').fill('Browser Smoke B');
            await p2.locator('#joinCode').fill(code);
            await p2.locator('[data-action="join"]').click();
            await p2.waitForURL(new RegExp(`room=${code}`), { timeout: 30000 });
            await p2.locator('.mobile-tabs').waitFor({ state: 'visible', timeout: 15000 });
            await p2.locator('.coordinate-grid').first().waitFor({ state: 'visible', timeout: 15000 });
            await p2.locator('[data-action="random"]').click();
            await p2.locator('[data-action="lock"]').click();

            await p1.waitForTimeout(2500);
            await p1.locator('#chatInput').fill('browser ui smoke chat');
            await p1.locator('#chatForm button').click();
            await p2.getByText('browser ui smoke chat').waitFor({ timeout: 15000 });

            await p1.locator('.board').first().waitFor({ state: 'visible', timeout: 15000 });
            await p2.locator('.board').first().waitFor({ state: 'visible', timeout: 15000 });
            if (errors.length) throw new Error(errors.join('\n'));

            console.log(`Protect the Plants final live browser UI passed for room ${code}.`);
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Report production smoke result
        if: always()
        uses: actions/github-script@v7
        env:
          API_OUTCOME: ${{ steps.api.outcome }}
          UI_OUTCOME: ${{ steps.ui.outcome }}
          ROOM: ${{ steps.api.outputs.room }}
        with:
          script: |
            const pass = process.env.API_OUTCOME === 'success' && process.env.UI_OUTCOME === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Protect the Plants production smoke test',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${pass ? 'PASS' : 'FAIL'}**`,
                `Production API: **${process.env.API_OUTCOME || 'not-run'}**`,
                `Browser UI: **${process.env.UI_OUTCOME || 'not-run'}**`,
                process.env.ROOM ? `Temporary API smoke-test room: \`${process.env.ROOM}\`` : 'No API room reached the completed smoke-test stage.',
                '',
                'Checks: live final visual assets, greenhouse lobby/formation UI, coordinate-grid battle UI, desktop battle log/side rail, mobile board tabs, browser create/join/random placement/lock/chat on desktop + mobile viewports, JavaScript console/page errors, API room creation, authenticated state, active-game recovery, second-player join, room chat, both fleet placements, game start, hit, miss, and turn handoff.'
              ].join('\n')
            });
