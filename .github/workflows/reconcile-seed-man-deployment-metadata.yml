name: Reconcile Seed Man Deployment Metadata

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile-seed-man-deployment-metadata.mjs'
      - '.github/workflows/reconcile-seed-man-deployment-metadata.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: reconcile-seed-man-deployment-metadata-v20
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile Seed Man v20 deployment registry
        run: node scripts/reconcile-seed-man-deployment-metadata.mjs
      - name: Confirm reconciliation is idempotent
        shell: bash
        run: |
          set -euo pipefail
          path=site/deployment/public-apps.json
          before="$(git diff -- "$path" | git hash-object --stdin)"
          node scripts/reconcile-seed-man-deployment-metadata.mjs
          after="$(git diff -- "$path" | git hash-object --stdin)"
          test "$before" = "$after"
      - name: Validate reconciled v20 metadata
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/reconcile-seed-man-deployment-metadata.mjs
          node <<'NODE'
          const d=JSON.parse(require('fs').readFileSync('site/deployment/public-apps.json','utf8'));
          const a=d.apps.find(x=>x.id==='seed-man-platformer');
          if(!a)process.exit(1);
          if(a.title!=='Seed Man: Grow. Fight. Restore.')process.exit(2);
          if(a.runtime!=='static-canvas2d-approved-art'||a.status!=='production-v20')process.exit(3);
          if(a.machineData.levelCount!==20||a.machineData.worldCount!==5||a.machineData.bossCount!==6)process.exit(4);
          if(a.machineData.release!=='20260908-v20'||a.machineData.finalBoss!=='blight-king'||a.machineData.finalBossPhases!==4)process.exit(5);
          if(a.machineData.characterContract!=='green-armored-plant-hero')process.exit(6);
          if(a.machineData.approvedArtManifest!=='seed-man-approved-art-v2'||a.machineData.approvedArtSource!=='approved-showcase-2026-09-08')process.exit(7);
          if(a.machineData.productionCharacterArt!=='seed-man-approved-atlas-renderer-v3')process.exit(8);
          if(a.machineData.campaignRuntime!=='seed-man-campaign-v20-runtime-v1'||a.machineData.campaignUi!=='seed-man-campaign-ui-v20')process.exit(9);
          if(a.machineData.proceduralFallbackAllowed!==false||a.machineData.legacyAtlasFallbackAllowed!==false)process.exit(10);
          if(a.machineData.levelCount===15||a.machineData.productionCharacterArt==='seed-man-production-v1'||a.machineData.characterContract==='seed-man-locked-v1')process.exit(11);
          for(const legacyField of ['ui','visualSystem','authoredSpriteRuntime','threeJsRenderer','threeJsPublicApi','threeJsOptimization']){
            if(Object.hasOwn(a.machineData,legacyField))process.exit(12);
          }
          NODE
      - name: Safely integrate reconciled deployment metadata when needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- site/deployment/public-apps.json; then
            echo 'No Seed Man deployment metadata changes were needed.'
            exit 0
          fi
          node scripts/studio/integrate-generated-change.mjs \
            --message='Align Seed Man deployment metadata with canonical v20 production' \
            --paths=site/deployment/public-apps.json
