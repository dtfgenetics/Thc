name: Reconcile Seed Man Deployment Metadata

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile-seed-man-deployment-metadata.mjs'
      - '.github/workflows/reconcile-seed-man-deployment-metadata.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: reconcile-seed-man-deployment-metadata-v20
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile Seed Man v20 deployment registry and public surfaces
        run: node scripts/reconcile-seed-man-deployment-metadata.mjs
      - name: Confirm reconciliation is idempotent
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            site/deployment/public-apps.json
            site/public-route-patch/games/index.html
            data/public-navigation.json
            data/game-source-map.json
            site/wordpress/pages/home.html
          )
          before="$(git diff -- "${paths[@]}" | git hash-object --stdin)"
          node scripts/reconcile-seed-man-deployment-metadata.mjs
          after="$(git diff -- "${paths[@]}" | git hash-object --stdin)"
          test "$before" = "$after"
      - name: Validate reconciled v20 metadata and public identity
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/reconcile-seed-man-deployment-metadata.mjs
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('site/deployment/public-apps.json','utf8'));
          const a=d.apps.find(x=>x.id==='seed-man-platformer');
          if(!a)process.exit(1);
          if(a.title!=='Seed Man: Grow. Fight. Restore.')process.exit(2);
          if(a.runtime!=='static-canvas2d-approved-art'||a.status!=='production-v20')process.exit(3);
          if(a.machineData.levelCount!==20||a.machineData.worldCount!==5||a.machineData.bossCount!==6)process.exit(4);
          if(a.machineData.release!=='20260908-v20'||a.machineData.finalBoss!=='blight-king'||a.machineData.finalBossPhases!==4)process.exit(5);
          if(a.machineData.characterContract!=='green-armored-plant-hero')process.exit(6);
          if(a.machineData.approvedArtManifest!=='seed-man-approved-art-v2'||a.machineData.approvedArtSource!=='approved-showcase-2026-09-08')process.exit(7);
          if(a.machineData.productionCharacterArt!=='seed-man-approved-atlas-renderer-v3')process.exit(8);
          if(a.machineData.campaignRuntime!=='seed-man-campaign-v20-runtime-v1'||a.machineData.campaignUi!=='seed-man-campaign-ui-v20')process.exit(9);
          if(a.machineData.proceduralFallbackAllowed!==false||a.machineData.legacyAtlasFallbackAllowed!==false)process.exit(10);
          if(a.machineData.levelCount===15||a.machineData.productionCharacterArt==='seed-man-production-v1'||a.machineData.characterContract==='seed-man-locked-v1')process.exit(11);
          for(const legacyField of ['ui','visualSystem','authoredSpriteRuntime','threeJsRenderer','threeJsPublicApi','threeJsOptimization']){
            if(Object.hasOwn(a.machineData,legacyField))process.exit(12);
          }
          const hub=fs.readFileSync('site/public-route-patch/games/index.html','utf8');
          for(const retired of ['Seed Man: Sprout Run','Seed Man: Greenhouse Gauntlet','15 levels']) if(hub.includes(retired)) process.exit(13);
          for(const marker of ['Seed Man: Grow. Fight. Restore.','20 levels','5 worlds','6 bosses']) if(!hub.includes(marker)) process.exit(14);
          const nav=JSON.parse(fs.readFileSync('data/public-navigation.json','utf8')).games.find(x=>x.id==='seed-man-platformer');
          if(!nav||nav.title!=='Seed Man: Grow. Fight. Restore.'||nav.route!=='/games/seed-man-platformer/')process.exit(15);
          const source=JSON.parse(fs.readFileSync('data/game-source-map.json','utf8')).games.find(x=>x.id==='seed-man-platformer');
          if(!source||source.title!=='Seed Man: Grow. Fight. Restore.')process.exit(16);
          NODE
      - name: Safely integrate reconciled Seed Man public surfaces when needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          paths=(
            site/deployment/public-apps.json
            site/public-route-patch/games/index.html
            data/public-navigation.json
            data/game-source-map.json
            site/wordpress/pages/home.html
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'No Seed Man v20 public-surface changes were needed.'
            exit 0
          fi
          node scripts/studio/integrate-generated-change.mjs \
            --message='Align Seed Man public surfaces with canonical v20 production' \
            --paths="$(IFS=,; echo "${paths[*]}")"
