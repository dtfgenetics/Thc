name: Reconcile Seed Man Deployment Metadata

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile-seed-man-deployment-metadata.mjs'
      - '.github/workflows/reconcile-seed-man-deployment-metadata.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: reconcile-seed-man-deployment-metadata
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile Seed Man deployment registry
        run: node scripts/reconcile-seed-man-deployment-metadata.mjs
      - name: Confirm reconciliation is idempotent
        shell: bash
        run: |
          set -euo pipefail
          path=site/deployment/public-apps.json
          before="$(git diff -- "$path" | git hash-object --stdin)"
          node scripts/reconcile-seed-man-deployment-metadata.mjs
          after="$(git diff -- "$path" | git hash-object --stdin)"
          test "$before" = "$after"
      - name: Validate reconciled deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/reconcile-seed-man-deployment-metadata.mjs
          node -e "const d=JSON.parse(require('fs').readFileSync('site/deployment/public-apps.json','utf8')); const a=d.apps.find(x=>x.id==='seed-man-platformer'); if(!a)process.exit(1); if(a.title!=='Seed Man: Greenhouse Gauntlet')process.exit(2); if(a.machineData.levelCount!==15||a.machineData.worldCount!==5||a.machineData.bossCount!==6)process.exit(3); if(a.machineData.release!=='20260907-r17')process.exit(4); if(!a.runtime.includes('threejs'))process.exit(5);"
          ! grep -Fq '"title": "Seed Man: Sprout Run — Greenhouse Gauntlet"' site/deployment/public-apps.json
      - name: Safely integrate reconciled deployment metadata when needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- site/deployment/public-apps.json; then
            echo 'No Seed Man deployment metadata changes were needed.'
            exit 0
          fi
          node scripts/studio/integrate-generated-change.mjs \
            --message='Align Seed Man deployment metadata with verified production' \
            --paths=site/deployment/public-apps.json
