name: Repair Harvest Outdoor V6 source ownership

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fix-harvest-outdoor-v6-owner-markers.mjs'
      - '.github/workflows/repair-harvest-outdoor-v6-production-owner.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/fix-harvest-outdoor-v6-owner-markers.mjs'
      - '.github/workflows/repair-harvest-outdoor-v6-production-owner.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dtfseeds-harvest-outdoor-v6-owner-repair
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source repair and canonical production handoff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repair and single production owner
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fix-harvest-outdoor-v6-owner-markers.mjs
          node --check scripts/publish-wordpress-harvest-outdoor-v6-final.mjs
          node scripts/publish-wordpress-harvest-outdoor-v6-final.mjs --validate-only | tee "$RUNNER_TEMP/hov6-owner-repair-validation.json"
          grep -Fq 'ownerMarker:'"'"'data-dtf-topic="outdoor-cultivation"'"'"'' scripts/publish-wordpress-harvest-outdoor-v6-final.mjs
          grep -Fq 'guideMarker:'"'"'data-dtf-learning-v4="topic-outdoor-cultivation"'"'"'' scripts/publish-wordpress-harvest-outdoor-v6-final.mjs
          grep -Fq '"lessons": 32' "$RUNNER_TEMP/hov6-owner-repair-validation.json"

          canonical='.github/workflows/wordpress-harvest-outdoor-v6-production.yml'
          grep -Fq 'workflow_dispatch:' "$canonical"
          grep -Fq 'Restore and verify exact V3 prerequisites for Outdoor' "$canonical"
          grep -Fq 'node scripts/run-learning-v3-production.mjs' "$canonical"
          grep -Fq 'node scripts/verify-wordpress-outdoor-owner-prerequisites.mjs' "$canonical"
          grep -Fq 'Restore V4 guided-learning ownership before V6 publication' "$canonical"
          grep -Fq 'node scripts/enhance-wordpress-learning-v4.mjs' "$canonical"
          grep -Fq 'Publish complete Harvest and Outdoor V6 curricula' "$canonical"
          grep -Fq 'node scripts/publish-wordpress-harvest-outdoor-v6-final.mjs' "$canonical"
          grep -Fq 'Cache-busted visitor verification' "$canonical"

  handoff:
    name: Repair current main and dispatch canonical production owner
    needs: validate
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Persist canonical Outdoor markers through safe integration
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fix-harvest-outdoor-v6-owner-markers.mjs | tee "$RUNNER_TEMP/hov6-owner-repair.json"
          node --check scripts/publish-wordpress-harvest-outdoor-v6-final.mjs
          node scripts/publish-wordpress-harvest-outdoor-v6-final.mjs --validate-only > "$RUNNER_TEMP/hov6-validation.json"
          grep -Fq 'data-dtf-topic="outdoor-cultivation"' scripts/publish-wordpress-harvest-outdoor-v6-final.mjs
          grep -Fq 'data-dtf-learning-v4="topic-outdoor-cultivation"' scripts/publish-wordpress-harvest-outdoor-v6-final.mjs

          paths=(
            scripts/publish-wordpress-harvest-outdoor-v6-final.mjs
            .github/workflows/wordpress-harvest-outdoor-v6-production.yml
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'Canonical Outdoor V6 source markers already match current main.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            node scripts/studio/integrate-generated-change.mjs \
              --message='Fix Outdoor V6 canonical ownership markers' \
              "${paths[@]}"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          git fetch --quiet origin main
          echo "head=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Dispatch the single self-healing Harvest Outdoor production owner
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run wordpress-harvest-outdoor-v6-production.yml --ref main
          echo 'requested=true' >> "$GITHUB_OUTPUT"

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-outdoor-v6-source-repair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hov6-owner-repair.json
            ${{ runner.temp }}/hov6-validation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Write authoritative handoff summary
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
          CHANGED: ${{ steps.repair.outputs.changed }}
          HANDOFF: ${{ steps.handoff.outputs.requested }}
          DEPLOYED_HEAD: ${{ steps.repair.outputs.head }}
        run: |
          {
            echo '## Harvest + Outdoor V6 source-owner repair'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Repair/handoff result: **${STATUS:-unknown}**"
            echo "Durable source correction required: **${CHANGED:-false}**"
            echo "Canonical production workflow dispatched: **${HANDOFF:-false}**"
            echo "Current main after source repair: \`${DEPLOYED_HEAD:-unknown}\`"
            echo
            echo 'This workflow does not publish WordPress content. The canonical Publish Harvest and Outdoor V6 workflow owns V3/V4 self-healing, V6 publication, applied learning layers, and visitor-facing verification.'
          } >> "$GITHUB_STEP_SUMMARY"
