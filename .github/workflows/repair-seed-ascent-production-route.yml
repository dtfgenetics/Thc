name: Apply route-state fix on repair branch

on:
  push:
    branches:
      - 'fix/game-route-canonical-stale-scan-20260830'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/game-route-canonical-stale-scan-20260830
          fetch-depth: 0

      - name: Patch canonical stale-marker scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/promote-public-game-routes-via-wordpress.mjs')
          text = path.read_text()
          old = "                $desired_count = substr_count($content, $target['desired']);\n                $stale_matches = [];\n                foreach ($target['stale'] as $stale) {\n                    $count = substr_count($content, $stale);\n                    if ($count > 0) $stale_matches[] = ['marker' => $stale, 'count' => $count];\n                }\n                if ($desired_count === 1 && count($stale_matches) === 0) { $already[] = $target['rel']; continue; }\n"
          new = "                $desired_count = substr_count($content, $target['desired']);\n                $stale_scan = $content;\n                if ($desired_count === 1) {\n                    $stale_scan = str_replace($target['desired'], '', $content, $desired_strip_count);\n                    if ($desired_strip_count !== 1) {\n                        return new WP_Error('dtf_route_canonical_scan', 'Canonical route block could not be isolated for stale-rule validation.', ['status' => 409, 'path' => $target['rel'], 'desired_count' => $desired_count]);\n                    }\n                }\n                $stale_matches = [];\n                foreach ($target['stale'] as $stale) {\n                    $count = substr_count($stale_scan, $stale);\n                    if ($count > 0) $stale_matches[] = ['marker' => $stale, 'count' => $count];\n                }\n                if ($desired_count === 1 && count($stale_matches) === 0) { $already[] = $target['rel']; continue; }\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one route-state scan block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/promote-public-game-routes-via-wordpress.mjs
          grep -Fq '$count = substr_count($stale_scan, $stale);' scripts/promote-public-game-routes-via-wordpress.mjs

      - name: Self-test canonical and legacy states
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          desired = "# DTFSeeds managed game-directory child-route overlay v2\nRewriteRule ^seed-ascent(?:/(.*))?/?$ /dtf-content-overlay/games/seed-ascent/$1 [L]\nRewriteRule ^(?:future-slots)(?:/|$) /games/ [R=301,L]"
          stale = "RewriteRule ^(?:future-slots)(?:/|$) /games/ [R=301,L]"
          canonical = "RewriteEngine On\n" + desired + "\n"
          outside = canonical.replace(desired, '', 1)
          assert canonical.count(desired) == 1 and outside.count(stale) == 0
          legacy = "RewriteEngine On\n" + stale + "\n"
          assert legacy.count(desired) == 0 and legacy.count(stale) == 1
          hostile = canonical + stale + "\n"
          assert hostile.replace(desired, '', 1).count(stale) == 1
          print('route-state self-test passed')
          PY

      - name: Commit promoter fix to branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/promote-public-game-routes-via-wordpress.mjs; then
            echo 'Promoter already patched.'
            exit 0
          fi
          git config user.name dtf-release-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/promote-public-game-routes-via-wordpress.mjs
          git commit -m 'Ignore canonical block when scanning stale route markers'
          git push origin HEAD:fix/game-route-canonical-stale-scan-20260830
