name: Repair Seed Ascent Production Route

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-seed-ascent-production-route.yml'

permissions:
  contents: write

concurrency:
  group: seed-ascent-production-route-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require WordPress production credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured}"

      - name: Patch Seed Ascent canonical route to the verified standalone launcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/promote-public-game-routes-via-wordpress.mjs')
          text = path.read_text()

          old_rule = 'RewriteRule ^games/seed-ascent(?:/(.*))?/?$ /dtf-content-overlay/games/seed-ascent/$1 [L]'
          new_rule = 'RewriteRule ^games/seed-ascent/?$ /dtf-content-overlay/seed-ascent.html [L]'
          if old_rule in text:
              text = text.replace(old_rule, new_rule, 1)
          elif new_rule not in text:
              raise SystemExit('Seed Ascent root rewrite rule not found')

          marker = 'async function verifyPromotion() {'
          if 'async function verifySeedAscent() {' not in text:
              helper = r'''async function verifySeedAscent() {
            let last = '';
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              try {
                const [canonical, launcher, engine, levels, styles] = await Promise.all([
                  probe('/games/seed-ascent/'),
                  probe('/seed-ascent.html'),
                  probe('/seed-ascent/engine.js'),
                  probe('/seed-ascent/levels.js'),
                  probe('/seed-ascent/styles.css'),
                ]);
                const gamePageOk = (item) => item.response.status === 200
                  && !item.response.headers.get('location')
                  && /Seed Ascent/i.test(item.text)
                  && item.text.includes('id="game"')
                  && item.text.includes('/seed-ascent/levels.js')
                  && item.text.includes('/seed-ascent/engine.js');
                const canonicalOk = gamePageOk(canonical);
                const launcherOk = gamePageOk(launcher);
                const engineOk = engine.response.status === 200
                  && !engine.response.headers.get('location')
                  && engine.text.includes('__seedAscentDebug')
                  && engine.text.includes('doubleUsed');
                const levelsOk = levels.response.status === 200
                  && !levels.response.headers.get('location')
                  && levels.text.includes('SEED_ASCENT_LEVELS');
                const stylesOk = styles.response.status === 200
                  && !styles.response.headers.get('location')
                  && styles.text.length > 500;
                last = `canonical=${canonical.response.status}/${canonicalOk} launcher=${launcher.response.status}/${launcherOk} engine=${engine.response.status}/${engineOk} levels=${levels.response.status}/${levelsOk} styles=${styles.response.status}/${stylesOk}`;
                if (canonicalOk && launcherOk && engineOk && levelsOk && stylesOk) return;
              } catch (error) {
                last = error instanceof Error ? error.message : String(error);
              }
              await sleep(1000 + attempt * 700);
            }
            throw new Error(`Seed Ascent route/runtime verification failed after promotion (${last}).`);
          }

          '''
              if marker not in text:
                  raise SystemExit('verifyPromotion insertion point not found')
              text = text.replace(marker, helper + marker, 1)

          start_marker = '  // Seed Ascent is a Next wrapper around the dedicated static game runtime. Prove that'
          end_marker = "  const learnHub = await probe('/learn/');"
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              replacement = """  // Seed Ascent is served directly from the verified standalone launcher at the
            // canonical game URL. This avoids an unnecessary iframe wrapper while retaining
            // independent engine, level-data, and stylesheet verification.
            await verifySeedAscent();

          """
              text = text[:start] + replacement + text[end:]
          elif 'await verifySeedAscent();' not in text:
              raise SystemExit('Seed Ascent verification block not found')

          path.write_text(text)
          PY
          node --check scripts/promote-public-game-routes-via-wordpress.mjs
          grep -Fq 'RewriteRule ^games/seed-ascent/?$ /dtf-content-overlay/seed-ascent.html [L]' scripts/promote-public-game-routes-via-wordpress.mjs
          grep -Fq 'async function verifySeedAscent()' scripts/promote-public-game-routes-via-wordpress.mjs
          grep -Fq "probe('/seed-ascent/engine.js')" scripts/promote-public-game-routes-via-wordpress.mjs
          grep -Fq 'await verifySeedAscent();' scripts/promote-public-game-routes-via-wordpress.mjs

      - name: Reapply and finalize canonical Seed Ascent routing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/seed-ascent-route-promotion.json"
          for attempt in 1 2 3 4; do
            echo "Seed Ascent production promotion attempt ${attempt}/4"
            if node scripts/promote-public-game-routes-via-wordpress.mjs | tee "$RUNNER_TEMP/seed-ascent-route-promotion.json"; then
              if grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/seed-ascent-route-promotion.json"; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Promotion attempt ${attempt} did not complete; retrying after transient-host backoff."
              sleep $((attempt * 12))
            fi
          done
          echo '::error::Seed Ascent production promotion did not complete after four guarded attempts.'
          exit 1

      - name: Verify bare live Seed Ascent route and runtime files
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const origin = 'https://dtfseeds.com';
          const checks = [
            ['/games/seed-ascent/', ['Seed Ascent', 'id="game"', '/seed-ascent/levels.js', '/seed-ascent/engine.js']],
            ['/seed-ascent.html', ['Seed Ascent', 'id="game"', '/seed-ascent/levels.js', '/seed-ascent/engine.js']],
            ['/seed-ascent/engine.js', ['__seedAscentDebug', 'doubleUsed']],
            ['/seed-ascent/levels.js', ['SEED_ASCENT_LEVELS']],
            ['/seed-ascent/styles.css', []],
          ];
          for (const [route, markers] of checks) {
            let verified = false;
            let last = '';
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              try {
                const response = await fetch(origin + route, {
                  redirect: 'manual',
                  headers: {
                    'user-agent': 'DTFSeeds-Seed-Ascent-Production-Proof/1.0',
                    'cache-control': 'no-cache, no-store, max-age=0',
                    pragma: 'no-cache',
                  },
                  signal: AbortSignal.timeout(45000),
                });
                const text = await response.text();
                if (response.status !== 200 || response.headers.get('location')) {
                  throw new Error(`${route} did not resolve directly: HTTP ${response.status} ${response.headers.get('location') || ''}`);
                }
                for (const marker of markers) {
                  if (!text.includes(marker)) throw new Error(`${route} is missing required marker ${marker}`);
                }
                if (route.endsWith('.css') && text.length < 500) throw new Error(`${route} CSS payload is unexpectedly small`);
                console.log(`Verified ${route} (${text.length} bytes)`);
                verified = true;
                break;
              } catch (error) {
                last = error instanceof Error ? error.message : String(error);
                if (attempt < 6) await new Promise((resolve) => setTimeout(resolve, 1500 * attempt));
              }
            }
            if (!verified) throw new Error(`Failed live verification for ${route}: ${last}`);
          }
          NODE

      - name: Persist the verified promoter fix on main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/promote-public-game-routes-via-wordpress.mjs; then
            echo 'Promoter already contains the verified Seed Ascent direct route.'
            exit 0
          fi
          git config user.name 'dtf-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/promote-public-game-routes-via-wordpress.mjs
          git commit -m 'Serve Seed Ascent directly at canonical game route'
          git pull --rebase origin main
          if ! git push origin HEAD:main; then
            echo '::warning::Seed Ascent is live, but automatic persistence of the promoter patch was blocked. The repair workflow remains available.'
          fi

      - name: Production proof summary
        shell: bash
        run: |
          {
            echo '## Seed Ascent production route repaired'
            echo
            echo '- Canonical route: https://dtfseeds.com/games/seed-ascent/'
            echo '- Canonical launcher: verified HTTP 200 with live canvas and runtime references'
            echo '- Standalone launcher: verified HTTP 200'
            echo '- Engine: verified HTTP 200 with Seed Ascent runtime markers'
            echo '- Levels: verified HTTP 200 with campaign data marker'
            echo '- Styles: verified HTTP 200 with non-empty production stylesheet'
          } >> "$GITHUB_STEP_SUMMARY"
