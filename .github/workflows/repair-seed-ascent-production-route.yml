name: Apply route-state fix on repair branch

on:
  push:
    branches:
      - fix/game-route-canonical-stale-scan-20260830

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/game-route-canonical-stale-scan-20260830
          fetch-depth: 0

      - name: Patch canonical/stale route-state scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/promote-public-game-routes-via-wordpress.mjs')
          text = path.read_text()
          old = """                $desired_count = substr_count($content, $target['desired']);
                $stale_matches = [];
                foreach ($target['stale'] as $stale) {
                    $count = substr_count($content, $stale);
                    if ($count > 0) $stale_matches[] = ['marker' => $stale, 'count' => $count];
                }
                if ($desired_count === 1 && count($stale_matches) === 0) { $already[] = $target['rel']; continue; }
"""
          new = """                $desired_count = substr_count($content, $target['desired']);
                $stale_scan = $content;
                if ($desired_count === 1) {
                    $stale_scan = str_replace($target['desired'], '', $content, $desired_strip_count);
                    if ($desired_strip_count !== 1) {
                        return new WP_Error('dtf_route_canonical_scan', 'Canonical route block could not be isolated for stale-rule validation.', ['status' => 409, 'path' => $target['rel'], 'desired_count' => $desired_count]);
                    }
                }
                $stale_matches = [];
                foreach ($target['stale'] as $stale) {
                    $count = substr_count($stale_scan, $stale);
                    if ($count > 0) $stale_matches[] = ['marker' => $stale, 'count' => $count];
                }
                if ($desired_count === 1 && count($stale_matches) === 0) { $already[] = $target['rel']; continue; }
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one route-state scan block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          node --check scripts/promote-public-game-routes-via-wordpress.mjs
          grep -Fq '$stale_scan = str_replace($target['"'"'desired'"'"'], '"'"''"'"', $content, $desired_strip_count);' scripts/promote-public-game-routes-via-wordpress.mjs

          python3 - <<'PY'
          desired = "# DTFSeeds managed game-directory child-route overlay v2\nRewriteRule ^seed-ascent(?:/(.*))?/?$ /dtf-content-overlay/games/seed-ascent/$1 [L]\nRewriteRule ^(?:future-slots)(?:/|$) /games/ [R=301,L]"
          stale = "RewriteRule ^(?:future-slots)(?:/|$) /games/ [R=301,L]"
          canonical = "RewriteEngine On\n" + desired + "\n"
          assert canonical.count(desired) == 1
          outside = canonical.replace(desired, '', 1)
          assert outside.count(stale) == 0, 'canonical block must not count its own retired-route rule as stale'
          legacy = "RewriteEngine On\n" + stale + "\n"
          assert legacy.count(desired) == 0 and legacy.count(stale) == 1, 'known legacy route must remain migratable'
          hostile = canonical + stale + "\n"
          outside_hostile = hostile.replace(desired, '', 1)
          assert outside_hostile.count(stale) == 1, 'extra stale rule outside canonical block must remain detectable'
          print('route-state self-test passed')
          PY

      - name: Commit promoter fix to branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/promote-public-game-routes-via-wordpress.mjs; then
            echo 'Promoter already patched.'
            exit 0
          fi
          git config user.name dtf-release-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/promote-public-game-routes-via-wordpress.mjs
          git commit -m 'Ignore canonical block when scanning stale route markers'
          git push origin HEAD:fix/game-route-canonical-stale-scan-20260830
