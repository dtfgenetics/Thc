name: Apply Forward Port Seed Ascent 416

on:
  push:
    branches:
      - fix/forward-port-seed-ascent-games-htaccess-416
    paths:
      - '.github/workflows/apply-forward-port-seed-ascent-416.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply directory-level Seed Ascent routing ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/promote-public-game-routes-via-wordpress.mjs')
          text = path.read_text()
          old = """const rootOverlayBase64 = Buffer.from(rootOverlayBlock, 'utf8').toString('base64');

          const snippetCode = String.raw`
          add_action('rest_api_init', function () {
              $token = ${tokenLiteral};
              $namespace = ${namespaceLiteral};
              $root_overlay = base64_decode(${JSON.stringify(rootOverlayBase64)}, true);
              if (!is_string($root_overlay) || $root_overlay === '') return;
          """
          new = """const rootOverlayBase64 = Buffer.from(rootOverlayBlock, 'utf8').toString('base64');
          const gamesOverlayBlock = `# DTFSeeds managed game-directory child-route overlay v2
          RewriteRule ^seed-ascent(?:/(.*))?/?$ /dtf-content-overlay/games/seed-ascent/$1 [L]
          RewriteRule ^(?:future-slots)(?:/|$) /games/ [R=301,L]`;
          const gamesOverlayBase64 = Buffer.from(gamesOverlayBlock, 'utf8').toString('base64');

          const snippetCode = String.raw`
          add_action('rest_api_init', function () {
              $token = ${tokenLiteral};
              $namespace = ${namespaceLiteral};
              $root_overlay = base64_decode(${JSON.stringify(rootOverlayBase64)}, true);
              $games_overlay = base64_decode(${JSON.stringify(gamesOverlayBase64)}, true);
              if (!is_string($root_overlay) || $root_overlay === '' || !is_string($games_overlay) || $games_overlay === '') return;
          """
          if old not in text:
              raise SystemExit('Root overlay bootstrap block not found')
          text = text.replace(old, new, 1)
          old_games = """        [
                      'rel' => 'games/.htaccess',
                      'desired' => 'RewriteRule ^(?:future-slots)(?:/|$) /games/ [R=301,L]',
                      'stale' => [
                          'RewriteRule ^(?:future-slots|bud-or-bluff)(?:/|$) /games/ [R=301,L]',
                          'RewriteRule ^(?:future-slots|high-iq|bud-or-bluff|grower-conversations)(?:/|$) /games/ [R=301,L]',
                      ],
                  ],
          """
          new_games = """        [
                      'rel' => 'games/.htaccess',
                      'desired' => $games_overlay,
                      'stale' => [
                          'RewriteRule ^(?:future-slots)(?:/|$) /games/ [R=301,L]',
                          'RewriteRule ^(?:future-slots|bud-or-bluff)(?:/|$) /games/ [R=301,L]',
                          'RewriteRule ^(?:future-slots|high-iq|bud-or-bluff|grower-conversations)(?:/|$) /games/ [R=301,L]',
                      ],
                  ],
          """
          if old_games not in text:
              raise SystemExit('games/.htaccess target block not found')
          text = text.replace(old_games, new_games, 1)
          path.write_text(text)
          PY
          node --check scripts/promote-public-game-routes-via-wordpress.mjs
          grep -Fq 'managed game-directory child-route overlay v2' scripts/promote-public-game-routes-via-wordpress.mjs
          grep -Fq "'desired' => \$games_overlay" scripts/promote-public-game-routes-via-wordpress.mjs
      - name: Commit forward port
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dtf-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/promote-public-game-routes-via-wordpress.mjs
          git commit -m 'Forward-port Seed Ascent games directory routing'
          git push origin HEAD:${GITHUB_REF_NAME}
