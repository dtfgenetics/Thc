name: Seed Man Source Runtime Alignment

on:
  pull_request:
    paths:
      - site/public-route-patch/games/seed-man-platformer/**
      - games/seed-man-platformer/**
      - scripts/verify-seed-man-production-v20.mjs
      - scripts/validate-seed-man-production-bundle.mjs
      - .github/workflows/seed-man-source-runtime-alignment.yml
  push:
    branches: [main]
    paths:
      - site/public-route-patch/games/seed-man-platformer/**
      - games/seed-man-platformer/**
      - scripts/verify-seed-man-production-v20.mjs
      - scripts/validate-seed-man-production-bundle.mjs
      - .github/workflows/seed-man-source-runtime-alignment.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build canonical Three.js world bundle
        run: |
          npm install --prefix games/seed-man-platformer --ignore-scripts --no-audit --no-fund
          npm run --prefix games/seed-man-platformer build:three-public

      - name: Verify source route boots only canonical v20 production runtimes
        shell: bash
        run: |
          set -euo pipefail
          route=site/public-route-patch/games/seed-man-platformer
          index="$route/index.html"
          test -s "$index"
          for script in approved-art-core-v1.js approved-art-runtime-v1.js app.js player-state-v20.js seed-man-production-art.js three-world-v1.js campaign-v20-runtime.js campaign-ui-v20.js v20-enemy-runtime.js combat-browser-v2.js enemy-attacks-browser-v2.js input-guard-v1.js canvas-compat-v1.js; do
            grep -Fq "./${script}?v=" "$index"
          done
          ! grep -Fq './three-world-adapter-v1.js?v=' "$index"
          grep -Fq 'three-world-adapter-v1.js' "$route/canvas-compat-v1.js"

          core="$(grep -nF './approved-art-core-v1.js?v=' "$index"|head -n1|cut -d: -f1)"
          artRuntime="$(grep -nF './approved-art-runtime-v1.js?v=' "$index"|head -n1|cut -d: -f1)"
          app="$(grep -nF './app.js?v=' "$index"|head -n1|cut -d: -f1)"
          playerState="$(grep -nF './player-state-v20.js?v=' "$index"|head -n1|cut -d: -f1)"
          renderer="$(grep -nF './seed-man-production-art.js?v=' "$index"|head -n1|cut -d: -f1)"
          three="$(grep -nF './three-world-v1.js?v=' "$index"|head -n1|cut -d: -f1)"
          campaign="$(grep -nF './campaign-v20-runtime.js?v=' "$index"|head -n1|cut -d: -f1)"
          ui="$(grep -nF './campaign-ui-v20.js?v=' "$index"|head -n1|cut -d: -f1)"
          enemy="$(grep -nF './v20-enemy-runtime.js?v=' "$index"|head -n1|cut -d: -f1)"
          combat="$(grep -nF './combat-browser-v2.js?v=' "$index"|head -n1|cut -d: -f1)"
          attacks="$(grep -nF './enemy-attacks-browser-v2.js?v=' "$index"|head -n1|cut -d: -f1)"
          test "$core" -lt "$artRuntime"
          test "$artRuntime" -lt "$app"
          test "$app" -lt "$playerState"
          test "$playerState" -lt "$renderer"
          test "$renderer" -lt "$three"
          test "$three" -lt "$campaign"
          test "$campaign" -lt "$ui"
          test "$ui" -lt "$enemy"
          test "$enemy" -lt "$combat"
          test "$combat" -lt "$attacks"

          for retired in data/level-01.json data/levels-12-15.json campaign-v1.js gameplay-v2.js physics.mjs campaign-combat-v20.js campaign-progress-v20.js campaign-runtime-v20.js campaign-ui-v15.js world-five-v1.js combat-browser-v1.js enemy-attacks-browser-v1.js seed-man-ui-v3.js assets/approved/seed-man-approved-master-atlas-v1.webp assets/approved/seed-man-cover-banner-approved-v1.webp; do
            test ! -e "$route/$retired" || { echo "retired artifact still present: $retired" >&2; exit 1; }
          done
          ! grep -Fq 'seed-man-level' "$index"
          ! grep -Fq 'Seed Man: Sprout Run' "$index"
          ! grep -Fq 'Greenhouse Gauntlet' "$index"

          node --check "$route/app.js"
          node --check "$route/player-state-v20.js"
          node --check "$route/canvas-compat-v1.js"
          node --check "$route/approved-art-core-v1.js"
          node --check "$route/combat-browser-v2.js"
          node --check "$route/three-world-adapter-v1.js"
          grep -Fq 'seed-man-base-runtime-v20' "$route/app.js"
          grep -Fq "campaignAuthority:'campaign-v20-runtime.js'" "$route/app.js"
          grep -Fq 'level.boss && !level.boss.defeated' "$route/app.js"
          ! grep -Fq 'readEmbeddedLevel' "$route/app.js"
          grep -Fq 'seed-man-player-state-v20' "$route/player-state-v20.js"
          grep -Fq 'seed-man-runtime-bootstrap-v20' "$route/canvas-compat-v1.js"
          grep -Fq 'seed-man-three-public-v3' "$route/canvas-compat-v1.js"
          grep -Fq 'approved-showcase-2026-09-08' "$route/seed-man-production-art.js"
          grep -Fq 'green-armored-plant-hero' "$route/seed-man-production-art.js"
          grep -Fq 'fallbackAllowed:false' "$route/seed-man-production-art.js"
          grep -Fq 'seed-man-approved-art-core-v4' "$route/approved-art-core-v1.js"
          grep -Fq 'seed-man-character-atlas-v2.webp' "$route/approved-art-core-v1.js"
          ! grep -Fq 'seed-man-approved-master-atlas-v1.webp' "$route/approved-art-core-v1.js"
          grep -Fq "worldRenderer:'seed-man-three-world-v2'" "$route/approved-art-core-v1.js"
          for world in greenhouse-valley forest-ruins desert-canyon frozen-peaks eco-city; do grep -Fq "world.${world}.background" "$route/approved-art-core-v1.js"; done
          grep -Fq 'SeedManThreeWorld' "$route/three-world-v1.js"
          grep -Fq 'seed-man-three-public-v3' "$route/three-world-v1.js"
          grep -Fq 'seed-man-three-world-v2' "$route/three-world-v1.js"
          bytes="$(wc -c < "$route/three-world-v1.js" | tr -d ' ')"
          test "$bytes" -ge 250000
          grep -Fq 'seed-man-approved-art-runtime-v2' "$route/approved-art-runtime-v1.js"
          ! grep -Eq 'solar-flare|static-haze|frost-resin|shield-bounce' "$route/approved-art-runtime-v1.js"
          grep -Fq 'seed-man-campaign-v20-runtime-v3' "$route/campaign-v20-runtime.js"
          grep -Fq "phenotypeForms:['plant','fire','electric','ice']" "$route/campaign-v20-runtime.js"
          grep -Fq 'seed-man-campaign-ui-v20' "$route/campaign-ui-v20.js"
          grep -Fq 'seed-man-v20-enemy-runtime-v2' "$route/v20-enemy-runtime.js"
          grep -Fq 'seed-man-combat-browser-v2' "$route/combat-browser-v2.js"
          grep -Fq 'syncBossState' "$route/combat-browser-v2.js"
          grep -Fq 'seed-man-enemy-attacks-browser-v2' "$route/enemy-attacks-browser-v2.js"

      - name: Verify canonical source and production bundle
        run: |
          node scripts/validate-seed-man-character-atlas.mjs
          node games/seed-man-platformer/test/art-registry.test.mjs
          node games/seed-man-platformer/test/approved-art-loader.test.mjs
          node games/seed-man-platformer/test/public-runtime.test.mjs
          node games/seed-man-platformer/test/public-campaign.test.mjs
          node scripts/verify-seed-man-production-v20.mjs
          node scripts/validate-seed-man-production-bundle.mjs
