name: Seed Man Source Runtime Alignment

on:
  pull_request:
    paths:
      - site/public-route-patch/games/seed-man-platformer/**
      - games/seed-man-platformer/src/render/**
      - .github/workflows/seed-man-source-runtime-alignment.yml
  push:
    branches: [main]
    paths:
      - site/public-route-patch/games/seed-man-platformer/**
      - games/seed-man-platformer/src/render/**
      - .github/workflows/seed-man-source-runtime-alignment.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source route boots only canonical v20 runtimes
        shell: bash
        run: |
          set -euo pipefail
          route=site/public-route-patch/games/seed-man-platformer
          index="$route/index.html"
          test -s "$index"
          for script in canvas-compat-v1.js approved-art-core-v1.js approved-art-runtime-v1.js app.js seed-man-production-art.js campaign-v20-runtime.js v20-campaign-guard.js campaign-ui-v20.js v20-enemy-runtime.js combat-browser-v2.js enemy-attacks-browser-v2.js input-guard-v1.js; do
            grep -Fq "./${script}?v=20260909-v20" "$index"
          done
          line(){ grep -nF "./$1?v=" "$index"|head -n1|cut -d: -f1; }
          core="$(line approved-art-core-v1.js)"
          artRuntime="$(line approved-art-runtime-v1.js)"
          app="$(line app.js)"
          renderer="$(line seed-man-production-art.js)"
          campaign="$(line campaign-v20-runtime.js)"
          guard="$(line v20-campaign-guard.js)"
          ui="$(line campaign-ui-v20.js)"
          enemyRuntime="$(line v20-enemy-runtime.js)"
          combat="$(line combat-browser-v2.js)"
          attacks="$(line enemy-attacks-browser-v2.js)"
          test "$core" -lt "$artRuntime"
          test "$artRuntime" -lt "$app"
          test "$app" -lt "$renderer"
          test "$renderer" -lt "$campaign"
          test "$campaign" -lt "$guard"
          test "$guard" -lt "$ui"
          test "$ui" -lt "$enemyRuntime"
          test "$enemyRuntime" -lt "$combat"
          test "$combat" -lt "$attacks"
          ! grep -Fq './seed-man-sprite-runtime-v1.js' "$index"
          ! grep -Fq './seed-man-sprite-runtime-v2.js' "$index"
          ! grep -Fq './world-five-v1.js' "$index"
          ! grep -Fq './three-world-v1.js' "$index"
          ! grep -Fq './three-world-adapter-v1.js' "$index"
          ! grep -Fq './seed-man-ui-v3.js' "$index"
          ! grep -Fq './combat-browser-v1.js' "$index"
          ! grep -Fq './enemy-attacks-browser-v1.js' "$index"
          ! grep -Fq '"id":"sprout-run"' "$index"
          grep -Fq 'approved-showcase-2026-09-08' "$route/seed-man-production-art.js"
          grep -Fq 'green-armored-plant-hero' "$route/seed-man-production-art.js"
          grep -Fq 'fallbackAllowed:false' "$route/seed-man-production-art.js"
          grep -Fq 'seed-man-campaign-v20-runtime-v1' "$route/campaign-v20-runtime.js"
          grep -Fq 'seed-man-v20-campaign-guard-v1' "$route/v20-campaign-guard.js"
          grep -Eq 'seed-man-v20-enemy-runtime-v(1|2)' "$route/v20-enemy-runtime.js"
          grep -Fq "['fire','electric','ice']" "$route/v20-enemy-runtime.js"
          grep -Fq 'seed-man-combat-browser-v2' "$route/combat-browser-v2.js"
          grep -Fq 'seed-man-enemy-attacks-browser-v2' "$route/enemy-attacks-browser-v2.js"
          grep -Fq 'seed-man-campaign-ui-v20' "$route/campaign-ui-v20.js"

      - name: Verify canonical approved-art source syntax
        run: |
          node --check games/seed-man-platformer/src/render/art-registry.mjs
          node --check games/seed-man-platformer/src/render/approved-art-loader.mjs
          node --check games/seed-man-platformer/src/render/visual-runtime-v2.mjs
          node games/seed-man-platformer/test/art-registry.test.mjs
