name: Diagnose Seeds Block Template Hierarchy

on:
  pull_request:
    paths:
      - scripts/diagnose-seeds-block-template-hierarchy-via-wordpress.mjs
      - .github/workflows/diagnose-seeds-block-template-hierarchy.yml
      - .github/diagnose-seeds-block-template-hierarchy-trigger.txt
  push:
    branches: [main]
    paths:
      - .github/diagnose-seeds-block-template-hierarchy-trigger.txt

permissions:
  contents: read

concurrency:
  group: dtfseeds-seeds-block-template-diagnostic
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only block-template diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/diagnose-seeds-block-template-hierarchy-via-wordpress.mjs
          ! grep -Eq 'wp_update_post|update_post_meta|delete_post_meta|set_post_thumbnail|file_put_contents|\bunlink\s*\(|\brename\s*\(|\brmdir\s*\(|\bmkdir\s*\(|wp_mkdir_p|ZipArchive' scripts/diagnose-seeds-block-template-hierarchy-via-wordpress.mjs
          grep -Fq "get_block_template" scripts/diagnose-seeds-block-template-hierarchy-via-wordpress.mjs
          grep -Fq "get_block_templates" scripts/diagnose-seeds-block-template-hierarchy-via-wordpress.mjs
          grep -Fq "page-seeds" scripts/diagnose-seeds-block-template-hierarchy-via-wordpress.mjs
          grep -Fq "core/post-content" scripts/diagnose-seeds-block-template-hierarchy-via-wordpress.mjs
          grep -Fq "matching_database_template_posts" scripts/diagnose-seeds-block-template-hierarchy-via-wordpress.mjs
          grep -Fq "DTF Genetics catalog pages built around strain identity and grow context." scripts/diagnose-seeds-block-template-hierarchy-via-wordpress.mjs
          ! grep -Fq "console.log(snippetCode" scripts/diagnose-seeds-block-template-hierarchy-via-wordpress.mjs

  diagnose-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require proven WordPress credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
      - name: Run read-only Seeds block-template hierarchy diagnostic
        id: diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/diagnose-seeds-block-template-hierarchy-via-wordpress.mjs \
            | tee "$RUNNER_TEMP/seeds-block-template-diagnostic.json"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/seeds-block-template-diagnostic.json"
      - name: Upload block-template evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeds-block-template-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/seeds-block-template-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize diagnostic status
        if: always()
        shell: bash
        run: |
          {
            echo '## Seeds block-template hierarchy diagnostic'
            echo
            echo "- Diagnostic: ${{ steps.diagnostic.outcome }}"
            echo '- Scope: read-only candidate block templates, matching template parts/database templates, block inventory, and active plugin slugs.'
            echo '- Production page/template/file mutation: none.'
          } >> "$GITHUB_STEP_SUMMARY"
