name: Force DTFSeeds Live Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-live-verification.yml
      - .github/verify-live-trigger.txt

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate verifiers
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/verify-dtfseeds-production-cutover.yml
          test -s .github/workflows/verify-dtfseeds-feature-surface.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/verify-dtfseeds-production-cutover.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/verify-dtfseeds-feature-surface.yml

      - name: Dispatch definitive live verifier
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run verify-dtfseeds-production-cutover.yml --ref main

      - name: Dispatch and wait for feature surface audit
        id: feature
        shell: bash
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run verify-dtfseeds-feature-surface.yml --ref main
          run_id=''
          for attempt in $(seq 1 20); do
            run_id="$(gh run list --workflow verify-dtfseeds-feature-surface.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq '[.[] | select(.createdAt >= "'"$before"'")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 3
          done
          if [[ -z "$run_id" ]]; then
            echo 'Could not identify newly dispatched feature audit run.' >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Feature audit run: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Report verifier dispatch
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          FEATURE_RUN_ID: ${{ steps.feature.outputs.run_id }}
          FEATURE_OUTCOME: ${{ steps.feature.outcome }}
        with:
          script: |
            const featureLink = process.env.FEATURE_RUN_ID
              ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.FEATURE_RUN_ID}`
              : 'not-resolved';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## DTFSeeds live-verifier dispatch',
                '',
                `Dispatcher: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Status: **${process.env.STATUS}**`,
                `Feature audit: **${process.env.FEATURE_OUTCOME || 'not-run'}** — ${featureLink}`,
                '',
                'The feature audit is read-only, is resolved to the newly dispatched run, waits for completion, and requires a complete 13-route report.'
              ].join('\n')
            });

# Trusted-main trigger: deterministic complete feature audit.
