name: Force DTFSeeds Live Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-live-verification.yml
      - .github/verify-live-trigger.txt

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate verifier
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/verify-dtfseeds-production-cutover.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/verify-dtfseeds-production-cutover.yml

      - name: Dispatch definitive live verifier
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run verify-dtfseeds-production-cutover.yml --ref main

      - name: Report verifier dispatch
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Definitive live-verifier dispatch',
                '',
                `Dispatcher: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Status: **${process.env.STATUS}**`,
                'Requested: Verify DTFSeeds Production Cutover',
                '',
                'Read-only verification only; this dispatcher does not mutate WordPress or Hostinger production state.'
              ].join('\n')
            });
