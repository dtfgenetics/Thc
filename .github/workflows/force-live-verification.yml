name: Force DTFSeeds Live Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-live-verification.yml
      - .github/verify-live-trigger.txt

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate protected deployment target
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .github/workflows/deploy-public-suite-wordpress-v2.yml \
            .github/workflows/verify-dtfseeds-production-cutover.yml \
            .github/workflows/verify-dtfseeds-feature-surface.yml \
            .github/workflows/validate-wordpress-public-suite-bridge.yml; do
            test -s "$file"
            grep -Fq 'workflow_dispatch:' "$file"
          done
          python scripts/assemble-wordpress-suite-v2.py "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          node --check "$RUNNER_TEMP/deploy-public-suite-v2.mjs"

      - name: Dispatch and wait for protected Public Suite deployment v2
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run deploy-public-suite-wordpress-v2.yml --ref main
          run_id=''
          for attempt in $(seq 1 40); do
            run_id="$(gh run list --workflow deploy-public-suite-wordpress-v2.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq '[.[] | select(.createdAt >= "'"$before"'")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 3
          done
          [[ -n "$run_id" ]] || { echo 'Could not identify newly dispatched protected v2 deployment run.' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Protected v2 deployment run: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Report trusted production dispatch
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          DEPLOY_RUN_ID: ${{ steps.deploy.outputs.run_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const link = process.env.DEPLOY_RUN_ID
              ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.DEPLOY_RUN_ID}`
              : 'not-resolved';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Trusted protected Public Suite v2 dispatch',
                '',
                `Dispatcher: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Dispatcher status: **${process.env.STATUS}**`,
                `Protected deployment: **${process.env.DEPLOY_OUTCOME || 'not-run'}** — ${link}`,
                '',
                'This dispatcher launches the protected production workflow. That child workflow builds a fresh suite, deploys only allowlisted app routes through the transactional WordPress bridge, preserves WordPress ownership of /, /learn/, and /blog/, and runs independent live verification.'
              ].join('\n')
            });

# Trusted-main trigger: protected WordPress v2 Public Suite publication. Retry after run-ID resolver fix.
