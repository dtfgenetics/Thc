name: Root Cause CI

on:
  pull_request:
    branches: [main]
    paths:
      - games/root-cause/**
      - site/public-route-patch/games/root-cause/**
      - .github/workflows/root-cause-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate case bank and public copy
        run: node games/root-cause/scripts/validate-data.mjs

      - name: Run deterministic deduction engine tests
        run: node games/root-cause/test/engine.test.mjs

      - name: Validate browser JavaScript syntax
        run: |
          node --check site/public-route-patch/games/root-cause/app.js
          node --check site/public-route-patch/games/root-cause/engine.js
          node --check site/public-route-patch/games/root-cause/engine.mjs
          node --check games/root-cause/test/browser-smoke.mjs

      - name: Verify canonical and public module engine match
        run: cmp games/root-cause/src/engine.mjs site/public-route-patch/games/root-cause/engine.mjs

      - name: Run public runtime regression checks
        run: node games/root-cause/test/public-runtime.test.mjs

      - name: Verify route and interaction contracts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('site/public-route-patch/games/root-cause/index.html','utf8');
          const css = fs.readFileSync('site/public-route-patch/games/root-cause/root-cause.css','utf8');
          const visual = fs.readFileSync('site/public-route-patch/games/root-cause/root-cause-v2.css','utf8');
          const app = fs.readFileSync('site/public-route-patch/games/root-cause/app.js','utf8');
          const engine = fs.readFileSync('site/public-route-patch/games/root-cause/engine.js','utf8');
          const requireText = (source, text, label) => {
            if (!source.includes(text)) throw new Error(`missing ${label}: ${text}`);
          };
          requireText(html, '<link rel="canonical" href="https://dtfseeds.com/games/root-cause/">', 'canonical route');
          requireText(html, '<script src="./engine.js" defer></script>', 'classic engine entrypoint');
          requireText(html, '<script src="./app.js" defer></script>', 'classic controller entrypoint');
          if (html.includes('type="module"')) throw new Error('public route must not require ES-module serving');
          requireText(html, 'root-cause-v2.css', 'V2 case-file visual layer');
          requireText(html, 'Education boundary:', 'education boundary');
          requireText(app, 'data.cases?.length !== 12', 'case contract');
          requireText(app, 'data.diagnoses?.length !== 12', 'diagnosis contract');
          requireText(app, 'MAX_INSPECTIONS', 'inspection limit');
          requireText(engine, 'globalThis.RootCauseEngine = Object.freeze', 'classic engine namespace');
          requireText(css, '.plant-visual', 'original plant renderer');
          requireText(css, '@media(prefers-reduced-motion:reduce)', 'base reduced motion');
          requireText(visual, 'data-case-status="solved"', 'solved presentation state');
          requireText(visual, '.control-card:focus-within', 'focused control hierarchy');
          NODE

      - name: Install Chromium for player-facing QA
        run: npx playwright install --with-deps chromium

      - name: Run desktop mobile keyboard and accessibility smoke
        run: node games/root-cause/test/browser-smoke.mjs

      - name: Verify truthful release boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const game = JSON.parse(fs.readFileSync('games/root-cause/game.json','utf8'));
          if (game.status !== 'browser-vertical-slice') throw new Error('unexpected game status');
          if (game.route !== '/games/root-cause/') throw new Error('unexpected route');
          if (game.releaseGates.rulesTested !== true) throw new Error('rules suite must be recorded as tested');
          if (game.releaseGates.deploymentRegistered !== true) throw new Error('deploymentRegistered must be true after canonical registry reconciliation');
          if (game.releaseGates.browserTested !== true) throw new Error('browserTested must be true after Chromium QA');
          if (game.releaseGates.mobileTested !== true) throw new Error('mobileTested must be true after 390px Chromium QA');
          if (game.releaseGates.accessibilityReviewed !== true) throw new Error('accessibilityReviewed must be true after keyboard/live-region/accessibility QA');
          NODE
