name: Root Cause CI

on:
  push:
    branches: [main]
    paths:
      - games/root-cause/**
      - site/public-route-patch/games/root-cause/**
      - .github/workflows/root-cause-ci.yml
  pull_request:
    branches: [main]
    paths:
      - games/root-cause/**
      - site/public-route-patch/games/root-cause/**
      - .github/workflows/root-cause-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate case bank and public copy
        run: node games/root-cause/scripts/validate-data.mjs

      - name: Run deterministic deduction engine tests
        run: node games/root-cause/test/engine.test.mjs

      - name: Validate public JavaScript syntax
        run: |
          node --check site/public-route-patch/games/root-cause/app.js
          node --check site/public-route-patch/games/root-cause/runtime.mjs
          node --check site/public-route-patch/games/root-cause/engine.mjs

      - name: Verify canonical and public module engine match
        run: cmp games/root-cause/src/engine.mjs site/public-route-patch/games/root-cause/engine.mjs

      - name: Run public runtime regression checks
        run: node games/root-cause/test/public-runtime.test.mjs

      - name: Verify route interaction accessibility and responsive contracts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('site/public-route-patch/games/root-cause/index.html','utf8');
          const css = fs.readFileSync('site/public-route-patch/games/root-cause/root-cause.css','utf8');
          const visual = fs.readFileSync('site/public-route-patch/games/root-cause/root-cause-v2.css','utf8');
          const app = fs.readFileSync('site/public-route-patch/games/root-cause/app.js','utf8');
          const runtime = fs.readFileSync('site/public-route-patch/games/root-cause/runtime.mjs','utf8');
          const requireText = (source, text, label) => {
            if (!source.includes(text)) throw new Error(`missing ${label}: ${text}`);
          };
          requireText(html, '<link rel="canonical" href="https://dtfseeds.com/games/root-cause/">', 'canonical route');
          requireText(html, '<script src="./app.js" defer></script>', 'bootstrap entrypoint');
          requireText(app, "import('./runtime.mjs')", 'module runtime bootstrap');
          if (html.includes('./engine.js')) throw new Error('removed classic engine must not be reintroduced');
          requireText(html, 'root-cause-v2.css', 'V2 case-file visual layer');
          requireText(html, 'Education boundary:', 'education boundary');
          requireText(runtime, 'data.cases?.length !== 12', 'case contract');
          requireText(runtime, 'data.diagnoses?.length !== 12', 'diagnosis contract');
          requireText(runtime, 'MAX_INSPECTIONS', 'inspection limit');
          requireText(runtime, "from './engine.mjs'", 'module engine import');
          requireText(css, '.plant-visual', 'plant renderer');
          requireText(css, '@media(prefers-reduced-motion:reduce)', 'reduced motion support');
          requireText(visual, 'data-case-status="solved"', 'solved presentation state');
          requireText(visual, '.control-card:focus-within', 'focus hierarchy');
          if (!/@media[^\{]*\(max-width\s*:\s*\d+px\)/.test(css + '\n' + visual)) {
            throw new Error('responsive breakpoint contract missing');
          }
          NODE

      - name: Verify truthful release boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const game = JSON.parse(fs.readFileSync('games/root-cause/game.json','utf8'));
          if (game.status !== 'browser-vertical-slice') throw new Error('unexpected game status');
          if (game.route !== '/games/root-cause/') throw new Error('unexpected route');
          if (game.releaseGates.rulesTested !== true) throw new Error('rules suite must be recorded as tested');
          if (game.releaseGates.deploymentRegistered !== true) throw new Error('deploymentRegistered must be true after canonical registry reconciliation');
          NODE
