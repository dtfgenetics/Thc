name: Diagnose Seeds SeedProd State

on:
  pull_request:
    paths:
      - scripts/diagnose-seeds-seedprod-state.mjs
      - .github/workflows/diagnose-seeds-seedprod-state.yml
      - .github/diagnose-seeds-seedprod-state-trigger.txt
  push:
    branches: [main]
    paths:
      - .github/diagnose-seeds-seedprod-state-trigger.txt

permissions:
  contents: read

concurrency:
  group: dtfseeds-seedprod-state-diagnostic
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SeedProd diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/diagnose-seeds-seedprod-state.mjs
          grep -Fq "seedprod_lite_lppage_render" scripts/diagnose-seeds-seedprod-state.mjs
          grep -Fq "ReflectionFunction" scripts/diagnose-seeds-seedprod-state.mjs
          grep -Fq "SHOW TABLES LIKE" scripts/diagnose-seeds-seedprod-state.mjs
          grep -Fq "page_868_related_meta" scripts/diagnose-seeds-seedprod-state.mjs
          grep -Fq "cleanupSnippet" scripts/diagnose-seeds-seedprod-state.mjs
          ! grep -Fq "/wp-json/wp/v2/plugins" scripts/diagnose-seeds-seedprod-state.mjs
          ! grep -Eq 'wp_update_post[[:space:]]*\(|update_post_meta[[:space:]]*\(|delete_post_meta[[:space:]]*\(|set_post_thumbnail[[:space:]]*\(|update_option[[:space:]]*\(|delete_option[[:space:]]*\(|INSERT[[:space:]]+INTO|UPDATE[[:space:]].*[[:space:]]SET|DELETE[[:space:]]+FROM|ALTER[[:space:]]+TABLE|DROP[[:space:]]+TABLE' scripts/diagnose-seeds-seedprod-state.mjs

  diagnose-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require proven WordPress credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
      - name: Inspect SeedProd Seeds interception state
        id: diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/diagnose-seeds-seedprod-state.mjs \
            | tee "$RUNNER_TEMP/seeds-seedprod-state.json"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/seeds-seedprod-state.json"
      - name: Upload SeedProd evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeds-seedprod-state-${{ github.run_id }}
          path: ${{ runner.temp }}/seeds-seedprod-state.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize diagnostic status
        if: always()
        shell: bash
        run: |
          {
            echo '## Seeds SeedProd state diagnostic'
            echo
            echo "- Diagnostic: ${{ steps.diagnostic.outcome }}"
            echo '- Scope: SeedProd template override function, option names/fingerprints, landing-page/post records, SeedProd tables, and page 868 related metadata.'
            echo '- Persistent production mutation: none.'
            echo '- Temporary diagnostic snippet: removed in finally.'
          } >> "$GITHUB_STEP_SUMMARY"
