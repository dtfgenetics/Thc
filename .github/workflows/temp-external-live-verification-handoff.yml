name: Temporary External Live Verification Handoff

on:
  push:
    branches:
      - fix/external-live-verification-handoff-20260912
    paths:
      - scripts/apply-external-live-verification-handoff.mjs
      - .github/workflows/temp-external-live-verification-handoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deployment verification patch
        run: node scripts/apply-external-live-verification-handoff.mjs
      - name: Commit deployment workflow update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-public-suite-wordpress-v2.yml
          git commit -m 'Verify exact external game revisions after deployment'
          git push origin HEAD:${GITHUB_REF_NAME}
