name: Project OS Quality Gate

on:
  pull_request:
    paths:
      - "data/asset-state-registry.json"
      - "data/asset-state-registry.schema.json"
      - "data/asset-manifest.json"
      - "data/game-source-map.json"
      - "data/game-location-registry.json"
      - "data/project-registry.json"
      - "scripts/validate-3d-assets.mjs"
      - "scripts/validate-asset-state-registry.mjs"
      - "apps/**"
      - "games/**"
      - "site/**"
      - "assets/**"
      - "package.json"
      - ".github/workflows/project-os-quality.yml"
  push:
    branches: [main]
    paths:
      - "data/asset-state-registry.json"
      - "data/asset-state-registry.schema.json"
      - "data/asset-manifest.json"
      - "data/game-source-map.json"
      - "data/game-location-registry.json"
      - "data/project-registry.json"
      - "scripts/validate-3d-assets.mjs"
      - "scripts/validate-asset-state-registry.mjs"
      - "apps/**"
      - "games/**"
      - "site/**"
      - "assets/**"
      - "package.json"
      - ".github/workflows/project-os-quality.yml"

permissions:
  contents: read

jobs:
  project-os:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production standards
        run: npm run verify:production-standards

      - name: Verify shared UI standard
        run: npm run verify:shared-ui-standard

      - name: Verify page composition
        run: npm run verify:page-composition

      - name: Verify canonical cultivation tool mirror
        run: npm run verify:cultivation-reference-tools

      - name: Validate GrowLens release contract
        run: npm run validate:growlens-release-contract

      - name: Validate Grow Doc release pin
        run: npm run validate:grow-doc-release-pin

      - name: Verify portfolio registry
        run: npm run verify:portfolio

      - name: Verify game location registry
        run: npm run games:locations:check

      - name: Verify asset states
        run: npm run verify:asset-states

      - name: Verify 3D assets
        run: npm run verify:3d-assets

      - name: Validate public-suite qualification workflow
        run: npm run validate:public-suite-qualification-workflow
