name: THC Encyclopedia Production CI

on:
  pull_request:
    paths:
      - 'content/encyclopedia/**'
      - 'content/encyclopedia/evidence/**'
      - 'configuration/encyclopedia-topics.json'
      - 'configuration/encyclopedia-search-language.json'
      - 'configuration/encyclopedia-search-benchmark.json'
      - 'data/encyclopedia-completion-scorecard.json'
      - 'data/encyclopedia-evidence-tracking.json'
      - 'data/encyclopedia-assessment-rationale-package.json'
      - 'data/encyclopedia-source-resolution-queue.json'
      - 'site/public-route-patch/learn/encyclopedia/**'
      - 'site/public-route-patch/learn/search/**'
      - 'site/wordpress/education/encyclopedia/**'
      - 'scripts/build-wordpress-learning-search-runtime.mjs'
      - 'site/wordpress/mu-plugins/dtf-learning-search/**'
      - 'site/wordpress/mu-plugins/dtf-learning-search.php'
      - 'scripts/*encyclopedia*.mjs'
      - 'scripts/lib/encyclopedia-*.mjs'
      - 'scripts/*evidence*.mjs'
      - 'scripts/build-thc-education-search-index.mjs'
      - 'scripts/validate-thc-education-search.mjs'
      - '.agents/skills/thc-encyclopedia-production/**'
      - '.github/workflows/thc-encyclopedia-production.yml'
      - 'docs/ENCYCLOPEDIA_CONTENT_GAP_REGISTER.md'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'content/encyclopedia/**'
      - 'content/encyclopedia/evidence/**'
      - 'configuration/encyclopedia-topics.json'
      - 'configuration/encyclopedia-search-language.json'
      - 'data/encyclopedia-evidence-tracking.json'
      - 'data/encyclopedia-assessment-rationale-package.json'
      - 'data/encyclopedia-source-resolution-queue.json'
      - 'site/public-route-patch/learn/encyclopedia/**'
      - 'scripts/*encyclopedia*.mjs'
      - 'scripts/lib/encyclopedia-*.mjs'
      - 'scripts/*evidence*.mjs'
      - '.agents/skills/thc-encyclopedia-production/**'
      - '.github/workflows/thc-encyclopedia-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encyclopedia:
    name: Validate 420+ encyclopedia production system
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build completion scorecard
        run: npm run build:encyclopedia-scorecard
      - name: Validate reviewed dataset claim bridge
        run: npm run verify:encyclopedia-dataset-claim-bridge
      - name: Build evidence tracking
        run: npm run build:encyclopedia-evidence
      - name: Build evidence priority queue
        run: npm run build:encyclopedia-evidence-priority
      - name: Validate completion scorecard
        run: node scripts/validate-encyclopedia-completion-scorecard.mjs
      - name: Validate evidence tracking
        run: node scripts/validate-encyclopedia-evidence-tracking.mjs
      - name: Build and validate encyclopedia production queues
        run: npm run verify:encyclopedia-production-queues
      - name: Audit encyclopedia learning quality
        run: npm run audit:encyclopedia-learning-quality
      - name: Audit substantive lesson quality
        run: npm run audit:encyclopedia-substantive-quality
      - name: Build rich discovery index
        run: npm run build:encyclopedia-discovery
      - name: Build global education search
        run: node scripts/build-thc-education-search-index.mjs
      - name: Validate encyclopedia and education search
        run: node scripts/validate-thc-education-search.mjs
      - name: Validate WordPress learning search runtime
        run: |
          php -l site/wordpress/mu-plugins/dtf-learning-search.php
          npm run verify:wordpress-learning-search
      - name: Validate search relevance benchmark
        run: node scripts/validate-encyclopedia-search-benchmark.mjs
      - name: Validate lesson renderer contract
        run: npm run verify:encyclopedia-renderer
      - name: Validate encyclopedia production skill
        run: npm run verify:encyclopedia-skill
      - name: Validate controlled lesson structure
        run: npm run verify:encyclopedia-content-control
      - name: Validate assessments
        run: npm run verify:encyclopedia-assessments
      - name: Upload generated encyclopedia artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thc-encyclopedia-generated
          path: |
            data/encyclopedia-completion-scorecard.json
            data/encyclopedia-evidence-tracking.json
            data/encyclopedia-evidence-priority.json
            data/encyclopedia-assessment-rationale-package.json
            data/encyclopedia-source-resolution-queue.json
            content/encyclopedia/visual-production-queue-v1.json
            data/encyclopedia-learning-quality-audit.json
            data/encyclopedia-substantive-quality-audit.json
            site/public-route-patch/learn/encyclopedia/encyclopedia-index.json
            site/public-route-patch/learn/search/search-index.json
          if-no-files-found: error
          retention-days: 7
      - name: Report generated artifact changes
        run: |
          echo "Generated artifacts are build outputs and are uploaded above."
          git diff --stat -- \
            data/encyclopedia-completion-scorecard.json \
            data/encyclopedia-evidence-tracking.json \
            site/public-route-patch/learn/encyclopedia/encyclopedia-index.json \
            site/public-route-patch/learn/search/search-index.json || true
