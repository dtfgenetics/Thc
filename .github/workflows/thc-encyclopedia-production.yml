name: THC Encyclopedia Production CI

on:
  pull_request:
    paths:
      - 'content/encyclopedia/**'
      - 'content/encyclopedia/evidence/**'
      - 'configuration/encyclopedia-topics.json'
      - 'configuration/encyclopedia-search-language.json'
      - 'configuration/encyclopedia-production-floor.json'
      - 'configuration/education-search-static-records.json'
      - 'configuration/encyclopedia-search-benchmark.json'
      - 'data/encyclopedia-completion-scorecard.json'
      - 'data/encyclopedia-evidence-tracking.json'
      - 'data/encyclopedia-assessment-rationale-package.json'
      - 'data/encyclopedia-source-resolution-queue.json'
      - 'data/encyclopedia-claim-evidence-candidates.json'
      - 'data/encyclopedia-independent-review-manifest.json'
      - 'site/public-route-patch/learn/encyclopedia/**'
      - 'site/wordpress/education/encyclopedia-deployment-target.json'
      - 'scripts/resolve-encyclopedia-deployment-target.mjs'
      - 'scripts/validate-encyclopedia-source-pin.mjs'
      - 'scripts/audit-encyclopedia-source-parity.mjs'
      - 'site/public-route-patch/learn/search/**'
      - 'site/wordpress/education/encyclopedia/**'
      - 'scripts/build-wordpress-learning-search-runtime.mjs'
      - 'site/wordpress/mu-plugins/dtf-learning-search/**'
      - 'site/wordpress/mu-plugins/dtf-learning-search.php'
      - 'scripts/*encyclopedia*.mjs'
      - 'scripts/lib/encyclopedia-*.mjs'
      - 'scripts/*evidence*.mjs'
      - 'site/wordpress/education/academy-deployment-target.json'
      - 'site/wordpress/education/course-catalog-v4.json'
      - 'site/wordpress/education/tech1-courses-public-v1.json'
      - 'site/wordpress/education/tech2-courses-public-v1.json'
      - 'scripts/build-thc-education-search-index.mjs'
      - 'scripts/validate-thc-education-search.mjs'
      - '.agents/skills/thc-encyclopedia-production/**'
      - '.github/workflows/thc-encyclopedia-production.yml'
      - 'docs/ENCYCLOPEDIA_CONTENT_GAP_REGISTER.md'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'site/public-route-patch/learn/search/**'
      - 'site/wordpress/mu-plugins/dtf-learning-search/**'
      - 'site/wordpress/mu-plugins/dtf-learning-search.php'
      - 'scripts/build-wordpress-learning-search-runtime.mjs'
      - 'scripts/build-thc-education-search-index.mjs'
      - 'scripts/validate-thc-education-search.mjs'
      - 'content/encyclopedia/**'
      - 'content/encyclopedia/evidence/**'
      - 'configuration/encyclopedia-topics.json'
      - 'configuration/encyclopedia-search-language.json'
      - 'data/encyclopedia-evidence-tracking.json'
      - 'data/encyclopedia-assessment-rationale-package.json'
      - 'data/encyclopedia-source-resolution-queue.json'
      - 'data/encyclopedia-claim-evidence-candidates.json'
      - 'site/public-route-patch/learn/encyclopedia/**'
      - 'site/wordpress/education/encyclopedia-deployment-target.json'
      - 'scripts/resolve-encyclopedia-deployment-target.mjs'
      - 'scripts/validate-encyclopedia-source-pin.mjs'
      - 'scripts/audit-encyclopedia-source-parity.mjs'
      - 'scripts/*encyclopedia*.mjs'
      - 'scripts/lib/encyclopedia-*.mjs'
      - 'scripts/*evidence*.mjs'
      - '.agents/skills/thc-encyclopedia-production/**'
      - '.github/workflows/thc-encyclopedia-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encyclopedia:
    name: Validate 420+ encyclopedia production system
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical encyclopedia source pin
        run: npm run verify:encyclopedia-source-pin
      - name: Resolve pinned canonical encyclopedia revision
        run: node scripts/resolve-encyclopedia-deployment-target.mjs --github-env
      - name: Verify pinned canonical source parity
        run: node scripts/audit-encyclopedia-source-parity.mjs
      - name: Validate forward-only production pointer
        run: node scripts/validate-encyclopedia-production-pointer.mjs
      - name: Validate shared authoritative source bridge
        run: npm run verify:encyclopedia-shared-source-bridge
      - name: Build completion scorecard
        run: npm run build:encyclopedia-scorecard
      - name: Validate encyclopedia research pipeline
        run: npm run verify:encyclopedia-research-pipeline
      - name: Rebuild source-resolution queue for evidence references
        run: npm run build:encyclopedia-source-queue
      - name: Build evidence tracking
        run: npm run build:encyclopedia-evidence
      - name: Build evidence priority queue
        run: npm run build:encyclopedia-evidence-priority
      - name: Validate completion scorecard
        run: node scripts/validate-encyclopedia-completion-scorecard.mjs
      - name: Validate evidence tracking
        run: node scripts/validate-encyclopedia-evidence-tracking.mjs
      - name: Build and validate encyclopedia production queues
        run: npm run verify:encyclopedia-production-queues
      - name: Build claim-evidence candidate ledger
        run: npm run verify:encyclopedia-claim-evidence-candidates
      - name: Build unified production readiness
        run: npm run build:encyclopedia-production-readiness
      - name: Validate unified production readiness
        run: node scripts/validate-encyclopedia-production-readiness.mjs
      - name: Build and validate independent-review manifest
        run: npm run verify:encyclopedia-independent-review
      - name: Audit encyclopedia learning quality
        run: npm run audit:encyclopedia-learning-quality
      - name: Audit substantive lesson quality
        run: npm run audit:encyclopedia-substantive-quality:strict
      - name: Audit cross-corpus consistency
        run: npm run audit:encyclopedia-consistency
      - name: Build rich discovery index
        run: npm run build:encyclopedia-discovery
      - name: Build global education search
        run: node scripts/build-thc-education-search-index.mjs
      - name: Validate encyclopedia and education search
        run: node scripts/validate-thc-education-search.mjs
      - name: Validate WordPress learning search runtime
        run: |
          php -l site/wordpress/mu-plugins/dtf-learning-search.php
          npm run verify:wordpress-learning-search
      - name: Validate search relevance benchmark
        run: node scripts/validate-encyclopedia-search-benchmark.mjs
      - name: Validate lesson renderer contract
        run: npm run verify:encyclopedia-renderer
      - name: Validate lesson structured data
        run: npm run verify:encyclopedia-structured-data
      - name: Build and validate source freshness queue
        run: npm run verify:encyclopedia-source-freshness
      - name: Validate encyclopedia production skill
        run: npm run verify:encyclopedia-skill
      - name: Validate controlled lesson structure
        run: npm run verify:encyclopedia-content-control
      - name: Validate release-review control coverage
        shell: bash
        run: |
          set -euo pipefail
          npm run build:encyclopedia-release-review-queue
          node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('data/encyclopedia-release-review-queue.json','utf8'));
          if(q.summary.releaseReviewUnrecorded!==0) throw new Error(`Release review control is missing for ${q.summary.releaseReviewUnrecorded} owner-authorized lesson(s).`);
          if(q.summary.safetyHolds!==0) console.log(`Safety holds remain explicit: ${q.summary.safetyHolds}`);
          console.log(`Release-review control coverage PASS: ${q.summary.publicationControlledComplete}/420 core lessons controlled.`);
          NODE
      - name: Validate assessments
        run: npm run verify:encyclopedia-assessments
      - name: Audit live encyclopedia copy
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          node scripts/audit-live-encyclopedia-copy.mjs || {
            echo "::warning::Live encyclopedia copy drift detected. The protected copy-repair workflow owns production reconciliation; source CI remains authoritative for repository quality."
            exit 1
          }
      - name: Upload generated encyclopedia artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thc-encyclopedia-generated
          path: |
            data/encyclopedia-completion-scorecard.json
            data/encyclopedia-evidence-tracking.json
            data/encyclopedia-evidence-priority.json
            data/encyclopedia-assessment-rationale-package.json
            data/encyclopedia-source-resolution-queue.json
            data/encyclopedia-source-freshness.json
            data/encyclopedia-claim-evidence-candidates.json
            data/encyclopedia-production-readiness.json
            data/encyclopedia-independent-review-manifest.json
            content/encyclopedia/visual-production-queue-v1.json
            data/encyclopedia-learning-quality-audit.json
            data/encyclopedia-substantive-quality-audit.json
            data/encyclopedia-consistency-audit.json
            live-encyclopedia-copy-audit.json
            site/public-route-patch/learn/encyclopedia/encyclopedia-index.json
            site/public-route-patch/learn/search/search-index.json
          if-no-files-found: error
          retention-days: 7
      - name: Report generated artifact changes
        run: |
          echo "Generated artifacts are build outputs and are uploaded above."
          git diff --stat -- \
            data/encyclopedia-completion-scorecard.json \
            data/encyclopedia-evidence-tracking.json \
            data/encyclopedia-production-readiness.json \
            site/public-route-patch/learn/encyclopedia/encyclopedia-index.json \
            site/public-route-patch/learn/search/search-index.json || true
