# This workflow triggers Datadog Synthetic tests against deployed visitor-facing routes.
# It intentionally does not run on pull requests: those tests exercise the live site,
# not an isolated PR deployment, so PR execution would consume a runner without
# validating the proposed branch.

name: Run Datadog Synthetic tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/**'
      - 'games/**'
      - 'data/genetics/**'
      - '.github/workflows/datadog-synthetics.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Skip Datadog when credentials are unavailable
        if: ${{ env.DD_API_KEY == '' || env.DD_APP_KEY == '' }}
        run: echo "Datadog Synthetic tests skipped because DD_API_KEY or DD_APP_KEY is not configured."

      - name: Run Datadog Synthetic tests
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'
