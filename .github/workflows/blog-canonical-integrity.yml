name: DTFSeeds Canonical Blog Integrity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - site/wordpress/pages/blog.html
      - scripts/apply-wordpress-public-content-rest.mjs
      - .github/workflows/blog-canonical-integrity.yml
  push:
    branches: [main]
    paths:
      - site/wordpress/pages/blog.html
      - scripts/apply-wordpress-public-content-rest.mjs
      - .github/workflows/blog-canonical-integrity.yml
  workflow_run:
    workflows:
      - Publish DTFSeeds WordPress Production
    types: [completed]

permissions:
  contents: read

jobs:
  source-contract:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical Blog source and ownership contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-wordpress-public-content-rest.mjs
          test -s site/wordpress/pages/blog.html
          grep -Fq 'DTF Field Notes &amp; Updates' site/wordpress/pages/blog.html
          grep -Fq 'Follow what we are learning, building, and releasing.' site/wordpress/pages/blog.html
          grep -Fq "['blog', 'DTF Field Notes & Updates']" scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'page_for_posts: 0' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'while preserving publication' scripts/apply-wordpress-public-content-rest.mjs
          ! grep -Fqi 'email@email.com' site/wordpress/pages/blog.html
          ! grep -Fq '+123456789' site/wordpress/pages/blog.html
          ! grep -Fqi 'cannabis-themed apparel' site/wordpress/pages/blog.html

  live-contract:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify ordinary public Blog route
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          headers="$(mktemp)"
          status="$(curl -fsS --retry 6 --retry-delay 4 \
            --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            -H 'Pragma: no-cache' \
            'https://dtfseeds.com/blog/')"
          [[ "$status" == '200' ]] || { echo "Blog returned HTTP $status" >&2; cat "$headers" >&2; exit 1; }
          ! grep -Eiq '^location:' "$headers" || { echo 'Blog unexpectedly redirects.' >&2; cat "$headers" >&2; exit 1; }
          grep -Fqi 'DTF Field Notes &amp; Updates' "$body" || grep -Fqi 'DTF Field Notes & Updates' "$body"
          grep -Fqi 'Follow what we are learning, building, and releasing.' "$body"
          for forbidden in \
            'email@email.com' \
            '+123456789' \
            'Your Destination for Cannabis-themed Apparel and Art' \
            'A Hub for Cannabis Art and Gardening Tools'; do
            ! grep -Fqi "$forbidden" "$body" || { echo "Stale Blog fingerprint remains: $forbidden" >&2; exit 1; }
          done
          rm -f "$body" "$headers"
