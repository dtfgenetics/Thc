name: Seed Man Five World Renderer Patch

on:
  push:
    branches: [seed-man-five-world-renderer-20260908]
    paths:
      - .github/workflows/seed-man-five-world-renderer-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seed-man-five-world-renderer-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch world-aware Three.js presentation
        run: python3 scripts/patch-seed-man-five-world-renderer.py
      - name: Validate renderer source and bundle
        run: |
          npm install --prefix games/seed-man-platformer --ignore-scripts --no-audit --no-fund --no-package-lock
          node --check games/seed-man-platformer/src/render/three-world.mjs
          npm run --prefix games/seed-man-platformer build:three-public
          grep -Fq 'seed-man-five-world-backdrop-v1' games/seed-man-platformer/dist/three-world-v1.js
          for world in greenhouse-valley forest-ruins desert-canyon frozen-peak eco-city; do grep -Fq "$world" games/seed-man-platformer/dist/three-world-v1.js; done
          node games/seed-man-platformer/test/three-world-state.test.mjs
          node games/seed-man-platformer/test/visual-runtime.test.mjs
      - name: Commit renderer patch
        run: |
          git config user.name 'DTF Seed Man Renderer Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/seed-man-platformer/src/render/three-world.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Render all five Seed Man visual worlds [five-world-renderer]'
          git push origin HEAD:seed-man-five-world-renderer-20260908
