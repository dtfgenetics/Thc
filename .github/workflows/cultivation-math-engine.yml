name: Cultivation Math Engine

on:
  pull_request:
    paths:
      - 'site/public-route-patch/assets/thc-cultivation-math-v1.mjs'
      - 'scripts/test-cultivation-math-engine.mjs'
      - 'scripts/validate-cultivation-math-engine-static.mjs'
      - 'scripts/run-cultivation-math-engine-checks.mjs'
      - '.github/workflows/cultivation-math-engine.yml'
  push:
    branches: [main]
    paths:
      - 'site/public-route-patch/assets/thc-cultivation-math-v1.mjs'
      - 'scripts/test-cultivation-math-engine.mjs'
      - 'scripts/validate-cultivation-math-engine-static.mjs'
      - 'scripts/run-cultivation-math-engine-checks.mjs'

jobs:
  deterministic-node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/run-cultivation-math-engine-checks.mjs
