name: Temporary Root Cause Stacked Result Fix

on:
  push:
    branches:
      - fix/root-cause-stacked-result-visibility-20260912
    paths:
      - scripts/apply-root-cause-stacked-result-fix.mjs
      - .github/workflows/temp-root-cause-stacked-result-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/apply-root-cause-stacked-result-fix.mjs
      - name: Commit runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/public-route-patch/games/root-cause/app.js
          git commit -m 'Reveal Root Cause results in stacked layouts'
          git push origin HEAD:${GITHUB_REF_NAME}
