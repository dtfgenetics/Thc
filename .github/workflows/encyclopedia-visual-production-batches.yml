name: Build THC Encyclopedia Visual Production Batches

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'work/encyclopedia/**'
    paths:
      - 'content/encyclopedia/visual-production-queue-v1.json'
      - 'package.json'
      - 'scripts/build-encyclopedia-visual-production-queue.mjs'
      - 'scripts/validate-encyclopedia-visual-production-queue.mjs'
      - 'scripts/build-encyclopedia-visual-production-batches.mjs'
      - 'scripts/validate-encyclopedia-visual-production-batches.mjs'
      - '.github/workflows/encyclopedia-visual-production-batches.yml'

permissions:
  contents: read

concurrency:
  group: encyclopedia-visual-production-batches
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate controlled visual batches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate visual production inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s content/encyclopedia/visual-production-queue-v1.json
          test -s scripts/build-encyclopedia-visual-production-queue.mjs
          test -s scripts/build-encyclopedia-visual-production-batches.mjs

      - name: Rebuild and validate current visual-depth evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:encyclopedia-visual-depth

      - name: Confirm generated review-controlled production batches
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-encyclopedia-visual-production-batches.mjs
          test -s content/encyclopedia/visual-production-batches/index.json

      - name: Confirm evidence rebuild remains review-only
        shell: bash
        run: |
          set -euo pipefail
          test -s content/encyclopedia/visual-production-batches/index.json
          node - <<'NODE'
          const fs=require('fs');
          const index=JSON.parse(fs.readFileSync('content/encyclopedia/visual-production-batches/index.json','utf8'));
          if(!Number.isInteger(index.artworkNeededCount) || index.artworkNeededCount < 0 || !Number.isInteger(index.batchCount) || index.batchCount < 0) throw new Error('Visual production evidence index is incomplete.');
          if(index.artworkNeededCount === 0 && index.batchCount !== 0) throw new Error('Zero missing visual tasks must produce zero batches.');
          if(index.artworkNeededCount > 0 && index.batchCount === 0) throw new Error('Missing visual tasks require at least one controlled batch.');
          if(index.visualTaskCount !== index.artworkNeededCount) throw new Error('Visual task count must match artwork-needed task count.');
          if(!Number.isInteger(index.lessonCountWithGaps) || index.lessonCountWithGaps < 0) throw new Error('Lesson gap count is incomplete.');
          console.log(`Review-only evidence: ${index.visualTaskCount} missing visual-role tasks across ${index.lessonCountWithGaps} lessons in ${index.batchCount} batches.`);
          NODE

      - name: Write visual-depth job summary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const queue=JSON.parse(fs.readFileSync('content/encyclopedia/visual-production-queue-v1.json','utf8'));
          const index=JSON.parse(fs.readFileSync('content/encyclopedia/visual-production-batches/index.json','utf8'));
          const first=index.batches?.[0];
          const firstPacket=first ? JSON.parse(fs.readFileSync(first.file,'utf8')) : {items:[]};
          const s=queue.summary||{};
          const lines=[
            '# Encyclopedia visual-depth evidence',
            '',
            `- Lessons: ${s.lessonCount}`,
            `- Minimum target: ${s.minimumVisualTarget}`,
            `- Full target: ${s.fullVisualTarget}`,
            `- Role-addressed rasters: ${s.roleAddressedRasterAssetCount}`,
            `- Unclassified legacy rasters: ${s.unclassifiedLegacyRasterAssetCount}`,
            `- Missing to minimum: ${s.missingToMinimum}`,
            `- Missing to target: ${s.missingToTarget}`,
            `- Lessons with visual gaps: ${s.lessonsWithVisualGaps}`,
            `- Visual tasks needed: ${s.visualTasksNeeded}`,
            `- Controlled batches: ${index.batchCount}`,
            '',
            '## ENC-VIS-BATCH-001 preview',
            ...firstPacket.items.slice(0,24).map((item,i)=>`${i+1}. ${item.lessonId} — ${item.visualRole} → ${item.targetFilename}`)
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE

      - name: Upload production packet evidence
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-visual-production-batches-${{ github.run_id }}
          path: |
            content/encyclopedia/visual-production-queue-v1.json
            content/encyclopedia/visual-production-batches
          if-no-files-found: error
          retention-days: 30
