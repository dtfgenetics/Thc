name: Build THC Encyclopedia Visual Production Batches

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'work/encyclopedia/**'
    paths:
      - 'content/encyclopedia/visual-production-queue-v1.json'
      - 'scripts/build-encyclopedia-visual-production-batches.mjs'
      - 'scripts/validate-encyclopedia-visual-production-batches.mjs'
      - '.github/workflows/encyclopedia-visual-production-batches.yml'

permissions:
  contents: read

concurrency:
  group: encyclopedia-visual-production-batches
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate controlled visual batches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate checked-in controlled batches
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-encyclopedia-visual-production-batches.mjs

      - name: Rebuild current visual production queue for evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-encyclopedia-teaching-visuals.mjs
          node scripts/build-encyclopedia-visual-production-queue.mjs
          node scripts/validate-encyclopedia-visual-production-queue.mjs

      - name: Build review-controlled production batches
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-encyclopedia-visual-production-batches.mjs
          node scripts/validate-encyclopedia-visual-production-batches.mjs
          test -s content/encyclopedia/visual-production-batches/index.json

      - name: Confirm evidence rebuild remains review-only
        shell: bash
        run: |
          set -euo pipefail
          test -s content/encyclopedia/visual-production-batches/index.json
          node - <<'NODE'
          const fs=require('fs');
          const index=JSON.parse(fs.readFileSync('content/encyclopedia/visual-production-batches/index.json','utf8'));
          if(!Number.isInteger(index.artworkNeededCount) || index.artworkNeededCount < 0 || !Number.isInteger(index.batchCount) || index.batchCount < 0) throw new Error('Visual production evidence index is incomplete.');
          if(index.artworkNeededCount === 0 && index.batchCount !== 0) throw new Error('Zero artwork-needed lessons must produce zero batches.');
          if(index.artworkNeededCount > 0 && index.batchCount === 0) throw new Error('Artwork-needed lessons require at least one controlled batch.');
          console.log(`Review-only evidence: ${index.artworkNeededCount} artwork-needed lessons in ${index.batchCount} batches.`);
          NODE

      - name: Summarize missing educational visual roles
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const queue=JSON.parse(fs.readFileSync('content/encyclopedia/visual-production-queue-v1.json','utf8'));
          const index=JSON.parse(fs.readFileSync('content/encyclopedia/visual-production-batches/index.json','utf8'));
          const s=queue.summary||{};
          if(!Number.isInteger(index.visualTaskCount)||index.visualTaskCount<0) throw new Error('Missing visual-task count is invalid.');
          if(index.visualTaskCount!==index.artworkNeededCount) throw new Error('Visual task count differs from artwork-needed count.');
          if(!Number.isInteger(index.lessonCountWithGaps)||index.lessonCountWithGaps<0) throw new Error('Missing lesson-gap count is invalid.');
          const lines=[
            '## Encyclopedia visual-depth production evidence','',
            '- Controlled lessons: '+String(s.lessonCount??'unknown'),
            '- Minimum visuals per lesson: '+String(s.minimumVisualTarget??'unknown'),
            '- Target visuals per lesson: '+String(s.fullVisualTarget??'unknown'),
            '- Missing visual-role tasks: '+index.visualTaskCount,
            '- Lessons with visual gaps: '+index.lessonCountWithGaps,
            '- Review-controlled production batches: '+index.batchCount,
            '',
            'Candidate production is not scientific, rights, accessibility, or publication approval.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\\n')+'\\n');
          NODE

      - name: Upload production packet evidence
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-visual-production-batches-${{ github.run_id }}
          path: |
            content/encyclopedia/visual-production-queue-v1.json
            content/encyclopedia/visual-production-batches
          if-no-files-found: error
          retention-days: 30
