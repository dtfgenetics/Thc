name: Spin the Strain CI

on:
  pull_request:
    branches: [main]
    paths:
      - games/spin-the-strain/**
      - site/public-route-patch/games/spin-the-strain/**
      - .github/workflows/spin-the-strain-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate wheel data and public copy
        run: node games/spin-the-strain/scripts/validate-data.mjs

      - name: Run deterministic wheel engine tests
        run: node games/spin-the-strain/test/engine.test.mjs

      - name: Test self-contained public runtime
        run: node games/spin-the-strain/test/public-runtime.test.mjs

      - name: Validate browser JavaScript syntax
        run: |
          node --check site/public-route-patch/games/spin-the-strain/app.js
          node --check site/public-route-patch/games/spin-the-strain/engine.mjs

      - name: Verify canonical and public engine match
        shell: bash
        run: cmp games/spin-the-strain/src/engine.mjs site/public-route-patch/games/spin-the-strain/engine.mjs

      - name: Verify route assets and renderer geometry contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('site/public-route-patch/games/spin-the-strain/index.html','utf8');
          const css = fs.readFileSync('site/public-route-patch/games/spin-the-strain/spin-the-strain.css','utf8');
          const app = fs.readFileSync('site/public-route-patch/games/spin-the-strain/app.js','utf8');
          const requireText = (source, text, label) => {
            if (!source.includes(text)) throw new Error(`missing ${label}: ${text}`);
          };
          requireText(html, '<link rel="canonical" href="https://dtfseeds.com/games/spin-the-strain/">', 'canonical route');
          requireText(html, 'id="spin-the-strain-data"', 'embedded wheel data');
          requireText(html, '<script src="./app.js" defer></script>', 'classic deferred entrypoint');
          requireText(app, 'const segmentAngle = 360 / entries.length;', 'dynamic segment angle');
          requireText(app, "label.style.setProperty('--segment-angle'", 'segment angle handoff');
          requireText(app, '360 - (state.lastResult.index + 0.5) * segmentAngle', 'top-pointer landing calculation');
          requireText(app, "ui.category.textContent = 'SPINNING'", 'hidden result during spin');
          requireText(app, 'function validateData(candidate)', 'runtime data contract');
          requireText(css, 'var(--segment-angle) - 90deg', 'top-axis label alignment');
          if (html.includes('type="module"')) throw new Error('Spin the Strain must not depend on module MIME handling');
          if (app.includes("fetch('./data/wheels.json'")) throw new Error('Spin the Strain must not fetch wheel data at runtime');
          if (css.includes('var(--segment-index)')) throw new Error('stale segment-index renderer contract remains');
          NODE

      - name: Verify truthful release boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const game = JSON.parse(fs.readFileSync('games/spin-the-strain/game.json','utf8'));
          if (game.status !== 'browser-vertical-slice') throw new Error('unexpected game status');
          if (game.route !== '/games/spin-the-strain/') throw new Error('unexpected route');
          if (game.releaseGates.deploymentRegistered !== true) throw new Error('deploymentRegistered must stay true once the game is registered in the DTFSeeds public app contract');
          if (game.releaseGates.browserTested !== false) throw new Error('browserTested must remain false until browser QA is actually completed');
          NODE
