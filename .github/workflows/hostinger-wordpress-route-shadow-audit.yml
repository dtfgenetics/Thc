name: Audit Hostinger WordPress Route Shadows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/hostinger-wordpress-route-shadow-audit.yml
      - .github/workflows/deploy-dtfseeds-hostinger-ssh.yml
      - scripts/deploy/hostinger-overlay.sh
      - scripts/deploy/test-hostinger-overlay.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/hostinger-wordpress-route-shadow-audit.yml
      - .github/workflows/deploy-dtfseeds-hostinger-ssh.yml
      - scripts/deploy/hostinger-overlay.sh
      - scripts/deploy/test-hostinger-overlay.sh

permissions:
  contents: read

concurrency:
  group: hostinger-wordpress-route-shadow-audit
  cancel-in-progress: false

env:
  BASE_URL: https://dtfseeds.com

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate audit remains read-only and narrowly scoped
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/hostinger-wordpress-route-shadow-audit.yml'
          grep -Fq 'routes=(learn shop seeds community contact)' "$file"
          grep -Fq 'find "$route" -maxdepth 2 -type f' "$file"
          grep -Fq 'sha256sum' "$file"
          grep -Fq 'legacy_learn_marker=' "$file"
          grep -Fq 'learning_v3_marker=' "$file"
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('.github/workflows/hostinger-wordpress-route-shadow-audit.yml').read_text()
          production = text.split('\n  audit:\n', 1)[1]
          forbidden = re.compile(r'(^|[;&|]\s*)(rm\s+-|mv\s+|rsync\b|scp\b)|file_put_contents|unlink\(', re.M)
          match = forbidden.search(production)
          if match:
              raise SystemExit(f'Read-only audit contains a prohibited mutation command: {match.group(0)!r}')
          PY

  audit:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_HOST || secrets.HOSTINGER_SSH_HOST || secrets.SSH_HOST || secrets.SFTP_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_PORT || secrets.HOSTINGER_SSH_PORT || secrets.SSH_PORT || secrets.SFTP_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_USER || secrets.HOSTINGER_SSH_USER || secrets.SSH_USER || secrets.SFTP_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS || secrets.HOSTINGER_SSH_KNOWN_HOSTS || secrets.SSH_KNOWN_HOSTS }}
      SITE_ROOT: ${{ secrets.HOSTINGER_PUBLIC_ROOT || vars.HOSTINGER_WORDPRESS_PATH || vars.WORDPRESS_PATH || vars.WP_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate protected Hostinger connection settings
        shell: bash
        run: |
          set -euo pipefail
          SSH_HOST="${SSH_HOST:-147.93.42.1}"
          SSH_PORT="${SSH_PORT:-22}"
          : "${SSH_USER:?Missing Hostinger SSH user}"
          : "${SSH_PRIVATE_KEY:?Missing Hostinger SSH private key}"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          echo "SSH_HOST=$SSH_HOST" >> "$GITHUB_ENV"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"

      - name: Configure verified SSH connection
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ -n "${SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Resolve dtfseeds.com WordPress root without writes
        id: root
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SITE_ROOT:-}" ]]; then
            root="${SITE_ROOT%/}"
          else
            root="$(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          while IFS= read -r config; do
            directory="$(dirname "$config")"
            if command -v wp >/dev/null 2>&1; then
              home_url="$(wp --path="$directory" option get home --skip-plugins --skip-themes 2>/dev/null || true)"
              case "${home_url%/}" in
                https://dtfseeds.com|http://dtfseeds.com|https://www.dtfseeds.com|http://www.dtfseeds.com)
                  printf '%s\n' "$directory"
                  exit 0
                  ;;
              esac
            fi
          done < <(find "$HOME" -maxdepth 8 -type f -name wp-config.php -print 2>/dev/null)
          exit 1
          REMOTE
          )"
          fi
          [[ -n "$root" ]]
          [[ "$root" == /* ]]
          [[ "$root" != "/" ]]
          [[ "$root" != *'..'* ]]
          echo "path=$root" >> "$GITHUB_OUTPUT"

      - name: Read physical route state without mutations
        shell: bash
        env:
          SITE_ROOT: ${{ steps.root.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/route-shadow-audit"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "ROOT='$SITE_ROOT' bash -s" > "$RUNNER_TEMP/route-shadow-audit/filesystem.txt" <<'REMOTE'
          set -euo pipefail
          cd "$ROOT"
          routes=(learn shop seeds community contact)
          for route in "${routes[@]}"; do
            echo "=== $route ==="
            if [[ -e "$route" || -L "$route" ]]; then
              if [[ -d "$route" ]]; then kind=directory; elif [[ -f "$route" ]]; then kind=file; else kind=other; fi
              printf 'exists=yes kind=%s\n' "$kind"
              find "$route" -maxdepth 2 -type f -printf '%P\t%s bytes\n' | sort | head -100
              if [[ -f "$route/index.html" ]]; then
                printf 'index_sha256='; sha256sum "$route/index.html" | awk '{print $1}'
                printf 'index_size='; wc -c < "$route/index.html" | tr -d ' '; echo
                printf 'static_shell_marker='; if grep -Fq 'assets/dtf-home/dtf-home.css' "$route/index.html"; then echo yes; else echo no; fi
                printf 'age_gate_marker='; if grep -Fq 'Adult visitors only' "$route/index.html"; then echo yes; else echo no; fi
                printf 'wordpress_marker='; if grep -Fq '/wp-content/' "$route/index.html"; then echo yes; else echo no; fi
                printf 'legacy_learn_marker='; if grep -Eiq 'Grow education belongs in a clean, readable library|MOPS, cultivation notes, THC basics' "$route/index.html"; then echo yes; else echo no; fi
                printf 'learning_v3_marker='; if grep -Fq 'data-dtf-layout="learn-v3"' "$route/index.html"; then echo yes; else echo no; fi
                printf 'title='; grep -Eio '<title>[^<]+</title>' "$route/index.html" 2>/dev/null | head -1 || true
              fi
            else
              echo 'exists=no'
            fi
          done
          echo '=== root-htaccess-route-lines ==='
          if [[ -f .htaccess ]]; then
            grep -Ein '(^|[^a-z])(learn|shop|seeds|community|contact)([^a-z]|$)|DirectoryIndex|RewriteRule' .htaccess | head -200 || true
          else
            echo 'root .htaccess missing'
          fi
          REMOTE
          cat "$RUNNER_TEMP/route-shadow-audit/filesystem.txt"

      - name: Capture public route fingerprints
        shell: bash
        run: |
          set -euo pipefail
          for route in learn shop seeds community contact; do
            body="$RUNNER_TEMP/route-shadow-audit/${route}.html"
            headers="$RUNNER_TEMP/route-shadow-audit/${route}.headers"
            status="$(curl -4 --silent --show-error --max-redirs 0 \
              --connect-timeout 15 --max-time 60 \
              --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$BASE_URL/$route/?dtf_route_shadow_audit=${GITHUB_RUN_ID}")"
            legacy=no
            learning_v3=no
            if grep -Eiq 'Grow education belongs in a clean, readable library|MOPS, cultivation notes, THC basics' "$body"; then legacy=yes; fi
            if grep -Fq 'data-dtf-layout="learn-v3"' "$body"; then learning_v3=yes; fi
            printf '%s\tHTTP %s\tbytes=%s\tstatic_shell=%s\tlegacy_learn=%s\tlearning_v3=%s\n' \
              "$route" "$status" "$(wc -c < "$body" | tr -d ' ')" \
              "$(grep -Fq 'assets/dtf-home/dtf-home.css' "$body" && echo yes || echo no)" \
              "$legacy" "$learning_v3" \
              | tee -a "$RUNNER_TEMP/route-shadow-audit/public-summary.txt"
          done
          cat "$RUNNER_TEMP/route-shadow-audit/public-summary.txt"

      - name: Upload route ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-wordpress-route-shadow-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/route-shadow-audit
          if-no-files-found: warn
          retention-days: 30
