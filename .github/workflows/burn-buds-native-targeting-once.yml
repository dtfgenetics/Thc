name: Burn Buds Native Targeting One Shot

on:
  push:
    branches:
      - game/burn-buds-remove-legacy-confirmshots
    paths:
      - '.github/workflows/burn-buds-native-targeting-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game/burn-buds-remove-legacy-confirmshots
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove legacy targeting interceptor
        run: node scripts/patch-burn-buds-native-targeting.mjs
      - name: Verify native targeting runtime
        run: |
          node --check site/public-route-patch/games/protect-the-plants/enhancements.js
          node --check site/public-route-patch/games/protect-the-plants/targeting-v1.js
          node --check site/public-route-patch/games/protect-the-plants/sw.js
          test ! -e site/public-route-patch/games/protect-the-plants/targeting-policy-v1.js
          ! grep -Fq 'confirmShots' site/public-route-patch/games/protect-the-plants/enhancements.js
          grep -Fq 'Tap once to aim. Tap the same cell again to fire.' site/public-route-patch/games/protect-the-plants/targeting-v1.js
      - name: Commit native targeting cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/public-route-patch/games/protect-the-plants/enhancements.js site/public-route-patch/games/protect-the-plants/index.html site/public-route-patch/games/protect-the-plants/sw.js site/public-route-patch/games/protect-the-plants/targeting-policy-v1.js
          git commit -m 'Remove legacy Burn Buds shot confirmation path'
          git push origin HEAD:game/burn-buds-remove-legacy-confirmshots
