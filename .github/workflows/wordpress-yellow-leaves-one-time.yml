name: One-time Yellow Leaves WordPress Publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wordpress-yellow-leaves-one-time.yml

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      ARTICLE_DIR: ${{ github.workspace }}/site/wordpress/articles
      ARTICLE_FILE: ${{ github.workspace }}/site/wordpress/articles/yellow-leaves.json
      BACKUP_ROOT: ${{ runner.temp }}/wordpress-thc-article-backups
    steps:
      - uses: actions/checkout@v4

      - name: Validate credentials are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WP_API_USERNAME"
          test -n "$WP_API_PASSWORD"

      - name: Publish yellow-leaves
        id: publish
        run: node scripts/publish-wordpress-articles-rest.mjs

      - name: Upload rollback metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yellow-leaves-wordpress-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/wordpress-thc-article-backups
          if-no-files-found: warn
          retention-days: 30

      - name: Report result to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const body = [
              '## One-time Yellow Leaves WordPress publication',
              '',
              `Status: **${process.env.JOB_STATUS}**`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Target slug: `yellow-leaves`',
              'No credential values are included in this report.'
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 46, body });
