name: Publish Approved Sitewide Header V5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/lib/sitewide-header-template.mjs
      - scripts/apply-sitewide-header.mjs
      - scripts/rebuild-wordpress-shared-shell-v3.mjs
      - scripts/publish-wordpress-approved-design-reference.mjs
      - site/wordpress/assets/design-references/dtf-course-header-approved-reference-v1.jpg
      - site/wordpress/assets/design-references/approved-sitewide-header-reference.json
      - docs/design/APPROVED_SITEWIDE_HEADER_REFERENCE.md
      - .github/workflows/sitewide-header-v4-production.yml
  pull_request:
    paths:
      - scripts/lib/sitewide-header-template.mjs
      - scripts/apply-sitewide-header.mjs
      - scripts/rebuild-wordpress-shared-shell-v3.mjs
      - scripts/publish-wordpress-approved-design-reference.mjs
      - site/wordpress/assets/design-references/dtf-course-header-approved-reference-v1.jpg
      - site/wordpress/assets/design-references/approved-sitewide-header-reference.json
      - docs/design/APPROVED_SITEWIDE_HEADER_REFERENCE.md
      - .github/workflows/sitewide-header-v4-production.yml
  workflow_run:
    workflows:
      - Rebuild DTFSeeds Visual Site On Command
      - Polish DTFSeeds Visual System V3
      - Finalize DTFSeeds Learn V3
      - Apply DTFSeeds Visual V3 After Canonical Production
      - Publish Learning Hub Course 1
      - Build DTFSeeds Public Suite
    types: [completed]

permissions:
  contents: read

env:
  WP_SITE_URL: https://dtfseeds.com

concurrency:
  group: dtfseeds-approved-sitewide-header-v5
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate approved header release package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lib/sitewide-header-template.mjs
          node --check scripts/apply-sitewide-header.mjs
          node --check scripts/rebuild-wordpress-shared-shell-v3.mjs
          node --check scripts/publish-wordpress-approved-design-reference.mjs
          test -s site/wordpress/assets/design-references/dtf-course-header-approved-reference-v1.jpg
          test -s site/wordpress/assets/design-references/approved-sitewide-header-reference.json
          grep -Fq 'data-dtf-shell="header-v5"' scripts/lib/sitewide-header-template.mjs
          grep -Fq '>Diagnostic</a>' scripts/lib/sitewide-header-template.mjs
          grep -Fq '<a href="/courses/">Courses</a>' scripts/lib/sitewide-header-template.mjs
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('site/wordpress/assets/design-references/approved-sitewide-header-reference.json','utf8'));if(x.status!=='approved'||!x.googleDrive?.fileId||!x.repository?.path||!x.wordpress?.mediaSlug)process.exit(1);console.log(x.id)"
      - name: Prove the static header reconciler is idempotent
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/header-fixture"
          cp -a site/public-route-patch "$RUNNER_TEMP/header-fixture"
          node scripts/apply-sitewide-header.mjs "$RUNNER_TEMP/header-fixture"
          node scripts/apply-sitewide-header.mjs "$RUNNER_TEMP/header-fixture" --check
          count="$(grep -RFl 'data-dtf-shell="header-v5"' "$RUNNER_TEMP/header-fixture" --include='*.html' | wc -l | tr -d ' ')"
          test "$count" -gt 10

  publish:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_SHARED_SHELL_V3: 'true'
      APPLY_APPROVED_DESIGN_REFERENCE: 'true'
      BACKUP_ROOT: /tmp/dtf-approved-header-v5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require WordPress credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured}"
      - name: Publish approved sitewide shared header
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/rebuild-wordpress-shared-shell-v3.mjs | tee /tmp/dtf-approved-header-v5.json
      - name: Verify approved header on representative public routes
        shell: bash
        run: |
          set -euo pipefail
          for route in / /learn/ /courses/ /shop/; do
            out="$RUNNER_TEMP/header-v5-$(echo "$route" | tr '/' '_' | tr -cd '[:alnum:]_').html"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                "${WP_SITE_URL}${route}?dtf_header_v5=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" --output "$out"
              if grep -Fq 'data-dtf-shell="header-v5"' "$out" && \
                 grep -Fq 'href="/courses/"' "$out" && \
                 grep -Fq '>Diagnostic</a>' "$out" && \
                 grep -Fq 'dtf-sitewide-header-v5-script' "$out"; then
                ok=1
                break
              fi
              sleep 4
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Approved header V5 was not visitor-facing on ${route}" >&2
              grep -Eo 'data-dtf-shell="header-v[0-9]+"|href="/[^"]+"' "$out" | head -n 40 >&2 || true
              exit 1
            fi
          done
      - name: Store approved design reference in WordPress Media Library
        id: reference_upload
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-wordpress-approved-design-reference.mjs | tee /tmp/dtf-approved-design-reference.json
      - name: Verify WordPress design-reference media
        if: ${{ steps.reference_upload.outcome == 'success' }}
        shell: bash
        env:
          APPLY_APPROVED_DESIGN_REFERENCE: 'false'
        run: |
          set -euo pipefail
          node scripts/publish-wordpress-approved-design-reference.mjs | tee /tmp/dtf-approved-design-reference-readback.json
      - name: Note optional reference-media issue
        if: ${{ steps.reference_upload.outcome == 'failure' }}
        shell: bash
        run: |
          echo "The production header is independent of the optional WordPress design-reference copy. The canonical reference remains versioned in GitHub and Google Drive; media-library repair can proceed separately."
      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-sitewide-header-v5-${{ github.run_id }}
          path: |
            /tmp/dtf-approved-design-reference.json
            /tmp/dtf-approved-design-reference-readback.json
            /tmp/dtf-approved-header-v5.json
          if-no-files-found: ignore
          retention-days: 30
