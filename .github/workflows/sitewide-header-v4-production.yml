name: Publish Canonical Sitewide Header V6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/lib/sitewide-header-template.mjs
      - scripts/lib/sitewide-header-template-v6.mjs
      - scripts/apply-sitewide-header.mjs
      - scripts/rebuild-wordpress-shared-shell-v3.mjs
      - scripts/verify-sitewide-header-v6-live.mjs
      - scripts/verify-responsive-layout-live.mjs
      - site/wordpress/assets/responsive-layout-v1.css
      - site/wordpress/assets/sitewide-ux-polish-v1.css
      - .github/workflows/sitewide-header-v4-production.yml
  pull_request:
    paths:
      - scripts/lib/sitewide-header-template.mjs
      - scripts/lib/sitewide-header-template-v6.mjs
      - scripts/apply-sitewide-header.mjs
      - scripts/rebuild-wordpress-shared-shell-v3.mjs
      - scripts/verify-sitewide-header-v6-live.mjs
      - scripts/verify-responsive-layout-live.mjs
      - site/wordpress/assets/responsive-layout-v1.css
      - site/wordpress/assets/sitewide-ux-polish-v1.css
      - .github/workflows/sitewide-header-v4-production.yml

permissions:
  contents: read

env:
  WP_SITE_URL: https://dtfseeds.com

concurrency:
  group: dtfseeds-canonical-sitewide-header-v6
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical V6 header package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lib/sitewide-header-template.mjs
          node --check scripts/lib/sitewide-header-template-v6.mjs
          node --check scripts/apply-sitewide-header.mjs
          node --check scripts/rebuild-wordpress-shared-shell-v3.mjs
          node --check scripts/verify-sitewide-header-v6-live.mjs
          node --check scripts/verify-responsive-layout-live.mjs
          test -s site/wordpress/assets/responsive-layout-v1.css
          test -s site/wordpress/assets/sitewide-ux-polish-v1.css
          grep -Fq 'data-dtf-shell="header-v6"' scripts/lib/sitewide-header-template-v6.mjs
          grep -Fq 'data-dtf-sitewide-header="canonical-six-v1"' scripts/lib/sitewide-header-template-v6.mjs
          for required in '>Genetics</a>' '>Learn</a>' '>Tools</a>' '>Games</a>' '>Community</a>' '>Shop</a>'; do
            grep -Fq "$required" scripts/lib/sitewide-header-template-v6.mjs || { echo "Missing canonical nav label: $required" >&2; exit 1; }
          done
          ! grep -Fq '>Home</a>' scripts/lib/sitewide-header-template-v6.mjs
          ! grep -Fq '>Seeds</a>' scripts/lib/sitewide-header-template-v6.mjs
          ! grep -Fq '>Courses</a>' scripts/lib/sitewide-header-template-v6.mjs
          ! grep -Fq '>Diagnostic</a>' scripts/lib/sitewide-header-template-v6.mjs
          grep -Fq "./lib/sitewide-header-template-v6.mjs" scripts/apply-sitewide-header.mjs
          grep -Fq "./lib/sitewide-header-template-v6.mjs" scripts/rebuild-wordpress-shared-shell-v3.mjs

      - name: Prove static V6 header reconciler is idempotent
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/header-fixture"
          cp -a site/public-route-patch "$RUNNER_TEMP/header-fixture"
          node scripts/apply-sitewide-header.mjs "$RUNNER_TEMP/header-fixture"
          node scripts/apply-sitewide-header.mjs "$RUNNER_TEMP/header-fixture" --check
          count="$(grep -RFl 'data-dtf-shell="header-v6"' "$RUNNER_TEMP/header-fixture" --include='*.html' | wc -l | tr -d ' ')"
          test "$count" -gt 10

  publish:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_SHARED_SHELL_V3: 'true'
      BACKUP_ROOT: /tmp/dtf-canonical-header-v6
      HEADER_AUDIT_CONCURRENCY: '5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require WordPress credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured}"

      - name: Publish canonical WordPress shared shell V6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/rebuild-wordpress-shared-shell-v3.mjs | tee /tmp/dtf-canonical-header-v6.json

      - name: Verify V6 on representative public routes
        shell: bash
        run: |
          set -euo pipefail
          for route in / /seeds/ /learn/ /tools/ /games/ /community/ /shop/; do
            out="$RUNNER_TEMP/header-v6-$(echo "$route" | tr '/' '_' | tr -cd '[:alnum:]_').html"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                "${WP_SITE_URL}${route}?dtf_header_v6=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" --output "$out"
              if node - "$out" <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync(process.argv[2],'utf8');
          const header=html.match(/<header\b[^>]*data-dtf-shell=["']header-v6["'][^>]*>[\s\S]*?<\/header>/i)?.[0]||'';
          if(!header) process.exit(1);
          const nav=header.match(/<nav\b[^>]*id=["']dtf-global-primary-nav["'][^>]*>([\s\S]*?)<\/nav>/i)?.[1]||'';
          const labels=[...nav.matchAll(/<a\b[^>]*>([\s\S]*?)<\/a>/gi)].map(m=>m[1].replace(/<[^>]+>/g,'').trim());
          const expected=['Genetics','Learn','Tools','Games','Community','Shop'];
          if(JSON.stringify(labels)!==JSON.stringify(expected)) throw new Error(`Unexpected V6 navigation: ${JSON.stringify(labels)}`);
          if(!/dtf-sitewide-header-v6-script/.test(html)) throw new Error('V6 script missing');
          NODE
              then ok=1; break; fi
              sleep 4
            done
            [[ "$ok" -eq 1 ]] || { echo "Canonical header V6 was not visitor-facing on ${route}" >&2; exit 1; }
          done

      - name: Audit canonical V6 header across public routes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-sitewide-header-v6-live.mjs | tee /tmp/dtf-header-v6-live-audit.json

      - name: Verify shared responsive layout
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/verify-responsive-layout-live.mjs | tee /tmp/dtf-responsive-layout-v1-live.json

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-sitewide-header-v6-${{ github.run_id }}
          path: |
            /tmp/dtf-canonical-header-v6.json
            /tmp/dtf-header-v6-live-audit.json
            /tmp/dtf-responsive-layout-v1-live.json
          if-no-files-found: ignore
          retention-days: 30
