name: DTFSeeds Sitewide Visual Integrity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  pull_request:
    paths:
      - scripts/audit-sitewide-visual-integrity.mjs
      - scripts/audit-sitewide-link-integrity.mjs
      - .github/workflows/sitewide-visual-integrity.yml
      - scripts/lib/sitewide-header-template-v6.mjs
      - scripts/lib/sitewide-content-density-v1.mjs
      - scripts/apply-sitewide-header.mjs
      - site/wordpress/assets/responsive-layout-v1.css
      - site/wordpress/assets/sitewide-ux-polish-v1.css
  workflow_run:
    workflows:
      - Deploy DTFSeeds Public Suite via WordPress V2
      - Polish DTFSeeds Visual System V3
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dtfseeds-sitewide-visual-integrity
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deterministic V6 integrity crawlers
        run: |
          set -euo pipefail
          node --check scripts/audit-sitewide-visual-integrity.mjs
          node --check scripts/audit-sitewide-link-integrity.mjs
          grep -Fq 'header-v6' scripts/audit-sitewide-visual-integrity.mjs
          grep -Fq 'canonical-eight-v1' scripts/audit-sitewide-visual-integrity.mjs
          grep -Fq 'dtf-content-density-v1' scripts/audit-sitewide-visual-integrity.mjs
          grep -Fq 'dtf-sitewide-ux-polish-v1' scripts/audit-sitewide-visual-integrity.mjs
          grep -Fq 'DTFSeeds-Visual-Integrity/2.1' scripts/audit-sitewide-visual-integrity.mjs
          grep -Fq 'DTFSeeds-Link-Integrity/1.0' scripts/audit-sitewide-link-integrity.mjs
          grep -Fq "['Home','/']" scripts/audit-sitewide-visual-integrity.mjs
          grep -Fq "['Seeds','/seeds/']" scripts/audit-sitewide-visual-integrity.mjs
          grep -Fq "['Courses','/courses/']" scripts/audit-sitewide-visual-integrity.mjs
          grep -Fq "['Diagnostic','/tools/']" scripts/audit-sitewide-visual-integrity.mjs
          ! grep -Fq "['Genetics','/seeds/']" scripts/audit-sitewide-visual-integrity.mjs
          ! grep -Fq "['Tools','/tools/']" scripts/audit-sitewide-visual-integrity.mjs

  audit:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crawl public routes, V6 navigation, shared visual shell, density controls, and images
        id: visual
        env:
          DTF_SITE_URL: https://dtfseeds.com
          DTF_VISUAL_AUDIT_MAX_PAGES: '350'
          DTF_VISUAL_AUDIT_MAX_DEPTH: '5'
          DTF_VISUAL_AUDIT_CONCURRENCY: '6'
          DTF_VISUAL_AUDIT_MAX_IMAGES: '250'
        run: |
          set -o pipefail
          node scripts/audit-sitewide-visual-integrity.mjs | tee sitewide-visual-integrity.log
      - name: Crawl same-origin HTML links
        id: links
        if: always()
        env:
          DTF_SITE_URL: https://dtfseeds.com
          DTF_LINK_AUDIT_MAX_PAGES: '300'
          DTF_LINK_AUDIT_MAX_DEPTH: '5'
          DTF_LINK_AUDIT_CONCURRENCY: '6'
        run: |
          set -o pipefail
          node scripts/audit-sitewide-link-integrity.mjs | tee sitewide-link-integrity.log
      - name: Publish audit summaries
        if: always()
        run: |
          if [ -s sitewide-visual-integrity.md ]; then cat sitewide-visual-integrity.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -s sitewide-link-integrity.md ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            cat sitewide-link-integrity.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sitewide integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitewide-integrity-${{ github.run_id }}
          path: |
            sitewide-visual-integrity.json
            sitewide-visual-integrity.md
            sitewide-visual-integrity.log
            sitewide-link-integrity.json
            sitewide-link-integrity.md
            sitewide-link-integrity.log
          if-no-files-found: warn
          retention-days: 30
