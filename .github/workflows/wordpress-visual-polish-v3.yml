name: Polish DTFSeeds Visual System V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/polish-wordpress-visual-site-v3.mjs'
      - 'scripts/lib/sitewide-header-template-v6.mjs'
      - 'scripts/rebuild-wordpress-shared-shell-v3.mjs'
      - 'scripts/flush-hostinger-litespeed-mcp.mjs'
      - 'site/wordpress/assets/sitewide-ux-polish-v1.css'
      - '.github/workflows/wordpress-visual-polish-v3.yml'
  workflow_run:
    workflows:
      - 'Rebuild DTFSeeds WordPress Visual Site'
      - 'Rebuild DTFSeeds Visual Site On Command'
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dtfseeds-wordpress-visual-polish-v3
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com

jobs:
  polish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-visual-polish-v3
      APPLY_SHARED_SHELL_V3: 'true'

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate visual polish package
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          test -s site/wordpress/assets/sitewide-ux-polish-v1.css
          grep -Fq 'DTFSeeds sitewide UX polish v1' site/wordpress/assets/sitewide-ux-polish-v1.css
          node --check scripts/polish-wordpress-visual-site-v3.mjs
          node --check scripts/lib/sitewide-header-template-v6.mjs
          node --check scripts/rebuild-wordpress-shared-shell-v3.mjs
          node --check scripts/flush-hostinger-litespeed-mcp.mjs
          grep -Fq 'data-dtf-shell="header-v6"' scripts/lib/sitewide-header-template-v6.mjs
          grep -Fq 'data-dtf-sitewide-header="canonical-eight-v1"' scripts/lib/sitewide-header-template-v6.mjs

      - name: Confirm WordPress REST path
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -4 --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 45 --retry 2 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$WP_SITE_URL/wp-json/" -o "$RUNNER_TEMP/wp-index.json"; then
              exit 0
            fi
            [[ "$attempt" -lt 5 ]] || exit 1
            sleep $((attempt * 7))
          done

      - name: Apply V3 visual polish
        id: polish
        env:
          APPLY_VISUAL_POLISH: 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/polish-wordpress-visual-site-v3.mjs | tee "$RUNNER_TEMP/visual-polish-v3.log"
          dir="$(cat "$BACKUP_ROOT/visual-polish-v3-backup-path.txt")"
          report="$dir/visual-polish-v3-report.json"
          echo "spotlight=$(node -p "require(process.argv[1]).spotlightInjected" "$report")" >> "$GITHUB_OUTPUT"
          echo "brand_id=$(node -p "require(process.argv[1]).shell.brandMediaId || ''" "$report")" >> "$GITHUB_OUTPUT"

      - name: Restore canonical V6 shared header, sitemap shell, and UX polish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/rebuild-wordpress-shared-shell-v3.mjs | tee "$RUNNER_TEMP/shared-shell-v6.log"

      - name: Purge WordPress and LiteSpeed shell cache
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node scripts/flush-hostinger-litespeed-mcp.mjs; then
              echo "LiteSpeed cache purge completed on attempt $attempt."
              exit 0
            fi
            [[ "$attempt" -lt 3 ]] || { echo 'LiteSpeed cache purge failed after 3 attempts.' >&2; exit 1; }
            sleep $((attempt * 5))
          done

      - name: Verify visitor-facing V3 experience, V6 navigation, and UX polish
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          check_page() {
            local path="$1"
            local marker="$2"
            local body="$RUNNER_TEMP/$(printf '%s' "$path" | tr '/?' '__').html"
            local header="$body.header.html"
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --connect-timeout 15 --max-time 50 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "$WP_SITE_URL${path}?dtf_v3=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$body"
              if grep -Fqi -- "$marker" "$body" && \
                 grep -Fqi 'dtf-visual-polish-v3' "$body" && \
                 grep -Fqi 'data-dtf-shell="header-v6"' "$body" && \
                 grep -Fqi 'data-dtf-sitewide-header="canonical-eight-v1"' "$body" && \
                 grep -Fqi 'id="dtf-sitewide-ux-polish-v1"' "$body"; then
                ok=1
                break
              fi
              if [[ "$attempt" -lt 8 ]]; then sleep 7; fi
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "V3/V6/UX marker not observed on $path" >&2
              for required_marker in "$marker" 'dtf-visual-polish-v3' 'data-dtf-shell="header-v6"' 'data-dtf-sitewide-header="canonical-eight-v1"' 'id="dtf-sitewide-ux-polish-v1"'; do
                grep -Fqi -- "$required_marker" "$body" || echo "Missing marker on $path: $required_marker" >&2
              done
              head -c 3500 "$body" >&2 || true
              exit 1
            fi

            node - "$body" "$header" <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync(process.argv[2], 'utf8');
          const match = source.match(/<header\b[^>]*data-dtf-shell=["']header-v6["'][^>]*>[\s\S]*?<\/header>/i);
          if (!match) {
            console.error('Canonical V6 header fragment could not be isolated');
            process.exit(1);
          }
          fs.writeFileSync(process.argv[3], match[0]);
          NODE

            expected='Genetics|Learn|Tools|Games|Community|Shop'
            actual="$(node - "$header" <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync(process.argv[2], 'utf8');
          const nav = source.match(/<nav\b[^>]*id=["']dtf-global-primary-nav["'][^>]*>([\s\S]*?)<\/nav>/i)?.[1] || '';
          const labels = [...nav.matchAll(/<a\b[^>]*>([\s\S]*?)<\/a>/gi)].map(m => m[1].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim());
          process.stdout.write(labels.join('|'));
          NODE
            )"
            [[ "$actual" == "$expected" ]] || { echo "Unexpected V6 primary navigation on $path: $actual" >&2; exit 1; }
            for forbidden_label in '>Home</a>' '>Seeds</a>' '>Courses</a>' '>Diagnostic</a>'; do
              ! grep -Fqi -- "$forbidden_label" "$header" || { echo "Obsolete primary label remains on $path: $forbidden_label" >&2; exit 1; }
            done
            for forbidden in 'email@email.com' '+123456789' '© 2025 DTF Genetics' '&copy; 2025 DTF Genetics'; do
              ! grep -Fqi -- "$forbidden" "$body" || { echo "Forbidden stale presentation remains on $path: $forbidden" >&2; exit 1; }
            done
          }

          check_page '/' 'dtf-v3-spotlight'
          check_page '/learn/' 'Start with the question you are trying to answer.'

          home="$RUNNER_TEMP/_.html"
          grep -Fqi 'data-dtf-shell="header-v6"' "$home"
          grep -Fqi 'id="dtf-sitewide-ux-polish-v1"' "$home"
          grep -Fqi 'dtf-footer-v3' "$home"
          grep -Fqi 'discord.gg/xJbUeHFPMt' "$home"
          echo 'V3 visual experience, canonical V6 navigation, and UX polish verification passed.'

      - name: Upload rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtfseeds-visual-polish-v3-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/dtf-visual-polish-v3
          if-no-files-found: warn
          retention-days: 30

      - name: Publish V3 production summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          POLISH_OUTCOME: ${{ steps.polish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SPOTLIGHT: ${{ steps.polish.outputs.spotlight }}
          BRAND_ID: ${{ steps.polish.outputs.brand_id }}
        run: |
          {
            echo '## DTFSeeds visual polish V3'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Result: **${JOB_STATUS}**"
            echo "V3 polish write: **${POLISH_OUTCOME:-not-run}**"
            echo "Live V6 verification: **${VERIFY_OUTCOME:-not-run}**"
            echo "Homepage experience spotlight: **${SPOTLIGHT:-not-run}**"
            echo "Cannabis-leaf brand media ID: **${BRAND_ID:-not-reported}**"
            echo
            echo 'V3 visual polish restores the canonical V6 sitewide navigation and shared UX polish after page styling, purges the visitor cache, and validates the refreshed public shell.'
          } >> "$GITHUB_STEP_SUMMARY"
