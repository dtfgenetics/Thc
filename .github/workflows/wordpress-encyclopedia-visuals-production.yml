name: Publish THC Encyclopedia Visuals to WordPress Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/attach-wordpress-encyclopedia-visuals.mjs
      - site/wordpress/education/encyclopedia/volume03-visual-map.json
      - .github/workflows/wordpress-encyclopedia-visuals-production.yml

permissions:
  contents: read

# RETIRED PRODUCTION WRITER
# Volume 03 mapped the retired THC-ENC educational image family directly into
# public encyclopedia lessons. Those assets are quarantined sitewide. Keep this
# workflow as a read-only compatibility guard until replacement lesson visuals
# receive explicit role-specific approval.
concurrency:
  group: wordpress-encyclopedia-visuals-retired
  cancel-in-progress: true

jobs:
  retired-writer-guard:
    name: Legacy encyclopedia visual writer disabled
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Enforce quarantine and replacement policy
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const policy=require('./site/wordpress/visual-quality-policy.json');
          if(Number(policy.schemaVersion)<3 || policy.mode!=='quarantine') throw new Error('Visual quality quarantine policy v3+ is required.');
          if(policy.replacementPolicy?.legacyInfographicReuseAllowed!==false) throw new Error('Legacy infographic reuse must remain disabled.');
          if(policy.replacementPolicy?.requiresRoleSpecificApproval!==true) throw new Error('Role-specific visual approval must remain required.');
          const map=JSON.parse(fs.readFileSync('site/wordpress/education/encyclopedia/volume03-visual-map.json','utf8'));
          if(!Array.isArray(map.items) || !map.items.length) throw new Error('Historical encyclopedia visual map is missing.');
          if(!map.items.some(x=>/^THC-ENC-/i.test(String(x.id||'')))) throw new Error('Expected historical THC-ENC mappings were not found.');
          console.log('Historical THC-ENC mappings are preserved for audit only and are not published.');
          NODE
          ! grep -Fq 'node scripts/attach-wordpress-encyclopedia-visuals.mjs' .github/workflows/wordpress-encyclopedia-visuals-production.yml

      - name: Explain replacement path
        shell: bash
        run: |
          echo 'No encyclopedia lesson or WordPress media record is changed by this workflow.'
          echo 'Replacement lesson visuals must use approved production identities and pass subject + responsive review before publication.'
