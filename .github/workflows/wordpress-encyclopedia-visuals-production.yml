name: Publish THC Encyclopedia Visuals to WordPress Production

on:
  push:
    branches:
      - main
    paths:
      - scripts/attach-wordpress-encyclopedia-visuals.mjs
      - scripts/publish-wordpress-encyclopedia-canonical-batch.mjs
      - scripts/build-encyclopedia-full-publication-manifest.mjs
      - scripts/verify-wordpress-encyclopedia-full-live.mjs
      - scripts/build-encyclopedia-teaching-visuals.mjs
      - scripts/build-encyclopedia-visual-production-queue.mjs
      - package.json
      - site/wordpress/education/encyclopedia/volume03-visual-map.json
      - .github/workflows/wordpress-encyclopedia-visuals-production.yml
  workflow_dispatch:

concurrency:
  group: dtfseeds-encyclopedia-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  publish:
    name: Publish and verify full encyclopedia lesson visuals
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: production
      url: https://dtfseeds.com/learn/encyclopedia/
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      ENCYCLOPEDIA_VISUAL_MAP: site/wordpress/education/encyclopedia/all-visual-map-v1.json
      ENCYCLOPEDIA_FULL_BATCH_FILE: site/wordpress/education/encyclopedia/full-420-production-batch.generated.json
      BACKUP_ROOT: /tmp/dtf-encyclopedia-visuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and SVG rasterizer
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SVG rasterizer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Build full canonical publication manifest
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-encyclopedia-full-publication-manifest.mjs
          node --check scripts/publish-wordpress-encyclopedia-canonical-batch.mjs
          node --check scripts/verify-wordpress-encyclopedia-full-live.mjs
          node scripts/build-encyclopedia-full-publication-manifest.mjs
          node scripts/validate-encyclopedia-release-control.mjs "$ENCYCLOPEDIA_FULL_BATCH_FILE"

      - name: Synchronize all 420 canonical encyclopedia pages
        id: canonical_sync
        shell: bash
        env:
          ENCYCLOPEDIA_BATCH_FILE: ${{ env.ENCYCLOPEDIA_FULL_BATCH_FILE }}
          BACKUP_ROOT: /tmp/dtf-encyclopedia-full-sync
        run: |
          set -euo pipefail
          node scripts/publish-wordpress-encyclopedia-canonical-batch.mjs | tee "$RUNNER_TEMP/encyclopedia-full-sync.json"
          report="$(find "$BACKUP_ROOT" -name encyclopedia-publication-report.json -type f | sort | tail -n 1)"
          test -s "$report"
          test "$(node -p "require(process.argv[1]).published.length" "$report")" -eq 420
          test "$(node -p "require(process.argv[1]).index.listedLessons" "$report")" -eq 420
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Verify all 420 canonical lesson routes before visual writes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-wordpress-encyclopedia-full-live.mjs

      - name: Generate full controlled visual set
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-encyclopedia-teaching-visuals.mjs --render-png
          npm run build:encyclopedia-visual-queue
          node scripts/validate-encyclopedia-visual-production-queue.mjs

      - name: Validate credentials, publisher, map, and canonical assets
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/attach-wordpress-encyclopedia-visuals.mjs
          node - <<'NODE'
          const fs=require('fs');
          const map=JSON.parse(fs.readFileSync(process.env.ENCYCLOPEDIA_VISUAL_MAP,'utf8'));
          if(map.schemaVersion!==1 || map.batch!=='encyclopedia-all-visuals-v1' || !Array.isArray(map.items) || map.items.length!==420) throw new Error('Unexpected full encyclopedia visual map.');
          const expected=Array.from({length:420},(_,i)=>`THC-ENC-${String(i+1).padStart(3,'0')}`);
          const ids=map.items.map(x=>x.id);
          if(new Set(ids).size!==420 || expected.some(id=>!ids.includes(id))) throw new Error('Expected exactly THC-ENC-001 through THC-ENC-420.');
          for(const item of map.items){
            const p=`site/wordpress/assets/infographics/${item.assetPath}`;
            if(!fs.existsSync(p)) throw new Error(`Missing canonical infographic asset: ${p}`);
          }
          console.log('Validated 420 lesson-to-visual mappings and canonical/generated assets.');
          NODE

      - name: Attach existing WordPress media to encyclopedia lessons
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          node scripts/attach-wordpress-encyclopedia-visuals.mjs
          report="$(find "$BACKUP_ROOT" -name encyclopedia-visual-publication-report.json -type f | sort | tail -n 1)"
          test -s "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "count=$(node -p "require(process.argv[1]).lessonVisualsAttached" "$report")" >> "$GITHUB_OUTPUT"
          echo "reused=$(node -p "require(process.argv[1]).existingWordPressMediaReused" "$report")" >> "$GITHUB_OUTPUT"
          echo "uploads=$(node -p "require(process.argv[1]).newMediaUploads" "$report")" >> "$GITHUB_OUTPUT"

      - name: Verify all 420 visitor-facing lesson visuals
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          report="${{ steps.publish.outputs.report }}"
          test -s "$report"
          node - "$report" > "$RUNNER_TEMP/visuals.tsv" <<'NODE'
          const r=require(process.argv[2]);
          for(const x of r.updated) console.log([x.id,x.mediaSlug,x.mediaSourceUrl].join('\t'));
          NODE
          test "$(wc -l < "$RUNNER_TEMP/visuals.tsv")" -eq 420

          while IFS=$'\t' read -r id media_slug media_url; do
            slug="$(printf '%s' "$id" | tr '[:upper:]' '[:lower:]')"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              body="$RUNNER_TEMP/${slug}-${attempt}.html"
              if curl -4 -fsSL \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "$WP_SITE_URL/learn/encyclopedia/$slug/?dtf_enc_visual=${GITHUB_RUN_ID}-${attempt}" -o "$body"; then
                if node - "$body" "$id" "$media_slug" "$media_url" <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync(process.argv[2],'utf8');
          const id=process.argv[3];
          const mediaSlug=process.argv[4];
          const mediaUrl=process.argv[5];
          const marker=`data-thc-lesson-visual-id="${id}"`;
          const count=html.split(marker).length-1;
          if(count!==1) throw new Error(`${id}: expected one rendered visual marker, found ${count}`);
          if(!html.includes('/wp-content/uploads/')) throw new Error(`${id}: rendered page has no WordPress upload image.`);
          if(!html.includes(mediaUrl) && !html.toLowerCase().includes(mediaSlug.toLowerCase())) throw new Error(`${id}: expected mapped media is not rendered.`);
          console.log(`${id}: visitor visual verified`);
          NODE
                then ok=1; break; fi
              fi
              sleep 8
            done
            [[ "$ok" -eq 1 ]] || { echo "$id visitor visual verification failed" >&2; exit 1; }
          done < "$RUNNER_TEMP/visuals.tsv"

      - name: Upload rollback and publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-encyclopedia-visuals-${{ github.run_id }}
          path: ${{ env.BACKUP_ROOT }}
          if-no-files-found: warn
          retention-days: 30

      - name: Record encyclopedia visual publication
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CANONICAL_SYNC: ${{ steps.canonical_sync.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          COUNT: ${{ steps.publish.outputs.count }}
          REUSED: ${{ steps.publish.outputs.reused }}
          UPLOADS: ${{ steps.publish.outputs.uploads }}
        run: |
          {
            echo '## THC encyclopedia full canonical + visual production'
            echo
            echo "- Result: **${JOB_STATUS:-unknown}**"
            echo "- Canonical 420-page sync: **${CANONICAL_SYNC:-not-run}**"
            echo "- Visual-map validation: **${VALIDATE_OUTCOME:-not-run}**"
            echo "- WordPress visual update: **${PUBLISH_OUTCOME:-not-run}**"
            echo "- 420-page visitor visual verification: **${VERIFY_OUTCOME:-not-run}**"
            echo "- Lesson visuals attached: **${COUNT:-0}**"
            echo "- Existing WordPress media reused: **${REUSED:-0}**"
            echo "- New media uploads: **${UPLOADS:-0}**"
            echo '- Review control: website publication and visual placement do not represent independent lesson approval.'
          } >> "$GITHUB_STEP_SUMMARY"
