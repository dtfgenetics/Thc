name: Enforce DTFSeeds Visual Quality Quarantine

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/scrub-wordpress-low-quality-visuals.mjs
      - site/wordpress/visual-quality-policy.json
      - scripts/rebuild-wordpress-visual-site.mjs
      - scripts/rebuild-wordpress-visual-v4.mjs
      - scripts/rebuild-wordpress-learning-experience-v3.mjs
      - scripts/rebuild-wordpress-support-pages-v1.mjs
      - scripts/polish-wordpress-genetics-visuals-v4.mjs
      - scripts/polish-wordpress-shop-storefront-v5.mjs
      - scripts/deploy-wordpress-infographic-library-rest.mjs
      - scripts/stage-eligible-infographics.mjs
      - site/wordpress/assets/infographics/**
      - .github/workflows/wordpress-visual-quality-quarantine.yml
  workflow_run:
    workflows:
      - Rebuild DTFSeeds WordPress Visual Site
      - Publish THC Infographics to WordPress Production
      - Publish DTFSeeds WordPress Production
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dtfseeds-wordpress-visual-quality-quarantine
  cancel-in-progress: false

jobs:
  quarantine:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_VISUAL_SCRUB: 'true'
      DELETE_BANNED_MEDIA: 'true'
      BACKUP_ROOT: /tmp/dtf-visual-quality-quarantine
      DTF_VISUAL_QUALITY_POLICY: ${{ github.workspace }}/site/wordpress/visual-quality-policy.json

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate quarantine policy and scrubber
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/scrub-wordpress-low-quality-visuals.mjs
          node -e "const p=require('./site/wordpress/visual-quality-policy.json'); if(p.schemaVersion!==1||p.mode!=='quarantine'||!p.bannedMedia.slugPrefixes.includes('dtf-edu-')) process.exit(1)"

      - name: Remove banned low-quality visuals from WordPress
        shell: bash
        run: |
          set -euo pipefail
          node scripts/scrub-wordpress-low-quality-visuals.mjs

      - name: Upload rollback and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtfseeds-visual-quality-quarantine-${{ github.run_id }}
          path: /tmp/dtf-visual-quality-quarantine
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize visual quarantine
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/dtf-visual-quality-quarantine/visual-quarantine-latest.json
          if [[ -s "$report" ]]; then
            node - <<'NODE' "$report" "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const [reportPath,summaryPath]=process.argv.slice(2);
          const d=JSON.parse(fs.readFileSync(reportPath,'utf8'));
          const lines=[
            '## DTFSeeds visual quality quarantine','',
            `Banned media found: **${d.bannedMediaCount}**`,
            `Content records scrubbed: **${d.changedContentCount}**`,
            `Banned media deleted: **${d.deletedMediaCount}**`,
            `Public route verification: **${d.verification.every(x=>x.ok)?'passed':'failed'}**`,'',
            'Policy: legacy dtf-edu-* media and Teaching Healthy Cultivation legacy infographic media are not permitted on public site surfaces. An image-less layout is preferred to an unapproved image.'
          ];
          fs.appendFileSync(summaryPath,lines.join('\n')+'\n');
          NODE
          fi
