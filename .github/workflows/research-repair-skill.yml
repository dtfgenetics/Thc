name: Research Repair Skill

on:
  pull_request:
    paths:
      - '.agents/skills/dtf-research-repair/**'
      - '.github/workflows/research-repair-skill.yml'
      - 'AGENTS.md'
      - 'AI_CONTEXT.md'
      - '.github/workflows/worker-orchestrator.yml'
      - 'scripts/test-worker-orchestrator.mjs'
      - 'scripts/orchestrator-integrate.mjs'
      - 'scripts/orchestrator/acceptance.mjs'
      - 'scripts/orchestrator/verification.mjs'
      - 'scripts/orchestrator/repair.mjs'
      - 'scripts/orchestrator/release.mjs'
      - 'scripts/orchestrator/executor-pool.mjs'
      - 'configuration/orchestrator/retry-policies.json'
      - 'scripts/orchestrator-check.mjs'
      - 'scripts/orchestrator/state.mjs'
      - 'docs/GITHUB_WORKER_ORCHESTRATOR.md'
  merge_group:
  push:
    branches: [main]
    paths:
      - '.agents/skills/dtf-research-repair/**'
      - '.github/workflows/research-repair-skill.yml'
      - 'AGENTS.md'
      - 'AI_CONTEXT.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate research-repair controller
        run: node .agents/skills/dtf-research-repair/scripts/self-test.mjs
      - name: Validate worker-orchestrator integration
        run: node scripts/test-worker-orchestrator.mjs
