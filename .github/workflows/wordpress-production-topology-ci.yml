name: Validate WordPress Production Topology

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wordpress-canonical-production.yml
      - .github/workflows/wordpress-genetics-library-production.yml
      - .github/workflows/wordpress-genetics-library-push.yml
      - .github/workflows/wordpress-gallery-v2-production.yml
      - .github/workflows/wordpress-infographic-production.yml
      - .github/workflows/wordpress-approved-visual-library-v2.yml
      - .github/workflows/wordpress-learning-experience-v3-production.yml
      - .github/workflows/wordpress-home-release-visuals.yml
      - .github/workflows/wordpress-visual-polish-v3-post-canonical.yml
      - .github/workflows/wordpress-home-genetics-art.yml
      - .github/workflows/wordpress-canonical-watch.yml
      - .github/workflows/verify-live-infographics.yml
      - .github/workflows/wordpress-production-topology-ci.yml
      - scripts/wordpress-ipv4-fetch-bootstrap.mjs
      - scripts/flush-hostinger-litespeed-mcp.mjs
      - scripts/purge-wordpress-litespeed-cache.mjs
      - scripts/verify-wordpress-genetics-library-production.mjs
      - scripts/run-learning-v3-connected-production.sh
      - scripts/run-learning-v3-production.mjs
      - scripts/improve-wordpress-learning-v4.mjs
      - scripts/prepare-learning-v3-owner-aware-publisher.mjs
      - scripts/prepare-learning-owner-aware-followup-publishers.mjs
      - scripts/publish-learning-expanded-references-owner-aware.mjs
      - scripts/verify-learning-owner-storage.mjs
      - scripts/clear-wordpress-home-featured-media.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/wordpress-canonical-production.yml
      - .github/workflows/wordpress-genetics-library-production.yml
      - .github/workflows/wordpress-genetics-library-push.yml
      - .github/workflows/wordpress-gallery-v2-production.yml
      - .github/workflows/wordpress-infographic-production.yml
      - .github/workflows/wordpress-approved-visual-library-v2.yml
      - .github/workflows/wordpress-learning-experience-v3-production.yml
      - .github/workflows/wordpress-home-release-visuals.yml
      - .github/workflows/wordpress-visual-polish-v3-post-canonical.yml
      - .github/workflows/wordpress-home-genetics-art.yml
      - .github/workflows/wordpress-canonical-watch.yml
      - .github/workflows/verify-live-infographics.yml
      - .github/workflows/wordpress-production-topology-ci.yml
      - scripts/wordpress-ipv4-fetch-bootstrap.mjs
      - scripts/flush-hostinger-litespeed-mcp.mjs
      - scripts/purge-wordpress-litespeed-cache.mjs
      - scripts/verify-wordpress-genetics-library-production.mjs
      - scripts/run-learning-v3-connected-production.sh
      - scripts/run-learning-v3-production.mjs
      - scripts/improve-wordpress-learning-v4.mjs
      - scripts/prepare-learning-v3-owner-aware-publisher.mjs
      - scripts/prepare-learning-owner-aware-followup-publishers.mjs
      - scripts/publish-learning-expanded-references-owner-aware.mjs
      - scripts/verify-learning-owner-storage.mjs
      - scripts/clear-wordpress-home-featured-media.mjs

permissions:
  contents: read

jobs:
  topology:
    name: Enforce single-owner WordPress production chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify ordered production handoffs
        shell: bash
        run: |
          set -euo pipefail

          canonical='.github/workflows/wordpress-canonical-production.yml'
          genetics='.github/workflows/wordpress-genetics-library-production.yml'
          genetics_recovery='.github/workflows/wordpress-genetics-library-push.yml'
          gallery_verify='.github/workflows/wordpress-gallery-v2-production.yml'
          legacy_infographics='.github/workflows/wordpress-infographic-production.yml'
          approved_visuals='.github/workflows/wordpress-approved-visual-library-v2.yml'
          learning='.github/workflows/wordpress-learning-experience-v3-production.yml'
          home='.github/workflows/wordpress-home-release-visuals.yml'
          legacy_visual='.github/workflows/wordpress-visual-polish-v3-post-canonical.yml'
          legacy_genetics='.github/workflows/wordpress-home-genetics-art.yml'
          watch='.github/workflows/wordpress-canonical-watch.yml'
          verify_visuals='.github/workflows/verify-live-infographics.yml'
          ipv4_bootstrap='scripts/wordpress-ipv4-fetch-bootstrap.mjs'
          genetics_verify='scripts/verify-wordpress-genetics-library-production.mjs'
          cache_purge='scripts/purge-wordpress-litespeed-cache.mjs'
          learning_wrapper='scripts/run-learning-v3-connected-production.sh'
          learning_map='scripts/improve-wordpress-learning-v4.mjs'
          learning_v3_prepare='scripts/prepare-learning-v3-owner-aware-publisher.mjs'
          learning_followup_prepare='scripts/prepare-learning-owner-aware-followup-publishers.mjs'
          learning_expanded='scripts/publish-learning-expanded-references-owner-aware.mjs'
          learning_storage='scripts/verify-learning-owner-storage.mjs'
          home_feature_guard='scripts/clear-wordpress-home-featured-media.mjs'

          grep -Fq -- '- Stage DTFSeeds WordPress Canonical Deployment' "$canonical"

          # Genetics owns /seeds/. Automatic production must purge explicit routes
          # before REST/public acceptance; direct recovery remains manual-only.
          grep -Fq -- '- Publish DTFSeeds WordPress Production' "$genetics"
          grep -Fq -- "- 'scripts/wordpress-ipv4-fetch-bootstrap.mjs'" "$genetics"
          grep -Fq -- "- 'scripts/purge-wordpress-litespeed-cache.mjs'" "$genetics"
          grep -Fq -- "- 'scripts/verify-wordpress-genetics-library-production.mjs'" "$genetics"
          grep -Fq "LITESPEED_PURGE_ALL: 'false'" "$genetics"
          purge_line="$(grep -n 'LITESPEED_PURGE_URLS_JSON=.*wordpress-ipv4-fetch-bootstrap.mjs.*purge-wordpress-litespeed-cache.mjs' "$genetics" | head -1 | cut -d: -f1)"
          verify_line="$(grep -n 'wordpress-ipv4-fetch-bootstrap.mjs scripts/verify-wordpress-genetics-library-production.mjs' "$genetics" | head -1 | cut -d: -f1)"
          [[ -n "$purge_line" && -n "$verify_line" && "$purge_line" -lt "$verify_line" ]] || {
            echo 'Genetics must purge explicit routes before REST/public acceptance.' >&2
            exit 1
          }
          node --check "$cache_purge"
          node --check "$genetics_verify"

          for manual_lane in "$genetics_recovery" "$gallery_verify"; do
            grep -Fq 'workflow_dispatch:' "$manual_lane"
            if grep -Fq 'workflow_run:' "$manual_lane" || grep -Fq 'push:' "$manual_lane"; then
              echo "Recovery/verifier lane must remain manual-only: $manual_lane" >&2
              exit 1
            fi
          done
          ! grep -Fq 'APPLY_GALLERY_V2' "$gallery_verify"
          grep -Fq 'Gallery is verified read-only' "$gallery_verify"

          # The legacy infographic workflow remains upstream of Learning for now,
          # but the public visual library itself is owned by the approved-only lane.
          grep -Fq -- '- Publish DTFSeeds WordPress Production' "$legacy_infographics"
          if grep -Fq -- '- Stage DTFSeeds WordPress Canonical Deployment' "$legacy_infographics"; then
            echo 'Legacy infographic production must not run directly from canonical staging.' >&2
            exit 1
          fi

          grep -Fq 'name: Publish Approved THC Visual Library' "$approved_visuals"
          grep -Fq 'dtf-approved-visual-library-v2' "$approved_visuals"
          grep -Fq 'site/wordpress/visual-quality-policy.json' "$approved_visuals"
          grep -Fq "APPLY_INFOGRAPHIC_GALLERY: 'true'" "$approved_visuals"
          grep -Fq 'Verify public approved-only library' "$approved_visuals"

          grep -Fq -- '- Publish THC Infographics to WordPress Production' "$learning"
          if grep -Fq -- '- Publish DTFSeeds WordPress Production' "$learning"; then
            echo 'Learning must keep one upstream workflow handoff, not a parallel canonical trigger.' >&2
            exit 1
          fi

          grep -Fq 'uses: ./.github/workflows/wordpress-home-release-visuals.yml' "$learning"
          grep -Fq 'workflow_call:' "$home"
          grep -Fq 'workflow_dispatch:' "$home"
          if grep -Fq 'workflow_run:' "$home" || grep -Fq 'push:' "$home"; then
            echo 'Final Home visuals must remain reusable/manual-only; Learning owns automatic Home/Learn production.' >&2
            exit 1
          fi

          bash -n "$learning_wrapper"
          node --check "$learning_v3_prepare"
          node --check "$learning_followup_prepare"
          node --check "$learning_expanded"
          node --check "$learning_storage"
          node --check "$home_feature_guard"
          grep -Fq 'prepare-learning-v3-owner-aware-publisher.mjs' "$learning_wrapper"
          grep -Fq 'prepare-learning-owner-aware-followup-publishers.mjs' "$learning_wrapper"
          grep -Fq 'LEARNING_V3_PUBLISHER_PATH="$owner_v3"' "$learning_wrapper"
          grep -Fq 'APPLY_LEARNING_V4=true' "$learning_wrapper"
          grep -Fq 'publish-learning-expanded-references-owner-aware.mjs' "$learning_wrapper"
          grep -Fq 'clear-wordpress-home-featured-media.mjs' "$learning_wrapper"
          for stage in v3 v4 expanded visual; do
            grep -Fq "LEARNING_OWNER_STAGE=$stage" "$learning_wrapper"
          done
          grep -Fq "rootVerification: 'wordpress-rest'" "$learning_v3_prepare"
          grep -Fq "rootStorageRead: 'raw-first'" "$learning_v3_prepare"
          grep -Fq "topicVerification: 'anonymous-public'" "$learning_v3_prepare"
          grep -Fq "verification: 'wordpress-rest-storage'" "$learning_storage"
          grep -Fq "storageVerification: 'success'" "$learning_expanded"
          node --check "$learning_map"
          grep -Fq 'data-dtf-learning-map="v4"' "$learning_map"

          node --check "$ipv4_bootstrap"
          grep -Fq 'family: 4' "$ipv4_bootstrap"
          grep -Fq 'https.request' "$ipv4_bootstrap"

          for legacy in "$legacy_visual" "$legacy_genetics"; do
            if grep -Fq 'workflow_run:' "$legacy" || grep -Fq 'push:' "$legacy"; then
              echo "Legacy WordPress writer must remain manual-only: $legacy" >&2
              exit 1
            fi
            grep -Fq 'workflow_dispatch:' "$legacy"
          done
          if grep -Fq '/learn/' "$legacy_visual" || grep -Fq 'learn_body=' "$legacy_visual"; then
            echo 'Legacy visual compatibility workflow must not mutate or verify Learn ownership.' >&2
            exit 1
          fi
          grep -Fq 'continue-on-error: true' "$legacy_genetics"

          if grep -Fq 'issue_number: 46' "$watch"; then
            echo 'Canonical preflight reporting must not depend on saturated issue #46.' >&2
            exit 1
          fi

          # Independent visual verification is now a manual, read-only audit of
          # the approved-only library. Automatic public acceptance already lives
          # in wordpress-approved-visual-library-v2.yml.
          grep -Fq 'workflow_dispatch:' "$verify_visuals"
          if grep -Fq 'workflow_run:' "$verify_visuals" || grep -Fq 'push:' "$verify_visuals"; then
            echo 'Independent approved-visual verification must remain manual-only.' >&2
            exit 1
          fi
          if grep -Fq 'git push origin HEAD:main' "$verify_visuals"; then
            echo 'Independent approved-visual verification must not mutate main.' >&2
            exit 1
          fi
          if grep -Fq 'issue_number:' "$verify_visuals"; then
            echo 'Independent approved-visual verification must not depend on saturated advisory issues.' >&2
            exit 1
          fi
          grep -Fq 'dtf-approved-visual-library-v2' "$verify_visuals"
          grep -Fq 'site/wordpress/visual-quality-policy.json' "$verify_visuals"
          grep -Fq 'actions/upload-artifact@v4' "$verify_visuals"

          echo 'Verified WordPress topology: canonical staging -> dedicated writers; approved-only visual library owns public education media; Learning owns serialized Home/Learn V3/V4/expanded/visual storage plus Home featured-media quarantine; final Home release visuals are reusable; Genetics owns /seeds/; recovery and independent visual-verification lanes are manual/read-only; legacy writers remain manual-only.'
