name: Force Antigravity and Bridge Gates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-antigravity-bridge-gates.yml
      - .github/antigravity-bridge-gates-trigger.txt

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate target workflows
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/google-antigravity-deployment-audit.yml
          test -s .github/workflows/validate-wordpress-public-suite-bridge.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/google-antigravity-deployment-audit.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/validate-wordpress-public-suite-bridge.yml

      - name: Dispatch and resolve exact child runs
        id: children
        shell: bash
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run google-antigravity-deployment-audit.yml --ref main
          gh workflow run validate-wordpress-public-suite-bridge.yml --ref main

          resolve_run() {
            local workflow="$1"
            local run_id=''
            for attempt in $(seq 1 30); do
              run_id="$(gh run list --workflow "$workflow" --branch main --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq --arg started "$started" '[.[] | select(.createdAt >= $started)] | sort_by(.createdAt) | last | .databaseId // empty')"
              if [[ -n "$run_id" ]]; then printf '%s\n' "$run_id"; return 0; fi
              sleep 2
            done
            return 1
          }

          ag="$(resolve_run google-antigravity-deployment-audit.yml)"
          bridge="$(resolve_run validate-wordpress-public-suite-bridge.yml)"
          echo "antigravity_run=$ag" >> "$GITHUB_OUTPUT"
          echo "bridge_run=$bridge" >> "$GITHUB_OUTPUT"
          echo "Antigravity run: $ag"
          echo "Bridge validation run: $bridge"

      - name: Wait for Antigravity audit
        id: agwait
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ steps.children.outputs.antigravity_run }}
        run: |
          set +e
          gh run watch "$RUN_ID" --exit-status
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Wait for bridge validation
        id: bridgewait
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ steps.children.outputs.bridge_run }}
        run: |
          set +e
          gh run watch "$RUN_ID" --exit-status
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report exact gate runs
        if: always()
        uses: actions/github-script@v7
        env:
          AG_RUN: ${{ steps.children.outputs.antigravity_run }}
          BRIDGE_RUN: ${{ steps.children.outputs.bridge_run }}
          AG_EXIT: ${{ steps.agwait.outputs.exit_code }}
          BRIDGE_EXIT: ${{ steps.bridgewait.outputs.exit_code }}
        with:
          script: |
            const base = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Antigravity + no-SSH bridge gate dispatcher',
                '',
                `Dispatcher: ${base}${context.runId}`,
                `Google Antigravity audit: ${process.env.AG_RUN ? base + process.env.AG_RUN : 'unresolved'} — watcher exit **${process.env.AG_EXIT || 'unknown'}**`,
                `Deterministic bridge validation: ${process.env.BRIDGE_RUN ? base + process.env.BRIDGE_RUN : 'unresolved'} — watcher exit **${process.env.BRIDGE_EXIT || 'unknown'}**`,
                '',
                'These are read-only gates. No WordPress/Hostinger production mutation occurs in this dispatcher.'
              ].join('\n')
            });
