name: Public Suite Watchdog Contract
on:
  pull_request:
    paths:
      - '.github/workflows/dtfseeds-public-suite-watch.yml'
      - '.github/workflows/public-suite-watch-contract.yml'
      - 'scripts/test/public-suite-watch-contract.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dtfseeds-public-suite-watch.yml'
      - '.github/workflows/public-suite-watch-contract.yml'
      - 'scripts/test/public-suite-watch-contract.test.mjs'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test/public-suite-watch-contract.test.mjs
