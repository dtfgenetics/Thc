name: Publish Diagnostic Records V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/wordpress/education/diagnostic-records-v2.json'
      - 'scripts/publish-wordpress-diagnostic-records-v2.mjs'
      - '.github/workflows/wordpress-diagnostic-records-v2.yml'
  push:
    branches: [main]
    paths:
      - 'site/wordpress/education/diagnostic-records-v2.json'
      - 'scripts/publish-wordpress-diagnostic-records-v2.mjs'
      - '.github/workflows/wordpress-diagnostic-records-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-diagnostic-records-v2
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  validate:
    name: Validate Diagnostic Records V2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate records package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/publish-wordpress-diagnostic-records-v2.mjs
          node scripts/publish-wordpress-diagnostic-records-v2.mjs --validate-only | tee "$RUNNER_TEMP/dr2-validation.json"
          grep -Fq '"templates": 10' "$RUNNER_TEMP/dr2-validation.json"
          grep -Fq '"fields": 70' "$RUNNER_TEMP/dr2-validation.json"
          grep -Fq '"supportRoutes": 8' "$RUNNER_TEMP/dr2-validation.json"

  publish:
    name: Publish and verify Diagnostic Records V2
    needs: validate
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_DIAGNOSTIC_RECORDS_V2: 'true'
      BACKUP_ROOT: /tmp/dtf-diagnostic-records-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm production package
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/publish-wordpress-diagnostic-records-v2.mjs
          node scripts/publish-wordpress-diagnostic-records-v2.mjs --validate-only
      - name: Publish Diagnostic Records V2
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/publish-wordpress-diagnostic-records-v2.mjs | tee "$RUNNER_TEMP/dr2-publish.log"
          report="$(find "$BACKUP_ROOT" -name report.json -type f -print -quit)"
          test -n "$report"; test -s "$report"
          echo "templates=$(node -p "require(process.argv[1]).templates" "$report")" >> "$GITHUB_OUTPUT"
          echo "fields=$(node -p "require(process.argv[1]).fields" "$report")" >> "$GITHUB_OUTPUT"
          echo "routes=$(node -p "require(process.argv[1]).supportRoutes" "$report")" >> "$GITHUB_OUTPUT"
      - name: Verify fresh visitor Records page
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/dr2-live.html"; ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' --header 'Pragma: no-cache' \
              "$WP_SITE_URL/learn/records/?dtf_dr2_verify=${GITHUB_RUN_ID}-${attempt}" --output "$body"
            if grep -Fq 'data-dtf-diagnostic-records-v2="true"' "$body"; then ok=1; break; fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]]
          [[ "$(grep -Fo 'data-dr2-template=' "$body" | wc -l | tr -d ' ')" = '10' ]]
          [[ "$(grep -Fo 'class="dr2-field"' "$body" | wc -l | tr -d ' ')" = '70' ]]
          [[ "$(grep -Fo 'class="dr2-check"' "$body" | wc -l | tr -d ' ')" = '10' ]]
          grep -Fq 'Grow Records & Diagnostic Worksheets' "$body"
          grep -Fq '/learn/diagnostic-cases/' "$body"
          grep -Fq '/learn/diagnostics/' "$body"
          grep -Fq '/learn/research-methods/' "$body"
          grep -Fq '/learn/ipm/' "$body"
          grep -Fq '/learn/water-ph-ec/' "$body"
          grep -Fq '/thc-grow-doc/' "$body"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-records-v2-${{ github.run_id }}
          path: |
            /tmp/dtf-diagnostic-records-v2
            ${{ runner.temp }}/dr2-publish.log
            ${{ runner.temp }}/dr2-live.html
          if-no-files-found: warn
          retention-days: 30
      - name: Report Diagnostic Records V2 result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          PUBLISH: ${{ steps.publish.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          TEMPLATES: ${{ steps.publish.outputs.templates }}
          FIELDS: ${{ steps.publish.outputs.fields }}
          ROUTES: ${{ steps.publish.outputs.routes }}
        with:
          script: |
            const body = [
              '## Diagnostic Records V2 production','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `WordPress publication: **${process.env.PUBLISH || 'not-run'}**`,
              `Visitor verification: **${process.env.VERIFY || 'not-run'}**`,
              `Record templates: **${process.env.TEMPLATES || '0'}**`,
              `Structured fields: **${process.env.FIELDS || '0'}**`,
              `Support routes: **${process.env.ROUTES || '0'}**`, '',
              'The live /learn/records/ page is now the print-friendly evidence kit for the Diagnostic Case Lab.'
            ].join('\n');
            for (const issue_number of [46,150]) await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number,body});
