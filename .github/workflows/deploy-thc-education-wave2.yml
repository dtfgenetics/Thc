name: Deploy THC Education Wave 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish-wordpress-education-wave2.mjs'
      - 'scripts/repair-wordpress-education-records-route.mjs'
      - '.github/workflows/deploy-thc-education-wave2.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-thc-education-wave2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-education-wave2
    steps:
      - name: Checkout canonical site repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate publisher and production access
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/publish-wordpress-education-wave2.mjs
          node --check scripts/repair-wordpress-education-records-route.mjs
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"

      - name: Publish remaining THC education system
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/education-wave2-result.json"
          success=0
          for attempt in 1 2 3 4; do
            echo "WordPress publication attempt $attempt of 4"
            rm -f "$result"
            if node scripts/publish-wordpress-education-wave2.mjs > "$result"; then
              cat "$result"
              success=1
              break
            fi
            if [[ "$attempt" -lt 4 ]]; then sleep $((attempt * 8)); fi
          done
          test "$success" -eq 1
          count="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(x.pageCount))" "$result")"
          test "$count" -eq 20
          echo "page_count=$count" >> "$GITHUB_OUTPUT"
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      - name: Repair records route collision
        id: records
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Records route repair attempt $attempt of 4"
            if node scripts/repair-wordpress-education-records-route.mjs | tee "$RUNNER_TEMP/education-records-repair.json"; then
              echo "outcome=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$attempt" -lt 4 ]]; then sleep $((attempt * 8)); fi
          done
          exit 1

      - name: Purge Hostinger LiteSpeed cache
        shell: bash
        continue-on-error: true
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "Cache purge attempt $attempt of 3"
            node scripts/flush-hostinger-litespeed-mcp.mjs && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Allow public cache and permalink state to settle
        run: sleep 20

      - name: Verify public education routes
        id: live
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            /learn/start-here/
            /learn/beginner-guides/
            /learn/beginner-guides/seed-storage-basics/
            /learn/beginner-guides/germination-mistakes/
            /learn/beginner-guides/seedling-problems/
            /learn/beginner-guides/vegetative-growth-checklist/
            /learn/beginner-guides/flowering-checklist/
            /learn/postharvest/
            /learn/postharvest/harvest-readiness/
            /learn/postharvest/drying-fundamentals/
            /learn/postharvest/curing-water-activity/
            /learn/postharvest/storage-packaging-crop-review/
            /learn/sops/
            /learn/sops/water-measurement/
            /learn/sops/environment-measurement/
            /learn/sops/lighting-measurement/
            /learn/diagnostics/
            /learn/records/
            /learn/sources/
            /learn/glossary/
          )
          for route in "${routes[@]}"; do
            echo "Verifying $route"
            body="$RUNNER_TEMP/verify-$(echo "$route" | tr '/' '-').html"
            curl -4 --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors \
              -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
              "https://dtfseeds.com${route}?dtf_wave2=${GITHUB_RUN_ID}" -o "$body"
            grep -Eqi '<h1([ >])' "$body"
            grep -Fqi '/learn/infographics/' "$body"
            ! grep -Fqi 'email@email.com' "$body"
            ! grep -Fqi '+123456789' "$body"
            ! grep -Fqi 'Needed from owner' "$body"
            ! grep -Fqi 'Reserved strain card' "$body"
          done

          learn="$RUNNER_TEMP/learn-root-wave2.html"
          curl -4 --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors \
            -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
            "https://dtfseeds.com/learn/?dtf_wave2=${GITHUB_RUN_ID}" -o "$learn"
          grep -Fqi 'The complete learning system' "$learn"
          for href in \
            /learn/start-here/ /learn/library/ /learn/beginner-guides/ /learn/setup/ \
            /learn/root-zone/ /learn/environment/ /learn/plant-health/ /learn/propagation/ \
            /learn/diagnostics/ /learn/postharvest/ /learn/sops/ /learn/records/ \
            /learn/sources/ /learn/glossary/ /learn/encyclopedia/ /learn/academy/ /learn/infographics/; do
            grep -Fq "$href" "$learn"
          done
          ! grep -Fq '/learn/downloads/' "$learn"
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      - name: Upload rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-education-wave2-backup-${{ github.run_id }}
          path: /tmp/dtf-education-wave2
          if-no-files-found: warn
          retention-days: 30

      - name: Report production result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          PAGE_COUNT: ${{ steps.publish.outputs.page_count }}
          PUBLISH_OUTCOME: ${{ steps.publish.outputs.outcome }}
          RECORDS_OUTCOME: ${{ steps.records.outputs.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outputs.outcome }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## THC Education Wave 2 production',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.JOB_STATUS}**`,
                `Education pages published: **${process.env.PAGE_COUNT || 'not-run'}**`,
                `WordPress publication: **${process.env.PUBLISH_OUTCOME || 'not-run'}**`,
                `Records-route repair: **${process.env.RECORDS_OUTCOME || 'not-run'}**`,
                `Visitor-facing verification: **${process.env.LIVE_OUTCOME || 'not-run'}**`,
                '',
                'Scope: Start Here, five beginner guides, four postharvest guides, three measurement/SOP pages, diagnostics, printable records, sources/evidence, glossary, and full Learn navigation reconciliation.',
                'All existing page records are backed up before update. Private internal review/download records remain excluded from the public pages.'
              ].join('\n')
            });
