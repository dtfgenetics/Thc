name: Publish Plant Biology V6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/wordpress/education/plant-biology-v6.json'
      - 'scripts/publish-wordpress-plant-biology-v6.mjs'
      - '.github/workflows/wordpress-plant-biology-v6.yml'
  workflow_run:
    workflows:
      - Enhance DTFSeeds Education V4
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-plant-biology-v6
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  publish:
    name: Publish complete Plant Biology curriculum
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_PLANT_BIOLOGY_V6: 'true'
      PLANT_BIOLOGY_V6_PATH: site/wordpress/education/plant-biology-v6.json
      BACKUP_ROOT: /tmp/dtf-plant-biology-v6

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Plant Biology V6 package
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/publish-wordpress-plant-biology-v6.mjs
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('site/wordpress/education/plant-biology-v6.json','utf8'));
          if(c.schemaVersion!==1||c.id!=='plant-biology-v6') throw new Error('Invalid curriculum identity');
          if(!Array.isArray(c.chapters)||c.chapters.length!==8) throw new Error('Expected 8 chapters');
          const lessons=c.chapters.reduce((n,x)=>n+(x.lessons||[]).length,0);
          if(lessons!==30) throw new Error(`Expected 30 lessons, found ${lessons}`);
          if(!Array.isArray(c.visualTargets)||c.visualTargets.length<10) throw new Error('Visual target map incomplete');
          console.log(`Plant Biology V6 validated: ${c.chapters.length} chapters, ${lessons} lessons, ${c.visualTargets.length} visual targets.`);
          NODE

      - name: Publish and visitor-verify Plant Biology V6
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/publish-wordpress-plant-biology-v6.mjs | tee "$RUNNER_TEMP/plant-biology-v6.log"
          report="$BACKUP_ROOT/plant-biology-v6-report.json"
          test -s "$report"
          echo "chapters=$(node -p "require(process.argv[1]).chapters" "$report")" >> "$GITHUB_OUTPUT"
          echo "lessons=$(node -p "require(process.argv[1]).lessons" "$report")" >> "$GITHUB_OUTPUT"
          echo "encyclopedia=$(node -p "require(process.argv[1]).publishedEncyclopediaLinks" "$report")" >> "$GITHUB_OUTPUT"

      - name: Independent public verification
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/plant-biology.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "$WP_SITE_URL/learn/plant-biology/?dtf_pb6_verify=${GITHUB_RUN_ID}-${attempt}" --output "$body"
            if grep -Fqi 'data-dtf-plant-biology-v6="true"' "$body"; then ok=1; break; fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]]
          [[ "$(grep -Fo 'class="pb6-chapter"' "$body" | wc -l | tr -d ' ')" = '8' ]]
          [[ "$(grep -Fo 'class="pb6-lesson"' "$body" | wc -l | tr -d ' ')" = '30' ]]
          grep -Fqi 'Plant Identity & Whole-Plant Morphology' "$body"
          grep -Fqi 'Cells, Tissues & Meristems' "$body"
          grep -Fqi 'Leaves, Stomata & Gas Exchange' "$body"
          grep -Fqi 'Hormones, Tropisms & Stress Responses' "$body"
          grep -Fqi 'Flowers, Reproduction, Trichomes & Senescence' "$body"
          grep -Fqi 'data-dtf-learning-v4="topic-plant-biology"' "$body"
          grep -Fqi 'data-dtf-topic="plant-biology"' "$body"

      - name: Upload Plant Biology evidence and rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plant-biology-v6-${{ github.run_id }}
          path: |
            /tmp/dtf-plant-biology-v6
            ${{ runner.temp }}/plant-biology-v6.log
            ${{ runner.temp }}/plant-biology.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report Plant Biology V6 result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          VALIDATE: ${{ steps.validate.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          CHAPTERS: ${{ steps.publish.outputs.chapters }}
          LESSONS: ${{ steps.publish.outputs.lessons }}
          ENCYCLOPEDIA: ${{ steps.publish.outputs.encyclopedia }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Plant Biology V6 complete curriculum',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.STATUS}**`,
                `Package validation: **${process.env.VALIDATE || 'not-run'}**`,
                `WordPress publication: **${process.env.PUBLISH || 'not-run'}**`,
                `Visitor verification: **${process.env.VERIFY || 'not-run'}**`,
                `Chapters: **${process.env.CHAPTERS || '0'}**`,
                `Focused lessons: **${process.env.LESSONS || '0'}**`,
                `Controlled encyclopedia pages linked directly: **${process.env.ENCYCLOPEDIA || '0'}**`,
                '',
                'Plant Biology now expands the original five-section overview into a chapter-based curriculum covering whole-plant morphology; cells, tissues and meristems; roots; stems and vascular transport; leaves and stomata; photosynthesis, respiration and water relations; hormones, tropisms and stress; and flowers, reproduction, trichomes and senescence. The original V3 subject owner and V4 guided evidence layer are preserved.'
              ].join('\n')
            });
