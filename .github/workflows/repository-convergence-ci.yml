name: Repository Convergence CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/studio/**'
      - 'scripts/studio.mjs'
      - 'scripts/test-dtf-parallel-studio.mjs'
      - 'scripts/test-repository-convergence.mjs'
      - '.github/workflows/atlas-route-ownership-ci.yml'
      - '.github/workflows/verify-atlas-live.yml'
      - '.github/workflows/dtf420-overlay-shell-ci.yml'
      - 'scripts/verify-atlas-live.mjs'
      - 'scripts/stage-dtf420-static-overlay.py'
      - 'scripts/validate-repository-file-boundaries.mjs'
      - 'data/file-retirement-manifest.json'
      - 'scripts/validate-workflow-path-parity.mjs'
      - 'docs/DTFSEEDS_PRODUCTION_OWNERSHIP.md'
      - 'scripts/validate-public-navigation.mjs'
      - 'site/deployment/dtf420-static-overlay.json'
      - 'docs/operations/PLANT_ATLAS_MODEL_CONTRACT.md'
      - 'site/public-route-patch/atlas/models/README.md'
      - 'site/public-route-patch/release-triggers/**'
      - 'docs/operations/ATLAS_LIVE_VERIFIER.md'
      - 'docs/archive/releases/**'
      - 'scripts/normalize-wordpress-premium-page-titles.mjs'
      - '.github/workflows/branch-lifecycle-maintenance.yml'
      - '.github/workflows/main-pr-gate-audit.yml'
      - '.github/workflows/repository-convergence-ci.yml'
      - '.github/workflows/high-land-ci.yml'
      - '.github/workflows/high-land-web.yml'
      - '.github/workflows/datadog-synthetics.yml'
      - '.github/workflows/wordpress-canonical-watch.yml'
      - '.github/workflows/wordpress-canonical-deploy.yml'
      - '.github/workflows/wordpress-canonical-production.yml'
      - '.github/workflows/wordpress-premium-title-normalization.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/studio/**'
      - 'scripts/studio.mjs'
      - 'scripts/test-dtf-parallel-studio.mjs'
      - 'scripts/test-repository-convergence.mjs'
      - '.github/workflows/atlas-route-ownership-ci.yml'
      - '.github/workflows/verify-atlas-live.yml'
      - '.github/workflows/dtf420-overlay-shell-ci.yml'
      - 'scripts/verify-atlas-live.mjs'
      - 'scripts/stage-dtf420-static-overlay.py'
      - 'scripts/validate-repository-file-boundaries.mjs'
      - 'data/file-retirement-manifest.json'
      - 'scripts/validate-workflow-path-parity.mjs'
      - 'docs/DTFSEEDS_PRODUCTION_OWNERSHIP.md'
      - 'scripts/validate-public-navigation.mjs'
      - 'site/deployment/dtf420-static-overlay.json'
      - 'docs/operations/PLANT_ATLAS_MODEL_CONTRACT.md'
      - 'site/public-route-patch/atlas/models/README.md'
      - 'site/public-route-patch/release-triggers/**'
      - 'docs/operations/ATLAS_LIVE_VERIFIER.md'
      - 'docs/archive/releases/**'
      - 'scripts/normalize-wordpress-premium-page-titles.mjs'
      - '.github/workflows/branch-lifecycle-maintenance.yml'
      - '.github/workflows/main-pr-gate-audit.yml'
      - '.github/workflows/repository-convergence-ci.yml'
      - '.github/workflows/high-land-ci.yml'
      - '.github/workflows/high-land-web.yml'
      - '.github/workflows/datadog-synthetics.yml'
      - '.github/workflows/wordpress-canonical-watch.yml'
      - '.github/workflows/wordpress-canonical-deploy.yml'
      - '.github/workflows/wordpress-canonical-production.yml'
      - '.github/workflows/wordpress-premium-title-normalization.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repository convergence controls
        run: |
          set -euo pipefail
          node scripts/test-dtf-parallel-studio.mjs
          node scripts/test-repository-convergence.mjs
          node scripts/validate-repository-file-boundaries.mjs
          node scripts/validate-workflow-path-parity.mjs
          node --check scripts/studio/lifecycle.mjs
          node --check scripts/normalize-wordpress-premium-page-titles.mjs
