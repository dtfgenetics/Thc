name: Codespaces Playwright Local Smoke
on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'apps/high-land-web/**'
      - 'scripts/qa/local-playwright-smoke.mjs'
      - '.github/workflows/codespaces-playwright-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --prefix /tmp/thc-browser-qa --no-save --package-lock=false playwright@1.58.2
      - run: ln -s /tmp/thc-browser-qa/node_modules/playwright node_modules/playwright
      - run: /tmp/thc-browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Build High Land from locked dependencies
        run: npm run build:high-land
      - name: Start exact-checkout High Land preview
        run: |
          npm --workspace apps/high-land-web run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/thc-preview.log 2>&1 &
          echo $! > /tmp/thc-preview.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/thc-preview.log
          exit 1
      - name: Playwright desktop and mobile smoke
        run: node scripts/qa/local-playwright-smoke.mjs
      - name: Dependency audit evidence
        if: always()
        run: |
          mkdir -p .artifacts/dependency-audit
          npm audit --json > .artifacts/dependency-audit/npm-audit.json || test -s .artifacts/dependency-audit/npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-dependency-audit
          path: .artifacts/dependency-audit/npm-audit.json
          if-no-files-found: error
      - name: Preview diagnostics
        if: failure()
        run: cat /tmp/thc-preview.log || true
