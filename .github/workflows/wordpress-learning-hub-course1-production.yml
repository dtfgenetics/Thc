name: Publish Learning Hub Course 1

on:
  pull_request:
    paths:
      - site/wordpress/education/learning-hub-course1.json
      - site/wordpress/education/learning-hub-course1-ui-v3.json
      - site/wordpress/education/course-catalog-v3.json
      - scripts/publish-wordpress-learning-hub-course1-v2.mjs
      - scripts/enhance-wordpress-learning-hub-course1-ui-v3.mjs
      - scripts/apply-wordpress-learning-hub-course1-layout-v4.mjs
      - scripts/publish-wordpress-courses-navigation-v2.mjs
      - scripts/publish-wordpress-courses-catalog-v3.mjs
      - scripts/verify-wordpress-learning-hub-course1.mjs
      - scripts/verify-wordpress-learning-hub-course1-ui-v3.mjs
      - .github/workflows/wordpress-learning-hub-course1-production.yml
  push:
    branches:
      - main
    paths:
      - site/wordpress/education/learning-hub-course1.json
      - site/wordpress/education/learning-hub-course1-ui-v3.json
      - site/wordpress/education/course-catalog-v3.json
      - scripts/publish-wordpress-learning-hub-course1-v2.mjs
      - scripts/enhance-wordpress-learning-hub-course1-ui-v3.mjs
      - scripts/apply-wordpress-learning-hub-course1-layout-v4.mjs
      - scripts/publish-wordpress-courses-navigation-v2.mjs
      - scripts/publish-wordpress-courses-catalog-v3.mjs
      - scripts/verify-wordpress-learning-hub-course1.mjs
      - scripts/verify-wordpress-learning-hub-course1-ui-v3.mjs
      - .github/workflows/wordpress-learning-hub-course1-production.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dtfseeds-learning-hub-course1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate publisher, guided UI, responsive layout, catalog, navigation and verifiers
        run: |
          node --check scripts/publish-wordpress-learning-hub-course1-v2.mjs
          node --check scripts/enhance-wordpress-learning-hub-course1-ui-v3.mjs
          node --check scripts/apply-wordpress-learning-hub-course1-layout-v4.mjs
          node --check scripts/publish-wordpress-courses-navigation-v2.mjs
          node --check scripts/publish-wordpress-courses-catalog-v3.mjs
          node --check scripts/verify-wordpress-learning-hub-course1.mjs
          node --check scripts/verify-wordpress-learning-hub-course1-ui-v3.mjs
          node scripts/publish-wordpress-learning-hub-course1-v2.mjs --validate-only
          node scripts/enhance-wordpress-learning-hub-course1-ui-v3.mjs --validate-only
          node scripts/apply-wordpress-learning-hub-course1-layout-v4.mjs --validate-only
          node scripts/publish-wordpress-courses-navigation-v2.mjs --validate-only
          node scripts/publish-wordpress-courses-catalog-v3.mjs --validate-only

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_LEARNING_HUB_COURSE1: 'true'
      BACKUP_ROOT: /tmp/dtf-learning-hub-course1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require WordPress credentials
        shell: bash
        run: |
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
      - name: Publish final Course 1 base page tree
        run: node scripts/publish-wordpress-learning-hub-course1-v2.mjs
      - name: Build guided 18-lesson Course 1 learning UI
        run: node scripts/enhance-wordpress-learning-hub-course1-ui-v3.mjs
      - name: Apply responsive three-column Course 1 lesson layout
        run: node scripts/apply-wordpress-learning-hub-course1-layout-v4.mjs
      - name: Preserve shared Courses navigation behavior
        run: node scripts/publish-wordpress-courses-navigation-v2.mjs
      - name: Publish editable responsive Courses catalog V3
        run: node scripts/publish-wordpress-courses-catalog-v3.mjs
      - name: Verify published Course 1 base release by WordPress readback
        shell: bash
        run: |
          mkdir -p "$BACKUP_ROOT"
          node scripts/verify-wordpress-learning-hub-course1.mjs | tee "$BACKUP_ROOT/readback-verification.json"
      - name: Verify guided Course 1 lesson navigation and visual policy
        shell: bash
        run: |
          node scripts/verify-wordpress-learning-hub-course1-ui-v3.mjs | tee "$BACKUP_ROOT/readback-ui-v3-verification.json"
      - name: Verify Courses page, header menu and representative public lesson
        shell: bash
        run: |
          set -euo pipefail
          courses="$RUNNER_TEMP/courses.html"
          lesson="$RUNNER_TEMP/course1-lesson.html"
          curl -4 --fail --silent --show-error --location --retry 3 --retry-delay 2 --header 'Cache-Control: no-cache, no-store, max-age=0' "$WP_SITE_URL/courses/?verify=${GITHUB_RUN_ID}" --output "$courses"
          curl -4 --fail --silent --show-error --location --retry 3 --retry-delay 2 --header 'Cache-Control: no-cache, no-store, max-age=0' "$WP_SITE_URL/learn/learning-hub/cultivation-technician-i/safety-responsible-practice-cultivation-workflows/applied-workplace-safety/lesson-1-1-hazard-recognition-control-boundaries/?verify=${GITHUB_RUN_ID}" --output "$lesson"
          grep -Fq 'dtf-courses-v3-style' "$courses"
          grep -Fq 'data-dtf-courses-catalog="v3"' "$courses"
          grep -Fq 'Professional cultivation courses' "$courses"
          grep -Fq 'href="/courses/"' "$courses"
          grep -Fq 'dtf-learning-hub-course1-ui-v3' "$lesson"
          grep -Fq 'dtf-learning-hub-course1-layout-v4' "$lesson"
          grep -Fq 'lhv4-lesson-layout' "$lesson"
          grep -Fq 'Course outline' "$lesson"
          grep -Fq 'Mark lesson complete' "$lesson"
          ! grep -Eqi 'interactive academic visual|<svg' "$lesson"
      - name: Upload rollback and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-hub-course1-backup-${{ github.run_id }}
          path: /tmp/dtf-learning-hub-course1
          if-no-files-found: warn
          retention-days: 30
