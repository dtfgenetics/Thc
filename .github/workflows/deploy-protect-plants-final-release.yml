name: Deploy Protect the Plants Final Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/protect-plants-final-release-trigger.txt

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: deploy-protect-plants-final-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - name: Checkout current release source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate current Protect the Plants V2 source and deploy bridge
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          root=site/public-route-patch/games/protect-the-plants
          for asset in \
            index.html app.js api.php styles.css visual-fixes.css plant.svg \
            enhancements.js enhancements.css v2-extras.js v2-extras.css \
            manifest.webmanifest sw.js; do
            test -s "$root/$asset"
          done
          node --check "$root/app.js"
          node --check "$root/enhancements.js"
          node --check "$root/v2-extras.js"
          node --check "$root/sw.js"
          php -l "$root/api.php"
          jq -e '.name == "Protect the Plants" and .display == "standalone" and .start_url == "./" and .scope == "./"' "$root/manifest.webmanifest" >/dev/null
          grep -Fq './enhancements.js' "$root/index.html"
          grep -Fq './v2-extras.js' "$root/index.html"
          grep -Fq './manifest.webmanifest' "$root/index.html"
          grep -Fq 'rematch' "$root/api.php"
          grep -Fq 'events' "$root/api.php"
          grep -Fq 'serviceWorker' "$root/v2-extras.js"

          python -m py_compile scripts/package-public-suite-wordpress.py scripts/assemble-wordpress-suite-v2.py
          node --check scripts/cleanup-stale-wordpress-suite-snippets.mjs
          python scripts/assemble-wordpress-suite-v2.py "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          node --check "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          python - <<'PY'
          import os, pathlib, re
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'deploy-public-suite-v2.mjs').read_text()
          m=re.search(r"const snippetCode = String\.raw`(.*?)`\.trim\(\);", text, re.S)
          assert m, 'embedded PHP missing'
          php=m.group(1).replace('${tokenLiteral}', "'0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'")
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'dtf-suite-v2.php').write_text('<?php\n'+php+'\n')
          PY
          php -l "$RUNNER_TEMP/dtf-suite-v2.php"

      - name: Build fresh validated Public Suite artifact from main
        id: current_build
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run build-dtfseeds-public-suite.yml --ref main)"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Could not parse public-suite build run from: $run_url" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Fresh Public Suite build: $run_url"
          gh run watch "$run_id" --exit-status

      - name: Download fresh validated Public Suite artifact
        id: suite
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/suite-download"
          mkdir -p "$RUNNER_TEMP/suite-download"
          gh run download "${{ steps.current_build.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/suite-download"
          build_json="$(find "$RUNNER_TEMP/suite-download" -type f -name dtf-build.json -print -quit)"
          [[ -n "$build_json" ]] || { echo 'Fresh artifact does not contain dtf-build.json.' >&2; exit 1; }
          suite_root="$(dirname "$build_json")"
          for file in \
            games/protect-the-plants/index.html \
            games/protect-the-plants/app.js \
            games/protect-the-plants/api.php \
            games/protect-the-plants/styles.css \
            games/protect-the-plants/visual-fixes.css \
            games/protect-the-plants/plant.svg \
            games/protect-the-plants/enhancements.js \
            games/protect-the-plants/enhancements.css \
            games/protect-the-plants/v2-extras.js \
            games/protect-the-plants/v2-extras.css \
            games/protect-the-plants/manifest.webmanifest \
            games/protect-the-plants/sw.js \
            games/index.html tools/index.html projects/index.html \
            growlens/index.html thc-grow-doc/index.html; do
            test -s "$suite_root/$file"
          done
          grep -Fq './visual-fixes.css' "$suite_root/games/protect-the-plants/index.html"
          grep -Fq './enhancements.css' "$suite_root/games/protect-the-plants/index.html"
          grep -Fq './v2-extras.css' "$suite_root/games/protect-the-plants/index.html"
          grep -Fq './manifest.webmanifest' "$suite_root/games/protect-the-plants/index.html"
          grep -Fq './enhancements.js' "$suite_root/games/protect-the-plants/index.html"
          grep -Fq './v2-extras.js' "$suite_root/games/protect-the-plants/index.html"
          grep -Fq 'rematch' "$suite_root/games/protect-the-plants/api.php"
          grep -Fq 'events' "$suite_root/games/protect-the-plants/api.php"
          grep -Fq 'serviceWorker' "$suite_root/games/protect-the-plants/v2-extras.js"
          echo "root=$suite_root" >> "$GITHUB_OUTPUT"

      - name: Package current app-only WordPress archive
        id: package
        shell: bash
        env:
          SUITE_ROOT: ${{ steps.suite.outputs.root }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dtf-public-suite-wordpress-v2.zip"
          python scripts/package-public-suite-wordpress.py "$SUITE_ROOT" "$archive" | tee "$RUNNER_TEMP/package-summary.json"
          test -s "$archive"
          python - <<'PY'
          import json, os, zipfile
          zpath=os.path.join(os.environ['RUNNER_TEMP'],'dtf-public-suite-wordpress-v2.zip')
          with zipfile.ZipFile(zpath) as z:
              names=z.namelist()
              assert len(names)==len(set(names)), 'duplicate ZIP entries'
              assert names.count('.dtf-suite-manifest.json')==1
              required={
                  'games/protect-the-plants/index.html',
                  'games/protect-the-plants/app.js',
                  'games/protect-the-plants/api.php',
                  'games/protect-the-plants/styles.css',
                  'games/protect-the-plants/visual-fixes.css',
                  'games/protect-the-plants/plant.svg',
                  'games/protect-the-plants/enhancements.js',
                  'games/protect-the-plants/enhancements.css',
                  'games/protect-the-plants/v2-extras.js',
                  'games/protect-the-plants/v2-extras.css',
                  'games/protect-the-plants/manifest.webmanifest',
                  'games/protect-the-plants/sw.js',
              }
              missing=required-set(names)
              assert not missing, f'missing current Protect the Plants V2 assets: {sorted(missing)}'
              assert not [n for n in names if n=='index.html' or n.startswith('learn/') or n.startswith('blog/')]
              manifest=json.loads(z.read('.dtf-suite-manifest.json'))
              assert manifest['purpose']=='dtfseeds-public-apps-only'
              assert 'games/protect-the-plants' in manifest['targets']
              assert {'/','/learn/','/blog/'}.issubset(set(manifest['wordPressOwnedRoutesExcluded']))
          PY
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Recover stale Public Suite transaction and neutralize temporary bridges
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cleanup-stale-wordpress-suite-snippets.mjs | tee "$RUNNER_TEMP/stale-suite-bridge-cleanup.json"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/stale-suite-bridge-cleanup.json"

      - name: Publish current release through transactional WordPress bridge
        id: publish
        shell: bash
        env:
          DTF_SUITE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/deploy-public-suite-v2.mjs" "$DTF_SUITE_ARCHIVE" | tee "$RUNNER_TEMP/deploy-result.log"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/deploy-result.log"

      - name: Verify complete DTFSeeds feature surface
        id: feature_verify
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run verify-dtfseeds-feature-surface.yml --ref main)"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "Feature verification: $run_url"
          gh run watch "$run_id" --exit-status

      - name: Verify canonical WordPress route ownership
        id: canonical_verify
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run verify-dtfseeds-production-cutover.yml --ref main)"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "Canonical verification: $run_url"
          gh run watch "$run_id" --exit-status

      - name: Verify Protect the Plants live production gameplay and visuals
        id: ptp_verify
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run verify-protect-the-plants-production.yml --ref main)"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "Protect the Plants verification: $run_url"
          gh run watch "$run_id" --exit-status

      - name: Report current Protect the Plants V2 release
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          BUILD_RUN: ${{ steps.current_build.outputs.run_id }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          FEATURE_OUTCOME: ${{ steps.feature_verify.outcome }}
          CANONICAL_OUTCOME: ${{ steps.canonical_verify.outcome }}
          PTP_OUTCOME: ${{ steps.ptp_verify.outcome }}
        with:
          script: |
            const buildRun = process.env.BUILD_RUN
              ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.BUILD_RUN}`
              : 'not reached';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Protect the Plants V2 current-main release',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Release source: \`main\` at \`${context.sha}\``,
                `Fresh validated Public Suite build: ${buildRun}`,
                `Overall: **${process.env.STATUS || 'see run'}**`,
                `Stale bridge cleanup: **${process.env.CLEANUP_OUTCOME || 'not reached'}**`,
                `Transactional publication: **${process.env.PUBLISH_OUTCOME || 'not reached'}**`,
                `Feature surface verification: **${process.env.FEATURE_OUTCOME || 'not reached'}**`,
                `Canonical route verification: **${process.env.CANONICAL_OUTCOME || 'not reached'}**`,
                `Protect the Plants production verification: **${process.env.PTP_OUTCOME || 'not reached'}**`,
                '',
                'This release builds from current main, requires all Protect-the-Plants V2 assets before packaging, preserves WordPress ownership of /, /learn/, and /blog/, and publishes only through the rollback-capable WordPress bridge.'
              ].join('\n')
            });
