name: Apply DTFSeeds Genetics Product Visual V5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/polish-wordpress-product-pages-v5.mjs'
      - '.github/workflows/wordpress-product-visual-v5.yml'
  workflow_run:
    workflows: ['Finalize DTFSeeds Genetics V4']
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-product-visual-v5
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com

jobs:
  product-visual:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-product-visual-v5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate product visual package
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/polish-wordpress-product-pages-v5.mjs
      - name: Apply product-page visual hierarchy
        id: apply
        env:
          APPLY_PRODUCT_VISUAL_V5: 'true'
        run: |
          set -euo pipefail
          node scripts/polish-wordpress-product-pages-v5.mjs
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Verify all three live genetics listings
        id: verify
        run: |
          set -euo pipefail
          verify(){
            route="$1"; marker="$2"; body="$RUNNER_TEMP/$(echo "$route"|tr '/' '_').html"; ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "$WP_SITE_URL$route?dtf_product_v5=${GITHUB_RUN_ID}-${attempt}" -o "$body"
              if grep -Fqi 'dtf-product-visual-v5' "$body" && grep -Fqi "$marker" "$body"; then ok=1; break; fi
              sleep 6
            done
            [[ "$ok" -eq 1 ]] || { echo "Product V5 not visible on $route" >&2; exit 1; }
          }
          verify '/product/10-regular-f2-blue-mango-seeds/' '10 Regular F2 Blue Mango Seeds'
          verify '/product/10-feminized-f2-blue-mango-x/' 'Blue Mango'
          verify '/product/10-reg-f1-blueberry-bubblegum/' 'Blue Bubblegum'
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Upload product visual backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-product-visual-v5-${{ github.run_id }}
          path: /tmp/dtf-product-visual-v5
          if-no-files-found: warn
          retention-days: 30
      - name: Report product visual deployment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          APPLY: ${{ steps.apply.outputs.outcome }}
          VERIFY: ${{ steps.verify.outputs.outcome }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body:[
              '## Genetics product-page visual V5','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `Presentation write: **${process.env.APPLY || 'not-completed'}**`,
              `Live verification: **${process.env.VERIFY || 'not-completed'}**`,
              '',
              'Scope is presentation-only for the three current genetics listings. It adds release badges, lineage emphasis, stronger image/summary layout, purchase hierarchy, tabs, and responsive behavior without changing price, stock, descriptions, product identity, or checkout data.'
            ].join('\n')});
