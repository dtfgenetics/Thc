name: DTFSeeds Resource Production Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'games/high-iq/**'
      - 'site/public-route-patch/games/high-iq/**'
      - 'site/deployment/public-apps.json'
      - 'site/deployment/release-resources.json'
      - 'scripts/plan-dtfseeds-resource-release.mjs'
      - 'scripts/package-dtf-public-resource.py'
      - 'scripts/verify-dtf-public-resource-artifact.py'
      - 'scripts/assemble-wordpress-resource-v2.py'
      - 'scripts/public_suite_resource_ownership.py'
      - 'scripts/assemble-wordpress-suite-resource-aware.py'
      - 'scripts/package-public-suite-wordpress-resource-aware.py'
      - 'scripts/test-public-suite-resource-ownership.py'
      - 'scripts/test-dtf-resource-release-system.mjs'
      - '.github/workflows/build-dtfseeds-public-resource.yml'
      - '.github/workflows/deploy-dtfseeds-public-resource.yml'
      - '.github/workflows/deploy-dtfseeds-wordpress-resource.yml'
      - '.github/workflows/dtfseeds-resource-production-gateway.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: dtfseeds-resource-production-gateway
  cancel-in-progress: false

jobs:
  plan:
    name: Plan independent resource release
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and plan gateway-managed resource owners
        id: plan
        shell: bash
        env:
          PUSH_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          node --check scripts/plan-dtfseeds-resource-release.mjs
          node scripts/test-dtf-resource-release-system.mjs
          node scripts/plan-dtfseeds-resource-release.mjs \
            --base="$PUSH_BASE" \
            --head="$GITHUB_SHA" \
            --resource=auto \
            --gateway-managed-only=true

      - name: Record independent resource plan
        env:
          RELEASE_PLAN: ${{ steps.plan.outputs.plan }}
        shell: bash
        run: |
          {
            echo '## Independent resource production plan'
            echo
            echo "- Source: $GITHUB_SHA"
            echo "- Deploy required: ${{ steps.plan.outputs.deploy }}"
            echo '- Automatic publication planning includes only routes whose registry ownership is `resource` and whose publisher orchestration is `gateway-managed`.'
            echo '- Isolated resource builds may still validate pilot resources that remain suite-owned.'
            echo
            echo '```json'
            printf '%s\n' "$RELEASE_PLAN"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build publish and verify independent resources
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      RESOURCE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Detect superseded queued resource release
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          latest="$(git rev-parse origin/main)"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping superseded resource gateway source $GITHUB_SHA; latest main is $latest. The newer push owns cumulative resource planning."
          fi

      - name: Join exact-source independent resource build
        id: build
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-workflow-and-wait.sh build-dtfseeds-public-resource.yml --join-only

      - name: Publish each gateway-managed resource through its owning workflow
        id: publish
        if: steps.freshness.outputs.current == 'true' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rows < <(jq -r '.resources[] | [.id,.publisherWorkflow] | @tsv' <<<"$RESOURCE_PLAN")
          test "${#rows[@]}" -gt 0
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r resource workflow <<<"$row"
            [[ -n "$resource" && -n "$workflow" && "$workflow" != 'null' ]]
            echo "Publishing $resource through $workflow at exact source $GITHUB_SHA"
            bash scripts/run-workflow-and-wait.sh "$workflow" \
              -f "resource=$resource" \
              -f "source_sha=$GITHUB_SHA" \
              -f 'environment=production'
          done

      - name: Independently verify every resource-owned route
        id: verify
        if: steps.freshness.outputs.current == 'true' && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r resource route marker; do
            [[ -n "$resource" && -n "$route" && -n "$marker" ]]
            echo "Checking resource-owned route $resource at $route"
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl -4 -fsS --retry 6 --retry-all-errors --retry-delay 4 \
              --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "https://dtfseeds.com${route}?dtf_resource_gateway=${GITHUB_RUN_ID}")"
            [[ "$status" == '200' ]] || { echo "Expected HTTP 200 for $route, got $status" >&2; cat "$headers" >&2; exit 1; }
            ! grep -Eiq '^location:' "$headers" || { echo "Refusing redirected resource route: $route" >&2; cat "$headers" >&2; exit 1; }
            grep -Fqi "$marker" "$body" || { echo "Expected marker '$marker' not found at $route" >&2; exit 1; }
            rm -f "$body" "$headers"
          done < <(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(process.env.RESOURCE_PLAN);
          const config = JSON.parse(fs.readFileSync('site/deployment/release-resources.json', 'utf8'));
          for (const selected of plan.resources) {
            const resource = config.resources[selected.id];
            if (!resource) throw new Error(`Missing resource config: ${selected.id}`);
            if (resource.publicSuiteOwnership !== 'resource') throw new Error(`Refusing non-resource-owned automatic publish: ${selected.id}`);
            if (resource.publisher?.orchestration !== 'gateway-managed') throw new Error(`Refusing non-gateway-managed automatic publish: ${selected.id}`);
            console.log([selected.id, resource.route, resource.verifyMarker].join('\t'));
          }
          NODE
          )

      - name: Record authoritative independent resource result
        if: always()
        shell: bash
        run: |
          {
            echo '## Independent resource production gateway'
            echo
            echo "- Source: $GITHUB_SHA"
            echo "- Superseded: ${{ steps.freshness.outputs.current != 'true' }}"
            echo "- Exact-source build: ${{ steps.build.outcome }}"
            echo "- Publisher outcome: ${{ steps.publish.outcome }}"
            echo "- Independent visitor verification: ${{ steps.verify.outcome }}"
            echo '- Each successful publisher advances only its own monotonic resource checkpoint; the global DTFSeeds checkpoint is untouched.'
            echo '- High IQ is currently the only automatic resource-owned route. High Land remains suite-owned while its independent SSH publisher stays in pilot validation.'
          } >> "$GITHUB_STEP_SUMMARY"

  no_deploy:
    name: No gateway-managed resource changes
    needs: plan
    if: needs.plan.outputs.deploy != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'No gateway-managed resource-owned paths changed; no independent resource publication was required.'
