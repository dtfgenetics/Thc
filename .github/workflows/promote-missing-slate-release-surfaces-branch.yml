name: Validate missing-slate release branch

on:
  push:
    branches:
      - release/reconcile-local-games
    paths:
      - .github/workflows/promote-missing-slate-release-surfaces-branch.yml
      - data/public-navigation.json
      - scripts/assemble-wordpress-suite-v2.py
      - scripts/expand-wordpress-suite-registered-games.py
      - scripts/reconcile-local-game-release-registry.mjs
      - site/public-route-patch/games/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/reconcile-local-games
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate registered game release state without mutating Git history
        shell: bash
        run: |
          set -euo pipefail
          npm run games:release-check
          python scripts/assemble-wordpress-suite-v2.py "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          node --check "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          grep -Fq '25 playable browser games' site/public-route-patch/games/index.html
          grep -Fq 'games/high-lines' "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          grep -Fq 'games/pheno-draft' "$RUNNER_TEMP/deploy-public-suite-v2.mjs"

      - name: Confirm validation did not generate tracked changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain --untracked-files=no)"
