name: Qualify THC RPG DTFSeeds Package

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - site/public-route-patch/assets/release-source-revisions/thc-rpg.txt
      - site/deployment/public-apps.json
      - scripts/validate-thc-rpg-release-source.mjs
      - .github/workflows/qualify-thc-rpg-dtfseeds-package.yml
  push:
    branches: [main]
    paths:
      - site/public-route-patch/assets/release-source-revisions/thc-rpg.txt
      - site/deployment/public-apps.json
      - scripts/validate-thc-rpg-release-source.mjs
      - .github/workflows/qualify-thc-rpg-dtfseeds-package.yml

permissions:
  contents: read

concurrency:
  group: thc-rpg-dtfseeds-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Build pinned THC RPG route artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout DTFSeeds integration source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate central source contract
        run: node scripts/validate-thc-rpg-release-source.mjs

      - name: Resolve pinned source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          revision_file="$GITHUB_WORKSPACE/site/public-route-patch/assets/release-source-revisions/thc-rpg.txt"
          repo_name="$(sed -n 's/^repository=//p' "$revision_file")"
          revision="$(sed -n 's/^commit=//p' "$revision_file")"
          version="$(sed -n 's/^version=//p' "$revision_file")"
          route="$(sed -n 's/^route=//p' "$revision_file")"
          artifact="$(sed -n 's/^artifact=//p' "$revision_file")"
          test "$repo_name" = "dtfgenetics/Thc-rpg"
          test "$revision" = "15fe22d69afaee906714a1ad0933505e437202dd"
          test "$version" = "2.0.0"
          test "$route" = "/games/thc-rpg/"
          test "$artifact" = "thc-rpg-production-build"
          echo "repository=$repo_name" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Fetch exact canonical revision
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/thc-rpg"
          git init "$repo"
          cd "$repo"
          git remote add origin "https://github.com/${{ steps.source.outputs.repository }}.git"
          git fetch --depth=1 origin "${{ steps.source.outputs.revision }}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.revision }}"

      - name: Install canonical dependencies
        working-directory: ${{ runner.temp }}/thc-rpg
        run: npm install --ignore-scripts

      - name: Run canonical engine and progression tests
        working-directory: ${{ runner.temp }}/thc-rpg
        run: npm test

      - name: Build visitor-only production artifact
        working-directory: ${{ runner.temp }}/thc-rpg
        run: |
          set -euo pipefail
          npm run build
          npm run validate:release
          test -s dist/index.html
          test -s dist/game-release.json
          test -s dist/src/main.js
          test -s dist/src/game/GrowJournal.js
          test -s dist/src/game/KeeperCuttings.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)].map((match) => match[1]);
          const bad = refs.filter((ref) => ref.startsWith('/') && !ref.startsWith('//'));
          if (bad.length) throw new Error(`Root-absolute runtime references break subroute packaging: ${bad.join(', ')}`);
          NODE

      - name: Assemble DTFSeeds route artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/games/thc-rpg
          cp -a "$RUNNER_TEMP/thc-rpg/dist/." package/games/thc-rpg/
          cp site/public-route-patch/assets/release-source-revisions/thc-rpg.txt package/games/thc-rpg/source-revision.txt
          cat > package/games/thc-rpg/dtf-source.json <<JSON
          {
            "repository": "${{ steps.source.outputs.repository }}",
            "commit": "${{ steps.source.outputs.revision }}",
            "version": "${{ steps.source.outputs.version }}",
            "route": "/games/thc-rpg/",
            "artifact": "${{ steps.source.outputs.artifact }}",
            "integrationCommit": "$GITHUB_SHA"
          }
          JSON

      - name: Verify packaged route contract
        shell: bash
        run: |
          set -euo pipefail
          test -s package/games/thc-rpg/index.html
          test -s package/games/thc-rpg/game-release.json
          test -s package/games/thc-rpg/source-revision.txt
          test -s package/games/thc-rpg/dtf-source.json
          test -s package/games/thc-rpg/src/main.js
          test -s package/games/thc-rpg/src/grow-journal-ui.js
          test -s package/games/thc-rpg/src/game/GrowJournal.js
          test -s package/games/thc-rpg/src/game/KeeperCuttings.js
          grep -Fq 'route=/games/thc-rpg/' package/games/thc-rpg/source-revision.txt
          grep -Fq 'commit=${{ steps.source.outputs.revision }}' package/games/thc-rpg/source-revision.txt
          grep -Fq '"route": "/games/thc-rpg/"' package/games/thc-rpg/game-release.json
          grep -Fq '"runtime": "static-es-modules"' package/games/thc-rpg/game-release.json
          grep -Fq '"status": "release-candidate"' package/games/thc-rpg/game-release.json
          grep -Fq '"saveVersion": 6' package/games/thc-rpg/game-release.json
          ! find package/games/thc-rpg -type f \( -path '*/tests/*' -o -path '*/e2e/*' \) -print | grep -q .

      - name: Upload deployable THC RPG route
        uses: actions/upload-artifact@v4
        with:
          name: thc-rpg-dtfseeds-route-${{ steps.source.outputs.revision }}
          path: package/games/thc-rpg
          if-no-files-found: error
          retention-days: 14

      - name: Qualification summary
        shell: bash
        run: |
          {
            echo '## THC RPG DTFSeeds package qualification'
            echo
            echo '- Route: `/games/thc-rpg/`'
            echo '- Canonical repo: `${{ steps.source.outputs.repository }}`'
            echo '- Canonical revision: `${{ steps.source.outputs.revision }}`'
            echo '- Version: `${{ steps.source.outputs.version }}`'
            echo '- Canonical tests: passed'
            echo '- Visitor-only release validation: passed'
            echo '- Deployable route artifact: uploaded'
            echo '- Public promotion: still blocked until production publish + exact live-route verification'
          } >> "$GITHUB_STEP_SUMMARY"
