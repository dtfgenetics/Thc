name: Publish THC Infographics On Command

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - 'site/wordpress/imports/infographic-bulk-import.json'
      - 'scripts/import-wordpress-infographic-remote-batch.mjs'
      - '.github/workflows/wordpress-infographic-command.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: dtfseeds-wordpress-infographic-command
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.issue.number == 46 &&
       github.event.comment.body == '/publish-infographics' &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      INFOGRAPHIC_SOURCE_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
      INFOGRAPHIC_DIR: ${{ github.workspace }}/.tmp/eligible-infographics
      INFOGRAPHIC_PLACEMENT_CONFIG: ${{ github.workspace }}/site/wordpress/assets/infographics/placement-rules.json
      INFOGRAPHIC_EXCLUSIONS: ${{ github.workspace }}/site/wordpress/assets/infographics/infographic-exclusions.json
      BULK_INFOGRAPHIC_MANIFEST: ${{ github.workspace }}/site/wordpress/imports/infographic-bulk-import.json
      BULK_IMPORT_REPORT: ${{ runner.temp }}/infographic-bulk-import-report.json
      BACKUP_ROOT: ${{ runner.temp }}/wordpress-infographic-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate bulk intake and publication package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/import-wordpress-infographic-remote-batch.mjs
          node --check scripts/stage-eligible-infographics.mjs
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          node -e "const m=require('./site/wordpress/imports/infographic-bulk-import.json'); if(m.schemaVersion!==1||!Array.isArray(m.assets)) process.exit(1)"
          test -d "$INFOGRAPHIC_SOURCE_DIR"
          test -f "$INFOGRAPHIC_PLACEMENT_CONFIG"
          test -f "$INFOGRAPHIC_EXCLUSIONS"

      - name: Download and validate queued bulk images
        id: intake
        shell: bash
        run: |
          set -euo pipefail
          node scripts/import-wordpress-infographic-remote-batch.mjs
          echo "requested=$(node -p "require(process.argv[1]).requestedAssets" "$BULK_IMPORT_REPORT")" >> "$GITHUB_OUTPUT"
          echo "created=$(node -p "require(process.argv[1]).created" "$BULK_IMPORT_REPORT")" >> "$GITHUB_OUTPUT"
          echo "updated=$(node -p "require(process.argv[1]).updated" "$BULK_IMPORT_REPORT")" >> "$GITHUB_OUTPUT"
          echo "reused=$(node -p "require(process.argv[1]).reused" "$BULK_IMPORT_REPORT")" >> "$GITHUB_OUTPUT"

      - name: Persist downloaded image binaries in canonical source
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DTF Bulk Image Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add site/wordpress/assets/infographics
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Canonical image source already current.'
          else
            git commit -m 'Import queued THC infographic assets'
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage only publication-eligible images
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-eligible-infographics.mjs
          report="$BACKUP_ROOT/infographic-quality-gate.json"
          echo "source_count=$(node -p "require(process.argv[1]).sourceImageCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "eligible_count=$(node -p "require(process.argv[1]).eligibleImageCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "excluded_count=$(node -p "require(process.argv[1]).excludedImageCount" "$report")" >> "$GITHUB_OUTPUT"

      - name: Normalize eligible WebP images for WordPress
        shell: bash
        run: |
          set -euo pipefail
          converted=0
          while IFS= read -r -d '' file; do
            output="${file%.*}.png"
            ffmpeg -hide_banner -loglevel error -y -i "$file" -frames:v 1 "$output"
            test -s "$output"
            rm "$file"
            converted=$((converted + 1))
          done < <(find "$INFOGRAPHIC_DIR" -type f -iname '*.webp' -print0)
          echo "Normalized ${converted} WebP asset(s)."

      - name: Require WordPress credentials
        id: access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${WP_API_USERNAME:-}" ]]
          [[ -n "${WP_API_PASSWORD:-}" ]]
          echo 'available=true' >> "$GITHUB_OUTPUT"

      - name: Upload eligible media and publish library
        id: media
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy-wordpress-infographic-library-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-infographic-backup-path.txt")"
          result="$backup_dir/deployment-result.json"
          echo "source_count=$(node -p "require(process.argv[1]).sourceImageCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "uploaded_count=$(node -p "require(process.argv[1]).uploadedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "reused_count=$(node -p "require(process.argv[1]).reusedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "page_id=$(node -p "require(process.argv[1]).pageId" "$result")" >> "$GITHUB_OUTPUT"

      - name: Verify live infographic library
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/infographic-library.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "https://dtfseeds.com/learn/infographics/?dtf_infographic_command=${GITHUB_RUN_ID}-${attempt}" \
              --output "$page"
            if grep -Fqi 'THC Infographic Library' "$page" && grep -Eqi '<img[^>]+wp-content/uploads/' "$page"; then
              ok=1
              break
            fi
            sleep 8
          done
          [[ "$ok" -eq 1 ]]
          image_count="$(grep -Eoi '<img[^>]+wp-content/uploads/' "$page" | wc -l | tr -d ' ')"
          test "$image_count" -ge 10
          echo "live_image_count=$image_count" >> "$GITHUB_OUTPUT"

      - name: Upload rollback and audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-infographic-command-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wordpress-infographic-backups
            ${{ runner.temp }}/infographic-bulk-import-report.json
            ${{ runner.temp }}/infographic-library.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report command result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          QUEUED_COUNT: ${{ steps.intake.outputs.requested }}
          CREATED_COUNT: ${{ steps.intake.outputs.created }}
          UPDATED_COUNT: ${{ steps.intake.outputs.updated }}
          INTAKE_REUSED_COUNT: ${{ steps.intake.outputs.reused }}
          CANONICAL_COMMIT: ${{ steps.canonical.outputs.commit }}
          ELIGIBLE_COUNT: ${{ steps.quality.outputs.eligible_count }}
          EXCLUDED_COUNT: ${{ steps.quality.outputs.excluded_count }}
          SOURCE_COUNT: ${{ steps.media.outputs.source_count }}
          UPLOADED_COUNT: ${{ steps.media.outputs.uploaded_count }}
          REUSED_COUNT: ${{ steps.media.outputs.reused_count }}
          PAGE_ID: ${{ steps.media.outputs.page_id }}
          LIVE_IMAGE_COUNT: ${{ steps.verify.outputs.live_image_count }}
        with:
          script: |
            const body = [
              '## THC bulk infographic publication',
              '',
              `Status: **${process.env.JOB_STATUS}**`,
              `Batch URLs queued: **${process.env.QUEUED_COUNT || '0'}**`,
              `New canonical image files: **${process.env.CREATED_COUNT || '0'}**`,
              `Intentional canonical replacements: **${process.env.UPDATED_COUNT || '0'}**`,
              `Canonical files already current: **${process.env.INTAKE_REUSED_COUNT || '0'}**`,
              `Canonical image commit: ${process.env.CANONICAL_COMMIT ? `\`${process.env.CANONICAL_COMMIT}\`` : 'none required'}`,
              `Publication-eligible images: **${process.env.ELIGIBLE_COUNT || 'not-run'}**`,
              `Excluded/review images: **${process.env.EXCLUDED_COUNT || 'not-run'}**`,
              `WordPress media processed: **${process.env.SOURCE_COUNT || 'not-run'}**`,
              `New WordPress media uploads: **${process.env.UPLOADED_COUNT || 'not-run'}**`,
              `Existing WordPress media reused: **${process.env.REUSED_COUNT || 'not-run'}**`,
              `Infographic page ID: **${process.env.PAGE_ID || 'not-run'}**`,
              `Images observed on live page: **${process.env.LIVE_IMAGE_COUNT || 'not-run'}**`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Live target: https://dtfseeds.com/learn/infographics/',
              'Repository, WordPress write, and visitor-facing verification are reported separately in this one run.'
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 46, body });
