name: Diagnose WordPress Plugin REST Access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/diagnose-wordpress-plugin-rest.mjs
      - .github/workflows/wordpress-plugin-rest-diagnostic.yml

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect native plugin REST access
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/diagnose-wordpress-plugin-rest.mjs
          node scripts/diagnose-wordpress-plugin-rest.mjs | tee "$RUNNER_TEMP/plugin-rest.json"
      - name: Report diagnostic
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let report={};
            const p=process.env.RUNNER_TEMP+'/plugin-rest.json';
            if(fs.existsSync(p)){
              try{report=JSON.parse(fs.readFileSync(p,'utf8').trim().split(/\r?\n/).pop())}catch{}
            }
            await github.rest.issues.createComment({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:46,
              body:[
                '## WordPress plugin REST diagnostic',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `REST index: **${report.rootStatus ?? 'unknown'}**`,
                `Core plugin route advertised: **${report.pluginRouteAdvertised ?? 'unknown'}**`,
                `Core plugin list accessible: **${report.pluginListAccessible ?? 'unknown'}** (HTTP ${report.pluginListStatus ?? 'unknown'})`,
                `Code Snippets REST route advertised: **${report.snippetsRouteAdvertised ?? 'unknown'}**`,
                `Code Snippets installed: **${report.codeSnippetsInstalled ?? 'unknown'}**`,
                `Code Snippets status: **${report.codeSnippetsStatus ?? 'not-installed'}**`,
                '',
                'Read-only diagnostic; no plugin or filesystem mutation is performed.'
              ].join('\n')
            });

