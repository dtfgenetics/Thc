name: Enforce Responsive THC Education Images

# RETIRED MUTATION LANE
# The former job optimized dtf-edu-* images after other Learning writers and then
# required 20+ legacy infographic images on the public library. Those media are
# now quarantined. Replacement responsive QA belongs to explicitly approved
# dtf-approved-visual-* assets, not to this historical WordPress transformer.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/optimize-wordpress-infographic-page-images.mjs
      - scripts/verify-responsive-infographic-html.py
      - .github/workflows/wordpress-responsive-education-images.yml
  push:
    branches: [main]
    paths:
      - scripts/optimize-wordpress-infographic-page-images.mjs
      - scripts/verify-responsive-infographic-html.py
      - .github/workflows/wordpress-responsive-education-images.yml

permissions:
  contents: read

concurrency:
  group: dtfseeds-responsive-education-images-retired
  cancel-in-progress: true

jobs:
  guard:
    name: Legacy responsive infographic writer disabled
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate current replacement policy
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/optimize-wordpress-infographic-page-images.mjs
          python3 -m py_compile scripts/verify-responsive-infographic-html.py
          node - <<'NODE'
          const policy=require('./site/wordpress/visual-quality-policy.json');
          if(Number(policy.schemaVersion)<3 || policy.mode!=='quarantine') throw new Error('Visual quality quarantine policy v3+ is required.');
          if(policy.replacementPolicy?.legacyInfographicReuseAllowed!==false) throw new Error('Legacy infographic reuse must remain disabled.');
          if(policy.replacementPolicy?.requiresResponsiveReview!==true) throw new Error('Responsive review must remain mandatory for replacements.');
          if(policy.replacementPolicy?.requiresRoleSpecificApproval!==true) throw new Error('Role-specific approval must remain mandatory for replacements.');
          console.log('Legacy responsive infographic mutation is disabled; replacement responsive review remains required.');
          NODE

      - name: Confirm approved visual library state when public verification is available
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/approved-library.html"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --connect-timeout 20 --max-time 45 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
              "https://dtfseeds.com/learn/infographics/?dtf_responsive_retired=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$body"; then
              if grep -Fq 'data-dtf-approved-visual-library="v1"' "$body" || grep -Fq 'data-dtf-layout="learn-v3"' "$body"; then ok=1; break; fi
            fi
            [[ "$attempt" -lt 6 ]] && sleep $((attempt * 3))
          done
          [[ "$ok" -eq 1 ]] || { echo 'Current approved Learning visual ownership was not observed; no legacy fallback will be applied.' >&2; exit 1; }
          ! grep -Fqi 'dtf-edu-' "$body" || { echo 'Retired dtf-edu visual identity is visitor-facing.' >&2; exit 1; }
          echo 'No legacy responsive-image mutation performed.'
