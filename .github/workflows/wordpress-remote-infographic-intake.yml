name: Ingest Reviewed Remote Infographics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/wordpress/assets/infographics/remote-intake.json
      - .github/workflows/wordpress-remote-infographic-intake.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

# This lane owns reviewed remote -> canonical repository ingestion only.
# Generated files are reapplied onto current main through the moving-main safe
# integrator, which then explicitly wakes cumulative production.
concurrency:
  group: dtfseeds-infographic-source-intake
  cancel-in-progress: false

jobs:
  ingest:
    name: Validate and safely integrate reviewed source assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate intake manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          path = pathlib.Path('site/wordpress/assets/infographics/remote-intake.json')
          data = json.loads(path.read_text())
          assert data.get('schemaVersion') == 1
          entries = data.get('entries')
          assert isinstance(entries, list)
          seen = set()
          enabled = 0
          for row in entries:
              if not row.get('enabled', True):
                  continue
              enabled += 1
              fn = row.get('filename', '')
              url = row.get('url', '')
              assert re.fullmatch(r'[A-Za-z0-9._-]+\.(?:png|jpe?g)', fn, re.I), f'Invalid filename: {fn}'
              assert url.startswith('https://'), f'Only HTTPS URLs are allowed: {url}'
              assert fn.lower() not in seen, f'Duplicate filename: {fn}'
              seen.add(fn.lower())
          print(f'Validated {enabled} enabled reviewed remote asset(s).')
          PY

      - name: Download reviewed source assets
        id: download
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          manifest = pathlib.Path('site/wordpress/assets/infographics/remote-intake.json')
          data = json.loads(manifest.read_text())
          out = pathlib.Path('site/wordpress/assets/infographics')
          out.mkdir(parents=True, exist_ok=True)
          downloaded = []
          for row in data.get('entries', []):
              if not row.get('enabled', True):
                  continue
              filename = row['filename']
              dest = out / filename
              print(f'Fetching reviewed source: {filename}')
              subprocess.run([
                  'curl','-4','--location','--fail','--silent','--show-error',
                  '--retry','4','--retry-delay','2',row['url'],'-o',str(dest)
              ], check=True)
              if dest.stat().st_size < 10000:
                  raise SystemExit(f'Asset too small or invalid: {filename}')
              downloaded.append(filename)
          pathlib.Path('/tmp/dtf-remote-intake-files.txt').write_text('\n'.join(downloaded) + ('\n' if downloaded else ''))
          print(f'Downloaded {len(downloaded)} reviewed source asset(s).')
          PY
          echo "count=$(grep -c . /tmp/dtf-remote-intake-files.txt 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Validate downloaded image formats
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s /tmp/dtf-remote-intake-files.txt ]]; then
            while read -r file; do
              path="site/wordpress/assets/infographics/$file"
              test -s "$path"
              case "${file,,}" in
                *.jpg|*.jpeg) file "$path" | grep -qi 'JPEG image data' ;;
                *.png) file "$path" | grep -qi 'PNG image data' ;;
                *) echo "Unsupported extension: $file" >&2; exit 1 ;;
              esac
            done < /tmp/dtf-remote-intake-files.txt
          fi

      - name: Safely integrate canonical source assets
        id: integrate
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          if [[ -s /tmp/dtf-remote-intake-files.txt ]]; then
            while read -r file; do
              paths+=("site/wordpress/assets/infographics/$file")
            done < /tmp/dtf-remote-intake-files.txt
          fi

          if [[ "${#paths[@]}" -eq 0 ]]; then
            echo 'No enabled reviewed remote assets to integrate.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=()
          for path in "${paths[@]}"; do
            if ! git diff --quiet -- "$path" || ! git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              changed+=("$path")
            fi
          done

          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo 'Reviewed remote assets already match canonical repository bytes.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Remote infographic intake generated paths:\n'
          printf ' - %s\n' "${changed[@]}"
          node scripts/studio/integrate-generated-change.mjs \
            --message='Ingest reviewed education infographic assets' \
            "${changed[@]}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Upload intake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-infographic-intake-${{ github.run_id }}
          path: /tmp/dtf-remote-intake-files.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Write intake summary
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
          COUNT: ${{ steps.download.outputs.count }}
          CHANGED: ${{ steps.integrate.outputs.changed }}
        run: |
          {
            echo '## Reviewed remote infographic intake'
            echo
            echo "Result: **${STATUS:-unknown}**"
            echo "Reviewed assets downloaded: **${COUNT:-0}**"
            echo "Safe repository integration requested: **${CHANGED:-false}**"
            echo
            echo 'Only explicitly enabled HTTPS manifest entries are eligible. Successful integration explicitly wakes cumulative production; visitor publication remains owned by the canonical infographic publisher.'
          } >> "$GITHUB_STEP_SUMMARY"
