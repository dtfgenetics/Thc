name: Deploy DTFSeeds Public Suite via WordPress V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/deploy-public-suite-v2-trigger.txt
      - .github/workflows/deploy-public-suite-wordpress-v2.yml
      - .github/workflows/game-release-integrity.yml
      - apps/high-land-web/**
      - apps/growlens-web/**
      - games/high-iq/**
      - games/high-life/**
      - games/grower-conversations/**
      - games/seed-man-platformer/**
      - site/public-route-patch/**
      - site/deployment/public-apps.json
      - site/deployment/release-resources.json
      - scripts/package-public-suite-wordpress.py
      - scripts/package-public-suite-wordpress-resource-aware.py
      - scripts/public_suite_resource_ownership.py
      - scripts/assemble-wordpress-suite-v2.py
      - scripts/assemble-wordpress-suite-resource-aware.py
      - scripts/promote-public-game-routes-via-wordpress.mjs
      - scripts/wordpress-suite-v2/**

permissions:
  actions: write
  contents: read

concurrency:
  group: deploy-dtfseeds-public-suite-wordpress-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - name: Checkout current deployment source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate WordPress access and resource-aware deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          python -m py_compile \
            scripts/package-public-suite-wordpress.py \
            scripts/package-public-suite-wordpress-resource-aware.py \
            scripts/public_suite_resource_ownership.py \
            scripts/assemble-wordpress-suite-v2.py \
            scripts/assemble-wordpress-suite-resource-aware.py
          node --check scripts/cleanup-stale-wordpress-suite-snippets.mjs
          node --check scripts/promote-public-game-routes-via-wordpress.mjs
          python scripts/assemble-wordpress-suite-resource-aware.py "$RUNNER_TEMP/deploy-public-suite-v2.mjs" | tee "$RUNNER_TEMP/resource-ownership-bridge.json"
          node --check "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          grep -Fq 'resourceOwnedTargetsExcluded' "$RUNNER_TEMP/resource-ownership-bridge.json"
          grep -Fq "'atlas'" "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          grep -Fq "'atlas/leaf-module/index.html'" "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          ! grep -Fq "'games/high-land'" "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          ! grep -Fq "'games/high-iq'" "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          ! grep -Fq "'/games/high-land/'" "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          ! grep -Fq "'/games/high-iq/'" "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          grep -Fq "get_param('_dtf_suite_token')" "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          grep -Fq '_dtf_suite_token: suiteToken' "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          ! grep -Fq 'current_user_can(' "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          python - <<'PY'
          import os, pathlib, re
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'deploy-public-suite-v2.mjs').read_text()
          m=re.search(r"const snippetCode = String\.raw`(.*?)`\.trim\(\);", text, re.S)
          assert m, 'embedded PHP missing'
          php=m.group(1).replace('${tokenLiteral}', "'0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'")
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'dtf-suite-v2.php').write_text('<?php\n'+php+'\n')
          PY
          php -l "$RUNNER_TEMP/dtf-suite-v2.php"

      - name: Build current public suite artifact
        id: current_build
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run build-dtfseeds-public-suite.yml --ref main)"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Could not parse public-suite build run from: $run_url" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Current public-suite build run: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Download current validated Public Suite artifact
        id: suite
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/suite-download"
          mkdir -p "$RUNNER_TEMP/suite-download"
          gh run download "${{ steps.current_build.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/suite-download"
          build_json="$(find "$RUNNER_TEMP/suite-download" -type f -name dtf-build.json -print -quit)"
          [[ -n "$build_json" ]] || { echo 'Current artifact does not contain dtf-build.json.' >&2; exit 1; }
          suite_root="$(dirname "$build_json")"
          required=(
            games/index.html
            games/high-land/index.html
            games/high-iq/index.html
            games/high-iq/app.js
            games/high-iq/app-v3.js
            games/high-iq/game-core.mjs
            games/high-iq/high-iq.css
            games/high-iq/high-iq-v3.css
            games/high-iq/data/manifest.json
            games/high-life/index.html
            games/grower-conversations/index.html
            games/seed-man-platformer/index.html
            games/protect-the-plants/index.html
            games/protect-the-plants/api.php
            games/bud-or-bluff/index.html
            games/strain-showdown/index.html
            games/strain-showdown/app.js
            games/strain-showdown/engine.mjs
            games/strain-showdown/styles.css
            games/terpocalypse/index.html
            games/terpocalypse/main.js
            games/terpocalypse/game-data.js
            games/phenoquest/index.html
            games/phenoquest/game.js
            games/phenoquest/lineage-runtime.js
            games/phenoquest/style.css
            games/phenoquest/build-meta.json
            games/weedopolis/index.html
            games/crossword/index.html
            games/who-took-it/index.html
            growlens/index.html
            thc-grow-doc/index.html
            thc-grow-doc/api/visual-observations.php
            tools/index.html
            projects/index.html
            puzzles/current.json
            atlas/index.html
            atlas/leaf-module/index.html
            atlas/root-system/index.html
            atlas/root-system/rhizosphere/index.html
            atlas/downloads/index.html
            assets/images/atlas/root-system/rhizosphere-microbe-interaction.svg
          )
          for file in "${required[@]}"; do
            test -s "$suite_root/$file" || { echo "Missing required release file: $file" >&2; exit 1; }
          done
          node --check "$suite_root/games/terpocalypse/main.js"
          node --check "$suite_root/games/terpocalypse/game-data.js"
          grep -Fq '"selfContained": true' "$suite_root/games/phenoquest/build-meta.json"
          node games/high-iq/scripts/validate-public-runtime.mjs
          node games/strain-showdown/scripts/validate-browser-build.mjs
          echo "root=$suite_root" >> "$GITHUB_OUTPUT"

      - name: Package resource-aware app-only WordPress archive
        id: package
        shell: bash
        env:
          SUITE_ROOT: ${{ steps.suite.outputs.root }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dtf-public-suite-wordpress-v2.zip"
          python scripts/package-public-suite-wordpress-resource-aware.py "$SUITE_ROOT" "$archive" | tee "$RUNNER_TEMP/package-summary.json"
          test -s "$archive"
          python - <<'PY'
          import json, os, zipfile
          zpath=os.path.join(os.environ['RUNNER_TEMP'],'dtf-public-suite-wordpress-v2.zip')
          with zipfile.ZipFile(zpath) as z:
              names=z.namelist()
              assert len(names)==len(set(names)), 'duplicate ZIP entries'
              assert names.count('.dtf-suite-manifest.json')==1
              required={
                  'atlas/index.html',
                  'atlas/leaf-module/index.html',
                  'atlas/root-system/index.html',
                  'atlas/root-system/rhizosphere/index.html',
                  'atlas/downloads/index.html',
                  'assets/images/atlas/root-system/rhizosphere-microbe-interaction.svg',
                  'growlens/index.html',
                  'thc-grow-doc/index.html',
                  'games/protect-the-plants/index.html',
                  'games/bud-or-bluff/index.html',
                  'games/strain-showdown/index.html',
                  'games/strain-showdown/app.js',
                  'games/strain-showdown/engine.mjs',
                  'games/strain-showdown/styles.css',
                  'games/terpocalypse/index.html',
                  'games/terpocalypse/main.js',
                  'games/terpocalypse/game-data.js',
                  'games/phenoquest/index.html',
                  'games/phenoquest/game.js',
                  'games/phenoquest/lineage-runtime.js',
                  'games/phenoquest/style.css',
                  'games/phenoquest/build-meta.json',
              }
              missing=required-set(names)
              assert not missing, f'missing deploy archive assets: {sorted(missing)}'
              assert not [n for n in names if n=='index.html' or n.startswith('learn/') or n.startswith('blog/')]
              assert not [n for n in names if n == 'games/high-land' or n.startswith('games/high-land/')]
              assert not [n for n in names if n == 'games/high-iq' or n.startswith('games/high-iq/')]
              manifest=json.loads(z.read('.dtf-suite-manifest.json'))
              assert manifest['purpose']=='dtfseeds-public-apps-only'
              assert {'/','/learn/','/blog/'}.issubset(set(manifest['wordPressOwnedRoutesExcluded']))
              assert {'/games/high-land/','/games/high-iq/'}.issubset(set(manifest['resourceOwnedRoutesExcluded']))
              assert 'games/high-land' not in manifest['targets']
              assert 'games/high-iq' not in manifest['targets']
          PY
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Recover stale transaction and remove temporary Public Suite bridges
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cleanup-stale-wordpress-suite-snippets.mjs | tee "$RUNNER_TEMP/stale-suite-bridge-cleanup.json"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/stale-suite-bridge-cleanup.json"

      - name: Publish current Public Suite through transactional WordPress bridge
        id: publish
        shell: bash
        env:
          DTF_SUITE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/deploy-public-suite-v2.mjs" "$DTF_SUITE_ARCHIVE" | tee "$RUNNER_TEMP/deploy-result.log"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/deploy-result.log"

      - name: Promote canonical public game routes
        id: promote_routes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/promote-public-game-routes-via-wordpress.mjs

      - name: Verify Atlas live routes
        id: live_atlas
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://dtfseeds.com/atlas/ \
            https://dtfseeds.com/atlas/root-system/ \
            https://dtfseeds.com/atlas/root-system/rhizosphere/ \
            https://dtfseeds.com/atlas/downloads/; do
            echo "Checking $url"
            body="$(curl -fsSL --retry 5 --retry-delay 6 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "${url}?dtf_atlas_verify=${GITHUB_RUN_ID}")"
            grep -Eiq 'THC Living Plant Atlas|Rhizosphere|Field Cards|Root System' <<<"$body"
          done

      - name: Verify current suite-owned public application surfaces
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local url="$1" marker="$2" body headers status
            echo "Checking $url"
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl -fsS --retry 5 --retry-delay 5 \
              --output "$body" \
              --dump-header "$headers" \
              --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$url?dtf_suite_verify=${GITHUB_RUN_ID}")"
            if [[ "$status" != "200" ]]; then
              echo "Expected HTTP 200 from $url, received $status" >&2
              cat "$headers" >&2
              rm -f "$body" "$headers"
              return 1
            fi
            if grep -Eiq '^location:' "$headers"; then
              echo "Refusing redirected public application route: $url" >&2
              cat "$headers" >&2
              rm -f "$body" "$headers"
              return 1
            fi
            if ! grep -Fqi "$marker" "$body"; then
              echo "Expected marker '$marker' was not found at $url" >&2
              rm -f "$body" "$headers"
              return 1
            fi
            rm -f "$body" "$headers"
          }
          check 'https://dtfseeds.com/games/' '25 playable browser games'
          check 'https://dtfseeds.com/projects/' '15 public browser games'
          check 'https://dtfseeds.com/games/strain-showdown/' 'Eight play styles. One showdown.'
          check 'https://dtfseeds.com/games/protect-the-plants/' 'Protect the Plants'
          check 'https://dtfseeds.com/games/bud-or-bluff/' 'Bud or Bluff'
          check 'https://dtfseeds.com/games/terpocalypse/' 'LEVEL 01 · THE VEG LAB'
          check 'https://dtfseeds.com/games/phenoquest/' 'The Living Seed Vault'
          check 'https://dtfseeds.com/games/who-took-it/' 'The stash is short.'
          check 'https://dtfseeds.com/growlens/' 'GrowLens'
          check 'https://dtfseeds.com/thc-grow-doc/' 'Grow Doc'

      - name: Dispatch independent feature-surface verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run verify-dtfseeds-feature-surface.yml --ref main || true

      - name: Summarize deployment
        if: always()
        shell: bash
        run: |
          {
            echo '## DTFSeeds Public Suite Production Deployment'
            echo
            echo "- Trigger commit: $GITHUB_SHA"
            echo "- Build run: ${{ steps.current_build.outputs.run_id }}"
            echo "- Transactional publication: ${{ steps.publish.outcome }}"
            echo "- Game route promotion: ${{ steps.promote_routes.outcome }}"
            echo "- Atlas verification: ${{ steps.live_atlas.outcome }}"
            echo '- Resource-owned High Land and High IQ are intentionally excluded from this transaction and its suite-owned live verification.'
            echo '- Game Hub verification requires the current 25-game navigation shell while this writer only publishes suite-owned routes.'
            echo '- Who Took It verification requires the current case-board edition marker and its own canonical public route.'
            echo '- PhenoQuest must package as a verified self-contained canonical build.'
            echo '- Terpocalypse must package validated browser runtime JavaScript from the integration snapshot.'
            echo '- Strain Showdown verification requires the packaged browser runtime, synchronized 96-card roster, and live three-lane game route.'
            echo '- Public application checks require HTTP 200 without redirects and include the current Projects release-count fingerprint.'
            echo '- WordPress-owned /, /learn/, and /blog/ remain outside this app-only transaction.'
          } >> "$GITHUB_STEP_SUMMARY"
