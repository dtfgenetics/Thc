name: Deploy DTFSeeds Public Suite via WordPress V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/deploy-public-suite-v2-trigger.txt
      - .github/workflows/deploy-public-suite-wordpress-v2.yml
      - apps/high-land-web/**
      - apps/growlens-web/**
      - games/high-iq/**
      - games/high-life/**
      - games/grower-conversations/**
      - games/seed-man-platformer/**
      - site/public-route-patch/**
      - site/deployment/public-apps.json
      - scripts/package-public-suite-wordpress.py
      - scripts/assemble-wordpress-suite-v2.py
      - scripts/wordpress-suite-v2/**

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: deploy-dtfseeds-public-suite-wordpress-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - name: Checkout current deployment source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate WordPress access and deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          python -m py_compile scripts/package-public-suite-wordpress.py scripts/assemble-wordpress-suite-v2.py
          node --check scripts/cleanup-stale-wordpress-suite-snippets.mjs
          python scripts/assemble-wordpress-suite-v2.py "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'deploy-public-suite-v2.mjs'
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label} block, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "'growlens','thc-grow-doc','tools','projects','puzzles'\n    ];",
              "'growlens','thc-grow-doc','tools','projects','puzzles','atlas','assets/images/atlas'\n    ];",
              'Atlas deployment target allowlist',
          )
          replace_once(
              "'thc-grow-doc/api/visual-observations.php','tools/index.html','projects/index.html','puzzles/current.json'\n    ];",
              "'thc-grow-doc/api/visual-observations.php','tools/index.html','projects/index.html','puzzles/current.json',\n        'atlas/index.html','atlas/root-system/index.html','atlas/root-system/rhizosphere/index.html','atlas/downloads/index.html',\n        'assets/images/atlas/root-system/rhizosphere-microbe-interaction.svg'\n    ];",
              'Atlas required-file allowlist',
          )
          replace_once(
              "'games/protect-the-plants/','games/weedopolis/','games/crossword/','games/who-took-it/','growlens/','thc-grow-doc/','tools/','projects/','puzzles/'\n    ];",
              "'games/protect-the-plants/','games/weedopolis/','games/crossword/','games/who-took-it/','growlens/','thc-grow-doc/','tools/','projects/','puzzles/',\n        'atlas/','assets/images/atlas/'\n    ];",
              'Atlas prefix allowlist',
          )
          path.write_text(text)
          PY
          node --check "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          python - <<'PY'
          import os, pathlib, re
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'deploy-public-suite-v2.mjs').read_text()
          m=re.search(r"const snippetCode = String\.raw`(.*?)`\.trim\(\);", text, re.S)
          assert m, 'embedded PHP missing'
          php=m.group(1).replace('${tokenLiteral}', "'0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'")
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'dtf-suite-v2.php').write_text('<?php\n'+php+'\n')
          PY
          php -l "$RUNNER_TEMP/dtf-suite-v2.php"

      - name: Build current public suite artifact
        id: current_build
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run build-dtfseeds-public-suite.yml --ref main)"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Could not parse public-suite build run from: $run_url" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Current public-suite build run: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Download current validated Public Suite artifact
        id: suite
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/suite-download"
          mkdir -p "$RUNNER_TEMP/suite-download"
          gh run download "${{ steps.current_build.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/suite-download"
          build_json="$(find "$RUNNER_TEMP/suite-download" -type f -name dtf-build.json -print -quit)"
          [[ -n "$build_json" ]] || { echo 'Current artifact does not contain dtf-build.json.' >&2; exit 1; }
          suite_root="$(dirname "$build_json")"
          required=(
            games/index.html
            games/high-land/index.html
            games/high-iq/index.html
            games/high-life/index.html
            games/grower-conversations/index.html
            games/seed-man-platformer/index.html
            games/protect-the-plants/index.html
            games/protect-the-plants/api.php
            games/bud-or-bluff/index.html
            games/weedopolis/index.html
            games/crossword/index.html
            games/who-took-it/index.html
            growlens/index.html
            thc-grow-doc/index.html
            thc-grow-doc/api/visual-observations.php
            tools/index.html
            projects/index.html
            puzzles/current.json
            atlas/index.html
            atlas/leaf-module/index.html
            atlas/root-system/index.html
            atlas/root-system/rhizosphere/index.html
            atlas/downloads/index.html
            assets/images/atlas/root-system/rhizosphere-microbe-interaction.svg
          )
          for file in "${required[@]}"; do
            test -s "$suite_root/$file" || { echo "Missing required release file: $file" >&2; exit 1; }
          done
          echo "root=$suite_root" >> "$GITHUB_OUTPUT"

      - name: Package current app-only WordPress archive
        id: package
        shell: bash
        env:
          SUITE_ROOT: ${{ steps.suite.outputs.root }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dtf-public-suite-wordpress-v2.zip"
          python scripts/package-public-suite-wordpress.py "$SUITE_ROOT" "$archive" | tee "$RUNNER_TEMP/package-summary.json"
          test -s "$archive"
          python - <<'PY'
          import json, os, zipfile
          zpath=os.path.join(os.environ['RUNNER_TEMP'],'dtf-public-suite-wordpress-v2.zip')
          with zipfile.ZipFile(zpath) as z:
              names=z.namelist()
              assert len(names)==len(set(names)), 'duplicate ZIP entries'
              assert names.count('.dtf-suite-manifest.json')==1
              required={
                  'atlas/index.html',
                  'atlas/leaf-module/index.html',
                  'atlas/root-system/index.html',
                  'atlas/root-system/rhizosphere/index.html',
                  'atlas/downloads/index.html',
                  'assets/images/atlas/root-system/rhizosphere-microbe-interaction.svg',
                  'growlens/index.html',
                  'thc-grow-doc/index.html',
                  'games/protect-the-plants/index.html',
                  'games/bud-or-bluff/index.html',
              }
              missing=required-set(names)
              assert not missing, f'missing deploy archive assets: {sorted(missing)}'
              assert not [n for n in names if n=='index.html' or n.startswith('learn/') or n.startswith('blog/')]
              manifest=json.loads(z.read('.dtf-suite-manifest.json'))
              assert manifest['purpose']=='dtfseeds-public-apps-only'
              assert {'/','/learn/','/blog/'}.issubset(set(manifest['wordPressOwnedRoutesExcluded']))
          PY
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Recover stale transaction and remove temporary Public Suite bridges
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cleanup-stale-wordpress-suite-snippets.mjs | tee "$RUNNER_TEMP/stale-suite-bridge-cleanup.json"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/stale-suite-bridge-cleanup.json"

      - name: Publish current Public Suite through transactional WordPress bridge
        id: publish
        shell: bash
        env:
          DTF_SUITE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/deploy-public-suite-v2.mjs" "$DTF_SUITE_ARCHIVE" | tee "$RUNNER_TEMP/deploy-result.log"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/deploy-result.log"

      - name: Verify Atlas live routes
        id: live_atlas
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://dtfseeds.com/atlas/ \
            https://dtfseeds.com/atlas/root-system/ \
            https://dtfseeds.com/atlas/root-system/rhizosphere/ \
            https://dtfseeds.com/atlas/downloads/; do
            echo "Checking $url"
            curl -fsSL --retry 5 --retry-delay 6 "$url" | grep -Eiq 'THC Living Plant Atlas|Rhizosphere|Field Cards|Root System'
          done

      - name: Verify current public application surfaces
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local url="$1" marker="$2"
            echo "Checking $url"
            curl -fsSL --retry 5 --retry-delay 5 -H 'Cache-Control: no-cache, no-store, max-age=0' "$url?dtf_suite_verify=${GITHUB_RUN_ID}" | grep -Fqi "$marker"
          }
          check 'https://dtfseeds.com/games/' '10 playable browser games'
          check 'https://dtfseeds.com/games/protect-the-plants/' 'Protect the Plants'
          check 'https://dtfseeds.com/games/bud-or-bluff/' 'Bud or Bluff'
          check 'https://dtfseeds.com/growlens/' 'GrowLens'
          check 'https://dtfseeds.com/thc-grow-doc/' 'Grow Doc'

      - name: Dispatch independent feature-surface verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run verify-dtfseeds-feature-surface.yml --ref main || true

      - name: Summarize deployment
        if: always()
        shell: bash
        run: |
          {
            echo '## DTFSeeds Public Suite Production Deployment'
            echo
            echo "- Trigger commit: $GITHUB_SHA"
            echo "- Build run: ${{ steps.current_build.outputs.run_id }}"
            echo "- Transactional publication: ${{ steps.publish.outcome }}"
            echo "- Atlas verification: ${{ steps.live_atlas.outcome }}"
            echo '- WordPress-owned /, /learn/, and /blog/ remain outside this app-only transaction.'
          } >> "$GITHUB_STEP_SUMMARY"
