name: Validate DTF Genetics Catalog

on:
  push:
    branches: [main]
    paths:
      - 'data/genetics/**'
      - 'site/wordpress/products/catalog-strain-cards.json'
      - 'site/wordpress/pages/seeds.html'
      - 'site/wordpress/pages/blue-mango.html'
      - 'site/wordpress/pages/blue-frequency.html'
      - 'site/wordpress/pages/mystery-line.html'
      - 'site/wordpress/pages/rainbow-bubblegum.html'
      - 'scripts/validate-genetics-catalog.mjs'
      - 'scripts/validate-catalog-strain-cards.mjs'
      - '.github/workflows/genetics-catalog-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/genetics/**'
      - 'site/wordpress/products/catalog-strain-cards.json'
      - 'site/wordpress/pages/seeds.html'
      - 'site/wordpress/pages/blue-mango.html'
      - 'site/wordpress/pages/blue-frequency.html'
      - 'site/wordpress/pages/mystery-line.html'
      - 'site/wordpress/pages/rainbow-bubblegum.html'
      - 'scripts/validate-genetics-catalog.mjs'
      - 'scripts/validate-catalog-strain-cards.mjs'
      - '.github/workflows/genetics-catalog-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalog, public page synchronization, and exact strain-card sources
        run: |
          set -euo pipefail
          node --check scripts/validate-genetics-catalog.mjs
          node --check scripts/validate-catalog-strain-cards.mjs
          node scripts/validate-genetics-catalog.mjs
          node scripts/validate-catalog-strain-cards.mjs
