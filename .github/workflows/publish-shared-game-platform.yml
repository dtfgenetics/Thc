name: Publish Shared Game Platform

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-shared-game-platform.yml
      - scripts/publish-shared-game-platform-via-wordpress.mjs
      - scripts/sync-game-shared-platform.mjs
      - games/shared-platform/**
      - site/public-route-patch/games/shared-platform/**

permissions:
  contents: read

concurrency:
  group: publish-shared-game-platform
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      DTF_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate canonical shared platform runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run games:platform:test
          npm run games:platform:sync-check
          node --check scripts/publish-shared-game-platform-via-wordpress.mjs
          root=site/public-route-patch/games/shared-platform
          grep -Fq 'AddType text/javascript .mjs' "$root/.htaccess"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'site/public-route-patch/games/shared-platform';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          if (!/^\\d+\\.\\d+\\.\\d+$/.test(String(manifest.platformVersion || ''))) throw new Error('Invalid shared platform version');
          if (!Array.isArray(manifest.files) || manifest.files.length < 1) throw new Error('Shared platform manifest has no modules');
          for (const file of ['.htaccess', 'manifest.json', ...manifest.files]) {
            const target = path.join(root, file);
            if (!fs.existsSync(target) || fs.statSync(target).size === 0) throw new Error(`Missing shared platform file: ${file}`);
          }
          const index = fs.readFileSync(path.join(root, 'index.mjs'), 'utf8');
          if (!index.includes(`DTF_GAME_PLATFORM_VERSION = '${manifest.platformVersion}'`)) throw new Error('Shared platform index/version mismatch');
          console.log(`Validated shared game platform ${manifest.platformVersion} with ${manifest.files.length} runtime modules`);
          NODE

      - name: Atomically publish shared platform route
        run: node scripts/publish-shared-game-platform-via-wordpress.mjs

      - name: Verify live module MIME and release markers
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const base = 'https://dtfseeds.com/games/shared-platform';
          const localManifest = JSON.parse(fs.readFileSync('site/public-route-patch/games/shared-platform/manifest.json', 'utf8'));
          const expected = [
            ['manifest.json', 'application/json'],
            ...localManifest.files.map((file) => [file, 'javascript']),
          ];
          for (const [file, type] of expected) {
            const response = await fetch(`${base}/${file}?v=${Date.now()}`, { redirect: 'manual' });
            if (response.status !== 200) throw new Error(`${file}: HTTP ${response.status}`);
            const contentType = response.headers.get('content-type') || '';
            if (!contentType.toLowerCase().includes(type)) throw new Error(`${file}: unexpected content-type ${contentType}`);
            const body = await response.text();
            if (!body.trim()) throw new Error(`${file}: empty body`);
            if (file === 'manifest.json' && !body.includes(`"platformVersion": "${localManifest.platformVersion}"`)) throw new Error('manifest version marker missing');
            if (file === 'index.mjs' && !body.includes(`DTF_GAME_PLATFORM_VERSION = '${localManifest.platformVersion}'`)) throw new Error('index version marker missing');
          }
          NODE

      - name: Shared platform production summary
        if: always()
        shell: bash
        run: |
          {
            echo '## DTF shared game platform production route'
            echo
            echo '- Route: `https://dtfseeds.com/games/shared-platform/`'
            echo '- Module: `https://dtfseeds.com/games/shared-platform/index.mjs`'
            version="$(node -p "require('./site/public-route-patch/games/shared-platform/manifest.json').platformVersion")"
            echo "- Version: `$version`"
            echo '- Publication: atomic replacement with SHA-256 verification'
            echo '- Live gate: HTTP status + JavaScript MIME + release-marker verification'
          } >> "$GITHUB_STEP_SUMMARY"
