name: Reconcile DTFSeeds WordPress Pages On Command

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

# /rebuild-site is owned exclusively by wordpress-visual-command.yml. Keeping it
# out of this workflow prevents the old broad visual writer from racing the
# approved-only Learning transaction. This command now performs only the
# ownership-preserving canonical page reconciliation.
concurrency:
  group: dtfseeds-wordpress-reconcile-command
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 46 &&
       github.event.comment.body == '/reconcile-wordpress' &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      CONTENT_DIR: ${{ github.workspace }}/site/wordpress/pages
      BACKUP_ROOT: /tmp/wordpress-owned-route-reconcile
      OWNED_ROUTE_PRESERVATION_REPORT: /tmp/wordpress-owned-route-reconcile/owned-route-preservation.json

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate ownership-safe reconciliation package
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/apply-wordpress-public-content-owned-routes.mjs
          node --check scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/verify-wordpress-owned-route-preservation.mjs
          node --check scripts/flush-hostinger-litespeed-mcp.mjs
          test -d "$CONTENT_DIR"
          test -s "$CONTENT_DIR/home.html"
          test -s "$CONTENT_DIR/learn.html"
          ! grep -Fq 'node scripts/rebuild-wordpress-visual-site.mjs' .github/workflows/wordpress-reconcile-command.yml
          ! grep -Fq 'node scripts/rebuild-wordpress-infographic-gallery.mjs' .github/workflows/wordpress-reconcile-command.yml
          ! grep -Fq '/rebuild-site' .github/workflows/wordpress-reconcile-command.yml || grep -Fq '/rebuild-site is owned exclusively' .github/workflows/wordpress-reconcile-command.yml

      - name: Reconcile canonical non-Learning routes without overwriting Home or Learn
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/apply-wordpress-public-content-owned-routes.mjs \
            | tee "$RUNNER_TEMP/owned-route-reconcile.log"
          test -s "$OWNED_ROUTE_PRESERVATION_REPORT"
          node - "$OWNED_ROUTE_PRESERVATION_REPORT" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const slug of ['home','learn']){
            if(r.routes?.[slug]?.canonicalLaneMutation!==false) throw new Error(`Delegated /${slug}/ was not proved read-only.`);
          }
          console.log('Home and Learn remained delegated and unmodified by canonical reconciliation.');
          NODE

      - name: Purge LiteSpeed cache
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if node scripts/flush-hostinger-litespeed-mcp.mjs; then ok=1; break; fi
            [[ "$attempt" -lt 3 ]] && sleep $((attempt * 5))
          done
          [[ "$ok" -eq 1 ]] || { echo 'LiteSpeed cache purge failed after retries.' >&2; exit 1; }

      - name: Verify delegated visual owners survived reconciliation
        shell: bash
        run: |
          set -euo pipefail
          blocked='(dtf-edu-|THC[-_ ]?C[0-9]{3}|THC[-_ ]?ENC[-_ ]?[0-9]{3}|Cannabis[_ -]Plant[_ -]Anatomy[_ -]Infographic|Beneficial[_ -]Insects[_ -]and[_ -]Biological[_ -]Controls)'
          for spec in '/|data-dtf-layout="home-v3"' '/learn/|data-dtf-layout="learn-v3"'; do
            route="${spec%%|*}"; marker="${spec#*|}"; body="$RUNNER_TEMP/$(printf '%s' "$route" | tr '/' '_').html"; ok=0
            for attempt in 1 2 3 4 5 6; do
              if curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --connect-timeout 20 --max-time 45 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
                "$WP_SITE_URL${route}?dtf_owned_reconcile=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$body"; then
                if grep -Fq "$marker" "$body" && ! grep -Eqi "$blocked" "$body"; then ok=1; break; fi
              fi
              [[ "$attempt" -lt 6 ]] && sleep $((attempt * 3))
            done
            [[ "$ok" -eq 1 ]] || { echo "Delegated owner verification failed on $route" >&2; exit 1; }
          done

      - name: Upload ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-owned-route-reconcile-${{ github.run_id }}
          path: |
            /tmp/wordpress-owned-route-reconcile
            ${{ runner.temp }}/owned-route-reconcile.log
          if-no-files-found: warn
          retention-days: 30
