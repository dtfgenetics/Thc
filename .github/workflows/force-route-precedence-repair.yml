name: Force DTFSeeds Route Precedence Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-route-precedence-repair.yml

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: force-dtfseeds-route-precedence-repair
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate protected repair workflows
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/wordpress-route-precedence-repair.yml
          test -s scripts/repair-wordpress-route-precedence.mjs
          test -s scripts/run-route-precedence-repair-current-markers.sh
          test -s .github/workflows/wordpress-static-shadow-transactional-repair.yml
          test -s scripts/repair-static-shadows-via-wordpress.mjs
          test -s scripts/run-static-shadow-repair-resilient.mjs
          test -s scripts/run-static-shadow-repair-current-markers.sh
          grep -Fq 'workflow_dispatch:' .github/workflows/wordpress-route-precedence-repair.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/wordpress-static-shadow-transactional-repair.yml
          node --check scripts/repair-wordpress-route-precedence.mjs
          node --check scripts/repair-static-shadows-via-wordpress.mjs
          node --check scripts/run-static-shadow-repair-resilient.mjs
          bash -n scripts/run-route-precedence-repair-current-markers.sh
          bash -n scripts/run-static-shadow-repair-current-markers.sh

      - name: Dispatch and wait for protected route-precedence repair
        id: route
        shell: bash
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run wordpress-route-precedence-repair.yml --ref main
          route_id=''
          for attempt in $(seq 1 20); do
            route_id="$(gh run list --workflow wordpress-route-precedence-repair.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq '[.[] | select(.createdAt >= "'"$before"'")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            [[ -n "$route_id" ]] && break
            sleep 3
          done
          if [[ -z "$route_id" ]]; then
            echo 'Could not identify newly dispatched route-precedence run.' >&2
            exit 1
          fi
          echo "run_id=$route_id" >> "$GITHUB_OUTPUT"
          echo "Route repair run: $route_id"
          gh run watch "$route_id" --exit-status

      - name: Dispatch and wait for static-shadow retirement
        id: shadows
        shell: bash
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run wordpress-static-shadow-transactional-repair.yml --ref main
          shadow_id=''
          for attempt in $(seq 1 20); do
            shadow_id="$(gh run list --workflow wordpress-static-shadow-transactional-repair.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq '[.[] | select(.createdAt >= "'"$before"'")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            [[ -n "$shadow_id" ]] && break
            sleep 3
          done
          if [[ -z "$shadow_id" ]]; then
            echo 'Could not identify newly dispatched static-shadow run.' >&2
            exit 1
          fi
          echo "run_id=$shadow_id" >> "$GITHUB_OUTPUT"
          echo "Static-shadow cleanup run: $shadow_id"
          gh run watch "$shadow_id" --exit-status

      - name: Verify final public cutover
        id: final
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local path="$1"
            local marker="$2"
            local body="$RUNNER_TEMP/final-$(printf '%s' "$path" | tr '/?' '__').html"
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -4 -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "https://dtfseeds.com${path}?dtf_codex_cutover=${GITHUB_RUN_ID}-${attempt}" \
                -o "$body"; then
                if grep -Fqi -- "$marker" "$body"; then ok=1; break; fi
              fi
              sleep 5
            done
            [[ "$ok" -eq 1 ]] || { echo "Final marker missing on $path" >&2; head -c 2500 "$body" >&2 || true; return 1; }
            for stale in \
              'THC Grow Doc, genetics, cultivation education, and games in one home.' \
              'Grow education belongs in a clean, readable library.' \
              'MOPS, cultivation notes, THC basics' \
              'being rebuilt' \
              'Reserved strain card' \
              'Tool-ready rebuild'; do
              ! grep -Fqi -- "$stale" "$body" || { echo "Stale marker remains on $path: $stale" >&2; return 1; }
            done
            echo "$path final visitor verification passed."
          }
          verify '/' 'Genetics, cultivation education, practical tools, and original cannabis games.'
          verify '/learn/' 'Understand the plant. Build the environment. Make better decisions.'
          verify '/learn/infographics/' 'Visual plant science and cultivation library.'

      - name: Report Codex-style production cutover
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          ROUTE_OUTCOME: ${{ steps.route.outcome }}
          ROUTE_RUN: ${{ steps.route.outputs.run_id }}
          SHADOW_OUTCOME: ${{ steps.shadows.outcome }}
          SHADOW_RUN: ${{ steps.shadows.outputs.run_id }}
          FINAL_OUTCOME: ${{ steps.final.outcome }}
        with:
          script: |
            const runLink = id => id ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${id}` : 'not-started';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Codex-style WordPress routing cutover',
                '',
                `Orchestrator: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Overall: **${process.env.JOB_STATUS}**`,
                `Route-precedence repair: **${process.env.ROUTE_OUTCOME || 'not-run'}** — ${runLink(process.env.ROUTE_RUN)}`,
                `Static-shadow retirement: **${process.env.SHADOW_OUTCOME || 'not-run'}** — ${runLink(process.env.SHADOW_RUN)}`,
                `Final visitor verification: **${process.env.FINAL_OUTCOME || 'not-run'}**`,
                '',
                'This reproduces the successful Codex production method: trusted-main dispatcher → protected production workflow → transactional backup/write/rollback → dependent cleanup → independent cache-busted verification. Run resolution is scoped to newly dispatched jobs, and verification uses the canonical Home/Learn headlines stored in GitHub.'
              ].join('\n')
            });

# Trusted-main orchestration trigger: canonical cutover.
