name: Force DTFSeeds Route Precedence Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-route-precedence-repair.yml

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: force-dtfseeds-route-precedence-repair
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate protected repair workflow
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/wordpress-route-precedence-repair.yml
          test -s scripts/repair-wordpress-route-precedence.mjs
          grep -Fq 'workflow_dispatch:' .github/workflows/wordpress-route-precedence-repair.yml
          node --check scripts/repair-wordpress-route-precedence.mjs

      - name: Dispatch protected route-precedence repair
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run wordpress-route-precedence-repair.yml --ref main

      - name: Report explicit route repair dispatch
        if: always()
        uses: actions/github-script@v7
        env:
          DISPATCH_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Explicit route-precedence production dispatch',
                '',
                `Dispatcher run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Status: **${process.env.DISPATCH_STATUS}**`,
                'Requested workflow: Repair DTFSeeds WordPress Route Precedence',
                '',
                'This mirrors the successful Codex trusted-push dispatcher pattern. The target workflow owns protected production credentials and the rollback-safe live repair.'
              ].join('\n')
            });
