name: Verify Cultivation Reference Tools Live

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy DTFSeeds Public Suite via WordPress V2
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-cultivation-reference-tools-live
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install workspace
        run: npm ci

      - name: Validate repository contract
        run: npm run verify:cultivation-reference-tools

      - name: Verify visitor-facing routes
        run: node scripts/verify-cultivation-reference-tools-live.mjs
