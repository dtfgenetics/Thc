name: Verify Cultivation Reference Tools Live

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy DTFSeeds Public Suite via WordPress V2
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-cultivation-reference-tools-live
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate THC integration mirror
        run: node scripts/validate-canonical-tools-mirror.mjs

      - name: Clone canonical Tools repository
        run: git clone --depth 1 https://github.com/dtfgenetics/Tools.git /tmp/tools

      - name: Require current canonical Tools mirror
        run: node scripts/validate-canonical-tools-mirror.mjs /tmp/tools

      - name: Verify visitor-facing canonical tool routes
        env:
          DTF_SITE_URL: https://dtfseeds.com
        run: node /tmp/tools/scripts/verify-cultivation-reference-tools-live.mjs
