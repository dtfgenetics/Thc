name: Repair DTF Stale WordPress MU Override

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/repair-dtf-wordpress-override.mjs
      - scripts/run-dtf-wordpress-override-repair-current.sh
      - scripts/wordpress-ipv4-fetch-bootstrap.mjs
      - .github/workflows/wordpress-dtf-override-repair.yml

permissions:
  contents: read

concurrency:
  group: dtfseeds-wordpress-mu-override-repair
  cancel-in-progress: false

jobs:
  repair-stale-mu-override:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repair package and authenticated path
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/repair-dtf-wordpress-override.mjs
          node --check scripts/wordpress-ipv4-fetch-bootstrap.mjs
          bash -n scripts/run-dtf-wordpress-override-repair-current.sh
          grep -Fq 'a32f9a10a5f79580d665d8d2c4718993a9d4bc14070eb8a26a4a2386f8535a3c' scripts/run-dtf-wordpress-override-repair-current.sh
          grep -Fq 'data-dtf-layout="home-v3"' scripts/run-dtf-wordpress-override-repair-current.sh
          grep -Fq 'data-dtf-layout="learn-v3"' scripts/run-dtf-wordpress-override-repair-current.sh
          grep -Fq '25 playable browser games' scripts/run-dtf-wordpress-override-repair-current.sh
          grep -Fq 'Grow with records. Diagnose with evidence.' scripts/run-dtf-wordpress-override-repair-current.sh
          auth="$(printf '%s:%s' "$WP_API_USERNAME" "$WP_API_PASSWORD" | base64 -w0)"
          curl -4 --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 60 \
            -H "Authorization: Basic $auth" \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "$WP_SITE_URL/wp-json/wp/v2/users/me?context=edit" -o "$RUNNER_TEMP/wp-user.json"
          node - <<'NODE' "$RUNNER_TEMP/wp-user.json"
          const user=require(process.argv[2]);
          if (!Number(user.id || 0)) throw new Error('Authenticated WordPress user did not resolve');
          NODE

      - name: Disable confirmed stale MU renderer transactionally
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-dtf-wordpress-override-repair-current.sh | tee "$RUNNER_TEMP/mu-override-repair.json"

      - name: Independently verify repaired owners
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local path="$1"
            local marker="$2"
            local stale="$3"
            local body="$RUNNER_TEMP/mu-final-$(printf '%s' "$path" | tr '/?' '__').html"
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -4 --fail --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 2 \
                --connect-timeout 15 --max-time 60 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "$WP_SITE_URL${path}?dtf_mu_final=${GITHUB_RUN_ID}-${attempt}" -o "$body" \
                && grep -Fqi -- "$marker" "$body" \
                && ! grep -Fqi -- "$stale" "$body"; then
                ok=1
                break
              fi
              sleep 5
            done
            [[ "$ok" -eq 1 ]] || {
              echo "MU repair verification failed on $path" >&2
              head -c 3000 "$body" >&2 || true
              exit 1
            }
            echo "$path verified"
          }
          verify '/' 'data-dtf-layout="home-v3"' 'THC Grow Doc, genetics, cultivation education, and games in one home.'
          verify '/learn/' 'data-dtf-layout="learn-v3"' 'Grow education belongs in a clean, readable library.'
          verify '/games/' '25 playable browser games' '__dtf_no_stale_games_marker__'
          verify '/tools/' 'Grow with records. Diagnose with evidence.' '__dtf_no_stale_tools_marker__'

      - name: Record MU override repair
        if: always()
        shell: bash
        env:
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          node - <<'NODE' "$RUNNER_TEMP/mu-override-repair.json" "$GITHUB_STEP_SUMMARY" "$REPAIR_OUTCOME" "$VERIFY_OUTCOME"
          const fs=require('fs');
          const [file,summary,repair,verify]=process.argv.slice(2);
          let d={};
          if(fs.existsSync(file)){
            for(const line of fs.readFileSync(file,'utf8').trim().split(/\r?\n/).reverse()){
              try{d=JSON.parse(line);break}catch{}
            }
          }
          fs.appendFileSync(summary,[
            '## DTF stale MU override repair','',
            `Transactional repair: **${repair||'unknown'}**`,
            `Independent verification: **${verify||'not-run'}**`,
            `Override changed: **${d.changed ?? 'unknown'}**`,
            `Verified SHA-256: \`${d.sha256 || '-'}\``,
            `Origin verification: **${d.origin_verified === true ? 'success' : 'not-confirmed'}**`,'',
            'The repair targets only `wp-content/mu-plugins/dtf-homepage-override.php`, requires the exact confirmed stale SHA and stale Home/Learn markers, renames it out of MU auto-loading, purges LiteSpeed, verifies Home/Learn plus preserved Games/Tools, and restores the original file automatically if the transaction verification fails.'
          ].join('\n')+'\n');
          NODE
