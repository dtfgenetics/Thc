name: Repair DTF Stale WordPress MU Override

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/repair-dtf-wordpress-override.mjs
      - .github/workflows/wordpress-dtf-override-repair.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-mu-override-repair
  cancel-in-progress: false

jobs:
  repair-stale-mu-override:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repair package
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/repair-dtf-wordpress-override.mjs

      - name: Confirm WordPress HTTPS path
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -4 --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 45 --retry 2 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$WP_SITE_URL/wp-json/" -o "$RUNNER_TEMP/wp-index.json"; then
              echo "WordPress HTTPS reachable on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 6))
          done
          echo 'WordPress HTTPS remained unreachable.' >&2
          exit 1

      - name: Disable confirmed stale MU renderer transactionally
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repair-dtf-wordpress-override.mjs | tee "$RUNNER_TEMP/mu-override-repair.json"

      - name: Report MU override repair
        if: always()
        uses: actions/github-script@v7
        env:
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
        with:
          script: |
            const fs = require('fs');
            let data = {};
            const file = process.env.RUNNER_TEMP + '/mu-override-repair.json';
            if (fs.existsSync(file)) {
              for (const line of fs.readFileSync(file, 'utf8').trim().split(/\r?\n/).reverse()) {
                try { data = JSON.parse(line); break; } catch {}
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## DTF stale MU override repair',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.REPAIR_OUTCOME || 'unknown'}**`,
                `Confirmed stale override disabled: **${data.ok === true ? 'true' : 'unknown'}**`,
                `WordPress origin verification: **${data.origin_verified === true ? 'success' : 'not-confirmed'}**`,
                `Expected override SHA: \`${data.sha256 || 'not-reported'}\``,
                '',
                'This repair targets only `wp-content/mu-plugins/dtf-homepage-override.php`, whose confirmed content contains the stale Home/Learn renderer and priority-0 `template_redirect` override. The file is hash-gated, renamed out of MU auto-loading, cache-purged, origin-verified, and automatically restored on verification failure.'
              ].join('\n')
            });
