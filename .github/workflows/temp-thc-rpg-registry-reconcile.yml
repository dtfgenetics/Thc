name: Temporary THC RPG Registry Reconcile

on:
  push:
    branches:
      - release/thc-rpg-2-1-0-integration-20260912
    paths:
      - .github/workflows/temp-thc-rpg-registry-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate external contracts
        run: node scripts/validate-external-game-contracts.mjs
      - name: Reconcile public registry
        run: node scripts/reconcile-external-game-registry.mjs
      - name: Commit generated registry
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/deployment/public-apps.json; then
            echo 'Registry already synchronized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/deployment/public-apps.json
          git commit -m 'release(games): reconcile THC RPG registry'
          git push origin HEAD:${GITHUB_REF_NAME}
