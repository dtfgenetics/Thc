name: GitHub Worker Orchestrator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan, claim ready work, or reconcile one job'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - dispatch
          - reconcile
      issue:
        description: 'Issue number for reconcile mode'
        required: false
        type: string
      apply:
        description: 'Apply reconciliation mutations (dry-run when false)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: github-worker-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate orchestrator
        run: |
          set -euo pipefail
          node --check scripts/orchestrator.mjs
          node --check scripts/orchestrator-reconcile.mjs
          node --check scripts/orchestrator/core.mjs
          node --check scripts/orchestrator/state.mjs
          node --check scripts/orchestrator/leases.mjs
          node --check scripts/orchestrator/reconcile.mjs
          node scripts/test-worker-orchestrator.mjs

      - name: Ensure orchestration labels
        run: node scripts/orchestrator.mjs labels

      - name: Reconcile one job
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reconcile'
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.issue }}" ]]; then
            echo 'issue input is required for reconcile mode' >&2
            exit 2
          fi
          args=(--issue="${{ inputs.issue }}")
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            args+=(--apply=true)
          fi
          node scripts/orchestrator-reconcile.mjs "${args[@]}" | tee "$RUNNER_TEMP/worker-reconcile.json"

      - name: Plan worker allocation
        if: github.event_name == 'schedule' || inputs.mode == 'plan' || inputs.mode == 'dispatch'
        run: |
          set -euo pipefail
          node scripts/orchestrator.mjs plan | tee "$RUNNER_TEMP/worker-plan.json"

      - name: Claim ready work
        if: github.event_name == 'schedule' || inputs.mode == 'dispatch'
        run: |
          set -euo pipefail
          node scripts/orchestrator.mjs dispatch --apply=true | tee "$RUNNER_TEMP/worker-dispatch.json"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '## GitHub Worker Orchestrator' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "$RUNNER_TEMP/worker-plan.json" ]]; then
            node - "$RUNNER_TEMP/worker-plan.json" "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const lines = [
            `Config version: **${report.configVersion ?? 1}**`,
            `Active workers: **${report.activeWorkers}/${report.maxWorkers}**`,
            `Expired claims: **${report.expiredClaims ?? 0}**`,
            `Ready issues: **${report.readyIssues}**`,
            `Planned claims: **${report.plannedClaims.length}**`,
            '',
            ...report.plannedClaims.map((claim) => `- #${claim.issueNumber} [${claim.kind}] \`${claim.project}\` → \`${claim.branch}\``),
          ];
          fs.appendFileSync(process.argv[3], `${lines.join('\n')}\n`);
          NODE
          fi
          if [[ -s "$RUNNER_TEMP/worker-dispatch.json" ]]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '### Dispatch result' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/worker-dispatch.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -s "$RUNNER_TEMP/worker-reconcile.json" ]]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '### Reconciliation result' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/worker-reconcile.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
