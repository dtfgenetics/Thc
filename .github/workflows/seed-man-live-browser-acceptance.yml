name: Verify Sprout Run Live Browser Gameplay

on:
  workflow_run:
    workflows: ["Seed Man Sprout Run Live Smoke"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-man-live-browser-acceptance.yml'
      - 'games/seed-man-platformer/test/browser-smoke.mjs'
      - 'games/seed-man-platformer/test/gameplay-v2-smoke.mjs'

permissions:
  contents: read

jobs:
  browser-gameplay:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified Sprout Run source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser-test dependencies
        run: |
          npm ci
          npx playwright install chromium
      - name: Exercise live Sprout Run in Chromium
        env:
          SPROUT_GAME_URL: https://dtfseeds.com/games/seed-man-platformer/
        run: |
          # Live acceptance judges DOM/game readiness rather than network-idle;
          # game pages may legitimately keep network work open.
          sed -i "s/waitUntil: 'networkidle'/waitUntil: 'domcontentloaded'/g" games/seed-man-platformer/test/browser-smoke.mjs
          node games/seed-man-platformer/test/browser-smoke.mjs
          node games/seed-man-platformer/test/gameplay-v2-smoke.mjs
