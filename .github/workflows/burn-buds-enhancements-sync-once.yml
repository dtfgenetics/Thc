name: Burn Buds Enhancements Sync One Shot

on:
  push:
    branches:
      - game/burn-buds-enhancements-sync-cleanup
    paths:
      - '.github/workflows/burn-buds-enhancements-sync-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game/burn-buds-enhancements-sync-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch enhancements render sync
        run: node scripts/patch-burn-buds-enhancements-sync.mjs
      - name: Verify patched runtime
        run: |
          node --check site/public-route-patch/games/protect-the-plants/enhancements.js
          node games/protect-the-plants/test/enhancements-sync.test.mjs
      - name: Commit patched runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/public-route-patch/games/protect-the-plants/enhancements.js
          git commit -m 'Move Burn Buds enhancements onto shared render sync'
          git push origin HEAD:game/burn-buds-enhancements-sync-cleanup
