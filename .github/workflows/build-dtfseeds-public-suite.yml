name: Build DTFSeeds Public Suite

on:
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * *'
  push:
    branches:
      - main
    paths:
      - apps/high-land-web/**
      - apps/growlens-web/**
      - games/high-iq/**
      - games/high-life/**
      - games/grower-conversations/**
      - games/seed-man-platformer/**
      - games/strain-showdown/**
      - games/bud-or-bluff/**
      - games/protect-the-plants/**
      - site/public-route-patch/**
      - site/deployment/public-apps.json
      - .github/workflows/build-dtfseeds-public-suite.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-public-suite
  cancel-in-progress: true

jobs:
  build:
    name: Build deployable DTFSeeds public applications
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install master workspace
        run: npm ci

      - name: Validate self-hosted High IQ
        run: |
          set -euo pipefail
          node games/high-iq/scripts/validate-data.mjs
          test -s site/public-route-patch/games/high-iq/index.html
          test -s site/public-route-patch/games/high-iq/app.js
          test -s site/public-route-patch/games/high-iq/high-iq.css
          test -s site/public-route-patch/games/high-iq/data/manifest.json
          grep -Fq 'High IQ — Test Higher Cognition' site/public-route-patch/games/high-iq/index.html
          grep -Fq 'https://dtfseeds.com/games/high-iq/' site/public-route-patch/games/high-iq/index.html

      - name: Validate High Life browser prototype
        run: |
          set -euo pipefail
          node games/high-life/test/engine.test.mjs
          node --check site/public-route-patch/games/high-life/app.js
          cmp games/high-life/src/engine.mjs site/public-route-patch/games/high-life/engine.mjs
          cmp games/high-life/data/events.json site/public-route-patch/games/high-life/data/events.json
          test -s site/public-route-patch/games/high-life/index.html
          test -s site/public-route-patch/games/high-life/high-life.css
          grep -Fq 'https://dtfseeds.com/games/high-life/' site/public-route-patch/games/high-life/index.html

      - name: Validate Grower Conversations browser deck
        run: |
          set -euo pipefail
          node games/grower-conversations/scripts/validate-prompt-bank.mjs
          node --check site/public-route-patch/games/grower-conversations/app.js
          cmp games/grower-conversations/data/prompt-bank.json site/public-route-patch/games/grower-conversations/data/prompt-bank.json
          test -s site/public-route-patch/games/grower-conversations/index.html
          test -s site/public-route-patch/games/grower-conversations/grower-conversations.css
          grep -Fq 'https://dtfseeds.com/games/grower-conversations/' site/public-route-patch/games/grower-conversations/index.html

      - name: Validate Seed Man browser vertical slice
        run: |
          set -euo pipefail
          node games/seed-man-platformer/test/physics.test.mjs
          node --check site/public-route-patch/games/seed-man-platformer/app.js
          node --check site/public-route-patch/games/seed-man-platformer/physics.mjs
          cmp games/seed-man-platformer/src/physics.mjs site/public-route-patch/games/seed-man-platformer/physics.mjs
          cmp games/seed-man-platformer/data/level-01.json site/public-route-patch/games/seed-man-platformer/data/level-01.json
          test -s site/public-route-patch/games/seed-man-platformer/index.html
          test -s site/public-route-patch/games/seed-man-platformer/seed-man.css
          grep -Fq 'https://dtfseeds.com/games/seed-man-platformer/' site/public-route-patch/games/seed-man-platformer/index.html

      - name: Validate Strain Showdown browser prototype
        run: |
          set -euo pipefail
          node games/strain-showdown/scripts/validate-roster.mjs
          node games/strain-showdown/test/engine.test.mjs
          node games/strain-showdown/scripts/simulate-balance.mjs --seeds=32 --assert-balanced
          node games/strain-showdown/scripts/validate-browser-build.mjs
          node --check site/public-route-patch/games/strain-showdown/app.js
          test -s site/public-route-patch/games/strain-showdown/index.html

      - name: Validate Bud or Bluff multiplayer game
        run: |
          set -euo pipefail
          node games/bud-or-bluff/test/engine.test.mjs
          node games/bud-or-bluff/scripts/build-private-deck.mjs
          node --check site/public-route-patch/games/bud-or-bluff/app-v2.js
          node --check site/public-route-patch/games/bud-or-bluff/keyboard-v1.js
          php -l site/public-route-patch/games/bud-or-bluff/api-v2.php
          php -l site/public-route-patch/games/bud-or-bluff/deck.php
          node games/bud-or-bluff/test/online-lobby-v2.test.mjs
          test -s site/public-route-patch/games/bud-or-bluff/index.html

      - name: Validate Burn Buds multiplayer game
        run: |
          set -euo pipefail
          node games/protect-the-plants/test/burn-buds-branding.test.mjs
          node games/protect-the-plants/test/burn-buds-gameplay-v3.test.mjs
          node --check site/public-route-patch/games/protect-the-plants/app.js
          node --check site/public-route-patch/games/protect-the-plants/gameplay-v3.js
          node --check site/public-route-patch/games/protect-the-plants/burn-buds-branding.js
          php -l site/public-route-patch/games/protect-the-plants/api.php
          test -s site/public-route-patch/games/protect-the-plants/index.html

      - name: Test and build High Land
        run: |
          set -euo pipefail
          npm run test:high-land
          npm run build:high-land
          test -s apps/high-land-web/dist/index.html

      - name: Test and build GrowLens
        run: |
          set -euo pipefail
          npm run test:growlens
          npm run build:growlens
          test -s apps/growlens-web/dist/index.html
          test -d apps/growlens-web/dist/api

      - name: Build Weedopolis
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/weedopolis"
          git clone --depth=1 https://github.com/dtfgenetics/Weedopolis-strain-Edition.git "$repo"
          cd "$repo"
          npm install --ignore-scripts
          npm run validate
          npm run check:preview
          npm run build:preview
          test -s dist/weedopolis/index.html
          echo "WEEDOPOLIS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build THC Crossword
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/crossword"
          git clone --depth=1 https://github.com/dtfgenetics/Thc-crossword-.git "$repo"
          cd "$repo"
          npm install --ignore-scripts
          npm test
          npm run verify
          npm run build
          test -s dist/index.html
          test -d dist/puzzles
          echo "CROSSWORD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build Who Took It
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/who-took-it"
          git clone --depth=1 https://github.com/dtfgenetics/Thc-guess-who.git "$repo"
          cd "$repo/03_digital-game"
          npm install --ignore-scripts
          npm run validate
          npm run smoke
          npm run build
          test -s dist/index.html
          cd "$repo"
          echo "WHO_TOOK_IT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build THC Grow Doc
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/thc-grow-doc"
          git clone --depth=1 https://github.com/dtfgenetics/Thc-dataset.git "$repo"
          cd "$repo"
          npm ci
          npm run validate:sources
          npm run validate:acquisition
          npm run validate:transfer
          npm run check
          npm test
          php -l public/api/visual-observations.php
          npm run build
          test -s dist/index.html
          test -f dist/api/visual-observations.php
          echo "THC_GROW_DOC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Assemble one public release tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          cp -a site/public-route-patch/. release/

          mkdir -p release/games/high-land
          cp -a apps/high-land-web/dist/. release/games/high-land/

          mkdir -p release/growlens
          cp -a apps/growlens-web/dist/. release/growlens/

          mkdir -p release/games/weedopolis
          cp -a "$RUNNER_TEMP/weedopolis/dist/weedopolis/." release/games/weedopolis/

          mkdir -p release/games/crossword release/puzzles
          cp -a "$RUNNER_TEMP/crossword/dist/." release/games/crossword/
          cp -a "$RUNNER_TEMP/crossword/dist/puzzles/." release/puzzles/

          mkdir -p release/games/who-took-it
          cp -a "$RUNNER_TEMP/who-took-it/03_digital-game/dist/." release/games/who-took-it/

          mkdir -p release/thc-grow-doc
          cp -a "$RUNNER_TEMP/thc-grow-doc/dist/." release/thc-grow-doc/

          cat > release/dtf-build.json <<JSON
          {
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "master": "$GITHUB_SHA",
            "sources": {
              "highIq": "$GITHUB_SHA",
              "highLife": "$GITHUB_SHA",
              "growerConversations": "$GITHUB_SHA",
              "seedMan": "$GITHUB_SHA",
              "strainShowdown": "$GITHUB_SHA",
              "budOrBluff": "$GITHUB_SHA",
              "burnBuds": "$GITHUB_SHA",
              "highLand": "$GITHUB_SHA",
              "growLens": "$GITHUB_SHA",
              "weedopolis": "$WEEDOPOLIS_SHA",
              "crossword": "$CROSSWORD_SHA",
              "whoTookIt": "$WHO_TOOK_IT_SHA",
              "thcGrowDoc": "$THC_GROW_DOC_SHA"
            }
          }
          JSON

      - name: Verify release routes and base paths
        shell: bash
        run: |
          set -euo pipefail
          required=(
            release/games/index.html
            release/games/high-land/index.html
            release/games/high-iq/index.html
            release/games/high-iq/app.js
            release/games/high-iq/high-iq.css
            release/games/high-iq/data/manifest.json
            release/games/high-life/index.html
            release/games/high-life/app.js
            release/games/high-life/high-life.css
            release/games/high-life/engine.mjs
            release/games/high-life/data/events.json
            release/games/grower-conversations/index.html
            release/games/grower-conversations/app.js
            release/games/grower-conversations/grower-conversations.css
            release/games/grower-conversations/data/prompt-bank.json
            release/games/seed-man-platformer/index.html
            release/games/seed-man-platformer/app.js
            release/games/seed-man-platformer/seed-man.css
            release/games/seed-man-platformer/physics.mjs
            release/games/seed-man-platformer/data/level-01.json
            release/games/strain-showdown/index.html
            release/games/strain-showdown/app.js
            release/games/strain-showdown/engine.mjs
            release/games/strain-showdown/data/families.json
            release/games/bud-or-bluff/index.html
            release/games/bud-or-bluff/app-v2.js
            release/games/bud-or-bluff/api-v2.php
            release/games/bud-or-bluff/deck.php
            release/games/protect-the-plants/index.html
            release/games/protect-the-plants/app.js
            release/games/protect-the-plants/api.php
            release/games/weedopolis/index.html
            release/games/crossword/index.html
            release/games/who-took-it/index.html
            release/growlens/index.html
            release/thc-grow-doc/index.html
            release/thc-grow-doc/api/visual-observations.php
            release/tools/index.html
            release/projects/index.html
            release/puzzles/current.json
          )
          for file in "${required[@]}"; do test -s "$file"; done

          grep -Fq '/games/high-iq/' release/games/high-iq/index.html
          grep -Fq '/games/high-life/' release/games/high-life/index.html
          grep -Fq '/games/grower-conversations/' release/games/grower-conversations/index.html
          grep -Fq '/games/seed-man-platformer/' release/games/seed-man-platformer/index.html
          grep -Fq '/games/strain-showdown/' release/games/strain-showdown/index.html
          grep -Fq '/games/bud-or-bluff/' release/games/bud-or-bluff/index.html
          grep -Fq '/games/protect-the-plants/' release/games/protect-the-plants/index.html
          grep -Fq '/games/high-land/' release/games/high-land/index.html
          grep -Fq '/games/weedopolis/' release/games/weedopolis/index.html
          grep -Fq '/games/crossword/' release/games/crossword/index.html
          grep -Fq '/games/who-took-it/' release/games/who-took-it/index.html
          grep -Fq '/thc-grow-doc/' release/thc-grow-doc/index.html

          ! grep -RFiq 'email@email.com' release
          ! grep -RFiq '+123456789' release
          ! grep -RFiq 'Needed from owner' release
          ! grep -RFiq 'Reserved strain card' release

      - name: Report packaged applications
        shell: bash
        run: |
          {
            echo '## DTFSeeds public suite'
            echo ''
            echo '- /games/high-iq/ (self-hosted validated browser game)'
            echo '- /games/high-life/ (tested browser prototype)'
            echo '- /games/grower-conversations/ (96-card browser deck)'
            echo '- /games/seed-man-platformer/ (browser vertical slice)'
            echo '- /games/strain-showdown/ (solo card-battle prototype)'
            echo '- /games/bud-or-bluff/ (multiplayer party game)'
            echo '- /games/protect-the-plants/ (Burn Buds multiplayer strategy)'
            echo '- /games/high-land/'
            echo '- /games/weedopolis/'
            echo '- /games/crossword/'
            echo '- /games/who-took-it/'
            echo '- /growlens/'
            echo '- /thc-grow-doc/'
            echo '- /tools/'
            echo '- /projects/'
            echo '- /puzzles/current.json'
            echo ''
            echo 'Source revisions are stored in release/dtf-build.json.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public suite artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtfseeds-public-suite-${{ github.sha }}
          path: release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Report public-suite build to issue 63
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const body = [
              '## Public-suite package build',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: \`${context.sha}\``,
              `Event: **${context.eventName}**`,
              `Build result: **${process.env.JOB_STATUS}**`,
              '',
              process.env.JOB_STATUS === 'success'
                ? 'The complete DTFSeeds public suite built and validated successfully. A 30-day immutable artifact is attached to this workflow run and is ready for the production deployer once Hostinger SSH is available.'
                : 'The public-suite package did not complete successfully. Inspect this workflow run before attempting production deployment.',
              '',
              'Build scope: High IQ, High Life, Grower Conversations, Seed Man, Strain Showdown, Bud or Bluff, Burn Buds, High Land, Weedopolis, THC Crossword, Who Took It?, GrowLens, THC Grow Doc, Game Hub, Tools, Projects, and puzzle data.',
              'No Hostinger mutation is performed by this build-only workflow.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 63,
              body
            });
