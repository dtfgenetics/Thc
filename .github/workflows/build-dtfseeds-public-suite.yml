          grep -Fq '@media (forced-colors: active)' release/games/root-cause/root-cause-responsive-v3.css
          grep -Fq '/games/seed-man-platformer/' release/games/seed-man-platformer/index.html
          grep -Fq 'data-seed-man-release="20260909-v20-runtime-v4"' release/games/seed-man-platformer/index.html
          test ! -e release/games/seed-man-platformer/physics.mjs
          test ! -e release/games/seed-man-platformer/data/level-01.json
