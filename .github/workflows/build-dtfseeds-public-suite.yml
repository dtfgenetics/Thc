          grep -Fq "commit=$WEEDOPOLIS_SHA" release/games/weedopolis/source-revision.txt
          grep -Fq "\"weedopolis\": \"$WEEDOPOLIS_SHA\"" release/dtf-build.json
          grep -Fq '/games/crossword/' release/games/crossword/index.html
          grep -Fq "commit=$CROSSWORD_SHA" release/games/crossword/source-revision.txt
