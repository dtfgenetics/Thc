          grep -Fq '/games/who-took-it/' release/games/who-took-it/index.html
          grep -Fq 'repository=dtfgenetics/Thc-guess-who' release/games/who-took-it/source-revision.txt
          grep -Fq "commit=$WHO_TOOK_IT_SHA" release/games/who-took-it/source-revision.txt
          grep -Fq 'route=/games/who-took-it/' release/games/who-took-it/source-revision.txt
          grep -Fq "\"whoTookIt\": \"$WHO_TOOK_IT_SHA\"" release/dtf-build.json
          grep -Fq '/thc-grow-doc/' release/thc-grow-doc/index.html
          grep -Fq "commit=$THC_GROW_DOC_SHA" release/thc-grow-doc/source-revision.txt
          grep -Fq "\"thcGrowDoc\": \"$THC_GROW_DOC_SHA\"" release/dtf-build.json
          test -d release/thc-grow-doc/reference-media/crops
          test ! -e release/thc-grow-doc/reference-media/original
          test "$(find release/thc-grow-doc/reference-media/crops -type f | wc -l | tr -d ' ')" = "66"
          grep -Fq '25 playable browser games' release/games/index.html

          ! grep -RFiq 'email@email.com' release
          ! grep -RFiq '+123456789' release
          ! grep -RFiq 'Needed from owner' release
          ! grep -RFiq 'Reserved strain card' release

      - name: Report packaged applications
        shell: bash
        run: |
          {
            echo '## DTFSeeds public suite'
            echo ''
            echo '- 25 registered browser games via the canonical Game Hub'
            echo '- /games/high-iq/ (self-hosted validated browser game)'
            echo '- /games/high-life/ (tested browser prototype)'
            echo '- /games/grower-conversations/ (96-card browser deck)'
            echo '- /games/seed-man-platformer/ (canonical 20-level / 5-world v20 campaign)'
            echo '- /games/strain-showdown/ (solo card-battle prototype)'
            echo '- /games/bud-or-bluff/ (multiplayer party game)'
            echo '- /games/terpocalypse/ (validated browser vertical slice)'
            echo "- /games/phenoquest/ (canonical pinned $PHENOQUEST_SHA)"
            echo '- /games/protect-the-plants/ (Burn Buds multiplayer strategy)'
            echo '- /games/high-land/'
            echo "- /games/weedopolis/ (pinned $WEEDOPOLIS_SHA)"
            echo "- /games/crossword/ (canonical pinned $CROSSWORD_SHA)"
            echo "- /games/who-took-it/ (canonical pinned $WHO_TOOK_IT_SHA)"
            echo '- /growlens/'
            echo "- /thc-grow-doc/ (canonical pinned $THC_GROW_DOC_SHA)"
            echo '- /tools/'
            echo '- /projects/'
            echo '- /puzzles/current.json'
            echo ''
            echo 'All packaged HTML surfaces receive the approved DTF sitewide header during final release assembly.'
            echo 'Source revisions are stored in release/dtf-build.json.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public suite artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtfseeds-public-suite-${{ github.sha }}
          path: release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Report public-suite build to issue 63
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const body = [
              '## Public-suite package build',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: \`${context.sha}\``,
              `Event: **${context.eventName}**`,
              `Build result: **${process.env.JOB_STATUS}**`,
              '',
              process.env.JOB_STATUS === 'success'
                ? 'The complete DTFSeeds public suite built and validated successfully. A 30-day immutable artifact is attached to this workflow run and is ready for the production deployer.'
                : 'The public-suite package did not complete successfully. Inspect this workflow run before attempting production deployment.',
              '',
              'Build scope: the canonical 25-game Hub plus validated High IQ, High Life, Grower Conversations, Seed Man, Strain Showdown, Bud or Bluff, Terpocalypse, PhenoQuest, Burn Buds, High Land, Weedopolis, pinned THC Crossword, Who Took It?, GrowLens, THC Grow Doc, Tools, Projects, and puzzle data.',
              'No production mutation is performed by this build-only workflow.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 63,
              body
            });