          grep -Fq '/games/high-lines/' release/games/high-lines/index.html
          grep -Fq "import('./runtime.mjs')" release/games/high-lines/app.js
          cmp games/high-lines/src/engine.mjs release/games/high-lines/engine.mjs
          grep -Fq 'DTF GENETICS · CREATIVE ACTIVITY' release/games/high-lines/index.html
          grep -Fq 'top:calc(var(--dtf-global-header-height,74px) + 8px)' release/games/high-lines/high-lines-v2.css
          grep -Fq '/games/strain-match/' release/games/strain-match/index.html
          grep -Fq 'grid-template-columns:repeat(5,minmax(0,1fr))' release/games/strain-match/strain-match.css
          grep -Fq '@media(forced-colors:active)' release/games/strain-match/strain-match.css
          grep -Fq '/games/trichome-trials/' release/games/trichome-trials/index.html
          grep -Fq "import('./runtime.mjs')" release/games/trichome-trials/app.js
          cmp games/trichome-trials/src/engine.mjs release/games/trichome-trials/engine.mjs
          grep -Fq '.confidence-button{min-height:44px' release/games/trichome-trials/trichome-trials-v2.css
          grep -Fq '@media(forced-colors:active)' release/games/trichome-trials/trichome-trials-v2.css
          grep -Fq '/games/root-cause/' release/games/root-cause/index.html
          ! grep -Fq 'src="./engine.js"' release/games/root-cause/index.html
