name: Build DTFSeeds Public Suite

on:
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * *'
  pull_request:
    branches:
      - main
    paths:
      - site/public-route-patch/games/phenoquest/**
      - site/public-route-patch/games/crossword/source-revision.txt
      - scripts/validate-crossword-release-source.mjs
      - scripts/lib/sitewide-header-template-v6.mjs
      - scripts/apply-sitewide-header.mjs
      - .github/workflows/validate-crossword-release-source.yml
      - .github/workflows/build-dtfseeds-public-suite.yml
  push:
    branches:
      - main
    paths:
      - apps/high-land-web/**
      - apps/growlens-web/**
      - games/high-iq/**
      - games/high-life/**
      - games/grower-conversations/**
      - games/seed-man-platformer/**
      - games/strain-showdown/**
      - games/bud-or-bluff/**
      - games/protect-the-plants/**
      - site/public-route-patch/**
      - site/deployment/public-apps.json
      - data/public-navigation.json
      - scripts/validate-crossword-release-source.mjs
      - scripts/lib/sitewide-header-template-v6.mjs
      - scripts/apply-sitewide-header.mjs
      - .github/workflows/validate-crossword-release-source.yml
      - .github/workflows/build-dtfseeds-public-suite.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-public-suite-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build deployable DTFSeeds public applications
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install master workspace
        run: npm ci

      - name: Validate canonical public navigation before packaging
        run: |
          set -euo pipefail
          node scripts/validate-public-navigation.mjs
          grep -Fq '25 playable browser games' site/public-route-patch/games/index.html

      - name: Validate self-hosted High IQ
        run: |
          set -euo pipefail
          npm run hiq:validate
          test -s site/public-route-patch/games/high-iq/index.html
          test -s site/public-route-patch/games/high-iq/app-v3.js
          test -s site/public-route-patch/games/high-iq/game-core.mjs
          test -s site/public-route-patch/games/high-iq/high-iq.css
          test -s site/public-route-patch/games/high-iq/high-iq-v3-4.css
          test -s site/public-route-patch/games/high-iq/data/manifest.json
          grep -Fq 'High IQ — Test Higher Cognition' site/public-route-patch/games/high-iq/index.html
          grep -Fq 'https://dtfseeds.com/games/high-iq/' site/public-route-patch/games/high-iq/index.html

      - name: Validate High Life browser prototype
        run: |
          set -euo pipefail
          node games/high-life/test/engine.test.mjs
          node games/high-life/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/high-life/app.js
          cmp games/high-life/src/engine.mjs site/public-route-patch/games/high-life/engine.mjs
          cmp games/high-life/data/events.json site/public-route-patch/games/high-life/data/events.json
          test -s site/public-route-patch/games/high-life/index.html
          test -s site/public-route-patch/games/high-life/high-life.css
          grep -Fq 'https://dtfseeds.com/games/high-life/' site/public-route-patch/games/high-life/index.html

      - name: Validate Grower Conversations browser deck
        run: |
          set -euo pipefail
          node games/grower-conversations/scripts/validate-prompt-bank.mjs
          node games/grower-conversations/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/grower-conversations/app.js
          cmp games/grower-conversations/data/prompt-bank.json site/public-route-patch/games/grower-conversations/data/prompt-bank.json
          test -s site/public-route-patch/games/grower-conversations/index.html
          test -s site/public-route-patch/games/grower-conversations/grower-conversations.css
          test -s site/public-route-patch/games/grower-conversations/grower-conversations-v2.css
          grep -Fq 'https://dtfseeds.com/games/grower-conversations/' site/public-route-patch/games/grower-conversations/index.html

      - name: Validate Grow Room Defense browser game
        run: |
          set -euo pipefail
          node games/grow-room-defense/scripts/validate-data.mjs
          node games/grow-room-defense/test/engine.test.mjs
          node games/grow-room-defense/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/grow-room-defense/app.js
          node --check site/public-route-patch/games/grow-room-defense/runtime.mjs
          node --check site/public-route-patch/games/grow-room-defense/engine.mjs
          cmp games/grow-room-defense/src/engine.mjs site/public-route-patch/games/grow-room-defense/engine.mjs
          test -s site/public-route-patch/games/grow-room-defense/index.html
          test -s site/public-route-patch/games/grow-room-defense/grow-room-defense.css
          test -s site/public-route-patch/games/grow-room-defense/grow-room-defense-v2.css
          test -s site/public-route-patch/games/grow-room-defense/accessibility-v1.css
          grep -Fq 'https://dtfseeds.com/games/grow-room-defense/' site/public-route-patch/games/grow-room-defense/index.html

      - name: Validate Harvest Hustle browser game
        run: |
          set -euo pipefail
          node games/harvest-hustle/scripts/validate-data.mjs
          node games/harvest-hustle/test/engine.test.mjs
          node games/harvest-hustle/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/harvest-hustle/app.js
          node --check site/public-route-patch/games/harvest-hustle/runtime.mjs
          node --check site/public-route-patch/games/harvest-hustle/engine.mjs
          cmp games/harvest-hustle/src/engine.mjs site/public-route-patch/games/harvest-hustle/engine.mjs
          test -s site/public-route-patch/games/harvest-hustle/index.html
          test -s site/public-route-patch/games/harvest-hustle/harvest-hustle.css
          test -s site/public-route-patch/games/harvest-hustle/harvest-hustle-v2.css
          grep -Fq 'https://dtfseeds.com/games/harvest-hustle/' site/public-route-patch/games/harvest-hustle/index.html

      - name: Validate Root Cause browser game
        run: |
          set -euo pipefail
          node games/root-cause/scripts/validate-data.mjs
          node games/root-cause/test/engine.test.mjs
          node games/root-cause/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/root-cause/app.js
          node --check site/public-route-patch/games/root-cause/engine.js
          node --check site/public-route-patch/games/root-cause/engine.mjs
          cmp games/root-cause/src/engine.mjs site/public-route-patch/games/root-cause/engine.mjs
          test -s site/public-route-patch/games/root-cause/index.html
          test -s site/public-route-patch/games/root-cause/root-cause.css
          test -s site/public-route-patch/games/root-cause/root-cause-v2.css
          test -s site/public-route-patch/games/root-cause/root-cause-responsive-v3.css
          grep -Fq 'https://dtfseeds.com/games/root-cause/' site/public-route-patch/games/root-cause/index.html

      - name: Validate Mystery Strain browser game
        run: |
          set -euo pipefail
          node games/mystery-strain/scripts/validate-data.mjs
          node games/mystery-strain/test/engine.test.mjs
          node games/mystery-strain/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/mystery-strain/app.js
          node --check site/public-route-patch/games/mystery-strain/runtime.mjs
          node --check site/public-route-patch/games/mystery-strain/engine.mjs
          cmp games/mystery-strain/src/engine.mjs site/public-route-patch/games/mystery-strain/engine.mjs
          test -s site/public-route-patch/games/mystery-strain/index.html
          test -s site/public-route-patch/games/mystery-strain/mystery-strain.css
          test -s site/public-route-patch/games/mystery-strain/analysis.css
          test -s site/public-route-patch/games/mystery-strain/guess-confirm-v2.css
          grep -Fq 'https://dtfseeds.com/games/mystery-strain/' site/public-route-patch/games/mystery-strain/index.html

      - name: Validate Pheno Draft browser game
        run: |
          set -euo pipefail
          node games/pheno-draft/scripts/validate-data.mjs
          node games/pheno-draft/test/engine.test.mjs
          node games/pheno-draft/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/pheno-draft/app.js
          node --check site/public-route-patch/games/pheno-draft/runtime.mjs
          node --check site/public-route-patch/games/pheno-draft/engine.mjs
          cmp games/pheno-draft/src/engine.mjs site/public-route-patch/games/pheno-draft/engine.mjs
          test -s site/public-route-patch/games/pheno-draft/index.html
          test -s site/public-route-patch/games/pheno-draft/pheno-draft.css
          test -s site/public-route-patch/games/pheno-draft/pheno-draft-v2.css
          grep -Fq 'https://dtfseeds.com/games/pheno-draft/' site/public-route-patch/games/pheno-draft/index.html

      - name: Validate High Lines browser game
        run: |
          set -euo pipefail
          node games/high-lines/scripts/validate-data.mjs
          node games/high-lines/test/engine.test.mjs
          node games/high-lines/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/high-lines/app.js
          node --check site/public-route-patch/games/high-lines/runtime.mjs
          node --check site/public-route-patch/games/high-lines/engine.mjs
          cmp games/high-lines/src/engine.mjs site/public-route-patch/games/high-lines/engine.mjs
          test -s site/public-route-patch/games/high-lines/index.html
          test -s site/public-route-patch/games/high-lines/high-lines.css
          test -s site/public-route-patch/games/high-lines/high-lines-v2.css
          grep -Fq 'https://dtfseeds.com/games/high-lines/' site/public-route-patch/games/high-lines/index.html

      - name: Validate Trichome Trials browser game
        run: |
          set -euo pipefail
          node games/trichome-trials/scripts/validate-data.mjs
          node games/trichome-trials/test/engine.test.mjs
          node games/trichome-trials/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/trichome-trials/app.js
          node --check site/public-route-patch/games/trichome-trials/runtime.mjs
          node --check site/public-route-patch/games/trichome-trials/engine.mjs
          cmp games/trichome-trials/src/engine.mjs site/public-route-patch/games/trichome-trials/engine.mjs
          test -s site/public-route-patch/games/trichome-trials/index.html
          test -s site/public-route-patch/games/trichome-trials/trichome-trials.css
          test -s site/public-route-patch/games/trichome-trials/trichome-trials-v2.css
          test -s site/public-route-patch/games/trichome-trials/confidence.css
          grep -Fq 'https://dtfseeds.com/games/trichome-trials/' site/public-route-patch/games/trichome-trials/index.html

      - name: Validate Grow Room Bingo browser game
        run: |
          set -euo pipefail
          node games/grow-room-bingo/scripts/validate-data.mjs
          node games/grow-room-bingo/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/grow-room-bingo/app.js
          node --check site/public-route-patch/games/grow-room-bingo/keyboard-nav.js
          test -s site/public-route-patch/games/grow-room-bingo/index.html
          test -s site/public-route-patch/games/grow-room-bingo/bingo.css
          grep -Fq 'https://dtfseeds.com/games/grow-room-bingo/' site/public-route-patch/games/grow-room-bingo/index.html

      - name: Validate Lost in the Terps browser game
        run: |
          set -euo pipefail
          node games/lost-in-the-terps/scripts/validate-data.mjs
          node games/lost-in-the-terps/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/lost-in-the-terps/app.js
          node --check site/public-route-patch/games/lost-in-the-terps/keyboard-nav-v1.js
          test -s site/public-route-patch/games/lost-in-the-terps/index.html
          test -s site/public-route-patch/games/lost-in-the-terps/terps.css
          grep -Fq 'https://dtfseeds.com/games/lost-in-the-terps/' site/public-route-patch/games/lost-in-the-terps/index.html

      - name: Validate Strain Match browser game
        run: |
          set -euo pipefail
          node games/strain-match/scripts/validate-data.mjs
          node games/strain-match/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/strain-match/app.js
          test -s site/public-route-patch/games/strain-match/index.html
          test -s site/public-route-patch/games/strain-match/strain-match.css
          test -s site/public-route-patch/games/strain-match/strain-match-v2.css
          grep -Fq 'https://dtfseeds.com/games/strain-match/' site/public-route-patch/games/strain-match/index.html

      - name: Validate Spin the Strain browser game
        run: |
          set -euo pipefail
          node games/spin-the-strain/scripts/validate-data.mjs
          node games/spin-the-strain/test/engine.test.mjs
          node games/spin-the-strain/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/spin-the-strain/app.js
          node --check site/public-route-patch/games/spin-the-strain/runtime.mjs
          node --check site/public-route-patch/games/spin-the-strain/engine.mjs
          cmp games/spin-the-strain/src/engine.mjs site/public-route-patch/games/spin-the-strain/engine.mjs
          test -s site/public-route-patch/games/spin-the-strain/index.html
          test -s site/public-route-patch/games/spin-the-strain/spin-the-strain.css
          grep -Fq 'https://dtfseeds.com/games/spin-the-strain/' site/public-route-patch/games/spin-the-strain/index.html

      - name: Validate Grow Room Defense canonical browser runtime
        run: |
          set -euo pipefail
          node games/grow-room-defense/scripts/validate-data.mjs
          node games/grow-room-defense/test/engine.test.mjs
          node games/grow-room-defense/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/grow-room-defense/app.js
          node --check site/public-route-patch/games/grow-room-defense/runtime.mjs
          node --check site/public-route-patch/games/grow-room-defense/engine.mjs
          test -s site/public-route-patch/games/grow-room-defense/index.html
          test -s site/public-route-patch/games/grow-room-defense/grow-room-defense.css
          test -s site/public-route-patch/games/grow-room-defense/grow-room-defense-v2.css
          test -s site/public-route-patch/games/grow-room-defense/accessibility-v1.css
          test -s site/public-route-patch/games/grow-room-defense/accessibility-v1.js

      - name: Validate Grow Room Bingo browser runtime
        run: |
          set -euo pipefail
          node games/grow-room-bingo/scripts/validate-data.mjs
          node games/grow-room-bingo/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/grow-room-bingo/app.js
          node --check site/public-route-patch/games/grow-room-bingo/keyboard-nav.js
          test -s site/public-route-patch/games/grow-room-bingo/index.html
          test -s site/public-route-patch/games/grow-room-bingo/bingo.css
          test -s site/public-route-patch/games/grow-room-bingo/data/prompts.json

      - name: Validate Lost in the Terps browser runtime
        run: |
          set -euo pipefail
          node games/lost-in-the-terps/scripts/validate-data.mjs
          node games/lost-in-the-terps/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/lost-in-the-terps/app.js
          node --check site/public-route-patch/games/lost-in-the-terps/keyboard-nav-v1.js
          test -s site/public-route-patch/games/lost-in-the-terps/index.html
          test -s site/public-route-patch/games/lost-in-the-terps/terps.css
          test -s site/public-route-patch/games/lost-in-the-terps/data/puzzles.json

      - name: Validate Mystery Strain canonical browser runtime
        run: |
          set -euo pipefail
          node games/mystery-strain/scripts/validate-data.mjs
          node games/mystery-strain/test/engine.test.mjs
          node games/mystery-strain/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/mystery-strain/app.js
          node --check site/public-route-patch/games/mystery-strain/runtime.mjs
          node --check site/public-route-patch/games/mystery-strain/engine.mjs
          node --check site/public-route-patch/games/mystery-strain/guess-confirm-v2.js
          test -s site/public-route-patch/games/mystery-strain/index.html
          test -s site/public-route-patch/games/mystery-strain/mystery-strain.css
          test -s site/public-route-patch/games/mystery-strain/analysis.css
          test -s site/public-route-patch/games/mystery-strain/guess-confirm-v2.css

      - name: Validate Pheno Draft canonical browser runtime
        run: |
          set -euo pipefail
          node games/pheno-draft/scripts/validate-data.mjs
          node games/pheno-draft/test/engine.test.mjs
          node games/pheno-draft/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/pheno-draft/app.js
          node --check site/public-route-patch/games/pheno-draft/runtime.mjs
          node --check site/public-route-patch/games/pheno-draft/engine.mjs
          test -s site/public-route-patch/games/pheno-draft/index.html
          test -s site/public-route-patch/games/pheno-draft/pheno-draft.css
          test -s site/public-route-patch/games/pheno-draft/pheno-draft-v2.css

      - name: Validate High Lines canonical browser runtime
        run: |
          set -euo pipefail
          node games/high-lines/scripts/validate-data.mjs
          node games/high-lines/test/engine.test.mjs
          node games/high-lines/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/high-lines/app.js
          node --check site/public-route-patch/games/high-lines/runtime.mjs
          node --check site/public-route-patch/games/high-lines/engine.mjs
          test -s site/public-route-patch/games/high-lines/index.html
          test -s site/public-route-patch/games/high-lines/high-lines.css
          test -s site/public-route-patch/games/high-lines/high-lines-v2.css
          test -s site/public-route-patch/games/high-lines/data/scenes.json

      - name: Validate Strain Match browser runtime
        run: |
          set -euo pipefail
          node games/strain-match/scripts/validate-data.mjs
          node games/strain-match/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/strain-match/app.js
          test -s site/public-route-patch/games/strain-match/index.html
          test -s site/public-route-patch/games/strain-match/strain-match.css
          test -s site/public-route-patch/games/strain-match/strain-match-v2.css
          test -s site/public-route-patch/games/strain-match/data/decks.json

      - name: Validate Trichome Trials canonical browser runtime
        run: |
          set -euo pipefail
          node games/trichome-trials/scripts/validate-data.mjs
          node games/trichome-trials/test/engine.test.mjs
          node games/trichome-trials/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/trichome-trials/app.js
          node --check site/public-route-patch/games/trichome-trials/runtime.mjs
          node --check site/public-route-patch/games/trichome-trials/engine.mjs
          test -s site/public-route-patch/games/trichome-trials/index.html
          test -s site/public-route-patch/games/trichome-trials/trichome-trials.css
          test -s site/public-route-patch/games/trichome-trials/trichome-trials-v2.css
          test -s site/public-route-patch/games/trichome-trials/confidence.css
          test -s site/public-route-patch/games/trichome-trials/frost-layout.css

      - name: Validate Root Cause canonical browser runtime
        run: |
          set -euo pipefail
          node games/root-cause/scripts/validate-data.mjs
          node games/root-cause/test/engine.test.mjs
          node games/root-cause/test/public-runtime.test.mjs
          node --check site/public-route-patch/games/root-cause/app.js
          node --check site/public-route-patch/games/root-cause/runtime.mjs
          node --check site/public-route-patch/games/root-cause/engine.mjs
          test -s site/public-route-patch/games/root-cause/index.html
          test -s site/public-route-patch/games/root-cause/root-cause.css
          test -s site/public-route-patch/games/root-cause/root-cause-v2.css
          test -s site/public-route-patch/games/root-cause/root-cause-responsive-v3.css
          test ! -e site/public-route-patch/games/root-cause/engine-browser-required.marker

      - name: Validate Seed Man v20 campaign
        run: |
          set -euo pipefail
          npm install --prefix games/seed-man-platformer --ignore-scripts --no-audit --no-fund
          npm run --prefix games/seed-man-platformer build:three-public
          node games/seed-man-platformer/test/physics.test.mjs
          node games/seed-man-platformer/test/progression-systems.test.mjs
          node games/seed-man-platformer/test/campaign.test.mjs
          node games/seed-man-platformer/test/public-runtime.test.mjs
          node games/seed-man-platformer/test/public-campaign.test.mjs
          node scripts/verify-seed-man-production-v20.mjs
          node scripts/validate-seed-man-production-bundle.mjs
          test -s site/public-route-patch/games/seed-man-platformer/index.html
          test -s site/public-route-patch/games/seed-man-platformer/seed-man.css
          grep -Fq 'https://dtfseeds.com/games/seed-man-platformer/' site/public-route-patch/games/seed-man-platformer/index.html

      - name: Validate Strain Showdown browser prototype
        run: |
          set -euo pipefail
          node games/strain-showdown/scripts/validate-roster.mjs
          node games/strain-showdown/test/engine.test.mjs
          node games/strain-showdown/scripts/simulate-balance.mjs --seeds=32 --assert-balanced
          node games/strain-showdown/scripts/validate-browser-build.mjs
          node --check site/public-route-patch/games/strain-showdown/app.js
          test -s site/public-route-patch/games/strain-showdown/index.html

      - name: Validate Bud or Bluff multiplayer game
        run: |
          set -euo pipefail
          root=site/public-route-patch/games/bud-or-bluff
          node games/bud-or-bluff/test/engine.test.mjs
          node games/bud-or-bluff/scripts/build-private-deck.mjs
          node games/bud-or-bluff/test/keyboard-v1.test.mjs
          node games/bud-or-bluff/test/visual-state-v3.test.mjs
          node games/bud-or-bluff/test/online-lobby.test.mjs
          node games/bud-or-bluff/test/online-lobby-v2.test.mjs
          node --check "$root/app.js"
          node --check "$root/app-v2.js"
          node --check "$root/player-pref-v1.js"
          node --check "$root/keyboard-v1.js"
          node --check "$root/visual-state-v3.js"
          php -l "$root/api.php"
          php -l "$root/api-v2.php"
          php -l "$root/api-v3.php"
          php -l "$root/deck.php"
          for asset in index.html styles.css v2.css visual-state-v3.css app-v2.js api-v2.php api-v3.php .htaccess keyboard-v1.js visual-state-v3.js; do
            test -s "$root/$asset"
          done
          grep -Fq 'RewriteRule ^api-v2\.php$ api-v3.php [L]' "$root/.htaccess"
