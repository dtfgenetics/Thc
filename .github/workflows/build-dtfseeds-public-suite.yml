      - name: Build pinned Weedopolis
        shell: bash
        run: |
          set -euo pipefail
          revision_file="site/public-route-patch/games/weedopolis/source-revision.txt"
          test -s "$revision_file"
          repo_name="$(sed -n 's/^repository=//p' "$revision_file")"
          revision="$(sed -n 's/^commit=//p' "$revision_file")"
          test "$repo_name" = "dtfgenetics/Weedopolis-strain-Edition"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]

          repo="$RUNNER_TEMP/weedopolis"
          git init "$repo"
          cd "$repo"
          git remote add origin "https://github.com/${repo_name}.git"
          git fetch --depth=1 origin "$revision"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$revision"

          npm install --ignore-scripts
          npm run validate
          npm run check:preview
          npm run build:preview

          required=(
            dist/weedopolis/index.html
            dist/weedopolis/styles.css
            dist/weedopolis/approved-assets.css
            dist/weedopolis/runtime-assets.css
            dist/weedopolis/master-board-overlay.css
            dist/weedopolis/js/weedopolis-edition.js
            dist/weedopolis/js/weedopolis-master-overrides.js
            dist/weedopolis/js/weedopolis-assets.js
            dist/weedopolis/js/weedopolis-engine.js
            dist/weedopolis/js/weedopolis-ui.js
            dist/weedopolis/assets/board/weedopolis-master-board.webp
          )
          for file in "${required[@]}"; do test -s "$file"; done
          grep -Fq 'data-ui-standard="premium-responsive-shell-v1"' dist/weedopolis/index.html
          grep -Fq 'data-art-standard="weedopolis-v1-master"' dist/weedopolis/index.html
          grep -Fq 'assets/board/weedopolis-master-board.webp' dist/weedopolis/master-board-overlay.css
          node --check dist/weedopolis/js/weedopolis-edition.js
          node --check dist/weedopolis/js/weedopolis-master-overrides.js
          node --check dist/weedopolis/js/weedopolis-assets.js
          node --check dist/weedopolis/js/weedopolis-engine.js
          node --check dist/weedopolis/js/weedopolis-ui.js
          test ! -e dist/weedopolis/js/weedopolis-tests.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const board = fs.readFileSync('dist/weedopolis/assets/board/weedopolis-master-board.webp');
          if (board.length < 30000) throw new Error(`master board too small: ${board.length}`);
          if (board.subarray(0,4).toString('ascii') !== 'RIFF' || board.subarray(8,12).toString('ascii') !== 'WEBP') {
            throw new Error('master board failed RIFF/WEBP signature validation');
          }
          console.log(`Pinned Weedopolis master board verified: ${board.length} bytes`);
          NODE
          echo "WEEDOPOLIS_SHA=$revision" >> "$GITHUB_ENV"

