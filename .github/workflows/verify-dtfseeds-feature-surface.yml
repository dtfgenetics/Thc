name: Verify DTFSeeds Feature Surface

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-dtfseeds-feature-surface
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://dtfseeds.com
    steps:
      - name: Checkout verification source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate registry-backed audit plan
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-dtfseeds-feature-surface.mjs
          node scripts/verify-dtfseeds-feature-surface.mjs --plan-only > "$RUNNER_TEMP/dtf-feature-plan.json"
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/dtf-feature-plan.json', 'utf8'));
          if (!Array.isArray(plan.routes) || plan.routes.length < 6) throw new Error('Feature plan is unexpectedly small.');
          const routes = new Set(plan.routes.map(row => row.route));
          for (const required of ['/projects/','/games/terpocalypse/','/games/phenoquest/','/games/kush-kings-chess/','/atlas/']) {
            if (!routes.has(required)) throw new Error(`Registry-backed audit plan is missing ${required}`);
          }
          console.log(`Validated ${plan.routes.length} public feature routes from the registry.`);
          NODE

      - name: Audit registry-backed production routes from fresh runner
        id: live
        shell: bash
        env:
          DTF_FEATURE_REPORT: ${{ runner.temp }}/dtf-feature-surface.json
        run: |
          set -euo pipefail
          node scripts/verify-dtfseeds-feature-surface.mjs

      - name: Report feature surface audit
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ runner.temp }}/dtf-feature-surface.json
          AUDIT_OUTCOME: ${{ steps.live.outcome }}
        with:
          script: |
            const fs = require('fs');
            let report = null;
            try {
              report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
            } catch (error) {
              core.warning(`Feature audit report was unavailable: ${error.message}`);
            }
            const rows = Array.isArray(report?.rows) ? report.rows : [];
            const table = rows.map(row =>
              `| ${row.kind || '?'} | \`${row.route || '?'}\` | ${row.status || '000'} | ${row.markerSeen ? 'yes' : 'no'} | ${row.routeIdentity ? 'yes' : 'no'} | ${row.bytes || 0} | **${row.ok ? 'PASS' : 'MISSING/BROKEN'}** | ${row.finalUrl || '-'} |`
            );
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 220,
                body: [
                  '## DTFSeeds registry-backed feature surface audit',
                  '',
                  `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  `Audit execution: **${process.env.AUDIT_OUTCOME || 'unknown'}**`,
                  `Routes audited: **${report?.total ?? 0}**`,
                  `Current-content failures: **${report?.failures ?? 'unknown'}**`,
                  '',
                  '| Type | Route | HTTP | Marker | Route identity | Bytes | Result | Final URL |',
                  '|---|---|---:|---|---|---:|---|---|',
                  ...(table.length ? table : ['| - | - | ? | ? | ? | ? | **MISSING/BROKEN** | - |']),
                  '',
                  'Read-only fresh-runner audit generated from data/public-navigation.json. Public routes must return their own canonical path and durable route identity marker; a redirect to a hub cannot pass.'
                ].join('\n')
              });
            } catch (error) {
              core.warning(`Could not post feature-surface result: ${error.message}`);
            }
