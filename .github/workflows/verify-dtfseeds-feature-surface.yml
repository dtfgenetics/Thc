name: Verify DTFSeeds Feature Surface

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-dtfseeds-feature-surface.mjs'
      - 'data/public-navigation.json'
      - '.github/workflows/verify-dtfseeds-feature-surface.yml'
  workflow_run:
    workflows: [DTFSeeds Production Gateway]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-dtfseeds-feature-surface
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://dtfseeds.com
    steps:
      - name: Checkout verification source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate registry-backed audit plan
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-dtfseeds-feature-surface.mjs
          node scripts/verify-dtfseeds-feature-surface.mjs --plan-only > "$RUNNER_TEMP/dtf-feature-plan.json"
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/dtf-feature-plan.json', 'utf8'));
          if (!Array.isArray(plan.routes) || plan.routes.length < 6) throw new Error('Feature plan is unexpectedly small.');
          const routes = new Set(plan.routes.map(row => row.route));
          for (const required of ['/projects/','/games/terpocalypse/','/games/phenoquest/','/games/kush-kings-chess/','/atlas/']) {
            if (!routes.has(required)) throw new Error(`Registry-backed audit plan is missing ${required}`);
          }
          console.log(`Validated ${plan.routes.length} public feature routes from the registry.`);
          NODE

      - name: Audit registry-backed production routes from fresh runner
        id: live
        shell: bash
        env:
          DTF_FEATURE_REPORT: ${{ runner.temp }}/dtf-feature-surface.json
        run: |
          set -euo pipefail
          node scripts/verify-dtfseeds-feature-surface.mjs

      - name: Upload route-level verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-feature-surface-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dtf-feature-plan.json
            ${{ runner.temp }}/dtf-feature-surface.json
          if-no-files-found: warn
          retention-days: 30

      - name: Write authoritative feature-surface summary
        if: always()
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/dtf-feature-surface.json
          AUDIT_OUTCOME: ${{ steps.live.outcome }}
          VERIFIED_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = process.env.REPORT_PATH;
          let report = null;
          try { report = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
          const rows = Array.isArray(report?.rows) ? report.rows : [];
          const failed = rows.filter(row => !row.ok);
          const lines = [
            '## DTFSeeds registry-backed feature surface audit',
            '',
            `Run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            `Verified source: \`${process.env.VERIFIED_REF || 'unknown'}\``,
            `Audit execution: **${process.env.AUDIT_OUTCOME || 'unknown'}**`,
            `Routes audited: **${report?.total ?? 0}**`,
            `Current-content failures: **${report?.failures ?? 'unknown'}**`,
            '',
            'The Actions artifact is the authoritative route-level evidence. A route passes only with 2xx status, its own canonical path, sufficient response body, and its durable registry marker.'
          ];
          if (failed.length) {
            lines.push('', '### Failing routes');
            for (const row of failed.slice(0, 30)) {
              lines.push(`- \`${row.route || '?'}\` — HTTP ${row.status || '000'}, marker=${row.markerSeen ? 'yes' : 'no'}, identity=${row.routeIdentity ? 'yes' : 'no'}, error=${row.error || '-'}`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
