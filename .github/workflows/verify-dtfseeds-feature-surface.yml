name: Verify DTFSeeds Feature Surface

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-dtfseeds-feature-surface
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: https://dtfseeds.com
    steps:
      - name: Audit advertised production routes from fresh runner
        id: live
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/dtf-feature-surface.tsv"
          : > "$out"
          failures=0
          total=0

          check_route() {
            local path="$1"
            local marker="$2"
            local class="$3"
            local body="$RUNNER_TEMP/feature-$(printf '%s' "$path" | tr '/?' '__').html"
            local status='000'
            local final_url=''
            local marker_seen='no'
            local ok='no'
            local bytes=0

            total=$((total+1))
            for attempt in 1 2 3 4; do
              token="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
              status="$(curl -4 -sS -L \
                --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 45 \
                -o "$body" -w '%{http_code}' \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                -H 'User-Agent: DTFSeeds-Feature-Audit/2.2' \
                "$SITE${path}?dtf_feature_audit=${token}" || printf '000')"
              final_url="$(curl -4 -sS -L -o /dev/null -w '%{url_effective}' \
                --connect-timeout 15 --max-time 45 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "$SITE${path}?dtf_feature_audit_url=${token}" || true)"
              bytes="$(wc -c < "$body" 2>/dev/null | tr -d ' ' || printf '0')"
              marker_seen='no'
              if grep -Fqi -- "$marker" "$body" 2>/dev/null; then marker_seen='yes'; fi
              if [[ "$status" =~ ^2[0-9][0-9]$ ]] && [[ "$marker_seen" == 'yes' ]] && [[ "$bytes" -gt 400 ]]; then
                ok='yes'
                break
              fi
              sleep 3
            done

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$class" "$path" "$status" "$marker_seen" "$bytes" "$ok" "$final_url" >> "$out"
            if [[ "$ok" != 'yes' ]]; then failures=$((failures+1)); fi
          }

          check_route '/games/' 'Pick what is playable. See what is coming next.' 'hub'
          check_route '/tools/' 'Measure it. Document it. Diagnose with context.' 'hub'
          check_route '/projects/' 'One place to see what is live now and what we are building next.' 'hub'
          check_route '/growlens/' 'GrowLens' 'tool'
          check_route '/thc-grow-doc/' 'Grow Doc' 'tool'
          check_route '/games/high-iq/' 'High IQ' 'game'
          check_route '/games/high-life/' 'High Life' 'game'
          check_route '/games/seed-man-platformer/' 'Seed Man' 'game'
          check_route '/games/grower-conversations/' 'Grower Conversations' 'game'
          check_route '/games/high-land/' 'High Land' 'game'
          check_route '/games/weedopolis/' 'Weedopolis' 'game'
          check_route '/games/crossword/' 'Crossword' 'game'
          check_route '/games/who-took-it/' 'Who Took It' 'game'
          check_route '/games/thc-u-know/' 'THC U Know' 'multiplayer'
          check_route '/games/kush-kings-chess/' 'Kush Kings' 'multiplayer'

          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          {
            echo 'rows<<DTF_ROWS_EOF'
            cat "$out"
            echo 'DTF_ROWS_EOF'
          } >> "$GITHUB_OUTPUT"
          cat "$out"
          [[ "$total" -eq 15 ]] || { echo "Expected 15 routes, audited $total" >&2; exit 1; }
          exit 0

      - name: Report feature surface audit
        if: always()
        uses: actions/github-script@v7
        env:
          ROWS: ${{ steps.live.outputs.rows }}
          TOTAL: ${{ steps.live.outputs.total }}
          FAILURES: ${{ steps.live.outputs.failures }}
          AUDIT_OUTCOME: ${{ steps.live.outcome }}
        with:
          script: |
            const lines = String(process.env.ROWS || '').trim().split(/\r?\n/).filter(Boolean);
            const rows = lines.map(line => {
              const [kind,path,status,marker,bytes,ok,finalUrl] = line.split('\t');
              return `| ${kind || '?'} | \`${path || '?'}\` | ${status || '?'} | ${marker || '?'} | ${bytes || '?'} | **${ok === 'yes' ? 'PASS' : 'MISSING/BROKEN'}** | ${finalUrl || '-'} |`;
            });
            const total = Number(process.env.TOTAL || 0);
            const failures = Number(process.env.FAILURES || 0);
            const complete = total === 15 && rows.length === 15;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## DTFSeeds feature surface audit',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Audit execution: **${process.env.AUDIT_OUTCOME || 'unknown'}**`,
                `Routes audited: **${total}/15**`,
                `Report completeness: **${complete ? 'complete' : 'INCOMPLETE'}**`,
                `Advertised routes failing current-content checks: **${failures}**`,
                '',
                '| Type | Route | HTTP | Marker | Bytes | Result | Final URL |',
                '|---|---|---:|---|---:|---|---|',
                ...(rows.length ? rows : ['| - | - | ? | ? | ? | **MISSING/BROKEN** | - |']),
                '',
                'Read-only fresh-runner audit. It includes both public multiplayer routes and checks the current visual-system hub headlines rather than retired copy.'
              ].join('\n')
            });
            if (!complete) core.setFailed(`Feature audit report is incomplete: ${total}/15 routes, ${rows.length} rows.`);
