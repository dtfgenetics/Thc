name: Verify DTFSeeds Feature Surface

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-dtfseeds-feature-surface
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: https://dtfseeds.com
    steps:
      - name: Audit advertised production routes from fresh runner
        id: live
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/dtf-feature-surface.tsv"
          : > "$out"
          failures=0

          check_route() {
            local path="$1"
            local marker="$2"
            local class="$3"
            local body="$RUNNER_TEMP/feature-$(printf '%s' "$path" | tr '/?' '__').html"
            local headers="$RUNNER_TEMP/feature-headers-$(printf '%s' "$path" | tr '/?' '__').txt"
            local status='000'
            local final_url=''
            local marker_seen='no'
            local ok='no'
            local bytes=0

            for attempt in 1 2 3 4; do
              token="${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
              status="$(curl -4 -sS -L \
                --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 45 \
                -D "$headers" -o "$body" -w '%{http_code}' \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                -H 'User-Agent: DTFSeeds-Feature-Audit/1.0' \
                "$SITE${path}?dtf_feature_audit=${token}" || printf '000')"
              final_url="$(curl -4 -sS -L -o /dev/null -w '%{url_effective}' \
                --connect-timeout 15 --max-time 45 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "$SITE${path}?dtf_feature_audit_url=${token}" || true)"
              bytes="$(wc -c < "$body" 2>/dev/null | tr -d ' ' || printf '0')"
              marker_seen='no'
              if grep -Fqi -- "$marker" "$body" 2>/dev/null; then marker_seen='yes'; fi
              if [[ "$status" =~ ^2[0-9][0-9]$ ]] && [[ "$marker_seen" == 'yes' ]] && [[ "$bytes" -gt 400 ]]; then
                ok='yes'
                break
              fi
              sleep 4
            done

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$class" "$path" "$status" "$marker_seen" "$bytes" "$ok" "$final_url" "$marker" >> "$out"
            if [[ "$ok" != 'yes' ]]; then failures=$((failures+1)); fi
          }

          check_route '/games/' 'Original cannabis games built to play, learn, compete, and share.' 'hub'
          check_route '/tools/' 'Practical tools built around observation, records, and evidence.' 'hub'
          check_route '/projects/' 'One place to see what is playable, usable, and still being built.' 'hub'
          check_route '/growlens/' 'GrowLens' 'tool'
          check_route '/thc-grow-doc/' 'Grow Doc' 'tool'
          check_route '/games/high-iq/' 'High IQ' 'game'
          check_route '/games/high-life/' 'High Life' 'game'
          check_route '/games/seed-man-platformer/' 'Seed Man' 'game'
          check_route '/games/grower-conversations/' 'Grower Conversations' 'game'
          check_route '/games/high-land/' 'High Land' 'game'
          check_route '/games/weedopolis/' 'Weedopolis' 'game'
          check_route '/games/crossword/' 'Crossword' 'game'
          check_route '/games/who-took-it/' 'Who Took It' 'game'

          echo "report=$out" >> "$GITHUB_OUTPUT"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          cat "$out"
          exit 0

      - name: Report feature surface audit
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.live.outputs.report }}
          FAILURES: ${{ steps.live.outputs.failures }}
        with:
          script: |
            const fs = require('fs');
            const rows = [];
            if (process.env.REPORT && fs.existsSync(process.env.REPORT)) {
              for (const line of fs.readFileSync(process.env.REPORT, 'utf8').trim().split(/\r?\n/)) {
                if (!line) continue;
                const [kind,path,status,marker,bytes,ok,finalUrl,expected] = line.split('\t');
                rows.push(`| ${kind} | \`${path}\` | ${status || '?'} | ${marker || '?'} | ${bytes || '?'} | **${ok === 'yes' ? 'PASS' : 'MISSING/BROKEN'}** | ${finalUrl || '-'} |`);
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## DTFSeeds feature surface audit',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Advertised routes failing current-content checks: **${process.env.FAILURES || '0'}**`,
                '',
                '| Type | Route | HTTP | Marker | Bytes | Result | Final URL |',
                '|---|---|---:|---|---:|---|---|',
                ...(rows.length ? rows : ['| - | - | ? | ? | ? | **MISSING/BROKEN** | - |']),
                '',
                'Read-only fresh-runner audit. It does not mutate WordPress, Hostinger, repository files, caches, or app state. Routes are checked against the public products currently advertised in the source-controlled Games, Tools, and Projects hubs.'
              ].join('\n')
            });
