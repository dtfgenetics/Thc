name: Seed Man Production Bundle Validation

on:
  push:
    branches: [main]
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'scripts/verify-seed-man-production-v20.mjs'
      - 'scripts/validate-seed-man-production-bundle.mjs'
      - '.github/workflows/seed-man-production-bundle-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'scripts/verify-seed-man-production-v20.mjs'
      - 'scripts/validate-seed-man-production-bundle.mjs'
      - '.github/workflows/seed-man-production-bundle-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical 20-level production contract
        run: |
          set -euo pipefail
          node scripts/verify-seed-man-production-v20.mjs
          node scripts/validate-seed-man-production-bundle.mjs
      - name: Validate canonical/public data parity
        run: |
          set -euo pipefail
          cmp games/seed-man-platformer/data/campaign.json site/public-route-patch/games/seed-man-platformer/data/campaign.json
          cmp games/seed-man-platformer/data/levels-20-v1.json site/public-route-patch/games/seed-man-platformer/data/levels-20-v1.json
          cmp games/seed-man-platformer/data/seed-man-art-manifest-v1.json site/public-route-patch/games/seed-man-platformer/data/seed-man-art-manifest-v1.json
