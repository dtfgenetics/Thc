name: Diagnose DTFSeeds Static Cutover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/diagnose-static-shadow-cutover.mjs
      - .github/workflows/wordpress-static-cutover-diagnostic.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-static-cutover-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run rollback-safe cutover fingerprint
        id: diagnose
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/diagnose-static-shadow-cutover.mjs
          node scripts/diagnose-static-shadow-cutover.mjs | tee "$RUNNER_TEMP/cutover.json"
      - name: Report cutover fingerprint
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let r={}; const p=process.env.RUNNER_TEMP+'/cutover.json';
            if(fs.existsSync(p)){for(const line of fs.readFileSync(p,'utf8').trim().split(/\r?\n/).reverse()){try{r=JSON.parse(line);break}catch{}}}
            const rows=(r.fingerprints||[]).map(x=>[
              `### ${x.path}`,
              `- HTTP: **${x.httpStatus}**, final: \`${x.finalUrl}\`, title: ${x.title || 'none'}`,
              `- body class: \`${x.bodyClass || 'none'}\``,
              `- current-home exact: **${x.markers?.currentHomeExact}**; alternate: **${x.markers?.currentHomeAlternate}**; old-home: **${x.markers?.oldHome}**`,
              `- current-learn: **${x.markers?.currentLearn}**; old-learn: **${x.markers?.oldLearn}**`,
              `- SeedProd: **${x.markers?.seedProd}**; coming-soon: **${x.markers?.comingSoonGeneric}**; maintenance: **${x.markers?.maintenance}**`,
              `- page-id-743: **${x.markers?.wpPage743}**; media refs: **${x.mediaRefs}**; theme refs: **${x.themeRefs}**`,
              `- excerpt: ${String(x.excerpt||'').slice(0,1200)}`
            ].join('\n'));
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body:[
              '## Rollback-safe static cutover diagnostic','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Job: **${{ job.status }}**`,
              `Verified static files temporarily removed: **${(r.removed||[]).join(', ') || 'none'}**`,
              `Verified static files restored: **${(r.restored||[]).join(', ') || 'none'}**`,
              `Rollback verified: **${r.rollbackVerified ?? 'unknown'}**`,
              `Cache purge after removal: **${r.cachePurgedAfterRemoval ?? 'unknown'}**; after restore: **${r.cachePurgedAfterRestore ?? 'unknown'}**`,
              r.error ? `Diagnostic error: ${r.error}` : '',
              r.restoreError ? `ROLLBACK ERROR: ${r.restoreError}` : '',
              '', ...(rows.length?rows:['No public fingerprints were captured.']),
              '', 'This diagnostic always restores the positively identified static shadow files before exiting; it does not finalize the cutover.'
            ].filter(Boolean).join('\n')});
