name: Verify Seed Man Approved Art

on:
  workflow_run:
    workflows: ['Publish Seed Man Production']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-seed-man-approved-art
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build generated Seed Man public world bundle
        run: |
          set -euo pipefail
          npm install --prefix games/seed-man-platformer --ignore-scripts --no-audit --no-fund
          npm run --prefix games/seed-man-platformer build:three-public
      - name: Validate approved art runtime source
        run: |
          set -euo pipefail
          node --check site/public-route-patch/games/seed-man-platformer/approved-art-core-v1.js
          node --check site/public-route-patch/games/seed-man-platformer/approved-art-runtime-v1.js
          node --check site/public-route-patch/games/seed-man-platformer/seed-man-production-art.js
          node scripts/verify-seed-man-production-v20.mjs
          grep -Fq "character.seedman.atlas" site/public-route-patch/games/seed-man-platformer/approved-art-core-v1.js
          grep -Fq "approved-showcase-2026-09-08" site/public-route-patch/games/seed-man-platformer/seed-man-production-art.js
          grep -Fq "fallbackAllowed:false" site/public-route-patch/games/seed-man-platformer/seed-man-production-art.js
      - name: Verify live approved art assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://dtfseeds.com/games/seed-man-platformer/'
          for attempt in {1..12}; do
            core="$(curl -4 --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${base}approved-art-core-v1.js?run=${GITHUB_RUN_ID}" || true)"
            runtime="$(curl -4 --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${base}approved-art-runtime-v1.js?run=${GITHUB_RUN_ID}" || true)"
            art="$(curl -4 --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${base}seed-man-production-art.js?run=${GITHUB_RUN_ID}" || true)"
            if grep -Fq "character.seedman.atlas" <<<"$core" \
              && grep -Fq "approved" <<<"$runtime" \
              && grep -Fq "seed-man-approved-atlas-renderer-v4" <<<"$art"; then
              echo 'Approved Seed Man art runtime is live through the canonical production publisher.'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Approved Seed Man art runtime did not become visible on the live route.' >&2
          exit 1
