name: Validate Homepage Genetics V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/finalize-wordpress-home-genetics-art.mjs'
      - 'scripts/fix-wordpress-home-release-visuals.mjs'
      - 'scripts/run-learning-v3-production.mjs'
      - 'scripts/reconcile-wordpress-learning-v3-ownership.mjs'
      - '.github/workflows/wordpress-home-genetics-art.yml'
      - '.github/workflows/wordpress-home-release-visuals.yml'
      - '.github/workflows/wordpress-learning-experience-v3-production.yml'
      - '.github/workflows/homepage-genetics-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Homepage Genetics V2 source and ordering
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/finalize-wordpress-home-genetics-art.mjs
          node --check scripts/fix-wordpress-home-release-visuals.mjs
          node --check scripts/run-learning-v3-production.mjs
          node --check scripts/reconcile-wordpress-learning-v3-ownership.mjs
          grep -Fq 'data-dtf-home-genetics-v2' scripts/finalize-wordpress-home-genetics-art.mjs
          grep -Fq 'Current releases, shown with the real strain cards.' scripts/finalize-wordpress-home-genetics-art.mjs
          grep -Fq 'dtf-strain-card-blue-mango-f2-regular' scripts/run-learning-v3-production.mjs
          grep -Fq 'dtf-strain-card-blue-mango-f2-feminized' scripts/run-learning-v3-production.mjs
          grep -Fq 'dtf-strain-card-blue-bubblegum-f1-regular' scripts/run-learning-v3-production.mjs
          grep -Fq 'WordPress hierarchical pages may legitimately reuse a leaf slug under different parents.' scripts/run-learning-v3-production.mjs
          grep -Fq 'Number(page.parent || 0) === Number(parent || 0)' scripts/run-learning-v3-production.mjs
          grep -Fq 'dtf-strain-card-mango-bubbles-f1-regular' scripts/finalize-wordpress-home-genetics-art.mjs
          grep -Fq 'exactly one published WordPress owner' scripts/reconcile-wordpress-learning-v3-ownership.mjs
          grep -Fq 'namespacePeers' scripts/reconcile-wordpress-learning-v3-ownership.mjs
          grep -Fq 'recoverUnsafeEncyclopediaPeers' scripts/reconcile-wordpress-learning-v3-ownership.mjs
          grep -Fq "unsafeRetirementStart=Date.parse('2026-08-29T15:18:00Z')" scripts/reconcile-wordpress-learning-v3-ownership.mjs
          ! grep -Fq 'retireNoncanonicalDuplicates' scripts/reconcile-wordpress-learning-v3-ownership.mjs
          ! grep -Fq "{status:'draft'}" scripts/reconcile-wordpress-learning-v3-ownership.mjs
          grep -Fq 'data-dtf-layout="learn-v3"' scripts/reconcile-wordpress-learning-v3-ownership.mjs
          grep -Fq 'data-dtf-topic=' scripts/reconcile-wordpress-learning-v3-ownership.mjs

          legacy='.github/workflows/wordpress-home-genetics-art.yml'
          final_owner='.github/workflows/wordpress-home-release-visuals.yml'
          learning='.github/workflows/wordpress-learning-experience-v3-production.yml'
          grep -Fq 'workflow_dispatch:' "$legacy"
          ! grep -Fq 'workflow_run:' "$legacy"
          ! grep -Fq 'push:' "$legacy"
          grep -Fq 'continue-on-error: true' "$legacy"
          grep -Fq 'workflow_call:' "$final_owner"
          ! grep -Fq 'workflow_run:' "$final_owner"
          grep -Fq 'uses: ./.github/workflows/wordpress-home-release-visuals.yml' "$learning"
          grep -Fq 'secrets: inherit' "$learning"
          grep -Fq 'Check whether V3 shared shell is already live' "$learning"
          grep -Fq 'steps.shell_state.outputs.needs_publish' "$learning"
          grep -Fq 'Reconcile WordPress Learning subject ownership' "$learning"
          grep -Fq 'Verify stored Learning ownership and markers' "$learning"
          grep -Fq 'scripts/reconcile-wordpress-learning-v3-ownership.mjs' "$learning"
          grep -Fq 'scripts/fix-wordpress-home-release-visuals.mjs' "$final_owner"
          grep -Fq 'Purge Hostinger LiteSpeed cache' "$final_owner"
          grep -Fq 'Verify visitor-facing homepage release artwork' "$final_owner"
          grep -Fq 'Blue Mango F2 Regular DTF Genetics strain card' "$legacy"
          grep -Fq 'Blue Mango F2 Feminized DTF Genetics strain card' "$legacy"
          grep -Fq 'Blue Bubblegum F1 Regular DTF Genetics strain card' "$legacy"
          grep -Fq 'Mango Bubbles F1 Regular DTF Genetics strain card' "$legacy"
          echo 'Homepage genetics ownership validated: Learning V3 preserves hierarchical namespace peers, recovers only #1284-retired Encyclopedia pages, verifies stored markers, and calls final Home release visuals as a reusable workflow.'

      - name: Prove V3 runtime patch still matches canonical publisher
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const publisher=fs.readFileSync('scripts/rebuild-wordpress-learning-experience-v3.mjs','utf8');
          const pageLookup=`async function getPage(slug) {
            const { body } = await request(\`/wp-json/wp/v2/pages?slug=\${encodeURIComponent(slug)}&context=edit&per_page=10\`);
            return Array.isArray(body) ? body[0] || null : null;
          }

          async function ensurePage(slug, title, parent = 0) {
            const existing = await getPage(slug);
            if (existing) return existing;`;
          const releaseBlock=`const releaseImages = {
            mangoRegular: chooseMedia(media, [['flower', 'anatomy'], ['trichome']], used) || fallbackHero,
            mangoFem: chooseMedia(media, [['trichome'], ['flower']], used) || fallbackHero,
            bubblegum: chooseMedia(media, [['sex', 'expression'], ['genetics']], used) || fallbackHero
          };`;
          const hero=`<div class="hero-media">${'${'}img(fallbackHero, 'DTF Genetics and Teaching Healthy Cultivation plant science', { ratio: '1/1', eager: true })}</div>`;
          const releaseCss='.v3 .release img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}';
          if(!publisher.includes(pageLookup)) throw new Error('V3 global-slug page lookup patch target drifted.');
          if(!publisher.includes(releaseBlock)) throw new Error('V3 release-image patch target drifted.');
          if(!publisher.includes(hero)) throw new Error('V3 Home hero patch target drifted.');
          if(!publisher.includes(releaseCss)) throw new Error('V3 release CSS patch target drifted.');
          console.log('Learning V3 parent-namespace and reviewed-genetics patch targets are stable.');
          NODE

      - name: Regression-test premium post-V3 matchers
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const rx=(value)=>String(value).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
          const sample=`<div class="v3" data-dtf-layout="home-v3"><section class="hero"><div class="wrap hero-grid"><div>copy</div><div class="hero-media"><img src="blue-mango.jpg" alt="Blue Mango F2 Regular DTF Genetics strain card"></div></div></section><section><article class="feature"><img src="education-genetics.jpg"><div class="feature-copy"><h3>Know the breeding project before you buy the pack.</h3><a href="/seeds/">Explore genetics</a></div></article></section><section class="section soft"><div class="release-grid"><article class="release"><img src="blue-mango.jpg"><div class="release-copy"><span class="pill">F2 · Regular</span><h3>Blue Mango</h3><p><strong>Somango XXL × Blueberry Butcher</strong></p><a href="/product/10-regular-f2-blue-mango-seeds/">Open release</a></div></article></div></section></div>`;
          const href=rx('/product/10-regular-f2-blue-mango-seeds/');
          const articleRe=new RegExp(`(<article\\s+class=["'][^"']*\\brelease\\b[^"']*["'][^>]*>)([\\s\\S]*?<a[^>]+href=["']${href}["'][^>]*>[\\s\\S]*?<\\/a>[\\s\\S]*?<\\/article>)`,'i');
          if(!articleRe.test(sample)) throw new Error('Product-route release matcher no longer matches V3 release markup.');
          if(!/<div\s+class=["']hero-media["']>[\s\S]*?<\/div>/i.test(sample)) throw new Error('Hero matcher no longer matches V3 markup.');
          if(!/<article\s+class=["']feature["']>[\s\S]*?<h3>Know the breeding project before you buy the pack\.<\/h3>[\s\S]*?<\/article>/i.test(sample)) throw new Error('Genetics feature matcher no longer matches V3 markup.');
          console.log('Premium post-V3 genetics matchers validated.');
          NODE
