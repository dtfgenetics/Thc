name: Assemble Harvest Education Image Intake

on:
  push:
    branches: [main]
    paths:
      - staging/harvest-asset-upload/READY.json
      - .github/workflows/harvest-asset-intake.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: harvest-education-asset-intake
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect ready intake
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f staging/harvest-asset-upload/READY.json ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'Harvest intake READY marker found.'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'READY marker absent; nothing to assemble.'
          fi

      - name: Assemble verified JPEG assets
        if: steps.ready.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path

          root = Path('staging/harvest-asset-upload')
          ready = json.loads((root / 'READY.json').read_text())
          dest_root = Path('site/wordpress/assets/infographics')
          dest_root.mkdir(parents=True, exist_ok=True)

          for item in ready['assets']:
              part_dir = root / item['id']
              parts = sorted(part_dir.glob('*.part'))
              if not parts:
                  raise SystemExit(f"No chunks found for {item['id']}")
              encoded = ''.join(p.read_text().strip() for p in parts)
              data = base64.b64decode(encoded, validate=True)
              if not data.startswith(b'\xff\xd8\xff'):
                  raise SystemExit(f"{item['id']} is not a JPEG")
              sha = hashlib.sha256(data).hexdigest()
              if sha != item['sha256']:
                  raise SystemExit(f"SHA-256 mismatch for {item['id']}: {sha} != {item['sha256']}")
              out = dest_root / item['filename']
              out.write_bytes(data)
              print(f"assembled {item['id']} -> {out} ({len(data)} bytes)")
          PY

      - name: Safely integrate canonical assets and retire consumed staging
        if: steps.ready.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf staging/harvest-asset-upload

          changed=()
          while IFS= read -r -d '' path; do
            changed+=("$path")
          done < <(
            git diff --name-only -z -- \
              site/wordpress/assets/infographics \
              staging/harvest-asset-upload
            git ls-files --others --exclude-standard -z -- \
              site/wordpress/assets/infographics \
              staging/harvest-asset-upload
          )

          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo 'No Harvest intake changes to integrate.'
            exit 0
          fi

          printf 'Harvest intake generated paths:\n'
          printf ' - %s\n' "${changed[@]}"
          node scripts/studio/integrate-generated-change.mjs \
            --message='Add verified Harvest education image assets' \
            "${changed[@]}"
