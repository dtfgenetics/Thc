name: Game Release Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - data/public-navigation.json
      - data/project-registry.json
      - site/deployment/public-apps.json
      - site/public-route-patch/games/**
      - site/public-route-patch/projects/**
      - scripts/validate-public-game-release-integrity.mjs
      - scripts/promote-public-game-routes-via-wordpress.mjs
      - scripts/flush-hostinger-litespeed-mcp.mjs
      - package.json
      - .github/workflows/game-release-integrity.yml
  workflow_run:
    workflows: ["Deploy DTFSeeds Public Suite via WordPress V2"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-release-integrity-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  static-integrity:
    name: Validate registry and public-page agreement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate public game release contract
        run: npm run verify:release-integrity

      - name: Syntax-check production route finalization
        run: |
          set -euo pipefail
          node --check scripts/promote-public-game-routes-via-wordpress.mjs
          node --check scripts/flush-hostinger-litespeed-mcp.mjs

  production-integrity:
    name: Promote routes purge cache and verify production identity
    needs: static-integrity
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require production WordPress credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"

      - name: Remove stale redirects from promoted public game routes
        run: node scripts/promote-public-game-routes-via-wordpress.mjs

      - name: Purge Hostinger LiteSpeed after route promotion
        run: node scripts/flush-hostinger-litespeed-mcp.mjs

      - name: Verify bare Bud or Bluff route is not cached as a redirect
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/bud-or-bluff-bare.html"
          headers="$RUNNER_TEMP/bud-or-bluff-bare.headers"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            : > "$body"
            : > "$headers"
            status="$(curl -4 -sS --retry 2 --retry-delay 2 \
              --output "$body" \
              --dump-header "$headers" \
              --write-out '%{http_code}' \
              -H 'User-Agent: DTFSeeds-Bare-Game-Route-Verify/1.0' \
              'https://dtfseeds.com/games/bud-or-bluff/')"
            if [[ "$status" == '200' ]] && \
               ! grep -Eiq '^location:' "$headers" && \
               grep -Fqi 'Bud or Bluff' "$body" && \
               grep -Fqi 'Create lobby' "$body"; then
              ok=1
              break
            fi
            echo "Bare Bud or Bluff attempt $attempt did not converge (status=$status)." >&2
            cat "$headers" >&2 || true
            sleep 5
          done
          [[ "$ok" -eq 1 ]] || {
            echo 'Bare /games/bud-or-bluff/ is still redirected or stale after post-promotion cache purge.' >&2
            exit 1
          }

      - name: Verify every ready public game resolves as its own page
        run: npm run verify:release-integrity:live
