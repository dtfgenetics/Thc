name: Publish THC Encyclopedia Production

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish THC Encyclopedia Visuals to WordPress Production
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/publish-wordpress-encyclopedia-*.mjs'
      - 'scripts/organize-wordpress-encyclopedia-topics.mjs'
      - 'configuration/encyclopedia-topics.json'
      - 'site/wordpress/education/encyclopedia/**'
      - 'scripts/publish-wordpress-learning-search-indexes.mjs'
      - 'scripts/deploy/wordpress-learning-search-runtime.sh'
      - 'scripts/deploy-wordpress-learning-search-runtime-via-rest.mjs'
      - 'site/wordpress/mu-plugins/dtf-learning-search.php'
      - 'site/wordpress/mu-plugins/dtf-learning-search/**'
      - '.github/workflows/wordpress-encyclopedia-production.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-encyclopedia-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish, organize, and visitor-verify controlled encyclopedia batch
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      ENCYCLOPEDIA_BATCH_FILE: site/wordpress/education/encyclopedia/current-production-batch.json
      ENCYCLOPEDIA_TOPIC_FILE: configuration/encyclopedia-topics.json
      BACKUP_ROOT: /tmp/dtf-encyclopedia-production
      HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_HOST || secrets.HOSTINGER_SSH_HOST || secrets.SSH_HOST || secrets.SFTP_HOST }}
      HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_USER || secrets.HOSTINGER_SSH_USER || secrets.SSH_USER || secrets.SFTP_USER }}
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_KEY }}
      HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS || secrets.HOSTINGER_SSH_KNOWN_HOSTS || secrets.SSH_KNOWN_HOSTS }}
      HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_PORT || secrets.HOSTINGER_SSH_PORT || secrets.SSH_PORT || secrets.SFTP_PORT }}
      HOSTINGER_PUBLIC_ROOT: ${{ secrets.HOSTINGER_PUBLIC_ROOT || vars.HOSTINGER_WORDPRESS_PATH || vars.WORDPRESS_PATH || vars.WP_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate controlled encyclopedia package
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/publish-wordpress-encyclopedia-canonical-batch.mjs
          node --check scripts/organize-wordpress-encyclopedia-topics.mjs
          node --check scripts/validate-encyclopedia-release-control.mjs
          node --check scripts/publish-wordpress-learning-search-indexes.mjs
          node --check scripts/deploy-wordpress-learning-search-runtime-via-rest.mjs
          bash -n scripts/deploy/wordpress-learning-search-runtime.sh
          php -l site/wordpress/mu-plugins/dtf-learning-search.php
          npm run verify:wordpress-learning-search
          npm run build:encyclopedia-scorecard
          node scripts/validate-encyclopedia-completion-scorecard.mjs
          npm run build:encyclopedia-discovery
          node scripts/build-thc-education-search-index.mjs
          node scripts/validate-thc-education-search.mjs
          npm run verify:encyclopedia-renderer
          npm run verify:encyclopedia-skill
          npm run verify:encyclopedia-assessments
          node scripts/validate-encyclopedia-release-control.mjs "$ENCYCLOPEDIA_BATCH_FILE"
          node - <<'NODE'
          const fs=require('fs');
          const path=process.env.ENCYCLOPEDIA_BATCH_FILE;
          const d=JSON.parse(fs.readFileSync(path,'utf8'));
          if(!d.batch||!Array.isArray(d.lessonFiles)||!d.lessonFiles.length) throw new Error('Invalid current encyclopedia batch manifest');
          const ids=[];
          for(const file of d.lessonFiles){
            const a=JSON.parse(fs.readFileSync(file,'utf8'));
            if(!/^THC-ENC-\d{3}$/.test(a.id)) throw new Error(`Invalid lesson ID in ${file}`);
            if(ids.includes(a.id)) throw new Error(`Duplicate lesson ID ${a.id}`);
            if(!a.title||!a.objective||!Array.isArray(a.coreScience)||a.coreScience.length<2||!Array.isArray(a.sourceNotes)||!a.sourceNotes.length) throw new Error(`Incomplete canonical lesson ${a.id}`);
            ids.push(a.id);
          }
          const topics=JSON.parse(fs.readFileSync(process.env.ENCYCLOPEDIA_TOPIC_FILE,'utf8'));
          if(topics.schemaVersion!==1||!Array.isArray(topics.topics)||topics.topics.length!==21) throw new Error('Invalid topic architecture');
          console.log(`Validated ${d.batch}: ${ids.join(', ')}`);
          NODE

      - name: Require protected WordPress credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${WP_API_USERNAME:-}" ]]
          [[ -n "${WP_API_PASSWORD:-}" ]]

      - name: Ensure WordPress learning search runtime is active
        id: search_runtime
        shell: bash
        run: |
          set -euo pipefail
          verify_live_runtime() {
            health="$RUNNER_TEMP/learning-search-health.json"
            if ! curl -4 --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 60 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$WP_SITE_URL/wp-json/dtf-learning/v1/health?dtf_ency_runtime=$GITHUB_RUN_ID" -o "$health"; then
              return 1
            fi
            if ! HEALTH_PATH="$health" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync(process.env.HEALTH_PATH,'utf8'));
          if(h.ok!==true || h.version!=='1.0.0') process.exit(1);
          console.log('Learning search runtime active:', h);
          NODE
            then
              return 1
            fi
            for asset in search-v1.js encyclopedia-v1.js thc-search-explain-v1.js fuse-7.1.0.min.js; do
              live="$RUNNER_TEMP/ency-live-$asset"
              if ! curl -4 --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 \
                --connect-timeout 15 --max-time 60 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "$WP_SITE_URL/wp-content/mu-plugins/dtf-learning-search/$asset?dtf_ency_runtime=$GITHUB_RUN_ID" -o "$live"; then
                return 1
              fi
              cmp "site/wordpress/mu-plugins/dtf-learning-search/$asset" "$live" || return 1
            done
            return 0
          }

          ssh_ready=true
          for required in HOSTINGER_SSH_HOST HOSTINGER_SSH_USER HOSTINGER_SSH_PRIVATE_KEY HOSTINGER_SSH_KNOWN_HOSTS HOSTINGER_PUBLIC_ROOT; do
            if [[ -z "${!required:-}" ]]; then ssh_ready=false; fi
          done

          if [[ "$ssh_ready" != true ]]; then
            if verify_live_runtime; then
              echo 'Existing live Learning Search runtime already matches the current repository assets.'
              echo "runtime_mode=verified-existing" >> "$GITHUB_OUTPUT"
              echo "backup_id=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'Hostinger SSH deployment credentials are unavailable; deploying Learning Search through the authenticated WordPress REST bridge.'
            node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/deploy-wordpress-learning-search-runtime-via-rest.mjs \
              | tee "$RUNNER_TEMP/encyclopedia-learning-search-rest-deploy.json"
            verify_live_runtime
            echo "runtime_mode=wordpress-rest-bridge" >> "$GITHUB_OUTPUT"
            echo "backup_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$HOSTINGER_PUBLIC_ROOT" == /*/public_html ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > "$HOME/.ssh/dtf_hostinger"
          chmod 600 "$HOME/.ssh/dtf_hostinger"
          printf '%s\n' "$HOSTINGER_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          port="${HOSTINGER_SSH_PORT:-65002}"
          ssh_opts=(-i "$HOME/.ssh/dtf_hostinger" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes)

          rm -rf "$RUNNER_TEMP/learning-search-payload"
          mkdir -p "$RUNNER_TEMP/learning-search-payload/dtf-learning-search"
          cp site/wordpress/mu-plugins/dtf-learning-search.php "$RUNNER_TEMP/learning-search-payload/"
          cp -a site/wordpress/mu-plugins/dtf-learning-search/. "$RUNNER_TEMP/learning-search-payload/dtf-learning-search/"
          tar -C "$RUNNER_TEMP/learning-search-payload" -czf "$RUNNER_TEMP/dtf-learning-search-${GITHUB_SHA}.tgz" .

          remote_archive=".dtf-deploy/learning-search/incoming/dtf-learning-search-${GITHUB_SHA}.tgz"
          ssh "${ssh_opts[@]}" "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" 'mkdir -p "$HOME/.dtf-deploy/learning-search/incoming"'
          scp -i "$HOME/.ssh/dtf_hostinger" -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/dtf-learning-search-${GITHUB_SHA}.tgz" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$remote_archive"

          printf -v remote_cmd 'bash -s -- activate %q %q %q' "$HOSTINGER_PUBLIC_ROOT" "$GITHUB_SHA" "$remote_archive"
          output="$(ssh "${ssh_opts[@]}" "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" "$remote_cmd" < scripts/deploy/wordpress-learning-search-runtime.sh)"
          printf '%s\n' "$output"
          backup_id="$(printf '%s\n' "$output" | sed -n 's/^backup_id=//p' | tail -n 1)"
          [[ -n "$backup_id" ]]
          echo "backup_id=$backup_id" >> "$GITHUB_OUTPUT"
          echo "runtime_mode=ssh" >> "$GITHUB_OUTPUT"

          verify_live_runtime

      - name: Publish controlled encyclopedia batch with backup
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-wordpress-encyclopedia-canonical-batch.mjs | tee "$RUNNER_TEMP/encyclopedia-publish.log"
          backup_dir="$(cat "$BACKUP_ROOT/latest-backup-path.txt")"
          report="$backup_dir/encyclopedia-publication-report.json"
          test -s "$report"
          echo "backup_dir=$backup_dir" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "batch=$(node -p "require(process.argv[1]).batch" "$report")" >> "$GITHUB_OUTPUT"
          echo "count=$(node -p "require(process.argv[1]).published.length" "$report")" >> "$GITHUB_OUTPUT"
          echo "index_id=$(node -p "require(process.argv[1]).index.pageId" "$report")" >> "$GITHUB_OUTPUT"
          echo "listed=$(node -p "require(process.argv[1]).index.listedLessons" "$report")" >> "$GITHUB_OUTPUT"

      - name: Restore topic-first encyclopedia organization
        id: organize
        shell: bash
        run: |
          set -euo pipefail
          export BACKUP_ROOT=/tmp/dtf-encyclopedia-topics
          node scripts/organize-wordpress-encyclopedia-topics.mjs | tee "$RUNNER_TEMP/encyclopedia-topics.log"
          topic_backup_dir="$(cat "$BACKUP_ROOT/latest-backup-path.txt")"
          topic_report="$topic_backup_dir/encyclopedia-topic-organization-report.json"
          test -s "$topic_report"
          echo "backup_dir=$topic_backup_dir" >> "$GITHUB_OUTPUT"
          echo "topics=$(node -p "require(process.argv[1]).activeTopics.length" "$topic_report")" >> "$GITHUB_OUTPUT"
          echo "articles=$(node -p "require(process.argv[1]).articleCount" "$topic_report")" >> "$GITHUB_OUTPUT"

      - name: Publish refreshed encyclopedia search indexes
        id: search_indexes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-wordpress-learning-search-indexes.mjs | tee "$RUNNER_TEMP/encyclopedia-search-index-publish.json"

      - name: Visitor-verify topic-first index and every current-batch article
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          report="${{ steps.publish.outputs.report }}"
          index_body="$RUNNER_TEMP/encyclopedia-index.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "$WP_SITE_URL/learn/encyclopedia/?dtf_encyclopedia=${GITHUB_RUN_ID}-${attempt}" \
              --output "$index_body"
            if grep -Fqi -- 'Browse by topic' "$index_body" && grep -Fqi -- 'Search all published encyclopedia lessons' "$index_body"; then ok=1; break; fi
            sleep 8
          done
          [[ "$ok" -eq 1 ]]
          if grep -Fqi -- 'THC-ENC-001 — How to Read Cannabis Plant Science Critically' "$index_body"; then
            echo 'Superseded THC-ENC-001 title must not be listed on the public encyclopedia index.' >&2
            exit 1
          fi

          node - <<'NODE' "$report" > "$RUNNER_TEMP/current-batch-routes.tsv"
          const r=require(process.argv[2]);
          for(const p of r.published) process.stdout.write(`${p.id}\t${p.slug}\n`);
          NODE
          while IFS=$'\t' read -r id slug; do
            grep -Fqi -- "$id" "$index_body" || { echo "$id missing from encyclopedia index" >&2; exit 1; }
            route="/learn/encyclopedia/$slug/"
            body="$RUNNER_TEMP/${slug}.html"
            found=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                "$WP_SITE_URL${route}?dtf_encyclopedia=${GITHUB_RUN_ID}-${attempt}" \
                --output "$body"
              if grep -Fqi -- "$id" "$body" && grep -Fqi -- 'Educational reference' "$body" && grep -Fqi -- 'Terms to know' "$body" && grep -Fqi -- 'Related tools' "$body"; then found=1; break; fi
              sleep 8
            done
            [[ "$found" -eq 1 ]] || { echo "Visitor verification failed for $route" >&2; head -c 4000 "$body" >&2 || true; exit 1; }
            echo "$route visitor verification passed"
          done < "$RUNNER_TEMP/current-batch-routes.tsv"

          node - <<'NODE' > "$RUNNER_TEMP/current-topic.tsv"
          const fs=require('fs');
          const batch=JSON.parse(fs.readFileSync(process.env.ENCYCLOPEDIA_BATCH_FILE,'utf8'));
          const topics=JSON.parse(fs.readFileSync(process.env.ENCYCLOPEDIA_TOPIC_FILE,'utf8')).topics;
          const lessons=batch.lessonFiles.map(file=>JSON.parse(fs.readFileSync(file,'utf8')));
          const numbers=lessons.map(x=>Number(x.id.match(/(\d{3})$/)[1]));
          const topic=topics.find(t=>numbers.every(n=>n>=t.range[0]&&n<=t.range[1]));
          if(!topic) throw new Error(`Current batch ${batch.batch} does not resolve to one topic hub.`);
          process.stdout.write(`${topic.slug}\t${lessons[0].id}\n`);
          NODE
          IFS=$'\t' read -r topic_slug topic_first_id < "$RUNNER_TEMP/current-topic.tsv"
          current_topic="$RUNNER_TEMP/current-topic.html"
          hub_ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if ! curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' --header 'Pragma: no-cache' \
              "$WP_SITE_URL/learn/encyclopedia/$topic_slug/?dtf_encyclopedia=${GITHUB_RUN_ID}-${attempt}" -o "$current_topic"; then
              sleep 8
              continue
            fi
            if grep -Fqi -- "$topic_first_id" "$current_topic" && grep -Fqi -- "data-thc-topic=\"$topic_slug\"" "$current_topic"; then
              hub_ok=1
              break
            fi
            sleep 8
          done
          [[ "$hub_ok" -eq 1 ]] || { echo "Current topic hub verification failed: $topic_slug" >&2; head -c 4000 "$current_topic" >&2 || true; exit 1; }

          # Visual approval is governed by the canonical encyclopedia visual ledger.
          # Do not hard-code a legacy lesson asset as a release prerequisite.

      - name: Upload encyclopedia rollback package
        if: always() && steps.publish.outputs.backup_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: thc-encyclopedia-production-${{ github.run_id }}
          path: ${{ steps.publish.outputs.backup_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload topic-organization rollback package
        if: always() && steps.organize.outputs.backup_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: thc-encyclopedia-topics-${{ github.run_id }}
          path: ${{ steps.organize.outputs.backup_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Report production result to issue 46
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const success='${{ job.status }}'==='success';
            const body=[
              '## THC encyclopedia production publication',
              '',
              `- Result: **${success?'success':'failed'}**`,
              `- Published batch: **${{ steps.publish.outputs.batch || 'unknown' }}**`,
              `- Article count this batch: **${{ steps.publish.outputs.count || 'unknown' }}**`,
              `- Encyclopedia lessons listed: **${{ steps.publish.outputs.listed || 'unknown' }}**`,
              `- Active topic hubs after organization: **${{ steps.organize.outputs.topics || 'unknown' }}**`,
              `- Encyclopedia index page ID: **${{ steps.publish.outputs.index_id || 'unknown' }}**`,
              `- Visitor verification: **${success?'passed':'not passed'}**`,
              '- Teaching-visual state is governed by the canonical visual ledger; no legacy single-lesson asset is required for release.',
              '- Current batch topic-hub verification: **included in primary gate**',
              '- Review control: **website publication does not represent independent lesson approval**',
              `- Source: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body});
            } catch (error) {
              core.warning(`Production report could not be posted to issue #46 and will not affect the release result: ${error.message}`);
            }
