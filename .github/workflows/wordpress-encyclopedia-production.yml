name: Publish THC Encyclopedia Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish-wordpress-encyclopedia-*.mjs'
      - 'content/encyclopedia/**'
      - 'site/wordpress/education/encyclopedia/**'
      - '.github/workflows/wordpress-encyclopedia-production.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-encyclopedia-production
  cancel-in-progress: true

jobs:
  publish:
    name: Publish and visitor-verify controlled encyclopedia batch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      ENCYCLOPEDIA_BATCH_FILE: site/wordpress/education/encyclopedia/volume01-batch02.json
      BACKUP_ROOT: /tmp/dtf-encyclopedia-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate controlled encyclopedia package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/publish-wordpress-encyclopedia-canonical-batch.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=require('./site/wordpress/education/encyclopedia/volume01-batch02.json');
          const expected=Array.from({length:9},(_,i)=>`THC-ENC-${String(i+12).padStart(3,'0')}`);
          const got=d.lessonFiles.map(file=>JSON.parse(fs.readFileSync(file,'utf8')).id);
          if(JSON.stringify(got)!==JSON.stringify(expected)) throw new Error(`Unexpected batch IDs: ${got.join(',')}`);
          for(const file of d.lessonFiles){
            const a=JSON.parse(fs.readFileSync(file,'utf8'));
            if(!a.title||!a.objective||!Array.isArray(a.coreScience)||a.coreScience.length<2||!Array.isArray(a.sourceNotes)||!a.sourceNotes.length) throw new Error(`Incomplete canonical lesson ${a.id}`);
          }
          NODE

      - name: Require protected WordPress credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${WP_API_USERNAME:-}" ]]
          [[ -n "${WP_API_PASSWORD:-}" ]]

      - name: Publish controlled encyclopedia batch with backup
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-wordpress-encyclopedia-canonical-batch.mjs | tee "$RUNNER_TEMP/encyclopedia-publish.log"
          backup_dir="$(cat "$BACKUP_ROOT/latest-backup-path.txt")"
          report="$backup_dir/encyclopedia-publication-report.json"
          test -s "$report"
          echo "backup_dir=$backup_dir" >> "$GITHUB_OUTPUT"
          echo "count=$(node -p "require(process.argv[1]).published.length" "$report")" >> "$GITHUB_OUTPUT"
          echo "index_id=$(node -p "require(process.argv[1]).index.pageId" "$report")" >> "$GITHUB_OUTPUT"
          echo "listed=$(node -p "require(process.argv[1]).index.listedLessons" "$report")" >> "$GITHUB_OUTPUT"

      - name: Visitor-verify encyclopedia index and article routes
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          fetch_verify() {
            local route="$1" required="$2" forbidden="${3:-}"
            local body="$RUNNER_TEMP/$(echo "$route" | tr '/?' '__').html"
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                "$WP_SITE_URL${route}?dtf_encyclopedia=${GITHUB_RUN_ID}-${attempt}" \
                --output "$body"
              if grep -Fqi -- "$required" "$body"; then ok=1; break; fi
              sleep 8
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Missing visitor fingerprint on $route: $required" >&2
              head -c 4000 "$body" >&2 || true
              exit 1
            fi
            if [[ -n "$forbidden" ]] && grep -Fqi -- "$forbidden" "$body"; then
              echo "Forbidden visitor fingerprint on $route: $forbidden" >&2
              exit 1
            fi
            echo "$route visitor verification passed"
          }
          fetch_verify '/learn/encyclopedia/' 'THC-ENC-003'
          fetch_verify '/learn/encyclopedia/' 'THC-ENC-020' 'THC-ENC-001 — How to Read Cannabis Plant Science Critically'
          fetch_verify '/learn/encyclopedia/thc-enc-003/' 'Taxonomic Debate: One Species, Multiple Lineages'
          fetch_verify '/learn/encyclopedia/thc-enc-012/' 'Leaf Morphology, Leaflets, and Phyllotaxy'
          fetch_verify '/learn/encyclopedia/thc-enc-013/' 'Meristems, Buds, and Apical Dominance'
          fetch_verify '/learn/encyclopedia/thc-enc-014/' 'Primary Growth, Secondary Thickening, and Structural Support'
          fetch_verify '/learn/encyclopedia/thc-enc-015/' 'Dioecy, Monoecy, and Sexual Plasticity'
          fetch_verify '/learn/encyclopedia/thc-enc-016/' 'Male Flower and Inflorescence Anatomy'
          fetch_verify '/learn/encyclopedia/thc-enc-017/' 'Female Flower, Bract, Stigma, and Inflorescence Anatomy'
          fetch_verify '/learn/encyclopedia/thc-enc-018/' 'Wind Pollination, Fertilization, and Seed Set'
          fetch_verify '/learn/encyclopedia/thc-enc-019/' 'Glandular and Nonglandular Trichome Classes'
          fetch_verify '/learn/encyclopedia/thc-enc-020/' 'Morphological Measurement and Botanical Recordkeeping'

      - name: Upload encyclopedia rollback package
        if: always() && steps.publish.outputs.backup_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: thc-encyclopedia-production-${{ github.run_id }}
          path: ${{ steps.publish.outputs.backup_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Report production result to issue 46
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success='${{ job.status }}'==='success';
            const body=[
              '## THC encyclopedia production publication',
              '',
              `- Result: **${success?'success':'failed'}**`,
              `- Published batch: **volume01-batch02**`,
              `- Article count this batch: **${{ steps.publish.outputs.count || 'unknown' }}**`,
              `- Encyclopedia lessons listed: **${{ steps.publish.outputs.listed || 'unknown' }}**`,
              `- Encyclopedia index page ID: **${{ steps.publish.outputs.index_id || 'unknown' }}**`,
              `- Visitor verification: **${success?'passed':'not passed'}**`,
              '- Review control: **website publication does not represent independent lesson approval**',
              `- Source: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body});
