name: Publish Diagnostic Case Lab V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/wordpress/education/diagnostic-case-lab-v1.json'
      - 'scripts/publish-wordpress-diagnostic-case-lab-v1.mjs'
      - '.github/workflows/wordpress-diagnostic-case-lab-v1.yml'
  push:
    branches: [main]
    paths:
      - 'site/wordpress/education/diagnostic-case-lab-v1.json'
      - 'scripts/publish-wordpress-diagnostic-case-lab-v1.mjs'
      - '.github/workflows/wordpress-diagnostic-case-lab-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-diagnostic-case-lab-v1
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  validate:
    name: Validate Diagnostic Case Lab V1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate case package and publisher
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/publish-wordpress-diagnostic-case-lab-v1.mjs
          node scripts/publish-wordpress-diagnostic-case-lab-v1.mjs --validate-only | tee "$RUNNER_TEMP/dcl1-validation.json"
          grep -Fq '"cases": 12' "$RUNNER_TEMP/dcl1-validation.json"
          grep -Fq '"trees": 6' "$RUNNER_TEMP/dcl1-validation.json"
          grep -Fq '"decisionNodes": 30' "$RUNNER_TEMP/dcl1-validation.json"
          grep -Fq '"sources": 7' "$RUNNER_TEMP/dcl1-validation.json"

  publish:
    name: Publish and verify Diagnostic Case Lab V1
    needs: validate
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_DIAGNOSTIC_CASE_LAB_V1: 'true'
      BACKUP_ROOT: /tmp/dtf-diagnostic-case-lab-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm production package
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/publish-wordpress-diagnostic-case-lab-v1.mjs
          node scripts/publish-wordpress-diagnostic-case-lab-v1.mjs --validate-only
      - name: Publish Diagnostic Case Lab V1
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/publish-wordpress-diagnostic-case-lab-v1.mjs | tee "$RUNNER_TEMP/dcl1-publish.log"
          report="$(find "$BACKUP_ROOT" -name report.json -type f -print -quit)"
          test -n "$report"; test -s "$report"
          echo "cases=$(node -p "require(process.argv[1]).cases" "$report")" >> "$GITHUB_OUTPUT"
          echo "trees=$(node -p "require(process.argv[1]).trees" "$report")" >> "$GITHUB_OUTPUT"
          echo "nodes=$(node -p "require(process.argv[1]).decisionNodes" "$report")" >> "$GITHUB_OUTPUT"
          echo "sources=$(node -p "require(process.argv[1]).sources" "$report")" >> "$GITHUB_OUTPUT"
      - name: Verify fresh visitor Case Lab and Diagnostic Index
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          casebody="$RUNNER_TEMP/dcl1-live.html"; indexbody="$RUNNER_TEMP/dx-index-live.html"; ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' --header 'Pragma: no-cache' \
              "$WP_SITE_URL/learn/diagnostic-cases/?dtf_dcl1_verify=${GITHUB_RUN_ID}-${attempt}" --output "$casebody"
            if grep -Fq 'data-dtf-diagnostic-case-lab-v1="true"' "$casebody"; then ok=1; break; fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]]
          [[ "$(grep -Fo 'data-dcl-case=' "$casebody" | wc -l | tr -d ' ')" = '12' ]]
          [[ "$(grep -Fo 'data-dcl-tree=' "$casebody" | wc -l | tr -d ' ')" = '6' ]]
          [[ "$(grep -Fo 'class="dcl-node"' "$casebody" | wc -l | tr -d ' ')" = '30' ]]
          grep -Fq 'Try the diagnosis before revealing the answer.' "$casebody"
          grep -Fq '/learn/research-methods/' "$casebody"
          grep -Fq '/thc-grow-doc/' "$casebody"
          curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
            --header 'Cache-Control: no-cache, no-store, max-age=0' --header 'Pragma: no-cache' \
            "$WP_SITE_URL/learn/diagnostics/?dtf_dcl1_index=${GITHUB_RUN_ID}" --output "$indexbody"
          grep -Fq 'data-dtf-diagnostic-index-v5="true"' "$indexbody"
          grep -Fq 'data-dtf-diagnostic-cases-link-v1="true"' "$indexbody"
          grep -Fq '/learn/diagnostic-cases/' "$indexbody"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-case-lab-v1-${{ github.run_id }}
          path: |
            /tmp/dtf-diagnostic-case-lab-v1
            ${{ runner.temp }}/dcl1-publish.log
            ${{ runner.temp }}/dcl1-live.html
            ${{ runner.temp }}/dx-index-live.html
          if-no-files-found: warn
          retention-days: 30
      - name: Report Diagnostic Case Lab V1 result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          PUBLISH: ${{ steps.publish.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          CASES: ${{ steps.publish.outputs.cases }}
          TREES: ${{ steps.publish.outputs.trees }}
          NODES: ${{ steps.publish.outputs.nodes }}
          SOURCES: ${{ steps.publish.outputs.sources }}
        with:
          script: |
            const body = [
              '## Diagnostic Case Lab V1 production','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `WordPress publication: **${process.env.PUBLISH || 'not-run'}**`,
              `Visitor verification: **${process.env.VERIFY || 'not-run'}**`,
              `Diagnostic cases: **${process.env.CASES || '0'}**`,
              `Decision trees: **${process.env.TREES || '0'}**`,
              `Decision nodes: **${process.env.NODES || '0'}**`,
              `Evidence sources: **${process.env.SOURCES || '0'}**`, '',
              'The Case Lab is published at /learn/diagnostic-cases/ and is linked from the existing /learn/diagnostics/ index.'
            ].join('\n');
            for (const issue_number of [46,146]) await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number,body});
