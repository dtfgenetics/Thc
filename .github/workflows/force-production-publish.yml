name: Force DTFSeeds Production Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-production-publish.yml

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: force-dtfseeds-production-publish
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate production workflows
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/wordpress-canonical-production.yml
          test -s .github/workflows/wordpress-infographic-production.yml
          test -s .github/workflows/wordpress-presentation-repair.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/wordpress-canonical-production.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/wordpress-infographic-production.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/wordpress-presentation-repair.yml

      - name: Dispatch canonical WordPress production
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run wordpress-canonical-production.yml --ref main

      - name: Dispatch THC infographic production
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run wordpress-infographic-production.yml --ref main

      - name: Dispatch WordPress presentation repair
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run wordpress-presentation-repair.yml --ref main

      - name: Report explicit production dispatch
        if: always()
        uses: actions/github-script@v7
        env:
          DISPATCH_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Explicit protected production dispatch',
                '',
                `Dispatcher run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Status: **${process.env.DISPATCH_STATUS}**`,
                'Requested workflows:',
                '- Publish DTFSeeds WordPress Production',
                '- Publish THC Infographics to WordPress Production',
                '- Repair DTFSeeds WordPress Presentation',
                '',
                'All targets use the protected `production` environment and its configured WordPress credentials.'
              ].join('\n')
            });
