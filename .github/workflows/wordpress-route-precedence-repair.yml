name: Repair DTFSeeds WordPress Route Precedence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/repair-wordpress-route-precedence.mjs
      - scripts/run-route-precedence-repair-current-markers.sh
      - scripts/wordpress-ipv4-fetch-bootstrap.mjs
      - .github/workflows/wordpress-route-precedence-repair.yml

permissions:
  contents: read

concurrency:
  group: dtfseeds-wordpress-route-precedence
  cancel-in-progress: false

jobs:
  repair:
    name: transactionally-repair-wordpress-route-precedence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate route repair
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/repair-wordpress-route-precedence.mjs
          node --check scripts/wordpress-ipv4-fetch-bootstrap.mjs
          bash -n scripts/run-route-precedence-repair-current-markers.sh
          grep -Fq 'data-dtf-layout="home-v3"' scripts/run-route-precedence-repair-current-markers.sh
          grep -Fq 'data-dtf-layout="learn-v3"' scripts/run-route-precedence-repair-current-markers.sh
          grep -Fq 'data-dtf-genetics-library="2026"' scripts/run-route-precedence-repair-current-markers.sh
          grep -Fq 'data-dtf-layout="community-visual-v1"' scripts/run-route-precedence-repair-current-markers.sh
          grep -Fq '25 playable browser games' scripts/run-route-precedence-repair-current-markers.sh
          grep -Fq 'Grow with records. Diagnose with evidence.' scripts/run-route-precedence-repair-current-markers.sh
          grep -Fq "get_param('dtf_repair_token')" scripts/run-route-precedence-repair-current-markers.sh
          grep -Fq 'wordpress-ipv4-fetch-bootstrap.mjs' scripts/run-route-precedence-repair-current-markers.sh

      - name: Confirm authenticated WordPress repair path
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' "$WP_API_USERNAME" "$WP_API_PASSWORD" | base64 -w0)"
          for attempt in 1 2 3 4 5 6; do
            if curl -4 --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 45 --retry 2 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Basic $auth" \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$WP_SITE_URL/wp-json/wp/v2/users/me?context=edit" -o "$RUNNER_TEMP/wp-user.json"; then
              node - <<'NODE' "$RUNNER_TEMP/wp-user.json"
          const user=require(process.argv[2]);
          if (!Number(user.id || 0)) throw new Error('Authenticated WordPress user did not resolve');
          NODE
              echo "Authenticated WordPress REST path verified on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo 'Authenticated WordPress REST path remained unavailable.' >&2
          exit 1

      - name: Apply transactional route-precedence repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-route-precedence-repair-current-markers.sh

      - name: Independently verify public route ownership
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local path="$1"
            local marker="$2"
            local mode="$3"
            local body="$RUNNER_TEMP/route-$(printf '%s' "$path" | tr '/?' '__').html"
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -4 --fail --silent --show-error --location \
                --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "$WP_SITE_URL${path}?dtf_route_final=${GITHUB_RUN_ID}-${attempt}" \
                -o "$body" && grep -Fqi -- "$marker" "$body"; then
                ok=1
                break
              fi
              sleep 5
            done
            [[ "$ok" -eq 1 ]] || {
              echo "Expected owner marker missing from $path: $marker" >&2
              head -c 3000 "$body" >&2 || true
              return 1
            }
            if [[ "$mode" == wordpress ]]; then
              ! grep -Fqi '/assets/dtf-home/dtf-home.css' "$body" || {
                echo "Legacy static shell remains on $path" >&2
                return 1
              }
              for stale in \
                'THC Grow Doc, genetics, cultivation education, and games in one home.' \
                'Grow education belongs in a clean, readable library.' \
                'MOPS, cultivation notes, THC basics' \
                'being rebuilt' \
                'Reserved strain card' \
                'Tool-ready rebuild'; do
                ! grep -Fqi -- "$stale" "$body" || {
                  echo "Stale route marker remains on $path: $stale" >&2
                  return 1
                }
              done
            fi
            echo "$path verified as $mode owner"
          }

          verify '/' 'data-dtf-layout="home-v3"' wordpress
          verify '/learn/' 'data-dtf-layout="learn-v3"' wordpress
          verify '/learn/infographics/' 'Visual plant science and cultivation library.' wordpress
          verify '/learn/start-here/' 'Learn the plant before chasing the fix.' wordpress
          verify '/seeds/' 'data-dtf-genetics-library="2026"' wordpress
          verify '/seeds/mango-bubbles/' 'data-dtf-genetics-line="mango-bubbles"' wordpress
          verify '/shop/' 'dtf-commerce-archive-style' wordpress
          verify '/community/' 'data-dtf-layout="community-visual-v1"' wordpress
          verify '/gallery/' 'data-dtf-layout="gallery-visual-v1"' wordpress
          verify '/about/' 'data-dtf-layout="about-visual-v1"' wordpress
          verify '/contact/' 'data-dtf-layout="contact-visual-v1"' wordpress
          verify '/games/' '25 playable browser games' preserved
          verify '/tools/' 'Grow with records. Diagnose with evidence.' preserved

      - name: Record route-precedence repair
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo '## WordPress route-precedence repair'
            echo
            echo "Result: **${JOB_STATUS}**"
            echo "Transactional .htaccess repair: **${REPAIR_OUTCOME:-not-run}**"
            echo "Independent live verification: **${VERIFY_OUTCOME:-not-run}**"
            echo
            echo 'The authenticated WordPress repair backs up .htaccess before mutation, verifies the write, checks every WordPress-owned route plus Games/Tools before finalizing, and restores the original .htaccess automatically if the internal visitor verification fails.'
          } >> "$GITHUB_STEP_SUMMARY"
