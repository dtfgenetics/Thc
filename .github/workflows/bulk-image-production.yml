name: Publish DTFSeeds Image Backlog Manually

on:
  workflow_dispatch:

permissions:
  contents: read

# RETIRED MUTATION LANE
# The old image-backlog command called the legacy infographic transaction, which
# could re-upload and republish quarantined dtf-edu artwork. This compatibility
# workflow remains discoverable but is intentionally read-only.
concurrency:
  group: dtfseeds-image-backlog-retired
  cancel-in-progress: true

jobs:
  retired-publisher-guard:
    name: Legacy image backlog publisher disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Enforce approved-only visual policy
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const policy=require('./site/wordpress/visual-quality-policy.json');
          if(Number(policy.schemaVersion)<3 || policy.mode!=='quarantine') throw new Error('Visual quality quarantine policy v3+ is required.');
          if(policy.replacementPolicy?.legacyAutomaticInfographicPublishingAllowed!==false) throw new Error('Legacy automatic infographic publishing must remain disabled.');
          if(policy.replacementPolicy?.legacyInfographicReuseAllowed!==false) throw new Error('Legacy infographic reuse must remain disabled.');
          if(policy.replacementPolicy?.automaticKeywordMediaSelectionAllowed!==false) throw new Error('Automatic keyword media selection must remain disabled.');
          console.log('Legacy image backlog publication is disabled.');
          console.log('Use role-specific dtf-approved-visual-* assets after accuracy and responsive review.');
          NODE
          ! grep -Fq 'publish-wordpress-infographics-resilient.sh' .github/workflows/bulk-image-production.yml

      - name: Explain current production path
        shell: bash
        run: |
          echo 'No WordPress media or public page is changed by this compatibility workflow.'
          echo 'The approved visual library remains image-less where reviewed replacements do not yet exist.'
