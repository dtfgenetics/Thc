name: Repair canonical THC C004-C009 infographic sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-canonical-infographics.yml

permissions:
  contents: write

concurrency:
  group: repair-canonical-thc-infographics
  cancel-in-progress: false

jobs:
  repair:
    name: Restore verified canonical infographic binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify exact approved originals
        shell: bash
        run: |
          set -euo pipefail
          root='site/wordpress/assets/infographics'
          tmp="$RUNNER_TEMP/thc-infographic-repair"
          mkdir -p "$tmp"

          cat > "$tmp/assets.tsv" <<'EOF'
          THC-C004_Infographic_From_Cell_to_Canopy.png	https://dtfseeds.com/wp-content/uploads/2026/08/THC-C004_Infographic_From_Cell_to_Canopy.png	f37b0d34d1df59e4b3c1b00f4704aa9ddfe01f34a08da75a953c6898a9accb4e
          THC-C005_Infographic_Root_Anatomy_and_Forensics.png	https://dtfseeds.com/wp-content/uploads/2026/08/THC-C005_Infographic_Root_Anatomy_and_Forensics.png	3e5cdd4f2a823d65e42c2f12426340518bf177536ebdfd86f30126adfc417968
          THC-C006_Infographic_Stem_Transport_and_Training_Risk.png	https://dtfseeds.com/wp-content/uploads/2026/08/THC-C006_Infographic_Stem_Transport_and_Training_Risk.png	995913c034a3bd9e73f3090cf40c2e60fe82c4965e500f546eda5af4a015ce71
          THC-C007_Infographic_Leaf_Anatomy_Gas_Exchange.png	https://dtfseeds.com/wp-content/uploads/2026/08/THC-C007_Infographic_Leaf_Anatomy_Gas_Exchange.png	31300aa7d22fa29fc40a5722ebe918b94fa9a49fd506ee3f70306776a122ed50
          THC-C008_Infographic_Flower_Anatomy_Reproduction.png	https://dtfseeds.com/wp-content/uploads/2026/08/THC-C008_Infographic_Flower_Anatomy_Reproduction.png	563ad278f034f7aeea72037f9825e6adb7082942263b8cec88d043e041e178eb
          THC-C009_Infographic_Trichomes_Secretory_Biology.png	https://dtfseeds.com/wp-content/uploads/2026/08/THC-C009_Infographic_Trichomes_Secretory_Biology.png	b41c43fb663ef9fb3b1fcff5a313e0063abcdda013fb0bb40c23561d1e10cf23
          EOF

          while IFS=$'\t' read -r name url expected; do
            test -n "$name"
            out="$tmp/$name"
            curl -4 --fail --silent --show-error --location --retry 4 --retry-delay 2 "$url" --output "$out"
            actual="$(sha256sum "$out" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "Checksum mismatch for $name: expected $expected, got $actual" >&2
              exit 1
            fi
            node - "$out" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          const b = fs.readFileSync(file);
          const sig = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
          if (b.length < 24 || !b.subarray(0,8).equals(sig)) throw new Error(`${file}: invalid PNG signature`);
          const width = b.readUInt32BE(16);
          const height = b.readUInt32BE(20);
          if (width !== 2550 || height !== 3300) throw new Error(`${file}: unexpected dimensions ${width}x${height}`);
          console.log(`${file}: verified PNG ${width}x${height}`);
          NODE
            cp "$out" "$root/$name"
            old="${root}/${name%.png}.jpg"
            rm -f "$old"
          done < "$tmp/assets.tsv"

      - name: Update canonical visual-map references
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'site/wordpress/education/plant-biology-v6-visual-map.json',
            'site/wordpress/education/training-canopy-v6-visual-map.json',
            'site/wordpress/assets/infographics/import-curated-2026-08-19.json'
          ];
          const stems = [
            'THC-C004_Infographic_From_Cell_to_Canopy',
            'THC-C005_Infographic_Root_Anatomy_and_Forensics',
            'THC-C006_Infographic_Stem_Transport_and_Training_Risk',
            'THC-C007_Infographic_Leaf_Anatomy_Gas_Exchange',
            'THC-C008_Infographic_Flower_Anatomy_Reproduction',
            'THC-C009_Infographic_Trichomes_Secretory_Biology'
          ];
          for (const file of files) {
            let text = fs.readFileSync(file, 'utf8');
            for (const stem of stems) text = text.replaceAll(`${stem}.jpg`, `${stem}.png`);
            JSON.parse(text);
            fs.writeFileSync(file, text);
          }
          NODE

      - name: Validate repaired canonical source and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stage-eligible-infographics.mjs
          git diff --check
          test "$(find site/wordpress/assets/infographics -maxdepth 1 -type f -name 'THC-C00*_Infographic_*.png' | wc -l)" -ge 6
          for old in site/wordpress/assets/infographics/THC-C00{4,5,6,7,8,9}_Infographic_*.jpg; do
            if compgen -G "$old" >/dev/null; then
              echo "Corrupt legacy JPG remains: $old" >&2
              exit 1
            fi
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/wordpress/assets/infographics site/wordpress/education/plant-biology-v6-visual-map.json site/wordpress/education/training-canopy-v6-visual-map.json
          if git diff --cached --quiet; then
            echo 'Canonical infographic sources already match the verified originals.'
            exit 0
          fi
          git commit -m 'Restore verified C004-C009 infographic originals'
          git push origin HEAD:main
