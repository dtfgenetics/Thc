name: Repair canonical THC C004-C009 infographic sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-canonical-infographics.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-canonical-thc-infographics
  cancel-in-progress: false

jobs:
  repair:
    name: Restore verified canonical infographic binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify embedded PNG data and repair canonical extensions
        shell: bash
        run: |
          set -euo pipefail
          root='site/wordpress/assets/infographics'

          stems=(
            'THC-C004_Infographic_From_Cell_to_Canopy'
            'THC-C005_Infographic_Root_Anatomy_and_Forensics'
            'THC-C006_Infographic_Stem_Transport_and_Training_Risk'
            'THC-C007_Infographic_Leaf_Anatomy_Gas_Exchange'
            'THC-C008_Infographic_Flower_Anatomy_Reproduction'
            'THC-C009_Infographic_Trichomes_Secretory_Biology'
          )

          for stem in "${stems[@]}"; do
            old="$root/$stem.jpg"
            new="$root/$stem.png"

            if [[ -f "$new" ]]; then
              candidate="$new"
            elif [[ -f "$old" ]]; then
              candidate="$old"
            else
              echo "Missing canonical source for $stem" >&2
              exit 1
            fi

            node - "$candidate" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          const b = fs.readFileSync(file);
          const sig = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
          if (b.length < 24 || !b.subarray(0,8).equals(sig)) {
            throw new Error(`${file}: expected PNG bytes but signature is invalid`);
          }
          const width = b.readUInt32BE(16);
          const height = b.readUInt32BE(20);
          if (width !== 2550 || height !== 3300) {
            throw new Error(`${file}: expected 2550x3300, got ${width}x${height}`);
          }
          console.log(`${file}: verified PNG ${width}x${height}`);
          NODE

            if [[ -f "$old" ]]; then
              mv "$old" "$new"
            fi
          done

      - name: Update canonical visual-map references
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'site/wordpress/education/plant-biology-v6-visual-map.json',
            'site/wordpress/education/training-canopy-v6-visual-map.json',
            'site/wordpress/assets/infographics/import-curated-2026-08-19.json'
          ];
          const stems = [
            'THC-C004_Infographic_From_Cell_to_Canopy',
            'THC-C005_Infographic_Root_Anatomy_and_Forensics',
            'THC-C006_Infographic_Stem_Transport_and_Training_Risk',
            'THC-C007_Infographic_Leaf_Anatomy_Gas_Exchange',
            'THC-C008_Infographic_Flower_Anatomy_Reproduction',
            'THC-C009_Infographic_Trichomes_Secretory_Biology'
          ];
          for (const file of files) {
            let text = fs.readFileSync(file, 'utf8');
            for (const stem of stems) text = text.replaceAll(`${stem}.jpg`, `${stem}.png`);
            JSON.parse(text);
            fs.writeFileSync(file, text);
          }
          NODE

      - name: Validate repaired canonical source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stage-eligible-infographics.mjs
          git diff --check
          for n in 004 005 006 007 008 009; do
            count="$(find site/wordpress/assets/infographics -maxdepth 1 -type f -name "THC-C${n}_Infographic_*.png" | wc -l)"
            test "$count" -eq 1 || { echo "Expected exactly one repaired PNG for THC-C${n}, found $count" >&2; exit 1; }
            if find site/wordpress/assets/infographics -maxdepth 1 -type f -name "THC-C${n}_Infographic_*.jpg" | grep -q .; then
              echo "Mislabeled legacy JPG remains for THC-C${n}" >&2
              exit 1
            fi
          done

      - name: Commit repaired canonical assets
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/wordpress/assets/infographics site/wordpress/education/plant-biology-v6-visual-map.json site/wordpress/education/training-canopy-v6-visual-map.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Canonical infographic sources already have correct PNG extensions.'
          else
            git commit -m 'Restore verified C004-C009 infographic PNG sources'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Launch protected WordPress infographic production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run wordpress-infographic-production.yml --ref main
          echo 'Protected WordPress infographic production dispatch requested.'
