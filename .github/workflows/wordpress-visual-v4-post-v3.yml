name: Apply DTFSeeds Visual V4 After V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/polish-wordpress-commerce-archive-v4.mjs'
      - 'scripts/polish-wordpress-product-pages-v5.mjs'
      - '.github/workflows/wordpress-visual-v4-post-v3.yml'
  workflow_run:
    workflows:
      - 'Apply DTFSeeds Visual V3 After Canonical Production'
      - 'Finalize DTFSeeds Learn V3'
      - 'Rebuild DTFSeeds Visual Site On Command'
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-v4-post-v3
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com

jobs:
  v4:
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      SHOP_BACKUP_ROOT: ${{ runner.temp }}/dtf-shop-v4
      PRODUCT_BACKUP_ROOT: ${{ runner.temp }}/dtf-product-v5

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate post-V3 commerce package
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          test -s site/wordpress/pages/gallery.html
          node --check scripts/polish-wordpress-commerce-archive-v4.mjs
          node --check scripts/polish-wordpress-product-pages-v5.mjs
          grep -Fq 'dtf-gallery-v2' site/wordpress/pages/gallery.html

      - name: Apply V4 WooCommerce archive polish
        id: shop
        env:
          APPLY_COMMERCE_ARCHIVE_V4: 'true'
          BACKUP_ROOT: ${{ env.SHOP_BACKUP_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/polish-wordpress-commerce-archive-v4.mjs | tee "$RUNNER_TEMP/shop-v4.log"
          dir="$(cat "$SHOP_BACKUP_ROOT/commerce-archive-v4-backup-path.txt")"
          report="$dir/commerce-archive-v4-report.json"
          echo "template_parts=$(node -p "require(process.argv[1]).templateParts.length" "$report")" >> "$GITHUB_OUTPUT"

      - name: Apply V5 genetics product-page polish
        id: product
        env:
          APPLY_PRODUCT_VISUAL_V5: 'true'
          BACKUP_ROOT: ${{ env.PRODUCT_BACKUP_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/polish-wordpress-product-pages-v5.mjs | tee "$RUNNER_TEMP/product-v5.log"
          echo 'outcome=success' >> "$GITHUB_OUTPUT"

      - name: Verify current Genetics library, Shop, products, and Gallery
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          fetch_live() {
            local path="$1" marker="$2" output="$3" ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 -fsSL --retry 2 --retry-delay 2 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "$WP_SITE_URL${path}?dtf_post_v3=${GITHUB_RUN_ID}-${attempt}" -o "$output"
              if grep -Fqi "$marker" "$output"; then ok=1; break; fi
              sleep 7
            done
            [[ "$ok" -eq 1 ]] || { echo "Required marker not visible on $path: $marker" >&2; head -c 3000 "$output" >&2 || true; exit 1; }
          }

          seeds="$RUNNER_TEMP/seeds.html"
          shop="$RUNNER_TEMP/shop.html"
          gallery="$RUNNER_TEMP/gallery.html"
          bubblegum="$RUNNER_TEMP/bubblegum.html"
          fetch_live '/seeds/' 'DTF Genetics library' "$seeds"
          fetch_live '/shop/' 'dtf-commerce-archive-v4' "$shop"
          fetch_live '/gallery/' 'dtf-gallery-v2' "$gallery"
          fetch_live '/product/10-reg-f1-blueberry-bubblegum/' 'dtf-product-visual-v5' "$bubblegum"

          grep -Fqi 'Mango Bubbles' "$seeds"
          grep -Fqi 'Blue Mango' "$seeds"
          grep -Fqi 'Blue Bubblegum' "$seeds"
          grep -Fqi 'DTF Visual Library' "$gallery"
          grep -Fqi '/learn/infographics/' "$gallery"

          for route in \
            '/product/10-regular-f2-blue-mango-seeds/' \
            '/product/10-feminized-f2-blue-mango-x/' \
            '/product/10-reg-f1-blueberry-bubblegum/'; do
            grep -Fqi "$route" "$shop" || { echo "Required Shop product route missing: $route" >&2; exit 1; }
          done

          for body in "$seeds" "$shop" "$gallery" "$bubblegum"; do
            for forbidden in 'email@email.com' '+123456789' '© 2025 DTF Genetics'; do
              ! grep -Fqi "$forbidden" "$body" || { echo "Stale presentation remains: $forbidden" >&2; exit 1; }
            done
          done

          echo 'Post-V3 current-library and commerce verification passed.'

      - name: Upload post-V3 rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-v4-post-v3-backup-${{ github.run_id }}
          path: |
            ${{ env.SHOP_BACKUP_ROOT }}
            ${{ env.PRODUCT_BACKUP_ROOT }}
          if-no-files-found: warn
          retention-days: 30

      - name: Report post-V3 production result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          SHOP: ${{ steps.shop.outcome }}
          PRODUCT: ${{ steps.product.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          TEMPLATE_PARTS: ${{ steps.shop.outputs.template_parts }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## DTFSeeds post-V3 commerce visual deployment',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.STATUS}**`,
                `Shop archive styling: **${process.env.SHOP || 'not-run'}**`,
                `Product-page styling: **${process.env.PRODUCT || 'not-run'}**`,
                `Live verification: **${process.env.VERIFY || 'not-run'}**`,
                `Shop template parts styled: **${process.env.TEMPLATE_PARTS || 'not-reported'}**`,
                '',
                'The obsolete V4 Genetics page writer has been removed from this chain. The newer multi-line Genetics library is now read-only here; this workflow only restores Shop/archive and current product-page presentation after V3 rewrites the shared header shell.'
              ].join('\n')
            });

# Production trigger: preserve current Genetics library; restyle commerce after V3
