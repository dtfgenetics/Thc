name: Verify THC Education Wave 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-thc-education-wave2.yml'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit every education route
        id: audit
        shell: bash
        run: |
          set -u
          routes=(
            /learn/start-here/
            /learn/beginner-guides/
            /learn/beginner-guides/seed-storage-basics/
            /learn/beginner-guides/germination-mistakes/
            /learn/beginner-guides/seedling-problems/
            /learn/beginner-guides/vegetative-growth-checklist/
            /learn/beginner-guides/flowering-checklist/
            /learn/postharvest/
            /learn/postharvest/harvest-readiness/
            /learn/postharvest/drying-fundamentals/
            /learn/postharvest/curing-water-activity/
            /learn/postharvest/storage-packaging-crop-review/
            /learn/sops/
            /learn/sops/water-measurement/
            /learn/sops/environment-measurement/
            /learn/sops/lighting-measurement/
            /learn/diagnostics/
            /learn/downloads/
            /learn/sources/
            /learn/glossary/
          )
          report="$RUNNER_TEMP/education-route-report.tsv"
          printf 'route\tstatus\th1\tinfographics\n' > "$report"
          failures=0
          for route in "${routes[@]}"; do
            body="$RUNNER_TEMP/body-$(echo "$route" | tr '/' '-').html"
            status="$(curl -4 --silent --show-error --location --retry 2 --retry-delay 1 -o "$body" -w '%{http_code}' -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "https://dtfseeds.com${route}?verify=${GITHUB_RUN_ID}" || printf '000')"
            h1=no; info=no
            grep -Eqi '<h1([ >])' "$body" 2>/dev/null && h1=yes
            grep -Fqi '/learn/infographics/' "$body" 2>/dev/null && info=yes
            printf '%s\t%s\t%s\t%s\n' "$route" "$status" "$h1" "$info" | tee -a "$report"
            if [[ "$status" != 200 || "$h1" != yes || "$info" != yes ]]; then failures=$((failures+1)); fi
          done
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post route audit
        if: always()
        uses: actions/github-script@v7
        env:
          FAILURES: ${{ steps.audit.outputs.failures }}
          REPORT: ${{ steps.audit.outputs.report }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## THC Education Wave 2 route audit',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Failed route checks: **${process.env.FAILURES || 'unknown'}**`,
                '',
                '```tsv',
                process.env.REPORT || 'report unavailable',
                '```'
              ].join('\n')
            });
