name: Diagnose DTFSeeds WordPress Render Stack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/diagnose-wordpress-render-stack.mjs
      - .github/workflows/wordpress-render-stack-diagnostic.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-render-stack-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect WordPress render stack
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/diagnose-wordpress-render-stack.mjs
          node scripts/diagnose-wordpress-render-stack.mjs | tee "$RUNNER_TEMP/render-stack.json"

      - name: Report sanitized render-stack diagnostic
        if: always()
        uses: actions/github-script@v7
        env:
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
        with:
          script: |
            const fs = require('fs');
            let d = {};
            const file = process.env.RUNNER_TEMP + '/render-stack.json';
            if (fs.existsSync(file)) {
              const lines = fs.readFileSync(file, 'utf8').trim().split(/\r?\n/);
              for (let i = lines.length - 1; i >= 0; i--) {
                try { d = JSON.parse(lines[i]); break; } catch {}
              }
            }
            const plugins = (d.active_plugins || []).map(x => `- \`${x}\``);
            const mu = (d.mu_plugins || []).map(x => `- \`${x}\``);
            const dropins = (d.dropins || []).map(x => `- \`${x.file}\`: exists=${x.exists}, bytes=${x.size ?? 0}, sha256=${x.sha256 || '-'}${x.label ? `, label=${x.label}` : ''}`);
            const hooks = [];
            for (const [hook, rows] of Object.entries(d.hooks || {})) {
              hooks.push(`- **${hook}**: ${(rows || []).map(x => `${x.priority}:${x.callback}`).join(', ') || 'none'}`);
            }
            const renders = [];
            for (const r of d.renders || []) {
              renders.push(`- \`${r.path}\`: HTTP ${r.status}, current=${r.current}, stale=${r.stale}, server=${r.headers?.server || '-'}, litespeed=${r.headers?.['x-litespeed-cache'] || '-'}, age=${r.headers?.age || '-'}, cache-control=${r.headers?.['cache-control'] || '-'}`);
            }
            const meta = [];
            for (const [id, row] of Object.entries(d.page_meta || {})) {
              meta.push(`- page ${id}: template=${row.template || '(default)'}, keys=${(row.keys || []).join(', ') || 'none'}, elementor=${row.elementor || 'none'}`);
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## WordPress render-stack diagnostic',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.INSPECT_OUTCOME || 'unknown'}**`,
                `WP_CACHE: **${String(d.wp_cache ?? 'unknown')}**`,
                `show_on_front: **${d.settings?.show_on_front ?? 'unknown'}**; page_on_front: **${d.settings?.page_on_front ?? 'unknown'}**; page_for_posts: **${d.settings?.page_for_posts ?? 'unknown'}**`,
                `Theme: **${d.settings?.stylesheet || 'unknown'}** / template **${d.settings?.template || 'unknown'}**`,
                '',
                '### Active plugins',
                ...(plugins.length ? plugins : ['- none reported']),
                '',
                '### MU plugins',
                ...(mu.length ? mu : ['- none reported']),
                '',
                '### Cache/drop-in files',
                ...(dropins.length ? dropins : ['- none reported']),
                '',
                '### Relevant hook owners',
                ...(hooks.length ? hooks : ['- none reported']),
                '',
                '### Home/Learn page metadata',
                ...(meta.length ? meta : ['- none reported']),
                '',
                '### Fresh direct renders',
                ...(renders.length ? renders : ['- none reported']),
                '',
                'Diagnostic only. It may temporarily activate the existing Code Snippets management bridge to read safe runtime metadata, then restores/removes that temporary tooling. No page content, theme, route, rewrite, cache configuration, or static file is changed.'
              ].join('\n')
            });
