name: Publish Plant Biology Visual Atlas V6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/wordpress/education/plant-biology-v6-visual-map.json'
      - 'scripts/publish-wordpress-plant-biology-visual-atlas-v6.mjs'
      - '.github/workflows/wordpress-plant-biology-visual-atlas-v6.yml'
  workflow_run:
    workflows:
      - Publish Plant Biology V6 Final
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-plant-biology-visual-atlas-v6
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  publish:
    name: Publish Plant Biology chapter visual atlas
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_PLANT_BIOLOGY_VISUALS_V6: 'true'
      PLANT_BIOLOGY_VISUAL_MAP: site/wordpress/education/plant-biology-v6-visual-map.json
      BACKUP_ROOT: /tmp/dtf-plant-biology-visuals-v6

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate visual atlas mapping
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/publish-wordpress-plant-biology-visual-atlas-v6.mjs
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('site/wordpress/education/plant-biology-v6-visual-map.json','utf8'));
          const groups=Object.entries(m.chapters||{});
          const assets=groups.flatMap(([chapter,items])=>(items||[]).map(x=>({chapter,...x})));
          if(m.schemaVersion!==3||m.curriculumId!=='plant-biology-v6') throw new Error('Invalid visual map identity');
          if(groups.length!==8) throw new Error(`Expected 8 visual groups, got ${groups.length}`);
          if(assets.length!==18) throw new Error(`Expected 18 mapped visuals, got ${assets.length}`);
          if((m.gaps||[]).some(g=>g.status!=='resolved-with-approved-atlas-reference')) throw new Error('Plant Biology visual gaps must be resolved with approved atlas references');
          for(const a of assets){
            if(/draft|quarantine|superseded/i.test(a.file)) throw new Error(`Unsafe asset: ${a.file}`);
            if(!fs.existsSync(`site/wordpress/assets/infographics/${a.file}`)) throw new Error(`Missing canonical asset: ${a.file}`);
          }
          console.log(`Visual atlas validated: ${groups.length} chapter groups, ${assets.length} canonical visuals, all previously rejected flower/trichome gaps resolved.`);
          NODE

      - name: Publish visual atlas and verify live page
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/publish-wordpress-plant-biology-visual-atlas-v6.mjs | tee "$RUNNER_TEMP/plant-biology-visuals-v6.log"
          report="$BACKUP_ROOT/report.json"
          test -s "$report"
          echo "visuals=$(node -p "require(process.argv[1]).visuals" "$report")" >> "$GITHUB_OUTPUT"
          echo "wp_media=$(node -p "require(process.argv[1]).wordpressMedia" "$report")" >> "$GITHUB_OUTPUT"
          echo "fallbacks=$(node -p "require(process.argv[1]).canonicalFallbacks" "$report")" >> "$GITHUB_OUTPUT"

      - name: Independent visitor verification
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/plant-biology-visual-atlas.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "$WP_SITE_URL/learn/plant-biology/?dtf_pb6v_verify=${GITHUB_RUN_ID}-${attempt}" --output "$body"
            if grep -Fqi 'data-dtf-plant-biology-visuals-v6="true"' "$body"; then ok=1; break; fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]]
          [[ "$(grep -Fo 'class="pb6v-card"' "$body" | wc -l | tr -d ' ')" = '18' ]]
          [[ "$(grep -Fo 'data-pb6v-group=' "$body" | wc -l | tr -d ' ')" = '8' ]]
          grep -Fqi 'Whole Plant Atlas' "$body"
          grep -Fqi 'Root Anatomy &amp; Forensics' "$body"
          grep -Fqi 'Leaf Anatomy &amp; Gas Exchange' "$body"
          grep -Fqi 'Plant Hormones &amp; Signal Integration' "$body"
          grep -Fqi 'Trichomes on Cannabis Surfaces' "$body"
          grep -Fqi 'data-dtf-plant-biology-v6="true"' "$body"

      - name: Upload visual-atlas evidence and rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plant-biology-visual-atlas-v6-${{ github.run_id }}
          path: |
            /tmp/dtf-plant-biology-visuals-v6
            ${{ runner.temp }}/plant-biology-visuals-v6.log
            ${{ runner.temp }}/plant-biology-visual-atlas.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report Plant Biology visual-atlas result
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
          VALIDATE: ${{ steps.validate.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          VISUALS: ${{ steps.publish.outputs.visuals }}
          WP_MEDIA: ${{ steps.publish.outputs.wp_media }}
          FALLBACKS: ${{ steps.publish.outputs.fallbacks }}
        run: |
          {
            echo '## Plant Biology V6 visual atlas'
            echo
            echo "- Result: **${STATUS:-unknown}**"
            echo "- Mapping validation: **${VALIDATE:-not-run}**"
            echo "- WordPress publication: **${PUBLISH:-not-run}**"
            echo "- Visitor verification: **${VERIFY:-not-run}**"
            echo "- Verified visual cards: **${VISUALS:-0}**"
            echo "- WordPress media: **${WP_MEDIA:-0}**"
            echo "- Canonical fallbacks: **${FALLBACKS:-0}**"
            echo
            echo 'Rejected flower/trichome course-card visuals are replaced by approved Atlas references.'
          } >> "$GITHUB_STEP_SUMMARY"
