name: Root Cause Registry Sync

on:
  push:
    branches:
      - feature/root-cause-vertical-slice

permissions:
  contents: write

env:
  RELEASE_REGISTRY_DATE: 2026-08-28

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/root-cause-vertical-slice
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile generated game registries
        run: node scripts/reconcile-local-game-release-registry.mjs
      - name: Commit generated outputs
        run: |
          if git diff --quiet -- data/project-registry.json site/deployment/public-apps.json games/root-cause/game.json; then
            echo "No registry changes were generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/project-registry.json site/deployment/public-apps.json games/root-cause/game.json
          git commit -m "chore(root-cause): reconcile release registry"
          git push origin HEAD:feature/root-cause-vertical-slice
