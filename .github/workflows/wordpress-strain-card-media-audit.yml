name: Audit WordPress Strain Card Media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-wordpress-strain-card-media.mjs'
      - '.github/workflows/wordpress-strain-card-media-audit.yml'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit WordPress media for strain cards
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/audit-wordpress-strain-card-media.mjs
          node scripts/audit-wordpress-strain-card-media.mjs
          echo "media_count=$(node -p "require('./wordpress-strain-card-media-audit.json').mediaCount")" >> "$GITHUB_OUTPUT"
          echo "matched_targets=$(node - <<'NODE'
          const r=require('./wordpress-strain-card-media-audit.json');
          console.log(r.targets.filter(x=>x.matchCount>0).length);
          NODE
          )" >> "$GITHUB_OUTPUT"
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-strain-card-media-audit-${{ github.run_id }}
          path: wordpress-strain-card-media-audit.json
          retention-days: 14
      - name: Report audit summary
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          MEDIA_COUNT: ${{ steps.audit.outputs.media_count }}
          MATCHED_TARGETS: ${{ steps.audit.outputs.matched_targets }}
        with:
          script: |
            let lines=[];
            try {
              const fs=require('fs');
              const r=JSON.parse(fs.readFileSync('wordpress-strain-card-media-audit.json','utf8'));
              lines=r.targets.map(t=>`- ${t.id}: **${t.matchCount}** candidate media item(s)`);
            } catch {}
            const body=[
              '## WordPress strain-card media audit','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.JOB_STATUS}**`,
              `WordPress media indexed: **${process.env.MEDIA_COUNT||'not-run'}**`,
              `Genetics targets with candidate media: **${process.env.MATCHED_TARGETS||'not-run'} / 8**`,'',
              ...lines
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body});
