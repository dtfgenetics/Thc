name: Game Portfolio Contract QA

on:
  workflow_dispatch:
    inputs:
      game:
        description: Optional game ID (leave blank for all)
        required: false
        type: string
  pull_request:
    paths:
      - 'configuration/game-qa/**'
      - 'data/game-source-map.json'
      - 'games/shared-platform/**'
      - 'games/strain-showdown/**'
      - 'site/deployment/public-apps.json'
      - 'site/public-route-patch/games/**'
      - 'scripts/prepare-game-browser-qa.mjs'
      - 'scripts/game-asset-performance-audit.mjs'
      - 'scripts/sync-game-shared-platform.mjs'
      - 'scripts/lib/game-qa-catalog.mjs'
      - 'scripts/test-game-qa-catalog.mjs'
      - 'scripts/audit-game-route-integrity.mjs'
      - 'package.json'
      - '.github/workflows/game-portfolio-browser-qa.yml'
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

concurrency:
  group: game-portfolio-contract-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Canonical game contracts and route integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run games:qa:catalog-check
      - run: npm run games:platform:test
      - run: npm run games:platform:sync-check
      - run: npm run games:qa:catalog > game-qa-catalog.json
      - name: Prepare generated local game assets
        run: node scripts/prepare-game-browser-qa.mjs
      - name: Validate all public game routes and same-origin assets
        run: node scripts/audit-game-route-integrity.mjs
      - name: Audit checked-in game payloads
        run: npm run games:qa:assets
      - name: Verify portfolio release contracts
        run: npm run games:preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-portfolio-contract-qa
          path: |
            game-qa-catalog.json
            game-route-audit.json
            artifacts/game-qa/assets
          if-no-files-found: warn
          retention-days: 14
