name: Game Portfolio Quality Gate

on:
  workflow_dispatch:
    inputs:
      game:
        description: Optional game ID (leave blank for all)
        required: false
        type: string
  pull_request:
    paths:
      - 'configuration/game-qa/**'
      - 'data/game-source-map.json'
      - 'games/shared-platform/**'
      - 'games/strain-showdown/**'
      - 'site/deployment/public-apps.json'
      - 'site/public-route-patch/games/**'
      - 'scripts/game-asset-performance-audit.mjs'
      - 'scripts/sync-game-shared-platform.mjs'
      - 'scripts/lib/game-qa-catalog.mjs'
      - 'scripts/test-game-qa-catalog.mjs'
      - 'package.json'
      - '.github/workflows/game-portfolio-browser-qa.yml'
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

concurrency:
  group: game-portfolio-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Canonical catalog, runtime contracts, assets, and release integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run games:qa:catalog-check
      - run: npm run games:platform:test
      - run: npm run games:platform:sync-check
      - run: npm run games:qa:catalog > game-qa-catalog.json
      - name: Audit checked-in game payloads
        run: npm run games:qa:assets
      - name: Verify public navigation and game ownership
        run: npm run verify:navigation && npm run verify:game-scope
      - name: Verify release integrity
        run: npm run verify:release-integrity
      - name: Run cross-game polish tests
        run: node games/test/cross-game-polish.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-portfolio-quality
          path: |
            game-qa-catalog.json
            artifacts/game-qa/assets
          if-no-files-found: warn
          retention-days: 14
