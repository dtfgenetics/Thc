name: Validate WordPress Public Suite Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/package-public-suite-wordpress.py
      - scripts/assemble-wordpress-suite-v2.py
      - scripts/wordpress-suite-v2/**
      - .github/workflows/validate-wordpress-public-suite-bridge.yml
      - .github/wordpress-suite-bridge-trigger.txt

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: validate-wordpress-public-suite-bridge
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN: '32670204724'
      SOURCE_ARTIFACT: dtfseeds-public-suite-03ebe6aa87a148de28dcc10b23a3d4ea37a8587e
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble and syntax-check hardened deployer
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/package-public-suite-wordpress.py scripts/assemble-wordpress-suite-v2.py
          python scripts/assemble-wordpress-suite-v2.py "$RUNNER_TEMP/deploy-public-suite-via-wordpress-v2.mjs"
          node --check "$RUNNER_TEMP/deploy-public-suite-via-wordpress-v2.mjs"
          python - <<'PY'
          import os, pathlib, re
          src = pathlib.Path(os.environ['RUNNER_TEMP']) / 'deploy-public-suite-via-wordpress-v2.mjs'
          text = src.read_text()
          match = re.search(r"const snippetCode = String\.raw`(.*?)`\.trim\(\);", text, re.S)
          assert match, 'embedded PHP snippet not found'
          php = match.group(1).replace('${tokenLiteral}', "'0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'")
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dtf-suite-v2-snippet.php'
          out.write_text('<?php\n' + php + '\n')
          PY
          php -l "$RUNNER_TEMP/dtf-suite-v2-snippet.php"

      - name: Download current fully validated app fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/source-suite"
          mkdir -p "$RUNNER_TEMP/source-suite"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir "$RUNNER_TEMP/source-suite"
          test -s "$RUNNER_TEMP/source-suite/games/index.html"
          test -s "$RUNNER_TEMP/source-suite/games/high-land/index.html"
          test -s "$RUNNER_TEMP/source-suite/games/protect-the-plants/index.html"
          test -s "$RUNNER_TEMP/source-suite/games/protect-the-plants/api.php"
          test -s "$RUNNER_TEMP/source-suite/growlens/index.html"
          test -s "$RUNNER_TEMP/source-suite/thc-grow-doc/index.html"

      - name: Overlay current static customer shell onto fixture
        shell: bash
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/source-suite/games"
          cp site/public-route-patch/games/index.html "$RUNNER_TEMP/source-suite/games/index.html"
          cp site/public-route-patch/games/dtf-route.css "$RUNNER_TEMP/source-suite/games/dtf-route.css"
          cp site/public-route-patch/games/dtf-shell.css "$RUNNER_TEMP/source-suite/games/dtf-shell.css"
          rm -rf "$RUNNER_TEMP/source-suite/tools" "$RUNNER_TEMP/source-suite/projects"
          cp -a site/public-route-patch/tools "$RUNNER_TEMP/source-suite/tools"
          cp -a site/public-route-patch/projects "$RUNNER_TEMP/source-suite/projects"
          test -s "$RUNNER_TEMP/source-suite/games/dtf-shell.css"
          grep -Fq 'Pick what is playable. See what is coming next.' "$RUNNER_TEMP/source-suite/games/index.html"
          grep -Fq 'Measure it. Document it. Diagnose with context.' "$RUNNER_TEMP/source-suite/tools/index.html"
          grep -Fq 'What is live, what is growing, and where it belongs.' "$RUNNER_TEMP/source-suite/projects/index.html"

      - name: Build protected WordPress app-only archive
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package-public-suite-wordpress.py "$RUNNER_TEMP/source-suite" "$RUNNER_TEMP/dtf-public-suite-wordpress.zip" | tee "$RUNNER_TEMP/package-summary.json"
          test -s "$RUNNER_TEMP/dtf-public-suite-wordpress.zip"

      - name: Assert archive ownership and integrity contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, zipfile
          zpath = os.path.join(os.environ['RUNNER_TEMP'], 'dtf-public-suite-wordpress.zip')
          with zipfile.ZipFile(zpath) as z:
              names = z.namelist()
              assert len(names) == len(set(names)), 'duplicate ZIP names'
              assert names.count('.dtf-suite-manifest.json') == 1
              forbidden = [n for n in names if n == 'index.html' or n.startswith('learn/') or n.startswith('blog/')]
              assert not forbidden, forbidden
              required = [
                  'games/index.html','games/dtf-shell.css','games/high-land/index.html','games/high-iq/index.html','games/high-life/index.html',
                  'games/grower-conversations/index.html','games/seed-man-platformer/index.html','games/protect-the-plants/index.html',
                  'games/protect-the-plants/api.php','games/weedopolis/index.html','games/crossword/index.html','games/who-took-it/index.html',
                  'growlens/index.html','thc-grow-doc/index.html','thc-grow-doc/api/visual-observations.php','tools/index.html','projects/index.html','puzzles/current.json'
              ]
              for path in required: assert path in names, path
              manifest_raw = z.read('.dtf-suite-manifest.json')
              assert len(manifest_raw) <= 2 * 1024 * 1024
              manifest = json.loads(manifest_raw)
              assert manifest['purpose'] == 'dtfseeds-public-apps-only'
              assert {'/', '/learn/', '/blog/'}.issubset(set(manifest['wordPressOwnedRoutesExcluded']))
              archive_files = sorted(n for n in names if n != '.dtf-suite-manifest.json' and not n.endswith('/'))
              assert archive_files == sorted(manifest['files'])
              for rel, meta in manifest['files'].items():
                  data = z.read(rel)
                  assert len(data) == meta['size'], rel
                  assert hashlib.sha256(data).hexdigest() == meta['sha256'], rel
          print(f'validated archive entries={len(names)} bytes={os.path.getsize(zpath)}')
          PY

      - name: Assert hardened recovery and security controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'deploy-public-suite-via-wordpress-v2.mjs'
          text = path.read_text()
          checks = {
              'authenticated publisher authorization': "current_user_can('edit_pages')" in text,
              'obsolete administrator capability removed': "current_user_can('manage_options')" not in text,
              'one-time token comparison': 'hash_equals($token, $supplied)' in text,
              'server deployment lock': 'dtf_suite_deploy_lock' in text,
              'whole archive hash': 'Whole-archive SHA-256 mismatch.' in text,
              'duplicate ZIP rejection': 'Duplicate ZIP entry rejected.' in text,
              'ZIP symlink rejection': 'Symlink entries are forbidden.' in text,
              'WordPress route ownership rejection': 'WordPress-owned route is forbidden in app deployment.' in text,
              'bounded manifest': '$max_manifest' in text and '2 * 1024 * 1024' in text,
              'prepared mutation phase': "'phase'=>'prepared'" in text,
              'backup-moved mutation phase': "$state['current']['phase'] = 'backup_moved'" in text,
              'new-placed mutation phase': "'phase'=>'new_placed'" in text,
              'rollback endpoint': "register_rest_route('dtf-suite/v2', '/rollback'" in text,
              'abort endpoint': "register_rest_route('dtf-suite/v2', '/abort'" in text,
              'finalize endpoint': "register_rest_route('dtf-suite/v2', '/finalize'" in text,
              'ambiguous commit polling': 'Polling persisted server state before any recovery action.' in text,
              'app-only WordPress ownership boundary': 'Home and Learn are WordPress-owned and are verified independently after this app-only transaction.' in text,
              'current Games verification': 'Pick what is playable. See what is coming next.' in text,
              'current Tools verification': 'Measure it. Document it. Diagnose with context.' in text,
              'current Projects verification': 'What is live, what is growing, and where it belongs.' in text,
              'unified shell allowlist': 'games/dtf-shell.css' in text,
              'Protect the Plants deployment scope': 'games/protect-the-plants' in text,
              'Protect the Plants API gate': '/games/protect-the-plants/api.php?action=active' in text,
              'forbidden root static path check': "name === 'index.html'" in text,
              'forbidden learn static path check': "strpos($name, 'learn/')" in text,
              'forbidden blog static path check': "strpos($name, 'blog/')" in text,
              'stale touched lock refuses takeover': 'dtf_stale_touched_lock' in text,
              'client recovery inspects persisted state': 'const state = await getState();' in text and 'recoverFailure' in text,
          }
          missing = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(f'{name}: {"PASS" if ok else "FAIL"}')
          if missing: raise SystemExit('missing hardened controls: ' + ', '.join(missing))
          PY

      - name: Upload validated deploy inputs
        uses: actions/upload-artifact@v4
        with:
          name: dtf-public-suite-wordpress-v2-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dtf-public-suite-wordpress.zip
            ${{ runner.temp }}/package-summary.json
            ${{ runner.temp }}/deploy-public-suite-via-wordpress-v2.mjs
          if-no-files-found: error
          retention-days: 7

      - name: Report bridge validation
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## No-SSH WordPress public-suite bridge validation',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Commit: \`${context.sha}\``,
                `Result: **${process.env.STATUS}**`,
                '',
                'Checks: canonical v2 assembly, Node/PHP syntax, a current fully validated app fixture plus the current Games/Tools/Projects shell, app-only archive creation, Protect the Plants PHP packaging, per-file SHA-256 verification, duplicate/manifest/path ownership checks, authenticated publisher plus one-time-token authorization, current live markers, and transaction locking/recovery/rollback/abort/finalize controls.',
                '',
                'This workflow is non-mutating. Production publication remains a separate protected transaction.'
              ].join('\n')
            });
