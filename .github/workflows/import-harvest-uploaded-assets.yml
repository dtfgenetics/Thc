name: Import Uploaded Harvest Education Assets

on:
  push:
    branches: [main]
    paths:
      - 'site/wordpress/education/upload-staging/harvest-v2/READY'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  WP_SITE_URL: https://dtfseeds.com
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_INFOGRAPHIC_GALLERY: 'true'
      BACKUP_ROOT: /tmp/dtf-harvest-upload
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and checksum uploaded Harvest assets
        shell: bash
        run: |
          set -euo pipefail
          stage='site/wordpress/education/upload-staging/harvest-v2'
          out='site/wordpress/assets/infographics'
          mkdir -p "$out"
          files=(
            'THC-HARV-01_harvest_readiness_indicators.webp'
            'THC-HARV-02_harvest_trichome_maturity_interpretation.webp'
            'THC-HARV-03_harvest_handling_workflow.webp'
            'THC-HARV-04_bud_washing_overview.webp'
            'THC-HARV-05_drying_environment_fundamentals.webp'
            'THC-HARV-06_drying_failure_modes.webp'
          )
          hashes=(
            '371b84769d1c379fe6a869e91e376bb41cbb4a8106069a070e8ad413cda30251'
            'fbecac70ab0319c5fdea9b79299d1fdf19fbb4400575dce2038c30a252a825a8'
            'd4ac4e9ce6a299a9adda2e94b5c1db96f0a139aa11cac9aafb4f9d0ab5c240d5'
            '3dea73a328913b9070be87eb9516ac0446c5c0ce2ae7e80253549b6b70bf93eb'
            'fb07f7b2a1477d5bdeef75d53ea26b3d32aeab161362347e89fb8dd1ca487569'
            '22c8650406acad5eb0ac58d4bb8863354ecd10c13ab14e41ba0bf077db9e3a7a'
          )
          for i in "${!files[@]}"; do
            file="${files[$i]}"
            parts=("$stage/$file.b64.part"*)
            [[ -e "${parts[0]}" ]] || { echo "Missing chunks for $file" >&2; exit 1; }
            cat "${parts[@]}" | base64 -d > "$out/$file"
            test -s "$out/$file"
            file "$out/$file" | grep -qi 'webp'
            actual="$(sha256sum "$out/$file" | awk '{print $1}')"
            [[ "$actual" == "${hashes[$i]}" ]] || { echo "Checksum mismatch for $file: $actual" >&2; exit 1; }
          done

      - name: Commit canonical image assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/wordpress/education/upload-staging/harvest-v2
          git config user.name 'DTF Harvest Asset Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add site/wordpress/assets/infographics site/wordpress/education/upload-staging
          if git diff --cached --quiet; then
            echo 'No repository changes required.'
          else
            git commit -m 'Publish uploaded Harvest education infographics'
            git push origin HEAD:main
          fi

      - name: Publish canonical infographic library and subject placements
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME missing}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD missing}"
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          node scripts/deploy-wordpress-infographic-library-rest.mjs | tee "$RUNNER_TEMP/harvest-infographic-publish.log"

      - name: Verify live Harvest and infographic library
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local path="$1" marker="$2" body="$RUNNER_TEMP/$(echo "$path" | tr '/' '_').html" ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 --fail --silent --show-error --location \
                -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
                "$WP_SITE_URL${path}?dtf_harvest_assets=${GITHUB_RUN_ID}-${attempt}" -o "$body"
              if grep -Fqi "$marker" "$body"; then ok=1; break; fi
              sleep 6
            done
            [[ "$ok" -eq 1 ]]
          }
          verify '/learn/harvest-postharvest/' 'HARV 03 harvest handling workflow'
          verify '/learn/infographics/' 'HARV 03 harvest handling workflow'
          body="$RUNNER_TEMP/_learn_harvest-postharvest_.html"
          for marker in \
            'HARV 01 harvest readiness indicators' \
            'HARV 02 harvest trichome maturity interpretation' \
            'HARV 03 harvest handling workflow' \
            'HARV 04 bud washing overview' \
            'HARV 05 drying environment fundamentals' \
            'HARV 06 drying failure modes'; do
            grep -Fqi "$marker" "$body" || { echo "Missing live Harvest asset: $marker" >&2; exit 1; }
          done

      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-upload-${{ github.run_id }}
          path: |
            /tmp/dtf-harvest-upload
            ${{ runner.temp }}/harvest-infographic-publish.log
            ${{ runner.temp }}/*.html
          if-no-files-found: warn
          retention-days: 30
