name: Clear DTFSeeds Static WordPress Shadows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hostinger-wordpress-shadow-cleanup.yml
      - scripts/retire-support-static-shadows-via-wordpress.mjs
      - site/wordpress/pages/about.html
      - site/wordpress/pages/gallery.html
      - site/wordpress/visual-quality/retired-public-visuals.json

permissions:
  contents: read

# Compatibility entry point for the original shadow-cleanup workflow name.
# The SSH implementation was retired because the production environment does
# not expose those secrets and because its six-image Gallery requirement
# conflicted with the approved-visual-only policy. Both cleanup entry points now
# use the same proven, token-protected WordPress bridge and serialization lock.
concurrency:
  group: dtf-wordpress-temporary-code-snippets-bridge
  cancel-in-progress: false

jobs:
  cleanup:
    name: Verify and retire stale support-page shadows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate canonical support policy
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          grep -Fq 'data-dtf-layout="about-visual-v1"' site/wordpress/pages/about.html
          grep -Fq 'One brand. Four core experiences.' site/wordpress/pages/about.html
          grep -Fq 'data-dtf-layout="gallery-visual-v2"' site/wordpress/pages/gallery.html
          grep -Fq 'Approved visuals only.' site/wordpress/pages/gallery.html
          ! grep -Fqi '<img' site/wordpress/pages/gallery.html
          node --check scripts/retire-support-static-shadows-via-wordpress.mjs

      - name: Back up, retire, verify, and clean temporary bridge
        shell: bash
        run: |
          set -euo pipefail
          node scripts/retire-support-static-shadows-via-wordpress.mjs | tee "$RUNNER_TEMP/support-shadow-cleanup.json"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/support-shadow-cleanup.json"

      - name: Record compatibility cleanup result
        if: always()
        shell: bash
        run: |
          {
            echo '## DTFSeeds static-shadow compatibility cleanup'
            echo
            echo '- Legacy SSH transport: retired'
            echo '- Legacy Gallery image-count requirement: retired'
            echo '- Current transport: authenticated temporary WordPress Code Snippets bridge'
            echo '- Backup-first mutation: yes'
            echo '- Automatic rollback on visitor verification failure: yes'
          } >> "$GITHUB_STEP_SUMMARY"
