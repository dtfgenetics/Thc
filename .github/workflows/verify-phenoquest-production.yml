name: Verify PhenoQuest Production

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/verify-phenoquest-live.mjs
      - .github/workflows/verify-phenoquest-production.yml
      - site/public-route-patch/games/phenoquest/source-revision.txt
      - .github/workflows/build-dtfseeds-public-suite.yml
  workflow_run:
    workflows: ["Deploy DTFSeeds Public Suite via WordPress V2"]
    types: [completed]
  schedule:
    - cron: '27 10 * * *'

permissions:
  contents: read

concurrency:
  group: verify-phenoquest-production-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout verifier source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate verifier
        run: node --check scripts/verify-phenoquest-live.mjs

      - name: Verify live PhenoQuest build
        env:
          SITE: https://dtfseeds.com
        run: node scripts/verify-phenoquest-live.mjs

      - name: Summarize
        if: always()
        run: |
          {
            echo '## PhenoQuest production verification'
            echo
            echo '- Route: https://dtfseeds.com/games/phenoquest/'
            echo '- Requires the exact pinned dtfgenetics/Catching-phenos revision.'
            echo '- Verifies self-contained ES-module packaging, guided first session, Lineage Lab/restoration runtime, route-local data, mobile touch sizing, and reduced motion.'
            echo '- Rejects repository-relative runtime imports.'
          } >> "$GITHUB_STEP_SUMMARY"
