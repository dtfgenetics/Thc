name: Publish Evidence Measurement Method Lab V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/wordpress/education/evidence-measurement-method-plates-v1.json'
      - 'scripts/publish-wordpress-evidence-method-plates-v1.mjs'
      - '.github/workflows/wordpress-evidence-method-plates-v1.yml'
  workflow_run:
    workflows:
      - Publish Genetics and Evidence V6
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-evidence-method-plates-v1
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  publish:
    name: Publish Evidence Measurement Method Lab
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_EVIDENCE_METHOD_PLATES_V1: 'true'
      EVIDENCE_METHOD_PLATES_PATH: site/wordpress/education/evidence-measurement-method-plates-v1.json
      BACKUP_ROOT: /tmp/dtf-evidence-method-plates-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Evidence Method Lab package
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/publish-wordpress-evidence-method-plates-v1.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('site/wordpress/education/evidence-measurement-method-plates-v1.json','utf8'));
          if(d.schemaVersion!==1||d.id!=='evidence-measurement-method-plates-v1') throw new Error('Invalid method-lab identity');
          if(!Array.isArray(d.plates)||d.plates.length!==6) throw new Error('Expected exactly six method plates');
          for(const p of d.plates){
            if((p.methodSteps||[]).length<5) throw new Error(`${p.id}: method steps incomplete`);
            if((p.failureModes||[]).length<4) throw new Error(`${p.id}: failure modes incomplete`);
            if((p.recordFields||[]).length<9) throw new Error(`${p.id}: record fields incomplete`);
          }
          console.log('Evidence Method Lab validated: 6 full plates.');
          NODE

      - name: Publish Evidence Method Lab
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/publish-wordpress-evidence-method-plates-v1.mjs | tee "$RUNNER_TEMP/evidence-method-plates-v1.log"
          report="$BACKUP_ROOT/report.json"
          test -s "$report"
          echo "plates=$(node -p "require(process.argv[1]).plates" "$report")" >> "$GITHUB_OUTPUT"
          echo "checks=$(node -p "require(process.argv[1]).knowledgeChecks" "$report")" >> "$GITHUB_OUTPUT"

      - name: Independent public verification
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/evidence-method-lab-live.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "$WP_SITE_URL/learn/research-methods/?dtf_empv_verify=${GITHUB_RUN_ID}-${attempt}" --output "$body"
            if grep -Fqi 'data-dtf-evidence-method-plates-v1="true"' "$body"; then ok=1; break; fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]]
          [[ "$(grep -Fo 'data-empv-plate=' "$body" | wc -l | tr -d ' ')" = '6' ]]
          [[ "$(grep -Fo 'class="empv-check"' "$body" | wc -l | tr -d ' ')" = '6' ]]
          grep -Fqi 'Accuracy, Precision, Resolution &amp; Uncertainty' "$body"
          grep -Fqi 'Calibration, Drift &amp; Reference Cross-Checks' "$body"
          grep -Fqi 'Sensor Placement, Canopy Grids &amp; Representative Sampling' "$body"
          grep -Fqi 'Baseline, Control, Treatment &amp; Position Effects' "$body"
          grep -Fqi 'Standardized Imaging, Scale &amp; Scoring Anchors' "$body"
          grep -Fqi 'Replication, Uncertainty, Correlation &amp; the Evidence Chain' "$body"
          grep -Fqi 'data-dtf-evidence-measurement-v6="true"' "$body"

      - name: Upload publication evidence and rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-method-plates-v1-${{ github.run_id }}
          path: |
            /tmp/dtf-evidence-method-plates-v1
            ${{ runner.temp }}/evidence-method-plates-v1.log
            ${{ runner.temp }}/evidence-method-lab-live.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report Evidence Method Lab result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          VALIDATE: ${{ steps.validate.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          PLATES: ${{ steps.publish.outputs.plates }}
          CHECKS: ${{ steps.publish.outputs.checks }}
        with:
          script: |
            const body=[
              '## Evidence & Measurement Method Lab V1','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `Package validation: **${process.env.VALIDATE || 'not-run'}**`,
              `WordPress publication: **${process.env.PUBLISH || 'not-run'}**`,
              `Visitor verification: **${process.env.VERIFY || 'not-run'}**`,
              `Live method plates: **${process.env.PLATES || '0'}**`,
              `Knowledge checks: **${process.env.CHECKS || '0'}**`,'',
              'The live Evidence page now teaches six previously open method gaps directly: accuracy/precision/uncertainty; calibration/drift; sensor placement/spatial sampling; baseline/control/randomization; standardized imaging/scoring; and replication/correlation/evidence-chain reasoning. Downloadable poster artwork remains separately quality-gated.'
            ].join('\n');
            for(const issue_number of [46,136]){
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number,body});
            }
