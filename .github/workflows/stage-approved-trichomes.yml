name: Stage approved trichome infographic

on:
  push:
    branches:
      - education/approved-trichomes-2026-09-10
    paths:
      - .github/image-staging/trichomes.trigger

permissions:
  contents: write

jobs:
  recover-approved-trichome:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: education/approved-trichomes-2026-09-10
          persist-credentials: true
          fetch-depth: 0

      - name: Download and validate approved Drive image
        shell: bash
        env:
          DRIVE_FILE_ID: 10l97uHp4DMHjVx-wI9YNj2RKbAX0Utle
          EXPECTED_SHA256: cff5be65317057a84c3d1d83d361da454e43637776bfbe6846f88dde1b8a0654
          DEST: site/wordpress/assets/infographics/THC-APPROVED_Trichomes_Secretory_Biology_v1.jpg
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$DEST")"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&confirm=t" \
            --output "$DEST"
          echo "${EXPECTED_SHA256}  ${DEST}" | sha256sum -c -
          file "$DEST" | tee /tmp/file-info.txt
          grep -qi 'JPEG image data' /tmp/file-info.txt
          grep -Eq '900 x 1272|900x1272' /tmp/file-info.txt

      - name: Commit approved binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/wordpress/assets/infographics/THC-APPROVED_Trichomes_Secretory_Biology_v1.jpg
          git commit -m "Add approved trichome secretory biology infographic"
          git push origin HEAD:education/approved-trichomes-2026-09-10
