name: Audit DTF Genetics CDN Sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-genetics-cdn-sources.mjs'
      - 'site/wordpress/products/seed-line-catalog.json'
      - '.github/workflows/audit-genetics-cdn-sources.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: audit-dtf-genetics-cdn-sources
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit current public reviewed-card source bytes
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/audit-genetics-cdn-sources.mjs
          node scripts/audit-genetics-cdn-sources.mjs
      - name: Upload source identity report
        uses: actions/upload-artifact@v4
        with:
          name: genetics-cdn-source-audit-${{ github.run_id }}
          path: genetics-cdn-source-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Report source identities
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
        with:
          script: |
            const fs=require('fs');
            let details='Report was not generated.';
            if(fs.existsSync('genetics-cdn-source-report.json')){
              const r=JSON.parse(fs.readFileSync('genetics-cdn-source-report.json','utf8'));
              details=r.rows.map(x=>`- ${x.lineName} ${x.generation} ${x.seedType}: ${x.cdnByteLength} bytes · ${x.cdnSha256} · ${x.mimeType} · ${x.width}x${x.height}`).join('\n');
            }
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body:['## Genetics reviewed CDN source identity audit','',`Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,`Commit: \`${context.sha}\``,`Result: **${process.env.STATUS}**`,'',details,'','The catalog keeps original-upload SHA/length as provenance. These values identify the stable public CDN renditions actually ingested by WordPress.'].join('\n')});
