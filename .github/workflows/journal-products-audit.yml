name: Audit DTFSeeds Journal Products

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit-journal-products.mjs
      - .github/workflows/journal-products-audit.yml

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      JOURNAL_AUDIT_ROOT: /tmp/dtf-journal-audit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate audit
        run: node --check scripts/audit-journal-products.mjs
      - name: Inspect public journal product records
        id: audit
        run: node scripts/audit-journal-products.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-products-audit-${{ github.run_id }}
          path: /tmp/dtf-journal-audit
          if-no-files-found: warn
          retention-days: 14
      - name: Report result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body=[
              '## DTFSeeds journal inventory audit','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.JOB_STATUS}**`,
              `Journal inventory comparison: **${process.env.AUDIT_OUTCOME || 'not-run'}**`,'',
              'Read-only audit: product IDs, slugs, pricing state, categories, options, images, and copy are compared before any merge or archive decision.'
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body});
