name: Publish Bulk THC Infographics to WordPress Production

on:
  workflow_run:
    workflows:
      - Import Bulk THC Infographic Assets
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-infographic-bulk-publish
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      INFOGRAPHIC_SOURCE_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
      INFOGRAPHIC_DIR: ${{ github.workspace }}/.tmp/eligible-infographics
      INFOGRAPHIC_PLACEMENT_CONFIG: ${{ github.workspace }}/site/wordpress/assets/infographics/placement-rules.json
      INFOGRAPHIC_EXCLUSIONS: ${{ github.workspace }}/site/wordpress/assets/infographics/infographic-exclusions.json
      BACKUP_ROOT: ${{ runner.temp }}/wordpress-infographic-bulk-publish

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate protected publication package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_run' ]]; then
            [[ "${{ github.event.workflow_run.conclusion }}" == 'success' ]]
          fi
          : "${WP_API_USERNAME:?WordPress username missing}"
          : "${WP_API_PASSWORD:?WordPress password missing}"
          node --check scripts/stage-eligible-infographics.mjs
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          test -f site/wordpress/assets/infographics/placement-rules.json
          test -f site/wordpress/assets/infographics/infographic-exclusions.json

      - name: Stage only publication-eligible images
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-eligible-infographics.mjs
          report="$BACKUP_ROOT/infographic-quality-gate.json"
          echo "source_count=$(node -p "require(process.argv[1]).sourceImageCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "eligible_count=$(node -p "require(process.argv[1]).eligibleImageCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "excluded_count=$(node -p "require(process.argv[1]).excludedImageCount" "$report")" >> "$GITHUB_OUTPUT"

      - name: Normalize eligible WebP images for WordPress
        shell: bash
        run: |
          set -euo pipefail
          converted=0
          while IFS= read -r -d '' file; do
            output="${file%.*}.png"
            ffmpeg -hide_banner -loglevel error -y -i "$file" -frames:v 1 "$output"
            test -s "$output"
            rm "$file"
            converted=$((converted + 1))
          done < <(find "$INFOGRAPHIC_DIR" -type f -iname '*.webp' -print0)
          echo "Normalized ${converted} WebP asset(s)."

      - name: Upload eligible media and rebuild subject placements
        id: media
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy-wordpress-infographic-library-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-infographic-backup-path.txt")"
          result="$backup_dir/deployment-result.json"
          echo "source_count=$(node -p "require(process.argv[1]).sourceImageCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "uploaded_count=$(node -p "require(process.argv[1]).uploadedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "reused_count=$(node -p "require(process.argv[1]).reusedMediaCount" "$result")" >> "$GITHUB_OUTPUT"

      - name: Verify visitor-facing infographic library
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/infographic-library.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "https://dtfseeds.com/learn/infographics/?dtf_bulk_publish=${GITHUB_RUN_ID}-${attempt}" \
              --output "$page"
            if grep -Fqi 'THC Infographic Library' "$page" && grep -Eqi '<img[^>]+wp-content/uploads/' "$page"; then
              ok=1
              break
            fi
            sleep 8
          done
          [[ "$ok" -eq 1 ]]
          image_count="$(grep -Eoi '<img[^>]+wp-content/uploads/' "$page" | wc -l | tr -d ' ')"
          test "$image_count" -ge 10
          echo "live_image_count=$image_count" >> "$GITHUB_OUTPUT"

      - name: Preserve rollback and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-infographic-bulk-publish-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wordpress-infographic-bulk-publish
            ${{ runner.temp }}/infographic-library.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report production result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          SOURCE_COUNT: ${{ steps.quality.outputs.source_count }}
          ELIGIBLE_COUNT: ${{ steps.quality.outputs.eligible_count }}
          EXCLUDED_COUNT: ${{ steps.quality.outputs.excluded_count }}
          UPLOADED_COUNT: ${{ steps.media.outputs.uploaded_count }}
          REUSED_COUNT: ${{ steps.media.outputs.reused_count }}
          LIVE_IMAGE_COUNT: ${{ steps.verify.outputs.live_image_count }}
        with:
          script: |
            const sourceRun = context.eventName === 'workflow_run'
              ? context.payload.workflow_run?.html_url
              : 'manual dispatch';
            const body = [
              '## Bulk infographic WordPress production', '',
              `Status: **${process.env.STATUS}**`,
              `Source bulk-import run: ${sourceRun}`,
              `Source-controlled images inspected: **${process.env.SOURCE_COUNT || 'not-run'}**`,
              `Publication-eligible images: **${process.env.ELIGIBLE_COUNT || 'not-run'}**`,
              `Excluded/review images: **${process.env.EXCLUDED_COUNT || 'not-run'}**`,
              `New WordPress media uploads: **${process.env.UPLOADED_COUNT || 'not-run'}**`,
              `Existing WordPress media reused: **${process.env.REUSED_COUNT || 'not-run'}**`,
              `Images observed on live page: **${process.env.LIVE_IMAGE_COUNT || 'not-run'}**`,
              `Production run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Visitor target: https://dtfseeds.com/learn/infographics/'
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 46, body });
