name: Force DTF Visual + Favicon Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-visual-favicon-production.yml'

permissions:
  contents: read
  issues: write

env:
  WP_SITE_URL: https://dtfseeds.com

concurrency:
  group: dtfseeds-visual-favicon-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-visual-rebuild
      APPLY_VISUAL_REBUILD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate package and credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          test -s site/wordpress/assets/brand/dtf-potleaf-512.png
          node --check scripts/rebuild-wordpress-visual-site.mjs

      - name: Rebuild visible WordPress site and install cannabis-leaf icon
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rebuild-wordpress-visual-site.mjs | tee "$RUNNER_TEMP/rebuild.log"
          report_dir="$(cat "$BACKUP_ROOT/visual-rebuild-backup-path.txt")"
          report="$report_dir/visual-rebuild-report.json"
          echo "brand_id=$(node -p "require(process.argv[1]).brandMediaId || 0" "$report")" >> "$GITHUB_OUTPUT"
          echo "media_count=$(node -p "require(process.argv[1]).mediaCount || 0" "$report")" >> "$GITHUB_OUTPUT"

      - name: Verify WordPress site icon is the DTF cannabis leaf
        id: icon
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' "$WP_API_USERNAME" "$WP_API_PASSWORD" | base64 -w0)"
          curl -4 -fsSL -H "Authorization: Basic $auth" -H 'Cache-Control: no-cache' \
            "$WP_SITE_URL/wp-json/wp/v2/settings?context=edit" -o "$RUNNER_TEMP/settings.json"
          site_icon="$(node -p "Number(require(process.argv[1]).site_icon || 0)" "$RUNNER_TEMP/settings.json")"
          [[ "$site_icon" -gt 0 ]] || { echo 'WordPress site_icon is not set' >&2; exit 1; }
          curl -4 -fsSL -H "Authorization: Basic $auth" \
            "$WP_SITE_URL/wp-json/wp/v2/media/$site_icon?context=edit" -o "$RUNNER_TEMP/icon.json"
          node - "$RUNNER_TEMP/icon.json" <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const text = `${m.slug || ''} ${m.title?.rendered || ''} ${m.alt_text || ''}`.toLowerCase();
          if (!text.includes('dtf-potleaf') && !text.includes('dtf genetics cannabis leaf')) {
            throw new Error('Active site icon is not the DTF cannabis leaf asset');
          }
          NODE
          echo "site_icon=$site_icon" >> "$GITHUB_OUTPUT"

      - name: Verify visitor-facing Home, Learn, and favicon HTML
        id: live
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home.html"
          learn="$RUNNER_TEMP/learn.html"
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 -fsSL --retry 2 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
              "$WP_SITE_URL/?dtf_visual_favicon=${GITHUB_RUN_ID}-${attempt}" -o "$home"
            curl -4 -fsSL --retry 2 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
              "$WP_SITE_URL/learn/?dtf_visual_favicon=${GITHUB_RUN_ID}-${attempt}" -o "$learn"
            if grep -Fqi 'Genetics. Plant science. Tools. Games. Community.' "$home" && \
               grep -Fqi 'Explore by subject' "$learn"; then
              break
            fi
            sleep 5
          done

          grep -Fqi 'Genetics. Plant science. Tools. Games. Community.' "$home"
          grep -Fqi 'Explore by subject' "$learn"
          grep -Fqi 'DTF Genetics cannabis leaf' "$home"

          icon_json="$RUNNER_TEMP/icon.json"
          node - "$home" "$icon_json" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const html = fs.readFileSync(process.argv[2], 'utf8');
          const media = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const source = media.source_url || '';
          const stem = path.basename(source).replace(/\.[^.]+$/, '').replace(/^cropped-/, '');
          const links = [...html.matchAll(/<link[^>]+rel=["'][^"']*icon[^"']*["'][^>]+href=["']([^"']+)["']/gi)].map(m => m[1]);
          if (!links.length) throw new Error('No favicon link is present in live HTML');
          if (stem && !links.some(href => href.includes(stem))) {
            throw new Error(`Live favicon does not reference the DTF cannabis leaf asset. Found: ${links.join(', ')}`);
          }
          console.log(`Verified live favicon: ${links[0]}`);
          NODE

          home_images="$(grep -o '/wp-content/uploads/' "$home" | wc -l | tr -d ' ')"
          learn_images="$(grep -o '/wp-content/uploads/' "$learn" | wc -l | tr -d ' ')"
          [[ "$home_images" -ge 8 ]] || { echo "Home only has $home_images WordPress media refs" >&2; exit 1; }
          [[ "$learn_images" -ge 10 ]] || { echo "Learn only has $learn_images WordPress media refs" >&2; exit 1; }
          for forbidden in 'email@email.com' '+123456789' '© 2025 DTF GENETICS'; do
            ! grep -Fqi "$forbidden" "$home" || { echo "Stale content remains on Home: $forbidden" >&2; exit 1; }
          done
          echo "home_images=$home_images" >> "$GITHUB_OUTPUT"
          echo "learn_images=$learn_images" >> "$GITHUB_OUTPUT"

      - name: Upload rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-visual-favicon-backup-${{ github.run_id }}
          path: /tmp/dtf-visual-rebuild
          if-no-files-found: warn
          retention-days: 30

      - name: Report production result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          SITE_ICON: ${{ steps.icon.outputs.site_icon }}
          HOME_IMAGES: ${{ steps.live.outputs.home_images }}
          LEARN_IMAGES: ${{ steps.live.outputs.learn_images }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## DTF visual + potleaf favicon production',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.JOB_STATUS}**`,
                `Cannabis-leaf site icon media ID: **${process.env.SITE_ICON || 'not-run'}**`,
                `Home WordPress media references: **${process.env.HOME_IMAGES || 'not-run'}**`,
                `Learn WordPress media references: **${process.env.LEARN_IMAGES || 'not-run'}**`,
                `Visitor-facing verification: **${process.env.LIVE_OUTCOME || 'not-run'}**`,
                '',
                'This run only counts as successful if the rebuilt Home/Learn content and the cannabis-leaf favicon are both visible in cache-busted public HTML.'
              ].join('\n')
            });

# Trusted-main trigger: execute the visitor-facing visual rebuild and potleaf favicon installation now.
