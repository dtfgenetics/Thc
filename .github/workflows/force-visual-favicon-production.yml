name: Force DTF Visual + Favicon Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-visual-favicon-production.yml'

permissions:
  contents: read

# RETIRED VISUAL MUTATION PATH
# The original workflow coupled favicon verification to the unrestricted legacy
# Home/Learn visual rebuild. That can reintroduce quarantined media. Site visual
# ownership now belongs to Learning V3 + the approved shared shell; this command
# remains as a read-only favicon/owner verifier.
concurrency:
  group: dtfseeds-visual-favicon-production-retired
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate approved visual ownership
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/run-wordpress-visual-rebuild-approved-only.mjs
          node --check scripts/prepare-learning-v3-owner-aware-publisher.mjs
          node - <<'NODE'
          const policy=require('./site/wordpress/visual-quality-policy.json');
          if(Number(policy.schemaVersion)<3 || policy.mode!=='quarantine') throw new Error('Visual quality quarantine policy v3+ is required.');
          if(policy.replacementPolicy?.automaticKeywordMediaSelectionAllowed!==false) throw new Error('Automatic keyword media selection must remain disabled.');
          if(policy.replacementPolicy?.legacyInfographicReuseAllowed!==false) throw new Error('Legacy infographic reuse must remain disabled.');
          NODE
          ! grep -Fq 'node scripts/rebuild-wordpress-visual-site.mjs' .github/workflows/force-visual-favicon-production.yml

      - name: Verify WordPress site icon is the DTF cannabis leaf
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' "$WP_API_USERNAME" "$WP_API_PASSWORD" | base64 -w0)"
          curl -4 -fsSL --retry 2 --retry-delay 2 -H "Authorization: Basic $auth" -H 'Cache-Control: no-cache' \
            "$WP_SITE_URL/wp-json/wp/v2/settings?context=edit" -o "$RUNNER_TEMP/settings.json"
          site_icon="$(node -p "Number(require(process.argv[1]).site_icon || 0)" "$RUNNER_TEMP/settings.json")"
          [[ "$site_icon" -gt 0 ]] || { echo 'WordPress site_icon is not set' >&2; exit 1; }
          curl -4 -fsSL --retry 2 --retry-delay 2 -H "Authorization: Basic $auth" \
            "$WP_SITE_URL/wp-json/wp/v2/media/$site_icon?context=edit" -o "$RUNNER_TEMP/icon.json"
          node - "$RUNNER_TEMP/icon.json" <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const text=`${m.slug||''} ${m.title?.rendered||''} ${m.alt_text||''}`.toLowerCase();
          if(!text.includes('dtf-potleaf') && !text.includes('dtf genetics cannabis leaf')) throw new Error('Active site icon is not the DTF cannabis leaf asset');
          console.log(`Verified DTF cannabis-leaf site icon media ${m.id}.`);
          NODE

      - name: Verify Home and Learn remain on approved owners
        shell: bash
        run: |
          set -euo pipefail
          blocked='(dtf-edu-|THC[-_ ]?C[0-9]{3}|THC[-_ ]?ENC[-_ ]?[0-9]{3}|Cannabis[_ -]Plant[_ -]Anatomy[_ -]Infographic|Beneficial[_ -]Insects[_ -]and[_ -]Biological[_ -]Controls)'
          for spec in '/|data-dtf-layout="home-v3"' '/learn/|data-dtf-layout="learn-v3"'; do
            route="${spec%%|*}"; marker="${spec#*|}"; body="$RUNNER_TEMP/$(printf '%s' "$route" | tr '/' '_').html"; ok=0
            for attempt in 1 2 3 4 5 6; do
              if curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --connect-timeout 20 --max-time 45 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
                "$WP_SITE_URL${route}?dtf_favicon_guard=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$body"; then
                if grep -Fq "$marker" "$body" && ! grep -Eqi "$blocked" "$body"; then ok=1; break; fi
              fi
              [[ "$attempt" -lt 6 ]] && sleep $((attempt * 3))
            done
            [[ "$ok" -eq 1 ]] || { echo "Approved visual owner verification failed on $route" >&2; exit 1; }
          done
          echo 'Favicon verified without invoking the retired unrestricted visual rebuild.'
