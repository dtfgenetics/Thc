name: Publish THC Articles to WordPress

on:
  workflow_dispatch:
    inputs:
      article_slug:
        description: Article slug to publish, or "all"
        required: true
        default: all
        type: string
  push:
    branches:
      - main
    paths:
      - site/wordpress/articles/**
      - scripts/publish-wordpress-articles-rest.mjs
      - .github/workflows/wordpress-public-content-cleanup.yml
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-thc-articles
  cancel-in-progress: false

jobs:
  publish:
    name: Publish validated THC articles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      ARTICLE_DIR: ${{ github.workspace }}/site/wordpress/articles
      BACKUP_ROOT: ${{ runner.temp }}/wordpress-thc-article-backups
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - name: Check out trusted main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate article publisher and packages
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/publish-wordpress-articles-rest.mjs
          VALIDATE_ONLY=1 node scripts/publish-wordpress-articles-rest.mjs

      - name: Require WordPress Application Password credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WP_API_USERNAME:-}" || -z "${WP_API_PASSWORD:-}" ]]; then
            echo "WordPress credentials are not configured." >&2
            exit 1
          fi

      - name: Select article publication scope
        id: scope
        shell: bash
        env:
          REQUESTED_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.article_slug || '' }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$REQUESTED_SLUG" == "all" ]]; then
              echo "mode=all" >> "$GITHUB_OUTPUT"
              echo "slugs=all" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            [[ "$REQUESTED_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
            target="$ARTICLE_DIR/$REQUESTED_SLUG.json"
            test -s "$target"
            echo "ARTICLE_FILE=$target" >> "$GITHUB_ENV"
            echo "mode=single" >> "$GITHUB_OUTPUT"
            echo "slugs=$REQUESTED_SLUG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_file="$RUNNER_TEMP/changed-thc-articles.txt"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            git log --since='90 minutes ago' --name-only --pretty=format: -- 'site/wordpress/articles/*.json' \
              | grep '^site/wordpress/articles/.*\.json$' \
              | grep -v '/article.schema.json$' \
              | sort -u \
              | while IFS= read -r path; do
                  [[ -f "$path" ]] && printf '%s\n' "$path"
                done > "$changed_file" || true
          else
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              BEFORE_SHA="${CURRENT_SHA}^"
            fi
            git diff --diff-filter=AM --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- 'site/wordpress/articles/*.json' \
              | grep -v '/article.schema.json$' \
              | while IFS= read -r path; do
                  [[ -f "$path" ]] && printf '%s\n' "$path"
                done > "$changed_file" || true
          fi

          if [[ ! -s "$changed_file" ]]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "slugs=none" >> "$GITHUB_OUTPUT"
            echo "No changed THC article packages to publish."
            exit 0
          fi

          slugs=$(sed -E 's#^.*/##; s#\.json$##' "$changed_file" | paste -sd, -)
          echo "CHANGED_ARTICLE_FILE=$changed_file" >> "$GITHUB_ENV"
          echo "mode=changed" >> "$GITHUB_OUTPUT"
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Changed article packages: $slugs"

      - name: Publish all articles
        id: publish_all
        if: steps.scope.outputs.mode == 'all'
        run: node scripts/publish-wordpress-articles-rest.mjs

      - name: Publish requested article
        id: publish_single
        if: steps.scope.outputs.mode == 'single'
        run: node scripts/publish-wordpress-articles-rest.mjs

      - name: Publish changed articles
        id: publish_changed
        if: steps.scope.outputs.mode == 'changed'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r relative_path; do
            echo "Publishing $relative_path"
            ARTICLE_FILE="$GITHUB_WORKSPACE/$relative_path" node scripts/publish-wordpress-articles-rest.mjs
          done < "$CHANGED_ARTICLE_FILE"

      - name: Upload article rollback metadata
        if: always() && steps.scope.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-thc-article-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/wordpress-thc-article-backups
          if-no-files-found: warn
          retention-days: 30

      - name: Report article publication outcome
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          SLUGS: ${{ steps.scope.outputs.slugs }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const body = [
              '## THC WordPress article publication',
              '',
              `Status: **${process.env.JOB_STATUS}**`,
              `Event: **${context.eventName}**`,
              `Article mode: \`${process.env.MODE || 'unknown'}\``,
              `Articles: \`${process.env.SLUGS || 'unknown'}\``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'This workflow owns article publication only. Canonical Home/Learn/Community/Shop/Gallery/About/Contact page reconciliation is owned by the serialized DTFSeeds WordPress production pipeline.',
              'No credential values are included in this report.'
            ].join('\n');
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 220,
                body
              });
            } catch (error) {
              core.warning(`Could not post article publication result: ${error.message}`);
            }
