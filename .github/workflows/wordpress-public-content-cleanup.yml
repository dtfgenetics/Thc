name: Publish THC Content and Reconcile DTFSeeds Pages

on:
  workflow_dispatch:
    inputs:
      article_slug:
        description: Article slug to publish, or "all"
        required: true
        default: all
        type: string
  push:
    branches:
      - main
    paths:
      - site/wordpress/articles/**
      - site/wordpress/pages/**
      - scripts/publish-wordpress-articles-rest.mjs
      - scripts/apply-wordpress-public-content-rest.mjs
      - .github/workflows/wordpress-public-content-cleanup.yml
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-thc-articles
  cancel-in-progress: false

jobs:
  publish:
    name: Publish THC articles and reconcile canonical pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      ARTICLE_DIR: ${{ github.workspace }}/site/wordpress/articles
      BACKUP_ROOT: ${{ runner.temp }}/wordpress-thc-article-backups
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate publishers and content packages
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/publish-wordpress-articles-rest.mjs
          node --check scripts/apply-wordpress-public-content-rest.mjs
          VALIDATE_ONLY=1 node scripts/publish-wordpress-articles-rest.mjs
          for slug in home seeds learn community shop gallery about contact; do
            test -s "site/wordpress/pages/$slug.html"
            grep -Fq '<h1' "site/wordpress/pages/$slug.html"
          done
          ! grep -Fq "['games'," scripts/apply-wordpress-public-content-rest.mjs
          ! grep -Fq "['high-iq'," scripts/apply-wordpress-public-content-rest.mjs

      - name: Require WordPress Application Password credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WP_API_USERNAME:-}" || -z "${WP_API_PASSWORD:-}" ]]; then
            echo "WordPress credentials are not configured." >&2
            exit 1
          fi

      - name: Select publication scope
        id: scope
        shell: bash
        env:
          REQUESTED_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.article_slug || '' }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$REQUESTED_SLUG" == "all" ]]; then
              echo "mode=all" >> "$GITHUB_OUTPUT"
              echo "slugs=all" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            [[ "$REQUESTED_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
            target="$ARTICLE_DIR/$REQUESTED_SLUG.json"
            test -s "$target"
            echo "ARTICLE_FILE=$target" >> "$GITHUB_ENV"
            echo "mode=single" >> "$GITHUB_OUTPUT"
            echo "slugs=$REQUESTED_SLUG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_file="$RUNNER_TEMP/changed-thc-articles.txt"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            git log --since='90 minutes ago' --name-only --pretty=format: -- 'site/wordpress/articles/*.json' \
              | grep '^site/wordpress/articles/.*\.json$' \
              | grep -v '/article.schema.json$' \
              | sort -u \
              | while IFS= read -r path; do
                  [[ -f "$path" ]] && printf '%s\n' "$path"
                done > "$changed_file" || true
          else
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              BEFORE_SHA="${CURRENT_SHA}^"
            fi

            git diff --diff-filter=AM --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- 'site/wordpress/articles/*.json' \
              | grep -v '/article.schema.json$' \
              | while IFS= read -r path; do
                  [[ -f "$path" ]] && printf '%s\n' "$path"
                done > "$changed_file" || true
          fi

          if [[ ! -s "$changed_file" ]]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "slugs=none" >> "$GITHUB_OUTPUT"
            echo "No changed THC article packages to publish."
            exit 0
          fi

          slugs=$(sed -E 's#^.*/##; s#\.json$##' "$changed_file" | paste -sd, -)
          echo "CHANGED_ARTICLE_FILE=$changed_file" >> "$GITHUB_ENV"
          echo "mode=changed" >> "$GITHUB_OUTPUT"
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Changed article packages: $slugs"

      - name: Publish all articles
        if: steps.scope.outputs.mode == 'all'
        run: node scripts/publish-wordpress-articles-rest.mjs

      - name: Publish requested article
        if: steps.scope.outputs.mode == 'single'
        run: node scripts/publish-wordpress-articles-rest.mjs

      - name: Publish changed articles
        if: steps.scope.outputs.mode == 'changed'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r relative_path; do
            echo "Publishing $relative_path"
            ARTICLE_FILE="$GITHUB_WORKSPACE/$relative_path" node scripts/publish-wordpress-articles-rest.mjs
          done < "$CHANGED_ARTICLE_FILE"

      - name: Upload article rollback metadata
        if: always() && steps.scope.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-thc-article-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/wordpress-thc-article-backups
          if-no-files-found: warn
          retention-days: 30

      - name: Reconcile canonical WordPress pages
        id: pages
        shell: bash
        env:
          CONTENT_DIR: ${{ github.workspace }}/site/wordpress/pages
          BACKUP_ROOT: ${{ runner.temp }}/wordpress-public-page-backups
        run: |
          set -euo pipefail
          node scripts/apply-wordpress-public-content-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-rest-backup-path.txt")"
          summary="$backup_dir/deployment-summary.json"
          mutations="$(node -p "require(process.argv[1]).mutationCount" "$summary")"
          changed_pages="$(node -p "require(process.argv[1]).changedPages" "$summary")"
          echo "mutations=$mutations" >> "$GITHUB_OUTPUT"
          echo "changed_pages=$changed_pages" >> "$GITHUB_OUTPUT"
          echo "Canonical page mutations: $mutations; changed pages: $changed_pages"

      - name: Verify canonical pages on production
        shell: bash
        run: |
          set -euo pipefail
          verify_page() {
            local path="$1"
            local required="$2"
            local body="$RUNNER_TEMP/canonical-$(echo "$path" | tr '/?' '__').html"
            local ok=0
            for attempt in 1 2 3 4 5 6; do
              curl --fail --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                "https://dtfseeds.com${path}?dtf_reconcile=${GITHUB_SHA}-${attempt}" \
                --output "$body"
              if grep -Fqi -- "$required" "$body"; then
                ok=1
                break
              fi
              sleep 10
            done
            [[ "$ok" -eq 1 ]]
            for forbidden in \
              'Reserved strain card' \
              'staged for verified' \
              'being rebuilt' \
              'email@email.com' \
              '+123456789'; do
              ! grep -Fqi -- "$forbidden" "$body"
            done
          }

          verify_page '/seeds/' 'Genetics built through selection, observation, and documentation.'
          verify_page '/learn/' 'Understand the plant. Build the environment. Make better decisions.'
          verify_page '/community/' 'Join the official DTF / Teaching Healthy Cultivation Discord'

      - name: Upload canonical-page rollback metadata when needed
        if: always() && (steps.pages.outputs.mutations != '0' || steps.pages.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-public-pages-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/wordpress-public-page-backups
          if-no-files-found: warn
          retention-days: 30

      - name: Report publication and page reconciliation outcome to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          SLUGS: ${{ steps.scope.outputs.slugs }}
          PAGE_MUTATIONS: ${{ steps.pages.outputs.mutations }}
          PAGE_CHANGED: ${{ steps.pages.outputs.changed_pages }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const body = [
              '## THC WordPress publication and canonical-page reconciliation',
              '',
              `Status: **${process.env.JOB_STATUS}**`,
              `Article mode: \`${process.env.MODE || 'unknown'}\``,
              `Articles: \`${process.env.SLUGS || 'unknown'}\``,
              `Canonical page mutations: **${process.env.PAGE_MUTATIONS || 'not-run'}**`,
              `Canonical pages changed: **${process.env.PAGE_CHANGED || 'not-run'}**`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Canonical WordPress scope: Home, Seeds, Learn, Community, Shop, Gallery, About, Contact.',
              'Static game routes remain outside WordPress ownership.',
              'No credential values are included in this report.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body
            });
