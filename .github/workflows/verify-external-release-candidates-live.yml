name: Verify External Release Candidates Live

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/verify-external-release-candidates-live.mjs
      - .github/workflows/verify-external-release-candidates-live.yml
      - site/public-route-patch/games/ganjumanji/source-revision.txt
      - site/public-route-patch/games/thc-rpg/source-revision.txt
      - site/deployment/external-games/ganjumanji.json
      - site/deployment/external-games/thc-rpg.json
  workflow_run:
    workflows:
      - Deploy DTFSeeds Public Suite via WordPress V2
    types: [completed]

permissions:
  contents: read

concurrency:
  group: external-release-candidates-live-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exact live external release candidates
        run: node scripts/verify-external-release-candidates-live.mjs

      - name: Live release summary
        if: success()
        run: |
          {
            echo '## External game live verification'
            echo
            echo '- Ganjumanji: exact pinned source, release metadata, desktop Chromium, and mobile Chromium passed.'
            echo '- THC RPG: exact pinned source, release metadata, desktop Chromium, and mobile Chromium passed.'
            echo '- Both routes returned HTTP 200 without redirect and no browser/request failures.'
          } >> "$GITHUB_STEP_SUMMARY"
