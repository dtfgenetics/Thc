name: Rebuild DTFSeeds WordPress Visual Site

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  WP_SITE_URL: https://dtfseeds.com

concurrency:
  group: dtfseeds-wordpress-visual-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-visual-rebuild

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate visual rebuild package
        shell: bash
        run: |
          set -euo pipefail
          test -s site/wordpress/assets/brand/dtf-potleaf-512.png
          node --check scripts/rebuild-wordpress-visual-site.mjs
          node -e "const p=require('./site/wordpress/visual-quality-policy.json'); if(Number(p.schemaVersion)<2||p.replacementPolicy?.automaticKeywordMediaSelectionAllowed!==false) process.exit(1)"
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"

      - name: Rebuild brand shell, Home, and Learn
        id: site
        env:
          APPLY_VISUAL_REBUILD: 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rebuild-wordpress-visual-site.mjs | tee "$RUNNER_TEMP/visual-rebuild.log"
          report_dir="$(cat "$BACKUP_ROOT/visual-rebuild-backup-path.txt")"
          report="$report_dir/visual-rebuild-report.json"
          echo "media_count=$(node -p "require(process.argv[1]).mediaCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "brand_id=$(node -p "require(process.argv[1]).brandMediaId" "$report")" >> "$GITHUB_OUTPUT"
          echo "missing=$(node -p "require(process.argv[1]).missingSelections.join(',')" "$report")" >> "$GITHUB_OUTPUT"

      - name: Verify WordPress site icon and brand media
        id: brandverify
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' "$WP_API_USERNAME" "$WP_API_PASSWORD" | base64 -w0)"
          settings="$RUNNER_TEMP/wp-settings.json"
          curl -4 --fail --silent --show-error --location \
            -H "Authorization: Basic $auth" \
            -H 'Cache-Control: no-cache' \
            "$WP_SITE_URL/wp-json/wp/v2/settings?context=edit" \
            -o "$settings"

          site_icon="$(node -p "Number(require(process.argv[1]).site_icon || 0)" "$settings")"
          if [[ "$site_icon" -le 0 ]]; then
            echo 'WordPress site_icon was not set.' >&2
            exit 1
          fi

          media="$RUNNER_TEMP/site-icon-media.json"
          curl -4 --fail --silent --show-error --location \
            -H "Authorization: Basic $auth" \
            "$WP_SITE_URL/wp-json/wp/v2/media/$site_icon?context=edit" \
            -o "$media"

          node - "$media" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2];
          const m=JSON.parse(fs.readFileSync(file,'utf8'));
          const text=`${m.title?.rendered||''} ${m.alt_text||''}`.toLowerCase();
          if(!text.includes('dtf genetics cannabis leaf')) throw new Error('Site icon media is not the DTF cannabis leaf');
          NODE
          echo "site_icon=$site_icon" >> "$GITHUB_OUTPUT"

      - name: Verify live visual experience without image quotas
        id: live
        shell: bash
        run: |
          set -euo pipefail

          check_page() {
            local path="$1"
            local required="$2"
            local key
            local body
            local ok=0
            key="$(printf '%s' "$path" | tr '/?' '__')"
            body="$RUNNER_TEMP/live-${key}.html"

            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "$WP_SITE_URL${path}?dtf_visual=${GITHUB_RUN_ID}-${attempt}" \
                -o "$body"
              if grep -Fqi -- "$required" "$body"; then ok=1; break; fi
              sleep 5
            done

            if [[ "$ok" -ne 1 ]]; then
              echo "Required live marker missing on $path: $required" >&2
              head -c 3000 "$body" >&2 || true
              exit 1
            fi

            for forbidden in \
              'email@email.com' \
              '+123456789' \
              'being rebuilt' \
              'Reserved strain card' \
              'Tool-ready rebuild' \
              'Grow education belongs in a clean, readable library.' \
              'MOPS, cultivation notes, THC basics' \
              'Cannabis_Plant_Anatomy_Infographic.png' \
              'Cannabis_Sex_Expression_and_Chromosome_Combinations.png' \
              'Beneficial_Insects_and_Biological_Controls.png'; do
              if grep -Fqi -- "$forbidden" "$body"; then
                echo "Forbidden stale or quarantined content remains on $path: $forbidden" >&2
                exit 1
              fi
            done

            count="$(grep -o '/wp-content/uploads/' "$body" | wc -l | tr -d ' ')"
            echo "$path verified; $count WordPress media references present, with no minimum image quota"
          }

          check_page '/' 'Genetics. Plant science. Tools. Games. Community.'
          check_page '/learn/' 'Explore by subject'
          check_page '/learn/infographics/' 'Visual plant science and cultivation library.'

      - name: Upload rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtfseeds-visual-rebuild-backup-${{ github.run_id }}
          path: /tmp/dtf-visual-rebuild
          if-no-files-found: warn
          retention-days: 30

      - name: Report visual rebuild result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          SITE_MEDIA: ${{ steps.site.outputs.media_count }}
          BRAND_ID: ${{ steps.brandverify.outputs.site_icon }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          MISSING: ${{ steps.site.outputs.missing }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## DTFSeeds visual site rebuild','',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.JOB_STATUS}**`,
                `WordPress media indexed: **${process.env.SITE_MEDIA||'not-run'}**`,
                `Cannabis-leaf site icon media ID: **${process.env.BRAND_ID||'not-run'}**`,
                `Live visual verification: **${process.env.LIVE_OUTCOME||'not-run'}**`,
                `Optional approved visual selections not found: **${process.env.MISSING||'none'}**`,'',
                'Legacy infographic gallery rebuilding and minimum-image quotas are intentionally disabled. The visual system may render without an image until an explicitly approved replacement exists.'
              ].join('\n')
            });
