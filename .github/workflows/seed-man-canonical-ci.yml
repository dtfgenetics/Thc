name: Seed Man Canonical CI

on:
  push:
    branches: [main]
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'scripts/validate-seed-man-character-atlas.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/seed-man-canonical-ci.yml'
  pull_request:
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'scripts/validate-seed-man-character-atlas.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/seed-man-canonical-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-man-canonical-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate 20-level Seed Man production contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Enforce browser tool policy
        run: node scripts/verify-browser-tool-policy.mjs

      - name: Validate Seed Man production contracts
        run: npm --prefix games/seed-man-platformer run test:production-contracts

      - name: Verify canonical Three.js renderer import
        run: npm --prefix games/seed-man-platformer run verify:three-import

      - name: Validate game release registry and route preflight
        run: npm run games:preflight
