name: Reviewed Homepage Genetics Art CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/homepage-reviewed-genetics-art-ci.yml'
      - '.github/workflows/homepage-reviewed-genetics-art-production.yml'
      - '.github/workflows/wordpress-home-genetics-art.yml'
      - '.github/workflows/wordpress-home-release-visuals.yml'
      - '.github/workflows/wordpress-learning-experience-v3-production.yml'
      - '.github/workflows/wordpress-learning-final-owner.yml'
      - '.github/workflows/homepage-genetics-v2-ci.yml'
      - 'scripts/finalize-wordpress-home-genetics-art.mjs'
      - 'scripts/fix-wordpress-home-release-visuals.mjs'
      - 'site/wordpress/products/strain-card-images.json'

permissions:
  contents: read

jobs:
  validate:
    name: Validate reviewed-card Home protection
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate serialized production ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/finalize-wordpress-home-genetics-art.mjs
          node --check scripts/fix-wordpress-home-release-visuals.mjs

          manual=.github/workflows/homepage-reviewed-genetics-art-production.yml
          exact_owner=.github/workflows/wordpress-home-release-visuals.yml
          learning=.github/workflows/wordpress-learning-experience-v3-production.yml
          learning_final=.github/workflows/wordpress-learning-final-owner.yml

          for identity in \
            'dtf-strain-card-blue-mango-f2-regular' \
            'dtf-strain-card-blue-mango-f2-feminized' \
            'dtf-strain-card-blue-bubblegum-f1-regular' \
            'dtf-strain-card-mango-bubbles-f1-regular'; do
            grep -Fq "$identity" scripts/finalize-wordpress-home-genetics-art.mjs
            grep -Fq "$identity" "$manual"
          done

          grep -Fq 'workflow_dispatch:' "$manual"
          ! grep -Fq 'workflow_run:' "$manual"
          ! grep -Fq 'push:' "$manual"
          grep -Fq 'continue-on-error: true' "$manual"
          grep -Fq 'issue_number: 220' "$manual"
          ! grep -Fq 'issue_number: 46' "$manual"
          ! grep -Fq 'issue_number:46' "$manual"

          grep -Fq 'workflow_call:' "$exact_owner"
          ! grep -Fq 'workflow_run:' "$exact_owner"
          grep -Fq 'scripts/fix-wordpress-home-release-visuals.mjs' "$exact_owner"
          grep -Fq 'Verify visitor-facing homepage release artwork' "$exact_owner"
          grep -Fq 'Purge Hostinger LiteSpeed cache' "$exact_owner"

          grep -Fq 'uses: ./.github/workflows/wordpress-home-release-visuals.yml' "$learning"
          grep -Fq 'secrets: inherit' "$learning"
          grep -Fq 'name: Run final Home visual owner' "$learning"

          grep -Fq -- '- Publish THC Topic Literature to WordPress Production' "$learning_final"
          ! grep -Fq -- '- Publish DTFSeeds Learning Experience V3' "$learning_final"
          grep -Fq 'cancel-in-progress: false' "$learning_final"
          if grep -Fq 'uses: ./.github/workflows/wordpress-home-release-visuals.yml' "$learning_final"; then
            echo 'Topic Literature finalizer must not duplicate the final Home owner already invoked by Learning V3.' >&2
            exit 1
          fi

          grep -Fq "APPLY_HOME_GENETICS_ART: 'true'" "$manual"
          grep -Fq 'Current releases, shown with the real strain cards.' scripts/finalize-wordpress-home-genetics-art.mjs
          grep -Fq 'aspect-ratio:2/3' scripts/finalize-wordpress-home-genetics-art.mjs
          echo 'Automatic reviewed Home mutation is retired; the exact release-card owner is reusable/manual-only and is invoked once by canonical Learning V3.'

      - name: Validate both supported homepage layout contracts
        shell: bash
        run: |
          set -euo pipefail
          file=scripts/finalize-wordpress-home-genetics-art.mjs
          grep -Fq "return 'home-v3'" "$file"
          grep -Fq "return 'visual-v2'" "$file"
          grep -Fq "classNeedle = layout === 'home-v3' ? 'release' : 'dtf-image-card'" "$file"
          grep -Fq "layout === 'home-v3'" "$file"
          grep -Fq 'dtf-hero-media' "$file"
          grep -Fq 'dtf-home-genetics-feature' "$file"
          grep -Fq 'data-dtf-home-genetics-v2="feature"' "$file"
          grep -Fq '/seeds/mango-bubbles/' "$file"
          grep -Fq 'all three verified current-release routes' "$file"
          grep -Fq 'supported reviewed-genetics layout' "$file"
          echo 'Old Home V3 and current visual-v2 contracts are both explicitly supported.'

      - name: Verify current canonical visual builder remains a recognized source layout
        shell: bash
        run: |
          set -euo pipefail
          source=scripts/rebuild-wordpress-visual-site.mjs
          grep -Fq '<div class="dtf-page">' "$source"
          grep -Fq 'class="dtf-hero-media"' "$source"
          grep -Fq 'dtf-image-card' "$source"
          grep -Fq 'Shop the pack. Read the breeding context.' "$source"
          grep -Fq '/product/10-regular-f2-blue-mango-seeds/' "$source"
          grep -Fq '/product/10-feminized-f2-blue-mango-x/' "$source"
          grep -Fq '/product/10-reg-f1-blueberry-bubblegum/' "$source"
          echo 'Current visual builder markup remains recognized by Home recovery tooling.'

      - name: Reject education media as release-card completion criteria
        shell: bash
        run: |
          set -euo pipefail
          registry=site/wordpress/products/strain-card-images.json
          owner=.github/workflows/wordpress-home-release-visuals.yml
          node - "$registry" <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(data.cards)||data.cards.length!==3) throw new Error('Expected exactly three reviewed current-release cards');
          for(const card of data.cards){
            if(!card.altText?.includes('DTF Genetics strain card')) throw new Error(`Unreviewed card alt text: ${card.altText}`);
            if(Number(card.expectedWidth)!==1024||Number(card.expectedHeight)!==1536) throw new Error(`Unexpected card dimensions for ${card.registryId}`);
          }
          console.log('Reviewed current-release registry is exact and portrait-oriented.');
          NODE
          grep -Fq 'classCount === registry.cards.length' "$owner"
          grep -Fq 'routesOk' "$owner"
          grep -Fq 'altOk' "$owner"
          grep -Fq 'portraitOk' "$owner"
          echo 'Reviewed Homepage Genetics Art protection contract verified.'
