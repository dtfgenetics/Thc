name: Publish THC Infographics Direct

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wordpress-infographic-direct.yml'
      - 'site/wordpress/assets/infographics/**'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      INFOGRAPHIC_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
      BACKUP_ROOT: ${{ runner.temp }}/wordpress-infographic-direct-backups
      NODE_OPTIONS: --dns-result-order=ipv4first

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage approved Harvest images
        shell: bash
        run: |
          set -euo pipefail
          out="$INFOGRAPHIC_DIR"
          mkdir -p "$out"

          curl -4 -L --fail --silent --show-error --retry 4 --retry-delay 2 \
            'https://cdn.shopify.com/s/files/1/0664/2542/1885/files/THC-HARV-01_harvest_readiness_indicators.jpg?v=1787825276' \
            -o "$out/THC-HARV-01_harvest_readiness_indicators.jpg"
          curl -4 -L --fail --silent --show-error --retry 4 --retry-delay 2 \
            'https://cdn.shopify.com/s/files/1/0664/2542/1885/files/THC-HARV-02_harvest_trichome_maturity_interpretation.jpg?v=1787825286' \
            -o "$out/THC-HARV-02_harvest_trichome_maturity_interpretation.jpg"
          curl -4 -L --fail --silent --show-error --retry 4 --retry-delay 2 \
            'https://cdn.shopify.com/s/files/1/0664/2542/1885/files/THC-HARV-03_harvest_handling_workflow.jpg?v=1787825295' \
            -o "$out/THC-HARV-03_harvest_handling_workflow.jpg"
          curl -4 -L --fail --silent --show-error --retry 4 --retry-delay 2 \
            'https://cdn.shopify.com/s/files/1/0664/2542/1885/files/THC-HARV-04_bud_washing_overview.jpg?v=1787825306' \
            -o "$out/THC-HARV-04_bud_washing_overview.jpg"
          curl -4 -L --fail --silent --show-error --retry 4 --retry-delay 2 \
            'https://cdn.shopify.com/s/files/1/0664/2542/1885/files/THC-HARV-05_drying_environment_fundamentals.jpg?v=1787851009' \
            -o "$out/THC-HARV-05_drying_environment_fundamentals.jpg"
          curl -4 -L --fail --silent --show-error --retry 4 --retry-delay 2 \
            'https://cdn.shopify.com/s/files/1/0664/2542/1885/files/THC-HARV-06_drying_failure_modes.jpg?v=1787851015' \
            -o "$out/THC-HARV-06_drying_failure_modes.jpg"

          count=0
          for file in "$out"/THC-HARV-0{1,2,3,4,5,6}_*.jpg; do
            test -s "$file"
            file "$file" | grep -qi 'JPEG image data'
            count=$((count + 1))
          done
          test "$count" -eq 6
          echo "Verified six approved Harvest JPEG assets."

      - name: Validate publisher and credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME missing}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD missing}"
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          count="$(find "$INFOGRAPHIC_DIR" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) | wc -l | tr -d ' ')"
          test "$count" -ge 20
          echo "Images ready for publication: $count"

      - name: Publish infographic library and topic pages
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy-wordpress-infographic-library-rest.mjs

      - name: Verify all six images live
        shell: bash
        run: |
          set -euo pipefail

          verify_page() {
            local route="$1"
            local output="$2"
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 -L --fail --silent --show-error --retry 2 --retry-delay 2 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "https://dtfseeds.com${route}?dtf_harvest_live=${GITHUB_RUN_ID}-${attempt}" \
                -o "$output"
              if grep -Fqi 'HARV 03 harvest handling workflow' "$output"; then
                ok=1
                break
              fi
              sleep 8
            done
            test "$ok" -eq 1
          }

          library="$RUNNER_TEMP/infographics-live.html"
          harvest="$RUNNER_TEMP/harvest-live.html"
          verify_page '/learn/infographics/' "$library"
          verify_page '/learn/harvest-postharvest/' "$harvest"

          for page in "$library" "$harvest"; do
            grep -Fqi 'HARV 01 harvest readiness indicators' "$page"
            grep -Fqi 'HARV 02 harvest trichome maturity interpretation' "$page"
            grep -Fqi 'HARV 03 harvest handling workflow' "$page"
            grep -Fqi 'HARV 04 bud washing overview' "$page"
            grep -Fqi 'HARV 05 drying environment fundamentals' "$page"
            grep -Fqi 'HARV 06 drying failure modes' "$page"
            grep -Eqi '<img[^>]+wp-content/uploads/' "$page"
          done

          echo 'All six Harvest images verified on both live routes.'

      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-infographic-production-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wordpress-infographic-direct-backups
            ${{ runner.temp }}/infographics-live.html
            ${{ runner.temp }}/harvest-live.html
          if-no-files-found: warn
          retention-days: 30
