name: Publish THC Infographics Direct

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wordpress-infographic-direct.yml'
      - 'site/wordpress/imports/infographic-bulk-import.json'
      - 'scripts/import-wordpress-infographic-remote-batch.mjs'

permissions:
  contents: write
  issues: write

concurrency:
  group: dtfseeds-wordpress-infographic-direct
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 182 &&
       github.event.comment.body == '/publish-infographics' &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      INFOGRAPHIC_SOURCE_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
      INFOGRAPHIC_DIR: ${{ github.workspace }}/.tmp/eligible-infographics
      INFOGRAPHIC_PLACEMENT_CONFIG: ${{ github.workspace }}/site/wordpress/assets/infographics/placement-rules.json
      INFOGRAPHIC_EXCLUSIONS: ${{ github.workspace }}/site/wordpress/assets/infographics/infographic-exclusions.json
      BULK_INFOGRAPHIC_MANIFEST: ${{ github.workspace }}/site/wordpress/imports/infographic-bulk-import.json
      BULK_IMPORT_REPORT: ${{ runner.temp }}/infographic-bulk-import-report.json
      BACKUP_ROOT: ${{ runner.temp }}/wordpress-infographic-direct-backups
      NODE_OPTIONS: --dns-result-order=ipv4first

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate bulk intake and publisher
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME missing}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD missing}"
          node --check scripts/import-wordpress-infographic-remote-batch.mjs
          node --check scripts/stage-eligible-infographics.mjs
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          node -e "const m=require('./site/wordpress/imports/infographic-bulk-import.json'); if(m.schemaVersion!==1||!Array.isArray(m.assets)) process.exit(1)"
          test -d "$INFOGRAPHIC_SOURCE_DIR"
          test -f "$INFOGRAPHIC_PLACEMENT_CONFIG"
          test -f "$INFOGRAPHIC_EXCLUSIONS"

      - name: Download and validate queued images
        id: intake
        shell: bash
        run: |
          set -euo pipefail
          node scripts/import-wordpress-infographic-remote-batch.mjs
          echo "requested=$(node -p "require(process.argv[1]).requestedAssets" "$BULK_IMPORT_REPORT")" >> "$GITHUB_OUTPUT"
          echo "created=$(node -p "require(process.argv[1]).created" "$BULK_IMPORT_REPORT")" >> "$GITHUB_OUTPUT"
          echo "updated=$(node -p "require(process.argv[1]).updated" "$BULK_IMPORT_REPORT")" >> "$GITHUB_OUTPUT"
          echo "reused=$(node -p "require(process.argv[1]).reused" "$BULK_IMPORT_REPORT")" >> "$GITHUB_OUTPUT"

      - name: Persist image binaries in canonical source
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DTF Bulk Image Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add site/wordpress/assets/infographics
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Canonical image source already current.'
          else
            git commit -m 'Import queued THC infographic assets'
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage only publication-eligible images
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-eligible-infographics.mjs
          report="$BACKUP_ROOT/infographic-quality-gate.json"
          echo "source_count=$(node -p "require(process.argv[1]).sourceImageCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "eligible_count=$(node -p "require(process.argv[1]).eligibleImageCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "excluded_count=$(node -p "require(process.argv[1]).excludedImageCount" "$report")" >> "$GITHUB_OUTPUT"

      - name: Normalize eligible WebP images for WordPress
        shell: bash
        run: |
          set -euo pipefail
          converted=0
          while IFS= read -r -d '' file; do
            output="${file%.*}.png"
            ffmpeg -hide_banner -loglevel error -y -i "$file" -frames:v 1 "$output"
            test -s "$output"
            rm "$file"
            converted=$((converted + 1))
          done < <(find "$INFOGRAPHIC_DIR" -type f -iname '*.webp' -print0)
          echo "Normalized ${converted} WebP asset(s)."

      - name: Publish eligible infographic media and placements
        id: media
        shell: bash
        run: |
          set -euo pipefail
          count="$(find "$INFOGRAPHIC_DIR" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) | wc -l | tr -d ' ')"
          test "$count" -ge 10
          node scripts/deploy-wordpress-infographic-library-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-infographic-backup-path.txt")"
          result="$backup_dir/deployment-result.json"
          echo "source_count=$(node -p "require(process.argv[1]).sourceImageCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "uploaded_count=$(node -p "require(process.argv[1]).uploadedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "reused_count=$(node -p "require(process.argv[1]).reusedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "page_id=$(node -p "require(process.argv[1]).pageId" "$result")" >> "$GITHUB_OUTPUT"

      - name: Verify visitor-facing infographic library
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/infographics-live.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 -L --fail --silent --show-error --retry 2 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "https://dtfseeds.com/learn/infographics/?dtf_bulk_live=${GITHUB_RUN_ID}-${attempt}" \
              -o "$page"
            if grep -Fqi 'THC Infographic Library' "$page" && grep -Eqi '<img[^>]+wp-content/uploads/' "$page"; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" -eq 1
          image_count="$(grep -Eoi '<img[^>]+wp-content/uploads/' "$page" | wc -l | tr -d ' ')"
          test "$image_count" -ge 10
          echo "live_image_count=$image_count" >> "$GITHUB_OUTPUT"

      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-infographic-production-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wordpress-infographic-direct-backups
            ${{ runner.temp }}/infographic-bulk-import-report.json
            ${{ runner.temp }}/infographics-live.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report bulk publication result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          QUEUED: ${{ steps.intake.outputs.requested }}
          CREATED: ${{ steps.intake.outputs.created }}
          UPDATED: ${{ steps.intake.outputs.updated }}
          INTAKE_REUSED: ${{ steps.intake.outputs.reused }}
          CANONICAL_COMMIT: ${{ steps.canonical.outputs.commit }}
          ELIGIBLE: ${{ steps.quality.outputs.eligible_count }}
          EXCLUDED: ${{ steps.quality.outputs.excluded_count }}
          WP_SOURCE: ${{ steps.media.outputs.source_count }}
          UPLOADED: ${{ steps.media.outputs.uploaded_count }}
          WP_REUSED: ${{ steps.media.outputs.reused_count }}
          PAGE_ID: ${{ steps.media.outputs.page_id }}
          LIVE_IMAGES: ${{ steps.verify.outputs.live_image_count }}
        with:
          script: |
            const body = [
              '## DTFSeeds bulk image publication', '',
              `Status: **${process.env.STATUS}**`,
              `Batch URLs queued: **${process.env.QUEUED || '0'}**`,
              `New canonical files: **${process.env.CREATED || '0'}**`,
              `Intentional replacements: **${process.env.UPDATED || '0'}**`,
              `Canonical files reused: **${process.env.INTAKE_REUSED || '0'}**`,
              `Canonical commit: ${process.env.CANONICAL_COMMIT ? `\`${process.env.CANONICAL_COMMIT}\`` : 'none required'}`,
              `Publication-eligible images: **${process.env.ELIGIBLE || 'not-run'}**`,
              `Excluded/review images: **${process.env.EXCLUDED || 'not-run'}**`,
              `WordPress media processed: **${process.env.WP_SOURCE || 'not-run'}**`,
              `New WordPress uploads: **${process.env.UPLOADED || 'not-run'}**`,
              `Existing WordPress media reused: **${process.env.WP_REUSED || 'not-run'}**`,
              `Infographic page ID: **${process.env.PAGE_ID || 'not-run'}**`,
              `Images observed on live page: **${process.env.LIVE_IMAGES || 'not-run'}**`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Visitor target: https://dtfseeds.com/learn/infographics/'
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 182, body });
