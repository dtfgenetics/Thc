name: Publish THC Infographics Direct Manually

on:
  workflow_dispatch:

permissions:
  contents: read

# RETIRED MUTATION LANE
# This old manual entry point called the legacy 117+ image transaction and could
# restore quarantined educational artwork. Keep the command visible for audit
# history, but never let it mutate WordPress again.
concurrency:
  group: dtfseeds-infographic-direct-retired
  cancel-in-progress: true

jobs:
  retired-publisher-guard:
    name: Legacy direct infographic publisher disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Enforce approved-only visual policy
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const policy=require('./site/wordpress/visual-quality-policy.json');
          if(Number(policy.schemaVersion)<3 || policy.mode!=='quarantine') throw new Error('Visual quality quarantine policy v3+ is required.');
          if(policy.replacementPolicy?.legacyAutomaticInfographicPublishingAllowed!==false) throw new Error('Legacy automatic infographic publishing must remain disabled.');
          if(policy.replacementPolicy?.legacyInfographicReuseAllowed!==false) throw new Error('Legacy infographic reuse must remain disabled.');
          if(policy.replacementPolicy?.automaticKeywordMediaSelectionAllowed!==false) throw new Error('Automatic keyword media selection must remain disabled.');
          console.log('Legacy direct infographic publication is disabled.');
          console.log('Only role-specific dtf-approved-visual-* replacements may be published.');
          NODE
          ! grep -Fq 'publish-wordpress-infographics-resilient.sh' .github/workflows/wordpress-infographic-direct.yml

      - name: Explain current production path
        shell: bash
        run: |
          echo 'No WordPress media, subject page, Gallery, or infographic library is changed by this compatibility workflow.'
          echo 'Approved replacements are published only after subject and responsive review.'
