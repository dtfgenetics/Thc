name: Finalize DTFSeeds Home Genetics Art

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-wordpress-home-genetics-art.mjs'
      - '.github/workflows/wordpress-home-genetics-art.yml'
  workflow_run:
    workflows:
      - Publish DTF Genetics Library
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-home-genetics-art
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com

jobs:
  finalize-home-art:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Home Genetics V2 finalizer
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/finalize-wordpress-home-genetics-art.mjs
          grep -Fq 'data-dtf-home-genetics-v2' scripts/finalize-wordpress-home-genetics-art.mjs
          grep -Fq '/product/10-regular-f2-blue-mango-seeds/' scripts/finalize-wordpress-home-genetics-art.mjs
          grep -Fq '/product/10-feminized-f2-blue-mango-x/' scripts/finalize-wordpress-home-genetics-art.mjs
          grep -Fq '/product/10-reg-f1-blueberry-bubblegum/' scripts/finalize-wordpress-home-genetics-art.mjs
      - name: Apply reviewed genetics artwork to Home
        id: apply
        env:
          APPLY_HOME_GENETICS_ART: 'true'
        run: |
          set -euo pipefail
          node scripts/finalize-wordpress-home-genetics-art.mjs | tee "$RUNNER_TEMP/home-genetics-art.json"
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Verify Homepage Genetics V2
        id: verify
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/home.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 -fsSL --retry 2 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$WP_SITE_URL/?dtf_home_genetics_v2=${GITHUB_RUN_ID}-${attempt}" -o "$body"
            if \
              grep -Fqi 'data-dtf-home-genetics-v2="hero"' "$body" && \
              grep -Fqi 'Blue Mango F2 Regular DTF Genetics strain card' "$body" && \
              grep -Fqi 'Blue Mango F2 Feminized DTF Genetics strain card' "$body" && \
              grep -Fqi 'Blue Bubblegum F1 Regular DTF Genetics strain card' "$body" && \
              grep -Fqi 'Mango Bubbles F1 Regular DTF Genetics strain card' "$body" && \
              grep -Fqi 'Current releases, shown with the real strain cards.' "$body"; then
              ok=1
              break
            fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]] || {
            echo 'Homepage Genetics V2 reviewed artwork/copy is not visible.' >&2
            grep -oiE 'Blue Mango[^<]{0,120}|Blue Bubblegum[^<]{0,120}|Mango Bubbles[^<]{0,120}|data-dtf-home-genetics-v2' "$body" | head -40 >&2 || true
            exit 1
          }
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Report Home genetics artwork
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          APPLY: ${{ steps.apply.outputs.outcome }}
          VERIFY: ${{ steps.verify.outputs.outcome }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body:[
              '## Homepage Genetics V2','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `Genetics visual write: **${process.env.APPLY || 'not-completed'}**`,
              `Live verification: **${process.env.VERIFY || 'not-completed'}**`,
              '',
              'Home now uses reviewed DTF Genetics strain-card artwork for the genetics hero, genetics feature, and all three current-release tiles. WordPress-hosted reviewed media is preferred; permanent reviewed CDN files are the fallback.'
            ].join('\n')});
