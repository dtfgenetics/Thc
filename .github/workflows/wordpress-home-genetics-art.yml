name: Finalize DTFSeeds Home Genetics Art

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-wordpress-home-genetics-art.mjs'
      - '.github/workflows/wordpress-home-genetics-art.yml'
  workflow_run:
    workflows:
      - Publish DTF Genetics Library
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-home-genetics-art
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com

jobs:
  finalize-home-art:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Home genetics-art finalizer
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/finalize-wordpress-home-genetics-art.mjs
      - name: Apply reviewed release artwork to Home
        id: apply
        env:
          APPLY_HOME_GENETICS_ART: 'true'
        run: |
          set -euo pipefail
          node scripts/finalize-wordpress-home-genetics-art.mjs | tee "$RUNNER_TEMP/home-genetics-art.json"
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Verify Home release art
        id: verify
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/home.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "$WP_SITE_URL/?dtf_home_genetics_art=${GITHUB_RUN_ID}-${attempt}" -o "$body"
            if grep -Fqi 'Blue Mango F2 Regular DTF Genetics strain card' "$body" && grep -Fqi 'Blue Mango F2 Feminized DTF Genetics strain card' "$body" && grep -Fqi 'Blue Bubblegum F1 Regular DTF Genetics strain card' "$body"; then ok=1; break; fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]] || { echo 'Reviewed release artwork is not visible on Home.' >&2; exit 1; }
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Report Home genetics artwork
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          APPLY: ${{ steps.apply.outputs.outcome }}
          VERIFY: ${{ steps.verify.outputs.outcome }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body:[
              '## Home reviewed genetics artwork','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `Artwork write: **${process.env.APPLY || 'not-completed'}**`,
              `Live verification: **${process.env.VERIFY || 'not-completed'}**`,
              '',
              'The three Home current-release cards now use their reviewed DTF strain-card artwork. WordPress-hosted media is preferred when available; the permanent reviewed CDN file is used only as a fallback.'
            ].join('\n')});
