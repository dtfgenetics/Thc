name: Build Atlas raster plates

on:
  push:
    paths:
      - 'scripts/build-atlas-raster-plates.py'
      - '.github/workflows/build-atlas-raster-plates.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-media-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install raster renderer
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Build approved Atlas raster plates
        run: python scripts/build-atlas-raster-plates.py

      - name: Validate generated media and Atlas
        run: |
          npm run atlas:media:validate
          npm run validate:plant-atlas:v4

      - name: Commit generated plate
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No generated plate changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/growlens-web/public/atlas/media site/public-route-patch/atlas/media apps/growlens-web/public/atlas/data/media-registry-v1.json site/public-route-patch/atlas/data/media-registry-v1.json
          git commit -m "feat(atlas): build approved raster anatomy plate"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
