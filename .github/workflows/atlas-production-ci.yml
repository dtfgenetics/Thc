name: Atlas Integration Mirror CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/public-route-patch/atlas/**
      - site/public-route-patch/terpene-atlas/**
      - site/deployment/public-apps.json
      - data/public-navigation.json
      - docs/ATLAS_ROUTE_OWNERSHIP.md
      - scripts/validate-canonical-tools-mirror.mjs
      - scripts/validate-atlas-route-ownership.mjs
      - .github/workflows/atlas-production-ci.yml
  pull_request:
    branches: [main]
    paths:
      - site/public-route-patch/atlas/**
      - site/public-route-patch/terpene-atlas/**
      - site/deployment/public-apps.json
      - data/public-navigation.json
      - docs/ATLAS_ROUTE_OWNERSHIP.md
      - scripts/validate-canonical-tools-mirror.mjs
      - scripts/validate-atlas-route-ownership.mjs
      - .github/workflows/atlas-production-ci.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate synchronized Tools mirror
        run: node scripts/validate-canonical-tools-mirror.mjs
      - name: Validate mirrored Atlas runtime syntax
        run: |
          set -euo pipefail
          node --check site/public-route-patch/atlas/atlas-3d-v4.js
          node --check site/public-route-patch/atlas/atlas-3d-bootstrap.js
          node --check site/public-route-patch/atlas/atlas-anatomy-index-v1.js
          node --check site/public-route-patch/atlas/module.js
          node --check site/public-route-patch/terpene-atlas/terpene-atlas-v1.js
      - name: Validate shared Atlas module design system
        shell: bash
        run: |
          set -euo pipefail
          shared='site/public-route-patch/atlas/atlas-module-v1.css'
          test -s "$shared"
          grep -Fq -- '--accent:   #9fe870' "$shared"
          grep -Fq 'var(--dtf-global-header-height, var(--site-header-fallback))' "$shared"
          modules=(
            diagnostics
            nodes-branching
            stem-vascular
            trichomes-resin
            seed-germination
            environmental-physiology
            flowers
          )
          for module in "${modules[@]}"; do
            page="site/public-route-patch/atlas/$module/index.html"
            test -s "$page"
            grep -Fq 'href="/atlas/atlas-module-v1.css"' "$page"
            grep -Eqi '<meta name="viewport"[^>]*width=device-width' "$page"
            grep -Eqi '<h1([ >])' "$page"
            grep -Fq 'class="topbar"' "$page"
            ! grep -Fqi '#f5f3e9' "$page"
          done

      - name: Validate public Atlas route ownership
        run: node scripts/validate-atlas-route-ownership.mjs
