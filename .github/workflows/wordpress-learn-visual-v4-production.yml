name: Verify Retired Learn Visual V4 Writer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/rebuild-wordpress-learn-visual-v4.mjs'
      - '.github/workflows/wordpress-learn-visual-v4-production.yml'

concurrency:
  group: wordpress-learn-visual-v4-retirement-guard
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Learn V4 writer remains retired
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/rebuild-wordpress-learn-visual-v4.mjs
          ! grep -Fq "method: 'POST'" scripts/rebuild-wordpress-learn-visual-v4.mjs
          ! grep -Fq 'APPLY_LEARN_V4' scripts/rebuild-wordpress-learn-visual-v4.mjs
          node scripts/rebuild-wordpress-learn-visual-v4.mjs
