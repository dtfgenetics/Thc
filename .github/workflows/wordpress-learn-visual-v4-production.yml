name: WordPress Learn Visual V4 Production

# RETIRED PRODUCTION WRITER
#
# This workflow is intentionally read-only. The canonical /learn/ owner is
# Publish DTFSeeds Learning Experience V3. The former V4 writer performed loose
# WordPress media-library matching and could overwrite the canonical Learn page
# with stale or contextually wrong visual assets. Keeping this compatibility
# workflow read-only prevents manual dispatches or future script edits from
# reintroducing the retired visual system.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/rebuild-wordpress-learn-visual-v4.mjs'
      - '.github/workflows/wordpress-learn-visual-v4-production.yml'

concurrency:
  group: wordpress-learn-visual-v4-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  retired-writer-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm legacy writer is not executed
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/rebuild-wordpress-learn-visual-v4.mjs
          test -s scripts/run-learning-v3-connected-production.sh
          grep -Fq 'data-dtf-layout="learn-v3"' scripts/rebuild-wordpress-learning-experience-v3.mjs
          grep -Fq 'function isApprovedLearningMedia(item)' scripts/prepare-learning-v3-owner-aware-publisher.mjs
          grep -Fq "if (slug.startsWith('dtf-strain-card-')) return false;" scripts/prepare-learning-v3-owner-aware-publisher.mjs
          echo 'Legacy Learn Visual V4 mutation is retired. Canonical Learning V3 owns /learn/.'

      - name: Verify canonical visitor-facing Learn owner
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/learn-canonical.html"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -4 --fail --silent --show-error --location \
              --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 45 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "https://dtfseeds.com/learn/?dtf_retired_v4_guard=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" \
              -o "$body"; then
              if grep -Fq 'data-dtf-layout="learn-v3"' "$body" && \
                 grep -Fq 'data-dtf-learning-map="v4"' "$body"; then
                ok=1
                break
              fi
            fi
            [[ "$attempt" -lt 6 ]] && sleep $((attempt * 3))
          done
          [[ "$ok" -eq 1 ]] || {
            echo 'Canonical Learning V3 owner was not observed; refusing any legacy fallback mutation.' >&2
            exit 1
          }
          echo 'Canonical Learning V3 is visitor-facing; no legacy write performed.'
