name: Verify Weedopolis Live Assets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/verify-weedopolis-live-assets.mjs
      - .github/workflows/verify-weedopolis-live-assets.yml
      - site/public-route-patch/games/weedopolis/source-revision.txt
      - .github/workflows/build-dtfseeds-public-suite.yml
  workflow_run:
    workflows:
      - Deploy DTFSeeds Public Suite via WordPress V2
    types:
      - completed
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: verify-weedopolis-live-assets-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout verification source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate strict audit script
        run: node --check scripts/verify-weedopolis-live-assets.mjs

      - name: Verify Weedopolis route, production interactions, assets, and board
        env:
          SITE: https://dtfseeds.com
        run: node scripts/verify-weedopolis-live-assets.mjs

      - name: Summarize verification
        if: always()
        run: |
          {
            echo '## Weedopolis live release verification'
            echo
            echo '- Canonical route: https://dtfseeds.com/games/weedopolis/'
            echo '- Requires the production interaction layer, mobile turn dock, synchronized board copy, and current deed-state copy.'
            echo '- Rejects retired V1/developer-facing production language in visitor HTML.'
            echo '- Requires the gameplay CSS/JavaScript stack plus the master board, deed, and High Chance WebP assets.'
            echo '- Runs for relevant PRs, after successful production-suite deployments, on demand, and daily.'
          } >> "$GITHUB_STEP_SUMMARY"
