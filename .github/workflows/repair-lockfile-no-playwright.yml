name: Repair lockfile without Playwright

on:
  push:
    branches:
      - fix/estate-remove-playwright-active-code
    paths:
      - '.github/workflows/repair-lockfile-no-playwright.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/estate-remove-playwright-active-code
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate workspace lockfile from current manifests
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          ! grep -Fq '"@playwright/test"' package-lock.json
          ! grep -Fq 'node_modules/playwright' package-lock.json
          ! grep -Fq 'node_modules/playwright-core' package-lock.json
      - name: Commit lockfile repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches package manifests.'
            exit 0
          fi
          git config user.name 'dtf-safe-integration-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(deps): remove stale Playwright lock entries'
          git push origin HEAD:fix/estate-remove-playwright-active-code
