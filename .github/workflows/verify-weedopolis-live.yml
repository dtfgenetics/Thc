name: Verify Weedopolis Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-weedopolis-live.yml
  workflow_run:
    workflows: ["Deploy DTFSeeds Public Suite via WordPress V2"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-weedopolis-live
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify master-based Weedopolis browser game is live
        shell: bash
        run: |
          set -euo pipefail
          base='https://dtfseeds.com/games/weedopolis/'
          bust="weedopolis_verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          fetch_asset() {
            local rel="$1" out headers status type
            out="$(mktemp)"; headers="$(mktemp)"
            status="$(curl -sS --connect-timeout 10 --max-time 25 \
              --output "$out" --dump-header "$headers" --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "${base}${rel}?${bust}")"
            type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers")"
            echo "${rel:-/} -> HTTP ${status} ${type:-unknown-content-type} bytes=$(wc -c < "$out")" >&2
            if [[ "$status" != '200' ]]; then
              echo "FAILED_ASSET=${rel:-/}" >&2
              head -c 500 "$out" >&2 || true
              rm -f "$out" "$headers"
              return 1
            fi
            if grep -Eiq '^location:' "$headers"; then
              echo "Unexpected redirect for ${rel:-/}" >&2
              cat "$headers" >&2
              rm -f "$out" "$headers"
              return 1
            fi
            cat "$out"
            rm -f "$out" "$headers"
          }

          html="$(fetch_asset '')"
          for marker in \
            'Start Weedopolis' \
            'id="board"' \
            'data-ui-standard="premium-responsive-shell-v1"' \
            'data-art-standard="weedopolis-v1-master"' \
            'id="currentBalance"' \
            'id="mobileRollBtn"' \
            'id="propertyArtSlot"' \
            'js/weedopolis-master-overrides.js' \
            'js/weedopolis-assets.js' \
            'js/weedopolis-engine.js' \
            'js/weedopolis-ui.js' \
            'runtime-assets.css' \
            'master-board-overlay.css'; do
            grep -Fq "$marker" <<<"$html" || { echo "Missing page marker: $marker" >&2; exit 1; }
          done
          ! grep -Fq 'The playable development build is loading.' <<<"$html"
          ! grep -Fq 'Weedopolis V2' <<<"$html"

          for asset in \
            styles.css \
            approved-assets.css \
            runtime-assets.css \
            master-board-overlay.css \
            js/weedopolis-edition.js \
            js/weedopolis-master-overrides.js \
            js/weedopolis-assets.js \
            js/weedopolis-engine.js \
            js/weedopolis-ui.js \
            assets/asset-manifest.json \
            assets/board/weedopolis-master-board.webp \
            assets/property-cards/webp/autoflower.webp; do
            fetch_asset "$asset" >/dev/null
          done

          overlay="$(fetch_asset master-board-overlay.css)"
          registry="$(fetch_asset js/weedopolis-assets.js)"
          manifest="$(fetch_asset assets/asset-manifest.json)"
          grep -Fq "assets/board/weedopolis-master-board.webp" <<<"$overlay"
          grep -Fq 'expectedOwnershipCards: 28' <<<"$registry"
          grep -Fq "['green-crack','Green Crack','property',18,180,'orange'" <<<"$registry"
          grep -Fq "['og-kush','OG Kush','property',38,350,'dark_blue'" <<<"$registry"
          grep -Fq "['permanent-marker','Permanent Marker','property',40,400,'dark_blue'" <<<"$registry"
          grep -Fq 'generatedMockupArtAllowed: false' <<<"$registry"
          grep -Fq '"v2_hex_allowed": false' <<<"$manifest"
          grep -Fq '"web_exports_ready": 1' <<<"$manifest"
          grep -Fq '"web_exports_pending": 27' <<<"$manifest"
          grep -Fq '"id": "autoflower"' <<<"$manifest"
          grep -Fq '"path": "assets/property-cards/webp/autoflower.webp"' <<<"$manifest"
          grep -Fq '"bytes": 39634' <<<"$manifest"
          grep -Fq '"sha256": "84c0d05bfc26aa104351e3f9065e1ea8b2a94bacc566b5b66a57ff7ad98fca12"' <<<"$manifest"

          autoflower="$(mktemp)"
          autoflower_headers="$(mktemp)"
          autoflower_status="$(curl -sS --connect-timeout 10 --max-time 25 \
            --output "$autoflower" --dump-header "$autoflower_headers" --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "${base}assets/property-cards/webp/autoflower.webp?${bust}-checksum")"
          test "$autoflower_status" = '200'
          ! grep -Eiq '^location:' "$autoflower_headers"
          test "$(wc -c < "$autoflower" | tr -d ' ')" = '39634'
          test "$(sha256sum "$autoflower" | awk '{print $1}')" = '84c0d05bfc26aa104351e3f9065e1ea8b2a94bacc566b5b66a57ff7ad98fca12'
          rm -f "$autoflower" "$autoflower_headers"

          echo 'Master-based Weedopolis V1 playable browser build is live with checksum-verified AutoFlower deed export.'
