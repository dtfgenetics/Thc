name: Publish DTFSeeds WordPress Production

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Stage DTFSeeds WordPress Canonical Deployment
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and verify canonical WordPress experience
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
      WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
      CONTENT_DIR: ${{ github.workspace }}/site/wordpress/pages
      BACKUP_ROOT: /tmp/wordpress-production-backups

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require successful trusted handoff
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]

      - name: Validate protected production package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/apply-wordpress-public-content-owned-routes.mjs
          node --check scripts/verify-wordpress-owned-route-preservation.mjs
          node --check scripts/audit-wordpress-commerce-rest.mjs
          node --check scripts/rebuild-wordpress-commerce-visuals.mjs
          node --check scripts/style-wordpress-woocommerce-archive.mjs
          node --check scripts/reconcile-woocommerce-products.mjs
          node --check scripts/rollback-woocommerce-products.mjs
          node scripts/validate-genetics-commerce.mjs
          node scripts/validate-woocommerce-reconciliation.mjs
          test -s site/wordpress/assets/brand/dtf-potleaf-512.png

      - name: Detect protected WordPress credentials
        id: access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${WP_API_USERNAME:-}" ]] && user_present=true || user_present=false
          [[ -n "${WP_API_PASSWORD:-}" ]] && password_present=true || password_present=false
          echo "user_present=$user_present" >> "$GITHUB_OUTPUT"
          echo "password_present=$password_present" >> "$GITHUB_OUTPUT"
          if [[ "$user_present" == true && "$password_present" == true ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "WordPress production credentials are not configured." >&2
            exit 1
          fi

      - name: Probe WordPress commerce and presentation capabilities without writes
        id: commerce_capabilities
        continue-on-error: true
        shell: bash
        run: node scripts/audit-wordpress-commerce-rest.mjs

      - name: Reconcile canonical editorial pages while preserving Learning-owned Home and Learn
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-wordpress-public-content-owned-routes.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-rest-backup-path.txt")"
          summary="$backup_dir/deployment-summary.json"
          echo "mutations=$(node -p "require(process.argv[1]).mutationCount" "$summary")" >> "$GITHUB_OUTPUT"
          echo "changed_pages=$(node -p "require(process.argv[1]).changedPages" "$summary")" >> "$GITHUB_OUTPUT"

      - name: Rebuild commerce presentation and URL brand state
        id: commerce_visual
        env:
          APPLY_COMMERCE_VISUALS: 'true'
          BACKUP_ROOT: /tmp/wordpress-production-backups/commerce-visual
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rebuild-wordpress-commerce-visuals.mjs
          dir="$(cat "$BACKUP_ROOT/commerce-visual-backup-path.txt")"
          report="$dir/commerce-visual-report.json"
          echo "brand_id=$(node -p "require(process.argv[1]).brandMediaId" "$report")" >> "$GITHUB_OUTPUT"
          echo "aioseo_routes=$(node -p "require(process.argv[1]).aioseoRoutes.length" "$report")" >> "$GITHUB_OUTPUT"

      - name: Style active WooCommerce Shop archive
        id: shop_archive
        env:
          APPLY_WOOCOMMERCE_ARCHIVE_STYLE: 'true'
          BACKUP_ROOT: /tmp/wordpress-production-backups/woocommerce-archive
        shell: bash
        run: |
          set -euo pipefail
          node scripts/style-wordpress-woocommerce-archive.mjs
          dir="$(cat "$BACKUP_ROOT/woocommerce-archive-style-backup-path.txt")"
          report="$dir/woocommerce-archive-style-report.json"
          echo "template_parts=$(node -p "require(process.argv[1]).templateParts.length" "$report")" >> "$GITHUB_OUTPUT"

      - name: Verify DTF cannabis-leaf site icon through WordPress REST
        id: icon
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' "$WP_API_USERNAME" "$WP_API_PASSWORD" | base64 -w0)"
          curl -4 --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 60 \
            -H "Authorization: Basic $auth" \
            "$WP_SITE_URL/wp-json/wp/v2/settings?context=edit" \
            -o "$RUNNER_TEMP/settings.json"
          site_icon="$(node -p "Number(require(process.argv[1]).site_icon || 0)" "$RUNNER_TEMP/settings.json")"
          [[ "$site_icon" -gt 0 ]]
          curl -4 --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 60 \
            -H "Authorization: Basic $auth" \
            "$WP_SITE_URL/wp-json/wp/v2/media/$site_icon?context=edit" \
            -o "$RUNNER_TEMP/icon.json"
          node - <<'NODE' "$RUNNER_TEMP/icon.json"
          const m=require(process.argv[2]);
          const text=`${m.title?.rendered||''} ${m.alt_text||''}`.toLowerCase();
          if(!text.includes('dtf genetics cannabis leaf')) throw new Error('WordPress Site Icon is not the DTF cannabis leaf');
          NODE
          echo "site_icon=$site_icon" >> "$GITHUB_OUTPUT"

      - name: Verify Learning-owned WordPress route preservation through REST
        id: owned_routes
        env:
          EXPECTED_HOME_FEATURED_MEDIA: ${{ steps.icon.outputs.site_icon }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-wordpress-owned-route-preservation.mjs

      - name: Verify live WordPress surfaces owned by this lane
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' "$WP_API_USERNAME" "$WP_API_PASSWORD" | base64 -w0)"

          verify_wordpress_page() {
            local slug="$1" required="$2" json
            json="$RUNNER_TEMP/wp-backing-${slug}.json"
            curl -4 --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 60 \
              -H "Authorization: Basic $auth" \
              -H 'Accept: application/json' \
              "$WP_SITE_URL/wp-json/wp/v2/pages?slug=${slug}&context=edit&per_page=10" \
              -o "$json"
            node - <<'NODE' "$json" "$slug" "$required"
          const pages=require(process.argv[2]);
          const slug=process.argv[3];
          const required=process.argv[4];
          if(!Array.isArray(pages)||pages.length!==1) throw new Error(`Expected exactly one WordPress backing page for ${slug}, found ${Array.isArray(pages)?pages.length:'invalid response'}`);
          const page=pages[0];
          if(page.status!=='publish'||page.slug!==slug) throw new Error(`WordPress backing page ${slug} is not published with the expected slug`);
          const content=typeof page.content==='string'?page.content:`${page.content?.raw||''}\n${page.content?.rendered||''}`;
          if(!content.includes(required)) throw new Error(`WordPress backing page ${slug} is missing required canonical content: ${required}`);
          console.log(`Verified WordPress backing page ${slug} (ID ${page.id})`);
          NODE
          }

          verify_static_shadow() {
            local path="$1" title="$2" body
            body="$RUNNER_TEMP/wp-shadow-$(echo "$path" | tr '/?' '__').html"
            curl -4 --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 60 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "$WP_SITE_URL${path}?dtf_wp_shadow_verify=${GITHUB_RUN_ID}" \
              --output "$body"
            grep -Fqi "<title>${title} | DTF Genetics</title>" "$body"
            grep -Fq 'assets/dtf-home/dtf-home.css' "$body"
            grep -Fq 'Adult visitors only' "$body"
            grep -Fqi 'DTF Genetics' "$body"
            for forbidden in \
              'Reserved strain card' \
              'staged for verified' \
              'being rebuilt' \
              'Needed from owner' \
              'email@email.com' \
              '+123456789' \
              'Tool-ready rebuild' \
              'Grow education belongs in a clean, readable library.' \
              'MOPS, cultivation notes, THC basics'; do
              if grep -Fqi -- "$forbidden" "$body"; then
                echo "Forbidden live phrase remains on static shadow $path: $forbidden" >&2
                exit 1
              fi
            done
            echo "$path verified as healthy static visitor shadow"
          }

          # Community and Contact have canonical WordPress backing records, but
          # physical static shells currently shadow their public routes. Verify
          # both ownership layers explicitly instead of demanding WordPress-only
          # copy from a route that WordPress does not serve to visitors.
          verify_wordpress_page 'community' 'Join the official DTF / Teaching Healthy Cultivation Discord'
          verify_wordpress_page 'contact' 'Join the official DTF / Teaching Healthy Cultivation Discord'
          verify_static_shadow '/community/' 'Community'
          verify_static_shadow '/contact/' 'Contact'

          # The WooCommerce archive styling is WordPress-owned state even when
          # the public /shop/ route is overlaid. Verify the actual template part
          # through authenticated REST instead of scraping the overlay for a
          # WordPress-only marker.
          curl -4 --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 60 \
            -H "Authorization: Basic $auth" \
            -H 'Accept: application/json' \
            "$WP_SITE_URL/wp-json/wp/v2/template-parts?context=edit&per_page=100" \
            -o "$RUNNER_TEMP/template-parts.json"
          node - <<'NODE' "$RUNNER_TEMP/template-parts.json"
          const parts=require(process.argv[2]);
          const headers=(Array.isArray(parts)?parts:[]).filter(part=>part.theme==='hostinger-ai-theme'&&part.slug==='header');
          if(!headers.length) throw new Error('Active Hostinger header template part was not found during production verification');
          for(const part of headers){
            const content=typeof part.content==='string'?part.content:`${part.content?.raw||''}\n${part.content?.rendered||''}`;
            if(!content.includes('dtf-commerce-archive-style')) throw new Error(`WooCommerce archive style marker missing from WordPress template part ${part.id}`);
          }
          console.log(`Verified WooCommerce archive style in ${headers.length} WordPress template part(s)`);
          NODE

          # /learn/ is deliberately not mutated or gated here. The downstream
          # Learning Experience V3 transaction is the sole automatic Learn owner.
          # Product detail routes remain WordPress/WooCommerce-owned and must be
          # publicly reachable independently of the overlaid Shop landing page.
          for route in \
            '/product/10-regular-f2-blue-mango-seeds/' \
            '/product/10-feminized-f2-blue-mango-x/' \
            '/product/10-reg-f1-blueberry-bubblegum/'; do
            key="$(echo "$route" | tr '/?' '__')"
            body="$RUNNER_TEMP/wp-production-${key}.html"
            curl -4 --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 60 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "$WP_SITE_URL${route}?dtf_wp_product_verify=${GITHUB_RUN_ID}" \
              --output "$body"
            test -s "$body" || { echo "Reviewed product route returned an empty body: $route" >&2; exit 1; }
            echo "$route verified as a reachable product detail surface"
          done

      - name: Reconcile canonical WooCommerce product copy and categories
        id: commerce_reconcile
        continue-on-error: true
        env:
          BACKUP_ROOT: ${{ runner.temp }}/woocommerce-product-backups
        shell: bash
        run: |
          set -euo pipefail
          APPLY_WOOCOMMERCE_CHANGES=true node scripts/reconcile-woocommerce-products.mjs

      - name: Automatically restore WooCommerce snapshots after a failed product reconciliation
        id: commerce_rollback
        if: steps.commerce_reconcile.outcome == 'failure'
        env:
          BACKUP_ROOT: ${{ runner.temp }}/woocommerce-product-backups
        shell: bash
        run: |
          set -euo pipefail
          pointer="$BACKUP_ROOT/woocommerce-backup-path.txt"
          [[ -f "$pointer" ]] || exit 0
          backup_dir="$(cat "$pointer")"
          [[ -f "$backup_dir/backup-manifest.json" ]] || exit 0
          APPLY_WOOCOMMERCE_ROLLBACK=true node scripts/rollback-woocommerce-products.mjs

      - name: Upload rollback and capability package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-production-backup-${{ github.run_id }}
          path: |
            /tmp/wordpress-production-backups
            ${{ runner.temp }}/woocommerce-product-backups
            woocommerce-reconciliation-report.json
            woocommerce-reconciliation-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Report production result to issue 46
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          USER_PRESENT: ${{ steps.access.outputs.user_present }}
          PASSWORD_PRESENT: ${{ steps.access.outputs.password_present }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          COMMERCE_VISUAL_OUTCOME: ${{ steps.commerce_visual.outcome }}
          SHOP_ARCHIVE_OUTCOME: ${{ steps.shop_archive.outcome }}
          OWNED_ROUTES_OUTCOME: ${{ steps.owned_routes.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SITE_ICON: ${{ steps.icon.outputs.site_icon }}
          COMMERCE_RECONCILE_OUTCOME: ${{ steps.commerce_reconcile.outcome }}
          COMMERCE_ROLLBACK_OUTCOME: ${{ steps.commerce_rollback.outcome }}
        with:
          script: |
            const body = [
              '## Canonical WordPress production deployment', '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Protected job result: **${process.env.JOB_STATUS}**`,
              `WordPress username configured: **${process.env.USER_PRESENT || 'false'}**`,
              `WordPress application password configured: **${process.env.PASSWORD_PRESENT || 'false'}**`,
              `Ownership-preserving page reconciliation: **${process.env.PUBLISH_OUTCOME || 'not-run'}**`,
              `Commerce presentation + URL brand state: **${process.env.COMMERCE_VISUAL_OUTCOME || 'not-run'}**`,
              `WooCommerce Shop archive styling: **${process.env.SHOP_ARCHIVE_OUTCOME || 'not-run'}**`,
              `Cannabis-leaf Site Icon media ID: **${process.env.SITE_ICON || 'not-run'}**`,
              `Learning-owned Home/Learn hash preservation: **${process.env.OWNED_ROUTES_OUTCOME || 'not-run'}**`,
              `Live owned-surface verification: **${process.env.VERIFY_OUTCOME || 'not-run'}**`,
              `WooCommerce reconciliation: **${process.env.COMMERCE_RECONCILE_OUTCOME || 'not-run'}**`,
              `WooCommerce rollback: **${process.env.COMMERCE_ROLLBACK_OUTCOME || 'not-needed'}**`, '',
              'Production scope: canonical non-Learn WordPress editorial backing records, WooCommerce presentation, current brand imagery, and fresh visitor verification. Public Home, Shop, Community, and Contact may be served by static overlays; their WordPress-owned state is verified through REST while public shadows are checked independently. WordPress Home and Learn bodies are hash-preserved here and finalized by the downstream Learning Experience V3 owner.'
            ].join('\n');
            await core.summary.addRaw(body).write();
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body});
            } catch (error) {
              core.warning(`Could not post canonical production result to issue #46: ${error.message}`);
            }
