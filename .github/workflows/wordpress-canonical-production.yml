name: Publish DTFSeeds WordPress Production

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Stage DTFSeeds WordPress Canonical Deployment
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-production
  cancel-in-progress: true

jobs:
  publish:
    name: Publish and verify canonical WordPress pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
      WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
      CONTENT_DIR: ${{ github.workspace }}/site/wordpress/pages
      BACKUP_ROOT: ${{ runner.temp }}/wordpress-production-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require successful trusted handoff
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]

      - name: Validate protected production package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/audit-wordpress-commerce-rest.mjs
          node --check scripts/reconcile-woocommerce-products.mjs
          node --check scripts/rollback-woocommerce-products.mjs
          node scripts/validate-genetics-commerce.mjs
          node scripts/validate-woocommerce-reconciliation.mjs

      - name: Detect protected WordPress credentials
        id: access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${WP_API_USERNAME:-}" ]] && user_present=true || user_present=false
          [[ -n "${WP_API_PASSWORD:-}" ]] && password_present=true || password_present=false
          [[ -n "${WC_CONSUMER_KEY:-}" ]] && wc_key_present=true || wc_key_present=false
          [[ -n "${WC_CONSUMER_SECRET:-}" ]] && wc_secret_present=true || wc_secret_present=false
          echo "user_present=$user_present" >> "$GITHUB_OUTPUT"
          echo "password_present=$password_present" >> "$GITHUB_OUTPUT"
          echo "wc_key_present=$wc_key_present" >> "$GITHUB_OUTPUT"
          echo "wc_secret_present=$wc_secret_present" >> "$GITHUB_OUTPUT"
          if [[ "$user_present" == true && "$password_present" == true ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe WordPress commerce and presentation capabilities without writes
        id: commerce_capabilities
        if: steps.access.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-wordpress-commerce-rest.mjs

      - name: Reconcile canonical pages and front page
        id: publish
        if: steps.access.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-wordpress-public-content-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-rest-backup-path.txt")"
          summary="$backup_dir/deployment-summary.json"
          mutations="$(node -p "require(process.argv[1]).mutationCount" "$summary")"
          changed_pages="$(node -p "require(process.argv[1]).changedPages" "$summary")"
          echo "mutations=$mutations" >> "$GITHUB_OUTPUT"
          echo "changed_pages=$changed_pages" >> "$GITHUB_OUTPUT"

      - name: Verify live canonical pages
        id: verify
        if: steps.access.outputs.available == 'true' && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          verify_page() {
            local path="$1"
            local required="$2"
            local body="$RUNNER_TEMP/wp-production-$(echo "$path" | tr '/?' '__').html"
            local ok=0
            for attempt in 1 2 3 4 5 6; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --header 'Cache-Control: no-cache' \
                "https://dtfseeds.com${path}?dtf_wp_production=${GITHUB_RUN_ID}-${attempt}" \
                --output "$body"
              if grep -Fqi -- "$required" "$body"; then
                ok=1
                break
              fi
              sleep 10
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Canonical production text not found on $path: $required" >&2
              exit 1
            fi
            for forbidden in \
              'Reserved strain card' \
              'staged for verified' \
              'being rebuilt' \
              'Needed from owner' \
              'email@email.com' \
              '+123456789'; do
              if grep -Fqi -- "$forbidden" "$body"; then
                echo "Forbidden live phrase remains on $path: $forbidden" >&2
                exit 1
              fi
            done
          }

          verify_page '/' 'Genetics, cultivation education, practical tools, and original cannabis games.'
          verify_page '/seeds/' 'Shop current releases'
          verify_page '/shop/' 'Shop current DTF releases without losing the breeding context.'
          verify_page '/learn/' 'Read the yellow-leaves diagnostic guide'
          verify_page '/community/' 'Join the official DTF / Teaching Healthy Cultivation Discord'
          verify_page '/contact/' 'Join the official DTF / Teaching Healthy Cultivation Discord'

      - name: Reconcile canonical WooCommerce product copy and categories
        id: commerce_reconcile
        if: steps.access.outputs.available == 'true' && steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          BACKUP_ROOT: ${{ runner.temp }}/woocommerce-product-backups
        run: |
          set -euo pipefail
          APPLY_WOOCOMMERCE_CHANGES=true node scripts/reconcile-woocommerce-products.mjs

      - name: Automatically restore WooCommerce snapshots after a failed product reconciliation
        id: commerce_rollback
        if: steps.commerce_reconcile.outcome == 'failure'
        shell: bash
        env:
          BACKUP_ROOT: ${{ runner.temp }}/woocommerce-product-backups
        run: |
          set -euo pipefail
          pointer="$BACKUP_ROOT/woocommerce-backup-path.txt"
          if [[ ! -f "$pointer" ]]; then
            echo 'No product backup pointer exists; reconciliation failed before a rollback-capable snapshot set was created.'
            exit 0
          fi
          backup_dir="$(cat "$pointer")"
          if [[ ! -f "$backup_dir/backup-manifest.json" ]]; then
            echo 'No complete product backup manifest exists; reconciliation failed before any product write could begin.'
            exit 0
          fi
          APPLY_WOOCOMMERCE_ROLLBACK=true node scripts/rollback-woocommerce-products.mjs

      - name: Fail when WordPress credentials are absent
        if: steps.access.outputs.available != 'true'
        run: exit 1

      - name: Upload rollback and capability package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-production-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wordpress-production-backups
            ${{ runner.temp }}/woocommerce-product-backups
            woocommerce-reconciliation-report.json
            woocommerce-reconciliation-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Report production result to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          USER_PRESENT: ${{ steps.access.outputs.user_present }}
          PASSWORD_PRESENT: ${{ steps.access.outputs.password_present }}
          WC_KEY_PRESENT: ${{ steps.access.outputs.wc_key_present }}
          WC_SECRET_PRESENT: ${{ steps.access.outputs.wc_secret_present }}
          COMMERCE_CAPABILITY_OUTCOME: ${{ steps.commerce_capabilities.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          COMMERCE_RECONCILE_OUTCOME: ${{ steps.commerce_reconcile.outcome }}
          COMMERCE_ROLLBACK_OUTCOME: ${{ steps.commerce_rollback.outcome }}
          MUTATIONS: ${{ steps.publish.outputs.mutations }}
          CHANGED_PAGES: ${{ steps.publish.outputs.changed_pages }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let presentation = 'Presentation probe did not produce a readable report.';
            const capabilityPath = path.join(process.env.BACKUP_ROOT || '', 'wordpress-commerce-capabilities.json');
            if (capabilityPath && fs.existsSync(capabilityPath)) {
              const report = JSON.parse(fs.readFileSync(capabilityPath, 'utf8'));
              const theme = report.presentation?.activeTheme?.details?.[0];
              const plugins = report.presentation?.installedPlugins?.details || [];
              const defects = report.presentation?.defectMatches || {};
              const formatMatches = (items, label) => (items || []).map((item) => {
                const id = item.id || item.wpId || item.slug || 'unknown';
                const title = item.title || item.name || item.renderedExcerpt || item.contentExcerpt || '';
                return `- ${label} ${id}: ${String(title).slice(0, 180)}`;
              });
              const matches = [
                ...formatMatches(defects.templatePartMatches, 'template-part'),
                ...formatMatches(defects.widgetMatches, 'widget'),
                ...formatMatches(defects.blockNavigationMatches, 'block-navigation'),
                ...formatMatches(defects.classicMenuItemMatches, 'classic-menu-item')
              ];
              presentation = [
                `Active theme: **${theme?.name || theme?.stylesheet || 'unresolved'}**${theme?.version ? ` ${theme.version}` : ''}`,
                `Block theme: **${theme?.isBlockTheme ? 'yes' : 'no'}**`,
                `Installed plugins visible to REST: **${plugins.length}**`,
                `Presentation resources matching stale footer/navigation markers: **${matches.length}**`,
                ...(matches.length ? matches.slice(0, 20) : ['- No exact marker match was returned by template-part/widget/navigation/menu probes.'])
              ].join('\n');
            }
            const body = [
              '## Canonical WordPress production deployment',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Protected job result: **${process.env.JOB_STATUS}**`,
              `WordPress username configured: **${process.env.USER_PRESENT || 'false'}**`,
              `WordPress application password configured: **${process.env.PASSWORD_PRESENT || 'false'}**`,
              `WooCommerce consumer key configured: **${process.env.WC_KEY_PRESENT || 'false'}**`,
              `WooCommerce consumer secret configured: **${process.env.WC_SECRET_PRESENT || 'false'}**`,
              `Read-only commerce/presentation capability probe: **${process.env.COMMERCE_CAPABILITY_OUTCOME || 'not-run'}**`,
              `REST page publish outcome: **${process.env.PUBLISH_OUTCOME || 'not-run'}**`,
              `Live page verification outcome: **${process.env.VERIFY_OUTCOME || 'not-run'}**`,
              `WooCommerce reconciliation outcome: **${process.env.COMMERCE_RECONCILE_OUTCOME || 'not-run'}**`,
              `WooCommerce automatic rollback outcome: **${process.env.COMMERCE_ROLLBACK_OUTCOME || 'not-needed'}**`,
              `Page mutations: **${process.env.MUTATIONS || 'not-run'}**`,
              `Pages changed: **${process.env.CHANGED_PAGES || 'not-run'}**`,
              '',
              '### Presentation probe',
              '',
              presentation,
              '',
              'Canonical page scope: Home, Seeds, Learn, Community, Shop, Gallery, About, Contact. Home is enforced as the WordPress front page at `/`. Static game routes are not modified by this job.',
              'WooCommerce scope is restricted to reviewed product names, descriptions, short descriptions, and category assignments for pinned product IDs 39, 41, and 91. Price, sale price, stock, SKU, slug, images, tags, shipping, tax, and order data are not written.',
              'All three product snapshots are captured before the first product update. A failed product reconciliation automatically restores those fields when a complete backup manifest exists.',
              'Blue Bubblegum product ID 91 keeps its current store title pending explicit naming reconciliation.',
              'No credential values are included in this report.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body
            });
