name: Publish DTFSeeds WordPress Production

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Stage DTFSeeds WordPress Canonical Deployment
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-production
  cancel-in-progress: true

jobs:
  publish:
    name: Publish and verify canonical WordPress experience
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
      WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
      CONTENT_DIR: ${{ github.workspace }}/site/wordpress/pages
      BACKUP_ROOT: /tmp/wordpress-production-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require successful trusted handoff
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]

      - name: Validate protected production package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/audit-wordpress-commerce-rest.mjs
          node --check scripts/rebuild-wordpress-visual-site.mjs
          node --check scripts/reconcile-woocommerce-products.mjs
          node --check scripts/rollback-woocommerce-products.mjs
          node scripts/validate-genetics-commerce.mjs
          node scripts/validate-woocommerce-reconciliation.mjs
          test -s site/wordpress/assets/brand/dtf-potleaf-512.png

      - name: Detect protected WordPress credentials
        id: access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${WP_API_USERNAME:-}" ]] && user_present=true || user_present=false
          [[ -n "${WP_API_PASSWORD:-}" ]] && password_present=true || password_present=false
          [[ -n "${WC_CONSUMER_KEY:-}" ]] && wc_key_present=true || wc_key_present=false
          [[ -n "${WC_CONSUMER_SECRET:-}" ]] && wc_secret_present=true || wc_secret_present=false
          echo "user_present=$user_present" >> "$GITHUB_OUTPUT"
          echo "password_present=$password_present" >> "$GITHUB_OUTPUT"
          echo "wc_key_present=$wc_key_present" >> "$GITHUB_OUTPUT"
          echo "wc_secret_present=$wc_secret_present" >> "$GITHUB_OUTPUT"
          if [[ "$user_present" == true && "$password_present" == true ]]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: Probe WordPress commerce and presentation capabilities without writes
        id: commerce_capabilities
        if: steps.access.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: node scripts/audit-wordpress-commerce-rest.mjs

      - name: Reconcile canonical pages and front page
        id: publish
        if: steps.access.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-wordpress-public-content-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-rest-backup-path.txt")"
          summary="$backup_dir/deployment-summary.json"
          echo "mutations=$(node -p "require(process.argv[1]).mutationCount" "$summary")" >> "$GITHUB_OUTPUT"
          echo "changed_pages=$(node -p "require(process.argv[1]).changedPages" "$summary")" >> "$GITHUB_OUTPUT"

      - name: Rebuild DTF visual brand shell, Home, and Learn
        id: visual
        if: steps.publish.outcome == 'success'
        env:
          APPLY_VISUAL_REBUILD: 'true'
          BACKUP_ROOT: /tmp/wordpress-production-backups/visual
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rebuild-wordpress-visual-site.mjs
          dir="$(cat "$BACKUP_ROOT/visual-rebuild-backup-path.txt")"
          report="$dir/visual-rebuild-report.json"
          echo "media_count=$(node -p "require(process.argv[1]).mediaCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "brand_id=$(node -p "require(process.argv[1]).brandMediaId" "$report")" >> "$GITHUB_OUTPUT"
          echo "missing=$(node -p "require(process.argv[1]).missingSelections.join(',')" "$report")" >> "$GITHUB_OUTPUT"

      - name: Verify DTF cannabis-leaf site icon through WordPress REST
        id: icon
        if: steps.visual.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' "$WP_API_USERNAME" "$WP_API_PASSWORD" | base64 -w0)"
          curl -4 --fail --silent --show-error --location -H "Authorization: Basic $auth" "$WP_SITE_URL/wp-json/wp/v2/settings?context=edit" -o "$RUNNER_TEMP/settings.json"
          site_icon="$(node -p "Number(require(process.argv[1]).site_icon || 0)" "$RUNNER_TEMP/settings.json")"
          [[ "$site_icon" -gt 0 ]]
          curl -4 --fail --silent --show-error --location -H "Authorization: Basic $auth" "$WP_SITE_URL/wp-json/wp/v2/media/$site_icon?context=edit" -o "$RUNNER_TEMP/icon.json"
          node - <<'NODE' "$RUNNER_TEMP/icon.json"
          const m=require(process.argv[2]);
          const text=`${m.title?.rendered||''} ${m.alt_text||''}`.toLowerCase();
          if(!text.includes('dtf genetics cannabis leaf')) throw new Error('WordPress Site Icon is not the DTF cannabis leaf');
          NODE
          echo "site_icon=$site_icon" >> "$GITHUB_OUTPUT"

      - name: Verify live visual WordPress pages
        id: verify
        if: steps.icon.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          verify_page() {
            local path="$1"
            local required="$2"
            local minimum="$3"
            local key
            local body
            local ok=0
            local count=0
            key="$(echo "$path" | tr '/?' '__')"
            body="$RUNNER_TEMP/wp-production-${key}.html"
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                "$WP_SITE_URL${path}?dtf_wp_production=${GITHUB_RUN_ID}-${attempt}" \
                --output "$body"
              if grep -Fqi -- "$required" "$body"; then
                ok=1
                break
              fi
              sleep 8
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Required production text missing on $path: $required" >&2
              head -c 3000 "$body" >&2 || true
              exit 1
            fi
            if [[ "$minimum" -gt 0 ]]; then
              count="$(grep -o '/wp-content/uploads/' "$body" | wc -l | tr -d ' ')"
              if [[ "$count" -lt "$minimum" ]]; then
                echo "$path has $count WordPress-hosted image references; expected at least $minimum" >&2
                exit 1
              fi
            fi
            for forbidden in \
              'Reserved strain card' \
              'staged for verified' \
              'being rebuilt' \
              'Needed from owner' \
              'email@email.com' \
              '+123456789' \
              'Tool-ready rebuild' \
              'Grow education belongs in a clean, readable library.' \
              'MOPS, cultivation notes, THC basics'; do
              if grep -Fqi -- "$forbidden" "$body"; then
                echo "Forbidden live phrase remains on $path: $forbidden" >&2
                exit 1
              fi
            done
            echo "$path verified with $count WordPress-hosted image references"
          }
          verify_page '/' 'Genetics. Plant science. Tools. Games. Community.' 8
          verify_page '/learn/' 'Explore by subject' 10
          verify_page '/seeds/' 'Shop current releases' 0
          verify_page '/shop/' 'Shop current DTF releases without losing the breeding context.' 0
          verify_page '/community/' 'Join the official DTF / Teaching Healthy Cultivation Discord' 0
          verify_page '/contact/' 'Join the official DTF / Teaching Healthy Cultivation Discord' 0
          grep -Fqi 'DTF Genetics cannabis leaf' "$RUNNER_TEMP/wp-production-_.html"
          grep -Eqi '<link[^>]+rel=["'"'](shortcut )?icon["'"']' "$RUNNER_TEMP/wp-production-_.html"

      - name: Reconcile canonical WooCommerce product copy and categories
        id: commerce_reconcile
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          BACKUP_ROOT: ${{ runner.temp }}/woocommerce-product-backups
        run: |
          set -euo pipefail
          APPLY_WOOCOMMERCE_CHANGES=true node scripts/reconcile-woocommerce-products.mjs

      - name: Automatically restore WooCommerce snapshots after a failed product reconciliation
        id: commerce_rollback
        if: steps.commerce_reconcile.outcome == 'failure'
        shell: bash
        env:
          BACKUP_ROOT: ${{ runner.temp }}/woocommerce-product-backups
        run: |
          set -euo pipefail
          pointer="$BACKUP_ROOT/woocommerce-backup-path.txt"
          if [[ ! -f "$pointer" ]]; then exit 0; fi
          backup_dir="$(cat "$pointer")"
          if [[ ! -f "$backup_dir/backup-manifest.json" ]]; then exit 0; fi
          APPLY_WOOCOMMERCE_ROLLBACK=true node scripts/rollback-woocommerce-products.mjs

      - name: Fail when WordPress credentials are absent
        if: steps.access.outputs.available != 'true'
        run: exit 1

      - name: Upload rollback and capability package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-production-backup-${{ github.run_id }}
          path: |
            /tmp/wordpress-production-backups
            ${{ runner.temp }}/woocommerce-product-backups
            woocommerce-reconciliation-report.json
            woocommerce-reconciliation-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Report production result to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          USER_PRESENT: ${{ steps.access.outputs.user_present }}
          PASSWORD_PRESENT: ${{ steps.access.outputs.password_present }}
          WC_KEY_PRESENT: ${{ steps.access.outputs.wc_key_present }}
          WC_SECRET_PRESENT: ${{ steps.access.outputs.wc_secret_present }}
          COMMERCE_CAPABILITY_OUTCOME: ${{ steps.commerce_capabilities.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SITE_ICON: ${{ steps.icon.outputs.site_icon }}
          MEDIA_COUNT: ${{ steps.visual.outputs.media_count }}
          MISSING: ${{ steps.visual.outputs.missing }}
          COMMERCE_RECONCILE_OUTCOME: ${{ steps.commerce_reconcile.outcome }}
          COMMERCE_ROLLBACK_OUTCOME: ${{ steps.commerce_rollback.outcome }}
          MUTATIONS: ${{ steps.publish.outputs.mutations }}
          CHANGED_PAGES: ${{ steps.publish.outputs.changed_pages }}
        with:
          script: |
            const body = [
              '## Canonical WordPress production deployment', '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Protected job result: **${process.env.JOB_STATUS}**`,
              `WordPress username configured: **${process.env.USER_PRESENT || 'false'}**`,
              `WordPress application password configured: **${process.env.PASSWORD_PRESENT || 'false'}**`,
              `Canonical page reconciliation: **${process.env.PUBLISH_OUTCOME || 'not-run'}**`,
              `DTF visual rebuild: **${process.env.VISUAL_OUTCOME || 'not-run'}**`,
              `Cannabis-leaf Site Icon media ID: **${process.env.SITE_ICON || 'not-run'}**`,
              `WordPress media indexed for visual composition: **${process.env.MEDIA_COUNT || 'not-run'}**`,
              `Live visual verification: **${process.env.VERIFY_OUTCOME || 'not-run'}**`,
              `Optional visual slots unmatched: **${process.env.MISSING || 'none'}**`,
              `WooCommerce reconciliation: **${process.env.COMMERCE_RECONCILE_OUTCOME || 'not-run'}**`,
              `WooCommerce rollback: **${process.env.COMMERCE_ROLLBACK_OUTCOME || 'not-needed'}**`,
              `Page mutations before visual composition: **${process.env.MUTATIONS || 'not-run'}**`,
              `Pages changed before visual composition: **${process.env.CHANGED_PAGES || 'not-run'}**`, '',
              'Production scope now includes the DTF cannabis-leaf brand shell, image-driven Home and Learn experiences, canonical pages, and live cache-busted verification. Infographic production independently finishes the full categorized visual library.'
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body});
