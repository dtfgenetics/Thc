name: Verify Retired THC Learn Task Navigation V5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish-wordpress-learn-task-nav-v5.mjs'
      - '.github/workflows/wordpress-learn-task-nav-v5.yml'

permissions:
  contents: read

concurrency:
  group: dtfseeds-learn-task-nav-v5-retirement
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify task navigation is owned by Learning V3
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/publish-wordpress-learn-task-nav-v5.mjs
          ! grep -Fq "method: 'POST'" scripts/publish-wordpress-learn-task-nav-v5.mjs
          ! grep -Fq 'APPLY_LEARN_TASK_NAV_V5' scripts/publish-wordpress-learn-task-nav-v5.mjs
          node scripts/publish-wordpress-learn-task-nav-v5.mjs
