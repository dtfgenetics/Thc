name: Publish THC Learn Task Navigation V5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish-wordpress-learn-task-nav-v5.mjs'
      - '.github/workflows/wordpress-learn-task-nav-v5.yml'
  workflow_run:
    workflows:
      - Enhance DTFSeeds Education V4
      - Publish THC Beginner Course V5
      - Publish THC Pest Disease Library V5
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-learn-task-nav-v5
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  publish:
    name: Add task-first shortcuts to Learn
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_LEARN_TASK_NAV_V5: 'true'
      BACKUP_ROOT: /tmp/dtf-learn-task-nav-v5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate task navigation publisher
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/publish-wordpress-learn-task-nav-v5.mjs
          for href in /learn/start-here/ /learn/diagnostics/ /learn/pests-diseases/ /learn/encyclopedia/ /learn/infographics/ /growlens/ /thc-grow-doc/; do
            grep -Fq "$href" scripts/publish-wordpress-learn-task-nav-v5.mjs
          done

      - name: Publish task-first Learn navigation
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/publish-wordpress-learn-task-nav-v5.mjs | tee "$RUNNER_TEMP/task-nav-v5.log"
          report="$(find "$BACKUP_ROOT" -name learn-task-nav-v5-report.json -print -quit)"
          test -s "$report"

      - name: Visitor-verify Learn shortcuts
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/learn.html"
          curl -4 --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
            "$WP_SITE_URL/learn/?dtf_task_v5=${GITHUB_RUN_ID}" -o "$body"
          grep -Fqi 'data-dtf-learn-task-nav-v5="true"' "$body"
          grep -Fqi 'Go straight to what you need.' "$body"
          for href in /learn/start-here/ /learn/diagnostics/ /learn/pests-diseases/ /learn/encyclopedia/ /learn/infographics/ /growlens/ /thc-grow-doc/; do
            grep -Fq "$href" "$body"
          done

      - name: Upload rollback and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thc-learn-task-nav-v5-${{ github.run_id }}
          path: |
            /tmp/dtf-learn-task-nav-v5
            ${{ runner.temp }}/task-nav-v5.log
            ${{ runner.temp }}/learn.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report Learn task navigation result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          VALIDATE: ${{ steps.validate.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body:[
              '## THC Learn task navigation V5','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `Publisher validation: **${process.env.VALIDATE || 'not-run'}**`,
              `WordPress publication: **${process.env.PUBLISH || 'not-run'}**`,
              `Visitor verification: **${process.env.VERIFY || 'not-run'}**`,'',
              'Learn now includes a task-first shortcut layer for Start Here, Diagnostic Index, Pest & Disease Library, Encyclopedia, visual references, GrowLens, Grow Doc, and glossary/records without replacing the existing subject-first V4 curriculum.'
            ].join('\n')});
