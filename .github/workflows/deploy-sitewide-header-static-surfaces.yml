name: Deploy Sitewide Header Static Surfaces

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/lib/sitewide-header-template.mjs
      - scripts/apply-sitewide-header.mjs
      - .github/workflows/build-dtfseeds-public-suite.yml
      - .github/workflows/deploy-sitewide-header-static-surfaces.yml
  pull_request:
    paths:
      - scripts/lib/sitewide-header-template.mjs
      - scripts/apply-sitewide-header.mjs
      - .github/workflows/build-dtfseeds-public-suite.yml
      - .github/workflows/deploy-sitewide-header-static-surfaces.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: dtf-sitewide-header-static-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical header deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lib/sitewide-header-template.mjs
          node --check scripts/apply-sitewide-header.mjs
          grep -Fq 'Apply approved sitewide header to release HTML' .github/workflows/build-dtfseeds-public-suite.yml
          grep -Fq 'data-dtf-sitewide-header="approved-reference-v1"' scripts/lib/sitewide-header-template.mjs

  dispatch-production:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical public-suite production deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-public-suite-wordpress-v2.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Dispatched Deploy DTFSeeds Public Suite via WordPress V2 from the merged header source.'
