name: Deploy Sitewide Header Static Surfaces

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/lib/sitewide-header-template.mjs
      - scripts/lib/sitewide-header-template-v6.mjs
      - scripts/lib/sitewide-content-density-v1.mjs
      - scripts/lib/sitewide-visual-repair-v2.mjs
      - scripts/apply-sitewide-header.mjs
      - scripts/verify-responsive-layout-live.mjs
      - scripts/verify-wordpress-owned-route-preservation.mjs
      - site/wordpress/assets/responsive-layout-v1.css
      - site/wordpress/assets/sitewide-ux-polish-v1.css
      - .github/workflows/build-dtfseeds-public-suite.yml
      - .github/workflows/deploy-sitewide-header-static-surfaces.yml
  pull_request:
    paths:
      - scripts/lib/sitewide-header-template.mjs
      - scripts/lib/sitewide-header-template-v6.mjs
      - scripts/lib/sitewide-content-density-v1.mjs
      - scripts/lib/sitewide-visual-repair-v2.mjs
      - scripts/apply-sitewide-header.mjs
      - scripts/verify-responsive-layout-live.mjs
      - scripts/verify-wordpress-owned-route-preservation.mjs
      - site/wordpress/assets/responsive-layout-v1.css
      - site/wordpress/assets/sitewide-ux-polish-v1.css
      - .github/workflows/build-dtfseeds-public-suite.yml
      - .github/workflows/deploy-sitewide-header-static-surfaces.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: dtf-sitewide-header-static-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical V6 header, responsive layout, UX polish, and visual repair inputs
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lib/sitewide-header-template-v6.mjs
          node --check scripts/lib/sitewide-content-density-v1.mjs
          node --check scripts/lib/sitewide-visual-repair-v2.mjs
          node --check scripts/apply-sitewide-header.mjs
          node --check scripts/verify-responsive-layout-live.mjs
          node --check scripts/verify-wordpress-owned-route-preservation.mjs
          test -s site/wordpress/assets/responsive-layout-v1.css
          test -s site/wordpress/assets/sitewide-ux-polish-v1.css
          grep -Fq 'Apply approved sitewide header to release HTML' .github/workflows/build-dtfseeds-public-suite.yml
          grep -Fq 'data-dtf-sitewide-header="canonical-eight-v1"' scripts/lib/sitewide-header-template-v6.mjs
          for required in '>Home</a>' '>Seeds</a>' '>Learn</a>' '>Courses</a>' '>Diagnostic</a>' '>Games</a>' '>Community</a>' '>Shop</a>'; do
            grep -Fq "$required" scripts/lib/sitewide-header-template-v6.mjs || { echo "Missing canonical nav label: $required" >&2; exit 1; }
          done
          ! grep -Fq '>Genetics</a>' scripts/lib/sitewide-header-template-v6.mjs
          ! grep -Fq '>Tools</a>' scripts/lib/sitewide-header-template-v6.mjs
          grep -Fq 'dtf-content-density-v1-style' scripts/lib/sitewide-content-density-v1.mjs
          grep -Fq 'dtf-sitewide-visual-repair-v2-style' scripts/lib/sitewide-visual-repair-v2.mjs
          grep -Fq 'dtf-sitewide-visual-repair-v2-script' scripts/lib/sitewide-visual-repair-v2.mjs
          grep -Fq 'dtf-responsive-layout-v1' scripts/apply-sitewide-header.mjs
          grep -Fq 'dtf-sitewide-ux-polish-v1' scripts/apply-sitewide-header.mjs
          grep -Fq 'dtf-sitewide-visual-repair-v2-style' scripts/apply-sitewide-header.mjs
          grep -Fq 'dtf-sitewide-visual-repair-v2-script' scripts/apply-sitewide-header.mjs
          grep -Fq 'id="dtf-visual-system-v2"' scripts/verify-wordpress-owned-route-preservation.mjs
          grep -Fq 'Genetics first. Cultivation science behind it.' scripts/verify-wordpress-owned-route-preservation.mjs
          grep -Fq '@media (min-width:701px) and (max-width:1120px)' site/wordpress/assets/responsive-layout-v1.css
          grep -Fq '@media (max-width:700px)' site/wordpress/assets/responsive-layout-v1.css
          grep -Fq 'scroll-snap-type:x proximity' site/wordpress/assets/responsive-layout-v1.css
          grep -Fq -- '--dtf-global-header-height:92px' site/wordpress/assets/responsive-layout-v1.css
          grep -Fq '.high-iq-shell .quiz-scoreboard{top:calc(var(--dtf-global-header-height) + 8px)!important}' site/wordpress/assets/responsive-layout-v1.css
          grep -Fq 'DTFSeeds sitewide UX polish v1' site/wordpress/assets/sitewide-ux-polish-v1.css
          grep -Fq 'scroll-padding-top:' site/wordpress/assets/sitewide-ux-polish-v1.css
          grep -Fq ':focus-visible' site/wordpress/assets/sitewide-ux-polish-v1.css
          grep -Fq 'min-height:44px' site/wordpress/assets/sitewide-ux-polish-v1.css
          grep -Fq 'overscroll-behavior:contain' site/wordpress/assets/sitewide-ux-polish-v1.css

  dispatch-production:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dispatch canonical public-suite production deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-public-suite-wordpress-v2.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Dispatched Deploy DTFSeeds Public Suite via WordPress V2 from the merged V6 header/responsive/UX/visual-repair source.'
      - name: Wait for visitor-facing responsive shell and UX polish across primary navigation
        shell: bash
        env:
          WP_SITE_URL: https://dtfseeds.com
          RESPONSIVE_LAYOUT_VERIFY_ROUTES: /,/seeds/,/learn/,/courses/,/tools/,/games/,/community/,/shop/,/games/high-iq/
          RESPONSIVE_LAYOUT_VERIFY_ATTEMPTS: '150'
          RESPONSIVE_LAYOUT_VERIFY_PAUSE_MS: '10000'
        run: |
          set -euo pipefail
          node scripts/verify-responsive-layout-live.mjs