name: Publish Water Root Zone V6 Final

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/wordpress/education/water-root-zone-v6.json'
      - 'scripts/publish-wordpress-water-root-zone-v6-final.mjs'
      - '.github/workflows/wordpress-water-root-zone-v6-final.yml'
  workflow_run:
    workflows:
      - Enhance DTFSeeds Education V4
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-water-root-zone-v6-final
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  publish:
    name: Publish complete Water and Root Zone curriculum
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_WATER_ROOT_ZONE_V6: 'true'
      WATER_ROOT_ZONE_V6_PATH: site/wordpress/education/water-root-zone-v6.json
      BACKUP_ROOT: /tmp/dtf-water-root-zone-v6-final

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Water Root Zone V6 package
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/publish-wordpress-water-root-zone-v6-final.mjs
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('site/wordpress/education/water-root-zone-v6.json','utf8'));
          const lessons=(c.chapters||[]).reduce((n,x)=>n+(x.lessons||[]).length,0);
          if(c.id!=='water-root-zone-v6'||c.chapters?.length!==8||lessons!==32) throw new Error('Water Root Zone package shape changed unexpectedly.');
          if((c.chapters||[]).some(x=>(x.lessons||[]).length!==4)) throw new Error('Every Water Root Zone chapter must contain four focused lessons.');
          const ids=c.chapters.map(x=>x.id);
          if(new Set(ids).size!==8) throw new Error('Chapter IDs must be unique.');
          const refs=[...new Set(c.chapters.flatMap(x=>x.encyclopediaIds||[]))];
          const invalid=refs.filter(id=>{const n=Number(String(id).slice(-3));return !((n>=41&&n<=60)||(n>=81&&n<=100)||(n>=121&&n<=140));});
          if(invalid.length) throw new Error(`Water Root Zone V6 references are outside controlled Part 3/5/7 boundaries: ${invalid.join(', ')}`);
          console.log(`Validated Water Root Zone chapter IDs: ${ids.join(', ')}`);
          console.log(`Controlled reference IDs: ${refs.join(', ')}`);
          NODE

      - name: Publish and verify Water Root Zone V6
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/publish-wordpress-water-root-zone-v6-final.mjs | tee "$RUNNER_TEMP/water-root-zone-v6-final.log"
          report="$BACKUP_ROOT/report.json"
          test -s "$report"
          echo "chapters=$(node -p "require(process.argv[1]).chapters" "$report")" >> "$GITHUB_OUTPUT"
          echo "lessons=$(node -p "require(process.argv[1]).lessons" "$report")" >> "$GITHUB_OUTPUT"
          echo "references=$(node -p "require(process.argv[1]).publishedReferencePages" "$report")" >> "$GITHUB_OUTPUT"
          echo "visuals=$(node -p "require(process.argv[1]).visualTargets" "$report")" >> "$GITHUB_OUTPUT"

      - name: Independently verify stable Water Root Zone chapter IDs
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/water-root-zone-final.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "$WP_SITE_URL/learn/water-root-zone/?dtf_wr6_final_verify=${GITHUB_RUN_ID}-${attempt}" --output "$body"
            if grep -Fqi 'data-dtf-water-root-zone-v6="true"' "$body"; then ok=1; break; fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]]
          [[ "$(grep -Fo 'data-wr6-chapter=' "$body" | wc -l | tr -d ' ')" = '8' ]]
          [[ "$(grep -Fo 'class="wr6-lesson"' "$body" | wc -l | tr -d ' ')" = '32' ]]
          for id in root-interface-water-uptake oxygen-air-water-balance media-physical-storage irrigation-volume-uniformity dryback-water-stress runoff-salts-ec ph-alkalinity-water-chemistry sampling-records-change-control; do
            grep -Fqi "data-wr6-chapter=\"$id\"" "$body"
          done
          grep -Fqi 'data-dtf-topic="water-root-zone"' "$body"
          grep -Fqi 'data-dtf-learning-v4="topic-water-root-zone"' "$body"

      - name: Upload Water Root Zone V6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-root-zone-v6-final-${{ github.run_id }}
          path: |
            /tmp/dtf-water-root-zone-v6-final
            ${{ runner.temp }}/water-root-zone-v6-final.log
            ${{ runner.temp }}/water-root-zone-final.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report Water Root Zone V6 result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          VALIDATE: ${{ steps.validate.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          CHAPTERS: ${{ steps.publish.outputs.chapters }}
          LESSONS: ${{ steps.publish.outputs.lessons }}
          REFERENCES: ${{ steps.publish.outputs.references }}
          VISUALS: ${{ steps.publish.outputs.visuals }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body:[
              '## Water & Root Zone V6 final curriculum','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `Package validation: **${process.env.VALIDATE || 'not-run'}**`,
              `WordPress publication: **${process.env.PUBLISH || 'not-run'}**`,
              `Visitor verification: **${process.env.VERIFY || 'not-run'}**`,
              `Chapters: **${process.env.CHAPTERS || '0'}**`,
              `Focused lessons: **${process.env.LESSONS || '0'}**`,
              `Direct controlled root/water/chemistry encyclopedia references currently public: **${process.env.REFERENCES || '0'}**`,
              `Defined visual study targets: **${process.env.VISUALS || '0'}**`,'',
              'The publisher is fail-closed: it requires the existing V3 Water & Root Zone topic owner and V4 guided-learning marker, limits references to controlled encyclopedia Parts 3, 5 and 7, stores rollback evidence, and restores the prior page if edit-context or visitor verification fails. The curriculum intentionally does not publish one universal runoff percentage, dryback target, irrigation frequency, pH decimal or EC recipe.'
            ].join('\n')});
