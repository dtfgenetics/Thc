name: Bootstrap Exact Strain Card Web Assets

on:
  push:
    branches: [main]
    paths:
      - '.tmp/strain-card-b64/**'
      - '.github/workflows/bootstrap-strain-card-assets.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: dtf-strain-card-asset-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ hashFiles('.tmp/strain-card-b64/**') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify exact strain card web derivatives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/wordpress/assets/genetics
          reconstruct() {
            key="$1"; target="$2"; expected_bytes="$3"; expected_sha="$4"
            cat ".tmp/strain-card-b64/${key}/"*.txt | base64 -d > "$target"
            actual_bytes="$(stat -c %s "$target")"
            actual_sha="$(sha256sum "$target" | awk '{print $1}')"
            test "$actual_bytes" = "$expected_bytes"
            test "$actual_sha" = "$expected_sha"
            python3 - "$target" <<'PY'
          import pathlib,sys
          b=pathlib.Path(sys.argv[1]).read_bytes()
          assert b[:3] == b'\xff\xd8\xff', 'not a JPEG'
          assert b[-2:] == b'\xff\xd9', 'JPEG end marker missing'
          PY
          }
          reconstruct blue-mango-f2-regular-strain-card site/wordpress/assets/genetics/blue-mango-f2-regular-strain-card.jpg 148419 faf3fb47b47248ba94c1f62b714c99071966e1c367022275f6f3f5f2670e0591
          reconstruct blue-mango-f2-feminized-strain-card site/wordpress/assets/genetics/blue-mango-f2-feminized-strain-card.jpg 145734 98ae81732a01b44e96720fd0ad386144efa8710eebb1b32155b5dacacad7e421
          reconstruct blue-bubblegum-f1-regular-strain-card site/wordpress/assets/genetics/blue-bubblegum-f1-regular-strain-card.jpg 146868 7ea5edaae9830e4f93a540458dc8402e0f1909f360be9b2d10dc3c818f90426e

      - name: Commit permanent binary assets and remove staging chunks
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .tmp/strain-card-b64
          git add site/wordpress/assets/genetics/*.jpg
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Materialize exact strain card web assets'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report asset bootstrap
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Exact DTF strain card web assets',
                '',
                `Bootstrap run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.STATUS}**`,
                `Permanent binary asset commit created: **${process.env.CHANGED || 'false'}**`,
                process.env.COMMIT_SHA ? `Asset commit: \`${process.env.COMMIT_SHA}\`` : '',
                '',
                'Assets: Blue Mango F2 Regular, Blue Mango F2 Feminized, and Blue Bubblegum F1 Regular. These are web-optimized derivatives of the exact previously-created strain cards; full-resolution controlled masters remain in Drive.'
              ].filter(Boolean).join('\n')
            });
