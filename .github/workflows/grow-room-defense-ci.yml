name: Grow Room Defense CI

on:
  push:
    branches: [main]
    paths:
      - games/grow-room-defense/**
      - site/public-route-patch/games/grow-room-defense/**
      - .github/workflows/grow-room-defense-ci.yml
  pull_request:
    branches: [main]
    paths:
      - games/grow-room-defense/**
      - site/public-route-patch/games/grow-room-defense/**
      - .github/workflows/grow-room-defense-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate IPM game data and public copy
        run: node games/grow-room-defense/scripts/validate-data.mjs

      - name: Run deterministic defense engine tests
        run: node games/grow-room-defense/test/engine.test.mjs

      - name: Test self-contained public runtime
        run: node games/grow-room-defense/test/public-runtime.test.mjs

      - name: Validate browser JavaScript syntax
        run: |
          node --check site/public-route-patch/games/grow-room-defense/app.js
          node --check site/public-route-patch/games/grow-room-defense/engine.mjs
          node --check site/public-route-patch/games/grow-room-defense/runtime.mjs

      - name: Verify canonical and public engine match
        run: cmp games/grow-room-defense/src/engine.mjs site/public-route-patch/games/grow-room-defense/engine.mjs

      - name: Verify route, asset and interaction contracts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('site/public-route-patch/games/grow-room-defense/index.html','utf8');
          const css = fs.readFileSync('site/public-route-patch/games/grow-room-defense/grow-room-defense.css','utf8');
          const app = fs.readFileSync('site/public-route-patch/games/grow-room-defense/app.js','utf8');
          const runtime = fs.readFileSync('site/public-route-patch/games/grow-room-defense/runtime.mjs','utf8');
          const requireText = (source, text, label) => {
            if (!source.includes(text)) throw new Error(`missing ${label}: ${text}`);
          };
          requireText(html, '<link rel="canonical" href="https://dtfseeds.com/games/grow-room-defense/">', 'canonical route');
          requireText(html, 'id="grow-room-defense-data"', 'embedded IPM data');
          requireText(html, '<script src="./app.js" defer></script>', 'classic deferred entrypoint');
          requireText(html, 'Education boundary:', 'education boundary');
          requireText(runtime, 'expected three plant benches', 'lane contract');
          requireText(runtime, 'expected eight pressure types', 'threat contract');
          requireText(runtime, 'expected seven IPM tools', 'tool contract');
          requireText(runtime, 'class="plant-art"', 'CSS plant renderer');
          requireText(runtime, 'function renderThreat(active, laneId, tool, laneAlive)', 'dead bench targeting guard');
          requireText(runtime, "const laneAlive = lane.health > 0", 'lane health targetability');
          requireText(css, '.plant-art', 'plant asset styles');
          requireText(css, '@media(prefers-reduced-motion:reduce)', 'reduced-motion support');
          if (html.includes('type="module"')) throw new Error('Grow Room Defense must not depend on module MIME handling');
          if (runtime.includes("fetch('./data/ipm.json'")) throw new Error('Grow Room Defense must not fetch IPM data at runtime');
          if (runtime.includes('ui.code.disabled')) throw new Error('replay code input must remain available after game over');
          NODE

      - name: Verify truthful release boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const game = JSON.parse(fs.readFileSync('games/grow-room-defense/game.json','utf8'));
          if (game.status !== 'browser-vertical-slice') throw new Error('unexpected game status');
          if (game.route !== '/games/grow-room-defense/') throw new Error('unexpected route');
          if (game.releaseGates.rulesTested !== true) throw new Error('deterministic rules suite must be recorded as tested');
          if (game.releaseGates.deploymentRegistered !== true) throw new Error('deploymentRegistered must stay true once the game is registered in the DTFSeeds public app contract');
          if (game.releaseGates.browserTested !== false) throw new Error('browserTested must remain false until browser QA is actually completed');
          if (game.releaseGates.mobileTested !== false) throw new Error('mobileTested must remain false until mobile QA is actually completed');
          if (game.releaseGates.accessibilityReviewed !== false) throw new Error('accessibilityReviewed must remain false until a review is actually completed');
          NODE
