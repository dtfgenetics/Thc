name: Purge Hostinger Cache Through WordPress MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/flush-hostinger-litespeed-mcp.mjs
      - scripts/verify-public-sales-hold-after-cache.mjs
      - scripts/verify-public-sales-hold-after-cache.test.mjs
      - .github/workflows/hostinger-mcp-cache-flush.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-hostinger-mcp-cache-flush
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Purge LiteSpeed through authenticated Hostinger MCP
        id: purge
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/flush-hostinger-litespeed-mcp.mjs
          node scripts/flush-hostinger-litespeed-mcp.mjs

      - name: Test public sales-hold verifier
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/verify-public-sales-hold-after-cache.test.mjs

      - name: Verify plain and cache-busted public sales-hold pages
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-public-sales-hold-after-cache.mjs

      - name: Report cache repair result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          PURGE_OUTCOME: ${{ steps.purge.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Hostinger MCP cache repair',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.JOB_STATUS}**`,
                `LiteSpeed purge: **${process.env.PURGE_OUTCOME || 'not-run'}**`,
                `Public WordPress verification: **${process.env.VERIFY_OUTCOME || 'not-run'}**`,
                '',
                'This uses the existing authenticated Hostinger WordPress MCP capability to purge LSCache, CSS/JS cache, localized resources, object cache, and opcache. It does not use SSH.'
              ].join('\n')
            });

