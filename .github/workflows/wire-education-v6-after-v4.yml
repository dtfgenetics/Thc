name: Wire V6 Education After V4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/wire-education-v6-after-v4.mjs'
      - '.github/workflows/wire-education-v6-after-v4.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: dtf-wire-v6-after-v4
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply education ownership-chain repair
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/wire-education-v6-after-v4.mjs | tee "$RUNNER_TEMP/v6-after-v4-${attempt}.json"
            grep -Fq 'Enhance DTFSeeds Education V4' .github/workflows/core-gaps-v6-route-repair.yml
            grep -Fq 'Enhance DTFSeeds Education V4' .github/workflows/wordpress-harvest-outdoor-v6-production.yml
            grep -Fq 'Canonical education owner chain: V3 -> V4 -> subject V6 finalizers' .github/workflows/wordpress-learning-experience-v3-production.yml
            if git diff --quiet -- .github/workflows/core-gaps-v6-route-repair.yml .github/workflows/wordpress-harvest-outdoor-v6-production.yml .github/workflows/wordpress-learning-experience-v3-production.yml; then
              pushed=1
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              break
            fi
            git add .github/workflows/core-gaps-v6-route-repair.yml .github/workflows/wordpress-harvest-outdoor-v6-production.yml .github/workflows/wordpress-learning-experience-v3-production.yml
            git commit -m 'Wire V6 education finalizers after V4'
            if git push origin HEAD:main; then
              pushed=1
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              break
            fi
            sleep $((attempt * 3))
          done
          [[ "$pushed" -eq 1 ]]
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report ownership-chain repair
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          CHANGED: ${{ steps.patch.outputs.changed }}
          HEAD: ${{ steps.patch.outputs.head }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body:[
              '## Education V3 → V4 → V6 owner-chain repair','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `Repository workflows changed: **${process.env.CHANGED || 'false'}**`,
              `Repository head: \`${process.env.HEAD || 'unknown'}\``,'',
              'Core Plant Health/Genetics/Evidence and Harvest/Outdoor finalizers are now subscribed to successful V4 completion. The V3 workflow was intentionally touched to trigger one clean owner-chain rebuild. Failed V4 runs do not publish downstream V6 layers.'
            ].join('\n')});
