name: Normalize DTF Editorial WordPress Page Titles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize-wordpress-premium-page-titles.mjs'
      - 'scripts/wordpress-transient-fetch-bootstrap.mjs'
      - 'site/wordpress/pages/community.html'
      - 'site/wordpress/pages/gallery.html'
      - '.github/workflows/wordpress-premium-title-normalization.yml'
  workflow_run:
    workflows:
      - Publish DTFSeeds WordPress Production
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dtfseeds-editorial-wordpress-title-normalization
  cancel-in-progress: false

jobs:
  normalize:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      BACKUP_ROOT: /tmp/wordpress-premium-title-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate title normalizer
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/normalize-wordpress-premium-page-titles.mjs
          node --check scripts/wordpress-transient-fetch-bootstrap.mjs
          test -s site/wordpress/pages/community.html
          test -s site/wordpress/pages/gallery.html
      - name: Normalize editorial page title hierarchies
        id: normalize
        shell: bash
        env:
          APPLY_PREMIUM_TITLE_NORMALIZATION: 'true'
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-transient-fetch-bootstrap.mjs scripts/normalize-wordpress-premium-page-titles.mjs | tee "$RUNNER_TEMP/premium-title-result.json"
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Verify live editorial pages retain canonical hero and suppression CSS
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          canonical_h1(){
            node - "$1" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          const html = fs.readFileSync(file, 'utf8');
          const match = html.match(/<h1\b[^>]*>([\s\S]*?)<\/h1>/i);
          if (!match) process.exit(2);
          const marker = match[1]
            .replace(/<[^>]+>/g, ' ')
            .replace(/&nbsp;/gi, ' ')
            .replace(/&amp;/gi, '&')
            .replace(/&quot;/gi, '"')
            .replace(/&#39;/g, "'")
            .replace(/\s+/g, ' ')
            .trim();
          if (!marker) process.exit(3);
          process.stdout.write(marker);
          NODE
          }
          verify(){
            path="$1"; marker="$2"; body="$RUNNER_TEMP/title-$(echo "$path"|tr '/' '_').html"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
                "$WP_SITE_URL${path}?dtf_title_verify=${GITHUB_RUN_ID}-${attempt}" -o "$body"
              if grep -Fqi "$marker" "$body" && grep -Fqi 'dtf-premium-theme-title-suppression' "$body"; then ok=1; break; fi
              sleep 5
            done
            [[ "$ok" -eq 1 ]] || { echo "Editorial title normalization not visible on $path using canonical marker: $marker" >&2; exit 1; }
          }
          community_marker="$(canonical_h1 site/wordpress/pages/community.html)"
          gallery_marker="$(canonical_h1 site/wordpress/pages/gallery.html)"
          verify '/community/' "$community_marker"
          verify '/gallery/' "$gallery_marker"
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Upload page snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-editorial-title-normalization-${{ github.run_id }}
          path: /tmp/wordpress-premium-title-backups
          if-no-files-found: warn
          retention-days: 30
      - name: Publish title hierarchy summary
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
          NORMALIZE: ${{ steps.normalize.outputs.outcome }}
          VERIFY: ${{ steps.verify.outputs.outcome }}
        run: |
          {
            echo '## Editorial WordPress page-title hierarchy'
            echo
            echo "Result: **${STATUS}**"
            echo "Scoped normalization: **${NORMALIZE:-not-completed}**"
            echo "Live verification: **${VERIFY:-not-completed}**"
            echo
            echo 'Community and Gallery are validated against the H1 in their current canonical page files, so normal copy updates do not require a second hard-coded workflow-marker edit.'
          } >> "$GITHUB_STEP_SUMMARY"
