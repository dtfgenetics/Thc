name: Normalize DTF Editorial WordPress Page Titles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize-wordpress-premium-page-titles.mjs'
      - 'scripts/wordpress-transient-fetch-bootstrap.mjs'
      - '.github/workflows/wordpress-premium-title-normalization.yml'
  workflow_run:
    workflows:
      - Publish DTFSeeds WordPress Production
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-editorial-wordpress-title-normalization
  cancel-in-progress: false

jobs:
  normalize:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      BACKUP_ROOT: /tmp/wordpress-premium-title-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate title normalizer
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/normalize-wordpress-premium-page-titles.mjs
          node --check scripts/wordpress-transient-fetch-bootstrap.mjs
      - name: Normalize editorial page title hierarchies
        id: normalize
        shell: bash
        env:
          APPLY_PREMIUM_TITLE_NORMALIZATION: 'true'
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-transient-fetch-bootstrap.mjs scripts/normalize-wordpress-premium-page-titles.mjs | tee "$RUNNER_TEMP/premium-title-result.json"
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Verify live editorial pages retain designed hero and suppression CSS
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          verify(){
            path="$1"; marker_a="$2"; marker_b="${3:-}"; body="$RUNNER_TEMP/title-$(echo "$path"|tr '/' '_').html"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
                "$WP_SITE_URL${path}?dtf_title_verify=${GITHUB_RUN_ID}-${attempt}" -o "$body"
              marker_ok=0
              if grep -Fqi "$marker_a" "$body"; then marker_ok=1; fi
              if [[ "$marker_ok" -eq 0 && -n "$marker_b" ]] && grep -Fqi "$marker_b" "$body"; then marker_ok=1; fi
              if [[ "$marker_ok" -eq 1 ]] && grep -Fqi 'dtf-premium-theme-title-suppression' "$body"; then ok=1; break; fi
              sleep 5
            done
            [[ "$ok" -eq 1 ]] || { echo "Editorial title normalization not visible on $path" >&2; exit 1; }
          }
          verify '/community/' 'Grow together. Learn together. Build together.'
          verify '/gallery/' 'DTF Visual Library' 'See the plant science, genetics, tools, games, and community work.'
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Upload page snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-editorial-title-normalization-${{ github.run_id }}
          path: /tmp/wordpress-premium-title-backups
          if-no-files-found: warn
          retention-days: 30
      - name: Report title hierarchy normalization
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          NORMALIZE: ${{ steps.normalize.outputs.outcome }}
          VERIFY: ${{ steps.verify.outputs.outcome }}
        with:
          script: |
            const body = [
              '## Editorial WordPress page-title hierarchy',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `Scoped normalization: **${process.env.NORMALIZE || 'not-completed'}**`,
              `Live verification: **${process.env.VERIFY || 'not-completed'}**`,
              '',
              'Scope is intentionally limited to Community and Gallery. V3 owns Home/Learn and V4 owns Genetics/Shop, so this workflow no longer rewrites pages controlled by those visual systems.'
            ].join('\n');
            try {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 220, body });
            } catch (error) {
              core.warning(`Editorial-title advisory report could not be posted: ${error.message}`);
            }
