name: Trichome Trials CI

on:
  pull_request:
    branches: [main]
    paths:
      - games/trichome-trials/**
      - site/public-route-patch/games/trichome-trials/**
      - .github/workflows/trichome-trials-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate judging deck and split public packs
        run: node games/trichome-trials/scripts/validate-data.mjs

      - name: Run deterministic judging engine tests
        run: node games/trichome-trials/test/engine.test.mjs

      - name: Run confidence-call scoring tests
        run: node games/trichome-trials/test/confidence.test.mjs

      - name: Run production runtime and scorecard UX regression tests
        run: node games/trichome-trials/test/public-runtime.test.mjs

      - name: Validate browser JavaScript syntax
        run: |
          node --check site/public-route-patch/games/trichome-trials/app.js
          node --check site/public-route-patch/games/trichome-trials/engine.mjs
          node --check site/public-route-patch/games/trichome-trials/confidence.mjs

      - name: Verify canonical and public rules modules match
        run: |
          cmp games/trichome-trials/src/engine.mjs site/public-route-patch/games/trichome-trials/engine.mjs
          cmp games/trichome-trials/src/confidence.mjs site/public-route-patch/games/trichome-trials/confidence.mjs

      - name: Verify route, scorecard and visual asset contracts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('site/public-route-patch/games/trichome-trials/index.html','utf8');
          const css = fs.readFileSync('site/public-route-patch/games/trichome-trials/trichome-trials.css','utf8');
          const frost = fs.readFileSync('site/public-route-patch/games/trichome-trials/frost-layout.css','utf8');
          const confidence = fs.readFileSync('site/public-route-patch/games/trichome-trials/confidence.css','utf8');
          const visual = fs.readFileSync('site/public-route-patch/games/trichome-trials/trichome-trials-v2.css','utf8');
          const app = fs.readFileSync('site/public-route-patch/games/trichome-trials/app.js','utf8');
          const requireText = (source, text, label) => {
            if (!source.includes(text)) throw new Error(`missing ${label}: ${text}`);
          };
          requireText(html, '<link rel="canonical" href="https://dtfseeds.com/games/trichome-trials/">', 'canonical route');
          requireText(html, '<link rel="stylesheet" href="./frost-layout.css">', 'frost layout asset');
          requireText(html, '<link rel="stylesheet" href="./confidence.css">', 'confidence style asset');
          requireText(html, 'trichome-trials-v2.css', 'scorecard visual layer');
          requireText(html, 'Confidence calls:', 'confidence instructions');
          requireText(html, '<script defer src="./app.js"></script>', 'classic deferred entrypoint');
          requireText(html, 'id="trichome-trials-data"', 'embedded canonical judging data');
          requireText(html, 'Game boundary:', 'fictional content boundary');
          requireText(app, 'MAX_CONFIDENCE_CALLS', 'confidence call limit');
          requireText(app, 'submitConfidentScorecard(', 'confidence scorer usage');
          requireText(app, 'let touchedIds = new Set();', 'reviewed-category gate');
          requireText(app, 'button[data-score-step][data-category]', 'tap score stepper');
          requireText(app, 'ui.submit.disabled = !judging || !allReviewed', 'complete scorecard submit gate');
          requireText(app, 'payload?.roundsPerRun !== 5', 'five-round browser contract');
          requireText(app, 'payload?.categories?.length !== 7', 'seven-category browser contract');
          requireText(app, 'payload?.entries?.length !== 12', '12-entry browser contract');
          requireText(app, 'type="range" min="1" max="10" step="1"', '1–10 score control');
          requireText(css, '.sample-visual', 'fictional sample artwork');
          requireText(css, '.loupe', 'loupe artwork');
          requireText(css, '.accuracy-ring', 'accuracy meter artwork');
          requireText(frost, '.frost-field i:nth-child(28)', 'full frost placement map');
          requireText(confidence, '.confidence-button[aria-pressed="true"]', 'confidence selected state');
          requireText(confidence, '.confidence-chip', 'confidence review marker');
          requireText(visual, '.score-stepper', 'mobile score stepper styles');
          requireText(visual, '.score-row.unreviewed', 'unreviewed score state');
          requireText(visual, '@media(max-width:640px)', 'mobile layout');
          requireText(visual, '@media(prefers-reduced-motion:reduce)', 'reduced-motion support');
          if (/^\s*import\s/m.test(app)) throw new Error('public runtime regressed to browser module imports');
          if (/fetch\s*\(/.test(app)) throw new Error('public runtime regressed to browser-time JSON fetch');
          if (/CSS\.escape/.test(app)) throw new Error('public runtime regressed to CSS.escape dependency');
          NODE

      - name: Verify truthful release boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const game = JSON.parse(fs.readFileSync('games/trichome-trials/game.json','utf8'));
          if (game.status !== 'browser-vertical-slice') throw new Error('unexpected game status');
          if (game.route !== '/games/trichome-trials/') throw new Error('unexpected route');
          if (game.releaseGates.rulesTested !== true) throw new Error('deterministic rules suite must be recorded as tested');
          if (game.releaseGates.browserTested !== false) throw new Error('browserTested must remain false until browser QA is actually completed');
          if (game.releaseGates.mobileTested !== false) throw new Error('mobileTested must remain false until mobile QA is actually completed');
          if (game.releaseGates.accessibilityReviewed !== false) throw new Error('accessibilityReviewed must remain false until review is actually completed');
          if (game.releaseGates.deploymentRegistered !== true) throw new Error('deploymentRegistered must stay true once the game is registered in the DTFSeeds public app contract');
          NODE
