name: Deploy DTFSeeds Suite to Hostinger over SSH

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful Build DTFSeeds Public Suite run ID. Leave blank to use the latest successful main run."
        required: false
        type: string
      scope:
        description: "Production overlay to deploy"
        required: true
        default: games
        type: choice
        options:
          - games
          - public-suite
      confirm:
        description: "Type DEPLOY to allow production mutation"
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/deploy-dtfseeds-hostinger-ssh.yml
      - docs/DTFSEEDS_HOSTINGER_SSH_DEPLOY.md

permissions:
  contents: read
  actions: read

concurrency:
  group: dtfseeds-hostinger-production
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment contract
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/build-dtfseeds-public-suite.yml
          test -s .github/workflows/deploy-dtfseeds-hostinger-ssh.yml
          grep -Fq 'Upload public suite artifact' .github/workflows/build-dtfseeds-public-suite.yml
          grep -Fq 'dtfseeds-public-suite-' .github/workflows/build-dtfseeds-public-suite.yml
          grep -Fq '/games/bud-or-bluff/' site/public-route-patch/games/bud-or-bluff/index.html
          grep -Fq '25 playable browser games' site/public-route-patch/games/index.html

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require explicit production confirmation
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo 'Production deployment refused: confirm input must be exactly DEPLOY.' >&2
            exit 1
          fi

      - name: Resolve validated public-suite build
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_RUN" ]; then
            run_id="$REQUESTED_RUN"
          else
            run_id="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/build-dtfseeds-public-suite.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].id')"
          fi

          test -n "$run_id"
          conclusion="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')"
          event="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.event')"
          head_branch="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.head_branch')"
          head_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.head_sha')"
          workflow_name="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.name')"

          if [ "$workflow_name" != 'Build DTFSeeds Public Suite' ] || [ "$conclusion" != 'success' ] || [ "$head_branch" != 'main' ]; then
            echo "Refusing deploy: run ${run_id} is not a successful Build DTFSeeds Public Suite run from main." >&2
            echo "name=${workflow_name} conclusion=${conclusion} event=${event} branch=${head_branch} sha=${head_sha}" >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Download immutable public-suite artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: dtfseeds-public-suite-*
          path: release
          merge-multiple: true

      - name: Validate downloaded release before transport
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          required=(
            release/dtf-build.json
            release/games/index.html
            release/games/bud-or-bluff/index.html
            release/games/bud-or-bluff/app-v2.js
            release/games/bud-or-bluff/api-v2.php
            release/games/high-iq/index.html
            release/games/high-land/index.html
            release/games/weedopolis/index.html
          )
          for file in "${required[@]}"; do test -s "$file"; done
          grep -Fq '25 playable browser games' release/games/index.html
          grep -Fq '/games/bud-or-bluff/' release/games/bud-or-bluff/index.html
          grep -Fq "\"master\": \"$SOURCE_SHA\"" release/dtf-build.json

      - name: Check Hostinger SSH configuration
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          PUBLIC_ROOT: ${{ secrets.HOSTINGER_PUBLIC_ROOT }}
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS PUBLIC_ROOT; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: ${name/HOSTINGER_/HOSTINGER_}" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'Hostinger deployment path is installed, but production credentials are not configured.' >&2
            exit 1
          fi

      - name: Prepare SSH transport
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/dtf_hostinger"
          chmod 600 "$HOME/.ssh/dtf_hostinger"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build scoped deployment payload
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          rm -rf payload
          mkdir -p payload

          if [ "$SCOPE" = 'games' ]; then
            cp -a release/games payload/games
            cp -a release/dtf-build.json payload/dtf-build.json
          elif [ "$SCOPE" = 'public-suite' ]; then
            allowed=(
              assets
              atlas
              blog
              explore-dtf-genetics-your-destination-for-cannabis-themed-apparel-and-art
              exploring-dtf-genetics-a-hub-for-cannabis-art-and-gardening-tools
              games
              learn
              projects
              tools
              growlens
              thc-grow-doc
              puzzles
              dtf-build.json
            )
            for item in "${allowed[@]}"; do
              if [ -e "release/$item" ]; then cp -a "release/$item" payload/; fi
            done
          else
            echo "Unknown deploy scope: $SCOPE" >&2
            exit 1
          fi

          test -s payload/games/index.html
          test -s payload/games/bud-or-bluff/index.html
          printf '%s\n' "$SOURCE_SHA" > payload/.dtf-source-sha
          tar -C payload -czf "dtfseeds-${SOURCE_SHA}.tgz" .

      - name: Upload release archive to Hostinger
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-65002}"
          ssh_opts=(-i "$HOME/.ssh/dtf_hostinger" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" 'mkdir -p "$HOME/.dtf-deploy/incoming"'
          scp -i "$HOME/.ssh/dtf_hostinger" -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "dtfseeds-${SOURCE_SHA}.tgz" \
            "$SSH_USER@$SSH_HOST:.dtf-deploy/incoming/dtfseeds-${SOURCE_SHA}.tgz"

      - name: Back up current routes and activate release
        id: activate
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          PUBLIC_ROOT: ${{ secrets.HOSTINGER_PUBLIC_ROOT }}
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-65002}"
          ssh_opts=(-i "$HOME/.ssh/dtf_hostinger" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote_cmd="$(printf 'bash -s -- %q %q %q' "$PUBLIC_ROOT" "$SOURCE_SHA" "$SCOPE")"

          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "$remote_cmd" <<'REMOTE'
          set -euo pipefail
          public_root="${1%/}"
          source_sha="$2"
          scope="$3"
          incoming="$HOME/.dtf-deploy/incoming/dtfseeds-${source_sha}.tgz"
          deploy_root="$HOME/.dtf-deploy"
          stage_parent="$(dirname "$public_root")"
          stage="$stage_parent/.dtf-stage-${source_sha}"
          backup_id="$(date -u +%Y%m%dT%H%M%SZ)-${source_sha:0:12}-${scope}"
          backup="$deploy_root/backups/$backup_id"

          test -d "$public_root"
          test -s "$incoming"
          rm -rf "$stage"
          mkdir -p "$stage" "$backup"
          tar -xzf "$incoming" -C "$stage"

          test -s "$stage/games/index.html"
          test -s "$stage/games/bud-or-bluff/index.html"
          test -s "$stage/games/bud-or-bluff/api-v2.php"
          test -s "$stage/.dtf-source-sha"
          test "$(cat "$stage/.dtf-source-sha")" = "$source_sha"

          if [ "$scope" = 'games' ]; then
            items=(games dtf-build.json)
          else
            items=(
              assets
              atlas
              blog
              explore-dtf-genetics-your-destination-for-cannabis-themed-apparel-and-art
              exploring-dtf-genetics-a-hub-for-cannabis-art-and-gardening-tools
              games
              learn
              projects
              tools
              growlens
              thc-grow-doc
              puzzles
              dtf-build.json
            )
          fi

          for item in "${items[@]}"; do
            [ -e "$stage/$item" ] || continue
            if [ -e "$public_root/$item" ] || [ -L "$public_root/$item" ]; then
              mv "$public_root/$item" "$backup/$item"
            fi
            mv "$stage/$item" "$public_root/$item"
          done

          printf '%s\n' "$source_sha" > "$public_root/.dtf-deployed-sha"
          printf '%s\n' "$scope" > "$public_root/.dtf-deployed-scope"
          printf '%s\n' "$backup_id" > "$public_root/.dtf-last-backup"

          test -s "$public_root/games/index.html"
          test -s "$public_root/games/bud-or-bluff/index.html"
          test -s "$public_root/games/bud-or-bluff/api-v2.php"
          grep -Fq '25 playable browser games' "$public_root/games/index.html"

          rm -rf "$stage"
          rm -f "$incoming"
          echo "backup_id=$backup_id"
          REMOTE

      - name: Smoke-test public routes after deployment
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail

          hub_url="https://dtfseeds.com/games/?dtf-deploy=${SOURCE_SHA}"
          bob_url="https://dtfseeds.com/games/bud-or-bluff/?dtf-deploy=${SOURCE_SHA}"

          curl -fsSL --retry 3 --retry-delay 2 "$hub_url" -o /tmp/dtf-games.html
          grep -Fq '25 playable browser games' /tmp/dtf-games.html

          effective="$(curl -fsSL --retry 3 --retry-delay 2 -o /tmp/dtf-bob.html -w '%{url_effective}' "$bob_url")"
          case "$effective" in
            *'/games/bud-or-bluff/'*|*'/games/bud-or-bluff/?'*) ;;
            *) echo "Bud or Bluff resolved to the wrong public route: $effective" >&2; exit 1 ;;
          esac
          grep -Fiq 'Bud or Bluff' /tmp/dtf-bob.html

          if [ "$SCOPE" = 'public-suite' ]; then
            for route in learn tools projects games/high-iq games/high-land games/weedopolis; do
              curl -fsSL --retry 3 --retry-delay 2 "https://dtfseeds.com/${route}/?dtf-deploy=${SOURCE_SHA}" -o /dev/null
            done
          fi

      - name: Deployment summary
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
          SCOPE: ${{ inputs.scope }}
        run: |
          {
            echo '## Hostinger SSH deployment path'
            echo ''
            echo "- Source build run: ${RUN_ID:-unresolved}"
            echo "- Source SHA: ${SOURCE_SHA:-unresolved}"
            echo "- Scope: ${SCOPE:-unknown}"
            echo '- Transport: SSH/SCP with pinned known_hosts'
            echo '- Activation: route-level backup followed by replacement'
            echo '- Public smoke test includes the Game Hub and Bud or Bluff direct route'
          } >> "$GITHUB_STEP_SUMMARY"
