# Legacy emergency fallback only.
# The WordPress V2 transactional public-suite publisher is the canonical production path.
# Run this workflow manually only when direct Hostinger route repair is intentionally required.
name: Repair DTF Game Routes on Hostinger

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dtf-game-route-hostinger-repair
  cancel-in-progress: false

env:
  BASE_URL: https://dtfseeds.com

jobs:
  validate:
    name: Validate reviewed game routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source-owned routes and runtimes
        shell: bash
        run: |
          set -euo pipefail
          test -s site/public-route-patch/games/index.html
          test -s site/public-route-patch/games/dtf-route.css
          test -s site/public-route-patch/games/high-iq/index.html
          test -s site/public-route-patch/games/high-iq/high-iq.css
          test -s site/public-route-patch/games/high-iq/app.js
          test -s site/public-route-patch/games/grower-conversations/index.html
          test -s site/public-route-patch/games/grower-conversations/grower-conversations.css
          test -s site/public-route-patch/games/grower-conversations/app.js

          node games/high-iq/scripts/validate-data.mjs
          node games/grower-conversations/scripts/validate-prompt-bank.mjs
          node --check site/public-route-patch/games/high-iq/app.js
          node --check site/public-route-patch/games/grower-conversations/app.js

          grep -Fq 'Pick what is playable. See what is coming next.' site/public-route-patch/games/index.html
          grep -Fq 'href="/seeds/"' site/public-route-patch/games/index.html
          grep -Fq 'href="/shop/"' site/public-route-patch/games/index.html
          ! grep -Fqi 'server-engine alpha' site/public-route-patch/games/index.html
          ! grep -Fqi 'implementation gates' site/public-route-patch/games/index.html

          grep -Fq 'href="/games/dtf-route.css"' site/public-route-patch/games/high-iq/index.html
          grep -Fq 'href="./high-iq.css"' site/public-route-patch/games/high-iq/index.html
          grep -Fq 'src="./app.js"' site/public-route-patch/games/high-iq/index.html
          grep -Fq 'href="./grower-conversations.css"' site/public-route-patch/games/grower-conversations/index.html
          grep -Fq 'src="./app.js"' site/public-route-patch/games/grower-conversations/index.html

  deploy:
    name: Back up, publish, and live-audit game routes
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: growlens-production
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      GROWLENS_PATH: ${{ secrets.HOSTINGER_GROWLENS_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate protected Hostinger connection settings
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?HOSTINGER_SSH_HOST is required}"
          : "${SSH_USER:?HOSTINGER_SSH_USER is required}"
          : "${SSH_PRIVATE_KEY:?HOSTINGER_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?HOSTINGER_SSH_KNOWN_HOSTS is required}"
          : "${GROWLENS_PATH:?HOSTINGER_GROWLENS_PATH is required}"
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          case "$GROWLENS_PATH" in
            */public_html/growlens) ;;
            *) echo "GrowLens path must end in /public_html/growlens" >&2; exit 1 ;;
          esac
          SITE_ROOT="${GROWLENS_PATH%/growlens}"
          [[ "$SITE_ROOT" == */public_html ]]
          [[ "$SITE_ROOT" != *".."* ]]
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          echo "SITE_ROOT=$SITE_ROOT" >> "$GITHUB_ENV"

      - name: Configure verified SSH connection
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Back up current Game Hub and two stale game routes
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "ROOT='$SITE_ROOT' STAMP='$stamp' bash -s" <<'REMOTE'
          set -euo pipefail
          backup="$HOME/dtfseeds-game-route-backups/$STAMP"
          mkdir -p "$backup/games"
          for path in games/index.html games/dtf-route.css games/high-iq games/grower-conversations; do
            if [[ -e "$ROOT/$path" ]]; then
              mkdir -p "$backup/$(dirname "$path")"
              cp -a "$ROOT/$path" "$backup/$path"
            fi
          done
          printf '%s\n' "$backup"
          REMOTE

      - name: Publish only reviewed Game Hub, High IQ, and Grower Conversations routes
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$SITE_ROOT/games' '$SITE_ROOT/games/high-iq' '$SITE_ROOT/games/grower-conversations'"
          rsync -az --checksum -e "ssh -p $SSH_PORT" \
            site/public-route-patch/games/index.html \
            "$SSH_USER@$SSH_HOST:$SITE_ROOT/games/index.html"
          rsync -az --checksum -e "ssh -p $SSH_PORT" \
            site/public-route-patch/games/dtf-route.css \
            "$SSH_USER@$SSH_HOST:$SITE_ROOT/games/dtf-route.css"
          rsync -az --checksum --delete -e "ssh -p $SSH_PORT" \
            site/public-route-patch/games/high-iq/ \
            "$SSH_USER@$SSH_HOST:$SITE_ROOT/games/high-iq/"
          rsync -az --checksum --delete -e "ssh -p $SSH_PORT" \
            site/public-route-patch/games/grower-conversations/ \
            "$SSH_USER@$SSH_HOST:$SITE_ROOT/games/grower-conversations/"

      - name: Verify visitor-facing routes and same-origin assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game-route-evidence"
          sleep 3

          fetch_page() {
            local route="$1" output="$2"
            curl -4 -fsSL --retry 4 --retry-delay 3 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$BASE_URL$route?dtf_game_route_repair=${GITHUB_RUN_ID}" -o "$output"
          }

          hub="$RUNNER_TEMP/game-route-evidence/games.html"
          highiq="$RUNNER_TEMP/game-route-evidence/high-iq.html"
          grower="$RUNNER_TEMP/game-route-evidence/grower-conversations.html"
          fetch_page '/games/' "$hub"
          fetch_page '/games/high-iq/' "$highiq"
          fetch_page '/games/grower-conversations/' "$grower"

          grep -Fqi 'Pick what is playable. See what is coming next.' "$hub"
          grep -Fqi 'href="/seeds/"' "$hub"
          grep -Fqi 'href="/shop/"' "$hub"
          ! grep -Fqi 'server-engine alpha' "$hub"
          ! grep -Fqi 'implementation gates' "$hub"

          grep -Fqi '/games/dtf-route.css' "$highiq"
          grep -Fqi './high-iq.css' "$highiq"
          grep -Fqi './app.js' "$highiq"
          grep -Fqi './grower-conversations.css' "$grower"
          grep -Fqi './app.js' "$grower"

          curl -4 -fsSL --retry 3 "$BASE_URL/games/dtf-route.css?dtf_game_route_repair=${GITHUB_RUN_ID}" -o /dev/null
          curl -4 -fsSL --retry 3 "$BASE_URL/games/high-iq/high-iq.css?dtf_game_route_repair=${GITHUB_RUN_ID}" -o /dev/null
          curl -4 -fsSL --retry 3 "$BASE_URL/games/high-iq/app.js?dtf_game_route_repair=${GITHUB_RUN_ID}" -o /dev/null
          curl -4 -fsSL --retry 3 "$BASE_URL/games/grower-conversations/grower-conversations.css?dtf_game_route_repair=${GITHUB_RUN_ID}" -o /dev/null
          curl -4 -fsSL --retry 3 "$BASE_URL/games/grower-conversations/app.js?dtf_game_route_repair=${GITHUB_RUN_ID}" -o /dev/null

      - name: Run full live game-route integrity audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-public-navigation.mjs
          node scripts/audit-game-route-integrity.mjs
          cp game-route-audit.json "$RUNNER_TEMP/game-route-evidence/game-route-audit.json"

      - name: Upload live repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-game-route-hostinger-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/game-route-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Record production repair
        if: always()
        shell: bash
        run: |
          echo '## DTF Game Route Hostinger Repair' >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Mode: manual emergency fallback only. Canonical production publishing is handled by WordPress V2.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Scope: /games/, /games/dtf-route.css, /games/high-iq/, /games/grower-conversations/ only.' >> "$GITHUB_STEP_SUMMARY"
