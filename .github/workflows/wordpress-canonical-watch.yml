name: Reconcile DTFSeeds WordPress Canonical Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    name: Validate canonical WordPress package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate trusted main package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          node --check scripts/audit-wordpress-commerce-rest.mjs
          node --check scripts/validate-genetics-commerce.mjs
          node --check scripts/reconcile-woocommerce-products.mjs
          node --check scripts/rollback-woocommerce-products.mjs
          node --check scripts/validate-woocommerce-reconciliation.mjs
          node scripts/validate-genetics-commerce.mjs
          node scripts/validate-woocommerce-reconciliation.mjs
          for slug in home seeds learn community shop gallery about contact; do
            test -s "site/wordpress/pages/$slug.html"
            grep -Fq '<h1' "site/wordpress/pages/$slug.html"
          done
          test -s site/wordpress/products/genetics.json
          test -s site/wordpress/products/woocommerce-reconciliation.json
          test ! -e site/wordpress/pages/games.html
          test ! -e site/wordpress/pages/high-iq.html
          grep -Fq "show_on_front: 'page'" scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'page_on_front: expectedFrontPageId' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq '/yellow-leaves/' site/wordpress/pages/learn.html
          grep -Fq '/learn/infographics/' site/wordpress/pages/learn.html
          test -d site/wordpress/assets/infographics
          test -s site/wordpress/assets/infographics/Cannabis_Plant_Anatomy_Infographic.png
          test -s site/wordpress/assets/infographics/Nutrient_Uptake_and_Root_Zone_Chemistry.png
          image_count="$(find site/wordpress/assets/infographics -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) | wc -l | tr -d ' ')"
          test "$image_count" -ge 20
          grep -Fq '/product/10-regular-f2-blue-mango-seeds/' site/wordpress/pages/seeds.html
          grep -Fq '/product/10-feminized-f2-blue-mango-x/' site/wordpress/pages/shop.html
          grep -Fq '/product/10-reg-f1-blueberry-bubblegum/' site/wordpress/pages/shop.html

      - name: Probe live WooCommerce products without writing
        id: commerce_probe
        continue-on-error: true
        shell: bash
        env:
          WP_SITE_URL: https://dtfseeds.com
        run: |
          set -euo pipefail
          APPLY_WOOCOMMERCE_CHANGES=false node scripts/reconcile-woocommerce-products.mjs

      - name: Report workflow registration to issue 46
        if: always() && github.event_name != 'schedule'
        uses: actions/github-script@v7
        env:
          PREFLIGHT_STATUS: ${{ job.status }}
          COMMERCE_PROBE_OUTCOME: ${{ steps.commerce_probe.outcome }}
        with:
          script: |
            const fs = require('fs');
            let commerceDetail = 'No live WooCommerce reconciliation report was produced.';
            if (fs.existsSync('woocommerce-reconciliation-report.json')) {
              const report = JSON.parse(fs.readFileSync('woocommerce-reconciliation-report.json', 'utf8'));
              const rows = (report.results || []).map((item) => {
                const fields = (item.changes || []).map((change) => change.field).join(', ') || 'none';
                return `- ${item.registryId}: pinned/live product ID ${item.expectedProductId ?? 'unknown'}/${item.productId ?? 'unknown'}; planned fields: ${fields}`;
              });
              commerceDetail = [
                `Live products checked: **${report.productCount ?? 0}**`,
                `Products needing reconciliation: **${report.productsNeedingChanges ?? 0}**`,
                ...rows
              ].join('\n');
            }
            const body = [
              '## WordPress workflow registration preflight',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: \`${context.sha}\``,
              `Event: **${context.eventName}**`,
              `Preflight result: **${process.env.PREFLIGHT_STATUS}**`,
              `Read-only WooCommerce probe: **${process.env.COMMERCE_PROBE_OUTCOME || 'not-run'}**`,
              '',
              commerceDetail,
              '',
              'This workflow validates the trusted `main` WordPress package and public data without exposing credentials. The separate push-only infographic job below may use repository-level WordPress credentials when they are configured; protected-environment credentials remain inaccessible to this preflight.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body
            });

  publish_infographics_repository_credentials:
    name: Publish infographics with repository credentials
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      INFOGRAPHIC_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
      BACKUP_ROOT: ${{ runner.temp }}/wordpress-infographic-repository-backups
    steps:
      - name: Report publisher start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Repository-credential infographic publisher started',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Commit: \`${context.sha}\``,
                'No credential values are included in this report.'
              ].join('\n')
            });

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect repository-level WordPress credentials
        id: access
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WP_API_USERNAME:-}" && -n "${WP_API_PASSWORD:-}" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish infographic media and library page
        id: media
        if: steps.access.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy-wordpress-infographic-library-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-infographic-backup-path.txt")"
          result="$backup_dir/deployment-result.json"
          echo "source_count=$(node -p "require(process.argv[1]).sourceImageCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "uploaded_count=$(node -p "require(process.argv[1]).uploadedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "reused_count=$(node -p "require(process.argv[1]).reusedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "page_id=$(node -p "require(process.argv[1]).pageId" "$result")" >> "$GITHUB_OUTPUT"

      - name: Verify live infographic library
        id: verify
        if: steps.media.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/infographic-library.html"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache' \
              "https://dtfseeds.com/learn/infographics/?dtf_repository_publish=${GITHUB_RUN_ID}-${attempt}" \
              --output "$page"
            if grep -Fqi 'THC Infographic Library' "$page" && grep -Eqi '<img[^>]+wp-content/uploads/' "$page"; then
              ok=1
              break
            fi
            sleep 10
          done
          [[ "$ok" -eq 1 ]]
          image_count="$(grep -Eoi '<img[^>]+wp-content/uploads/' "$page" | wc -l | tr -d ' ')"
          test "$image_count" -ge 10
          echo "live_image_count=$image_count" >> "$GITHUB_OUTPUT"

      - name: Fail when repository-level credentials are absent
        if: steps.access.outputs.available != 'true'
        run: exit 1

      - name: Upload rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-infographic-repository-${{ github.run_id }}
          path: ${{ runner.temp }}/wordpress-infographic-repository-backups
          if-no-files-found: warn
          retention-days: 30

      - name: Report repository-credential publication result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          ACCESS: ${{ steps.access.outputs.available }}
          SOURCE_COUNT: ${{ steps.media.outputs.source_count }}
          UPLOADED_COUNT: ${{ steps.media.outputs.uploaded_count }}
          REUSED_COUNT: ${{ steps.media.outputs.reused_count }}
          PAGE_ID: ${{ steps.media.outputs.page_id }}
          LIVE_IMAGE_COUNT: ${{ steps.verify.outputs.live_image_count }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Repository-credential infographic publication',
                '',
                `Status: **${process.env.JOB_STATUS}**`,
                `Repository-level WordPress credentials available: **${process.env.ACCESS || 'false'}**`,
                `Source images processed: **${process.env.SOURCE_COUNT || 'not-run'}**`,
                `New media uploads: **${process.env.UPLOADED_COUNT || 'not-run'}**`,
                `Existing media reused: **${process.env.REUSED_COUNT || 'not-run'}**`,
                `Infographic page ID: **${process.env.PAGE_ID || 'not-run'}**`,
                `Images verified live: **${process.env.LIVE_IMAGE_COUNT || 'not-run'}**`,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Target: https://dtfseeds.com/learn/infographics/',
                'No credential values are included in this report.'
              ].join('\n')
            });
