name: Reconcile DTFSeeds WordPress Canonical Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    name: Validate canonical WordPress package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate trusted main package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/validate-genetics-commerce.mjs
          node --check scripts/reconcile-woocommerce-products.mjs
          node --check scripts/validate-woocommerce-reconciliation.mjs
          node scripts/validate-genetics-commerce.mjs
          node scripts/validate-woocommerce-reconciliation.mjs
          for slug in home seeds learn community shop gallery about contact; do
            test -s "site/wordpress/pages/$slug.html"
            grep -Fq '<h1' "site/wordpress/pages/$slug.html"
          done
          test -s site/wordpress/products/genetics.json
          test -s site/wordpress/products/woocommerce-reconciliation.json
          test ! -e site/wordpress/pages/games.html
          test ! -e site/wordpress/pages/high-iq.html
          grep -Fq "show_on_front: 'page'" scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'page_on_front: expectedFrontPageId' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq '/yellow-leaves/' site/wordpress/pages/learn.html
          grep -Fq '/product/10-regular-f2-blue-mango-seeds/' site/wordpress/pages/seeds.html
          grep -Fq '/product/10-feminized-f2-blue-mango-x/' site/wordpress/pages/shop.html
          grep -Fq '/product/10-reg-f1-blueberry-bubblegum/' site/wordpress/pages/shop.html

      - name: Report workflow registration to issue 46
        if: always() && github.event_name != 'schedule'
        uses: actions/github-script@v7
        env:
          PREFLIGHT_STATUS: ${{ job.status }}
        with:
          script: |
            const body = [
              '## WordPress workflow registration preflight',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: \`${context.sha}\``,
              `Event: **${context.eventName}**`,
              `Preflight result: **${process.env.PREFLIGHT_STATUS}**`,
              '',
              'This workflow intentionally accesses no production environment or credentials. It proves GitHub Actions registered the workflow and validates the trusted `main` WordPress package, genetics-to-store route consistency, and the backup-first WooCommerce reconciliation plan. A separate workflow-run deployment workflow owns protected production publishing.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body
            });
