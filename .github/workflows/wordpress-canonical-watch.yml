name: Reconcile DTFSeeds WordPress Canonical Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    name: Validate canonical WordPress package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate trusted main package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          node --check scripts/audit-wordpress-commerce-rest.mjs
          node --check scripts/validate-genetics-commerce.mjs
          node --check scripts/reconcile-woocommerce-products.mjs
          node --check scripts/rollback-woocommerce-products.mjs
          node --check scripts/validate-woocommerce-reconciliation.mjs
          node scripts/validate-genetics-commerce.mjs
          node scripts/validate-woocommerce-reconciliation.mjs
          for slug in home seeds learn community shop gallery about contact; do
            test -s "site/wordpress/pages/$slug.html"
            grep -Fq '<h1' "site/wordpress/pages/$slug.html"
          done
          test -s site/wordpress/products/genetics.json
          test -s site/wordpress/products/woocommerce-reconciliation.json
          test ! -e site/wordpress/pages/games.html
          test ! -e site/wordpress/pages/high-iq.html
          grep -Fq "show_on_front: 'page'" scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'page_on_front: expectedFrontPageId' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq '/yellow-leaves/' site/wordpress/pages/learn.html
          grep -Fq '/learn/infographics/' site/wordpress/pages/learn.html
          test -d site/wordpress/assets/infographics
          test -s site/wordpress/assets/infographics/Cannabis_Plant_Anatomy_Infographic.png
          test -s site/wordpress/assets/infographics/Nutrient_Uptake_and_Root_Zone_Chemistry.png
          image_count="$(find site/wordpress/assets/infographics -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) | wc -l | tr -d ' ')"
          test "$image_count" -ge 20
          grep -Fq '/product/10-regular-f2-blue-mango-seeds/' site/wordpress/pages/seeds.html
          grep -Fq '/product/10-feminized-f2-blue-mango-x/' site/wordpress/pages/shop.html
          grep -Fq '/product/10-reg-f1-blueberry-bubblegum/' site/wordpress/pages/shop.html

      - name: Probe live WooCommerce products without writing
        id: commerce_probe
        continue-on-error: true
        shell: bash
        env:
          WP_SITE_URL: https://dtfseeds.com
        run: |
          set -euo pipefail
          APPLY_WOOCOMMERCE_CHANGES=false node scripts/reconcile-woocommerce-products.mjs

      - name: Report workflow registration to advisory issue 220
        if: always() && github.event_name != 'schedule'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PREFLIGHT_STATUS: ${{ job.status }}
          COMMERCE_PROBE_OUTCOME: ${{ steps.commerce_probe.outcome }}
        with:
          script: |
            const fs = require('fs');
            let commerceDetail = 'No live WooCommerce reconciliation report was produced.';
            if (fs.existsSync('woocommerce-reconciliation-report.json')) {
              const report = JSON.parse(fs.readFileSync('woocommerce-reconciliation-report.json', 'utf8'));
              const rows = (report.results || []).map((item) => {
                const fields = (item.changes || []).map((change) => change.field).join(', ') || 'none';
                return `- ${item.registryId}: pinned/live product ID ${item.expectedProductId ?? 'unknown'}/${item.productId ?? 'unknown'}; planned fields: ${fields}`;
              });
              commerceDetail = [
                `Live products checked: **${report.productCount ?? 0}**`,
                `Products needing reconciliation: **${report.productsNeedingChanges ?? 0}**`,
                ...rows
              ].join('\n');
            }
            const body = [
              '## WordPress workflow registration preflight',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: \`${context.sha}\``,
              `Event: **${context.eventName}**`,
              `Preflight result: **${process.env.PREFLIGHT_STATUS}**`,
              `Read-only WooCommerce probe: **${process.env.COMMERCE_PROBE_OUTCOME || 'not-run'}**`,
              '',
              commerceDetail,
              '',
              'This workflow intentionally accesses no production credentials and performs no WooCommerce writes. It validates the trusted `main` WordPress package, the infographic media publisher, the authenticated presentation probe syntax, genetics-to-store route consistency, pinned product identities, and the backup/rollback WooCommerce reconciliation package. The protected production workflows own all writes.'
            ].join('\n');
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 220,
                body
              });
            } catch (error) {
              core.warning(`Canonical preflight advisory report could not be posted: ${error.message}`);
            }
