name: Deploy DTFSeeds WordPress Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - site/wordpress/pages/**
      - scripts/apply-wordpress-public-content-rest.mjs
      - .github/workflows/wordpress-public-pages-deploy.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-public-pages-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate public page package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate publisher syntax and exact source ownership
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-wordpress-public-content-rest.mjs

          expected=(home seeds learn community shop gallery about contact)
          for slug in "${expected[@]}"; do
            file="site/wordpress/pages/$slug.html"
            test -s "$file"
            grep -Fq '<h1' "$file"
          done

          test ! -e site/wordpress/pages/games.html
          test ! -e site/wordpress/pages/high-iq.html

          actual="$(find site/wordpress/pages -maxdepth 1 -type f -name '*.html' -printf '%f\n' | sed 's/\.html$//' | sort | paste -sd, -)"
          expected_sorted="$(printf '%s\n' "${expected[@]}" | sort | paste -sd, -)"
          [[ "$actual" == "$expected_sorted" ]] || {
            echo "Unexpected WordPress page ownership. Expected: $expected_sorted; actual: $actual" >&2
            exit 1
          }

          if grep -Fq "['games'," scripts/apply-wordpress-public-content-rest.mjs || \
             grep -Fq "['high-iq'," scripts/apply-wordpress-public-content-rest.mjs; then
            echo 'Static game routes must not be required as WordPress pages.' >&2
            exit 1
          fi

          grep -Fq "show_on_front: 'page'" scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'page_on_front: expectedFrontPageId' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'front-page-settings-before.json' scripts/apply-wordpress-public-content-rest.mjs

          test -s site/public-route-patch/games/index.html
          test -s site/public-route-patch/games/high-iq/index.html

      - name: Reject public staging and fake-data language
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "being rebuilt"
            "Reserved strain card"
            "Needed from owner"
            "Tool-ready rebuild"
            "Use this page for"
            "staged for verified"
            "before launch promotion"
            "email@email.com"
            "+123456789"
          )
          for phrase in "${forbidden[@]}"; do
            if grep -RFiq -- "$phrase" site/wordpress/pages; then
              echo "Forbidden public phrase: $phrase" >&2
              exit 1
            fi
          done

      - name: Verify canonical community and education links
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://discord.gg/xJbUeHFPMt' site/wordpress/pages/home.html
          grep -Fq 'https://discord.gg/xJbUeHFPMt' site/wordpress/pages/community.html
          grep -Fq '/yellow-leaves/' site/wordpress/pages/learn.html
          grep -Fq '/thc-grow-doc/' site/wordpress/pages/learn.html
          grep -Fq '/growlens/' site/wordpress/pages/learn.html

      - name: Report validation stage to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_STATUS: ${{ job.status }}
        with:
          script: |
            const body = [
              '## WordPress page-package validation',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: \`${context.sha}\``,
              `Event: **${context.eventName}**`,
              `Validation result: **${process.env.VALIDATION_STATUS}**`,
              '',
              process.env.VALIDATION_STATUS === 'success'
                ? 'The canonical eight-page WordPress package passed pre-deployment validation. The protected production deployment job may now proceed.'
                : 'The canonical WordPress package failed before the protected deployment stage. Inspect this run; no production WordPress mutation was attempted by the deploy job.',
              '',
              'No credential values are included in this report.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body
            });

  deploy:
    name: Back up and publish public pages
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      CONTENT_DIR: ${{ github.workspace }}/site/wordpress/pages
      BACKUP_ROOT: /tmp/wordpress-public-page-backups
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require WordPress Application Password credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WP_API_USERNAME:-}" || -z "${WP_API_PASSWORD:-}" ]]; then
            echo "WordPress production credentials are not configured." >&2
            exit 1
          fi

      - name: Reconcile canonical public pages with rollback backups
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-wordpress-public-content-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-rest-backup-path.txt")"
          summary="$backup_dir/deployment-summary.json"
          mutations="$(node -p "require(process.argv[1]).mutationCount" "$summary")"
          changed_pages="$(node -p "require(process.argv[1]).changedPages" "$summary")"
          echo "mutations=$mutations" >> "$GITHUB_OUTPUT"
          echo "changed_pages=$changed_pages" >> "$GITHUB_OUTPUT"
          echo "WordPress reconciliation mutations: $mutations; changed pages: $changed_pages"

      - name: Verify canonical public pages on production
        shell: bash
        run: |
          set -euo pipefail
          verify_page() {
            local path="$1"
            local required="$2"
            local body="$RUNNER_TEMP/$(echo "$path" | tr '/?' '__').html"
            local ok=0
            for attempt in 1 2 3 4 5 6; do
              curl --fail --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                "https://dtfseeds.com${path}?dtf_verify=${GITHUB_SHA}-${attempt}" \
                --output "$body"
              if grep -Fqi -- "$required" "$body"; then
                ok=1
                break
              fi
              sleep 10
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Live verification did not find required content on $path: $required" >&2
              exit 1
            fi
            for forbidden in \
              'Reserved strain card' \
              'staged for verified' \
              'being rebuilt' \
              'email@email.com' \
              '+123456789'; do
              if grep -Fqi -- "$forbidden" "$body"; then
                echo "Forbidden live phrase remains on $path: $forbidden" >&2
                exit 1
              fi
            done
          }

          verify_page '/' 'Genetics, cultivation education, practical tools, and original cannabis games.'
          verify_page '/seeds/' 'Genetics built through selection, observation, and documentation.'
          verify_page '/learn/' 'Read the yellow-leaves diagnostic guide'
          verify_page '/community/' 'Join the official DTF / Teaching Healthy Cultivation Discord'
          verify_page '/contact/' 'Join the official DTF / Teaching Healthy Cultivation Discord'

      - name: Upload page-level rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-public-pages-backup-${{ github.run_id }}
          path: /tmp/wordpress-public-page-backups
          if-no-files-found: warn
          retention-days: 30

      - name: Report production page deployment to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          MUTATIONS: ${{ steps.publish.outputs.mutations }}
          CHANGED_PAGES: ${{ steps.publish.outputs.changed_pages }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const body = [
              '## Canonical WordPress page deployment',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: \`${context.sha}\``,
              `Event: **${context.eventName}**`,
              `Result: **${process.env.JOB_STATUS}**`,
              `Page mutations: **${process.env.MUTATIONS || 'unknown'}**`,
              `Pages changed: **${process.env.CHANGED_PAGES || 'unknown'}**`,
              '',
              'Scope: Home, Seeds, Learn, Community, Shop, Gallery, About, and Contact.',
              'The canonical `home` page is also enforced as the WordPress front page served at `/`.',
              'Static `/games/` and `/games/high-iq/` routes are intentionally absent from WordPress source ownership.',
              'Verified live targets: Home, Seeds, Learn gateway, Community, Contact.',
              'No credential values are included in this report.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body
            });