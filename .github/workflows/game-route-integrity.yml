name: DTF Game Route Integrity

on:
  workflow_dispatch:
  schedule:
    - cron: '29 8 * * *'
  push:
    branches: [main]
    paths:
      - data/public-navigation.json
      - site/deployment/public-apps.json
      - site/public-route-patch/games/**
      - scripts/validate-public-navigation.mjs
      - scripts/audit-game-route-integrity.mjs
      - .github/workflows/game-route-integrity.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtf-game-route-integrity
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical navigation and button registry
        run: node scripts/validate-public-navigation.mjs

      - name: Audit every public game route and same-origin visual asset
        run: node scripts/audit-game-route-integrity.mjs

      - name: Publish game-route audit summary
        if: always()
        shell: bash
        run: |
          if [[ -f game-route-audit.json ]]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('game-route-audit.json','utf8'));
          console.log('# DTF game-route integrity');
          console.log('');
          console.log(`Games checked: **${r.gamesChecked}**`);
          console.log(`Problem groups: **${r.failures.length}**`);
          console.log('');
          for(const row of r.results){
            console.log(`- ${row.problems.length?'FAIL':'PASS'} ${row.route} — ${row.assetsChecked} same-origin assets checked`);
            for(const p of row.problems) console.log(`  - ${p}`);
          }
          NODE
          fi

      - name: Upload route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-game-route-integrity-${{ github.run_id }}
          path: game-route-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report result to production issue
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## DTF game-route integrity',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.JOB_STATUS}**`,
                '',
                'This gate validates the canonical button registry, every public game route, same-origin scripts/styles/images referenced by each game page, multiplayer UI markers, and every Game Hub link. Development-only projects are rejected if they receive a public route.'
              ].join('\n')
            });
