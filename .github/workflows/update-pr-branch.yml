name: Update PR Branch

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to update with its latest base branch
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pr-branch-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  update:
    name: Merge latest base into PR branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.inputs.pr_number }}
    steps:
      - name: Validate PR and capture exact head
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi

          pr_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"

          state="$(jq -r '.state' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          base_sha="$(jq -r '.base.sha' <<<"$pr_json")"

          if [[ "$state" != "open" ]]; then
            echo "::error::PR #${PR_NUMBER} is not open."
            exit 1
          fi
          if [[ "$head_repo" != "$REPOSITORY" ]]; then
            echo "::error::PR #${PR_NUMBER} is fork-backed (${head_repo}); this workflow only updates same-repository branches with the repository GITHUB_TOKEN."
            exit 1
          fi

          compare_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${REPOSITORY}/compare/${base_sha}...${head_sha}")"
          behind_by="$(jq -r '.behind_by' <<<"$compare_json")"

          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "behind_by=$behind_by" >> "$GITHUB_OUTPUT"

          {
            echo "### PR branch update preflight"
            echo "- PR: #${PR_NUMBER}"
            echo "- Head: \`${head_ref}\` @ \`${head_sha}\`"
            echo "- Base: \`${base_ref}\` @ \`${base_sha}\`"
            echo "- Commits behind base: ${behind_by}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update PR branch using GitHub's guarded update endpoint
        if: steps.preflight.outputs.behind_by != '0'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.preflight.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api \
            --method PUT \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
            -f expected_head_sha="$EXPECTED_HEAD_SHA"

      - name: Confirm updated PR head
        if: steps.preflight.outputs.behind_by != '0'
        shell: bash
        env:
          ORIGINAL_HEAD_SHA: ${{ steps.preflight.outputs.head_sha }}
        run: |
          set -euo pipefail
          updated_sha=""
          for attempt in {1..20}; do
            updated_sha="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.head.sha')"
            if [[ "$updated_sha" != "$ORIGINAL_HEAD_SHA" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$updated_sha" || "$updated_sha" == "$ORIGINAL_HEAD_SHA" ]]; then
            echo "::error::GitHub accepted the update request but the PR head did not advance during verification."
            exit 1
          fi

          echo "- Updated head: \`${updated_sha}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: latest base merged into PR branch without rewriting its existing history." >> "$GITHUB_STEP_SUMMARY"

      - name: Report already-current branch
        if: steps.preflight.outputs.behind_by == '0'
        shell: bash
        run: |
          echo "- Result: PR branch is already current with its base; no mutation was required." >> "$GITHUB_STEP_SUMMARY"
