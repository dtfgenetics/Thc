name: Deploy DTFSeeds Education Assets

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/build-education-image-derivatives.py
      - site/public-route-patch/learn/infographics/**
      - site/wordpress/assets/infographics/**
      - .github/workflows/dtfseeds-education-assets.yml
  push:
    branches: [main]
    paths:
      - scripts/build-education-image-derivatives.py
      - site/public-route-patch/learn/infographics/**
      - site/wordpress/assets/infographics/**
      - .github/workflows/dtfseeds-education-assets.yml

permissions:
  contents: read

concurrency:
  group: dtfseeds-education-assets-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  EDUCATION_SOURCE: site/wordpress/assets/infographics
  EDUCATION_LIBRARY_SOURCE: site/public-route-patch/learn/infographics
  EDUCATION_WEB_BUILD: build/education-web
  EDUCATION_LIBRARY_BUILD: build/learn-infographics
  PILLOW_VERSION: 12.3.0

jobs:
  validate:
    name: Validate approved education masters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify rejected THC-C assets are absent
        shell: bash
        run: |
          set -euo pipefail
          base="$EDUCATION_SOURCE"
          page="$EDUCATION_LIBRARY_SOURCE/index.html"
          test -d "$base"
          test -s "$page"
          banned=(THC-C008_Infographic_Flower_Anatomy_Reproduction.jpg THC-C009_Infographic_Trichomes_Secretory_Biology.jpg)
          for file in "${banned[@]}"; do
            if [[ -e "$base/$file" ]]; then echo "Rejected asset still present: $file" >&2; exit 1; fi
            if grep -R "$file" "$EDUCATION_LIBRARY_SOURCE" site/wordpress/assets/infographics/import-curated-2026-08-19.json site/public-route-patch/assets/education/infographics/import-curated-2026-08-19.json; then echo "Rejected asset still referenced: $file" >&2; exit 1; fi
          done
          required=(THC-C004_Infographic_From_Cell_to_Canopy.jpg THC-C005_Infographic_Root_Anatomy_and_Forensics.jpg THC-C006_Infographic_Stem_Transport_and_Training_Risk.jpg THC-C007_Infographic_Leaf_Anatomy_Gas_Exchange.jpg Cannabis_Plant_Anatomy_Infographic.png Cannabis_Plant_Life_Cycle_Seed_to_Harvest_Infographic.png Nutrient_Uptake_and_Root_Zone_Chemistry.png Beneficial_Insects_and_Biological_Controls.png)
          for file in "${required[@]}"; do test -s "$base/$file"; done
      - name: Build responsive WebP derivatives
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "Pillow==$PILLOW_VERSION"
          rm -rf "$EDUCATION_WEB_BUILD" "$EDUCATION_LIBRARY_BUILD"
          python scripts/build-education-image-derivatives.py --source "$EDUCATION_SOURCE" --output "$EDUCATION_WEB_BUILD" --library-page "$EDUCATION_LIBRARY_SOURCE/index.html" --library-json "$EDUCATION_LIBRARY_SOURCE/library.json" --library-output "$EDUCATION_LIBRARY_BUILD" --widths 640 1280 --quality 82
          test -s "$EDUCATION_WEB_BUILD/optimization-manifest.json"
      - name: Upload validated asset package
        uses: actions/upload-artifact@v4
        with:
          name: dtfseeds-education-assets-${{ github.sha }}
          path: |
            site/wordpress/assets/infographics
            build/education-web
          if-no-files-found: error
          retention-days: 30
