name: Force DTF Stale MU Override Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-dtf-override-repair.yml

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: force-dtfseeds-mu-override-repair
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate protected MU repair
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/wordpress-dtf-override-repair.yml
          test -s scripts/repair-dtf-wordpress-override.mjs
          grep -Fq 'workflow_dispatch:' .github/workflows/wordpress-dtf-override-repair.yml
          node --check scripts/repair-dtf-wordpress-override.mjs

      - name: Dispatch current main and wait for protected MU repair
        id: target
        shell: bash
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run wordpress-dtf-override-repair.yml --ref main
          run_id=''
          for attempt in $(seq 1 20); do
            run_id="$(gh run list --workflow wordpress-dtf-override-repair.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq '[.[] | select(.createdAt >= "'"$before"'")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 3
          done
          if [[ -z "$run_id" ]]; then
            echo 'Could not identify newly dispatched protected MU repair run.' >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Protected MU repair run: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Report deterministic MU repair dispatch
        if: always()
        uses: actions/github-script@v7
        env:
          DISPATCH_STATUS: ${{ job.status }}
          TARGET_RUN_ID: ${{ steps.target.outputs.run_id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Deterministic DTF MU override repair dispatch',
                '',
                `Dispatcher run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Protected target run: **${process.env.TARGET_RUN_ID || 'not-resolved'}**`,
                `Final dispatcher status: **${process.env.DISPATCH_STATUS}**`,
                '',
                'This dispatcher launches the registered protected workflow from current `main`, resolves the new target run, waits for it to complete, and propagates its result.'
              ].join('\n')
            });

# Trusted-main trigger: deterministic corrected MU override repair.
