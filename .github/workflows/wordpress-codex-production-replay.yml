name: Recreate Codex WordPress Production Path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordpress-codex-production-replay.yml'
      - 'scripts/rebuild-wordpress-visual-site.mjs'
      - 'scripts/rebuild-wordpress-infographic-gallery.mjs'
      - 'scripts/run-wordpress-visual-rebuild-approved-only.mjs'
      - 'scripts/publish-wordpress-approved-visual-library.mjs'
      - 'site/wordpress/visual-quality-policy.json'

permissions:
  contents: read

# RETIRED PRODUCTION REPLAY
# The historical replay path directly executed the unrestricted Home/Learn visual
# writer and the dtf-edu infographic gallery. Both behaviors can reintroduce
# quarantined artwork after a clean Learning deployment. Production now uses the
# canonical Learning V3 transaction, approved-only media gates, Gallery V2, and
# the sitewide visual quarantine. This workflow is intentionally read-only.
concurrency:
  group: dtfseeds-codex-rest-production-retired
  cancel-in-progress: true

jobs:
  guard:
    name: Confirm modern approved-only production path
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate current visual owners
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/run-wordpress-visual-rebuild-approved-only.mjs
          node --check scripts/publish-wordpress-approved-visual-library.mjs
          node --check scripts/scrub-wordpress-low-quality-visuals-v2.mjs
          bash -n scripts/run-learning-v3-connected-production.sh
          node - <<'NODE'
          const policy=require('./site/wordpress/visual-quality-policy.json');
          if(Number(policy.schemaVersion)<3 || policy.mode!=='quarantine') throw new Error('Visual quality quarantine policy v3+ is required.');
          if(policy.replacementPolicy?.automaticKeywordMediaSelectionAllowed!==false) throw new Error('Automatic keyword media selection must remain disabled.');
          if(policy.replacementPolicy?.legacyInfographicReuseAllowed!==false) throw new Error('Legacy infographic reuse must remain disabled.');
          if(policy.replacementPolicy?.legacyAutomaticInfographicPublishingAllowed!==false) throw new Error('Legacy infographic publishing must remain disabled.');
          NODE
          grep -Fq 'function isApprovedLearningMedia(item)' scripts/prepare-learning-v3-owner-aware-publisher.mjs
          grep -Fq 'delegatedPublisher' scripts/rebuild-wordpress-infographic-gallery.mjs
          ! grep -Fq 'node scripts/rebuild-wordpress-visual-site.mjs' .github/workflows/wordpress-codex-production-replay.yml
          ! grep -Fq 'APPLY_INFOGRAPHIC_GALLERY' .github/workflows/wordpress-codex-production-replay.yml

      - name: Verify public site is not serving the legacy visual identity
        shell: bash
        run: |
          set -euo pipefail
          blocked='(dtf-edu-|THC[-_ ]?C[0-9]{3}|THC[-_ ]?ENC[-_ ]?[0-9]{3}|Cannabis[_ -]Plant[_ -]Anatomy[_ -]Infographic|Beneficial[_ -]Insects[_ -]and[_ -]Biological[_ -]Controls)'
          for route in / /learn/ /gallery/ /learn/infographics/; do
            body="$RUNNER_TEMP/$(printf '%s' "$route" | tr '/' '_').html"
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --connect-timeout 20 --max-time 50 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
              "https://dtfseeds.com${route}?dtf_retired_codex_guard=${GITHUB_RUN_ID}-$(date +%s%N)" -o "$body"
            ! grep -Eqi "$blocked" "$body" || { echo "Legacy visual identity remains on $route" >&2; exit 1; }
          done
          echo 'Historical Codex replay performed no mutation; current approved-only production owners remain authoritative.'
