name: Validate DTFSeeds WordPress Content

on:
  pull_request:
    paths:
      - site/wordpress/pages/**
      - site/wordpress/products/catalog-strain-cards.json
      - .tmp/strain-card-b64/**
      - scripts/apply-wordpress-public-content.sh
      - scripts/apply-wordpress-public-content-rest.mjs
      - scripts/validate-catalog-strain-cards.mjs
      - .github/workflows/bootstrap-strain-card-assets.yml
      - .github/workflows/wordpress-public-content-*.yml
      - .github/workflows/wordpress-public-pages-deploy.yml
      - .github/workflows/wordpress-reconcile-command.yml
  push:
    branches:
      - main
    paths:
      - site/wordpress/pages/**
      - site/wordpress/products/catalog-strain-cards.json
      - .tmp/strain-card-b64/**
      - scripts/apply-wordpress-public-content.sh
      - scripts/apply-wordpress-public-content-rest.mjs
      - scripts/validate-catalog-strain-cards.mjs
      - .github/workflows/bootstrap-strain-card-assets.yml
      - .github/workflows/wordpress-public-content-*.yml
      - .github/workflows/wordpress-public-pages-deploy.yml
      - .github/workflows/wordpress-reconcile-command.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment and strain-card script syntax
        run: |
          bash -n scripts/apply-wordpress-public-content.sh
          node --check scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/validate-catalog-strain-cards.mjs
          node scripts/validate-catalog-strain-cards.mjs

      - name: Validate maintained WordPress page sources
        shell: bash
        run: |
          set -euo pipefail
          expected=(home seeds blue-mango blue-frequency mystery-line rainbow-bubblegum learn community shop gallery about contact)
          for slug in "${expected[@]}"; do
            file="site/wordpress/pages/$slug.html"
            test -s "$file"
            grep -Fq '<h1' "$file"
          done

          test ! -e site/wordpress/pages/games.html
          test ! -e site/wordpress/pages/high-iq.html

          actual="$(find site/wordpress/pages -maxdepth 1 -type f -name '*.html' -printf '%f\n' | sed 's/\.html$//' | sort | paste -sd, -)"
          expected_sorted="$(printf '%s\n' "${expected[@]}" | sort | paste -sd, -)"
          [[ "$actual" == "$expected_sorted" ]] || {
            echo "Unexpected WordPress page ownership. Expected: $expected_sorted; actual: $actual" >&2
            exit 1
          }

      - name: Enforce WordPress and static route ownership
        shell: bash
        run: |
          set -euo pipefail

          for slug in home seeds blue-mango blue-frequency mystery-line rainbow-bubblegum learn community shop gallery about contact; do
            grep -Eq "['\"]$slug['\"]" scripts/apply-wordpress-public-content-rest.mjs
          done

          ! grep -Eq "\['games',[[:space:]]*'|\['high-iq',[[:space:]]*'" scripts/apply-wordpress-public-content-rest.mjs
          ! grep -Eq 'page_slugs=.*\b(games|high-iq)\b|required_files=.*\b(games|high-iq)\b' scripts/apply-wordpress-public-content.sh

          test -s site/public-route-patch/games/index.html
          test -s site/public-route-patch/games/high-iq/index.html
          grep -Fq 'https://dtfseeds.com/games/' site/public-route-patch/games/index.html
          grep -Fq 'https://dtfseeds.com/games/high-iq/' site/public-route-patch/games/high-iq/index.html

      - name: Enforce canonical WordPress front-page routing
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'front-page-settings-before.json' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq "show_on_front: 'page'" scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'page_on_front: expectedFrontPageId' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'Front-page reconciliation failed' scripts/apply-wordpress-public-content-rest.mjs

          grep -Fq 'show-on-front.txt' scripts/apply-wordpress-public-content.sh
          grep -Fq 'page-on-front.txt' scripts/apply-wordpress-public-content.sh
          grep -Fq 'option update show_on_front page' scripts/apply-wordpress-public-content.sh
          grep -Fq 'option update page_on_front' scripts/apply-wordpress-public-content.sh

          grep -Fq "verify_page '/' 'Genetics, cultivation education, practical tools, and original cannabis games.'" .github/workflows/wordpress-public-pages-deploy.yml
          grep -Fq "verify_page '/' 'Genetics, cultivation education, practical tools, and original cannabis games.'" .github/workflows/wordpress-public-content-cleanup.yml

      - name: Validate owner-only reconciliation command guard
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/wordpress-reconcile-command.yml'
          test -s "$file"
          grep -Fq 'github.event.issue.number == 46' "$file"
          grep -Fq "github.event.comment.body == '/reconcile-wordpress'" "$file"
          grep -Fq 'github.event.comment.user.login == github.repository_owner' "$file"
          grep -Fq 'environment: production' "$file"
          grep -Fq 'scripts/apply-wordpress-public-content-rest.mjs' "$file"
          grep -Fq "verify_page '/contact/'" "$file"

      - name: Reject internal staging language
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "being rebuilt"
            "Reserved strain card"
            "Needed from owner"
            "Tool-ready rebuild"
            "Use this page for"
            "staged for verified"
            "before launch promotion"
          )
          for phrase in "${forbidden[@]}"; do
            if grep -RFiq -- "$phrase" site/wordpress/pages; then
              echo "Forbidden public staging phrase: $phrase"
              exit 1
            fi
          done

      - name: Confirm deployment scope remains narrow
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'wp (plugin|theme|user|media|wc|product|shop_order) (delete|update|install|activate|deactivate)' scripts/apply-wordpress-public-content.sh
          ! grep -Eq '/wp-json/wp/v2/(users/[0-9]+|plugins|themes|products|orders)' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq '/wp-json/wp/v2/media' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'catalog-strain-cards.json' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'webSha256' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'db export' scripts/apply-wordpress-public-content.sh
          grep -Fq 'Expected exactly one published page' scripts/apply-wordpress-public-content.sh
          grep -Fq 'Expected at most one published WordPress page' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'wordpress-rest-content-' scripts/apply-wordpress-public-content-rest.mjs
