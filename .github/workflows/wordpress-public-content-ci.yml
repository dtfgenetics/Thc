name: Validate DTFSeeds WordPress Content

on:
  pull_request:
    paths:
      - site/wordpress/pages/**
      - scripts/apply-wordpress-public-content.sh
      - scripts/apply-wordpress-public-content-rest.mjs
      - .github/workflows/wordpress-public-content-*.yml
      - .github/workflows/wordpress-public-pages-deploy.yml
  push:
    branches:
      - main
    paths:
      - site/wordpress/pages/**
      - scripts/apply-wordpress-public-content.sh
      - scripts/apply-wordpress-public-content-rest.mjs
      - .github/workflows/wordpress-public-content-*.yml
      - .github/workflows/wordpress-public-pages-deploy.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment script syntax
        run: |
          bash -n scripts/apply-wordpress-public-content.sh
          node --check scripts/apply-wordpress-public-content-rest.mjs

      - name: Validate maintained page source files
        shell: bash
        run: |
          set -euo pipefail
          for slug in home games high-iq seeds learn community shop gallery about contact; do
            file="site/wordpress/pages/$slug.html"
            test -s "$file"
            grep -Fq '<h1' "$file"
          done

      - name: Enforce WordPress and static route ownership
        shell: bash
        run: |
          set -euo pipefail

          # Editorial/root WordPress pages must remain explicitly managed.
          for slug in home seeds learn community shop gallery about contact; do
            grep -Eq "['\"]$slug['\"]" scripts/apply-wordpress-public-content-rest.mjs
          done

          # Game routes are static application routes. Requiring these slugs in
          # either WordPress publisher recreates the production failure where
          # WordPress correctly returns zero matching pages.
          ! grep -Eq "\['games',[[:space:]]*'|\['high-iq',[[:space:]]*'" scripts/apply-wordpress-public-content-rest.mjs
          ! grep -Eq 'page_slugs=.*\b(games|high-iq)\b|required_files=.*\b(games|high-iq)\b' scripts/apply-wordpress-public-content.sh

      - name: Reject internal staging language
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "being rebuilt"
            "Reserved strain card"
            "Needed from owner"
            "Tool-ready rebuild"
            "Use this page for"
            "staged for verified"
            "before launch promotion"
          )
          for phrase in "${forbidden[@]}"; do
            if grep -RFiq -- "$phrase" site/wordpress/pages; then
              echo "Forbidden public staging phrase: $phrase"
              exit 1
            fi
          done

      - name: Confirm deployment scope remains narrow
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'wp (plugin|theme|user|media|wc|product|shop_order) (delete|update|install|activate|deactivate)' scripts/apply-wordpress-public-content.sh
          ! grep -Eq '/wp-json/wp/v2/(users/[0-9]+|media|plugins|themes|products|orders)' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'db export' scripts/apply-wordpress-public-content.sh
          grep -Fq 'Expected exactly one published page' scripts/apply-wordpress-public-content.sh
          grep -Fq 'Expected exactly one published WordPress page' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'wordpress-rest-content-' scripts/apply-wordpress-public-content-rest.mjs
