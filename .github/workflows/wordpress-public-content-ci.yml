name: Validate DTFSeeds WordPress Content

on:
  pull_request:
    paths:
      - site/wordpress/pages/**
      - scripts/apply-wordpress-public-content.sh
      - scripts/apply-wordpress-public-content-rest.mjs
      - scripts/apply-wordpress-public-content-owned-routes.mjs
      - scripts/verify-wordpress-owned-route-preservation.mjs
      - docs/DTFSEEDS_PRODUCTION_OWNERSHIP.md
      - .github/workflows/wordpress-public-content-*.yml
      - .github/workflows/wordpress-public-pages-deploy.yml
      - .github/workflows/wordpress-canonical-production.yml
      - .github/workflows/wordpress-reconcile-command.yml
  push:
    branches:
      - main
    paths:
      - site/wordpress/pages/**
      - scripts/apply-wordpress-public-content.sh
      - scripts/apply-wordpress-public-content-rest.mjs
      - scripts/apply-wordpress-public-content-owned-routes.mjs
      - scripts/verify-wordpress-owned-route-preservation.mjs
      - docs/DTFSEEDS_PRODUCTION_OWNERSHIP.md
      - .github/workflows/wordpress-public-content-*.yml
      - .github/workflows/wordpress-public-pages-deploy.yml
      - .github/workflows/wordpress-canonical-production.yml
      - .github/workflows/wordpress-reconcile-command.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment script syntax
        run: |
          bash -n scripts/apply-wordpress-public-content.sh
          node --check scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/apply-wordpress-public-content-owned-routes.mjs
          node --check scripts/verify-wordpress-owned-route-preservation.mjs

      - name: Validate maintained WordPress page sources
        shell: bash
        run: |
          set -euo pipefail
          expected=(home seeds learn community shop gallery about contact blog)
          for slug in "${expected[@]}"; do
            file="site/wordpress/pages/$slug.html"
            test -s "$file"
            grep -Fq '<h1' "$file"
          done

          test ! -e site/wordpress/pages/games.html
          test ! -e site/wordpress/pages/high-iq.html

          actual="$(find site/wordpress/pages -maxdepth 1 -type f -name '*.html' -printf '%f\n' | sed 's/\.html$//' | sort | paste -sd, -)"
          expected_sorted="$(printf '%s\n' "${expected[@]}" | sort | paste -sd, -)"
          [[ "$actual" == "$expected_sorted" ]] || {
            echo "Unexpected maintained WordPress page sources. Expected: $expected_sorted; actual: $actual" >&2
            exit 1
          }

      - name: Enforce WordPress route ownership
        shell: bash
        run: |
          set -euo pipefail

          for slug in home learn community shop gallery about contact blog; do
            grep -Eq "['\"]$slug['\"]" scripts/apply-wordpress-public-content-rest.mjs
          done

          grep -Fq "['blog', 'DTF Field Notes & Updates']" scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'page_for_posts: 0' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'while preserving publication' scripts/apply-wordpress-public-content-rest.mjs

          grep -Fq 'required_files=(home learn community shop gallery about contact blog)' scripts/apply-wordpress-public-content.sh
          grep -Fq 'page_slugs=(home learn community shop gallery about contact blog)' scripts/apply-wordpress-public-content.sh
          grep -Fq '"DTF Field Notes & Updates"' scripts/apply-wordpress-public-content.sh
          grep -Fq 'option update page_for_posts 0' scripts/apply-wordpress-public-content.sh
          grep -Fq 'while preserving publication' scripts/apply-wordpress-public-content.sh

          ! grep -Eq "\['seeds',[[:space:]]*'|\['games',[[:space:]]*'|\['high-iq',[[:space:]]*'" scripts/apply-wordpress-public-content-rest.mjs
          ! grep -Eq 'page_slugs=.*\b(seeds|games|high-iq)\b|required_files=.*\b(seeds|games|high-iq)\b' scripts/apply-wordpress-public-content.sh
          grep -Fq '| `/seeds/` and `/seeds/*` | Dedicated genetics library publisher |' docs/DTFSEEDS_PRODUCTION_OWNERSHIP.md
          grep -Fq 'genetics publisher the sole Seeds-route owner' docs/DTFSEEDS_PRODUCTION_OWNERSHIP.md

          test ! -e site/wordpress/pages/games.html
          test ! -e site/wordpress/pages/high-iq.html

          ! grep -Fq 'workflow_run:' .github/workflows/wordpress-public-content-cleanup.yml
          ! grep -Fq 'apply-wordpress-public-content-rest.mjs' .github/workflows/wordpress-public-content-cleanup.yml
          ! grep -Fq 'site/wordpress/pages/**' .github/workflows/wordpress-public-content-cleanup.yml

      - name: Enforce canonical WordPress front-page routing
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'front-page-settings-before.json' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq "show_on_front: 'page'" scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'page_on_front: expectedFrontPageId' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'Front-page reconciliation failed' scripts/apply-wordpress-public-content-rest.mjs

          grep -Fq 'show-on-front.txt' scripts/apply-wordpress-public-content.sh
          grep -Fq 'page-on-front.txt' scripts/apply-wordpress-public-content.sh
          grep -Fq 'option update show_on_front page' scripts/apply-wordpress-public-content.sh
          grep -Fq 'option update page_on_front' scripts/apply-wordpress-public-content.sh

          grep -Fq "verify_page '/' 'Genetics, cultivation education, practical tools, and original cannabis games.'" .github/workflows/wordpress-public-pages-deploy.yml

          ! grep -Fq "verify_page '/home/'" .github/workflows/wordpress-canonical-production.yml
          grep -Fq 'Verify Learning-owned WordPress route preservation through REST' .github/workflows/wordpress-canonical-production.yml
          grep -Fq 'node scripts/verify-wordpress-owned-route-preservation.mjs' .github/workflows/wordpress-canonical-production.yml
          grep -Fq 'EXPECTED_HOME_FEATURED_MEDIA' .github/workflows/wordpress-canonical-production.yml
          grep -Fq 'owned-route-preservation.json' scripts/apply-wordpress-public-content-owned-routes.mjs
          grep -Fq 'createHash' scripts/apply-wordpress-public-content-owned-routes.mjs
          grep -Fq 'createHash' scripts/verify-wordpress-owned-route-preservation.mjs
          ! grep -Fq 'Genetics first. Cultivation science behind it.' .github/workflows/wordpress-canonical-production.yml

      - name: Validate owner-only reconciliation command guard
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/wordpress-reconcile-command.yml'
          test -s "$file"
          grep -Fq 'github.event.issue.number == 46' "$file"
          grep -Fq "github.event.comment.body == '/reconcile-wordpress'" "$file"
          grep -Fq 'github.event.comment.user.login == github.repository_owner' "$file"
          grep -Fq 'environment: production' "$file"
          grep -Fq 'scripts/apply-wordpress-public-content-rest.mjs' "$file"
          grep -Fq "verify_page '/contact/'" "$file"

      - name: Reject internal staging language
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "being rebuilt"
            "Reserved strain card"
            "Needed from owner"
            "Tool-ready rebuild"
            "Use this page for"
            "staged for verified"
            "before launch promotion"
          )
          for phrase in "${forbidden[@]}"; do
            if grep -RFiq -- "$phrase" site/wordpress/pages; then
              echo "Forbidden public staging phrase: $phrase"
              exit 1
            fi
          done

      - name: Confirm deployment scope remains narrow
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'wp (plugin|theme|user|media|wc|product|shop_order) (delete|update|install|activate|deactivate)' scripts/apply-wordpress-public-content.sh
          ! grep -Eq '/wp-json/wp/v2/(users/[0-9]+|media|plugins|themes|products|orders)' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'db export' scripts/apply-wordpress-public-content.sh
          grep -Fq 'Expected exactly one published page' scripts/apply-wordpress-public-content.sh
          grep -Fq 'Expected at most one published WordPress page' scripts/apply-wordpress-public-content-rest.mjs
          grep -Fq 'wordpress-rest-content-' scripts/apply-wordpress-public-content-rest.mjs
