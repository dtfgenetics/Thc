name: Seed Man Platformer CI

on:
  push:
    branches: [main]
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'games/shared-platform/**'
      - 'site/public-route-patch/games/shared-platform/**'
      - '.github/workflows/seed-man-platformer-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'games/shared-platform/**'
      - 'site/public-route-patch/games/shared-platform/**'
      - '.github/workflows/seed-man-platformer-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-man-platformer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Seed Man dependencies
        run: npm install --prefix games/seed-man-platformer --ignore-scripts --no-audit --no-fund

      - name: Verify complete production architecture
        run: npm run --prefix games/seed-man-platformer test:production-contracts

      - name: Verify Three.js renderer import and build
        run: |
          npm run --prefix games/seed-man-platformer verify:three-import
          npm run --prefix games/seed-man-platformer build:three-public
          bundle=games/seed-man-platformer/dist/three-world-v1.js
          test -s "$bundle"
          node --check "$bundle"
          grep -Fq 'SeedManThreeWorld' "$bundle"
          grep -Fq 'seed-man-three-world-v2' "$bundle"
          bytes="$(wc -c < "$bundle" | tr -d ' ')"
          [[ "$bytes" -ge 250000 && "$bytes" -le 900000 ]] || { echo "Three.js bundle outside budget: $bytes" >&2; exit 1; }

      - name: Verify canonical 20-level campaign and approved-art contract
        shell: bash
        run: |
          set -euo pipefail
          game=games/seed-man-platformer
          route=site/public-route-patch/games/seed-man-platformer
          node scripts/verify-seed-man-production-v20.mjs
          node scripts/validate-seed-man-production-bundle.mjs
          node <<'NODE'
          const fs=require('fs');
          const pairs=[
            ['games/seed-man-platformer/data/campaign.json','site/public-route-patch/games/seed-man-platformer/data/campaign.json'],
            ['games/seed-man-platformer/data/levels-20-v1.json','site/public-route-patch/games/seed-man-platformer/data/levels-20-v1.json'],
            ['games/seed-man-platformer/data/seed-man-art-manifest-v1.json','site/public-route-patch/games/seed-man-platformer/data/seed-man-art-manifest-v1.json'],
            ['games/seed-man-platformer/data/enemy-catalog-v1.json','site/public-route-patch/games/seed-man-platformer/data/enemy-catalog-v1.json'],
            ['games/seed-man-platformer/data/boss-catalog-v1.json','site/public-route-patch/games/seed-man-platformer/data/boss-catalog-v1.json']
          ];
          const stable=v=>Array.isArray(v)?v.map(stable):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])])):v;
          for(const [a,b] of pairs){const left=stable(JSON.parse(fs.readFileSync(a,'utf8')));const right=stable(JSON.parse(fs.readFileSync(b,'utf8')));if(JSON.stringify(left)!==JSON.stringify(right))throw new Error(`semantic mismatch: ${a} != ${b}`);}
          console.log('Seed Man canonical/public production data parity OK');
          NODE

      - name: Verify production JavaScript syntax
        run: |
          node --check games/seed-man-platformer/src/render/art-registry.mjs
          node --check games/seed-man-platformer/src/render/approved-art-loader.mjs
          node --check games/seed-man-platformer/src/render/visual-runtime-v2.mjs
          node --check games/seed-man-platformer/src/systems/level-catalog.mjs
          node --check games/seed-man-platformer/src/systems/level-runtime.mjs
          node --check games/seed-man-platformer/src/systems/phenotype-system.mjs
          node --check games/seed-man-platformer/src/systems/power-drop.mjs
          node --check games/seed-man-platformer/src/systems/boss-state-machine.mjs
          node --check games/seed-man-platformer/src/systems/final-boss-director.mjs
          node --check games/seed-man-platformer/src/systems/campaign-state-v2.mjs
          node --check games/seed-man-platformer/src/systems/save-state-v2.mjs
          node --check games/seed-man-platformer/src/systems/hud-model.mjs
          node --check games/seed-man-platformer/src/systems/input-actions.mjs
          node --check games/seed-man-platformer/src/systems/world-theme.mjs
          node --check games/seed-man-platformer/src/systems/platform-surface-map.mjs
          node --check games/seed-man-platformer/src/systems/asset-key-guard.mjs
          node --check games/seed-man-platformer/src/systems/game-contract.mjs
          node --check games/seed-man-platformer/src/systems/release-contract.mjs
          node --check games/seed-man-platformer/src/systems/production-readiness.mjs
          node --check games/seed-man-platformer/src/systems/production-assets.mjs
          node --check games/seed-man-platformer/src/systems/production-bootstrap.mjs
          node --check site/public-route-patch/games/seed-man-platformer/app.js
          node --check site/public-route-patch/games/seed-man-platformer/campaign-v20-runtime.js
          node --check site/public-route-patch/games/seed-man-platformer/campaign-ui-v20.js

      - name: Run deterministic gameplay and migration coverage
        run: |
          node games/seed-man-platformer/test/physics.test.mjs
          node games/seed-man-platformer/test/progression-systems.test.mjs
          node games/seed-man-platformer/test/campaign.test.mjs
          node games/seed-man-platformer/test/public-runtime.test.mjs
          node games/seed-man-platformer/test/public-campaign.test.mjs
          node games/seed-man-platformer/test/input-guard.test.mjs

      - name: Verify shared platform contract
        run: node games/shared-platform/test/runtime.test.mjs
