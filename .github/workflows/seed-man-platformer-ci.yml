name: Seed Man Platformer CI

on:
  push:
    branches: [main]
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - '.github/workflows/seed-man-platformer-ci.yml'
      - '.github/workflows/seed-man-live-browser-acceptance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - '.github/workflows/seed-man-platformer-ci.yml'
      - '.github/workflows/seed-man-live-browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test platformer physics and level interactions
        run: node games/seed-man-platformer/test/physics.test.mjs
      - name: Test self-contained public runtime
        run: node games/seed-man-platformer/test/public-runtime.test.mjs
      - name: Test keyboard focus ownership
        run: node games/seed-man-platformer/test/input-guard.test.mjs
      - name: Validate browser JavaScript syntax
        run: |
          node --check site/public-route-patch/games/seed-man-platformer/app.js
          node --check site/public-route-patch/games/seed-man-platformer/input-guard-v1.js
          node --check site/public-route-patch/games/seed-man-platformer/physics.mjs
          node --check games/seed-man-platformer/test/browser-smoke.mjs
      - name: Verify public simulation copies match canonical source
        shell: bash
        run: |
          set -euo pipefail
          cmp games/seed-man-platformer/src/physics.mjs site/public-route-patch/games/seed-man-platformer/physics.mjs
          cmp games/seed-man-platformer/data/level-01.json site/public-route-patch/games/seed-man-platformer/data/level-01.json
      - name: Verify expanded public route contract
        shell: bash
        run: |
          set -euo pipefail
          route=site/public-route-patch/games/seed-man-platformer
          test -s "$route/index.html"
          test -s "$route/app.js"
          test -s "$route/input-guard-v1.js"
          test -s "$route/seed-man.css"
          test -s "$route/physics.mjs"
          test -s "$route/data/level-01.json"
          grep -Fq '<h1>Sprout Run</h1>' "$route/index.html"
          grep -Fq 'Greenhouse Gauntlet' "$route/index.html"
          grep -Fq 'https://dtfseeds.com/games/seed-man-platformer/' "$route/index.html"
          grep -Fqi 'rel="canonical"' "$route/index.html"
          grep -Fqi 'name="description"' "$route/index.html"
          grep -Fq 'id="seed-man-level"' "$route/index.html"
          grep -Fq '"worldWidth": 7800' "$route/index.html"
          grep -Fq '"requiredPickups": 24' "$route/index.html"
          grep -Fq 'JUMP ×2' "$route/index.html"
          grep -Fq '<script src="./app.js" defer></script>' "$route/index.html"
          grep -Fq '<script src="./input-guard-v1.js" defer></script>' "$route/index.html"
          grep -Fq 'No third-party level layouts or character assets are used.' "$route/index.html"
      - name: Install browser-test dependencies
        run: |
          npm ci
          npx playwright install chromium
      - name: Play through Sprout Run in Chromium
        run: node games/seed-man-platformer/test/browser-smoke.mjs