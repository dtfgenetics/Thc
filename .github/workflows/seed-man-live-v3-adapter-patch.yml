name: Seed Man Live V3 Adapter Patch

on:
  push:
    branches: [seed-man-live-v3-adapter-fix-20260908]
    paths:
      - .github/workflows/seed-man-live-v3-adapter-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seed-man-live-v3-adapter-fix-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch adapter and live acceptance contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          adapter = Path('site/public-route-patch/games/seed-man-platformer/three-world-adapter-v1.js')
          text = adapter.read_text()
          text = text.replace("const VISUAL_THEME_VERSION = 'seed-man-world-themes-v1';", "const VISUAL_THEME_VERSION = 'seed-man-visual-world-api-v1';")
          text = text.replace("const EXPECTED_API_VERSION = 'seed-man-three-public-v2';", "const EXPECTED_API_VERSION = 'seed-man-three-public-v3';")
          start = text.index('  function applyWorldTheme(descriptor) {')
          end = text.index('\n  function installStack()', start)
          replacement = "  function applyWorldTheme(descriptor) {\n    if (!renderer?.scene || !descriptor) return;\n    const visualWorldKey = descriptor.visualWorldKey || descriptor.level?.visualWorldKey || 'greenhouse-valley';\n    mountedVisualTheme = visualWorldKey;\n    shell.dataset.seedVisualTheme = visualWorldKey;\n    document.body.dataset.seedVisualWorld = visualWorldKey;\n    document.documentElement.dataset.seedThreeTheme = visualWorldKey;\n    document.documentElement.dataset.seedThreeThemeVersion = VISUAL_THEME_VERSION;\n  }\n"
          text = text[:start] + replacement + text[end:]
          adapter.write_text(text)

          acceptance = Path('.github/workflows/seed-man-live-browser-acceptance.yml')
          text = acceptance.read_text()
          text = text.replace("'seed-man-three-public-v2'", "'seed-man-three-public-v3'")
          text = text.replace('v2 greenhouse renderer', 'v2 five-world renderer')
          text = text.replace('public Three.js API v2', 'public Three.js API v3')
          text = text.replace('during the v2 transition', 'during the v3 transition')
          acceptance.write_text(text)
          PY
      - name: Validate patched browser contracts
        run: |
          node --check site/public-route-patch/games/seed-man-platformer/three-world-adapter-v1.js
          grep -Fq "EXPECTED_API_VERSION = 'seed-man-three-public-v3'" site/public-route-patch/games/seed-man-platformer/three-world-adapter-v1.js
          grep -Fq "descriptor.visualWorldKey" site/public-route-patch/games/seed-man-platformer/three-world-adapter-v1.js
          grep -Fq "seed-man-three-public-v3" .github/workflows/seed-man-live-browser-acceptance.yml
      - name: Commit live adapter repair
        run: |
          git config user.name 'DTF Seed Man Live Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/public-route-patch/games/seed-man-platformer/three-world-adapter-v1.js .github/workflows/seed-man-live-browser-acceptance.yml
          git commit -m 'Fix Seed Man v3 live adapter and acceptance [seed-live-v3]'
          git push origin HEAD:seed-man-live-v3-adapter-fix-20260908
