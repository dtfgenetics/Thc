name: Validate DTFSeeds Release Hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate hardened release sources
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/plan-dtfseeds-release.mjs
          node --check scripts/plan-dtfseeds-resource-release.mjs
          node --check scripts/publish-wordpress-learning-center-expansion-v1.mjs
          node --check scripts/update-wordpress-learn-expansion-v1.mjs
          node --check scripts/cleanup-stale-wordpress-suite-snippets.mjs
          node scripts/test-dtf-resource-release-system.mjs
          bash -n scripts/run-workflow-and-wait.sh
          python -m py_compile \
            scripts/package-public-suite-wordpress.py \
            scripts/package-public-suite-wordpress-resource-aware.py \
            scripts/public_suite_resource_ownership.py \
            scripts/assemble-wordpress-suite-v2.py \
            scripts/assemble-wordpress-suite-resource-aware.py
          grep -Fq 'Enforce authoritative lane outcomes' .github/workflows/dtfseeds-production-gateway.yml
          grep -Fq 'wordpress-canonical-production.yml --join-existing' .github/workflows/dtfseeds-production-gateway.yml
          ! grep -Fq 'wordpress-canonical-production.yml --join-only' .github/workflows/dtfseeds-production-gateway.yml
          grep -Fq 'wordpress-harvest-outdoor-v6-production.yml' .github/workflows/dtfseeds-production-gateway.yml
          grep -Fq 'Recheck automatic release freshness before visitor verification' .github/workflows/dtfseeds-production-gateway.yml
          ! grep -Fq 'issues: write' .github/workflows/dtfseeds-production-gateway.yml
          ! grep -Fq 'github.rest.issues.createComment' .github/workflows/dtfseeds-production-gateway.yml
          ! grep -Fq 'issue_number: 220' .github/workflows/dtfseeds-production-gateway.yml
          ! grep -Fq 'issues: write' .github/workflows/wordpress-canonical-deploy.yml
          ! grep -Fq 'github.rest.issues.createComment' .github/workflows/wordpress-canonical-deploy.yml
          ! grep -Fq 'issue_number:46' .github/workflows/wordpress-canonical-deploy.yml
          grep -Fq 'Summarize trusted production handoff' .github/workflows/wordpress-canonical-deploy.yml
          ! grep -Fq 'issues: write' .github/workflows/deploy-thc-learning-center-expansion-v1.yml
          ! grep -Fq 'github.rest.issues.createComment' .github/workflows/deploy-thc-learning-center-expansion-v1.yml
          ! grep -Fq 'issue_number: 220' .github/workflows/deploy-thc-learning-center-expansion-v1.yml
          ! grep -Fq 'issue_comment:' .github/workflows/deploy-thc-learning-center-expansion-v1.yml
          grep -Fq 'group: dtfseeds-learning-experience-v3' .github/workflows/deploy-thc-learning-center-expansion-v1.yml
          grep -Fq 'Refresh canonical Learning V3 owner transaction' .github/workflows/deploy-thc-learning-center-expansion-v1.yml
          grep -Fq 'Confirm expansion routes on canonical Learn hub' .github/workflows/deploy-thc-learning-center-expansion-v1.yml
          grep -Fq 'bash scripts/run-learning-v3-connected-production.sh' .github/workflows/deploy-thc-learning-center-expansion-v1.yml
          grep -Fq 'data-dtf-learning-expanded-reference="v1"' .github/workflows/deploy-thc-learning-center-expansion-v1.yml
          grep -Fq 'data-dtf-learning-map="v4"' .github/workflows/deploy-thc-learning-center-expansion-v1.yml
          grep -Fq 'cancel-in-progress: false' .github/workflows/wordpress-canonical-production.yml
          grep -Fq 'dtf-wordpress-temporary-code-snippets-bridge' .github/workflows/deploy-public-suite-wordpress-v2.yml
          grep -Fq 'dtf-wordpress-temporary-code-snippets-bridge' .github/workflows/deploy-games-suite-lock-recovery.yml
          grep -Fq 'dtf-wordpress-temporary-code-snippets-bridge' .github/workflows/deploy-dtfseeds-wordpress-resource.yml
          grep -Fq 'scripts/assemble-wordpress-suite-resource-aware.py' .github/workflows/deploy-public-suite-wordpress-v2.yml
          grep -Fq 'scripts/package-public-suite-wordpress-resource-aware.py' .github/workflows/deploy-public-suite-wordpress-v2.yml
          grep -Fq 'resourceOwnedRoutesExcluded' .github/workflows/deploy-public-suite-wordpress-v2.yml
          ! grep -Fq 'Atlas deployment target allowlist' .github/workflows/deploy-public-suite-wordpress-v2.yml
          ! grep -Fq "check 'https://dtfseeds.com/games/high-iq/'" .github/workflows/deploy-public-suite-wordpress-v2.yml
          grep -Fq "check 'https://dtfseeds.com/games/high-land/'" .github/workflows/deploy-public-suite-wordpress-v2.yml
          grep -Fq 'build-dtfseeds-public-resource.yml --join-only' .github/workflows/dtfseeds-resource-production-gateway.yml
          grep -Fq 'source_sha=$GITHUB_SHA' .github/workflows/dtfseeds-resource-production-gateway.yml
          grep -Fq 'gateway-managed' .github/workflows/dtfseeds-resource-production-gateway.yml
          ! grep -Fq 'issues: write' .github/workflows/dtfseeds-resource-production-gateway.yml
          grep -Fq 'assertNoOtherActivePublisher' scripts/cleanup-stale-wordpress-suite-snippets.mjs
          grep -Fq 'Temporary read-only inspector' scripts/cleanup-stale-wordpress-suite-snippets.mjs
          grep -Fq 'age<120' scripts/cleanup-stale-wordpress-suite-snippets.mjs
          grep -Fq 'clearTransaction(bridge.token,staleId,state)' scripts/cleanup-stale-wordpress-suite-snippets.mjs
          grep -A2 -F 'Report production result to issue 46' .github/workflows/wordpress-canonical-production.yml | grep -Fq 'continue-on-error: true'

      - name: Assemble and inspect resource-aware transactional Public Suite bridge
        shell: bash
        run: |
          set -euo pipefail
          python scripts/assemble-wordpress-suite-resource-aware.py "$RUNNER_TEMP/deploy-public-suite-v2.mjs" | tee "$RUNNER_TEMP/resource-ownership-bridge.json"
          node --check "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          grep -Fq 'games/strain-match' "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          grep -Fq 'games/lost-in-the-terps' "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          grep -Fq "'atlas/leaf-module/index.html'" "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          grep -Fq "'games/high-land'" "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          grep -Fq "'/games/high-land/'" "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          ! grep -Fq "'games/high-iq'" "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          ! grep -Fq "'/games/high-iq/'" "$RUNNER_TEMP/deploy-public-suite-v2.mjs"
          grep -Fq 'games/strain-match' scripts/package-public-suite-wordpress.py
          grep -Fq 'games/lost-in-the-terps' scripts/package-public-suite-wordpress.py
          grep -Fq 'resourceOwnedTargetsExcluded' "$RUNNER_TEMP/resource-ownership-bridge.json"
          grep -Fq 'games/high-iq' "$RUNNER_TEMP/resource-ownership-bridge.json"

      - name: Verify all release lanes remain selected for gateway architecture changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/plan-dtfseeds-release.mjs --mode=auto --base="$BASE_SHA" --head="$HEAD_SHA" > "$RUNNER_TEMP/plan.json"
          node - <<'NODE' "$RUNNER_TEMP/plan.json" site/deployment/release-lanes.json
          const fs=require('fs');
          const plan=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const config=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const architectureChanged=plan.changedFiles.some((file)=>config.fullReleasePaths.includes(file));
          if(!architectureChanged){
            console.log('No full-release gateway architecture path changed; lane-forcing assertion is not applicable.');
            process.exit(0);
          }
          if(!plan.forceFull) throw new Error('gateway architecture changes did not force full reconciliation');
          for(const lane of ['publicSuite','wordpress','education','harvestOutdoor']) if(plan.lanes[lane] !== true) throw new Error(`missing lane ${lane}`);
          NODE
