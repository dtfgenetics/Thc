name: Academy Learning Record Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lib/academy-learning-record-core.mjs'
      - 'scripts/lib/academy-learning-record-core.test.mjs'
      - '.github/workflows/academy-learning-record-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lib/academy-learning-record-core.mjs'
      - 'scripts/lib/academy-learning-record-core.test.mjs'
      - '.github/workflows/academy-learning-record-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check learning-record syntax
        run: |
          node --check scripts/lib/academy-learning-record-core.mjs
          node --check scripts/lib/academy-learning-record-core.test.mjs
      - name: Verify learning-record invariants
        run: node scripts/lib/academy-learning-record-core.test.mjs
