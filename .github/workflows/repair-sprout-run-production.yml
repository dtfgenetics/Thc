name: Repair Sprout Run Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-sprout-run-production.yml'
      - '.github/sprout-run-repair-trigger.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-sprout-run-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_URL: https://dtfseeds.com/games/seed-man-platformer/
      RELEASE_ID: 20260830-r3
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Correct canonical Sprout Run deployment registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('site/deployment/public-apps.json')
          data = json.loads(path.read_text())
          matches = [app for app in data.get('apps', []) if app.get('id') == 'seed-man-platformer']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one seed-man-platformer registry entry, found {len(matches)}')

          app = matches[0]
          app['title'] = 'Seed Man: Sprout Run — Greenhouse Gauntlet'
          app['repository'] = 'dtfgenetics/Thc'
          app['sourcePath'] = 'site/public-route-patch/games/seed-man-platformer'
          app['canonicalDataPath'] = 'games/seed-man-platformer'
          app['route'] = '/games/seed-man-platformer/'
          app['runtime'] = 'static-canvas2d'
          app['status'] = 'ready-to-package'
          app['build'] = 'node games/seed-man-platformer/test/physics.test.mjs && node games/seed-man-platformer/test/public-runtime.test.mjs && node games/seed-man-platformer/test/input-guard.test.mjs'
          app['machineData'] = {
              'level': 'sprout-run',
              'edition': 'greenhouse-gauntlet',
              'release': '20260830-r3',
              'worldWidth': 7800,
              'collectibles': 24,
              'powerups': 7,
              'checkpointCount': 3,
              'hazardZones': 15,
              'doubleJump': True,
              'productionCharacterArt': 'seed-man-production-v1',
              'characterContract': 'seed-man-locked-v1'
          }
          app['notes'] = (
              'Canonical self-hosted Greenhouse Gauntlet production build. Publishes the 7,800 px '
              '24-sprout course with double jump, seven power-ups, three checkpoints, fifteen hazard '
              'zones, keyboard/touch controls, gated finish, original Canvas2D Seed Man art, and '
              'cache-versioned 20260830-r3 runtime assets. The retired 2,600 px eight-sprout vertical '
              'slice must never be republished.'
          )
          data['updated'] = '2026-08-30'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Validate canonical Sprout Run release tree
        shell: bash
        run: |
          set -euo pipefail
          route=site/public-route-patch/games/seed-man-platformer
          node games/seed-man-platformer/test/physics.test.mjs
          node games/seed-man-platformer/test/public-runtime.test.mjs
          node games/seed-man-platformer/test/input-guard.test.mjs
          node --check "$route/app.js"
          node --check "$route/seed-man-production-art.js"
          node --check "$route/input-guard-v1.js"
          required=(index.html app.js seed-man-production-art.js input-guard-v1.js seed-man.css physics.mjs data/level-01.json)
          for rel in "${required[@]}"; do test -s "$route/$rel"; done
          for marker in \
            'Seed Man · Greenhouse Gauntlet' \
            '0 / 24' \
            'JUMP ×2' \
            '"worldWidth": 7800' \
            '"requiredPickups": 24' \
            'name="dtf-sprout-release" content="20260830-r3"' \
            '<script src="./app.js?v=20260830-r3" defer></script>' \
            '<script src="./seed-man-production-art.js?v=20260830-r3" defer></script>' \
            '<script src="./input-guard-v1.js?v=20260830-r3" defer></script>' \
            'seed-man.css?v=20260830-r3'; do
            grep -Fq "$marker" "$route/index.html" || { echo "Source release missing marker: $marker" >&2; exit 1; }
          done
          grep -Fq 'seed-man-production-v1' "$route/seed-man-production-art.js"
          grep -Fq 'seed-man-locked-v1' "$route/seed-man-production-art.js"
          if grep -Fqi 'collect all eight sprouts' "$route/index.html"; then exit 1; fi
          if grep -Fq '0 / 8' "$route/index.html"; then exit 1; fi

      - name: Commit corrected registry before deployment
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/deployment/public-apps.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/deployment/public-apps.json
          git commit -m 'Correct Sprout Run r3 production registry'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical WordPress V2 deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run deploy-public-suite-wordpress-v2.yml --ref main)"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Could not parse deploy run id from $run_url" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Dispatched WordPress V2 deployment run $run_id"
          gh run watch "$run_id" --exit-status

      - name: Verify cache-busted live Sprout Run bundle
        id: live
        shell: bash
        run: |
          set -euo pipefail
          bust="sprout_repair=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"

          fetch() {
            local rel="$1" output="$2" status sep url
            sep='?'
            [[ "$rel" == *'?'* ]] && sep='&'
            url="${LIVE_URL}${rel}${sep}${bust}"
            status="$(curl -sS --retry 5 --retry-delay 4 --connect-timeout 10 --max-time 35 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              -o "$output" -w '%{http_code}' "$url")"
            [[ "$status" == '200' ]] || { echo "${rel:-index} returned HTTP $status" >&2; return 1; }
            test -s "$output"
          }

          fetch '' "$RUNNER_TEMP/sprout-index.html"
          html="$RUNNER_TEMP/sprout-index.html"
          for marker in \
            'Seed Man · Greenhouse Gauntlet' \
            '0 / 24' \
            'JUMP ×2' \
            '"worldWidth": 7800' \
            '"requiredPickups": 24' \
            'name="dtf-sprout-release" content="20260830-r3"' \
            '<script src="./app.js?v=20260830-r3" defer></script>' \
            '<script src="./seed-man-production-art.js?v=20260830-r3" defer></script>' \
            '<script src="./input-guard-v1.js?v=20260830-r3" defer></script>' \
            'seed-man.css?v=20260830-r3'; do
            grep -Fq "$marker" "$html" || { echo "Live Sprout Run missing r3 marker: $marker" >&2; exit 1; }
          done
          for stale in 'collect all eight sprouts' '0 / 8' 'Original browser vertical slice' 'simple Canvas2D primitives'; do
            if grep -Fqi "$stale" "$html"; then
              echo "Retired Sprout Run content is still live: $stale" >&2
              exit 1
            fi
          done

          fetch "app.js?v=${RELEASE_ID}" "$RUNNER_TEMP/app.js"
          fetch "seed-man-production-art.js?v=${RELEASE_ID}" "$RUNNER_TEMP/seed-man-production-art.js"
          fetch "input-guard-v1.js?v=${RELEASE_ID}" "$RUNNER_TEMP/input-guard-v1.js"
          fetch "seed-man.css?v=${RELEASE_ID}" "$RUNNER_TEMP/seed-man.css"
          fetch 'physics.mjs' "$RUNNER_TEMP/physics.mjs"
          fetch 'data/level-01.json' "$RUNNER_TEMP/data_level-01.json"
          node --check "$RUNNER_TEMP/app.js"
          node --check "$RUNNER_TEMP/seed-man-production-art.js"
          node --check "$RUNNER_TEMP/input-guard-v1.js"
          grep -Fq 'seed-man-production-v1' "$RUNNER_TEMP/seed-man-production-art.js"
          grep -Fq 'seed-man-locked-v1' "$RUNNER_TEMP/seed-man-production-art.js"
          grep -Fq 'sproutArtRoundedRect' "$RUNNER_TEMP/seed-man-production-art.js"
          node - <<'NODE' "$RUNNER_TEMP/data_level-01.json"
          const fs = require('fs');
          const level = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (level.worldWidth !== 7800) throw new Error(`live worldWidth=${level.worldWidth}`);
          if (level.requiredPickups !== 24) throw new Error(`live requiredPickups=${level.requiredPickups}`);
          if (level.pickups?.length !== 24) throw new Error(`live pickups=${level.pickups?.length}`);
          if (level.powerups?.length !== 7) throw new Error(`live powerups=${level.powerups?.length}`);
          if (level.checkpoints?.length !== 3) throw new Error(`live checkpoints=${level.checkpoints?.length}`);
          if (level.hazards?.length !== 15) throw new Error(`live hazards=${level.hazards?.length}`);
          NODE

      - name: Verify normal bare visitor URL
        id: bare
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -sS --location --retry 5 --retry-delay 4 --connect-timeout 10 --max-time 35 "$LIVE_URL" -o "$tmp/index.html"
          test -s "$tmp/index.html"
          for marker in \
            'Seed Man · Greenhouse Gauntlet' \
            '0 / 24' \
            'name="dtf-sprout-release" content="20260830-r3"' \
            '<script src="./app.js?v=20260830-r3" defer></script>' \
            '<script src="./seed-man-production-art.js?v=20260830-r3" defer></script>' \
            '<script src="./input-guard-v1.js?v=20260830-r3" defer></script>' \
            'seed-man.css?v=20260830-r3'; do
            grep -Fq "$marker" "$tmp/index.html" || { echo "Bare visitor URL is stale; missing: $marker" >&2; exit 1; }
          done
          for stale in 'collect all eight sprouts' '0 / 8' 'Original browser vertical slice'; do
            if grep -Fqi "$stale" "$tmp/index.html"; then
              echo "Bare visitor URL still serves retired content: $stale" >&2
              exit 1
            fi
          done
          curl -sS --location --connect-timeout 10 --max-time 35 "${LIVE_URL}app.js?v=${RELEASE_ID}" -o "$tmp/app.js"
          curl -sS --location --connect-timeout 10 --max-time 35 "${LIVE_URL}seed-man-production-art.js?v=${RELEASE_ID}" -o "$tmp/art.js"
          node --check "$tmp/app.js"
          node --check "$tmp/art.js"
          grep -Fq 'seed-man-production-v1' "$tmp/art.js"

      - name: Run live desktop and mobile browser acceptance
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run seed-man-live-browser-acceptance.yml --ref main)"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Could not parse live browser run id from $run_url" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --exit-status

      - name: Run live pixel rendering diagnostic
        id: render
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run seed-man-live-render-diagnostic.yml --ref main)"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Could not parse render diagnostic run id from $run_url" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --exit-status

      - name: Record production repair result
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOY_RUN: ${{ steps.deploy.outputs.run_id }}
          BROWSER_RUN: ${{ steps.browser.outputs.run_id }}
          RENDER_RUN: ${{ steps.render.outputs.run_id }}
          REGISTRY_CHANGED: ${{ steps.registry.outputs.changed }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          mkdir -p site/deployment/status
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              'schemaVersion': 1,
              'game': 'seed-man-platformer',
              'route': 'https://dtfseeds.com/games/seed-man-platformer/',
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'workflowStatus': os.environ.get('JOB_STATUS') or 'unknown',
              'registryChanged': os.environ.get('REGISTRY_CHANGED') == 'true',
              'deployRunId': os.environ.get('DEPLOY_RUN') or None,
              'browserAcceptanceRunId': os.environ.get('BROWSER_RUN') or None,
              'renderDiagnosticRunId': os.environ.get('RENDER_RUN') or None,
              'expectedRelease': '20260830-r3',
              'expectedEdition': 'greenhouse-gauntlet',
              'expectedWorldWidth': 7800,
              'expectedSprouts': 24,
              'expectedProductionArt': 'seed-man-production-v1'
          }
          Path('site/deployment/status/sprout-run-production.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
          git add site/deployment/status/sprout-run-production.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Sprout Run r3 production repair ${JOB_STATUS}"
          git push origin HEAD:main