name: Apply Seed Man Gameplay V2

on:
  push:
    branches: [main]
    paths:
      - '.github/seed-man-gameplay-v2-trigger.txt'
      - 'scripts/apply-seed-man-gameplay-v2.mjs'
      - '.github/workflows/apply-seed-man-gameplay-v2.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: apply-seed-man-gameplay-v2
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply gameplay v2 integration
        run: node scripts/apply-seed-man-gameplay-v2.mjs
      - name: Confirm gameplay integration is idempotent
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            site/public-route-patch/games/seed-man-platformer/index.html
            site/public-route-patch/games/seed-man-platformer/canvas-compat-v1.js
            site/public-route-patch/games/seed-man-platformer/seed-man-ui-v3.js
            scripts/publish-seed-man-route-via-wordpress.mjs
          )
          before="$(git diff -- "${paths[@]}" | git hash-object --stdin)"
          node scripts/apply-seed-man-gameplay-v2.mjs
          after="$(git diff -- "${paths[@]}" | git hash-object --stdin)"
          test "$before" = "$after"
      - name: Validate upgraded runtime syntax
        run: |
          node --check scripts/apply-seed-man-gameplay-v2.mjs
          node --check site/public-route-patch/games/seed-man-platformer/gameplay-v2.js
          node --check site/public-route-patch/games/seed-man-platformer/seed-man-ui-v3.js
          node --check scripts/publish-seed-man-route-via-wordpress.mjs
      - name: Run deterministic gameplay regression coverage
        run: |
          node games/seed-man-platformer/test/physics.test.mjs
          node games/seed-man-platformer/test/progression-systems.test.mjs
          node games/seed-man-platformer/test/campaign.test.mjs
          node games/seed-man-platformer/test/input-guard.test.mjs
      - name: Safely integrate gameplay upgrade when needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            site/public-route-patch/games/seed-man-platformer/index.html \
            site/public-route-patch/games/seed-man-platformer/canvas-compat-v1.js \
            site/public-route-patch/games/seed-man-platformer/seed-man-ui-v3.js \
            scripts/publish-seed-man-route-via-wordpress.mjs; then
            echo 'No integration changes were needed.'
            exit 0
          fi
          node scripts/studio/integrate-generated-change.mjs \
            --message='Integrate Seed Man canonical world identity into production route' \
            --paths=site/public-route-patch/games/seed-man-platformer/index.html,site/public-route-patch/games/seed-man-platformer/canvas-compat-v1.js,site/public-route-patch/games/seed-man-platformer/seed-man-ui-v3.js,scripts/publish-seed-man-route-via-wordpress.mjs
