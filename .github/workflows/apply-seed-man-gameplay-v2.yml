name: Apply Seed Man Gameplay V2

on:
  push:
    branches: [main]
    paths:
      - '.github/seed-man-gameplay-v2-trigger.txt'
      - 'scripts/apply-seed-man-gameplay-v2.mjs'
      - '.github/workflows/apply-seed-man-gameplay-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-seed-man-gameplay-v2
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply gameplay v2 integration
        run: node scripts/apply-seed-man-gameplay-v2.mjs
      - name: Validate upgraded runtime syntax
        run: |
          node --check site/public-route-patch/games/seed-man-platformer/gameplay-v2.js
          node --check games/seed-man-platformer/test/gameplay-v2-smoke.mjs
          node --check scripts/publish-seed-man-route-via-wordpress.mjs
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install chromium
      - name: Exercise gameplay v2 locally
        run: node games/seed-man-platformer/test/gameplay-v2-smoke.mjs
      - name: Commit integrated gameplay upgrade
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No integration changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/public-route-patch/games/seed-man-platformer/index.html \
                  site/public-route-patch/games/seed-man-platformer/canvas-compat-v1.js \
                  scripts/publish-seed-man-route-via-wordpress.mjs
          git commit -m 'Integrate Sprout Run gameplay v2 into production route'
          git pull --rebase origin main
          git push origin HEAD:main