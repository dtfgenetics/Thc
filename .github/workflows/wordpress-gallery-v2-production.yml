name: Verify DTFSeeds Gallery Visual V1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dtfseeds-gallery-visual-verification
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate canonical Gallery source ownership
        shell: bash
        run: |
          set -euo pipefail
          test -s site/wordpress/pages/gallery.html
          grep -Fq 'data-dtf-layout="gallery-visual-v1"' site/wordpress/pages/gallery.html
          grep -Fq 'class="dtf-v1"' site/wordpress/pages/gallery.html
          grep -Fq 'DTF Visual Library' site/wordpress/pages/gallery.html
          ! grep -Fq 'dtf-gallery-v2' site/wordpress/pages/gallery.html

      - name: Verify current visitor-facing Gallery
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/gallery.html"
          curl -4 -fsSL --retry 4 --retry-all-errors --retry-delay 3 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            -H 'Pragma: no-cache' \
            "$WP_SITE_URL/gallery/?dtf_gallery_visual=${GITHUB_RUN_ID}" -o "$body"
          grep -Fqi 'DTF Visual Library' "$body"
          grep -Fqi '/learn/infographics/' "$body"
          grep -Fqi '/seeds/' "$body"
          grep -Fqi '/tools/' "$body"
          grep -Fqi '/games/' "$body"
          grep -Fqi '/community/' "$body"
          for forbidden in \
            'dtf-gallery-v2' \
            'email@email.com' \
            '+123456789' \
            '© 2025 DTF Genetics'; do
            ! grep -Fqi "$forbidden" "$body" || { echo "Stale Gallery content remains: $forbidden" >&2; exit 1; }
          done
          echo 'Gallery is verified read-only. Canonical WordPress remains the sole production writer for /gallery/.' >> "$GITHUB_STEP_SUMMARY"
