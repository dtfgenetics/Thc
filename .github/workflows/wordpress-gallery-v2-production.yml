name: Publish DTFSeeds Gallery V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/wordpress/pages/gallery.html'
      - 'scripts/publish-wordpress-gallery-v2.mjs'
      - '.github/workflows/wordpress-gallery-v2-production.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-gallery-v2-production
  cancel-in-progress: false

env:
  WP_SITE_URL: https://dtfseeds.com

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      APPLY_GALLERY_V2: 'true'
      BACKUP_ROOT: ${{ runner.temp }}/dtf-gallery-v2

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Gallery V2 package
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          test -s site/wordpress/pages/gallery.html
          node --check scripts/publish-wordpress-gallery-v2.mjs
          grep -Fq 'dtf-gallery-v2' site/wordpress/pages/gallery.html
          grep -Fq 'DTF Visual Library' site/wordpress/pages/gallery.html

      - name: Publish Gallery V2
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-wordpress-gallery-v2.mjs | tee "$RUNNER_TEMP/gallery-v2.log"
          dir="$(cat "$BACKUP_ROOT/gallery-v2-backup-path.txt")"
          report="$dir/gallery-v2-report.json"
          echo "page_id=$(node -p "require(process.argv[1]).pageId" "$report")" >> "$GITHUB_OUTPUT"

      - name: Verify visitor-facing Gallery V2
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/gallery.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 -fsSL --retry 2 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
              "$WP_SITE_URL/gallery/?dtf_gallery_v2=${GITHUB_RUN_ID}-${attempt}" -o "$body"
            if grep -Fqi 'dtf-gallery-v2' "$body" && grep -Fqi 'DTF Visual Library' "$body"; then ok=1; break; fi
            sleep 7
          done
          [[ "$ok" -eq 1 ]] || { echo 'Gallery V2 marker not visible on public route' >&2; head -c 3500 "$body" >&2 || true; exit 1; }
          grep -Fqi '/learn/infographics/' "$body"
          grep -Fqi '/seeds/' "$body"
          grep -Fqi '/tools/' "$body"
          grep -Fqi '/games/' "$body"
          grep -Fqi '/community/' "$body"
          images="$(grep -o '/wp-content/uploads/' "$body" | wc -l | tr -d ' ')"
          [[ "$images" -ge 8 ]] || { echo "Gallery only exposes $images WordPress image references" >&2; exit 1; }
          for forbidden in 'email@email.com' '+123456789' '© 2025 DTF Genetics'; do
            ! grep -Fqi "$forbidden" "$body" || { echo "Stale content remains on Gallery: $forbidden" >&2; exit 1; }
          done
          echo "images=$images" >> "$GITHUB_OUTPUT"

      - name: Upload Gallery rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-gallery-v2-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_ROOT }}
          if-no-files-found: warn
          retention-days: 30

      - name: Report Gallery production result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          PUBLISH: ${{ steps.publish.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          PAGE_ID: ${{ steps.publish.outputs.page_id }}
          IMAGES: ${{ steps.verify.outputs.images }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## DTFSeeds Gallery V2 production',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.STATUS}**`,
                `Gallery write: **${process.env.PUBLISH || 'not-run'}**`,
                `Visitor verification: **${process.env.VERIFY || 'not-run'}**`,
                `Gallery page ID: **${process.env.PAGE_ID || 'not-reported'}**`,
                `Live WordPress image references: **${process.env.IMAGES || 'not-reported'}**`,
                '',
                'Success means the image-first Gallery V2 source is published and visible on the real public /gallery/ route with rollback evidence preserved.'
              ].join('\n')
            });
