name: Verify THC Grow Doc Production Identity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/verify-grow-doc-production.mjs
      - .github/workflows/verify-grow-doc-production.yml
  workflow_run:
    workflows: ["Deploy DTFSeeds Public Suite via WordPress V2"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-thc-grow-doc-production-identity
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://dtfseeds.com
    steps:
      - name: Checkout current verification source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Grow Doc production verifier
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-grow-doc-production.mjs

      - name: Verify live React application identity
        shell: bash
        env:
          DTF_GROW_DOC_REPORT: ${{ runner.temp }}/grow-doc-production-identity.json
        run: |
          set -euo pipefail
          node scripts/verify-grow-doc-production.mjs
