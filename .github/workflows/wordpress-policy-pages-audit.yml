name: Audit DTFSeeds Policy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit-wordpress-policy-pages.mjs
      - .github/workflows/wordpress-policy-pages-audit.yml

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
      WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
      POLICY_AUDIT_ROOT: /tmp/dtf-policy-audit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate policy audit
        run: node --check scripts/audit-wordpress-policy-pages.mjs
      - name: Inspect WordPress and WooCommerce policy state
        id: audit
        run: node scripts/audit-wordpress-policy-pages.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-pages-audit-${{ github.run_id }}
          path: /tmp/dtf-policy-audit
          if-no-files-found: warn
          retention-days: 14
      - name: Report policy audit
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body=[
              '## DTFSeeds commerce policy audit','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.JOB_STATUS}**`,
              `Policy-state audit: **${process.env.AUDIT_OUTCOME || 'not-run'}**`,'',
              'Read-only check of existing WordPress pages and WooCommerce page-related settings before policy pages are created or assigned.'
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body});
