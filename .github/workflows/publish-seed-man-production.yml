name: Publish Seed Man Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-seed-man-production.yml
      - scripts/publish-seed-man-route-via-wordpress.mjs
      - site/public-route-patch/games/seed-man-platformer/**

permissions:
  actions: write
  contents: read

concurrency:
  group: publish-seed-man-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate complete Seed Man release bundle
        shell: bash
        run: |
          set -euo pipefail
          root=site/public-route-patch/games/seed-man-platformer
          required=(
            .htaccess index.html app.js canvas-compat-v1.js campaign-v1.js
            seed-man-production-art.js gameplay-v2.js input-guard-v1.js seed-man.css
            physics.mjs data/campaign.json data/level-01.json
          )
          for file in "${required[@]}"; do
            test -s "$root/$file" || { echo "Missing $file" >&2; exit 1; }
          done

          release="$(sed -n 's/.*name="dtf-sprout-release" content="\([^"]*\)".*/\1/p' "$root/index.html" | head -n 1)"
          [[ "$release" =~ ^[0-9]{8}-r[0-9]+$ ]] || { echo "Invalid Sprout Run release marker: $release" >&2; exit 1; }
          echo "SPROUT_RELEASE=$release" >> "$GITHUB_ENV"

          grep -Fq 'Seed Man · Greenhouse Gauntlet' "$root/index.html"
          grep -Fq '0 / 24' "$root/index.html"
          grep -Fq 'JUMP ×2' "$root/index.html"
          grep -Fq 'stomp pests from above' "$root/index.html"
          grep -Fq "./gameplay-v2.js?v=$release" "$root/index.html"
          grep -Fq "./campaign-v1.js?v=$release" "$root/index.html"
          grep -Fq "name=\"dtf-sprout-release\" content=\"$release\"" "$root/index.html"
          ! grep -Fq 'Original browser vertical slice' "$root/index.html"
          ! grep -Fq '0 / 8' "$root/index.html"

          node --check "$root/app.js"
          node --check "$root/canvas-compat-v1.js"
          node --check "$root/campaign-v1.js"
          node --check "$root/seed-man-production-art.js"
          node --check "$root/gameplay-v2.js"
          node --check "$root/input-guard-v1.js"
          node --check scripts/publish-seed-man-route-via-wordpress.mjs

          grep -Fq 'sprout-run-gameplay-v2' "$root/gameplay-v2.js"
          grep -Fq 'movingPlatformDefs' "$root/gameplay-v2.js"
          grep -Fq 'pestDefs' "$root/gameplay-v2.js"
          grep -Fq 'bouncePads' "$root/gameplay-v2.js"
          grep -Fq 'sprout-campaign-v1' "$root/campaign-v1.js"
          grep -Fq '"id": "sprout-run-campaign"' "$root/data/campaign.json"

      - name: Atomically publish complete route and purge caches
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-seed-man-route-via-wordpress.mjs | tee "$RUNNER_TEMP/seed-man-publish.json"
          node - "$RUNNER_TEMP/seed-man-publish.json" "$SPROUT_RELEASE" <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync(process.argv[2], 'utf8');
          const marker = '{\n  "ok": true';
          const start = text.indexOf(marker);
          if (start < 0) throw new Error('Could not find Seed Man publisher JSON result.');
          let depth = 0;
          let inString = false;
          let escaped = false;
          let end = -1;
          for (let i = start; i < text.length; i += 1) {
            const ch = text[i];
            if (inString) {
              if (escaped) escaped = false;
              else if (ch === '\\') escaped = true;
              else if (ch === '"') inString = false;
              continue;
            }
            if (ch === '"') inString = true;
            else if (ch === '{') depth += 1;
            else if (ch === '}') {
              depth -= 1;
              if (depth === 0) { end = i + 1; break; }
            }
          }
          if (end < 0) throw new Error('Publisher JSON result was incomplete.');
          const result = JSON.parse(text.slice(start, end));
          if (result.server_verified !== true) throw new Error('Server-side SHA verification did not pass.');
          if (result.release !== process.argv[3]) throw new Error(`Published ${result.release}; expected ${process.argv[3]}`);
          if (!result.files?.['gameplay-v2.js']) throw new Error('gameplay-v2.js was not published.');
          if (!result.files?.['campaign-v1.js']) throw new Error('campaign-v1.js was not published.');
          if (!result.files?.['data/campaign.json']) throw new Error('data/campaign.json was not published.');
          NODE

      - name: Verify current release on visitor route and assets
        shell: bash
        run: |
          set -euo pipefail
          url='https://dtfseeds.com/games/seed-man-platformer/'
          verify_body() {
            local body="$1"
            grep -Fq 'Seed Man · Greenhouse Gauntlet' "$body"
            grep -Fq '0 / 24' "$body"
            grep -Fq 'JUMP ×2' "$body"
            grep -Fq 'stomp pests from above' "$body"
            grep -Fq "./gameplay-v2.js?v=$SPROUT_RELEASE" "$body"
            grep -Fq "./campaign-v1.js?v=$SPROUT_RELEASE" "$body"
            grep -Fq "name=\"dtf-sprout-release\" content=\"$SPROUT_RELEASE\"" "$body"
            ! grep -Fq 'Original browser vertical slice' "$body"
            ! grep -Fq '0 / 8' "$body"
          }

          ok=0
          for attempt in {1..15}; do
            body="$RUNNER_TEMP/live.html"
            headers="$RUNNER_TEMP/live.headers"
            if curl -4 --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 45 \
              -D "$headers" -o "$body" \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' "$url" && verify_body "$body"; then
              ok=1
              break
            fi
            echo "Visitor URL attempt $attempt is still stale."
            grep -Ei '^(age|cache-control|cf-cache-status|x-litespeed-cache|x-litespeed-cache-control|x-cache|x-hostinger-cache):' "$headers" || true
            sleep $((attempt * 2))
          done
          test "$ok" = 1 || { echo 'Public Seed Man route did not update.' >&2; cat "$RUNNER_TEMP/live.headers" >&2 || true; exit 1; }

          assets=(
            app.js canvas-compat-v1.js campaign-v1.js seed-man-production-art.js
            gameplay-v2.js input-guard-v1.js seed-man.css physics.mjs
            data/campaign.json data/level-01.json
          )
          for asset in "${assets[@]}"; do
            outfile="$RUNNER_TEMP/$(echo "$asset" | tr '/' '_')"
            curl -4 --fail --silent --show-error --location \
              --retry 4 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 45 \
              "${url}${asset}?release=${SPROUT_RELEASE}-${GITHUB_RUN_ID}" -o "$outfile"
          done

          grep -Fq 'sprout-run-gameplay-v2' "$RUNNER_TEMP/gameplay-v2.js"
          grep -Fq 'movingPlatformDefs' "$RUNNER_TEMP/gameplay-v2.js"
          grep -Fq 'pestDefs' "$RUNNER_TEMP/gameplay-v2.js"
          grep -Fq 'bouncePads' "$RUNNER_TEMP/gameplay-v2.js"
          grep -Fq 'sprout-campaign-v1' "$RUNNER_TEMP/campaign-v1.js"
          grep -Fq 'seed-man-production-v1' "$RUNNER_TEMP/seed-man-production-art.js"
          grep -Fq 'willReadFrequently' "$RUNNER_TEMP/canvas-compat-v1.js"
          grep -Fq '"worldWidth": 7800' "$RUNNER_TEMP/data_level-01.json"
          grep -Fq '"requiredPickups": 24' "$RUNNER_TEMP/data_level-01.json"
          grep -Fq '"id": "sprout-run-campaign"' "$RUNNER_TEMP/data_campaign.json"

      - name: Run live browser gameplay acceptance
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run seed-man-live-browser-acceptance.yml --ref main)"
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Could not parse browser acceptance run: $run_url" >&2; exit 1; }
          echo "Live browser acceptance run: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Production summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Seed Man production publish'
            echo
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Release: \`$SPROUT_RELEASE\`"
            echo '- Route: https://dtfseeds.com/games/seed-man-platformer/'
            echo '- Bundle: gameplay v2 + campaign runtime + current level data'
            echo '- Publication: atomic replacement with SHA-256 verification'
            echo '- Cache: LiteSpeed route purge + purge-all + WordPress cache flush'
            echo '- Live gate: current release and gameplay-v2 markers required; retired 8-sprout build rejected'
          } >> "$GITHUB_STEP_SUMMARY"
