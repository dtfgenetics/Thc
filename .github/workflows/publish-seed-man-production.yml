name: Publish Seed Man Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-seed-man-production.yml'
      - 'site/deployment/release-resources.json'
      - 'scripts/publish-seed-man-route-via-wordpress.mjs'
      - 'scripts/verify-seed-man-production-v20.mjs'
      - 'scripts/validate-seed-man-production-bundle.mjs'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'games/seed-man-platformer/**'

permissions:
  contents: read

concurrency:
  group: publish-seed-man-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install current Seed Man dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f games/seed-man-platformer/package.json ]; then
            npm install --prefix games/seed-man-platformer --ignore-scripts --no-audit --no-fund
          fi

      - name: Validate current Seed Man route
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          root='site/public-route-patch/games/seed-man-platformer'
          test -s "$root/index.html"
          node scripts/verify-seed-man-production-v20.mjs "$root"
          node scripts/validate-seed-man-production-bundle.mjs "$root"
          node --check scripts/publish-seed-man-route-via-wordpress.mjs
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find "$root" -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          node - "$root" <<'NODE'
          const fs=require('fs');const path=require('path');const root=process.argv[2];
          function walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(e.isFile()&&e.name.endsWith('.json'))JSON.parse(fs.readFileSync(p,'utf8'));}}
          walk(root);
          NODE

      - name: Publish current Seed Man route
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-seed-man-route-via-wordpress.mjs | tee "$RUNNER_TEMP/seed-man-publish.json"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/seed-man-publish.json"
          grep -Eq '"server_verified"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/seed-man-publish.json"

      - name: Verify live route and local references
        shell: bash
        run: |
          set -euo pipefail
          base='https://dtfseeds.com/games/seed-man-platformer/'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -4 -fsS --retry 10 --retry-delay 4 --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}?dtf_verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o "$tmp/index.html"
          test -s "$tmp/index.html"
          node - "$tmp/index.html" "$base" <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync(process.argv[2],'utf8');
          const base=process.argv[3];
          const refs=[];const re=/\b(?:src|href)=["']([^"']+)["']/gi;
          for(const m of html.matchAll(re)){const raw=m[1];if(!raw||raw.startsWith('#')||raw.startsWith('/')||/^[a-z][a-z0-9+.-]*:/i.test(raw)||raw.startsWith('//'))continue;refs.push(raw.split(/[?#]/,1)[0].replace(/^\.\//,''));}
          console.log(JSON.stringify([...new Set(refs)]));
          NODE
          refs="$(node - "$tmp/index.html" <<'NODE'
          const fs=require('fs');const html=fs.readFileSync(process.argv[2],'utf8');const out=[];const re=/\b(?:src|href)=["']([^"']+)["']/gi;for(const m of html.matchAll(re)){const raw=m[1];if(!raw||raw.startsWith('#')||raw.startsWith('/')||/^[a-z][a-z0-9+.-]*:/i.test(raw)||raw.startsWith('//'))continue;out.push(raw.split(/[?#]/,1)[0].replace(/^\.\//,''));}process.stdout.write([...new Set(out)].join('\n'));
          NODE
          )"
          while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            status="$(curl -4 -sS --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache, no-store, max-age=0' -o /dev/null -w '%{http_code}' "${base}${rel}?dtf_verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
            [[ "$status" == '200' ]] || { echo "live referenced asset failed: $rel -> HTTP $status" >&2; exit 1; }
          done <<< "$refs"

      - name: Release summary
        if: always()
        run: |
          {
            echo '## Seed Man production release'
            echo '- Publisher: route-directory driven; no fixed renderer, art pack, campaign count, boss list, or backend contract'
            echo '- Validation: current entrypoint, referenced local files, JavaScript syntax, JSON parsing, atomic publish integrity, live HTTP checks'
            echo '- Visual/runtime architecture remains editable during redesign'
          } >> "$GITHUB_STEP_SUMMARY"
