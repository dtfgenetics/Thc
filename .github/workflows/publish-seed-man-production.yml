name: Publish Seed Man Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-seed-man-production.yml'
      - 'scripts/publish-seed-man-route-via-wordpress.mjs'
      - 'scripts/verify-seed-man-production-v20.mjs'
      - 'site/public-route-patch/games/seed-man-platformer/**'

permissions:
  contents: read

concurrency:
  group: publish-seed-man-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Seed Man v20 production contract
        run: |
          set -euo pipefail
          node scripts/verify-seed-man-production-v20.mjs
          root='site/public-route-patch/games/seed-man-platformer'
          node --check "$root/app.js"
          node --check "$root/canvas-compat-v1.js"
          node --check "$root/campaign-v1.js"
          node --check "$root/campaign-runtime-v20.js"
          node --check "$root/campaign-ui-v20.js"
          node --check "$root/approved-art-core-v1.js"
          node --check "$root/approved-art-runtime-v1.js"
          node --check "$root/seed-man-production-art.js"
          node --check "$root/gameplay-v2.js"
          node --check "$root/combat-browser-v1.js"
          node --check "$root/enemy-attacks-browser-v1.js"
          node --check "$root/world-five-v1.js"
          node --check scripts/publish-seed-man-route-via-wordpress.mjs
          grep -Fq "campaignTarget:20" "$root/world-five-v1.js"
          grep -Fq "campaignTarget:20" "$root/canvas-compat-v1.js"
          grep -Fq "seed-man-campaign-ui-v20" "$root/campaign-ui-v20.js"
          grep -Fq "seed-man-campaign-v20-runtime-v1" "$root/campaign-runtime-v20.js"
          grep -Fq "approved-showcase-2026-09-08" "$root/seed-man-production-art.js"
          grep -Fq "fallbackAllowed:false" "$root/seed-man-production-art.js"
          ! grep -Fq 'Genome Hydra' "$root/world-five-v1.js"
          ! grep -Fq 'Voltage Wasp Alpha' "$root/world-five-v1.js"

      - name: Atomically publish complete v20 route
        run: node scripts/publish-seed-man-route-via-wordpress.mjs | tee "$RUNNER_TEMP/seed-man-publish.json"

      - name: Verify live v20 route and approved art
        shell: bash
        run: |
          set -euo pipefail
          base='https://dtfseeds.com/games/seed-man-platformer/'
          ok=0
          for attempt in {1..15}; do
            campaign="$(curl -4 --fail --silent --show-error --location -H 'Cache-Control: no-cache, no-store' "${base}data/campaign.json?run=${GITHUB_RUN_ID}-${attempt}" || true)"
            levels="$(curl -4 --fail --silent --show-error --location -H 'Cache-Control: no-cache, no-store' "${base}data/levels-20-v1.json?run=${GITHUB_RUN_ID}-${attempt}" || true)"
            runtime="$(curl -4 --fail --silent --show-error --location -H 'Cache-Control: no-cache, no-store' "${base}campaign-runtime-v20.js?run=${GITHUB_RUN_ID}-${attempt}" || true)"
            worldfive="$(curl -4 --fail --silent --show-error --location -H 'Cache-Control: no-cache, no-store' "${base}world-five-v1.js?run=${GITHUB_RUN_ID}-${attempt}" || true)"
            art="$(curl -4 --fail --silent --show-error --location -H 'Cache-Control: no-cache, no-store' "${base}seed-man-production-art.js?run=${GITHUB_RUN_ID}-${attempt}" || true)"
            core="$(curl -4 --fail --silent --show-error --location -H 'Cache-Control: no-cache, no-store' "${base}approved-art-core-v1.js?run=${GITHUB_RUN_ID}-${attempt}" || true)"
            if grep -Fq '"levelCount": 20' <<<"$campaign" \
              && grep -Fq '"finalBoss": "blight-king"' <<<"$campaign" \
              && grep -Fq '"order":20' <<<"$levels" \
              && grep -Fq 'seed-man-campaign-v20-runtime-v1' <<<"$runtime" \
              && grep -Fq 'campaignTarget:20' <<<"$worldfive" \
              && grep -Fq 'approved-showcase-2026-09-08' <<<"$art" \
              && grep -Fq 'character.seedman.atlas' <<<"$core"; then
              ok=1
              break
            fi
            echo "Live Seed Man route is still stale on attempt $attempt"
            sleep $((attempt * 2))
          done
          test "$ok" = 1 || { echo 'Seed Man v20 did not become visible on the live route.' >&2; exit 1; }
          echo 'Seed Man v20 approved-art release is live and verified.'

      - name: Release summary
        if: always()
        run: |
          {
            echo '## Seed Man production release'
            echo '- Campaign: 20 levels / 5 worlds'
            echo '- Final boss: Blight King'
            echo '- Character contract: green armored plant hero'
            echo '- Approved art: 2026-09-08 showcase'
            echo '- Verification: deterministic Node contract + live HTTP asset checks'
            echo '- Playwright: not used'
          } >> "$GITHUB_STEP_SUMMARY"
