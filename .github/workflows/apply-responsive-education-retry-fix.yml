name: Apply Responsive Education Retry Fix

on:
  push:
    branches:
      - fix/responsive-education-hostinger-retries-20260830
    paths:
      - '.github/workflows/apply-responsive-education-retry-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden responsive education WordPress requests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/optimize-wordpress-infographic-page-images.mjs')
          text = path.read_text()
          text = text.replace("import { mkdir, readFile, writeFile } from 'node:fs/promises';\n", "import dns from 'node:dns';\nimport { mkdir, readFile, writeFile } from 'node:fs/promises';\n", 1)
          marker = "const SELF_TEST = process.argv.includes('--self-test');\n"
          if "dns.setDefaultResultOrder('ipv4first');" not in text:
              text = text.replace(marker, "dns.setDefaultResultOrder('ipv4first');\n\n" + marker, 1)

          old = '''async function request(path, options = {}) {
            const response = await fetch(`${siteUrl}${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
              redirect: 'follow',
              signal: AbortSignal.timeout(60_000)
            });
            const text = await response.text();
            let body = null;
            try { body = text ? JSON.parse(text) : null; } catch { body = text; }
            if (!response.ok) throw new Error(`${options.method || 'GET'} ${path} failed (${response.status}): ${typeof body === 'string' ? body.slice(0, 500) : JSON.stringify(body).slice(0, 500)}`);
            return body;
          }
          '''
          new = '''const transientStatuses = new Set([408, 425, 429, 500, 502, 503, 504]);
          const transientCodes = new Set(['ETIMEDOUT', 'ECONNRESET', 'ECONNREFUSED', 'EAI_AGAIN', 'ENETUNREACH', 'EHOSTUNREACH', 'UND_ERR_CONNECT_TIMEOUT', 'UND_ERR_HEADERS_TIMEOUT', 'UND_ERR_SOCKET']);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          function errorCode(error) {
            return error?.code || error?.cause?.code || error?.cause?.errors?.find?.((entry) => entry?.code)?.code || '';
          }

          function isTransientError(error) {
            const status = Number(error?.status || 0);
            return transientStatuses.has(status)
              || error instanceof TypeError
              || error?.name === 'TimeoutError'
              || error?.name === 'AbortError'
              || transientCodes.has(errorCode(error));
          }

          function retryDelay(attempt) {
            return Math.min(12_000, 1200 + attempt * 1800);
          }

          async function request(path, options = {}, attempts = 8) {
            const method = String(options.method || 'GET').toUpperCase();
            let lastError = null;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(`${siteUrl}${path}`, {
                  ...options,
                  headers: { ...headers, ...(options.headers || {}) },
                  redirect: 'follow',
                  signal: AbortSignal.timeout(60_000)
                });
                const text = await response.text();
                let body = null;
                try { body = text ? JSON.parse(text) : null; } catch { body = text; }
                if (!response.ok) {
                  const error = new Error(`${method} ${path} failed (${response.status}): ${typeof body === 'string' ? body.slice(0, 500) : JSON.stringify(body).slice(0, 500)}`);
                  error.status = response.status;
                  throw error;
                }
                return body;
              } catch (error) {
                lastError = error;
                if (!isTransientError(error) || attempt >= attempts) throw error;
                const delay = retryDelay(attempt);
                console.warn(`[responsive-education-retry] ${method} ${path} failed with ${errorCode(error) || error?.name || error?.status || 'transient error'}; retrying ${attempt}/${attempts} in ${delay}ms`);
                await sleep(delay);
              }
            }
            throw lastError || new Error(`${method} ${path} failed after ${attempts} attempts`);
          }
          '''
          if old not in text:
              raise SystemExit('request function block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node --check scripts/optimize-wordpress-infographic-page-images.mjs
          node scripts/optimize-wordpress-infographic-page-images.mjs --self-test
          grep -Fq 'responsive-education-retry' scripts/optimize-wordpress-infographic-page-images.mjs
          grep -Fq "ECONNREFUSED" scripts/optimize-wordpress-infographic-page-images.mjs
      - name: Commit retry hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dtf-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/optimize-wordpress-infographic-page-images.mjs
          git commit -m 'Retry responsive education WordPress requests'
          git push origin HEAD:${GITHUB_REF_NAME}
