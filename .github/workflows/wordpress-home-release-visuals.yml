name: Reconcile DTF Homepage Release Visuals

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-home-release-visuals
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_HOME_RELEASE_VISUALS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate release visual inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/fix-wordpress-home-release-visuals.mjs
          node --check scripts/flush-hostinger-litespeed-mcp.mjs
          node --check scripts/wordpress-transient-fetch-bootstrap.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('site/wordpress/products/strain-card-images.json', 'utf8'));
          if (!Array.isArray(data.cards) || data.cards.length !== 3) throw new Error('Expected exactly three current release-card records');
          for (const card of data.cards) {
            for (const key of ['productSlug','wordpressSlug','sourceUrl','altText','expectedWidth','expectedHeight']) {
              if (!card[key]) throw new Error(`Missing ${key} for ${card.registryId || 'unknown card'}`);
            }
            if (Number(card.expectedWidth) !== 1024 || Number(card.expectedHeight) !== 1536) {
              throw new Error(`Unexpected reviewed strain-card dimensions for ${card.registryId}`);
            }
          }
          console.log('Release-card registry validated.');
          NODE

      - name: Apply exact strain cards to homepage current releases
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-transient-fetch-bootstrap.mjs scripts/fix-wordpress-home-release-visuals.mjs | tee "$RUNNER_TEMP/home-release-visuals.log"
          grep -Fq '"apply": true' "$RUNNER_TEMP/home-release-visuals.log" || grep -Fq '"apply":true' "$RUNNER_TEMP/home-release-visuals.log"

      - name: Purge Hostinger LiteSpeed cache
        shell: bash
        run: |
          set -euo pipefail
          node scripts/flush-hostinger-litespeed-mcp.mjs

      - name: Verify visitor-facing homepage release artwork
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          (async () => {
            const registry = JSON.parse(fs.readFileSync('site/wordpress/products/strain-card-images.json', 'utf8'));
            let last = null;
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              const url = `https://dtfseeds.com/?dtf_release_visuals=${Date.now()}-${attempt}`;
              try {
                const response = await fetch(url, {
                  headers: {
                    'Cache-Control': 'no-cache, no-store, max-age=0',
                    Pragma: 'no-cache',
                    'User-Agent': 'DTFSeeds-Release-Visual-Verify/1.1'
                  },
                  redirect: 'follow',
                  signal: AbortSignal.timeout(45_000)
                });
                const html = await response.text();
                const start = html.indexOf('Current releases');
                const end = html.indexOf('Teaching Healthy Cultivation', start + 1);
                const section = start >= 0 && end > start ? html.slice(start, end) : '';
                const classCount = (section.match(/dtf-release-card-image/g) || []).length;
                const routesOk = registry.cards.every((card) => section.includes(`/product/${card.productSlug}/`));
                const altOk = registry.cards.every((card) => section.includes(card.altText));
                const portraitOk = section.includes('aspect-ratio:2/3') && section.includes('object-fit:contain');
                last = { attempt, status: response.status, classCount, routesOk, altOk, portraitOk };
                if (response.ok && classCount === registry.cards.length && routesOk && altOk && portraitOk) {
                  console.log(`Verified ${registry.cards.length} exact portrait strain cards on public homepage on attempt ${attempt}.`);
                  return;
                }
              } catch (error) {
                last = { attempt, error: error instanceof Error ? error.message : String(error) };
              }
              if (attempt < 8) await sleep(Math.min(8000, 1500 + attempt * 900));
            }
            throw new Error(`Homepage release artwork did not converge after cache purge: ${JSON.stringify(last)}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Report homepage release visual reconciliation
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
        with:
          script: |
            const source = context.eventName === 'workflow_call'
              ? 'Learning Experience V3 reusable-workflow handoff'
              : 'manual dispatch';
            const body = [
              '## Homepage release-card visual reconciliation',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `Source: ${source}`,
              '',
              'This final-owner guard is called directly from Learning Experience V3, maps the three current homepage release cards to the exact reviewed WordPress strain-card media from strain-card-images.json, preserves the 2:3 portrait artwork without cropping, purges Hostinger/LiteSpeed, and polls the cache-busted public homepage until the final artwork is visible or the strict verification window expires.'
            ].join('\n');
            try {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 220, body });
            } catch (error) {
              core.warning(`Homepage release visual advisory report could not be posted: ${error.message}`);
            }
