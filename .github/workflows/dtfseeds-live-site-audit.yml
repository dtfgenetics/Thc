name: DTFSeeds Live-Site Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches:
      - main
    paths:
      - scripts/audit-dtfseeds-live.mjs
      - scripts/audit-dtfseeds-public-suite.mjs
      - scripts/audit-dtfseeds-commerce.mjs
      - .github/workflows/dtfseeds-live-site-audit.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-live-site-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit core public routes and metadata
        id: core
        shell: bash
        run: |
          set +e
          node scripts/audit-dtfseeds-live.mjs
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit expanded public application suite
        id: suite
        shell: bash
        run: |
          set +e
          node scripts/audit-dtfseeds-public-suite.mjs
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit WooCommerce genetics storefront
        id: commerce
        shell: bash
        run: |
          set +e
          node scripts/audit-dtfseeds-commerce.mjs
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish core audit summary
        if: always()
        shell: bash
        run: cat live-site-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add suite audit status
        if: always()
        shell: bash
        run: |
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## Expanded public-suite audit' >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ steps.suite.outputs.status == '0' && 'PASS' || 'FAIL' }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Checks: Crossword, Who Took It, GrowLens, Grow Doc, Tools, Projects, and current crossword puzzle data.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish commerce audit summary
        if: always()
        shell: bash
        run: |
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat commerce-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine-readable and human-readable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtfseeds-live-site-audit-${{ github.run_id }}
          path: |
            live-site-audit.json
            live-site-audit.md
            commerce-audit.json
            commerce-audit.md
          if-no-files-found: error
          retention-days: 30

      - name: Report audit result to production issue
        if: always()
        uses: actions/github-script@v7
        env:
          CORE: ${{ steps.core.outputs.status }}
          SUITE: ${{ steps.suite.outputs.status }}
          COMMERCE: ${{ steps.commerce.outputs.status }}
        with:
          script: |
            const pass = (v) => v === '0' ? 'PASS' : 'FAIL';
            const overall = process.env.CORE === '0' && process.env.SUITE === '0' && process.env.COMMERCE === '0' ? 'PASS' : 'FAIL';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Final DTFSeeds production audit',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Overall: **${overall}**`,
                `Core public routes and metadata: **${pass(process.env.CORE)}**`,
                `Expanded apps/tools suite: **${pass(process.env.SUITE)}**`,
                `WooCommerce genetics storefront: **${pass(process.env.COMMERCE)}**`,
                '',
                'Audit artifacts contain the machine-readable and human-readable route and commerce reports.'
              ].join('\n')
            });

      - name: Fail when the live site does not meet the production gate
        if: steps.core.outputs.status != '0' || steps.suite.outputs.status != '0' || steps.commerce.outputs.status != '0'
        run: exit 1

# Forced after the completed THC education, presentation, and commerce reconciliation pass.
