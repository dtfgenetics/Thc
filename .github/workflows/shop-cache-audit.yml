name: Audit DTFSeeds Shop Cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit-shop-cache.mjs
      - .github/workflows/shop-cache-audit.yml

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      SHOP_CACHE_AUDIT_ROOT: /tmp/dtf-shop-cache-audit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate audit
        run: node --check scripts/audit-shop-cache.mjs
      - name: Compare live Shop and WooCommerce source
        id: audit
        run: node scripts/audit-shop-cache.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shop-cache-audit-${{ github.run_id }}
          path: /tmp/dtf-shop-cache-audit
          if-no-files-found: warn
          retention-days: 14
      - name: Report result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body=[
              '## DTFSeeds Shop cache audit','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.JOB_STATUS}**`,
              `Public cache comparison: **${process.env.AUDIT_OUTCOME || 'not-run'}**`,'',
              'This is read-only and compares the WooCommerce Store API, the canonical /shop/ response, and a cache-busted /shop/ response.'
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body});
