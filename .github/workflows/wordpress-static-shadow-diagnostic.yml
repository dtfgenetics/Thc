name: Diagnose DTFSeeds Static Shadow Files

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/diagnose-static-shadow-files-via-wordpress.mjs
      - .github/workflows/wordpress-static-shadow-diagnostic.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-static-shadow-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect known filesystem shadow candidates
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/diagnose-static-shadow-files-via-wordpress.mjs
          node scripts/diagnose-static-shadow-files-via-wordpress.mjs | tee "$RUNNER_TEMP/shadow-files.json"
      - name: Report sanitized filesystem diagnostic
        if: always()
        uses: actions/github-script@v7
        env:
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
        with:
          script: |
            const fs = require('fs');
            let data = {};
            const file = process.env.RUNNER_TEMP + '/shadow-files.json';
            if (fs.existsSync(file)) {
              const lines = fs.readFileSync(file, 'utf8').trim().split(/\r?\n/);
              for (let i = lines.length - 1; i >= 0; i--) {
                try { data = JSON.parse(lines[i]); break; } catch {}
              }
            }
            const existing = Array.isArray(data.files) ? data.files.filter(x => x.exists) : [];
            const rows = existing.length
              ? existing.map(x => `| \`${x.rel}\` | ${x.size ?? '?'} | ${x.writable ? 'yes' : 'no'} | ${x.dir_writable ? 'yes' : 'no'} | ${(x.matches || []).join(', ') || 'none'} |`).join('\n')
              : '| none | - | - | - | - |';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Static-shadow filesystem diagnostic',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.INSPECT_OUTCOME || 'unknown'}**`,
                `WordPress index.php present: **${data.wordpress_index_php_exists ?? 'unknown'}**`,
                '',
                '| Candidate | Bytes | File writable | Directory writable | Known markers |',
                '|---|---:|---|---|---|',
                rows,
                '',
                'Read-only inspection of only the known root, Learn, and infographic index/default candidates. No static file was changed.'
              ].join('\n')
            });

# Diagnostic trigger: inspect current public-root shadow candidates.
