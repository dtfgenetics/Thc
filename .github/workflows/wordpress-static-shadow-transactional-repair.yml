name: Repair DTFSeeds Static Shadows Through WordPress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/repair-static-shadows-via-wordpress.mjs
      - scripts/run-static-shadow-repair-resilient.mjs
      - scripts/run-static-shadow-repair-current-markers.sh
      - scripts/wordpress-ipv4-fetch-bootstrap.mjs
      - .github/workflows/wordpress-static-shadow-transactional-repair.yml

permissions:
  contents: read

concurrency:
  group: dtfseeds-wordpress-static-shadow-transaction
  cancel-in-progress: false

jobs:
  repair:
    name: Transactionally retire stale static route shadows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repair implementation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/repair-static-shadows-via-wordpress.mjs
          node --check scripts/run-static-shadow-repair-resilient.mjs
          node --check scripts/wordpress-ipv4-fetch-bootstrap.mjs
          bash -n scripts/run-static-shadow-repair-current-markers.sh
          grep -Fq 'Genetics first. Cultivation science behind it.' scripts/run-static-shadow-repair-current-markers.sh
          grep -Fq 'Learn the plant as a connected system.' scripts/run-static-shadow-repair-current-markers.sh
          grep -Fq 'DTF Genetics catalog pages built around strain identity and grow context.' scripts/run-static-shadow-repair-current-markers.sh
          grep -Fq 'DTF Genetics library' scripts/run-static-shadow-repair-current-markers.sh
          grep -Fq "'rel' => 'seeds/index.html'" scripts/run-static-shadow-repair-current-markers.sh
          grep -Fq "return \$supplied !== '' && hash_equals(\$token, \$supplied);" scripts/run-static-shadow-repair-current-markers.sh
          grep -Fq 'node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs "$runner"' scripts/run-static-shadow-repair-current-markers.sh
          grep -Fq 'const responseBody = [204, 205, 304].includes(status) ? null : Buffer.concat(chunks);' scripts/wordpress-ipv4-fetch-bootstrap.mjs

      - name: Execute transactional repair through authenticated WordPress
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-static-shadow-repair-current-markers.sh

      - name: Final independent visitor verification
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local path="$1"
            local marker="$2"
            local body="$RUNNER_TEMP/final-$(printf '%s' "$path" | tr '/?' '__').html"
            local ok=0
            for attempt in 1 2 3 4 5 6; do
              if curl -4 -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "https://dtfseeds.com${path}?dtf_final_shadow_verify=${GITHUB_RUN_ID}-${attempt}" \
                -o "$body"; then
                if grep -Fqi -- "$marker" "$body"; then
                  ok=1
                  break
                fi
              fi
              sleep 5
            done
            [[ "$ok" -eq 1 ]] || {
              echo "Expected current marker is still absent from $path" >&2
              head -c 2500 "$body" >&2 || true
              return 1
            }
            for stale in \
              'THC Grow Doc, genetics, cultivation education, and games in one home.' \
              'Grow education belongs in a clean, readable library.' \
              'MOPS, cultivation notes, THC basics' \
              'being rebuilt' \
              'Reserved strain card' \
              'Tool-ready rebuild' \
              'DTF Genetics catalog pages built around strain identity and grow context.'; do
              ! grep -Fqi -- "$stale" "$body" || {
                echo "Stale route marker remains on $path: $stale" >&2
                return 1
              }
            done
            media="$(grep -o '/wp-content/uploads/' "$body" | wc -l | tr -d ' ')"
            echo "$path verified; current canonical marker present, stale markers absent, WordPress media references=$media"
          }

          verify '/' 'Genetics first. Cultivation science behind it.'
          verify '/learn/' 'Learn the plant as a connected system.'
          verify '/learn/infographics/' 'Visual plant science and cultivation library.'
          verify '/seeds/' 'DTF Genetics library'

      - name: Record transactional repair
        if: always()
        shell: bash
        run: |
          {
            echo '## WordPress-side transactional static-shadow repair'
            echo
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Transactional repair: ${{ steps.repair.outcome }}"
            echo "- Independent live verification: ${{ steps.verify.outcome }}"
            echo '- The temporary repair bridge uses a per-run 256-bit token; the production application-password account does not need manage_options.'
            echo '- The repair remains marker-gated, backup-first, rollback-safe, and idempotent after successful retirement.'
          } >> "$GITHUB_STEP_SUMMARY"

# GET retries are limited to idempotent requests; mutating requests are never replayed automatically.
# 2026-08-31 verified cutover: retire fingerprinted stale root/Learn/Seeds HTML shadows and verify current canonical markers.
