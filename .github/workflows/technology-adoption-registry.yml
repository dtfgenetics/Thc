name: Technology Adoption Registry

on:
  pull_request:
    paths:
      - 'data/technology-adoption-registry.json'
      - 'scripts/validate-technology-adoption-registry.mjs'
      - 'tests/technology-adoption-registry.test.mjs'
      - '.github/workflows/technology-adoption-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-technology-adoption-registry.mjs
      - run: node --test tests/technology-adoption-registry.test.mjs
