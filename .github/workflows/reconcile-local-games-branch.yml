name: Reconcile local game release registry branch

on:
  push:
    branches:
      - release/reconcile-local-games
    paths:
      - scripts/reconcile-local-game-release-registry.mjs
      - .github/workflows/reconcile-local-games-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/reconcile-local-games
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile tested local browser games
        env:
          RELEASE_REGISTRY_DATE: '2026-08-28'
        run: node scripts/reconcile-local-game-release-registry.mjs
      - name: Verify game workspace preflight
        run: npm run games:preflight
      - name: Commit generated registry state
        run: |
          if git diff --quiet; then
            echo 'Registry already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/project-registry.json site/deployment/public-apps.json games/*/game.json
          git commit -m 'Register tested local games for deployment [registry-sync]'
          git push origin HEAD:release/reconcile-local-games
