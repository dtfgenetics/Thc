name: DTFSeeds Production Gateway

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release lane to publish
        required: true
        default: full
        type: choice
        options:
          - full
          - publicSuite
          - wordpress
          - education
  push:
    branches: [main]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dtfseeds-production-gateway
  cancel-in-progress: false

jobs:
  plan:
    name: Plan production release
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      public_suite: ${{ steps.plan.outputs.public_suite }}
      wordpress: ${{ steps.plan.outputs.wordpress }}
      education: ${{ steps.plan.outputs.education }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build route-aware release plan
        id: plan
        env:
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          RELEASE_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/plan-dtfseeds-release.mjs --mode="$RELEASE_MODE" --base="$RELEASE_BASE" --head="$GITHUB_SHA"

      - name: Record release plan
        env:
          RELEASE_PLAN: ${{ steps.plan.outputs.plan }}
        shell: bash
        run: |
          {
            echo '## DTFSeeds release plan'
            echo
            echo '- Source: `${{ github.sha }}`'
            echo '- Event: `${{ github.event_name }}`'
            echo '- Public Suite: `${{ steps.plan.outputs.public_suite }}`'
            echo '- WordPress: `${{ steps.plan.outputs.wordpress }}`'
            echo '- Education: `${{ steps.plan.outputs.education }}`'
            echo
            echo '```json'
            printf '%s\n' "$RELEASE_PLAN"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish planned lanes through one coordinator
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      NORMAL_PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Refuse stale queued release
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin main
          latest="$(git rev-parse origin/main)"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping superseded release $GITHUB_SHA; latest main is $latest. The newer gateway run owns deployment."
          fi

      - name: Stage canonical WordPress lane
        id: wp_stage
        if: always() && steps.freshness.outputs.current == 'true' && needs.plan.outputs.wordpress == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NORMAL_PUSH" == 'true' ]]; then
            bash scripts/run-workflow-and-wait.sh wordpress-canonical-deploy.yml --join-existing
          else
            bash scripts/run-workflow-and-wait.sh wordpress-canonical-deploy.yml
          fi

      - name: Join trusted WordPress production handoff
        id: wp_production
        if: always() && steps.freshness.outputs.current == 'true' && needs.plan.outputs.wordpress == 'true' && steps.wp_stage.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-workflow-and-wait.sh wordpress-canonical-production.yml --join-only

      - name: Publish education lane
        id: education_publish
        if: always() && steps.freshness.outputs.current == 'true' && needs.plan.outputs.education == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          run_lane() {
            if [[ "$NORMAL_PUSH" == 'true' ]]; then
              bash scripts/run-workflow-and-wait.sh deploy-thc-learning-center-expansion-v1.yml --join-existing
            else
              bash scripts/run-workflow-and-wait.sh deploy-thc-learning-center-expansion-v1.yml
            fi
          }
          for attempt in 1 2 3; do
            if run_lane; then exit 0; fi
            [[ "$attempt" -eq 3 ]] && exit 1
            sleep $((attempt * 12))
            NORMAL_PUSH=false
          done

      - name: Publish public application and game lane
        id: public_publish
        if: always() && steps.freshness.outputs.current == 'true' && needs.plan.outputs.public_suite == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NORMAL_PUSH" == 'true' ]]; then
            bash scripts/run-workflow-and-wait.sh deploy-public-suite-wordpress-v2.yml --join-existing
          else
            bash scripts/run-workflow-and-wait.sh deploy-public-suite-wordpress-v2.yml
          fi

      - name: Verify WordPress production surfaces independently
        id: wp_verify
        if: always() && steps.freshness.outputs.current == 'true' && needs.plan.outputs.wordpress == 'true' && steps.wp_production.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local path="$1" marker="$2"
            curl -4 -fsSL --retry 5 --retry-all-errors --retry-delay 4 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "https://dtfseeds.com${path}?dtf_gateway=${GITHUB_RUN_ID}" | grep -Fqi "$marker"
          }
          check '/' 'Genetics first. Cultivation science behind it.'
          check '/learn/' 'Learn the plant as a connected system.'
          check '/community/' 'Join the official DTF / Teaching Healthy Cultivation Discord'

      - name: Verify education production surfaces independently
        id: education_verify
        if: always() && steps.freshness.outputs.current == 'true' && needs.plan.outputs.education == 'true' && steps.education_publish.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for route in plant-health cultivation-science symptoms tools sources; do
            body="$(curl -4 -fsSL --retry 5 --retry-all-errors --retry-delay 4 -H 'Cache-Control: no-cache, no-store, max-age=0' "https://dtfseeds.com/learn/$route/?dtf_gateway=${GITHUB_RUN_ID}")"
            grep -Fqi 'Teaching Healthy Cultivation' <<<"$body"
            ! grep -Fqi 'Reserved strain card' <<<"$body"
          done

      - name: Verify game and application production surfaces independently
        id: public_verify
        if: always() && steps.freshness.outputs.current == 'true' && needs.plan.outputs.public_suite == 'true' && steps.public_publish.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local path="$1" marker="$2"
            curl -4 -fsSL --retry 5 --retry-all-errors --retry-delay 4 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "https://dtfseeds.com${path}?dtf_gateway=${GITHUB_RUN_ID}" | grep -Fqi "$marker"
          }
          check '/games/' '15 playable browser games'
          check '/games/high-iq/' 'Build your High IQ run'
          check '/games/strain-showdown/' 'Eight play styles. One showdown.'
          check '/games/terpocalypse/' 'LEVEL 01 · THE VEG LAB'
          check '/games/phenoquest/' 'The Living Seed Vault'
          check '/games/strain-match/' 'Strain Match'
          check '/games/lost-in-the-terps/' 'Lost in the Terps'
          check '/growlens/' 'GrowLens'
          check '/thc-grow-doc/' 'Grow Doc'

      - name: Record authoritative release result
        if: always()
        shell: bash
        run: |
          {
            echo '## DTFSeeds production gateway'
            echo
            echo "- Gateway revision: $GITHUB_SHA"
            echo "- Superseded: ${{ steps.freshness.outputs.current != 'true' }}"
            echo "- Planned WordPress lane: ${{ needs.plan.outputs.wordpress }}"
            echo "- WordPress stage/production/verify: ${{ steps.wp_stage.outcome }}/${{ steps.wp_production.outcome }}/${{ steps.wp_verify.outcome }}"
            echo "- Planned education lane: ${{ needs.plan.outputs.education }}"
            echo "- Education publish/verify: ${{ steps.education_publish.outcome }}/${{ steps.education_verify.outcome }}"
            echo "- Planned Public Suite lane: ${{ needs.plan.outputs.public_suite }}"
            echo "- Public Suite publish/verify: ${{ steps.public_publish.outcome }}/${{ steps.public_verify.outcome }}"
            echo '- Production success is determined by publishing steps plus fresh public verification; issue comments are advisory only.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mirror result to release ledger without blocking production
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          PLAN: ${{ needs.plan.outputs.plan }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 220,
              body: [
                '## DTFSeeds production gateway',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Source: \`${context.sha}\``,
                `Coordinator status before final enforcement: **${process.env.STATUS}**`,
                '',
                `Plan: \`${process.env.PLAN}\``,
                '',
                'Release reporting is deliberately non-blocking. Publication and fresh public verification decide success.'
              ].join('\n')
            });

      - name: Enforce authoritative lane outcomes
        if: always() && steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          WANT_WORDPRESS: ${{ needs.plan.outputs.wordpress }}
          WANT_EDUCATION: ${{ needs.plan.outputs.education }}
          WANT_PUBLIC: ${{ needs.plan.outputs.public_suite }}
          WP_STAGE: ${{ steps.wp_stage.outcome }}
          WP_PRODUCTION: ${{ steps.wp_production.outcome }}
          WP_VERIFY: ${{ steps.wp_verify.outcome }}
          EDU_PUBLISH: ${{ steps.education_publish.outcome }}
          EDU_VERIFY: ${{ steps.education_verify.outcome }}
          PUBLIC_PUBLISH: ${{ steps.public_publish.outcome }}
          PUBLIC_VERIFY: ${{ steps.public_verify.outcome }}
        run: |
          set -euo pipefail
          failures=0
          require_success() {
            local lane="$1" phase="$2" outcome="$3"
            if [[ "$outcome" != 'success' ]]; then
              echo "$lane $phase outcome was '$outcome', expected success" >&2
              failures=$((failures + 1))
            fi
          }
          if [[ "$WANT_WORDPRESS" == 'true' ]]; then
            require_success WordPress stage "$WP_STAGE"
            require_success WordPress production "$WP_PRODUCTION"
            require_success WordPress verification "$WP_VERIFY"
          fi
          if [[ "$WANT_EDUCATION" == 'true' ]]; then
            require_success Education publication "$EDU_PUBLISH"
            require_success Education verification "$EDU_VERIFY"
          fi
          if [[ "$WANT_PUBLIC" == 'true' ]]; then
            require_success Public-Suite publication "$PUBLIC_PUBLISH"
            require_success Public-Suite verification "$PUBLIC_VERIFY"
          fi
          [[ "$failures" -eq 0 ]]

  no_deploy:
    name: No production-owned changes
    needs: plan
    if: needs.plan.outputs.deploy != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'No production-owned paths changed; no deployment was required.'
