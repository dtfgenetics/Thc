name: Seed Man v20 Finale CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'scripts/verify-seed-man-production-v20.mjs'
      - '.github/workflows/seed-man-v20-finale-ci.yml'
  push:
    branches: [main]
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'scripts/verify-seed-man-production-v20.mjs'
      - '.github/workflows/seed-man-v20-finale-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eco-city-finale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate canonical v20 campaign
        run: |
          set -euo pipefail
          node scripts/verify-seed-man-production-v20.mjs

      - name: Verify Eco City and Blight King finale contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const campaign=JSON.parse(fs.readFileSync('games/seed-man-platformer/data/campaign.json','utf8'));
          const levels=JSON.parse(fs.readFileSync('games/seed-man-platformer/data/levels-20-v1.json','utf8'));
          const publicLevels=JSON.parse(fs.readFileSync('site/public-route-patch/games/seed-man-platformer/data/levels-20-v1.json','utf8'));
          if(campaign.levelCount!==20) throw new Error(`expected 20 levels, got ${campaign.levelCount}`);
          if(campaign.finalBoss!=='blight-king') throw new Error(`unexpected final boss ${campaign.finalBoss}`);
          const world5=levels.levels.filter(l=>l.world==='eco-city');
          if(world5.length!==4) throw new Error(`Eco City must contain 4 levels, got ${world5.length}`);
          const orders=world5.map(l=>l.order).join(',');
          if(orders!=='17,18,19,20') throw new Error(`Eco City level orders are ${orders}`);
          const finale=world5.find(l=>l.order===20);
          if(finale?.id!=='5-4-the-last-seed'||finale?.boss!=='blight-king') throw new Error('Level 20 finale contract mismatch');
          if(!finale.mechanics?.includes('final-gauntlet')||!finale.mechanics?.includes('phenotype-cycle')) throw new Error('Level 20 finale mechanics incomplete');
          if(JSON.stringify(levels)!==JSON.stringify(publicLevels)) throw new Error('canonical/public v20 level data mismatch');
          console.log('Eco City World 5 and Blight King finale contract OK');
          NODE

      - name: Verify v20 runtime replaces retired Genetic Frontier runtime
        shell: bash
        run: |
          set -euo pipefail
          route='site/public-route-patch/games/seed-man-platformer'
          node --check "$route/campaign-v20-runtime.js"
          node --check "$route/campaign-ui-v20.js"
          node --check "$route/v20-enemy-runtime.js"
          node --check "$route/combat-browser-v2.js"
          node --check "$route/enemy-attacks-browser-v2.js"
          grep -Fq 'seed-man-campaign-v20-runtime-v2' "$route/campaign-v20-runtime.js"
          grep -Fq "phenotypeForms:['plant','fire','electric','ice']" "$route/campaign-v20-runtime.js"
          grep -Fq 'seed-man-v20-enemy-runtime-v2' "$route/v20-enemy-runtime.js"
          grep -Fq 'seed-man-combat-browser-v2' "$route/combat-browser-v2.js"
          grep -Fq 'seed-man-enemy-attacks-browser-v2' "$route/enemy-attacks-browser-v2.js"
          grep -Fq 'blight-king' "$route/campaign-v20-runtime.js"
          grep -Fq 'eco-city' "$route/campaign-v20-runtime.js"
          ! grep -Fq 'Genome Hydra' "$route/campaign-v20-runtime.js"
          ! grep -Fq 'Genetic Frontier' "$route/campaign-v20-runtime.js"
          ! grep -Fq './combat-browser-v1.js' "$route/index.html"
          ! grep -Fq './enemy-attacks-browser-v1.js' "$route/index.html"
