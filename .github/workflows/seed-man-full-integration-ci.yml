name: Seed Man Full Integration CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'games/shared-platform/**'
      - 'site/public-route-patch/games/shared-platform/**'
      - '.github/workflows/seed-man-full-integration-ci.yml'
      - '.github/workflows/seed-man-platformer-ci.yml'
      - '.github/workflows/seed-man-combat-ci.yml'
  push:
    branches: [main]
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'games/shared-platform/**'
      - 'site/public-route-patch/games/shared-platform/**'
      - '.github/workflows/seed-man-full-integration-ci.yml'
      - '.github/workflows/seed-man-platformer-ci.yml'
      - '.github/workflows/seed-man-combat-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate canonical Seed Man modules
        run: |
          node --check games/seed-man-platformer/src/physics.mjs
          node --check games/seed-man-platformer/src/campaign.mjs
          node --check games/seed-man-platformer/src/course-generator.mjs
          node --check games/seed-man-platformer/src/systems/player-progression.mjs
          node --check games/seed-man-platformer/src/systems/phenotypes.mjs
          node --check games/seed-man-platformer/src/systems/weapons.mjs
          node --check games/seed-man-platformer/src/systems/enemy-archetypes.mjs
          node --check games/seed-man-platformer/src/systems/enemy-attacks.mjs
          node --check games/seed-man-platformer/src/systems/combat.mjs
          node --check games/seed-man-platformer/test/enemy-attacks.test.mjs
          node --check games/seed-man-platformer/test/enemy-attacks-browser.test.mjs

      - name: Run deterministic gameplay systems together
        run: |
          node games/seed-man-platformer/test/physics.test.mjs
          node games/seed-man-platformer/test/progression-systems.test.mjs
          node games/seed-man-platformer/test/combat.test.mjs
          node games/seed-man-platformer/test/enemy-attacks.test.mjs
          node games/seed-man-platformer/test/campaign.test.mjs
          node games/seed-man-platformer/test/three-world-state.test.mjs
          node games/seed-man-platformer/test/public-runtime.test.mjs
          node games/seed-man-platformer/test/public-campaign.test.mjs
          node games/seed-man-platformer/test/input-guard.test.mjs

      - name: Require complete playable public bundle
        shell: bash
        run: |
          set -euo pipefail
          route=site/public-route-patch/games/seed-man-platformer
          required=(
            index.html app.js canvas-compat-v1.js campaign-v1.js gameplay-v2.js
            combat-browser-v1.js enemy-attacks-browser-v1.js enemy-attacks.js
            seed-man-production-art.js input-guard-v1.js seed-man.css
            physics.mjs data/campaign.json data/level-01.json data/levels-02-11.json
          )
          for file in "${required[@]}"; do
            test -s "$route/$file" || { echo "Missing Seed Man integration asset: $file" >&2; exit 1; }
          done
          node --check "$route/app.js"
          node --check "$route/canvas-compat-v1.js"
          node --check "$route/campaign-v1.js"
          node --check "$route/gameplay-v2.js"
          node --check "$route/combat-browser-v1.js"
          node --check "$route/enemy-attacks-browser-v1.js"
          node --check "$route/enemy-attacks.js"
          node --check "$route/input-guard-v1.js"
          grep -Fq 'sprout-campaign-v3' "$route/campaign-v1.js"
          grep -Fq 'seed-man-campaign-experience-v3' "$route/campaign-v1.js"
          grep -Fq 'seed-man-animation-v2' "$route/campaign-v1.js"
          grep -Fq 'seed-man-combat-browser-v1' "$route/combat-browser-v1.js"
          grep -Fq 'seed-man-enemy-attacks-browser-v1' "$route/enemy-attacks-browser-v1.js"
          grep -Fq "import('./enemy-attacks.js')" "$route/enemy-attacks-browser-v1.js"
          grep -Fq 'enemyAttackBrowserAutoLoad: true' "$route/canvas-compat-v1.js"
          grep -Fq 'seed-man-phenotype-absorb-v1' "$route/combat-browser-v1.js"
          grep -Fq 'seed-man-phenotype-expansion-v1' "$route/combat-browser-v1.js"
          grep -Fq 'PHENO ABSORBED' "$route/combat-browser-v1.js"
          grep -Fq 'terpene-tempest' "$route/combat-browser-v1.js"
          grep -Fq 'hydro-surge' "$route/combat-browser-v1.js"
          grep -Fq 'gravity-haze' "$route/combat-browser-v1.js"
          grep -Fq 'combatBrowserAutoLoad: true' "$route/canvas-compat-v1.js"
          grep -Fq 'seed-man-phenotype-mobility-frame-v1' "$route/canvas-compat-v1.js"
          grep -Fq 'seed-man-shared-platform-v1' "$route/input-guard-v1.js"
          grep -Fq '"levelCount": 11' "$route/data/campaign.json"
          grep -Fq '"newLevelCount": 10' "$route/data/campaign.json"
          grep -Fq 'The Phantom Pump' "$route/campaign-v1.js"
          grep -Fq 'Mite Queen' "$route/campaign-v1.js"
          grep -Fq 'Mildew Wraith' "$route/campaign-v1.js"
          grep -Fq 'Pollen Warden' "$route/campaign-v1.js"

      - name: Verify canonical and public parity
        run: |
          cmp games/seed-man-platformer/src/physics.mjs site/public-route-patch/games/seed-man-platformer/physics.mjs
          cmp games/seed-man-platformer/src/systems/enemy-attacks.mjs site/public-route-patch/games/seed-man-platformer/enemy-attacks.js
          cmp games/seed-man-platformer/data/campaign.json site/public-route-patch/games/seed-man-platformer/data/campaign.json
          cmp games/seed-man-platformer/data/level-01.json site/public-route-patch/games/seed-man-platformer/data/level-01.json
          cmp games/seed-man-platformer/data/levels-02-11.json site/public-route-patch/games/seed-man-platformer/data/levels-02-11.json

      - name: Install browser acceptance dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Run full browser integration suite
        run: |
          node games/seed-man-platformer/test/browser-smoke.mjs
          node games/seed-man-platformer/test/combat-browser.test.mjs
          node games/seed-man-platformer/test/enemy-attacks-browser.test.mjs
          node games/seed-man-platformer/test/phenotype-mobility-browser.test.mjs
          node games/seed-man-platformer/test/shared-platform-browser.test.mjs
          node games/seed-man-platformer/test/flag-completion-browser.test.mjs
          node games/seed-man-platformer/test/campaign-browser.test.mjs