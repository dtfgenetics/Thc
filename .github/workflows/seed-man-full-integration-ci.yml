name: Seed Man Full Integration CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'games/shared-platform/**'
      - 'site/public-route-patch/games/shared-platform/**'
      - 'scripts/sync-seed-man-production-data.mjs'
      - '.github/workflows/seed-man-full-integration-ci.yml'
      - '.github/workflows/seed-man-platformer-ci.yml'
      - '.github/workflows/seed-man-combat-ci.yml'
  push:
    branches: [main]
    paths:
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'games/shared-platform/**'
      - 'site/public-route-patch/games/shared-platform/**'
      - 'scripts/sync-seed-man-production-data.mjs'
      - '.github/workflows/seed-man-full-integration-ci.yml'
      - '.github/workflows/seed-man-platformer-ci.yml'
      - '.github/workflows/seed-man-combat-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Seed Man build dependencies
        run: npm install --prefix games/seed-man-platformer --ignore-scripts --no-audit --no-fund

      - name: Validate canonical modules
        run: |
          node --check games/seed-man-platformer/src/physics.mjs
          node --check games/seed-man-platformer/src/campaign.mjs
          node --check games/seed-man-platformer/src/systems/combat.mjs
          node --check games/seed-man-platformer/src/systems/enemy-attacks.mjs
          node --check games/seed-man-platformer/src/render/art-registry.mjs
          node --check games/seed-man-platformer/src/render/approved-art-loader.mjs
          node --check games/seed-man-platformer/src/render/visual-runtime-v2.mjs
          node --check scripts/sync-seed-man-production-data.mjs

      - name: Synchronize canonical production data
        run: node scripts/sync-seed-man-production-data.mjs

      - name: Prepare exact public artifact
        run: node scripts/prepare-seed-man-combat-release.mjs

      - name: Run deterministic integrated gameplay tests
        run: |
          node games/seed-man-platformer/test/physics.test.mjs
          node games/seed-man-platformer/test/progression-systems.test.mjs
          node games/seed-man-platformer/test/combat.test.mjs
          node games/seed-man-platformer/test/enemy-attacks.test.mjs
          node games/seed-man-platformer/test/campaign.test.mjs
          node games/seed-man-platformer/test/three-world-state.test.mjs
          node games/seed-man-platformer/test/public-runtime.test.mjs
          node games/seed-man-platformer/test/input-guard.test.mjs

      - name: Require current 20-level approved-art public bundle
        shell: bash
        run: |
          set -euo pipefail
          route=site/public-route-patch/games/seed-man-platformer
          required=(
            index.html app.js canvas-compat-v1.js campaign-v1.js gameplay-v2.js
            combat-browser-v1.js enemy-attacks-browser-v1.js enemy-attacks.js
            seed-man-ui-v3.js seed-man-production-art.js seed-man-sprite-runtime-v2.js
            input-guard-v1.js seed-man.css three-world-v1.js physics.mjs
            data/campaign.json data/level-01.json data/levels-20-v1.json
            data/campaign-20-v1.json data/seed-man-art-manifest-v1.json
            data/enemy-catalog-v1.json data/boss-catalog-v1.json
          )
          for file in "${required[@]}"; do test -s "$route/$file" || { echo "Missing Seed Man integration asset: $file" >&2; exit 1; }; done
          node --check "$route/app.js"
          node --check "$route/campaign-v1.js"
          node --check "$route/combat-browser-v1.js"
          node --check "$route/enemy-attacks-browser-v1.js"
          node --check "$route/seed-man-production-art.js"
          node --check "$route/seed-man-sprite-runtime-v2.js"
          node --check "$route/three-world-v1.js"
          grep -Fq 'seed-man-approved-atlas-renderer-v3' "$route/seed-man-production-art.js"
          grep -Fq 'approved-showcase-2026-09-08' "$route/seed-man-production-art.js"
          grep -Fq 'approvedRendererAvailable' "$route/seed-man-sprite-runtime-v2.js"
          grep -Fq "dataset.seedManRendererOwner = 'seed-man-production-v1'" "$route/seed-man-sprite-runtime-v2.js"
          grep -Fq '"levelCount": 20' "$route/data/campaign.json"
          grep -Fq '"newLevelCount": 19' "$route/data/campaign.json"
          grep -Fq '"finalBoss": "blight-king"' "$route/data/campaign.json"
          grep -Fq '5-4-the-last-seed' "$route/data/campaign.json"
          grep -Fq 'SeedManThreeWorld' "$route/three-world-v1.js"

      - name: Verify canonical/public parity
        run: |
          cmp games/seed-man-platformer/src/physics.mjs site/public-route-patch/games/seed-man-platformer/physics.mjs
          cmp games/seed-man-platformer/src/systems/enemy-attacks.mjs site/public-route-patch/games/seed-man-platformer/enemy-attacks.js
          cmp games/seed-man-platformer/data/campaign.json site/public-route-patch/games/seed-man-platformer/data/campaign.json
          cmp games/seed-man-platformer/data/level-01.json site/public-route-patch/games/seed-man-platformer/data/level-01.json
          cmp games/seed-man-platformer/data/levels-20-v1.json site/public-route-patch/games/seed-man-platformer/data/levels-20-v1.json
          cmp games/seed-man-platformer/data/campaign-20-v1.json site/public-route-patch/games/seed-man-platformer/data/campaign-20-v1.json
          cmp games/seed-man-platformer/data/seed-man-art-manifest-v1.json site/public-route-patch/games/seed-man-platformer/data/seed-man-art-manifest-v1.json
          cmp games/seed-man-platformer/data/enemy-catalog-v1.json site/public-route-patch/games/seed-man-platformer/data/enemy-catalog-v1.json
          cmp games/seed-man-platformer/data/boss-catalog-v1.json site/public-route-patch/games/seed-man-platformer/data/boss-catalog-v1.json

      - name: Validate route and release contracts without browser automation
        run: |
          node scripts/audit-game-route-integrity.mjs
          node scripts/validate-public-game-release-integrity.mjs
