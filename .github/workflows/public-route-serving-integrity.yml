name: Reconcile DTFSeeds Public Route Serving

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-route-serving-integrity.yml
      - scripts/reconcile-public-static-route-ownership.mjs
  workflow_run:
    workflows:
      - Deploy DTFSeeds Public Suite via WordPress V2
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dtfseeds-public-route-serving-integrity
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - name: Checkout current canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate guarded serving-integrity scripts and route package
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/promote-public-game-routes-via-wordpress.mjs
          node --check scripts/reconcile-public-static-route-ownership.mjs
          test -s site/public-route-patch/projects/index.html
          grep -Eq 'dtf-release-fingerprint: [A-Za-z0-9._:-]+' site/public-route-patch/projects/index.html
          grep -Fq '<span>public browser games</span>' site/public-route-patch/projects/index.html

      - name: Read canonical Projects release fingerprint
        id: projects_release
        shell: bash
        run: |
          set -euo pipefail
          marker="$(grep -Eo 'dtf-release-fingerprint: [A-Za-z0-9._:-]+' site/public-route-patch/projects/index.html | head -n 1)"
          [[ -n "$marker" ]] || { echo 'Unable to derive Projects release fingerprint' >&2; exit 1; }
          printf 'marker=%s\n' "$marker" >> "$GITHUB_OUTPUT"
          printf 'Validating live Projects route against canonical marker: %s\n' "$marker"

      - name: Reassert canonical game redirect rules
        shell: bash
        run: node scripts/promote-public-game-routes-via-wordpress.mjs

      - name: Reconcile static Projects ownership and purge visitor cache
        shell: bash
        run: node scripts/reconcile-public-static-route-ownership.mjs

      - name: Verify ordinary visitor URLs without cache-busting query strings
        shell: bash
        env:
          PROJECTS_RELEASE_MARKER: ${{ steps.projects_release.outputs.marker }}
        run: |
          set -euo pipefail
          check_direct() {
            local url="$1" marker="$2" body headers status
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl -fsS --retry 4 --retry-delay 3 \
              --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$url")"
            [[ "$status" == '200' ]] || { echo "$url returned HTTP $status" >&2; cat "$headers" >&2; exit 1; }
            ! grep -Eiq '^location:' "$headers" || { echo "$url unexpectedly redirected" >&2; cat "$headers" >&2; exit 1; }
            grep -Fq "$marker" "$body" || { echo "$url is missing $marker" >&2; exit 1; }
            rm -f "$body" "$headers"
          }
          check_direct 'https://dtfseeds.com/projects/' "$PROJECTS_RELEASE_MARKER"
          check_direct 'https://dtfseeds.com/games/bud-or-bluff/' 'Create lobby'

          headers="$(mktemp)"
          status="$(curl -sS --output /dev/null --dump-header "$headers" --write-out '%{http_code}' 'https://dtfseeds.com/games/future-slots/')"
          [[ "$status" == '301' || "$status" == '302' ]]
          grep -Eiq '^location: .*\/games\/?' "$headers"
          rm -f "$headers"
