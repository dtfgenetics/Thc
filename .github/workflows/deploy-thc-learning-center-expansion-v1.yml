name: Deploy THC Education Expansion V1
# Production evidence is authoritative in the Actions summary and artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-public-learning-center-expansion-v1.mjs'
      - 'scripts/publish-wordpress-learning-center-expansion-v1.mjs'
      - 'scripts/update-wordpress-learn-expansion-v1.mjs'
      - 'scripts/wordpress-ipv4-fetch-bootstrap.mjs'
      - 'scripts/run-learning-v3-connected-production.sh'
      - 'scripts/prepare-learning-v3-atlas-publisher.mjs'
      - 'scripts/prepare-learning-v3-owner-aware-publisher.mjs'
      - 'scripts/prepare-learning-owner-aware-followup-publishers.mjs'
      - 'scripts/verify-learning-owner-storage.mjs'
      - '.github/workflows/deploy-thc-learning-center-expansion-v1.yml'

permissions:
  contents: read

# /learn/ has one canonical WordPress owner. Education expansion releases and
# Learning Experience V3 therefore share only this route-owner serialization
# key; unrelated games, apps, content and production resources remain parallel.
concurrency:
  group: dtfseeds-learning-experience-v3
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_LEARNING_V3: 'true'
      APPLY_LEARNING_V3_OWNERSHIP: 'true'
      BACKUP_ROOT: /tmp/dtf-learning-center-expansion
      LEARNING_V4_BACKUP_ROOT: /tmp/dtf-learning-v4-final

    steps:
      - name: Checkout canonical production repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate publisher code
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-public-learning-center-expansion-v1.mjs
          node --check scripts/publish-wordpress-learning-center-expansion-v1.mjs
          node --check scripts/update-wordpress-learn-expansion-v1.mjs
          node --check scripts/wordpress-ipv4-fetch-bootstrap.mjs
          node --check scripts/reconcile-wordpress-learning-v3-ownership.mjs
          node --check scripts/run-learning-v3-production.mjs
          node --check scripts/improve-wordpress-learning-v4.mjs
          node --check scripts/prepare-learning-v3-atlas-publisher.mjs
          node --check scripts/prepare-learning-v3-owner-aware-publisher.mjs
          node --check scripts/prepare-learning-owner-aware-followup-publishers.mjs
          node --check scripts/verify-learning-owner-storage.mjs
          bash -n scripts/run-learning-v3-connected-production.sh
          grep -Fq 'prepare-learning-v3-atlas-publisher.mjs' scripts/run-learning-v3-connected-production.sh
          grep -Fq 'LEARNING_V3_SOURCE_PUBLISHER="$atlas_v3"' scripts/run-learning-v3-connected-production.sh
          grep -Fq 'data-dtf-learning-expanded-reference="v1"' scripts/run-learning-v3-connected-production.sh
          grep -Fq 'data-dtf-learning-map="v4"' scripts/run-learning-v3-connected-production.sh
          test -s site/wordpress/education/topic-literature.json
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"

      - name: Build pinned Dtf420 education expansion
        id: build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-public-learning-center-expansion-v1.mjs | tee "$RUNNER_TEMP/education-expansion-build.json"
          routes=(plant-health cultivation-science symptoms tools sources)
          for route in "${routes[@]}"; do
            file="site/public-route-patch/learn/$route/index.html"
            test -s "$file"
            grep -Eqi '<h1([ >])' "$file"
            grep -Fqi 'Teaching Healthy Cultivation' "$file"
            grep -Fqi 'rel="canonical"' "$file"
            ! grep -Fqi 'Mystery_Line_F1_Regular_DTF_Strain_Card' "$file"
            ! grep -Fqi 'Rainbow_Bubblegum_F1_Regular_DTF_Strain_Card' "$file"
          done
          test -s site/public-route-patch/learn/dtf420-education-expansion-manifest.json
          grep -Fq '1427a9e1619a76a04b07c879d39b2af3b5b8806e' site/public-route-patch/learn/dtf420-education-expansion-manifest.json
          echo "route_count=${#routes[@]}" >> "$GITHUB_OUTPUT"

      - name: Publish expansion pages to WordPress
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/publish-wordpress-learning-center-expansion-v1.mjs \
            | tee "$RUNNER_TEMP/education-expansion-publish.json"
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      - name: Refresh canonical Learning V3 owner transaction
        id: learn_owner
        shell: bash
        run: |
          set -euo pipefail
          # The expansion workflow must never become a competing /learn/ writer.
          # Reuse the exact canonical Learning V3 owner transaction that owns the
          # root page, connected V4 map and expanded-reference section.
          owner_root=/tmp/dtf-learning-v3
          mkdir -p "$owner_root" "$LEARNING_V4_BACKUP_ROOT"

          LEARNING_V3_OWNERSHIP_MODE=reconcile \
          TOPIC_LITERATURE_PATH=site/wordpress/education/topic-literature.json \
          BACKUP_ROOT="$owner_root" \
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/reconcile-wordpress-learning-v3-ownership.mjs \
            | tee "$RUNNER_TEMP/education-learn-owner-reconcile.json"

          BACKUP_ROOT="$owner_root" \
          LEARNING_V4_BACKUP_ROOT="$LEARNING_V4_BACKUP_ROOT" \
          bash scripts/run-learning-v3-connected-production.sh

          test -s /tmp/dtf-topic-literature-v3-normalized.json
          LEARNING_V3_OWNERSHIP_MODE=verify \
          TOPIC_LITERATURE_PATH=/tmp/dtf-topic-literature-v3-normalized.json \
          BACKUP_ROOT="$owner_root" \
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/reconcile-wordpress-learning-v3-ownership.mjs \
            | tee "$RUNNER_TEMP/education-learn-owner-verify.json"

          echo "outcome=success" >> "$GITHUB_OUTPUT"

      - name: Confirm expansion routes on canonical Learn hub
        id: navigation
        shell: bash
        run: |
          set -euo pipefail
          # Read-only convergence proof. The preceding canonical owner transaction
          # is the only step allowed to mutate /learn/.
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/update-wordpress-learn-expansion-v1.mjs \
            | tee "$RUNNER_TEMP/education-expansion-nav.json"
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      - name: Fresh anonymous production verification
        id: live
        shell: bash
        run: |
          set -euo pipefail
          # Child routes are strict anonymous visitor checks. The Learn root uses
          # stable visible semantics; private data-dtf-* ownership markers are
          # verified separately through authenticated WordPress storage.
          routes=(plant-health cultivation-science symptoms tools sources)
          for route in "${routes[@]}"; do
            case "$route" in
              plant-health) public_marker='Plant Health, IPM' ;;
              cultivation-science) public_marker='Cultivation Science Reference Library' ;;
              symptoms) public_marker='Visual Symptom Differential Library' ;;
              tools) public_marker='Printable Learning Tools' ;;
              sources) public_marker='Current sources' ;;
              *) echo "No public overlay marker defined for $route" >&2; exit 1 ;;
            esac
            body="$RUNNER_TEMP/live-${route}.html"
            curl -4 --fail --silent --show-error --location --retry 4 --retry-delay 3 \
              --connect-timeout 15 --max-time 60 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
              "https://dtfseeds.com/learn/$route/?dtf_expansion=${GITHUB_RUN_ID}" -o "$body"
            grep -Eqi '<h1([ >])' "$body"
            grep -Fqi 'Teaching Healthy Cultivation' "$body"
            grep -Fqi "$public_marker" "$body"
            ! grep -Fqi 'Mystery_Line_F1_Regular_DTF_Strain_Card' "$body"
            ! grep -Fqi 'Rainbow_Bubblegum_F1_Regular_DTF_Strain_Card' "$body"
          done

          learn="$RUNNER_TEMP/live-learn.html"
          curl -4 --fail --silent --show-error --location --retry 4 --retry-delay 3 \
            --connect-timeout 15 --max-time 60 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
            "https://dtfseeds.com/learn/?dtf_expansion=${GITHUB_RUN_ID}" -o "$learn"
          grep -Fqi 'Teaching Healthy Cultivation' "$learn"
          grep -Fqi 'Learn in a sequence that makes the plant easier to understand.' "$learn"
          grep -Fqi 'Learn the plant as a connected system.' "$learn"
          for label in \
            'Plant Health & IPM' \
            'Cultivation Science' \
            'Symptom Differentials' \
            'Printable Field Tools' \
            'Evidence & Sources'; do
            grep -Fqi "$label" "$learn"
          done
          for href in /learn/plant-health/ /learn/cultivation-science/ /learn/symptoms/ /learn/tools/ /learn/sources/; do
            grep -Fq "$href" "$learn"
          done
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      - name: Upload rollback and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-education-expansion-v1-${{ github.run_id }}
          path: |
            /tmp/dtf-learning-center-expansion
            /tmp/dtf-learning-v3
            /tmp/dtf-learning-v4-final
            /tmp/dtf-learning-v3-output.json
            /tmp/dtf-learning-v4-final-output.json
            /tmp/dtf-learning-expanded-reference-output.json
            /tmp/dtf-topic-literature-v3-normalized.json
            ${{ runner.temp }}/education-expansion-*.json
            ${{ runner.temp }}/education-learn-owner-*.json
            ${{ runner.temp }}/live-*.html
          if-no-files-found: warn
          retention-days: 30

      - name: Write authoritative production summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ROUTE_COUNT: ${{ steps.build.outputs.route_count }}
          PUBLISH_OUTCOME: ${{ steps.publish.outputs.outcome }}
          OWNER_OUTCOME: ${{ steps.learn_owner.outputs.outcome }}
          NAV_OUTCOME: ${{ steps.navigation.outputs.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outputs.outcome }}
        run: |
          {
            echo '## THC education expansion V1 production'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Result before summary: **${JOB_STATUS:-unknown}**"
            echo "Routes built: **${ROUTE_COUNT:-not-run}**"
            echo "WordPress backing-page publish: **${PUBLISH_OUTCOME:-not-run}**"
            echo "Canonical Learn-owner refresh: **${OWNER_OUTCOME:-not-run}**"
            echo "Learn navigation convergence: **${NAV_OUTCOME:-not-run}**"
            echo "Fresh visitor verification: **${LIVE_OUTCOME:-not-run}**"
            echo
            echo 'This Actions summary plus the uploaded rollback/release artifact is the authoritative release record. Routine telemetry is not written to the exhausted historical issue ledger.'
          } >> "$GITHUB_STEP_SUMMARY"
