name: High Land Room Security CI

on:
  push:
    paths:
      - apps/high-land-web/**
      - package.json
      - package-lock.json
      - .github/workflows/high-land-room-security-ci.yml
  pull_request:
    paths:
      - apps/high-land-web/**
      - package.json
      - package-lock.json
      - .github/workflows/high-land-room-security-ci.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: high-land-room-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace
        run: npm ci

      - name: Lint High Land room API
        shell: bash
        run: |
          set -euo pipefail
          php -v
          for file in apps/high-land-web/public/api/*.php; do
            php -l "$file"
          done

      - name: Run High Land tests including room security integration
        run: npm run test:high-land

      - name: Build High Land production bundle
        run: npm run build:high-land

      - name: Report High Land security gate
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## High Land room security gate',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Branch: \`${context.ref.replace('refs/heads/', '')}\``,
                `Commit: \`${context.sha}\``,
                `Result: **${process.env.JOB_STATUS}**`,
                '',
                'Gate: PHP room-API lint + High Land unit tests + credential/impersonation integration test + production build.'
              ].join('\n')
            });
