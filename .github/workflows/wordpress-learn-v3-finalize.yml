name: Finalize DTFSeeds Learn V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-wordpress-learn-v3.mjs'
      - 'scripts/lib/sitewide-header-template-v6.mjs'
      - 'scripts/rebuild-wordpress-shared-shell-v3.mjs'
      - '.github/workflows/wordpress-learn-v3-finalize.yml'
  workflow_run:
    workflows: ['Apply DTFSeeds Visual V3 After Canonical Production']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dtfseeds-learn-v3-finalize
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com

jobs:
  finalize:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-learn-v3-final
      APPLY_SHARED_SHELL_V3: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V3 Learn package
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/polish-wordpress-visual-site-v3.mjs
          node --check scripts/fix-wordpress-visual-polish-v3-cascade.mjs
          node --check scripts/finalize-wordpress-learn-v3.mjs
          node --check scripts/lib/sitewide-header-template-v6.mjs
          node --check scripts/rebuild-wordpress-shared-shell-v3.mjs
          grep -Fq 'data-dtf-shell="header-v6"' scripts/lib/sitewide-header-template-v6.mjs
      - name: Restore V3 visual ownership
        id: restore
        env:
          APPLY_VISUAL_POLISH: 'true'
        run: |
          set -euo pipefail
          node scripts/polish-wordpress-visual-site-v3.mjs
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Put V3 last in the page cascade
        id: cascade
        env:
          APPLY_V3_CASCADE_FIX: 'true'
        run: |
          set -euo pipefail
          node scripts/fix-wordpress-visual-polish-v3-cascade.mjs
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Finalize Learn hierarchy
        id: apply
        env:
          APPLY_V3_LEARN_FINALIZE: 'true'
        run: |
          set -euo pipefail
          node scripts/finalize-wordpress-learn-v3.mjs
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Restore canonical V6 shared navigation after Learn writers
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/rebuild-wordpress-shared-shell-v3.mjs
      - name: Verify visitor-facing Learn
        id: verify
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/learn.html"
          header="$RUNNER_TEMP/learn-header.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "$WP_SITE_URL/learn/?dtf_learn_v3_final=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$body"
            if grep -Fqi 'dtf-visual-polish-v3' "$body" && grep -Fqi 'dtf-v3-learn-theme-title-suppression' "$body" && grep -Fqi '/learn/genetics-breeding/' "$body" && grep -Fqi 'data-dtf-shell="header-v6"' "$body" && grep -Fqi 'data-dtf-sitewide-header="canonical-eight-v1"' "$body"; then ok=1; break; fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]] || { echo 'Final V3 Learn hierarchy or canonical V6 header is not visible.' >&2; exit 1; }
          node - "$body" "$header" <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync(process.argv[2],'utf8');
          const match=source.match(/<header\b[^>]*data-dtf-shell=["']header-v6["'][^>]*>[\s\S]*?<\/header>/i);
          if(!match) throw new Error('V6 header fragment missing');
          fs.writeFileSync(process.argv[3],match[0]);
          NODE
          expected='Home|Seeds|Learn|Courses|Diagnostic|Games|Community|Shop'
          actual="$(node - "$header" <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync(process.argv[2],'utf8');
          const nav=source.match(/<nav\b[^>]*id=["']dtf-global-primary-nav["'][^>]*>([\s\S]*?)<\/nav>/i)?.[1]||'';
          process.stdout.write([...nav.matchAll(/<a\b[^>]*>([\s\S]*?)<\/a>/gi)].map(m=>m[1].replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim()).join('|'));
          NODE
          )"
          [[ "$actual" == "$expected" ]] || { echo "Unexpected Learn V6 nav: $actual" >&2; exit 1; }
          for obsolete in '>Genetics</a>' '>Tools</a>'; do
            ! grep -Fqi -- "$obsolete" "$header" || { echo "Obsolete primary navigation label remains: $obsolete" >&2; exit 1; }
          done
          echo 'outcome=success' >> "$GITHUB_OUTPUT"
      - name: Publish V3 Learn finalization summary
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
          RESTORE: ${{ steps.restore.outputs.outcome }}
          CASCADE: ${{ steps.cascade.outputs.outcome }}
          APPLY: ${{ steps.apply.outputs.outcome }}
          VERIFY: ${{ steps.verify.outputs.outcome }}
        run: |
          {
            echo '## Learn V3 final hierarchy'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Result: **${STATUS}**"
            echo "V3 restoration: **${RESTORE:-not-completed}**"
            echo "Final cascade ordering: **${CASCADE:-not-completed}**"
            echo "V3-owned title normalization: **${APPLY:-not-completed}**"
            echo "Live V6 verification: **${VERIFY:-not-completed}**"
            echo
            echo 'This workflow restores the V3 Learn presentation, then reapplies and verifies the canonical V6 Home / Seeds / Learn / Courses / Diagnostic / Games / Community / Shop shell so Learn finalization cannot regress the global header.'
          } >> "$GITHUB_STEP_SUMMARY"
