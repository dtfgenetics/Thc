name: WordPress Presentation Repair Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordpress-presentation-repair-production.yml'
      - 'scripts/reconcile-wordpress-presentation-rest.mjs'
      - 'scripts/apply-wordpress-public-content-rest.mjs'

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-presentation-production
  cancel-in-progress: false

jobs:
  repair-production-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      BACKUP_ROOT: /tmp/wordpress-presentation-backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate production scripts
        run: |
          set -euo pipefail
          node --check scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/reconcile-wordpress-presentation-rest.mjs

      - name: Require WordPress credentials
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"

      - name: Confirm Hostinger HTTPS path before writes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -4 --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 45 \
              --retry 2 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$WP_SITE_URL/wp-json/" -o "$RUNNER_TEMP/wp-index.json"; then
              echo "Hostinger HTTPS reachable on attempt $attempt"
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo 'Hostinger HTTPS remained unreachable after retries.' >&2
              exit 1
            fi
            sleep $((attempt * 8))
          done

      - name: Reconcile canonical WordPress page records
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "WordPress REST reconciliation attempt $attempt of 6"
            if CONTENT_DIR="$GITHUB_WORKSPACE/site/wordpress/pages" node scripts/apply-wordpress-public-content-rest.mjs; then
              echo "WordPress REST reconciliation succeeded on attempt $attempt"
              exit 0
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo 'WordPress REST reconciliation exhausted all retries.' >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Repair active Hostinger presentation
        id: repair
        env:
          APPLY_PRESENTATION_CHANGES: 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Presentation reconciliation attempt $attempt of 4"
            if node scripts/reconcile-wordpress-presentation-rest.mjs; then
              backup_dir="$(cat "$BACKUP_ROOT/wordpress-presentation-backup-path.txt")"
              report="$backup_dir/presentation-reconciliation.json"
              echo "mutations=$(node -p "require(process.argv[1]).mutationCount" "$report")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$attempt" -eq 4 ]]; then
              echo 'Presentation reconciliation exhausted all retries.' >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Verify public site no longer exposes stale Hostinger presentation
        id: live_verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-check
          fetch_page() {
            local path="$1"
            local safe
            safe=$(printf '%s' "$path" | tr '/?' '__')
            local body="/tmp/live-check/${safe}.html"
            local ok=0
            for attempt in 1 2 3 4 5 6; do
              url="https://dtfseeds.com${path}?dtf_verify=${GITHUB_RUN_ID}-${attempt}"
              echo "Checking $url"
              if curl -4 -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "$url" -o "$body"; then
                if ! grep -Fqi 'email@email.com' "$body" && \
                   ! grep -Fqi '+123456789' "$body" && \
                   ! grep -Fqi '© 2025 DTF GENETICS' "$body" && \
                   ! grep -Fqi '&copy; 2025 DTF GENETICS' "$body"; then
                  ok=1
                  break
                fi
              fi
              sleep 8
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Stale Hostinger presentation remains live on $path" >&2
              grep -Eio '.{0,80}(email@email\.com|\+123456789|2025 DTF GENETICS).{0,80}' "$body" | head -20 >&2 || true
              exit 1
            fi
          }

          fetch_page '/'
          fetch_page '/blog/'
          fetch_page '/learn/'
          fetch_page '/community/'

          if ! grep -RFiq 'discord.gg/xJbUeHFPMt' /tmp/live-check; then
            echo 'Official Discord CTA was not observed in checked public pages.' >&2
            exit 1
          fi
          if ! grep -Fqi '/seeds/' /tmp/live-check/_blog_.html || ! grep -Fqi '/learn/' /tmp/live-check/_blog_.html; then
            echo 'Canonical Seeds/Learn navigation was not observed on /blog/.' >&2
            exit 1
          fi

          echo 'Live presentation verification passed.'

      - name: Upload presentation backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-presentation-backup-${{ github.run_id }}
          path: /tmp/wordpress-presentation-backups
          if-no-files-found: warn
          retention-days: 30

      - name: Report production result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_OUTCOME: ${{ steps.pages.outcome }}
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          VERIFY_OUTCOME: ${{ steps.live_verify.outcome }}
          MUTATIONS: ${{ steps.repair.outputs.mutations }}
        shell: bash
        run: |
          if [[ "$PAGE_OUTCOME" == "success" && "$REPAIR_OUTCOME" == "success" && "$VERIFY_OUTCOME" == "success" ]]; then
            status='SUCCESS'
          else
            status='FAILED'
          fi
          gh issue comment 46 --repo "$GITHUB_REPOSITORY" --body "### WordPress presentation repair: ${status}\n\n- Run: ${GITHUB_RUN_ID}\n- Canonical pages: **${PAGE_OUTCOME}**\n- Theme repair: **${REPAIR_OUTCOME}**\n- Theme/template mutations: **${MUTATIONS:-0}**\n- Live verification: **${VERIFY_OUTCOME}**\n- Checked live: /, /blog/, /learn/, /community/\n- Required outcome: stale fake email/phone/2025 footer removed, canonical navigation visible, and official Discord CTA present."

# Proven Codex REST-only deployment path, hardened for transient Hostinger HTTPS timeouts.
