name: Publish Lighting V6 Final

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/wordpress/education/lighting-v6.json'
      - 'scripts/publish-wordpress-lighting-v6-final.mjs'
      - '.github/workflows/wordpress-lighting-v6-final.yml'
  workflow_run:
    workflows:
      - Enhance DTFSeeds Education V4
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-lighting-v6-final
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  publish:
    name: Publish complete Lighting curriculum
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      APPLY_LIGHTING_V6: 'true'
      LIGHTING_V6_PATH: site/wordpress/education/lighting-v6.json
      BACKUP_ROOT: /tmp/dtf-lighting-v6-final

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Lighting V6 package
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/publish-wordpress-lighting-v6-final.mjs
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('site/wordpress/education/lighting-v6.json','utf8'));
          const lessons=(c.chapters||[]).reduce((n,x)=>n+(x.lessons||[]).length,0);
          if(c.id!=='lighting-v6'||c.chapters?.length!==8||lessons!==32) throw new Error('Lighting package shape changed unexpectedly.');
          if((c.chapters||[]).some(x=>(x.lessons||[]).length!==4)) throw new Error('Every Lighting chapter must contain four focused lessons.');
          const ids=c.chapters.map(x=>x.id);
          if(new Set(ids).size!==8) throw new Error('Chapter IDs must be unique.');
          const refs=[...new Set(c.chapters.flatMap(x=>x.encyclopediaIds||[]))];
          const invalid=refs.filter(id=>{const n=Number(String(id).slice(-3));return n<101||n>120;});
          if(invalid.length) throw new Error(`Lighting V6 may only reference controlled Volume 6 IDs 101-120: ${invalid.join(', ')}`);
          console.log(`Validated stable Lighting chapter IDs: ${ids.join(', ')}`);
          NODE

      - name: Publish and verify Lighting V6
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/publish-wordpress-lighting-v6-final.mjs | tee "$RUNNER_TEMP/lighting-v6-final.log"
          report="$BACKUP_ROOT/report.json"
          test -s "$report"
          echo "chapters=$(node -p "require(process.argv[1]).chapters" "$report")" >> "$GITHUB_OUTPUT"
          echo "lessons=$(node -p "require(process.argv[1]).lessons" "$report")" >> "$GITHUB_OUTPUT"
          echo "references=$(node -p "require(process.argv[1]).publishedReferencePages" "$report")" >> "$GITHUB_OUTPUT"
          echo "visuals=$(node -p "require(process.argv[1]).visualTargets" "$report")" >> "$GITHUB_OUTPUT"

      - name: Independently verify stable Lighting chapter IDs
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/lighting-final.html"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' --header 'Pragma: no-cache' \
              "$WP_SITE_URL/learn/lighting/?dtf_li6_final_verify=${GITHUB_RUN_ID}-${attempt}" --output "$body"
            if grep -Fqi 'data-dtf-lighting-v6="true"' "$body"; then ok=1; break; fi
            sleep 6
          done
          [[ "$ok" -eq 1 ]]
          [[ "$(grep -Fo 'data-li6-chapter=' "$body" | wc -l | tr -d ' ')" = '8' ]]
          [[ "$(grep -Fo 'class="li6-lesson"' "$body" | wc -l | tr -d ' ')" = '32' ]]
          for id in photon-language-bands fixture-output-delivery ppfd-mapping-uniformity dli-photoperiod-timing spectrum-source-signaling photosynthetic-response-canopy-use high-light-stress-acclimation verification-records-change-control; do grep -Fqi "data-li6-chapter=\"$id\"" "$body"; done
          grep -Fqi 'data-dtf-topic="lighting"' "$body"
          grep -Fqi 'data-dtf-learning-v4="topic-lighting"' "$body"

      - name: Upload Lighting V6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighting-v6-final-${{ github.run_id }}
          path: |
            /tmp/dtf-lighting-v6-final
            ${{ runner.temp }}/lighting-v6-final.log
            ${{ runner.temp }}/lighting-final.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report Lighting V6 result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          VALIDATE: ${{ steps.validate.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          CHAPTERS: ${{ steps.publish.outputs.chapters }}
          LESSONS: ${{ steps.publish.outputs.lessons }}
          REFERENCES: ${{ steps.publish.outputs.references }}
          VISUALS: ${{ steps.publish.outputs.visuals }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:46,body:[
              '## Lighting V6 final curriculum','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.STATUS}**`,
              `Package validation: **${process.env.VALIDATE || 'not-run'}**`,
              `WordPress publication: **${process.env.PUBLISH || 'not-run'}**`,
              `Visitor verification: **${process.env.VERIFY || 'not-run'}**`,
              `Chapters: **${process.env.CHAPTERS || '0'}**`,
              `Focused lessons: **${process.env.LESSONS || '0'}**`,
              `Direct controlled Lighting encyclopedia references currently public: **${process.env.REFERENCES || '0'}**`,
              `Defined visual study targets: **${process.env.VISUALS || '0'}**`,'',
              'The publisher is fail-closed: it requires the existing V3 Lighting topic owner and V4 guided-learning marker, limits deep references to source-controlled Volume 6 IDs 101-120, stores rollback evidence, and restores the prior page if edit-context or visitor verification fails. It intentionally does not publish one universal cannabis PPFD, DLI, spectrum, or fixture-height recipe.'
            ].join('\n')});
