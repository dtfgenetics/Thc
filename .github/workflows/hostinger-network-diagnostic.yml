name: Hostinger WordPress Publish Verification

# Registered workflow trigger for one-time production verification.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hostinger-network-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-and-publish:
    name: Verify WordPress and publish Yellow Leaves
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      ARTICLE_DIR: ${{ github.workspace }}/site/wordpress/articles
      ARTICLE_FILE: ${{ github.workspace }}/site/wordpress/articles/yellow-leaves.json
      BACKUP_ROOT: ${{ runner.temp }}/wordpress-thc-article-backups
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify WordPress credentials and REST access
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WP_API_USERNAME"
          test -n "$WP_API_PASSWORD"
          code=$(curl -4 -sS -o /tmp/me.json -w '%{http_code}' \
            --connect-timeout 8 --max-time 20 \
            --user "$WP_API_USERNAME:$WP_API_PASSWORD" \
            "$WP_SITE_URL/wp-json/wp/v2/users/me?context=edit")
          echo "Authenticated users/me HTTP status: $code"
          if [[ "$code" != "200" ]]; then
            cat /tmp/me.json || true
            exit 1
          fi

      - name: Publish or update Yellow Leaves article
        id: publish
        run: node scripts/publish-wordpress-articles-rest.mjs

      - name: Upload rollback metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-yellow-leaves-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/wordpress-thc-article-backups
          if-no-files-found: warn
          retention-days: 30

      - name: Report result to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        with:
          script: |
            const body = [
              '## WordPress Yellow Leaves verification',
              '',
              `Overall status: **${process.env.JOB_STATUS}**`,
              `Authenticated REST check: **${process.env.AUTH_OUTCOME}**`,
              `Article publish/update: **${process.env.PUBLISH_OUTCOME}**`,
              '',
              'Target slug: `yellow-leaves`',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'No credential values are included in this report.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body
            });
