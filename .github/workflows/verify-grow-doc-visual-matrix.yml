name: Verify THC Grow Doc Visual Matrix

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Verify THC Grow Doc Production Identity"]
    types: [completed]

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE: https://dtfseeds.com
      DTF_GROW_DOC_VISUAL_MATRIX: test-results/grow-doc-visual-matrix
    steps:
      - name: Checkout current visual QA source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate visual matrix script
        run: node --check scripts/capture-grow-doc-visual-matrix.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture desktop and mobile visual matrix
        run: node scripts/capture-grow-doc-visual-matrix.mjs

      - name: Upload Grow Doc visual matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grow-doc-visual-matrix-${{ github.run_id }}
          path: test-results/grow-doc-visual-matrix
          if-no-files-found: error
          retention-days: 14
