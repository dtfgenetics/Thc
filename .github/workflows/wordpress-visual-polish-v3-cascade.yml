name: Finalize DTFSeeds Visual V3 Cascade

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-wordpress-visual-polish-v3-cascade.mjs'
      - 'scripts/lib/sitewide-header-template-v6.mjs'
      - '.github/workflows/wordpress-visual-polish-v3-cascade.yml'
  workflow_run:
    workflows: ['Polish DTFSeeds Visual System V3']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dtfseeds-wordpress-visual-polish-v3-cascade
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com

jobs:
  finalize:
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-v3-cascade-fix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize V3 cascade order
        id: fix
        env:
          APPLY_V3_CASCADE_FIX: 'true'
        run: |
          set -euo pipefail
          node --check scripts/fix-wordpress-visual-polish-v3-cascade.mjs
          node scripts/fix-wordpress-visual-polish-v3-cascade.mjs | tee "$RUNNER_TEMP/cascade.log"
          found="$(node -e "const s=require('fs').readFileSync(process.argv[1],'utf8');const m=s.match(/\"found\"\s*:\s*(\d+)/);console.log(m?m[1]:'0')" "$RUNNER_TEMP/cascade.log")"
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - name: Verify final style ordering and canonical V6 site shell
        id: verify
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home.html"
          header="$RUNNER_TEMP/home-header.html"
          curl -4 -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache, no-store' "$WP_SITE_URL/?dtf_v3_final=$GITHUB_RUN_ID" -o "$home"
          if grep -Fqi 'dtf-visual-polish-v3' "$home"; then
            grep -Fqi 'dtf-v3-spotlight' "$home"
            grep -Fqi 'data-dtf-shell="header-v6"' "$home"
            grep -Fqi 'data-dtf-sitewide-header="canonical-eight-v1"' "$home"
            grep -Fqi 'id="dtf-sitewide-ux-polish-v1"' "$home"
            node - "$home" "$header" <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync(process.argv[2], 'utf8');
          const match = source.match(/<header\b[^>]*data-dtf-shell=["']header-v6["'][^>]*>[\s\S]*?<\/header>/i);
          if (!match) process.exit(1);
          fs.writeFileSync(process.argv[3], match[0]);
          NODE
            node - "$header" <<'NODE'
          const fs=require('fs');
          const header=fs.readFileSync(process.argv[2],'utf8');
          const nav=header.match(/<nav\b[^>]*id=["']dtf-global-primary-nav["'][^>]*>([\s\S]*?)<\/nav>/i)?.[1]||'';
          const labels=[...nav.matchAll(/<a\b[^>]*>([\s\S]*?)<\/a>/gi)].map(m=>m[1].replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim());
          const expected=['Home','Seeds','Learn','Courses','Diagnostic','Games','Community','Shop'];
          if(JSON.stringify(labels)!==JSON.stringify(expected)) throw new Error(`Unexpected V6 navigation: ${JSON.stringify(labels)}`);
          NODE
          fi
      - name: Upload rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-v3-cascade-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/dtf-v3-cascade-fix
          if-no-files-found: warn
          retention-days: 30
      - name: Publish cascade summary
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
          FOUND: ${{ steps.fix.outputs.found }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          {
            echo '## DTFSeeds V3 cascade finalization'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Result: **${STATUS}**"
            echo "Pages with V3 style finalized: **${FOUND:-0}**"
            echo "Live V6 verification: **${VERIFY:-not-run}**"
            echo
            echo 'Verification requires the canonical V6 Genetics / Learn / Tools / Games / Community / Shop shell plus shared UX polish.'
          } >> "$GITHUB_STEP_SUMMARY"
