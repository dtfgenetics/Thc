name: Publish DTF Gallery Visual V3

# COMPATIBILITY ENTRY POINT
# The old Gallery V3 could overwrite the approved image-less Gallery V2 with a
# large mixed visual archive. Keep this workflow name for workflow_run history,
# but route every production invocation to the clean Gallery V2 owner instead.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-wordpress-gallery-visual-v3.mjs'
      - 'scripts/publish-wordpress-gallery-v2.mjs'
      - 'site/wordpress/pages/gallery.html'
      - '.github/workflows/wordpress-gallery-visual-v3.yml'
  workflow_run:
    workflows:
      - 'Deploy DTFSeeds WordPress Pages'
      - 'Publish DTF Genetics Library'
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dtfseeds-gallery-visual-v2
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  publish-gallery-v2:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-gallery-v2-compat
      APPLY_GALLERY_V2: 'true'

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate clean Gallery V2 owner
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          node --check scripts/publish-wordpress-gallery-v2.mjs
          node --check scripts/flush-hostinger-litespeed-mcp.mjs
          grep -Fq 'data-dtf-layout="gallery-visual-v2"' site/wordpress/pages/gallery.html
          grep -Fq 'Approved visuals only.' site/wordpress/pages/gallery.html
          ! grep -Eqi '<img\b' site/wordpress/pages/gallery.html
          ! grep -Fq 'node scripts/finalize-wordpress-gallery-visual-v3.mjs' .github/workflows/wordpress-gallery-visual-v3.yml

      - name: Publish clean Gallery V2 instead of legacy V3
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/publish-wordpress-gallery-v2.mjs \
            | tee "$RUNNER_TEMP/gallery-v2-compat.json"
          grep -Fq '"storedVerification": "success"' "$RUNNER_TEMP/gallery-v2-compat.json"

      - name: Purge Hostinger LiteSpeed cache
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if node scripts/flush-hostinger-litespeed-mcp.mjs; then ok=1; break; fi
            [[ "$attempt" -lt 3 ]] && sleep $((attempt * 4))
          done
          [[ "$ok" -eq 1 ]] || { echo 'LiteSpeed cache purge failed.' >&2; exit 1; }
          sleep 5

      - name: Verify clean Gallery V2 remains public
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/gallery-v2-public.html"
          blocked='(dtf-edu-|THC[-_ ]?C[0-9]{3}|THC[-_ ]?ENC[-_ ]?[0-9]{3}|Cannabis[_ -]Plant[_ -]Anatomy[_ -]Infographic|Beneficial[_ -]Insects[_ -]and[_ -]Biological[_ -]Controls)'
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --connect-timeout 20 --max-time 50 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
              "$WP_SITE_URL/gallery/?dtf_gallery_v2_compat=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$body"; then
              if grep -Fq 'data-dtf-layout="gallery-visual-v2"' "$body" && \
                 grep -Fq 'Approved visuals only.' "$body" && \
                 grep -Fq 'Browse by destination.' "$body" && \
                 ! grep -Eqi "$blocked" "$body"; then ok=1; break; fi
            fi
            [[ "$attempt" -lt 8 ]] && sleep $((attempt + 2))
          done
          [[ "$ok" -eq 1 ]] || { echo 'Gallery V2 compatibility publication did not converge.' >&2; head -c 4500 "$body" >&2 || true; exit 1; }
          ! grep -Fqi 'DTF Visual Library' "$body"
          echo 'Legacy Gallery V3 entry point reconciled to clean Gallery V2.'

      - name: Upload Gallery rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-gallery-v2-compat-${{ github.run_id }}
          path: |
            /tmp/dtf-gallery-v2-compat
            ${{ runner.temp }}/gallery-v2-compat.json
            ${{ runner.temp }}/gallery-v2-public.html
          if-no-files-found: warn
          retention-days: 30
