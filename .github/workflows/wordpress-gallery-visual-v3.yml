name: Publish DTF Gallery Visual V3

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/finalize-wordpress-gallery-visual-v3.mjs'
      - 'site/wordpress/visual-quality-policy.json'
      - '.github/workflows/wordpress-gallery-visual-v3.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-wordpress-gallery-visual-v3.mjs'
      - 'site/wordpress/visual-quality-policy.json'
      - '.github/workflows/wordpress-gallery-visual-v3.yml'
  workflow_run:
    workflows:
      - 'Deploy DTFSeeds WordPress Pages'
      - 'Publish DTF Genetics Library'
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dtfseeds-gallery-visual-v3-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  WP_SITE_URL: https://dtfseeds.com
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  validate-gallery-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Gallery V3 approved-only package
        shell: bash
        run: |
          set -euo pipefail
          test -s site/wordpress/visual-quality-policy.json
          node --check scripts/finalize-wordpress-gallery-visual-v3.mjs
          node --check scripts/flush-hostinger-litespeed-mcp.mjs
          grep -Fq 'data-dtf-gallery-visual-v3' scripts/finalize-wordpress-gallery-visual-v3.mjs
          grep -Fq 'data-dtf-gallery-media-policy="approved-only"' scripts/finalize-wordpress-gallery-visual-v3.mjs
          grep -Fq 'See the genetics first. Explore the science behind them.' scripts/finalize-wordpress-gallery-visual-v3.mjs
          grep -Fq 'dtf-strain-card-blue-mango-f2-regular' scripts/finalize-wordpress-gallery-visual-v3.mjs
          grep -Fq 'dtf-strain-card-mango-bubbles-f1-regular' scripts/finalize-wordpress-gallery-visual-v3.mjs
          grep -Fq "approvedPrefixes.includes('dtf-approved-visual-')" scripts/finalize-wordpress-gallery-visual-v3.mjs
          node <<'NODE'
          const fs = require('fs');
          const policy = JSON.parse(fs.readFileSync('site/wordpress/visual-quality-policy.json','utf8'));
          if (policy.mode !== 'quarantine') throw new Error('Visual quarantine is not active.');
          if (!(policy.approvedMediaSlugPrefixes || []).includes('dtf-approved-visual-')) throw new Error('Approved visual prefix missing.');
          if (policy.legacyAutomaticInfographicPublishingAllowed !== false) throw new Error('Legacy automatic infographic publishing must remain disabled.');
          if (policy.legacyInfographicReuseAllowed !== false) throw new Error('Legacy infographic reuse must remain disabled.');
          NODE

  publish-gallery-v3:
    needs: validate-gallery-v3
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-gallery-visual-v3

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"

      - name: Publish Gallery V3 visual page
        id: publish
        env:
          APPLY_GALLERY_VISUAL_V3: 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          node scripts/finalize-wordpress-gallery-visual-v3.mjs | tee "$RUNNER_TEMP/gallery-v3.json"

      - name: Purge Hostinger LiteSpeed cache
        id: cache
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if node scripts/flush-hostinger-litespeed-mcp.mjs; then ok=1; break; fi
            sleep $((attempt * 4))
          done
          [[ "$ok" -eq 1 ]] || { echo 'LiteSpeed cache purge failed.' >&2; exit 1; }
          sleep 5

      - name: Verify Gallery V3 origin and public cache
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          verify_gallery() {
            local url="$1" output="$2" ok=0 images=0
            for attempt in 1 2 3 4 5 6 7 8; do
              curl -4 -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "$url" -o "$output"
              images="$(grep -oi '<img' "$output" | wc -l | tr -d ' ')"
              if \
                grep -Fqi 'data-dtf-gallery-visual-v3="true"' "$output" && \
                grep -Fqi 'data-dtf-gallery-media-policy="approved-only"' "$output" && \
                grep -Fqi 'See the genetics first. Explore the science behind them.' "$output" && \
                grep -Fqi 'Blue Mango F2 Regular DTF Genetics strain card' "$output" && \
                grep -Fqi 'Blue Mango F2 Feminized DTF Genetics strain card' "$output" && \
                grep -Fqi 'Blue Bubblegum F1 Regular DTF Genetics strain card' "$output" && \
                grep -Fqi 'Mango Bubbles F1 Regular DTF Genetics strain card' "$output" && \
                grep -Fqi 'data-dtf-shell="header-v6"' "$output" && \
                grep -Fqi 'data-dtf-sitewide-header="canonical-eight-v1"' "$output" && \
                [[ "$images" -ge 4 ]]; then
                if OUTPUT="$output" node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync(process.env.OUTPUT,'utf8');
          const lower = html.toLowerCase();
          const policy = JSON.parse(fs.readFileSync('site/wordpress/visual-quality-policy.json','utf8'));

          const navMatch = html.match(/<nav\b[^>]*id=["']dtf-global-primary-nav["'][^>]*>([\s\S]*?)<\/nav>/i);
          if (!navMatch) throw new Error('Canonical primary navigation missing.');
          const labels = [...navMatch[1].matchAll(/<a\b[^>]*>([\s\S]*?)<\/a>/gi)]
            .map((match) => match[1].replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim());
          const expected = ['Home','Seeds','Learn','Courses','Diagnostic','Games','Community','Shop'];
          if (JSON.stringify(labels) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected Gallery V6 navigation: ${JSON.stringify(labels)}`);
          }

          const mediaValues = [];
          for (const tag of html.match(/<(?:img|source)\b[^>]*>/gi) || []) {
            for (const attr of ['src','srcset','data-src','data-srcset','alt']) {
              const match = tag.match(new RegExp(`\\b${attr}=["']([^"']*)["']`, 'i'));
              if (match?.[1]) mediaValues.push(match[1].toLowerCase());
            }
          }
          const mediaText = mediaValues.join('\n');
          for (const value of policy?.bannedMedia?.urlContains || []) {
            if (value && mediaText.includes(String(value).toLowerCase())) {
              throw new Error(`Retired Gallery media URL identity rendered: ${value}`);
            }
          }
          for (const prefix of policy?.bannedMedia?.slugPrefixes || []) {
            if (prefix && mediaText.includes(String(prefix).toLowerCase())) {
              throw new Error(`Retired Gallery media slug rendered: ${prefix}`);
            }
          }
          if (/dtf-edu-|cannabis[_-]plant[_-](?:anatomy|life[_-]cycle)|beneficial[_-]insects|deficiency[_-]versus[_-]toxicity/.test(mediaText)) {
            throw new Error('Retired educational visual rendered in Gallery media tags.');
          }

          const approvedPrefix = 'dtf-approved-visual-';
          const educationSection = lower.match(/data-dtf-gallery-role=["']education["'][^>]*>([\s\S]*?)(?:<\/section>|<\/div>)/i)?.[1] || '';
          const educationMedia = [...educationSection.matchAll(/<(?:img|source)\b[^>]*>/gi)].map((match) => match[0]);
          for (const tag of educationMedia) {
            if (!tag.toLowerCase().includes(approvedPrefix)) {
              throw new Error('Gallery education role contains media outside the approved visual prefix.');
            }
          }
          NODE
                then ok=1; break; fi
              fi
              sleep 6
            done
            [[ "$ok" -eq 1 ]] || { echo "Gallery V3 approved-only verification failed for $url (images=$images)" >&2; exit 1; }
          }
          verify_gallery "$WP_SITE_URL/gallery/?dtf_gallery_v3=${GITHUB_RUN_ID}" "$RUNNER_TEMP/gallery-v3-origin.html"
          verify_gallery "$WP_SITE_URL/gallery/" "$RUNNER_TEMP/gallery-v3-public.html"

      - name: Upload Gallery V3 rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-gallery-visual-v3-${{ github.run_id }}
          path: |
            /tmp/dtf-gallery-visual-v3
            ${{ runner.temp }}/gallery-v3-*.html
            ${{ runner.temp }}/gallery-v3.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record Gallery V3 production result
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
          PUBLISH: ${{ steps.publish.outcome }}
          CACHE: ${{ steps.cache.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          {
            echo '## DTF Gallery Visual V3'
            echo
            echo "- Result: **${STATUS}**"
            echo "- Gallery write: **${PUBLISH:-not-run}**"
            echo "- LiteSpeed cache purge: **${CACHE:-not-run}**"
            echo "- Approved-only origin + public verification: **${VERIFY:-not-run}**"
            echo '- Header contract: **V6 / canonical eight-item navigation**'
            echo '- Educational media policy: **approved-prefix only; retired visuals blocked at rendered media tags**'
            echo
            echo 'Gallery leads with reviewed DTF Genetics artwork. Educational visuals are admitted only through the canonical approved-media quality gate; image-count filler is not permitted.'
          } >> "$GITHUB_STEP_SUMMARY"
