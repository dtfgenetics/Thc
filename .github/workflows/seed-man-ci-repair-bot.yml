name: Seed Man CI Repair Bot

on:
  push:
    branches: [seed-man-ci-repair-20260908]
    paths:
      - .github/workflows/seed-man-ci-repair-bot.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[seed-man-ci-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seed-man-ci-repair-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair stale Seed Man release contracts
        shell: python
        run: |
          from pathlib import Path

          smoke = Path('games/seed-man-platformer/test/browser-smoke.mjs')
          text = smoke.read_text()
          old = "assert.match(await page.title(), /Seed Man: Sprout Run/i);"
          new = "assert.match(await page.title(), /Seed Man: (Sprout Run|Greenhouse Gauntlet)/i);"
          if old not in text:
              raise SystemExit('browser-smoke title assertion anchor missing')
          smoke.write_text(text.replace(old, new, 1))

          publish = Path('.github/workflows/publish-seed-man-production.yml')
          text = publish.read_text()
          text = text.replace("grep -Fq 'seed-man-three-world-v1'", "grep -Fq 'seed-man-three-world-v2'")
          canonical_paths = "      - games/seed-man-platformer/src/render/**\n      - games/seed-man-platformer/scripts/build-three-public.mjs\n"
          anchor = "      - scripts/prepare-seed-man-world-five-runtime.mjs\n"
          if canonical_paths.strip() not in text:
              if anchor not in text:
                  raise SystemExit('publish workflow path anchor missing')
              text = text.replace(anchor, anchor + canonical_paths, 1)
          publish.write_text(text)

      - name: Validate repairs
        run: |
          node --check games/seed-man-platformer/test/browser-smoke.mjs
          grep -Fq 'Greenhouse Gauntlet' games/seed-man-platformer/test/browser-smoke.mjs
          grep -Fq "seed-man-three-world-v2" .github/workflows/publish-seed-man-production.yml
          grep -Fq 'games/seed-man-platformer/src/render/**' .github/workflows/publish-seed-man-production.yml

      - name: Commit repairs
        run: |
          git config user.name 'DTF Seed Man Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/seed-man-platformer/test/browser-smoke.mjs .github/workflows/publish-seed-man-production.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Repair Seed Man release and browser gates [seed-man-ci-repair]'
          git push origin HEAD:seed-man-ci-repair-20260908
