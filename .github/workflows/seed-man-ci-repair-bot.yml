name: Seed Man CI Repair Bot

on:
  push:
    branches: [seed-man-ci-repair-20260908]
    paths:
      - .github/workflows/seed-man-ci-repair-bot.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[seed-man-ci-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seed-man-ci-repair-20260908
          fetch-depth: 0
      - name: Repair stale Seed Man browser identity contract
        shell: python
        run: |
          from pathlib import Path
          smoke = Path('games/seed-man-platformer/test/browser-smoke.mjs')
          text = smoke.read_text()
          old = "assert.match(await page.title(), /Seed Man: Sprout Run/i);"
          new = "assert.match(await page.title(), /Seed Man: (Sprout Run|Greenhouse Gauntlet)/i);"
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('browser-smoke title assertion anchor missing')
          smoke.write_text(text.replace(old, new, 1))
      - name: Validate repair
        run: |
          node --check games/seed-man-platformer/test/browser-smoke.mjs
          grep -Fq 'Greenhouse Gauntlet' games/seed-man-platformer/test/browser-smoke.mjs
      - name: Commit repair
        run: |
          git config user.name 'DTF Seed Man Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/seed-man-platformer/test/browser-smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Repair Seed Man browser identity gate [seed-man-ci-repair]'
          git push origin HEAD:seed-man-ci-repair-20260908
