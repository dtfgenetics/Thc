name: Verify Live THC Infographics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-live-infographics.yml
      - site/wordpress/assets/infographics/**
      - site/public-route-patch/learn/infographics/**
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish THC Infographics to WordPress Production
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-live-thc-infographics
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Probe live library and rendered WordPress media
        id: probe
        shell: python
        run: |
          import html
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          page_url = 'https://dtfseeds.com/learn/infographics/'
          accepted_headings = ('Searchable Infographic Library', 'THC Infographic Library')
          guided_markers = {
              'learning_system': 'Use the library as a learning system',
              'learning_paths': 'Choose a learning path',
              'topic_filter': 'thc-infographic-topic',
              'study_questions': 'Study question:',
          }

          def fetch(url):
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 THC-Live-Verification/2.5',
                  'Cache-Control': 'no-cache, no-store, max-age=0',
                  'Pragma': 'no-cache',
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      return {
                          'ok': 200 <= response.status < 300,
                          'status': response.status,
                          'content_type': response.headers.get('Content-Type', ''),
                          'bytes': len(body),
                          'body': body,
                          'final_url': response.geturl(),
                      }
              except urllib.error.HTTPError as exc:
                  return {'ok': False, 'status': exc.code, 'content_type': '', 'bytes': 0, 'body': b'', 'final_url': url}
              except Exception as exc:
                  return {'ok': False, 'status': None, 'content_type': '', 'bytes': 0, 'body': b'', 'final_url': url, 'error': str(exc)}

          class LibraryParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_card = False
                  self.card_depth = 0
                  self.anchor_stack = []
                  self.cards = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  attr = dict(attrs)
                  classes = set(attr.get('class', '').split())
                  if tag == 'article' and 'thc-library-card' in classes and not self.in_card:
                      self.in_card = True
                      self.card_depth = 1
                      self.current = {'href': '', 'src': ''}
                      return
                  if not self.in_card:
                      return
                  if tag == 'article':
                      self.card_depth += 1
                  elif tag == 'a':
                      href = html.unescape(attr.get('href', ''))
                      self.anchor_stack.append(href)
                  elif tag == 'img' and self.current is not None:
                      self.current['src'] = html.unescape(attr.get('src', ''))
                      if self.anchor_stack:
                          self.current['href'] = self.anchor_stack[-1]

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

              def handle_endtag(self, tag):
                  if not self.in_card:
                      return
                  if tag == 'a' and self.anchor_stack:
                      self.anchor_stack.pop()
                  elif tag == 'article':
                      self.card_depth -= 1
                      if self.card_depth == 0:
                          if self.current:
                              self.cards.append(self.current)
                          self.in_card = False
                          self.current = None
                          self.anchor_stack.clear()

          page = None
          text = ''
          heading_found = False
          guided_marker_state = {key: False for key in guided_markers}
          guided_learning_ready = False
          for attempt in range(1, 7):
              page = fetch(f'{page_url}?verify={int(time.time())}-{attempt}')
              text = page['body'].decode('utf-8', errors='ignore')
              heading_found = any(marker in text for marker in accepted_headings)
              guided_marker_state = {key: marker in text for key, marker in guided_markers.items()}
              guided_learning_ready = all(guided_marker_state.values())
              if page['ok'] and heading_found and guided_learning_ready and 'wp-content/uploads/' in text:
                  break
              if attempt < 6:
                  time.sleep(10)

          parser = LibraryParser()
          parser.feed(text)
          cards = parser.cards
          card_media = []
          seen = set()
          for card in cards:
              for key in ('src', 'href'):
                  value = card.get(key, '')
                  if '/wp-content/uploads/' not in value:
                      continue
                  absolute = urllib.parse.urljoin(page_url, value)
                  if absolute not in seen:
                      seen.add(absolute)
                      card_media.append(absolute)

          preview_urls = []
          seen_preview = set()
          for card in cards:
              selected = ''
              for key in ('src', 'href'):
                  value = card.get(key, '')
                  if '/wp-content/uploads/' in value:
                      selected = value
                      break
              if not selected:
                  continue
              absolute = urllib.parse.urljoin(page_url, selected)
              if absolute not in seen_preview:
                  seen_preview.add(absolute)
                  preview_urls.append(absolute)

          sample_urls = preview_urls[:20]
          media_results = []
          for url in sample_urls:
              result = fetch(url)
              content_type = (result.get('content_type') or '').lower()
              media_results.append({
                  'url': url,
                  'ok': bool(result['ok'] and result['bytes'] >= 1000 and content_type.startswith('image/')),
                  'status': result['status'],
                  'content_type': result.get('content_type', ''),
                  'bytes': result['bytes'],
                  'final_url': result.get('final_url'),
                  'error': result.get('error'),
              })

          live_media_count = sum(1 for item in media_results if item['ok'])
          production_ready = bool(
              page
              and page['ok']
              and heading_found
              and guided_learning_ready
              and len(cards) >= 70
              and len(card_media) >= 70
              and len(sample_urls) >= 10
              and live_media_count == len(sample_urls)
          )

          report = {
              'verified_at_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'page_url': page_url,
              'page_http_status': page.get('status') if page else None,
              'page_final_url': page.get('final_url') if page else None,
              'page_bytes': page.get('bytes') if page else 0,
              'page_has_infographic_heading': heading_found,
              'guided_learning_ready': guided_learning_ready,
              'guided_learning_markers': guided_marker_state,
              'rendered_infographic_card_count': len(cards),
              'rendered_wordpress_media_url_count': len(card_media),
              'sampled_rendered_media_count': len(sample_urls),
              'sampled_rendered_media_live': live_media_count,
              'sampled_rendered_media': media_results,
              'production_ready': production_ready,
          }

          pathlib.Path('docs/LIVE_INFOGRAPHIC_STATUS.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          with open(__import__('os').environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"production_ready={'true' if production_ready else 'false'}\n")
              output.write(f"guided_learning_ready={'true' if guided_learning_ready else 'false'}\n")
              output.write(f"page_status={report['page_http_status']}\n")
              output.write(f"card_count={len(cards)}\n")
              output.write(f"rendered_count={len(card_media)}\n")
              output.write(f"sample_live={live_media_count}\n")
              output.write(f"sample_total={len(sample_urls)}\n")
          print(json.dumps(report, indent=2))
          if not production_ready:
              missing = [key for key, present in guided_marker_state.items() if not present]
              if missing:
                  print(f'Missing guided-learning markers: {missing}')
              raise SystemExit('Live infographic verification failed; see docs/LIVE_INFOGRAPHIC_STATUS.json output above.')

      - name: Upload independent verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-thc-infographic-verification-${{ github.run_id }}
          path: docs/LIVE_INFOGRAPHIC_STATUS.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report independent verification to advisory issue 220
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          PRODUCTION_READY: ${{ steps.probe.outputs.production_ready }}
          GUIDED_LEARNING_READY: ${{ steps.probe.outputs.guided_learning_ready }}
          PAGE_STATUS: ${{ steps.probe.outputs.page_status }}
          CARD_COUNT: ${{ steps.probe.outputs.card_count }}
          RENDERED_COUNT: ${{ steps.probe.outputs.rendered_count }}
          SAMPLE_LIVE: ${{ steps.probe.outputs.sample_live }}
          SAMPLE_TOTAL: ${{ steps.probe.outputs.sample_total }}
        with:
          script: |
            const body = [
              '## Independent live THC infographic verification',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Probe outcome: **${process.env.PROBE_OUTCOME || 'unknown'}**`,
              `Production ready: **${process.env.PRODUCTION_READY || 'false'}**`,
              `Guided learning controls live: **${process.env.GUIDED_LEARNING_READY || 'false'}**`,
              `Library HTTP status: **${process.env.PAGE_STATUS || 'unknown'}**`,
              `Rendered infographic cards: **${process.env.CARD_COUNT || '0'}**`,
              `Rendered card media URLs found: **${process.env.RENDERED_COUNT || '0'}**`,
              `Sampled infographic previews live: **${process.env.SAMPLE_LIVE || '0'}/${process.env.SAMPLE_TOTAL || '0'}**`,
              '',
              'Required guided-learning markers: learning-system introduction, learning paths, subject filter, and study questions on infographic cards.',
              'Target: https://dtfseeds.com/learn/infographics/',
              'Evidence is uploaded as a workflow artifact. The verifier intentionally does not commit generated status files back to main, preventing verification from recursively retriggering production workflows.'
            ].join('\n');
            try {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 220, body });
            } catch (error) {
              core.warning(`Independent infographic advisory report could not be posted: ${error.message}`);
            }
