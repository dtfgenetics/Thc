name: Verify Live THC Infographics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-live-infographics.yml
      - site/wordpress/assets/infographics/**
      - site/public-route-patch/learn/infographics/**
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish THC Infographics to WordPress Production
    types: [completed]

permissions:
  contents: write

concurrency:
  group: verify-live-thc-infographics
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Probe live library and rendered WordPress media
        shell: python
        run: |
          import html
          import json
          import pathlib
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          page_url = 'https://dtfseeds.com/learn/infographics/'

          def fetch(url):
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 THC-Live-Verification/2.0',
                  'Cache-Control': 'no-cache',
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      return {
                          'ok': 200 <= response.status < 300,
                          'status': response.status,
                          'content_type': response.headers.get('Content-Type', ''),
                          'bytes': len(body),
                          'body': body,
                          'final_url': response.geturl(),
                      }
              except urllib.error.HTTPError as exc:
                  return {'ok': False, 'status': exc.code, 'content_type': '', 'bytes': 0, 'body': b'', 'final_url': url}
              except Exception as exc:
                  return {'ok': False, 'status': None, 'content_type': '', 'bytes': 0, 'body': b'', 'final_url': url, 'error': str(exc)}

          page = None
          text = ''
          for attempt in range(1, 7):
              page = fetch(f'{page_url}?verify={int(time.time())}-{attempt}')
              text = page['body'].decode('utf-8', errors='ignore')
              if page['ok'] and 'THC Infographic Library' in text and 'wp-content/uploads/' in text:
                  break
              if attempt < 6:
                  time.sleep(10)

          raw_urls = re.findall(r'''(?:src|href)=["']([^"']*wp-content/uploads/[^"']+)["']''', text, flags=re.I)
          media_urls = []
          seen = set()
          for value in raw_urls:
              value = html.unescape(value)
              absolute = urllib.parse.urljoin(page_url, value)
              if absolute not in seen:
                  seen.add(absolute)
                  media_urls.append(absolute)

          sample_urls = media_urls[:20]
          media_results = []
          for url in sample_urls:
              result = fetch(url)
              content_type = (result.get('content_type') or '').lower()
              media_results.append({
                  'url': url,
                  'ok': bool(result['ok'] and result['bytes'] >= 10000 and content_type.startswith('image/')),
                  'status': result['status'],
                  'content_type': result.get('content_type', ''),
                  'bytes': result['bytes'],
                  'final_url': result.get('final_url'),
                  'error': result.get('error'),
              })

          live_media_count = sum(1 for item in media_results if item['ok'])
          production_ready = bool(
              page
              and page['ok']
              and 'THC Infographic Library' in text
              and len(media_urls) >= 100
              and len(sample_urls) >= 10
              and live_media_count == len(sample_urls)
          )

          report = {
              'verified_at_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'page_url': page_url,
              'page_http_status': page.get('status') if page else None,
              'page_final_url': page.get('final_url') if page else None,
              'page_bytes': page.get('bytes') if page else 0,
              'page_has_infographic_heading': 'THC Infographic Library' in text,
              'rendered_wordpress_media_url_count': len(media_urls),
              'sampled_rendered_media_count': len(sample_urls),
              'sampled_rendered_media_live': live_media_count,
              'sampled_rendered_media': media_results,
              'production_ready': production_ready,
          }

          path = pathlib.Path('docs/LIVE_INFOGRAPHIC_STATUS.json')
          path.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          if not production_ready:
              raise SystemExit('Live infographic verification failed; see docs/LIVE_INFOGRAPHIC_STATUS.json output above.')

      - name: Commit verification report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/LIVE_INFOGRAPHIC_STATUS.json
          if git diff --cached --quiet; then
            echo 'Live verification report unchanged.'
            exit 0
          fi
          git commit -m 'Record live THC infographic verification'
          git pull --rebase origin main
          git push origin HEAD:main
