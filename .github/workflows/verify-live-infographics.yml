name: Verify Live THC Infographics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-live-thc-infographics
  cancel-in-progress: true

jobs:
  verify:
    name: Verify approved-only THC visual library
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Probe approved-only visual library over IPv4
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          page_url='https://dtfseeds.com/learn/infographics/'
          body="$RUNNER_TEMP/live-approved-visual-library.html"
          report="$RUNNER_TEMP/live-approved-visual-library.json"
          ok=0

          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              "${page_url}?verify_approved=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" \
              --output "$body"; then
              if grep -Fqi 'dtf-approved-visual-library-v2' "$body" && grep -Fqi 'Visual plant science library.' "$body"; then
                if OUTPUT="$body" REPORT="$report" node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync(process.env.OUTPUT, 'utf8');
          const lower = html.toLowerCase();
          const policy = JSON.parse(fs.readFileSync('site/wordpress/visual-quality-policy.json', 'utf8'));
          const failures = [];

          if (Number(policy.schemaVersion) < 3 || policy.mode !== 'quarantine') failures.push('visual quarantine v3+ is not active');
          if (policy.replacementPolicy?.legacyInfographicReuseAllowed !== false) failures.push('legacy infographic reuse is not disabled');
          if (policy.replacementPolicy?.imageLessFallbackPreferred !== true) failures.push('image-less fallback is not the preferred policy');

          for (const value of policy?.bannedMedia?.urlContains || []) {
            if (value && lower.includes(String(value).toLowerCase())) failures.push(`banned URL rendered: ${value}`);
          }
          for (const prefix of policy?.bannedMedia?.slugPrefixes || []) {
            if (prefix && lower.includes(String(prefix).toLowerCase())) failures.push(`banned slug prefix rendered: ${prefix}`);
          }
          for (const prefix of policy?.bannedHtml?.altPrefixes || []) {
            if (prefix && lower.includes(`alt="${String(prefix).toLowerCase()}`)) failures.push(`banned alt identity rendered: ${prefix}`);
          }

          const approvedPrefix = 'dtf-approved-visual-';
          const approvedOccurrences = (lower.match(new RegExp(approvedPrefix, 'g')) || []).length;
          const emptyState = lower.includes('approved replacement visuals are being rebuilt.');
          if (approvedOccurrences === 0 && !emptyState) failures.push('zero approved visuals rendered without the intentional quality-gate empty state');

          const result = {
            verifiedAtUtc: new Date().toISOString(),
            pageUrl: 'https://dtfseeds.com/learn/infographics/',
            contract: 'dtf-approved-visual-library-v2',
            approvedVisualIdentityOccurrences: approvedOccurrences,
            intentionalEmptyState: emptyState,
            quarantineMode: policy.mode,
            legacyReuseAllowed: policy.replacementPolicy?.legacyInfographicReuseAllowed,
            productionReady: failures.length === 0,
            failures
          };
          fs.writeFileSync(process.env.REPORT, `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify(result, null, 2));
          if (failures.length) process.exit(1);
          NODE
                then
                  ok=1
                  break
                fi
              fi
            fi
            sleep 5
          done

          [[ "$ok" -eq 1 ]] || {
            echo 'Approved-only THC visual library verification failed.' >&2
            test -s "$report" && cat "$report" >&2 || true
            head -c 5000 "$body" >&2 || true
            exit 1
          }

          mkdir -p docs
          cp "$report" docs/LIVE_INFOGRAPHIC_STATUS.json
          echo 'production_ready=true' >> "$GITHUB_OUTPUT"

      - name: Upload independent verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-thc-approved-visual-verification-${{ github.run_id }}
          path: |
            docs/LIVE_INFOGRAPHIC_STATUS.json
            ${{ runner.temp }}/live-approved-visual-library.html
            ${{ runner.temp }}/live-approved-visual-library.json
          if-no-files-found: warn
          retention-days: 30
