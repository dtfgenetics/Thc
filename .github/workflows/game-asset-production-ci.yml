name: Game Asset Production CI

on:
  pull_request:
    paths:
      - 'docs/GAME_ASSET_PRODUCTION_MASTER.md'
      - 'data/game-asset-production-registry.json'
      - 'data/game-asset-batches/**'
      - '.agents/skills/dtf-game-asset-production/SKILL.md'
      - 'scripts/validate-game-asset-production.mjs'
      - 'scripts/recover-approved-game-asset.mjs'
      - '.github/workflows/game-asset-production-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/GAME_ASSET_PRODUCTION_MASTER.md'
      - 'data/game-asset-production-registry.json'
      - 'data/game-asset-batches/**'
      - '.agents/skills/dtf-game-asset-production/SKILL.md'
      - 'scripts/validate-game-asset-production.mjs'
      - 'scripts/recover-approved-game-asset.mjs'
      - '.github/workflows/game-asset-production-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate asset production registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate game asset production control files
        run: node scripts/validate-game-asset-production.mjs
