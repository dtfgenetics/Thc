name: Simple User Guide system

on:
  pull_request:
    paths:
      - 'assets/education/simple-info-graphics/active/simple-user-guide/**'
      - 'site/wordpress/education/simple-user-guide-*.json'
      - 'scripts/validate-simple-user-guide-system.mjs'
      - 'scripts/publish-wordpress-simple-user-guide-batch1.mjs'
      - '.github/workflows/simple-user-guide-system.yml'
  push:
    branches: [main]
    paths:
      - 'assets/education/simple-info-graphics/active/simple-user-guide/**'
      - 'site/wordpress/education/simple-user-guide-*.json'
      - 'scripts/validate-simple-user-guide-system.mjs'
      - 'scripts/publish-wordpress-simple-user-guide-batch1.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source, visuals, evidence, and release gates
        run: node scripts/validate-simple-user-guide-system.mjs
      - name: Validate WordPress publisher input
        run: node scripts/publish-wordpress-simple-user-guide-batch1.mjs --validate-only
