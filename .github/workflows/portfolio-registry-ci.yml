name: Portfolio Registry CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/project-registry.json'
      - 'data/site-registry.json'
      - 'data/asset-manifest.json'
      - 'data/asset-manifest.schema.json'
      - 'site/deployment/public-apps.json'
      - 'site/public-route-patch/projects/**'
      - 'games/high-iq/**'
      - 'games/high-life/**'
      - 'games/grower-conversations/**'
      - 'games/cannabis-fleet-battle/**'
      - 'games/protect-the-plants/**'
      - 'games/strain-showdown/**'
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/high-iq/**'
      - 'site/public-route-patch/games/high-life/**'
      - 'site/public-route-patch/games/grower-conversations/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'site/public-route-patch/games/protect-the-plants/**'
      - 'docs/**SOURCE_OF_TRUTH.md'
      - 'docs/PORTFOLIO_RELEASE_CRITERIA.md'
      - 'scripts/validate-portfolio-registry.mjs'
      - '.github/workflows/portfolio-registry-ci.yml'
  pull_request:
    paths:
      - 'data/project-registry.json'
      - 'data/site-registry.json'
      - 'data/asset-manifest.json'
      - 'data/asset-manifest.schema.json'
      - 'site/deployment/public-apps.json'
      - 'site/public-route-patch/projects/**'
      - 'games/high-iq/**'
      - 'games/high-life/**'
      - 'games/grower-conversations/**'
      - 'games/cannabis-fleet-battle/**'
      - 'games/protect-the-plants/**'
      - 'games/strain-showdown/**'
      - 'games/seed-man-platformer/**'
      - 'site/public-route-patch/games/high-iq/**'
      - 'site/public-route-patch/games/high-life/**'
      - 'site/public-route-patch/games/grower-conversations/**'
      - 'site/public-route-patch/games/seed-man-platformer/**'
      - 'site/public-route-patch/games/protect-the-plants/**'
      - 'docs/**SOURCE_OF_TRUTH.md'
      - 'docs/PORTFOLIO_RELEASE_CRITERIA.md'
      - 'scripts/validate-portfolio-registry.mjs'
      - '.github/workflows/portfolio-registry-ci.yml'

permissions:
  contents: read

concurrency:
  group: portfolio-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate project, site, and asset registries
        run: node scripts/validate-portfolio-registry.mjs

      - name: Validate implemented game data and engines
        shell: bash
        run: |
          set -euo pipefail
          node games/high-iq/scripts/validate-data.mjs
          node games/high-life/test/engine.test.mjs
          node games/grower-conversations/scripts/validate-prompt-bank.mjs
          node games/cannabis-fleet-battle/test/engine.test.mjs
          node --check site/public-route-patch/games/protect-the-plants/app.js
          php -l site/public-route-patch/games/protect-the-plants/api.php
          node games/strain-showdown/scripts/validate-roster.mjs
          node games/seed-man-platformer/test/physics.test.mjs

      - name: Verify canonical project statuses match deployment states
        run: |
          node <<'NODE'
          const projects = require('./data/project-registry.json').projects;
          const apps = require('./site/deployment/public-apps.json').apps;
          const project = (id) => projects.find((item) => item.id === id);
          const app = (id) => apps.find((item) => item.id === id);
          const expect = (condition, message) => { if (!condition) throw new Error(message); };

          expect(project('high-iq')?.status === 'canonical', 'High IQ must be canonical');
          expect(app('high-iq')?.runtime === 'static' && app('high-iq')?.status === 'ready-to-package', 'High IQ deployment state drift');

          expect(project('high-life')?.status === 'browser-prototype', 'High Life registry state drift');
          expect(app('high-life')?.runtime === 'static' && app('high-life')?.status === 'ready-to-package', 'High Life deployment state drift');

          expect(project('grower-conversations')?.status === 'browser-deck-alpha', 'Grower Conversations registry state drift');
          expect(app('grower-conversations')?.runtime === 'static' && app('grower-conversations')?.status === 'ready-to-package', 'Grower Conversations deployment state drift');

          expect(project('cannabis-fleet-battle')?.status === 'server-engine-alpha', 'Fleet Battle registry state drift');
          expect(app('cannabis-fleet-battle')?.runtime === 'server-engine' && app('cannabis-fleet-battle')?.status === 'server-engine-alpha', 'Fleet Battle deployment state drift');

          expect(app('protect-the-plants')?.runtime === 'static-php' && app('protect-the-plants')?.status === 'ready-to-package', 'Protect the Plants deployment state drift');

          expect(project('strain-showdown')?.status === 'roster-data-alpha', 'Strain Showdown registry state drift');
          expect(app('strain-showdown')?.runtime === 'roster-data' && app('strain-showdown')?.status === 'roster-data-alpha', 'Strain Showdown deployment state drift');

          expect(project('seed-man-platformer')?.status === 'browser-vertical-slice', 'Seed Man registry state drift');
          expect(app('seed-man-platformer')?.runtime === 'static-canvas2d' && app('seed-man-platformer')?.status === 'ready-to-package', 'Seed Man deployment state drift');
          NODE

      - name: Verify self-hosted public route files exist
        shell: bash
        run: |
          set -euo pipefail
          for route in high-iq high-life grower-conversations seed-man-platformer protect-the-plants; do
            test -s "site/public-route-patch/games/$route/index.html"
            grep -Fqi 'rel="canonical"' "site/public-route-patch/games/$route/index.html"
            grep -Fqi 'name="description"' "site/public-route-patch/games/$route/index.html"
          done
          test -s site/public-route-patch/games/protect-the-plants/api.php
          test -s site/public-route-patch/games/protect-the-plants/app.js
          test -s site/public-route-patch/games/protect-the-plants/styles.css
          test -s site/public-route-patch/games/protect-the-plants/plant.svg
          test -s site/public-route-patch/projects/index.html
          grep -Fq 'High Life: From Bagseed to Legacy' site/public-route-patch/projects/index.html
          grep -Fq 'Cannabis Fleet Battle' site/public-route-patch/projects/index.html
          grep -Fq 'Strain Showdown' site/public-route-patch/projects/index.html

      - name: Validate High IQ legacy fallback boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'The older Base44 build is retained only as a legacy fallback link' docs/HIGH_IQ_SOURCE_OF_TRUTH.md
