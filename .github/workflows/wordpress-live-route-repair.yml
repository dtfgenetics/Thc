name: Repair DTFSeeds WordPress Live Routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/wordpress/pages/**
      - site/wordpress/assets/infographics/**
      - scripts/apply-wordpress-public-content-rest.mjs
      - scripts/rebuild-wordpress-visual-site.mjs
      - scripts/rebuild-wordpress-infographic-gallery.mjs
      - .github/workflows/wordpress-live-route-repair.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-live-route-repair
  cancel-in-progress: true

jobs:
  repair:
    name: Rebuild WordPress and retire stale static route shadows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      BACKUP_ROOT: /tmp/dtfseeds-live-route-repair
      SSH_HOST: ${{ secrets.HOSTINGER_HOST || secrets.SSH_HOST || secrets.SFTP_HOST }}
      SSH_USER: ${{ secrets.HOSTINGER_USER || secrets.HOSTINGER_SSH_USER || secrets.SSH_USER || secrets.SFTP_USER }}
      SSH_PORT: ${{ secrets.HOSTINGER_PORT || secrets.SSH_PORT || secrets.SFTP_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS || secrets.SSH_KNOWN_HOSTS }}
      SITE_ROOT: ${{ vars.HOSTINGER_WORDPRESS_PATH || vars.WORDPRESS_PATH || vars.WP_PATH }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repair package and credentials
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/rebuild-wordpress-visual-site.mjs
          node --check scripts/rebuild-wordpress-infographic-gallery.mjs
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          : "${SSH_USER:?Missing Hostinger SSH user}"
          : "${SSH_PRIVATE_KEY:?Missing Hostinger SSH private key}"
          SSH_HOST="${SSH_HOST:-147.93.42.1}"
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          echo "SSH_HOST=$SSH_HOST" >> "$GITHUB_ENV"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"

      - name: Reconcile canonical WordPress pages
        id: content
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-wordpress-public-content-rest.mjs

      - name: Rebuild visual Home and Learn pages
        id: visual
        env:
          APPLY_VISUAL_REBUILD: 'true'
          BACKUP_ROOT: /tmp/dtfseeds-live-route-repair/visual
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rebuild-wordpress-visual-site.mjs

      - name: Rebuild infographic library
        id: infographics
        env:
          APPLY_INFOGRAPHIC_GALLERY: 'true'
          BACKUP_ROOT: /tmp/dtfseeds-live-route-repair/infographics
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rebuild-wordpress-infographic-gallery.mjs

      - name: Configure Hostinger SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ -n "${SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Locate WordPress document root
        id: root
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SITE_ROOT:-}" ]]; then
            root="$SITE_ROOT"
          else
            root="$(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          while IFS= read -r config; do
            directory="$(dirname "$config")"
            if command -v wp >/dev/null 2>&1; then
              home_url="$(wp --path="$directory" option get home --skip-plugins --skip-themes 2>/dev/null || true)"
              case "${home_url%/}" in
                https://dtfseeds.com|http://dtfseeds.com|https://www.dtfseeds.com|http://www.dtfseeds.com)
                  printf '%s\n' "$directory"
                  exit 0
                  ;;
              esac
            fi
          done < <(find "$HOME" -maxdepth 8 -type f -name wp-config.php -print 2>/dev/null)
          exit 1
          REMOTE
          )"
          fi
          [[ -n "$root" ]]
          [[ "$root" =~ ^[A-Za-z0-9_./-]+$ ]]
          [[ "$root" != "/" ]]
          [[ "$root" != *".."* ]]
          echo "path=$root" >> "$GITHUB_OUTPUT"

      - name: Back up and retire stale static WordPress shadows
        id: shadows
        shell: bash
        env:
          ROOT: ${{ steps.root.outputs.path }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$HOME/dtfseeds-route-shadow-backups/$stamp"
          result="$(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "ROOT='$ROOT' BACKUP='$backup' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$BACKUP"
          removed=0

          retire_if_stale() {
            rel="$1"
            shift
            file="$ROOT/$rel"
            [[ -f "$file" ]] || return 0
            stale=0
            for marker in "$@"; do
              if grep -Fqi -- "$marker" "$file"; then
                stale=1
                break
              fi
            done
            [[ "$stale" -eq 1 ]] || return 0
            mkdir -p "$BACKUP/$(dirname "$rel")"
            cp -a "$file" "$BACKUP/$rel"
            rm -f "$file"
            printf 'retired:%s\n' "$rel"
            removed=$((removed + 1))
          }

          retire_if_stale index.html \
            'dtf-home.css' \
            'THC Grow Doc, genetics, cultivation education, and games in one home.'

          retire_if_stale learn/index.html \
            'Grow education belongs in a clean, readable library.' \
            'MOPS, cultivation notes, THC basics'

          retire_if_stale learn/infographics/index.html \
            'being rebuilt' \
            'Reserved strain card' \
            'Tool-ready rebuild'

          if command -v wp >/dev/null 2>&1; then
            wp --path="$ROOT" rewrite flush --hard >/dev/null 2>&1 || true
            wp --path="$ROOT" cache flush >/dev/null 2>&1 || true
          fi
          printf 'removed=%s\n' "$removed"
          printf 'backup=%s\n' "$BACKUP"
          REMOTE
          )"
          printf '%s\n' "$result"
          removed="$(printf '%s\n' "$result" | awk -F= '/^removed=/{print $2}' | tail -1)"
          echo "removed=${removed:-0}" >> "$GITHUB_OUTPUT"

      - name: Verify WordPress REST content is current
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' "$WP_API_USERNAME" "$WP_API_PASSWORD" | base64 -w0)"
          verify_rest_page() {
            slug="$1"
            marker="$2"
            file="$RUNNER_TEMP/rest-$slug.json"
            curl -4 --fail --silent --show-error --location \
              -H "Authorization: Basic $auth" \
              "$WP_SITE_URL/wp-json/wp/v2/pages?slug=$slug&context=edit&per_page=1" \
              -o "$file"
            node - "$file" "$marker" <<'NODE'
          const fs = require('fs');
          const [file, marker] = process.argv.slice(2);
          const pages = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!Array.isArray(pages) || pages.length !== 1) throw new Error(`Page lookup failed: ${file}`);
          const body = pages[0]?.content?.raw || pages[0]?.content?.rendered || '';
          if (!body.toLowerCase().includes(marker.toLowerCase())) throw new Error(`Expected marker missing from WordPress page: ${marker}`);
          NODE
          }
          verify_rest_page home 'Genetics. Plant science. Tools. Games. Community.'
          verify_rest_page learn 'Explore by subject'

      - name: Verify public routes now resolve to current WordPress output
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          verify_live() {
            path="$1"
            marker="$2"
            minimum_images="$3"
            file="$RUNNER_TEMP/live-$(printf '%s' "$path" | tr '/?' '__').html"
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "$WP_SITE_URL${path}?dtf_route_repair=${GITHUB_RUN_ID}-${attempt}" \
                -o "$file"; then
                if grep -Fqi -- "$marker" "$file"; then
                  ok=1
                  break
                fi
              fi
              sleep 5
            done
            [[ "$ok" -eq 1 ]] || {
              echo "Live route did not expose current WordPress marker: $path -> $marker" >&2
              head -c 2500 "$file" >&2 || true
              exit 1
            }
            images="$(grep -o '/wp-content/uploads/' "$file" | wc -l | tr -d ' ')"
            [[ "$images" -ge "$minimum_images" ]] || {
              echo "$path has $images WordPress media references; expected at least $minimum_images" >&2
              exit 1
            }
            for stale in \
              'Grow education belongs in a clean, readable library.' \
              'MOPS, cultivation notes, THC basics' \
              'being rebuilt' \
              'Reserved strain card' \
              'Tool-ready rebuild' \
              'email@email.com' \
              '+123456789'; do
              ! grep -Fqi -- "$stale" "$file" || {
                echo "Stale public content remains on $path: $stale" >&2
                exit 1
              }
            done
            echo "$path verified ($images WordPress media references)"
          }

          verify_live '/' 'Genetics. Plant science. Tools. Games. Community.' 8
          verify_live '/learn/' 'Explore by subject' 10
          verify_live '/learn/infographics/' 'Visual plant science and cultivation library.' 30

      - name: Upload repair backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtfseeds-live-route-repair-${{ github.run_id }}
          path: /tmp/dtfseeds-live-route-repair
          if-no-files-found: warn
          retention-days: 30

      - name: Report live-route repair
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          CONTENT_OUTCOME: ${{ steps.content.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          INFOGRAPHIC_OUTCOME: ${{ steps.infographics.outcome }}
          SHADOWS_REMOVED: ${{ steps.shadows.outputs.removed }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const body = [
              '## DTFSeeds live-route repair',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.JOB_STATUS}**`,
              `WordPress page reconciliation: **${process.env.CONTENT_OUTCOME || 'not-run'}**`,
              `Visual rebuild: **${process.env.VISUAL_OUTCOME || 'not-run'}**`,
              `Infographic rebuild: **${process.env.INFOGRAPHIC_OUTCOME || 'not-run'}**`,
              `Known stale static shadows retired: **${process.env.SHADOWS_REMOVED || '0'}**`,
              `Live verification: **${process.env.VERIFY_OUTCOME || 'not-run'}**`,
              '',
              'This workflow backs up and removes only positively identified stale static index files that shadow current WordPress routes, then flushes WordPress routing/cache and verifies the public pages.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body
            });
