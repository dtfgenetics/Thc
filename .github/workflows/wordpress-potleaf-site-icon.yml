name: Publish DTF Potleaf Site Icon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/wordpress/assets/brand/dtf-potleaf-512.png
      - scripts/set-dtf-potleaf-site-icon.mjs
      - .github/workflows/wordpress-potleaf-site-icon.yml
  workflow_run:
    workflows:
      - Rebuild DTFSeeds WordPress Visual Site
      - Rebuild DTFSeeds Visual Site On Command
      - Reconcile DTFSeeds WordPress Pages On Command
      - Recreate Codex WordPress Production Path
      - Publish DTFSeeds WordPress Production
      - Force DTF Visual + Favicon Production
      - Polish DTFSeeds Visual System V3
      - Reconcile DTFSeeds Homepage Social Metadata
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtf-potleaf-site-icon
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-potleaf-site-icon
      DTF_ICON_CACHE_VERSION: v3-20260823

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate potleaf publication package
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          test -n "${DTF_ICON_CACHE_VERSION:-}"
          test -s site/wordpress/assets/brand/dtf-potleaf-512.png
          node --check scripts/set-dtf-potleaf-site-icon.mjs

      - name: Set WordPress Site Icon and logo to the versioned DTF potleaf
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          node scripts/set-dtf-potleaf-site-icon.mjs | tee "$RUNNER_TEMP/potleaf-report-output.txt"
          dir="$(cat "$BACKUP_ROOT/latest.txt")"
          report="$dir/report.json"
          echo "media_id=$(node -p "require(process.argv[1]).mediaId" "$report")" >> "$GITHUB_OUTPUT"
          echo "media_slug=$(node -p "require(process.argv[1]).mediaSlug" "$report")" >> "$GITHUB_OUTPUT"
          echo "cache_version=$(node -p "require(process.argv[1]).cacheVersion" "$report")" >> "$GITHUB_OUTPUT"
          echo "source_url=$(node -p "require(process.argv[1]).sourceUrl" "$report")" >> "$GITHUB_OUTPUT"

      - name: Verify public head uses only the new potleaf favicon family
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' "$WP_API_USERNAME" "$WP_API_PASSWORD" | base64 -w0)"
          curl -4 -fsSL -H "Authorization: Basic $auth" \
            "$WP_SITE_URL/wp-json/wp/v2/settings?context=edit" -o "$RUNNER_TEMP/settings.json"
          node - "$RUNNER_TEMP/settings.json" "${{ steps.publish.outputs.media_id }}" <<'NODE'
          const s=require(process.argv[2]);
          const id=Number(process.argv[3]);
          if(Number(s.site_icon)!==id) throw new Error(`site_icon mismatch: ${s.site_icon} != ${id}`);
          if(Object.prototype.hasOwnProperty.call(s,'site_logo') && Number(s.site_logo)!==id) throw new Error(`site_logo mismatch: ${s.site_logo} != ${id}`);
          console.log(`WordPress settings point to versioned potleaf media ${id}`);
          NODE

          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            body="$RUNNER_TEMP/home-${attempt}.html"
            curl -4 -fsSL --retry 2 --retry-delay 2 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$WP_SITE_URL/?dtf_potleaf_icon=${GITHUB_RUN_ID}-${attempt}" -o "$body"
            if node - "$body" "${{ steps.publish.outputs.source_url }}" "${{ steps.publish.outputs.media_slug }}" <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync(process.argv[2],'utf8');
          const source=process.argv[3];
          const slug=process.argv[4].toLowerCase();
          const links=[...html.matchAll(/<link\b[^>]*>/gi)].map(m=>m[0]);
          const metas=[...html.matchAll(/<meta\b[^>]*>/gi)].map(m=>m[0]);
          const iconTags=links.filter(tag=>/rel=["'][^"']*icon[^"']*["']/i.test(tag) && !/apple-touch-icon/i.test(tag));
          const appleTags=links.filter(tag=>/rel=["']apple-touch-icon["']/i.test(tag));
          const tileTags=metas.filter(tag=>/name=["']msapplication-TileImage["']/i.test(tag));
          const versioned=tag=>tag.toLowerCase().includes(slug);
          const has32=iconTags.some(tag=>versioned(tag) && /sizes=["']32x32["']/i.test(tag));
          const has192=iconTags.some(tag=>versioned(tag) && /sizes=["']192x192["']/i.test(tag));
          const hasApple=appleTags.some(versioned);
          const staleIcons=iconTags.filter(tag=>!versioned(tag));
          const staleApple=appleTags.filter(tag=>!versioned(tag));
          const staleTiles=tileTags.filter(tag=>!versioned(tag));
          if(!source.toLowerCase().includes(slug)) throw new Error(`Source URL is not versioned: ${source}`);
          if(!has32) throw new Error('Missing versioned 32x32 potleaf favicon declaration');
          if(!has192) throw new Error('Missing versioned 192x192 potleaf favicon declaration');
          if(!hasApple) throw new Error('Missing versioned potleaf apple-touch-icon declaration');
          if(staleIcons.length) throw new Error(`Stale non-potleaf favicon declarations remain: ${staleIcons.join(' | ')}`);
          if(staleApple.length) throw new Error(`Stale apple-touch-icon declarations remain: ${staleApple.join(' | ')}`);
          if(staleTiles.length) throw new Error(`Stale msapplication tile image declarations remain: ${staleTiles.join(' | ')}`);
          if(/assets\/dtf-home\/dtf-mark\.svg/i.test(html)) throw new Error('Legacy DTF mark is still referenced in the public head');
          console.log([...iconTags,...appleTags,...tileTags].join('\n'));
          NODE
            then ok=1; break; fi
            sleep 8
          done
          [[ "$ok" -eq 1 ]] || { echo 'Fresh public homepage does not expose only the new DTF potleaf favicon family.' >&2; exit 1; }

      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-potleaf-site-icon-${{ github.run_id }}
          path: /tmp/dtf-potleaf-site-icon
          if-no-files-found: warn
          retention-days: 30

      - name: Report potleaf publication result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          MEDIA_ID: ${{ steps.publish.outputs.media_id }}
          MEDIA_SLUG: ${{ steps.publish.outputs.media_slug }}
          CACHE_VERSION: ${{ steps.publish.outputs.cache_version }}
          SOURCE_URL: ${{ steps.publish.outputs.source_url }}
        with:
          script: |
            const body = [
              '## DTF potleaf favicon regression guard',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.JOB_STATUS}**`,
              `WordPress potleaf setting: **${process.env.PUBLISH_OUTCOME || 'not-run'}**`,
              `Fresh visitor favicon verification: **${process.env.VERIFY_OUTCOME || 'not-run'}**`,
              `Potleaf media ID: **${process.env.MEDIA_ID || 'not-run'}**`,
              `Version: **${process.env.CACHE_VERSION || 'not-run'}**`,
              `Media slug: **${process.env.MEDIA_SLUG || 'not-run'}**`,
              `Versioned source URL: ${process.env.SOURCE_URL || 'not-run'}`,
              '',
              'The guard reapplies the cannabis-leaf icon after WordPress visual/presentation production workflows so older site-icon media cannot silently replace it again. Success also requires every favicon and Apple touch icon declaration in the public head to use the current versioned potleaf asset.'
            ].join('\n');
            try {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 220, body });
            } catch (error) {
              core.warning(`Potleaf advisory report could not be posted: ${error.message}`);
            }
