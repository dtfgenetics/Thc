name: Repair DTFSeeds WordPress Cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/repair-wordpress-cache-rest.mjs
      - .github/workflows/wordpress-cache-repair.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-cache-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repair script and credentials
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/repair-wordpress-cache-rest.mjs
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"

      - name: Reset stale WordPress page cache and verify public routes
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repair-wordpress-cache-rest.mjs | tee "$RUNNER_TEMP/cache-repair.json"

      - name: Report cache repair result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## WordPress cache repair',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.JOB_STATUS}**`,
                `Repair step: **${process.env.REPAIR_OUTCOME || 'not-run'}**`,
                '',
                'The repair temporarily disables LiteSpeed through authenticated WordPress REST, verifies Home/Learn/Infographics, then re-enables it only if the current pages remain visible. If LiteSpeed is not the cause, the plugin is restored before the job exits.'
              ].join('\n')
            });
