name: Seed Man Approved Visual Contract CI

on:
  push:
    branches: [main]
    paths:
      - 'site/public-route-patch/games/seed-man-platformer/seed-man-production-art.js'
      - 'site/public-route-patch/games/seed-man-platformer/approved-art-core-v1.js'
      - 'site/public-route-patch/games/seed-man-platformer/approved-art-runtime-v1.js'
      - 'site/public-route-patch/games/seed-man-platformer/data/seed-man-art-manifest-v1.json'
      - 'scripts/verify-seed-man-production-v20.mjs'
      - '.github/workflows/seed-man-sprite-visual-ci.yml'
  pull_request:
    paths:
      - 'site/public-route-patch/games/seed-man-platformer/seed-man-production-art.js'
      - 'site/public-route-patch/games/seed-man-platformer/approved-art-core-v1.js'
      - 'site/public-route-patch/games/seed-man-platformer/approved-art-runtime-v1.js'
      - 'site/public-route-patch/games/seed-man-platformer/data/seed-man-art-manifest-v1.json'
      - 'scripts/verify-seed-man-production-v20.mjs'
      - '.github/workflows/seed-man-sprite-visual-ci.yml'

permissions:
  contents: read

jobs:
  verify-approved-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical approved-art contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-seed-man-production-v20.mjs
          root='site/public-route-patch/games/seed-man-platformer'
          node --check "$root/approved-art-core-v1.js"
          node --check "$root/approved-art-runtime-v1.js"
          node --check "$root/seed-man-production-art.js"
          grep -Fq 'approved-showcase-2026-09-08' "$root/seed-man-production-art.js"
          grep -Fq 'green-armored-plant-hero' "$root/seed-man-production-art.js"
          grep -Fq 'fallbackAllowed:false' "$root/seed-man-production-art.js"
          grep -Fq 'character.seedman.atlas' "$root/approved-art-core-v1.js"
          grep -Fq 'authoritative' "$root/data/seed-man-art-manifest-v1.json"
          ! grep -Fq 'seed-man-production-v1' "$root/seed-man-production-art.js"
          ! grep -Fq 'seed-man-locked-v1' "$root/seed-man-production-art.js"
