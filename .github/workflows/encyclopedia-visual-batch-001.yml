name: Generate Encyclopedia Visual Batch 001

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-encyclopedia-visual-batch-001.py'
      - '.github/workflows/encyclopedia-visual-batch-001.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster dependency
        run: python -m pip install --disable-pip-version-check pillow==12.0.0
      - name: Generate controlled review-pending raster candidates
        run: python scripts/generate-encyclopedia-visual-batch-001.py
      - name: Rebuild visual queue and validate production boundaries
        run: |
          npm run build:encyclopedia-visual-queue
          node scripts/validate-encyclopedia-visual-production-queue.mjs
      - name: Commit generated PNG candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/wordpress/assets/infographics/THC-ENC-098_co2-supply-ventilation-enrichment.png
          git add site/wordpress/assets/infographics/THC-ENC-103_daily-light-integral-calculation.png
          git add site/wordpress/assets/infographics/THC-ENC-268_heat-stress-diagnostic-context.png
          git add site/wordpress/assets/infographics/THC-ENC-269_cold-chilling-stress.png
          git add site/wordpress/assets/infographics/THC-ENC-270_high-light-photoinhibition.png
          git add site/wordpress/assets/infographics/THC-ENC-362_latitude-daylength-seasonal-flowering.png
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "assets: generate encyclopedia visual batch 001"
          git push origin HEAD:main
