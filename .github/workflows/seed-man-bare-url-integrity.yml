name: Verify Seed Man v20 Bare URL Integrity

on:
  workflow_run:
    workflows: ["Deploy DTFSeeds Public Suite via WordPress V2"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bare-url:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify normal visitor URL and canonical assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://dtfseeds.com/games/seed-man-platformer/'
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          status="$(curl -sS --connect-timeout 10 --max-time 35 -o "$tmp/index.html" -w '%{http_code}' "$base")"
          [[ "$status" == 200 ]] || { echo "bare route HTTP $status" >&2; exit 1; }
          test -s "$tmp/index.html"
          for rel in data/campaign.json data/levels-20-v1.json campaign-v20-runtime.js campaign-ui-v20.js approved-art-core-v1.js seed-man-production-art.js; do
            curl -fsS --retry 5 --retry-delay 4 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}${rel}?bare=${GITHUB_RUN_ID}" -o "$tmp/$(basename "$rel")"
          done
          grep -Fq '"levelCount": 20' "$tmp/campaign.json"
          grep -Fq '"finalBoss": "blight-king"' "$tmp/campaign.json"
          grep -Fq 'seed-man-campaign-v20-runtime-v1' "$tmp/campaign-v20-runtime.js"
          grep -Fq 'seed-man-campaign-ui-v20' "$tmp/campaign-ui-v20.js"
          grep -Fq 'character.seedman.atlas' "$tmp/approved-art-core-v1.js"
          grep -Fq 'approved-showcase-2026-09-08' "$tmp/seed-man-production-art.js"
          grep -Fq 'green-armored-plant-hero' "$tmp/seed-man-production-art.js"
          echo 'Bare Seed Man URL serves canonical v20 assets.'
