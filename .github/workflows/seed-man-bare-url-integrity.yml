name: Verify Seed Man v20 Bare URL Integrity

on:
  workflow_run:
    workflows: ["Deploy DTFSeeds Public Suite via WordPress V2"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bare-url:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify normal visitor URL and canonical assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://dtfseeds.com/games/seed-man-platformer/'
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          body="$tmp/index.html"
          headers="$tmp/headers.txt"

          check_contains() {
            local file="$1"
            local needle="$2"
            if ! grep -Fq "$needle" "$file"; then
              echo "Missing expected marker in $(basename "$file"): $needle" >&2
              return 1
            fi
          }

          check_not_contains_re() {
            local file="$1"
            local pattern="$2"
            if grep -Eq "$pattern" "$file"; then
              echo "Found retired marker in $(basename "$file"): $pattern" >&2
              return 1
            fi
          }

          fetch_assets() {
            local bust="$1"
            for rel in data/campaign.json data/levels-20-v1.json player-state-v20.js campaign-v20-runtime.js campaign-ui-v20.js v20-enemy-runtime.js combat-browser-v2.js enemy-attacks-browser-v2.js approved-art-core-v1.js approved-art-runtime-v1.js seed-man-production-art.js; do
              curl -fsS --retry 5 --retry-delay 4 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}${rel}?bare=${bust}" -o "$tmp/$(basename "$rel")" || return 1
            done
          }

          verify_downloaded_contract() {
            check_contains "$body" 'data-seed-man-release="20260909-v20-runtime-v4"'
            check_contains "$body" 'data-seed-ui-release="20260909-v20-runtime-v5"'
            check_contains "$body" 'data-seed-man-approved-art="approved-showcase-2026-09-08"'
            check_contains "$body" 'player-state-v20.js?v=20260918-v20-combat-stakes-v1'
            check_contains "$body" 'combat-browser-v2.js?v=20260918-v20-phenotype-cycle-v1'
            check_not_contains_re "$body" 'Original browser vertical slice|20260830-r4'
            check_contains "$tmp/campaign.json" '"levelCount": 20'
            check_contains "$tmp/campaign.json" '"finalBoss": "blight-king"'
            check_contains "$tmp/player-state-v20.js" 'seed-man-player-state-v20'
            check_contains "$tmp/campaign-v20-runtime.js" 'seed-man-campaign-v20-runtime-v3'
            check_contains "$tmp/campaign-v20-runtime.js" 'approvedWorldBackgrounds:true'
            check_contains "$tmp/campaign-v20-runtime.js" "phenotypeForms:['plant','fire','electric','ice']"
            check_contains "$tmp/campaign-ui-v20.js" 'seed-man-campaign-ui-v20'
            check_contains "$tmp/v20-enemy-runtime.js" 'seed-man-v20-enemy-runtime-v2'
            check_contains "$tmp/combat-browser-v2.js" 'seed-man-combat-browser-v2'
            check_contains "$tmp/enemy-attacks-browser-v2.js" 'seed-man-enemy-attacks-browser-v2'
            check_contains "$tmp/approved-art-core-v1.js" 'seed-man-approved-art-core-v4'
            check_contains "$tmp/approved-art-core-v1.js" 'seed-man-character-atlas-v2.webp'
            check_contains "$tmp/approved-art-core-v1.js" 'seed-man-enemy-boss-atlas-v1.webp'
            check_contains "$tmp/approved-art-core-v1.js" 'seed-man-platform-atlas-v1.webp'
            check_contains "$tmp/approved-art-core-v1.js" 'world.greenhouse-valley.background'
            check_contains "$tmp/approved-art-core-v1.js" 'world.eco-city.background'
            check_not_contains_re "$tmp/approved-art-runtime-v1.js" 'solar-flare|static-haze|frost-resin|shield-bounce'
            check_contains "$tmp/seed-man-production-art.js" 'approved-showcase-2026-09-08'
            check_contains "$tmp/seed-man-production-art.js" 'green-armored-plant-hero'
            check_contains "$tmp/seed-man-production-art.js" 'fallbackAllowed:false'
          }

          fetch_page_with_transient_retry() {
            local attempt status rc
            for attempt in 1 2 3; do
              set +e
              status="$(curl -sS --connect-timeout 10 --max-time 35 --location --dump-header "$headers" -o "$body" -w '%{http_code}' "$base")"
              rc=$?
              set -e

              if (( rc != 0 )); then
                if (( attempt < 3 )); then
                  echo "Transient Seed Man page fetch failure on attempt $attempt (curl exit $rc); retrying." >&2
                  sleep $((attempt * 3))
                  continue
                fi
                echo "Seed Man page remained unreachable after $attempt attempts (curl exit $rc)." >&2
                return 1
              fi

              if [[ "$status" == 200 ]]; then
                return 0
              fi

              if [[ "$status" == 429 || "$status" =~ ^5[0-9][0-9]$ ]]; then
                if (( attempt < 3 )); then
                  echo "Transient Seed Man HTTP $status on attempt $attempt; retrying." >&2
                  sleep $((attempt * 3))
                  continue
                fi
                echo "Seed Man page remained transiently unavailable after $attempt attempts (HTTP $status)." >&2
                return 1
              fi

              echo "Deterministic Seed Man HTTP failure: $status" >&2
              return 2
            done
            return 1
          }

          if ! fetch_page_with_transient_retry; then
            echo '--- response headers ---'
            cat "$headers" || true
            exit 1
          fi

          if ! fetch_assets "${GITHUB_RUN_ID:-manual}"; then
            echo 'Seed Man asset fetch failed after curl bounded retries.' >&2
            exit 1
          fi

          if ! verify_downloaded_contract; then
            echo 'Seed Man live content failed the canonical contract. Deterministic content mismatches are not retried.' >&2
            grep -E 'dtf-seed-man-release|data-seed-ui-release|data-seed-man-approved-art|player-state-v20|combat-browser-v2|Original browser vertical slice|20260830-r4' "$body" || true
            exit 1
          fi

          echo '--- response headers ---'
          cat "$headers" || true
          echo 'Bare Seed Man URL serves canonical player-state v20, campaign v3, combat v2, approved art core v4, and current v5 UI.'
