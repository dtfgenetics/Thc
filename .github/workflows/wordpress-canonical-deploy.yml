name: Deploy DTFSeeds WordPress Canonical Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Reconcile DTFSeeds WordPress Canonical Pages
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-canonical-deploy
  cancel-in-progress: true

jobs:
  observe:
    name: Confirm trusted preflight completion
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate trusted production publisher exists
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/apply-wordpress-public-content-rest.mjs
          for slug in home seeds learn community shop gallery about contact; do
            test -s "site/wordpress/pages/$slug.html"
          done

      - name: Report protected deployment handoff to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          OBSERVE_STATUS: ${{ job.status }}
        with:
          script: |
            const sourceRun = context.eventName === 'workflow_run'
              ? context.payload.workflow_run?.html_url
              : 'manual dispatch';
            const body = [
              '## WordPress protected deployment handoff',
              '',
              `Deploy run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Trigger: **${context.eventName}**`,
              `Trusted handoff result: **${process.env.OBSERVE_STATUS}**`,
              `Source preflight: ${sourceRun}`,
              '',
              'This job runs outside the protected environment and confirms the trusted `main` publisher package before the production-environment job starts. No production credentials are accessed here.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body
            });

  deploy:
    name: Publish and verify canonical WordPress pages
    needs: observe
    if: needs.observe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      CONTENT_DIR: ${{ github.workspace }}/site/wordpress/pages
      BACKUP_ROOT: ${{ runner.temp }}/wordpress-canonical-deploy-backups
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect protected WordPress credentials
        id: access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${WP_API_USERNAME:-}" ]] && user_present=true || user_present=false
          [[ -n "${WP_API_PASSWORD:-}" ]] && password_present=true || password_present=false
          echo "user_present=$user_present" >> "$GITHUB_OUTPUT"
          echo "password_present=$password_present" >> "$GITHUB_OUTPUT"
          if [[ "$user_present" == true && "$password_present" == true ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile canonical pages and WordPress front page
        id: publish
        if: steps.access.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-wordpress-public-content-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-rest-backup-path.txt")"
          summary="$backup_dir/deployment-summary.json"
          mutations="$(node -p "require(process.argv[1]).mutationCount" "$summary")"
          changed_pages="$(node -p "require(process.argv[1]).changedPages" "$summary")"
          echo "mutations=$mutations" >> "$GITHUB_OUTPUT"
          echo "changed_pages=$changed_pages" >> "$GITHUB_OUTPUT"

      - name: Verify canonical pages on production
        id: verify
        if: steps.access.outputs.available == 'true' && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          verify_page() {
            local path="$1"
            local required="$2"
            local body="$RUNNER_TEMP/wp-production-$(echo "$path" | tr '/?' '__').html"
            local ok=0
            for attempt in 1 2 3 4 5 6; do
              curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --header 'Cache-Control: no-cache' \
                "https://dtfseeds.com${path}?dtf_wp_deploy=${GITHUB_RUN_ID}-${attempt}" \
                --output "$body"
              if grep -Fqi -- "$required" "$body"; then
                ok=1
                break
              fi
              sleep 10
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Canonical production text not found on $path: $required" >&2
              exit 1
            fi
            for forbidden in \
              'Reserved strain card' \
              'staged for verified' \
              'being rebuilt' \
              'Needed from owner' \
              'email@email.com' \
              '+123456789'; do
              if grep -Fqi -- "$forbidden" "$body"; then
                echo "Forbidden live phrase remains on $path: $forbidden" >&2
                exit 1
              fi
            done
          }

          verify_page '/' 'Genetics, cultivation education, practical tools, and original cannabis games.'
          verify_page '/seeds/' 'Genetics built through selection, observation, and documentation.'
          verify_page '/learn/' 'Read the yellow-leaves diagnostic guide'
          verify_page '/community/' 'Join the official DTF / Teaching Healthy Cultivation Discord'
          verify_page '/contact/' 'Join the official DTF / Teaching Healthy Cultivation Discord'

      - name: Fail when protected WordPress credentials are absent
        if: steps.access.outputs.available != 'true'
        run: exit 1

      - name: Upload rollback package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-canonical-deploy-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/wordpress-canonical-deploy-backups
          if-no-files-found: warn
          retention-days: 30

      - name: Report protected deployment result to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          USER_PRESENT: ${{ steps.access.outputs.user_present }}
          PASSWORD_PRESENT: ${{ steps.access.outputs.password_present }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          MUTATIONS: ${{ steps.publish.outputs.mutations }}
          CHANGED_PAGES: ${{ steps.publish.outputs.changed_pages }}
        with:
          script: |
            const body = [
              '## Canonical WordPress production deployment',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Protected job result: **${process.env.JOB_STATUS}**`,
              `WordPress username configured: **${process.env.USER_PRESENT || 'false'}**`,
              `WordPress application password configured: **${process.env.PASSWORD_PRESENT || 'false'}**`,
              `REST publish outcome: **${process.env.PUBLISH_OUTCOME || 'not-run'}**`,
              `Live verification outcome: **${process.env.VERIFY_OUTCOME || 'not-run'}**`,
              `Mutations: **${process.env.MUTATIONS || 'not-run'}**`,
              `Pages changed: **${process.env.CHANGED_PAGES || 'not-run'}**`,
              '',
              'Canonical scope: Home, Seeds, Learn, Community, Shop, Gallery, About, Contact. The Home page is enforced as the WordPress front page at `/`. Static game routes are not modified.',
              'No credential values are included in this report.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body
            });
