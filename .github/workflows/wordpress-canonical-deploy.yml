name: Stage DTFSeeds WordPress Canonical Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/wordpress/pages/**
      - site/wordpress/assets/infographics/**
      - site/wordpress/assets/brand/**
      - site/wordpress/products/**
      - site/design-system/**
      - data/dtf-visual-v1.json
      - data/genetics/**
      - site/public-route-patch/learn/infographics/**
      - scripts/apply-wordpress-public-content-rest.mjs
      - scripts/apply-wordpress-public-content-owned-routes.mjs
      - scripts/deploy-wordpress-infographic-library-rest.mjs
      - scripts/audit-wordpress-commerce-rest.mjs
      - scripts/validate-genetics-commerce.mjs
      - scripts/reconcile-woocommerce-products.mjs
      - scripts/rollback-woocommerce-products.mjs
      - scripts/validate-woocommerce-reconciliation.mjs
      - scripts/rebuild-wordpress-visual-site.mjs
      - scripts/rebuild-wordpress-commerce-visuals.mjs
      - scripts/style-wordpress-woocommerce-archive.mjs
      - scripts/polish-wordpress-genetics-visuals-v4.mjs
      - scripts/polish-wordpress-commerce-archive-v4.mjs
      - scripts/rebuild-wordpress-infographic-gallery.mjs
      - .github/workflows/wordpress-canonical-production.yml
      - .github/workflows/wordpress-infographic-production.yml
      - .github/workflows/wordpress-canonical-deploy.yml

permissions:
  contents: read

concurrency:
  group: dtfseeds-wordpress-canonical-handoff
  cancel-in-progress: true

jobs:
  observe:
    name: Confirm trusted visual production package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate trusted production publishers and visual package
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/apply-wordpress-public-content-rest.mjs
          test -s scripts/apply-wordpress-public-content-owned-routes.mjs
          test -s scripts/deploy-wordpress-infographic-library-rest.mjs
          test -s scripts/rebuild-wordpress-visual-site.mjs
          test -s scripts/rebuild-wordpress-commerce-visuals.mjs
          test -s scripts/style-wordpress-woocommerce-archive.mjs
          test -s scripts/polish-wordpress-genetics-visuals-v4.mjs
          test -s scripts/polish-wordpress-commerce-archive-v4.mjs
          test -s scripts/rebuild-wordpress-infographic-gallery.mjs
          test -s site/design-system/dtf-visual-v1.css
          test -s data/dtf-visual-v1.json
          test -s site/wordpress/assets/brand/dtf-potleaf-512.png
          node --check scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/apply-wordpress-public-content-owned-routes.mjs
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          node --check scripts/rebuild-wordpress-visual-site.mjs
          node --check scripts/rebuild-wordpress-commerce-visuals.mjs
          node --check scripts/style-wordpress-woocommerce-archive.mjs
          node --check scripts/polish-wordpress-genetics-visuals-v4.mjs
          node --check scripts/polish-wordpress-commerce-archive-v4.mjs
          node --check scripts/rebuild-wordpress-infographic-gallery.mjs
          node -e "JSON.parse(require('fs').readFileSync('data/dtf-visual-v1.json','utf8'))"
          grep -Fq -- '--dtf-bg:#07170f' site/design-system/dtf-visual-v1.css
          grep -Fq -- '--dtf-gold:#d5b15a' site/design-system/dtf-visual-v1.css
          for slug in home seeds learn community shop gallery about contact; do
            test -s "site/wordpress/pages/$slug.html"
          done
          for slug in community gallery about contact; do
            grep -Fq 'class="dtf-v1"' "site/wordpress/pages/$slug.html"
          done
          test -d site/wordpress/assets/infographics
          count="$(find site/wordpress/assets/infographics -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) | wc -l | tr -d ' ')"
          test "$count" -ge 20
          echo "Validated $count infographic images, shared DTF visual system, DTF brand media, V4 genetics visuals, commerce visual publishers, and WooCommerce archive styling for protected production handoff." >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize trusted production handoff
        if: always()
        uses: actions/github-script@v7
        env:
          OBSERVE_STATUS: ${{ job.status }}
        with:
          script: |
            const sourceRun = context.eventName === 'push'
              ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`
              : 'manual dispatch';
            const body = [
              '## WordPress visual production handoff', '',
              `Handoff run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Trigger: **${context.eventName}**`,
              `Trusted handoff result: **${process.env.OBSERVE_STATUS}**`,
              `Source: ${sourceRun}`, '',
              'A successful handoff is eligible for protected WordPress production. Routine run telemetry stays in the Actions summary instead of the exhausted historical issue ledger.'
            ].join('\n');
            await core.summary.addRaw(body).write();
