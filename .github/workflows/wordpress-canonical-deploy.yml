name: Stage DTFSeeds WordPress Canonical Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Reconcile DTFSeeds WordPress Canonical Pages
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  observe:
    name: Confirm trusted preflight completion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate trusted production publisher exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]
          fi
          test -s scripts/apply-wordpress-public-content-rest.mjs
          node --check scripts/apply-wordpress-public-content-rest.mjs
          for slug in home seeds learn community shop gallery about contact; do
            test -s "site/wordpress/pages/$slug.html"
          done

      - name: Report deployment handoff to issue 46
        if: always()
        uses: actions/github-script@v7
        env:
          OBSERVE_STATUS: ${{ job.status }}
        with:
          script: |
            const sourceRun = context.eventName === 'workflow_run'
              ? context.payload.workflow_run?.html_url
              : 'manual dispatch';
            const body = [
              '## WordPress protected deployment handoff',
              '',
              `Handoff run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Trigger: **${context.eventName}**`,
              `Trusted handoff result: **${process.env.OBSERVE_STATUS}**`,
              `Source preflight: ${sourceRun}`,
              '',
              'This workflow accesses no production environment or credentials. A separate one-job production workflow runs after a successful handoff.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body
            });
