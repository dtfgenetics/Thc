name: Publish DTF Genetics Library Direct Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dtfseeds-genetics-library-direct-recovery
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      SEED_LINE_CATALOG: site/wordpress/products/seed-line-catalog.json
      GENETICS_CDN_IDENTITIES: site/wordpress/products/genetics-cdn-identities.json
      BACKUP_ROOT: /tmp/wordpress-genetics-direct

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate genetics recovery package
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/wordpress-ipv4-fetch-bootstrap.mjs
          node --check scripts/publish-wordpress-genetics-library-cdn.mjs
          node --check scripts/audit-genetics-cdn-sources.mjs
          node --check scripts/flush-hostinger-litespeed-mcp.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog=JSON.parse(fs.readFileSync(process.env.SEED_LINE_CATALOG,'utf8'));
          const identities=JSON.parse(fs.readFileSync(process.env.GENETICS_CDN_IDENTITIES,'utf8'));
          if(catalog.schemaVersion!==1||!Array.isArray(catalog.lines)||catalog.lines.length===0) throw new Error('Genetics catalog is missing or empty.');
          const cards=catalog.lines.flatMap(line=>line.releaseCards||[]);
          if(cards.length===0) throw new Error('Genetics catalog contains no cards.');
          const cardSlugs=new Set();
          for(const line of catalog.lines){
            if(!line.id||!line.name||!line.slug||!line.summary) throw new Error(`Incomplete genetics line ${line.id||'unknown'}`);
            for(const card of line.releaseCards||[]){
              if(!card.sourceUrl||!card.expectedWidth||!card.expectedHeight||!card.wordpressSlug) throw new Error(`${line.id}: card source metadata incomplete`);
              if(cardSlugs.has(card.wordpressSlug)) throw new Error(`Duplicate card slug ${card.wordpressSlug}`);
              cardSlugs.add(card.wordpressSlug);
            }
          }
          if(identities.schemaVersion!==1||!Array.isArray(identities.cards)||identities.cards.length!==cards.length) throw new Error(`Expected ${cards.length} CDN identities; found ${identities.cards?.length}`);
          const identitySlugs=new Set(identities.cards.map(row=>row.wordpressSlug));
          if(identitySlugs.size!==identities.cards.length) throw new Error('Duplicate CDN identity slug.');
          for(const slug of cardSlugs) if(!identitySlugs.has(slug)) throw new Error(`Missing CDN identity ${slug}`);
          console.log(`Validated ${catalog.lines.length} lines, ${cards.length} cards, and ${identities.cards.length} CDN identities.`);
          NODE

      - name: Audit reviewed CDN sources
        shell: bash
        run: |
          set -euo pipefail
          GENETICS_CDN_REPORT="$RUNNER_TEMP/genetics-cdn-source-report.json" node scripts/audit-genetics-cdn-sources.mjs

      - name: Publish genetics library through IPv4 WordPress transport
        id: publish
        env:
          APPLY_GENETICS_LIBRARY: 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/publish-wordpress-genetics-library-cdn.mjs
          dir="$(cat "$BACKUP_ROOT/genetics-library-backup-path.txt")"
          echo "report=$dir/genetics-library-report.json" >> "$GITHUB_OUTPUT"

      - name: Purge Hostinger LiteSpeed cache
        id: cache
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/flush-hostinger-litespeed-mcp.mjs; then
              ok=1
              break
            fi
            sleep $((attempt * 4))
          done
          [[ "$ok" -eq 1 ]] || { echo 'Hostinger LiteSpeed cache purge failed after retries.' >&2; exit 1; }
          sleep 5

      - name: Verify visitor routes and uncached origin
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          check_url() {
            url="$1"; text="$2"; label="$3"; body="$RUNNER_TEMP/$(echo "$label"|tr '/ :' '___').html"; ok=0
            for n in 1 2 3 4 5 6; do
              curl -4 --fail --silent --show-error --location \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                --header 'Pragma: no-cache' \
                "$url" -o "$body"
              if grep -Fqi "$text" "$body"; then ok=1; break; fi
              sleep 5
            done
            [[ "$ok" -eq 1 ]] || { echo "Verification failed: $label missing $text" >&2; exit 1; }
          }
          check() {
            path="$1"; text="$2"
            check_url "$WP_SITE_URL${path}?dtf_genetics_origin=${GITHUB_RUN_ID}" "$text" "origin-$path"
            check_url "$WP_SITE_URL${path}" "$text" "public-$path"
          }
          check '/seeds/' 'DTF Genetics library'
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/genetics-routes.tsv"
          import fs from 'node:fs';
          const catalog=JSON.parse(fs.readFileSync('site/wordpress/products/seed-line-catalog.json','utf8'));
          for(const line of catalog.lines) console.log(`${line.slug}\t${line.name}`);
          NODE
          while IFS=$'\t' read -r slug title; do
            check "/seeds/$slug/" "$title"
          done < "$RUNNER_TEMP/genetics-routes.tsv"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genetics-library-direct-recovery-${{ github.run_id }}
          path: |
            /tmp/wordpress-genetics-direct
            ${{ runner.temp }}/genetics-cdn-source-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record recovery result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PUBLISH: ${{ steps.publish.outcome }}
          CACHE: ${{ steps.cache.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          {
            echo '## DTF Genetics direct recovery'
            echo
            echo "- Result: **${JOB_STATUS}**"
            echo "- Library publication: **${PUBLISH:-not-run}**"
            echo "- Hostinger/LiteSpeed purge: **${CACHE:-not-run}**"
            echo "- Origin + public-cache verification: **${VERIFY:-not-run}**"
            echo '- This is a manual recovery lane. Automatic Genetics publication remains owned by `wordpress-genetics-library-production.yml`.'
          } >> "$GITHUB_STEP_SUMMARY"
