name: Burn Buds Native Targeting Contracts One Shot

on:
  push:
    branches:
      - game/burn-buds-remove-legacy-confirmshots
    paths:
      - '.github/workflows/burn-buds-native-targeting-contracts-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game/burn-buds-remove-legacy-confirmshots
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update targeting contracts
        run: node scripts/patch-burn-buds-native-targeting-contracts.mjs
      - name: Verify updated contracts
        run: |
          node --check site/public-route-patch/games/protect-the-plants/enhancements.js
          node --check site/public-route-patch/games/protect-the-plants/targeting-v1.js
          node games/protect-the-plants/test/native-targeting-source.test.mjs
          node games/protect-the-plants/test/burn-buds-branding.test.mjs
          node games/protect-the-plants/test/burn-buds-gameplay-v3.test.mjs
          node games/protect-the-plants/test/runtime-sync-v1.test.mjs
      - name: Commit contract migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/protect-the-plants/test .github/workflows/burn-buds-branding-ci.yml
          git commit -m 'Update Burn Buds native targeting contracts'
          git push origin HEAD:game/burn-buds-remove-legacy-confirmshots
