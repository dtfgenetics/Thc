name: THC RPG Branch External Registry Reconcile

on:
  push:
    branches:
      - release/thc-rpg-external-candidate-20260905

permissions:
  contents: write

concurrency:
  group: thc-rpg-branch-external-registry-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/thc-rpg-external-candidate-20260905
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate external contracts
        run: node scripts/validate-external-game-contracts.mjs
      - name: Reconcile generated registry
        run: node scripts/reconcile-external-game-registry.mjs
      - name: Validate public registry
        run: node scripts/validate-public-app-registry.mjs
      - name: Commit generated registry
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/deployment/public-apps.json; then
            echo 'Registry already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/deployment/public-apps.json
          git commit -m 'release(games): reconcile THC RPG external registry'
          git push origin HEAD:release/thc-rpg-external-candidate-20260905
