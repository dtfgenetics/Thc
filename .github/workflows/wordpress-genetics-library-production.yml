name: Publish DTF Genetics Library

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordpress-genetics-library-production.yml'
      - 'data/genetics/catalog.json'
      - 'data/genetics/release-control.json'
      - 'site/wordpress/pages/seeds.html'
      - 'site/wordpress/products/genetics.json'
      - 'site/wordpress/products/seed-line-catalog.json'
      - 'site/wordpress/products/genetics-cdn-identities.json'
      - 'site/wordpress/products/strain-card-images.json'
      - 'scripts/validate-genetics-library-coherence.mjs'
      - 'scripts/validate-genetics-commerce.mjs'
      - 'scripts/publish-wordpress-genetics-library-cdn.mjs'
      - 'scripts/publish-wordpress-genetics-library-cdn-core.mjs'
      - 'scripts/reconcile-wordpress-genetics-duplicate-pages.mjs'
      - 'scripts/force-original-image-accept.mjs'
      - 'scripts/wordpress-ipv4-fetch-bootstrap.mjs'
      - 'scripts/flush-hostinger-litespeed-mcp.mjs'
      - 'scripts/purge-wordpress-litespeed-cache.mjs'
      - 'scripts/verify-wordpress-genetics-library-production.mjs'
      - 'scripts/publish-woocommerce-strain-card-images-cdn.mjs'
      - 'scripts/audit-genetics-cdn-sources.mjs'
  workflow_run:
    workflows:
      - Publish DTFSeeds WordPress Production
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-genetics-library
  cancel-in-progress: false

jobs:
  publish:
    # The canonical WordPress workflow can fail a later visitor/cache check after
    # it has already rewritten /seeds/. The genetics publisher is the recovery
    # authority for /seeds/ and its child line pages, so run after real canonical
    # attempts, including failures, but never after cancelled/skipped handoffs.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped') }}
    name: Publish authoritative genetics library and reviewed strain cards
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
      WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
      GENETICS_CATALOG: data/genetics/catalog.json
      GENETICS_RELEASE_CONTROL: data/genetics/release-control.json
      GENETICS_PRODUCTS: site/wordpress/products/genetics.json
      SEED_LINE_CATALOG: site/wordpress/products/seed-line-catalog.json
      GENETICS_CDN_IDENTITIES: site/wordpress/products/genetics-cdn-identities.json
      STRAIN_CARD_REGISTRY: site/wordpress/products/strain-card-images.json
      BACKUP_ROOT: /tmp/wordpress-genetics-production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate genetics production package and cross-catalog coherence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WP_API_USERNAME:-}"
          test -n "${WP_API_PASSWORD:-}"
          node --check scripts/wordpress-ipv4-fetch-bootstrap.mjs
          node --check scripts/publish-wordpress-genetics-library-cdn.mjs
          node --check scripts/publish-woocommerce-strain-card-images-cdn.mjs
          node --check scripts/audit-genetics-cdn-sources.mjs
          node --check scripts/validate-genetics-library-coherence.mjs
          node --check scripts/flush-hostinger-litespeed-mcp.mjs
          node --check scripts/purge-wordpress-litespeed-cache.mjs
          node --check scripts/verify-wordpress-genetics-library-production.mjs
          node scripts/validate-genetics-library-coherence.mjs
          node scripts/validate-genetics-commerce.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog=JSON.parse(fs.readFileSync(process.env.SEED_LINE_CATALOG,'utf8'));
          const identities=JSON.parse(fs.readFileSync(process.env.GENETICS_CDN_IDENTITIES,'utf8'));
          const products=JSON.parse(fs.readFileSync(process.env.STRAIN_CARD_REGISTRY,'utf8'));
          if(catalog.schemaVersion!==1 || !Array.isArray(catalog.lines) || catalog.lines.length===0) throw new Error('Genetics catalog is missing or empty.');
          const cards=catalog.lines.flatMap(line=>line.releaseCards||[]);
          if(cards.length===0) throw new Error('Genetics catalog contains no reviewed cards.');
          const ids=new Set(); const slugs=new Set(); const cardSlugs=new Set();
          for(const line of catalog.lines){
            if(!line.id||!line.name||!line.slug||!line.summary) throw new Error(`Incomplete line record: ${line.id||'unknown'}`);
            if(ids.has(line.id)||slugs.has(line.slug)) throw new Error(`Duplicate genetics line identity: ${line.id}/${line.slug}`);
            ids.add(line.id); slugs.add(line.slug);
            if(!Array.isArray(line.releaseCards)||line.releaseCards.length===0) throw new Error(`${line.id}: no reviewed strain cards`);
            for(const card of line.releaseCards){
              if(!card.sourceUrl||!card.fileName||!card.altText||!card.wordpressSlug) throw new Error(`${line.id}: incomplete card metadata`);
              if(!Number.isInteger(card.expectedWidth)||!Number.isInteger(card.expectedHeight)) throw new Error(`${line.id}: missing image dimensions`);
              if(!/^[a-f0-9]{64}$/.test(String(card.sourceSha256||''))) throw new Error(`${line.id}: invalid provenance SHA-256`);
              if(cardSlugs.has(card.wordpressSlug)) throw new Error(`Duplicate card slug: ${card.wordpressSlug}`);
              cardSlugs.add(card.wordpressSlug);
            }
          }
          if(identities.schemaVersion!==1 || !Array.isArray(identities.cards) || identities.cards.length!==cards.length) throw new Error(`Expected ${cards.length} CDN identities; found ${identities.cards?.length}`);
          const identitySlugs=new Set(identities.cards.map(row=>row.wordpressSlug));
          if(identitySlugs.size!==identities.cards.length) throw new Error('Duplicate CDN identity slug.');
          for(const slug of cardSlugs) if(!identitySlugs.has(slug)) throw new Error(`Missing CDN identity for ${slug}`);
          for(const row of identities.cards){
            if(!cardSlugs.has(row.wordpressSlug)) throw new Error(`Orphan CDN identity ${row.wordpressSlug}`);
            if(!/^[a-f0-9]{64}$/.test(String(row.cdnSha256||''))||!Number.isInteger(row.cdnByteLength)) throw new Error(`Invalid CDN identity ${row.wordpressSlug}`);
          }
          if(products.schemaVersion!==1 || !Array.isArray(products.cards) || products.cards.length!==3) throw new Error('Expected exactly 3 pinned WooCommerce cards.');
          for(const card of products.cards){
            if(!card.sourceUrl||!card.productId||!card.productSlug||!card.wordpressSlug) throw new Error(`${card.registryId||'unknown'}: incomplete pinned WooCommerce card mapping`);
            if(!Number.isInteger(card.expectedWidth)||!Number.isInteger(card.expectedHeight)) throw new Error(`${card.registryId}: missing pinned image dimensions`);
          }
          console.log(`Validated ${catalog.lines.length} line pages, ${cards.length} catalog cards, ${identities.cards.length} CDN identities and ${products.cards.length} WooCommerce card mappings.`);
          NODE

      - name: Audit reviewed CDN sources
        shell: bash
        run: |
          set -euo pipefail
          GENETICS_CDN_REPORT="$RUNNER_TEMP/genetics-cdn-source-report.json" node scripts/audit-genetics-cdn-sources.mjs

      - name: Publish Seeds library and individual line pages
        id: library
        env:
          APPLY_GENETICS_LIBRARY: 'true'
          BACKUP_ROOT: /tmp/wordpress-genetics-production/library
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/publish-wordpress-genetics-library-cdn.mjs
          dir="$(cat "$BACKUP_ROOT/genetics-library-backup-path.txt")"
          report="$dir/genetics-library-report.json"
          echo "line_count=$(node -p "require(process.argv[1]).lineCount" "$report")" >> "$GITHUB_OUTPUT"
          echo "card_count=$(node -p "require(process.argv[1]).cardCount" "$report")" >> "$GITHUB_OUTPUT"

      - name: Publish reviewed cards to current WooCommerce products
        id: products
        env:
          APPLY_STRAIN_CARD_IMAGES: 'true'
          BACKUP_ROOT: /tmp/wordpress-genetics-production/products
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/publish-woocommerce-strain-card-images-cdn.mjs

      - name: Purge Genetics routes from LiteSpeed immediately before acceptance
        id: purge
        env:
          LITESPEED_PURGE_ALL: 'false'
        shell: bash
        run: |
          set -euo pipefail
          purge_urls="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog=JSON.parse(fs.readFileSync(process.env.SEED_LINE_CATALOG,'utf8'));
          console.log(JSON.stringify(['/seeds/', ...catalog.lines.map(line => `/seeds/${line.slug}/`)]));
          NODE
          )"
          LITESPEED_PURGE_URLS_JSON="$purge_urls" node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/purge-wordpress-litespeed-cache.mjs

      - name: Verify authoritative Genetics REST state and public cache convergence
        id: verify
        env:
          GENETICS_VERIFY_REPORT: /tmp/wordpress-genetics-production/genetics-production-verification.json
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/verify-wordpress-genetics-library-production.mjs

      - name: Upload genetics rollback/evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-genetics-production-${{ github.run_id }}
          path: |
            /tmp/wordpress-genetics-production
            ${{ runner.temp }}/genetics-cdn-source-report.json
            woocommerce-strain-card-image-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report genetics production result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          LIBRARY_OUTCOME: ${{ steps.library.outcome }}
          PRODUCT_OUTCOME: ${{ steps.products.outcome }}
          PURGE_OUTCOME: ${{ steps.purge.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          LINE_COUNT: ${{ steps.library.outputs.line_count }}
          CARD_COUNT: ${{ steps.library.outputs.card_count }}
        with:
          script: |
            const body=[
              '## DTF Genetics library production','',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Result: **${process.env.JOB_STATUS}**`,
              `Seeds library + line pages: **${process.env.LIBRARY_OUTCOME||'not-run'}**`,
              `WooCommerce reviewed card publication: **${process.env.PRODUCT_OUTCOME||'not-run'}**`,
              `Targeted LiteSpeed route purge: **${process.env.PURGE_OUTCOME||'not-run'}**`,
              `Authoritative REST + public convergence: **${process.env.VERIFY_OUTCOME||'not-run'}**`,
              `Published line profiles: **${process.env.LINE_COUNT||'not-run'}**`,
              `Reviewed catalog cards: **${process.env.CARD_COUNT||'not-run'}**`,
              '',
              'Authoritative production writer: image-backed seed-line catalog, cross-checked against stable pedigree and commerce registries.',
              'Acceptance contract: WordPress REST source must be correct first; then the explicitly purged public routes must converge.',
              'Target: https://dtfseeds.com/seeds/'
            ].join('\n');
            await core.summary.addRaw(body).write();
            try {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:220,body});
            } catch (error) {
              core.warning(`Could not post genetics production result: ${error.message}`);
            }
