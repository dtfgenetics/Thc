name: Game workspace CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'games/**'
      - 'apps/high-land-web/**'
      - 'apps/high-land-server/**'
      - 'site/public-route-patch/games/**'
      - 'site/deployment/public-apps.json'
      - 'data/project-registry.json'
      - 'data/public-navigation.json'
      - 'scripts/verify-game-workspace.mjs'
      - 'scripts/create-game-scaffold.mjs'
      - 'scripts/test-game-scaffold.mjs'
      - 'scripts/game-status.mjs'
      - 'scripts/test-game-status.mjs'
      - 'docs/GAME_DEVELOPMENT_WORKFLOW.md'
      - 'docs/GAME_ARCHITECTURE_STANDARD.md'
      - 'package.json'
      - '.github/workflows/game-workspace-ci.yml'
  push:
    branches: [main]
    paths:
      - 'games/**'
      - 'apps/high-land-web/**'
      - 'apps/high-land-server/**'
      - 'site/public-route-patch/games/**'
      - 'site/deployment/public-apps.json'
      - 'data/project-registry.json'
      - 'data/public-navigation.json'
      - 'scripts/verify-game-workspace.mjs'
      - 'scripts/create-game-scaffold.mjs'
      - 'scripts/test-game-scaffold.mjs'
      - 'scripts/game-status.mjs'
      - 'scripts/test-game-status.mjs'
      - 'docs/GAME_DEVELOPMENT_WORKFLOW.md'
      - 'docs/GAME_ARCHITECTURE_STANDARD.md'
      - 'package.json'
      - '.github/workflows/game-workspace-ci.yml'

permissions:
  contents: read

concurrency:
  group: game-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-game-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show dtfseeds.com game ownership and routes
        run: npm run games:status

      - name: Run unified game preflight
        run: npm run games:preflight
