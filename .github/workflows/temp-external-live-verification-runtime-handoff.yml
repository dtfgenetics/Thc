name: Temporary External Live Verification Runtime Handoff

on:
  push:
    branches:
      - fix/external-live-verification-handoff-clean-20260915
    paths:
      - scripts/apply-external-live-verification-runtime-handoff.mjs
      - .github/workflows/temp-external-live-verification-runtime-handoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/external-live-verification-handoff-clean-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply runtime handoff patch
        run: node scripts/apply-external-live-verification-runtime-handoff.mjs
      - name: Validate deterministic contracts
        run: |
          node --check scripts/promote-public-game-routes-via-wordpress.mjs
          node --check scripts/validate-external-game-contracts.mjs
          node scripts/validate-external-game-contracts.mjs
      - name: Commit persistent runtime and validator changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/promote-public-game-routes-via-wordpress.mjs scripts/validate-external-game-contracts.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Verify external game revisions inside production promotion'
          git push origin HEAD:${GITHUB_REF_NAME}
