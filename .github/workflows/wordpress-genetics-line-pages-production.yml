name: Deprecated Genetics Line Publisher Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Validate canonical genetics architecture only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm legacy publisher is no longer a production writer
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/publish-wordpress-genetics-line-pages.mjs
          node scripts/validate-genetics-commerce.mjs
          node scripts/validate-genetics-library-coherence.mjs
          echo 'Legacy two-line publisher is retained only as historical/compatibility code.'
          echo 'Authoritative production writer: .github/workflows/wordpress-genetics-library-production.yml'
          echo 'No WordPress credentials are loaded and no public pages are modified by this workflow.'
