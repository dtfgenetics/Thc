name: Project OS Reconciliation Watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reconciliation contracts
        run: npm run verify:project-os-reconciliation
      - name: Build reconciliation inputs
        run: |
          mkdir -p artifacts/project-os-reconciliation
          cp data/project-os/work-queue.json artifacts/project-os-reconciliation/queue.json
          printf '%s\n' '{"schemaVersion":1,"capturedAt":"1970-01-01T00:00:00.000Z","pullRequests":{}}' > artifacts/project-os-reconciliation/github.json
          printf '%s\n' '{"schemaVersion":1,"capturedAt":"1970-01-01T00:00:00.000Z","workItems":{}}' > artifacts/project-os-reconciliation/live.json
      - name: Generate reconciliation report
        env:
          PROJECT_OS_CAPTURED_AT: ${{ github.event.repository.updated_at }}
        run: |
          node scripts/generate-project-os-reconciliation-report.mjs \
            artifacts/project-os-reconciliation/queue.json \
            artifacts/project-os-reconciliation/github.json \
            artifacts/project-os-reconciliation/live.json \
            > artifacts/project-os-reconciliation/report.json
      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-os-reconciliation-${{ github.run_id }}
          path: artifacts/project-os-reconciliation
          if-no-files-found: error
          retention-days: 30
