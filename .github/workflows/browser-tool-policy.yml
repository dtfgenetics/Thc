name: Browser Tool Policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'apps/*/package.json'
      - 'apps/high-land-web/playwright*.ts'
      - 'apps/high-land-web/e2e/**'
      - 'apps/high-land-web/e2e-live/**'
      - 'scripts/verify-browser-tool-policy.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'apps/*/package.json'
      - 'apps/high-land-web/playwright*.ts'
      - 'apps/high-land-web/e2e/**'
      - 'apps/high-land-web/e2e-live/**'
      - 'scripts/verify-browser-tool-policy.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce active browser-tool policy
        run: node scripts/verify-browser-tool-policy.mjs
