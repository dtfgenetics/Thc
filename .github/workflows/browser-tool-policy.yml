name: Browser Tool Policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'apps/*/package.json'
      - 'apps/high-land-web/playwright*.ts'
      - 'apps/high-land-web/e2e/**'
      - 'apps/high-land-web/e2e-live/**'
      - 'scripts/verify-browser-tool-policy.mjs'
      - 'scripts/validate-breeder-pedigree-graph.mjs'
      - 'scripts/validate-grow-planner-timeline.mjs'
      - 'scripts/validate-ipm-scout-trend.mjs'
      - 'site/public-route-patch/breeder-pedigree/**'
      - 'site/public-route-patch/grow-planner/**'
      - 'site/public-route-patch/ipm-scout/**'
      - 'site/public-route-patch/assets/breeder-pedigree-graph-v1.js'
      - 'site/public-route-patch/assets/vendor/cytoscape-3.34.3*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'apps/*/package.json'
      - 'apps/high-land-web/playwright*.ts'
      - 'apps/high-land-web/e2e/**'
      - 'apps/high-land-web/e2e-live/**'
      - 'scripts/verify-browser-tool-policy.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce active browser-tool policy
        run: node scripts/verify-browser-tool-policy.mjs

      - name: Validate breeder pedigree graph
        run: npm run validate:breeder-pedigree-graph

      - name: Validate Grow Planner timeline
        run: npm run validate:grow-planner-timeline

      - name: Validate IPM Scout trend chart
        run: npm run validate:ipm-scout-trend
