name: Probe Hostinger WordPress MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe-hostinger-mcp-rest.mjs
      - .github/workflows/hostinger-mcp-probe.yml

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe authenticated Hostinger MCP endpoint
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/probe-hostinger-mcp-rest.mjs
          node scripts/probe-hostinger-mcp-rest.mjs
      - name: Report MCP probe
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## Hostinger MCP read-only probe',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.JOB_STATUS}**`,
                `Probe: **${process.env.PROBE_OUTCOME || 'not-run'}**`,
                '',
                'Read-only GET/OPTIONS probe of the installed Hostinger AI assistant MCP endpoint. No filesystem changes are made.'
              ].join('\n')
            });
