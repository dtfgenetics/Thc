name: Diagnose DTF WordPress Override

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/diagnose-dtf-wordpress-override.mjs
      - .github/workflows/wordpress-dtf-override-diagnostic.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: dtfseeds-wordpress-override-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect DTF override source ownership
        id: inspect
        run: |
          set -euo pipefail
          node --check scripts/diagnose-dtf-wordpress-override.mjs
          node scripts/diagnose-dtf-wordpress-override.mjs | tee "$RUNNER_TEMP/override.json"
      - name: Report safe override diagnostic
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.inspect.outcome }}
        with:
          script: |
            const fs = require('fs');
            let d = {};
            const file = process.env.RUNNER_TEMP + '/override.json';
            if (fs.existsSync(file)) {
              const lines = fs.readFileSync(file, 'utf8').trim().split(/\r?\n/);
              for (let i = lines.length - 1; i >= 0; i--) { try { d = JSON.parse(lines[i]); break; } catch {} }
            }
            const closures = (d.closures || []).map(x => `- ${x.hook}@${x.priority}: \`${x.file || '?'}:${x.line || '?'}\``);
            const hints = (d.mu_override?.hints || []).map(x => `- line ${x.line}: \`${x.text}\``);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              body: [
                '## DTF WordPress override ownership diagnostic',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Result: **${process.env.OUTCOME || 'unknown'}**`,
                `MU override exists: **${d.mu_override?.exists ?? 'unknown'}**; bytes=${d.mu_override?.size ?? '?'}; sha256=${d.mu_override?.sha256 || '-'}`,
                `Old Home marker in MU override: **${d.mu_override?.markers?.old_home ?? 'unknown'}**`,
                `Old Learn marker in MU override: **${d.mu_override?.markers?.old_learn ?? 'unknown'}**`,
                `Front-page logic present: **${d.mu_override?.behavior?.front_page ?? 'unknown'}**; Learn logic present: **${d.mu_override?.behavior?.learn ?? 'unknown'}**; direct output/file serving present: **${d.mu_override?.behavior?.direct_output ?? 'unknown'}**`,
                '',
                '### Anonymous render hooks and source files',
                ...(closures.length ? closures : ['- none']),
                '',
                '### Sanitized MU override control-flow hints',
                ...(hints.length ? hints : ['- none']),
                '',
                'Read-only diagnosis. No MU-plugin, page, template, cache, rewrite, or static file is changed.'
              ].join('\n')
            });
