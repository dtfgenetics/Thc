name: Produce Lighting and Evidence Infographics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render-thc-scientific-posters.py
      - scripts/run-thc-scientific-posters-normalized.py
      - site/wordpress/education/visual-production-plans/lighting-research-v1.json
      - .github/workflows/wordpress-lighting-evidence-poster-production.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: dtfseeds-wordpress-infographics-production
  cancel-in-progress: false

jobs:
  publish:
    name: Render, publish, and verify eight full-sheet scientific posters
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD }}
      INFOGRAPHIC_SOURCE_DIR: ${{ github.workspace }}/site/wordpress/assets/infographics
      INFOGRAPHIC_DIR: ${{ github.workspace }}/.tmp/eligible-infographics
      INFOGRAPHIC_PLACEMENT_CONFIG: ${{ github.workspace }}/site/wordpress/assets/infographics/placement-rules.json
      INFOGRAPHIC_EXCLUSIONS: ${{ github.workspace }}/site/wordpress/assets/infographics/infographic-exclusions.json
      INFOGRAPHIC_LEARNING_GUIDES: ${{ github.workspace }}/site/wordpress/assets/infographics/infographic-learning-guides.json
      TOPIC_LITERATURE_CONFIG: /tmp/dtf-topic-literature-expanded.json
      BACKUP_ROOT: /tmp/wordpress-lighting-evidence-posters
      POSTER_RENDER_REPORT: /tmp/thc-lighting-evidence-poster-render.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate deterministic production inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          python -m py_compile scripts/render-thc-scientific-posters.py scripts/run-thc-scientific-posters-normalized.py
          node --check scripts/stage-eligible-infographics.mjs
          node --check scripts/deploy-wordpress-infographic-library-rest.mjs
          node --check scripts/assemble-topic-literature-expansions.mjs
          node --check scripts/publish-wordpress-topic-literature.mjs
          node --check scripts/flush-hostinger-litespeed-mcp.mjs
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('site/wordpress/education/visual-production-plans/lighting-research-v1.json', 'utf8'));
          if (!Array.isArray(plan.assets) || plan.assets.length !== 8) throw new Error('Expected exactly eight poster briefs');
          if (plan.assets.some(x => x.status !== 'ready-for-render' || !x.title || !x.topicId || (x.requiredPanels || []).length < 5)) {
            throw new Error('Poster production plan is incomplete');
          }
          console.log(`Validated ${plan.assets.length} render-ready full-sheet poster briefs.`);
          NODE

      - name: Install deterministic raster renderer
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0'

      - name: Render eight 2550x3300 scientific posters
        id: render
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run-thc-scientific-posters-normalized.py | tee /tmp/thc-poster-render.log
          test -s "$POSTER_RENDER_REPORT"
          python - "$POSTER_RENDER_REPORT" <<'PY'
          import json, os, sys
          from PIL import Image
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          if report.get('posterCount') != 8:
              raise SystemExit(f"Expected 8 rendered posters, got {report.get('posterCount')}")
          for item in report['results']:
              path = item['path']
              if not os.path.exists(path): raise SystemExit(f'Missing rendered poster: {path}')
              with Image.open(path) as im:
                  if im.size != (2550, 3300) or im.format != 'PNG':
                      raise SystemExit(f'Invalid poster {path}: {im.format} {im.size}')
                  dpi = im.info.get('dpi', (0, 0))
                  if min(dpi) < 295:
                      raise SystemExit(f'Poster DPI metadata is below print target: {path} {dpi}')
              if os.path.getsize(path) < 250000:
                  raise SystemExit(f'Poster is unexpectedly small: {path}')
          print('All eight poster binaries passed dimensions, PNG format, DPI, and minimum-size checks.')
          PY
          echo "poster_count=$(node -p "require(process.argv[1]).posterCount" "$POSTER_RENDER_REPORT")" >> "$GITHUB_OUTPUT"

      - name: Persist rendered posters in canonical infographic source
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DTF Scientific Poster Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add site/wordpress/assets/infographics/THC-LIGHT-*.png site/wordpress/assets/infographics/THC-EVID-*.png
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Publish deterministic Lighting and Evidence infographics'
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage canonical finished infographic assets
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-eligible-infographics.mjs
          report="$BACKUP_ROOT/infographic-quality-gate.json"
          eligible="$(node -p "require(process.argv[1]).eligibleImageCount" "$report")"
          [[ "$eligible" -ge 104 ]] || { echo "Expected at least 104 eligible infographics, found $eligible" >&2; exit 1; }
          echo "eligible_count=$eligible" >> "$GITHUB_OUTPUT"

      - name: Upload or reuse WordPress infographic media
        id: media
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy-wordpress-infographic-library-rest.mjs
          backup_dir="$(cat "$BACKUP_ROOT/wordpress-infographic-backup-path.txt")"
          result="$backup_dir/deployment-result.json"
          echo "uploaded=$(node -p "require(process.argv[1]).uploadedMediaCount" "$result")" >> "$GITHUB_OUTPUT"
          echo "reused=$(node -p "require(process.argv[1]).reusedMediaCount" "$result")" >> "$GITHUB_OUTPUT"

      - name: Assemble expanded Lighting and Research literature
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assemble-topic-literature-expansions.mjs --write "$TOPIC_LITERATURE_CONFIG" | tee /tmp/thc-poster-expanded-literature.json
          test -s "$TOPIC_LITERATURE_CONFIG"

      - name: Publish expanded companion literature and guided library
        id: literature
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-transient-fetch-bootstrap.mjs scripts/publish-wordpress-topic-literature.mjs
          backup_dir="$(cat "$BACKUP_ROOT/topic-literature-backup-path.txt")"
          report="$backup_dir/topic-literature-report.json"
          cards="$(node -p "require(process.argv[1]).eligibleInfographics" "$report")"
          [[ "$cards" -ge 104 ]] || { echo "Expected at least 104 published infographics, found $cards" >&2; exit 1; }
          echo "cards=$cards" >> "$GITHUB_OUTPUT"

      - name: Purge Hostinger LiteSpeed cache
        id: cache
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if node scripts/flush-hostinger-litespeed-mcp.mjs | tee -a /tmp/thc-poster-cache-flush.log; then ok=1; break; fi
            sleep $((attempt * 4))
          done
          [[ "$ok" -eq 1 ]]
          sleep 5

      - name: Verify eight posters on public guided-learning pages
        id: verify
        env:
          EXPECTED_CARDS: ${{ steps.literature.outputs.cards }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_page() {
            local url="$1" body="$2" marker="$3"
            local ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --header 'Cache-Control: no-cache, no-store, max-age=0' --header 'Pragma: no-cache' \
                "${url}?dtf_posters=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" --output "$body" && grep -Fqi "$marker" "$body"; then
                ok=1; break
              fi
              sleep 7
            done
            [[ "$ok" -eq 1 ]] || { echo "Missing public marker '$marker' at $url" >&2; exit 1; }
          }
          library="$RUNNER_TEMP/lighting-evidence-library.html"
          lighting="$RUNNER_TEMP/lighting-topic.html"
          research="$RUNNER_TEMP/research-topic.html"
          fetch_page 'https://dtfseeds.com/learn/infographics/' "$library" 'PPFD DLI Photoperiod Full Sheet Infographic'
          fetch_page 'https://dtfseeds.com/learn/lighting/' "$lighting" 'Lighting Canopy PPFD Mapping Full Sheet Infographic'
          fetch_page 'https://dtfseeds.com/learn/research-methods/' "$research" 'Replication Subsampling Research Full Sheet Infographic'
          for marker in \
            'PPFD DLI Photoperiod Full Sheet Infographic' \
            'Lighting Canopy PPFD Mapping Full Sheet Infographic' \
            'Light Sensors Spectrum Measurement Full Sheet Infographic' \
            'Lighting Response Photoinhibition Full Sheet Infographic' \
            'Observation Measurement Inference Full Sheet Infographic' \
            'Replication Subsampling Research Full Sheet Infographic' \
            'Controls Randomization Blocking Full Sheet Infographic' \
            'Measurement Quality Uncertainty Full Sheet Infographic'; do
            grep -Fqi "$marker" "$library" || { echo "Poster missing from public library: $marker" >&2; exit 1; }
          done
          cards="$(grep -Eo '<article class="thc-visual-card thc-library-card"' "$library" | wc -l | tr -d ' ')"
          [[ "$cards" -eq "$EXPECTED_CARDS" ]] || { echo "Expected $EXPECTED_CARDS public cards, found $cards" >&2; exit 1; }
          [[ "$cards" -ge 104 ]]
          echo "cards=$cards" >> "$GITHUB_OUTPUT"

      - name: Upload render, rollback, and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighting-evidence-posters-${{ github.run_id }}
          path: |
            /tmp/thc-lighting-evidence-poster-render.json
            /tmp/thc-poster-render.log
            /tmp/thc-poster-expanded-literature.json
            /tmp/thc-poster-cache-flush.log
            /tmp/wordpress-lighting-evidence-posters
            ${{ runner.temp }}/lighting-evidence-library.html
            ${{ runner.temp }}/lighting-topic.html
            ${{ runner.temp }}/research-topic.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report scientific poster production
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          STATUS: ${{ job.status }}
          POSTERS: ${{ steps.render.outputs.poster_count }}
          ELIGIBLE: ${{ steps.quality.outputs.eligible_count }}
          UPLOADED: ${{ steps.media.outputs.uploaded }}
          REUSED: ${{ steps.media.outputs.reused }}
          CARDS: ${{ steps.verify.outputs.cards }}
        with:
          script: |
            const body = [
              '## Lighting + Evidence scientific poster production', '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Overall: **${process.env.STATUS}**`,
              `Rendered posters: **${process.env.POSTERS || '0'}**`,
              `Eligible infographic assets: **${process.env.ELIGIBLE || 'not-run'}**`,
              `WordPress media uploaded/reused: **${process.env.UPLOADED || '0'} / ${process.env.REUSED || '0'}**`,
              `Public finished infographic cards: **${process.env.CARDS || 'not-run'}**`, '',
              'Media fields are normalized before rendering so WordPress schema variations cannot corrupt the deterministic poster lane.'
            ].join('\n');
            try { await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 220, body }); }
            catch (error) { core.warning(`Poster production report could not be posted: ${error.message}`); }
