name: Rebuild DTFSeeds Visual Site On Command

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordpress-visual-command.yml'
      - 'scripts/run-learning-v3-connected-production.sh'
      - 'scripts/prepare-learning-v3-owner-aware-publisher.mjs'
      - 'scripts/publish-wordpress-approved-visual-library.mjs'
      - 'scripts/publish-wordpress-gallery-v2.mjs'
      - 'scripts/fix-wordpress-home-release-visuals.mjs'
      - 'scripts/scrub-wordpress-low-quality-visuals-v2.mjs'
      - 'site/wordpress/visual-quality-policy.json'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: dtfseeds-learning-experience-v3
  cancel-in-progress: false

jobs:
  rebuild:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.issue.number == 46 &&
       github.event.comment.body == '/rebuild-site' &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WP_SITE_URL: https://dtfseeds.com
      WP_API_USERNAME: ${{ secrets.WP_API_USERNAME || secrets.WORDPRESS_USERNAME || secrets.WP_USERNAME }}
      WP_API_PASSWORD: ${{ secrets.WP_API_PASSWORD || secrets.WORDPRESS_APP_PASSWORD || secrets.WP_APPLICATION_PASSWORD }}
      BACKUP_ROOT: /tmp/dtf-approved-visual-rebuild
      LEARNING_V4_BACKUP_ROOT: /tmp/dtf-approved-visual-rebuild/learning-v4
      APPLY_SHARED_SHELL_V3: 'true'

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate approved-only production package
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_API_USERNAME:?WP_API_USERNAME is not configured in production}"
          : "${WP_API_PASSWORD:?WP_API_PASSWORD is not configured in production}"
          bash -n scripts/run-learning-v3-connected-production.sh
          node --check scripts/prepare-learning-v3-owner-aware-publisher.mjs
          node --check scripts/publish-wordpress-approved-visual-library.mjs
          node --check scripts/publish-wordpress-gallery-v2.mjs
          node --check scripts/fix-wordpress-home-release-visuals.mjs
          node --check scripts/scrub-wordpress-low-quality-visuals-v2.mjs
          node --check scripts/rebuild-wordpress-shared-shell-v3.mjs
          node --check scripts/flush-hostinger-litespeed-mcp.mjs
          node - <<'NODE'
          const policy=require('./site/wordpress/visual-quality-policy.json');
          if(Number(policy.schemaVersion)<3 || policy.mode!=='quarantine') throw new Error('Visual quality quarantine policy v3+ is required.');
          if(policy.replacementPolicy?.automaticKeywordMediaSelectionAllowed!==false) throw new Error('Automatic keyword media selection must remain disabled.');
          if(policy.replacementPolicy?.legacyInfographicReuseAllowed!==false) throw new Error('Legacy infographic reuse must remain disabled.');
          if(policy.replacementPolicy?.legacyAutomaticInfographicPublishingAllowed!==false) throw new Error('Legacy automatic infographic publishing must remain disabled.');
          if(policy.replacementPolicy?.imageLessFallbackPreferred!==true) throw new Error('Image-less fallback must remain preferred.');
          NODE
          grep -Fq 'function isApprovedLearningMedia(item)' scripts/prepare-learning-v3-owner-aware-publisher.mjs
          grep -Fq "if (slug.startsWith('dtf-strain-card-')) return false;" scripts/prepare-learning-v3-owner-aware-publisher.mjs
          ! grep -Fq 'node scripts/rebuild-wordpress-visual-site.mjs' .github/workflows/wordpress-visual-command.yml

      - name: Publish canonical Learning V3 transaction
        id: learning
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT" "$LEARNING_V4_BACKUP_ROOT"
          BACKUP_ROOT="$BACKUP_ROOT/learning" \
          LEARNING_V4_BACKUP_ROOT="$LEARNING_V4_BACKUP_ROOT" \
          bash scripts/run-learning-v3-connected-production.sh \
            | tee "$RUNNER_TEMP/approved-learning-rebuild.log"

      - name: Restore exact reviewed homepage release cards
        id: releases
        env:
          APPLY_HOME_RELEASE_VISUALS: 'true'
          BACKUP_ROOT: /tmp/dtf-approved-visual-rebuild/home-release-visuals
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/fix-wordpress-home-release-visuals.mjs \
            | tee "$RUNNER_TEMP/home-release-visuals.json"
          grep -Eq '"apply"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/home-release-visuals.json"

      - name: Publish clean Gallery V2
        id: gallery
        env:
          APPLY_GALLERY_V2: 'true'
          BACKUP_ROOT: /tmp/dtf-approved-visual-rebuild/gallery
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/publish-wordpress-gallery-v2.mjs \
            | tee "$RUNNER_TEMP/gallery-v2.json"
          grep -Fq '"storedVerification": "success"' "$RUNNER_TEMP/gallery-v2.json"

      - name: Publish approved-only Learning visual library
        id: library
        env:
          APPLY_APPROVED_VISUAL_LIBRARY: 'true'
          BACKUP_ROOT: /tmp/dtf-approved-visual-rebuild/library
          DTF_VISUAL_QUALITY_POLICY: ${{ github.workspace }}/site/wordpress/visual-quality-policy.json
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/publish-wordpress-approved-visual-library.mjs \
            | tee "$RUNNER_TEMP/approved-visual-library.json"
          grep -Fq '"storageVerification": "success"' "$RUNNER_TEMP/approved-visual-library.json"
          grep -Fq '"imageCount": 0' "$RUNNER_TEMP/approved-visual-library.json"

      - name: Restore approved V5 shared shell
        id: shell
        env:
          BACKUP_ROOT: /tmp/dtf-approved-visual-rebuild/shared-shell
          APPLY_SHARED_SHELL_V3: 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/rebuild-wordpress-shared-shell-v3.mjs \
            | tee "$RUNNER_TEMP/shared-shell-v5.json"

      - name: Final sitewide visual quarantine scrub
        id: scrub
        env:
          APPLY_VISUAL_SCRUB: 'true'
          DELETE_BANNED_MEDIA: 'true'
          SKIP_PUBLIC_VISUAL_VERIFICATION: 'true'
          DTF_VISUAL_QUALITY_POLICY: ${{ github.workspace }}/site/wordpress/visual-quality-policy.json
          BACKUP_ROOT: /tmp/dtf-approved-visual-rebuild/quarantine
        shell: bash
        run: |
          set -euo pipefail
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/scrub-wordpress-low-quality-visuals-v2.mjs \
            | tee "$RUNNER_TEMP/visual-quarantine.json"

      - name: Purge Hostinger LiteSpeed cache
        id: cache
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if node scripts/flush-hostinger-litespeed-mcp.mjs; then ok=1; break; fi
            [[ "$attempt" -lt 3 ]] && sleep $((attempt * 5))
          done
          [[ "$ok" -eq 1 ]] || { echo 'LiteSpeed cache purge failed after retries.' >&2; exit 1; }
          sleep 6

      - name: Verify clean visitor-facing visual system
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          blocked='(dtf-edu-|THC[-_ ]?C[0-9]{3}|THC[-_ ]?ENC[-_ ]?[0-9]{3}|Outdoor[-_ ]?[0-9]{2}|Cannabis[_ -]Plant[_ -]Anatomy[_ -]Infographic|Cannabis[_ -]Plant[_ -]Life[_ -]Cycle|Cannabis[_ -]Sex[_ -]Expression|Beneficial[_ -]Insects[_ -]and[_ -]Biological[_ -]Controls|Diagnosing[_ -]Deficiency[_ -]vs[_ -]Toxicity)'
          verify_page() {
            local path="$1" required="$2" file="$RUNNER_TEMP/approved-$(printf '%s' "$path" | tr '/' '_').html" ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -4 --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                --connect-timeout 20 --max-time 50 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
                "$WP_SITE_URL${path}?dtf_approved_rebuild=${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)" -o "$file"; then
                if grep -Fq "$required" "$file" && ! grep -Eqi "$blocked" "$file"; then ok=1; break; fi
              fi
              [[ "$attempt" -lt 8 ]] && sleep $((attempt + 2))
            done
            [[ "$ok" -eq 1 ]] || { echo "Approved visual verification failed on $path" >&2; grep -Eoi "$blocked" "$file" | head -30 >&2 || true; exit 1; }
            grep -Fq 'data-dtf-shell="header-v5"' "$file" || { echo "V5 shared header missing on $path" >&2; exit 1; }
          }
          verify_page '/' 'data-dtf-layout="home-v3"'
          verify_page '/learn/' 'data-dtf-layout="learn-v3"'
          verify_page '/gallery/' 'data-dtf-layout="gallery-visual-v2"'
          verify_page '/learn/infographics/' 'data-dtf-approved-visual-library="v1"'
          verify_page '/learn/plant-biology/' 'data-dtf-topic="plant-biology"'
          verify_page '/learn/genetics-breeding/' 'data-dtf-topic="genetics-breeding"'
          verify_page '/learn/ipm/' 'data-dtf-topic="plant-health-ipm"'

          library="$RUNNER_TEMP/approved-_learn_infographics_.html"
          ! grep -Eqi '<main[^>]+dtf-approved-visual-library[\s\S]*<img\b' "$library" || { echo 'Approved Visual Library contains unexpected image markup.' >&2; exit 1; }

          APPLY_VISUAL_SCRUB=false DELETE_BANNED_MEDIA=false SKIP_PUBLIC_VISUAL_VERIFICATION=false \
          DTF_VISUAL_QUALITY_POLICY="${GITHUB_WORKSPACE}/site/wordpress/visual-quality-policy.json" \
          BACKUP_ROOT=/tmp/dtf-approved-visual-rebuild/verify \
          node --import ./scripts/wordpress-ipv4-fetch-bootstrap.mjs scripts/scrub-wordpress-low-quality-visuals-v2.mjs \
            | tee "$RUNNER_TEMP/visual-quarantine-verify.json"
          echo 'outcome=success' >> "$GITHUB_OUTPUT"

      - name: Upload rollback and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtf-approved-visual-rebuild-${{ github.run_id }}
          path: |
            /tmp/dtf-approved-visual-rebuild
            ${{ runner.temp }}/approved-learning-rebuild.log
            ${{ runner.temp }}/home-release-visuals.json
            ${{ runner.temp }}/gallery-v2.json
            ${{ runner.temp }}/approved-visual-library.json
            ${{ runner.temp }}/shared-shell-v5.json
            ${{ runner.temp }}/visual-quarantine*.json
            ${{ runner.temp }}/approved-*.html
          if-no-files-found: warn
          retention-days: 30
