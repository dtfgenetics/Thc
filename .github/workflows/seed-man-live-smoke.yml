name: Seed Man Sprout Run Live Smoke

on:
  workflow_run:
    workflows: ["Deploy DTFSeeds Public Suite via WordPress V2"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Sprout Run live runtime
        shell: bash
        run: |
          set -euo pipefail

          bust="dtf_sprout_smoke=${GITHUB_RUN_ID}"
          index_body="$(mktemp)"
          index_headers="$(mktemp)"
          app_body="$(mktemp)"
          app_headers="$(mktemp)"
          trap 'rm -f "$index_body" "$index_headers" "$app_body" "$app_headers"' EXIT

          fetch_no_redirect() {
            local url="$1" body="$2" headers="$3" status
            status="$(curl -sS --retry 5 --retry-delay 3 \
              --output "$body" \
              --dump-header "$headers" \
              --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "${url}?${bust}")"
            if [[ "$status" != "200" ]]; then
              echo "Expected HTTP 200 from $url, received $status" >&2
              cat "$headers" >&2
              return 1
            fi
            if grep -Eiq '^location:' "$headers"; then
              echo "Refusing redirected Sprout Run asset: $url" >&2
              cat "$headers" >&2
              return 1
            fi
          }

          fetch_no_redirect 'https://dtfseeds.com/games/seed-man-platformer/' "$index_body" "$index_headers"
          grep -Fq '<h1>Sprout Run</h1>' "$index_body"
          grep -Fq 'id="seed-man-level"' "$index_body"
          grep -Fq '"id": "sprout-run"' "$index_body"
          grep -Fq '"requiredPickups": 8' "$index_body"
          grep -Fq '<script src="./app.js" defer></script>' "$index_body"
          if grep -Fq 'type="module"' "$index_body"; then
            echo 'Sprout Run regressed to a module-script dependency.' >&2
            exit 1
          fi

          fetch_no_redirect 'https://dtfseeds.com/games/seed-man-platformer/app.js' "$app_body" "$app_headers"
          node --check "$app_body"
          grep -Fq 'function readEmbeddedLevel()' "$app_body"
          grep -Fq 'function stepPlayer(' "$app_body"
          grep -Fq "const BEST_KEY = 'dtf-seed-man-best-v1';" "$app_body"
          if grep -Eq '^[[:space:]]*import[[:space:]]' "$app_body"; then
            echo 'Sprout Run app.js regressed to a browser module import.' >&2
            exit 1
          fi
          if grep -Fq "fetch('./data/level-01.json" "$app_body"; then
            echo 'Sprout Run app.js regressed to a runtime level fetch.' >&2
            exit 1
          fi

          echo 'Sprout Run live route and self-contained runtime passed.'
