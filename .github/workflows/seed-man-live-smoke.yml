name: Seed Man Sprout Run Live Smoke

on:
  workflow_run:
    workflows: ["Deploy DTFSeeds Public Suite via WordPress V2"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify expanded Sprout Run live runtime
        shell: bash
        run: |
          set -euo pipefail

          base='https://dtfseeds.com/games/seed-man-platformer/'
          release='20260830-r3'
          bust="dtf_sprout_smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          fetch_asset() {
            local rel="$1" body headers status type sep url
            body="$(mktemp)"
            headers="$(mktemp)"
            sep='?'
            [[ "$rel" == *'?'* ]] && sep='&'
            url="${base}${rel}${sep}${bust}"
            status="$(curl -sS --connect-timeout 10 --max-time 30 \
              --output "$body" \
              --dump-header "$headers" \
              --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$url")"
            type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers")"
            echo "${rel:-/} -> HTTP ${status} ${type:-unknown-content-type} bytes=$(wc -c < "$body")" >&2
            if [[ "$status" != '200' ]]; then
              echo "FAILED_ASSET=${rel:-/}" >&2
              head -c 500 "$body" >&2 || true
              rm -f "$body" "$headers"
              return 1
            fi
            if grep -Eiq '^location:' "$headers"; then
              echo "Unexpected redirect for ${rel:-/}" >&2
              cat "$headers" >&2
              rm -f "$body" "$headers"
              return 1
            fi
            cat "$body"
            rm -f "$body" "$headers"
          }

          html="$(fetch_asset '')"

          for marker in \
            '<h1>Sprout Run</h1>' \
            'Greenhouse Gauntlet' \
            'id="seed-man-level"' \
            '"schemaVersion": 2' \
            '"id": "sprout-run"' \
            '"worldWidth": 7800' \
            '"requiredPickups": 24' \
            '0 / 24' \
            'JUMP ×2' \
            '7 power-ups' \
            '3 checkpoints' \
            'name="dtf-sprout-release" content="20260830-r3"' \
            '<script src="./app.js?v=20260830-r3" defer></script>' \
            '<script src="./seed-man-production-art.js?v=20260830-r3" defer></script>' \
            '<script src="./input-guard-v1.js?v=20260830-r3" defer></script>' \
            'seed-man.css?v=20260830-r3'; do
            grep -Fq "$marker" <<<"$html" || { echo "Missing Sprout Run production marker: $marker" >&2; exit 1; }
          done

          for stale in \
            'collect all eight sprouts' \
            'Sprouts 0 / 8' \
            'Objective: collect all 8 sprouts' \
            'Original browser vertical slice'; do
            if grep -Fqi "$stale" <<<"$html"; then
              echo "Stale Sprout Run fingerprint still live: $stale" >&2
              exit 1
            fi
          done

          if grep -Fq 'type="module"' <<<"$html"; then
            echo 'Sprout Run regressed to a module-script dependency.' >&2
            exit 1
          fi

          app="$(fetch_asset "app.js?v=${release}")"
          printf '%s' "$app" > "$RUNNER_TEMP/sprout-app.js"
          node --check "$RUNNER_TEMP/sprout-app.js"
          for marker in \
            'moveSpeed: 270' \
            'jumpSpeed: 640' \
            'doubleJumpSpeed: 590' \
            'maxAirJumps: 1' \
            'speedBoostMultiplier: 1.35' \
            'jumpBoostMultiplier: 1.18' \
            'magnetRadius: 145' \
            'shieldInvulnerability: 1.05' \
            'function readEmbeddedLevel()' \
            'function stepPlayer('; do
            grep -Fq "$marker" <<<"$app" || { echo "Missing app.js production marker: $marker" >&2; exit 1; }
          done
          if grep -Eq '^[[:space:]]*import[[:space:]]' <<<"$app"; then
            echo 'Sprout Run app.js regressed to a browser module import.' >&2
            exit 1
          fi
          if grep -Fq "fetch('./data/level-01.json" <<<"$app"; then
            echo 'Sprout Run app.js regressed to a runtime level fetch.' >&2
            exit 1
          fi

          art="$(fetch_asset "seed-man-production-art.js?v=${release}")"
          printf '%s' "$art" > "$RUNNER_TEMP/sprout-production-art.js"
          node --check "$RUNNER_TEMP/sprout-production-art.js"
          for marker in \
            "seed-man-production-v1" \
            "seed-man-locked-v1" \
            "renderer: 'canvas2d-vector'" \
            "original: true" \
            'drawSeedMan = drawSeedManProduction'; do
            grep -Fq "$marker" <<<"$art" || { echo "Missing production-art marker: $marker" >&2; exit 1; }
          done

          guard="$(fetch_asset "input-guard-v1.js?v=${release}")"
          printf '%s' "$guard" > "$RUNNER_TEMP/sprout-input-guard.js"
          node --check "$RUNNER_TEMP/sprout-input-guard.js"

          css="$(fetch_asset "seed-man.css?v=${release}")"
          grep -Fq 'touch-controls' <<<"$css"

          level="$(fetch_asset 'data/level-01.json')"
          node -e '
            const level = JSON.parse(process.argv[1]);
            if (level.schemaVersion !== 2) throw new Error(`schemaVersion=${level.schemaVersion}`);
            if (level.worldWidth !== 7800) throw new Error(`worldWidth=${level.worldWidth}`);
            if (level.requiredPickups !== 24) throw new Error(`requiredPickups=${level.requiredPickups}`);
            if (!Array.isArray(level.pickups) || level.pickups.length !== 24) throw new Error(`pickups=${level.pickups?.length}`);
            if (!Array.isArray(level.powerups) || level.powerups.length !== 7) throw new Error(`powerups=${level.powerups?.length}`);
            if (!Array.isArray(level.checkpoints) || level.checkpoints.length !== 3) throw new Error(`checkpoints=${level.checkpoints?.length}`);
            if (!Array.isArray(level.hazards) || level.hazards.length !== 15) throw new Error(`hazards=${level.hazards?.length}`);
          ' "$level"

          echo 'Expanded Sprout Run live route, cache-proof assets, production Seed Man art, runtime, level data, controls, and release fingerprints passed.'