name: Seed Ascent production bootstrap

on:
  push:
    branches:
      - feat/seed-ascent-production

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seed-ascent-production
          fetch-depth: 0

      - name: Register Seed Ascent in production content
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          registry_path = Path('site/deployment/public-apps.json')
          registry = json.loads(registry_path.read_text())
          apps = registry['apps']
          if not any(app.get('id') == 'seed-ascent' for app in apps):
              entry = {
                  'id': 'seed-ascent',
                  'title': 'Seed Ascent',
                  'repository': 'dtfgenetics/Thc',
                  'sourcePath': 'site/public-route-patch/games/seed-ascent',
                  'canonicalDataPath': 'games/seed-ascent',
                  'route': '/games/seed-ascent/',
                  'runtime': 'static',
                  'status': 'ready-to-package',
                  'build': 'node games/seed-ascent/test/public-runtime.test.mjs',
                  'machineData': {
                      'mode': 'endless-platformer',
                      'doubleJump': True,
                      'persistentBestScore': True,
                      'touchControls': True,
                  },
                  'notes': 'Self-hosted responsive Canvas2D endless-climb game with procedural and bouncy platforms, gems, stompable pests, keyboard/pointer controls, corrected camera tracking, crossing-based landing collision, and local best-score persistence.'
              }
              insert_at = next((i + 1 for i, app in enumerate(apps) if app.get('id') == 'seed-man-platformer'), len(apps))
              apps.insert(insert_at, entry)
          registry['updated'] = '2026-08-30'
          registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n')

          hub_path = Path('site/public-route-patch/games/index.html')
          hub = hub_path.read_text()
          old_hero = '<strong>25</strong><span>playable browser games</span>'
          new_hero = '<strong>26</strong><span>playable browser games</span>'
          if old_hero in hub:
              if hub.count(old_hero) != 1:
                  raise SystemExit('unexpected Game Hub hero-count anchor count')
              hub = hub.replace(old_hero, new_hero, 1)
          elif new_hero not in hub:
              raise SystemExit('Game Hub playable-count anchor missing')

          seed_anchor = 'Play Seed Man →</a></article><article class="card"><span class="status">Play now</span><h3>THC Weekly Crossword'
          seed_card = 'Play Seed Man →</a></article><article class="card"><span class="status">Play now</span><h3>Seed Ascent</h3><p>Climb an endless canopy, collect gems, stomp pests, hit bounce platforms, and recover risky jumps with a double jump.</p><div class="pill-row"><span class="pill">Platformer</span><span class="pill">Double jump</span><span class="pill">Touch controls</span></div><a class="card-link" href="/games/seed-ascent/">Play Seed Ascent →</a></article><article class="card"><span class="status">Play now</span><h3>THC Weekly Crossword'
          if '/games/seed-ascent/' not in hub:
              if hub.count(seed_anchor) != 1:
                  raise SystemExit('Seed Man / Crossword insertion anchor missing or ambiguous')
              hub = hub.replace(seed_anchor, seed_card, 1)
          if '<!-- deployment-verification-marker: 25 playable browser games -->' not in hub:
              raise SystemExit('legacy deployment fingerprint must remain during this compatibility release')
          hub_path.write_text(hub)

          if '/games/seed-ascent/' not in hub_path.read_text():
              raise SystemExit('Seed Ascent is missing from Game Hub')
          if not any(app.get('id') == 'seed-ascent' and app.get('runtime') == 'static' and app.get('status') == 'ready-to-package' for app in registry['apps']):
              raise SystemExit('Seed Ascent registry contract is incomplete')
          PY

          node games/seed-ascent/test/public-runtime.test.mjs
          python3 -m json.tool site/deployment/public-apps.json >/dev/null

      - name: Commit production content changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/deployment/public-apps.json site/public-route-patch/games/index.html
          git diff --cached --check
          git commit -m 'Register Seed Ascent in production game suite'
          git push origin HEAD:feat/seed-ascent-production
